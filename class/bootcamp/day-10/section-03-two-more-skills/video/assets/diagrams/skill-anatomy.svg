<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="Skill 解剖：输入、步骤、输出、证据">
  <defs>
    <linearGradient id="sk-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="sk-tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.12)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.04)"/>
    </linearGradient>
    <pattern id="sk-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sk-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="sk-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
    <marker id="sk-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="470" fill="#ffffff"/>
  <rect width="1040" height="470" fill="url(#sk-dots)"/>
  <circle cx="978" cy="400" r="88" fill="rgba(13,148,136,.06)">
    <animate attributeName="r" values="88;104;88" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- header -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="36" y="12" width="6" height="20" rx="3" fill="#0d9488"/>
    <text x="52" y="28" font-size="15" font-weight="800" fill="#231f20">Skill 解剖 · 四件套</text>
    <text x="1004" y="28" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">SKILL ANATOMY</text>
  </g>

  <!-- description banner -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" transform="translate(50,42)">
    <rect width="940" height="62" rx="16" fill="url(#sk-teal)" filter="url(#sk-glow)"/>
    <text x="30" y="27" font-size="13" font-weight="800" fill="#fff">描述 · DESCRIPTION</text>
    <text x="30" y="48" font-size="11.5" fill="rgba(255,255,255,.88)">「给销售部生成周报初稿：读本周线索与商机表，产出三段式 markdown」——Agent 靠这段话决定选不选你</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <!-- INPUT -->
    <g transform="translate(50,134)" filter="url(#sk-sh)">
      <rect width="280" height="222" rx="16" fill="#fff"/>
      <rect x="24" y="20" width="118" height="26" rx="13" fill="rgba(35,31,32,.06)"/>
      <text x="83" y="37" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#231f20">输入 · INPUT</text>
      <g font-size="11" fill="rgba(35,31,32,.65)">
        <text x="26" y="76">参数表：</text>
        <text x="26" y="100" font-family="'SF Mono',Menlo,monospace" fill="#0d9488">month: 2026-07</text>
        <text x="26" y="122" font-family="'SF Mono',Menlo,monospace" fill="#0d9488">region?: 华东</text>
        <text x="26" y="156">类型 + 必填/可选 + 示例</text>
        <text x="26" y="180">坏输入怎么拒（见边界声明）</text>
      </g>
      <rect x="26" y="194" width="150" height="4" rx="2" fill="rgba(35,31,32,.10)"/>
    </g>

    <!-- STEPS -->
    <g transform="translate(380,134)" filter="url(#sk-sh)">
      <rect width="280" height="222" rx="16" fill="#fff"/>
      <rect x="24" y="20" width="118" height="26" rx="13" fill="rgba(35,31,32,.06)"/>
      <text x="83" y="37" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#231f20">步骤 · STEPS</text>
      <g font-size="11" fill="rgba(35,31,32,.65)">
        <text x="26" y="76">1. 查库取本周数据</text>
        <text x="26" y="100">2. 算环比与异常</text>
        <text x="26" y="124">3. 调模型写初稿</text>
        <text x="26" y="148">4. 按模板整形</text>
        <text x="26" y="182" fill="rgba(35,31,32,.45)">每步可观测：日志留痕</text>
      </g>
      <rect x="26" y="196" width="228" height="8" rx="4" fill="rgba(35,31,32,.08)"/>
      <rect x="26" y="196" width="228" height="8" rx="4" fill="url(#sk-teal)">
        <animate attributeName="width" values="0;228" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;.9;0" keyTimes="0;.9;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- OUTPUT (hot) -->
    <g transform="translate(710,134)">
      <rect x="-7" y="-7" width="294" height="236" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".35">
        <animate attributeName="opacity" values=".45;.12;.45" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect width="280" height="222" rx="16" fill="url(#sk-tint)" stroke="#0d9488" stroke-width="1.8" filter="url(#sk-sh)"/>
      <rect x="24" y="20" width="132" height="26" rx="13" fill="url(#sk-teal)"/>
      <text x="90" y="37" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#fff">输出 · OUTPUT</text>
      <g font-size="11" fill="rgba(35,31,32,.65)">
        <text x="26" y="76">产物：weekly-2026-07.md</text>
        <text x="26" y="108" font-size="12" font-weight="800" fill="#0d9488">+ 证据 · EVIDENCE</text>
        <text x="26" y="132">数据快照 / 用时 / 模型版本</text>
        <text x="26" y="166" fill="rgba(35,31,32,.45)">没证据的输出 ≈ 没发生过</text>
      </g>
      <rect x="26" y="186" width="172" height="22" rx="11" fill="rgba(13,148,136,.12)"/>
      <text x="112" y="201" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" letter-spacing="1" fill="#0f766e">OUTPUT + EVIDENCE</text>
    </g>

    <!-- arrows -->
    <path d="M336 246 H372" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#sk-arr)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M666 246 H702" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#sk-arr)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- footer -->
    <rect x="212" y="384" width="616" height="34" rx="17" fill="rgba(13,148,136,.10)"/>
    <text x="520" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Skill = 会写字的岗位说明书：写得越清楚，Agent 越选得对、跑得越稳</text>
    <text x="520" y="444" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.55)">它就是 MCP 的朴素版 —— 先学会封装，标准以后随换随接</text>
  </g>
</svg>
