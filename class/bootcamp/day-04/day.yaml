day: 4
project: 测试通过并完成第一次本地发布
project_brief: 学员承接 Day3 已由 @测试 接收的系统版本，先把 PRD 与交付合同翻译成 test-plan.md， 再亲手执行页面、接口、数据、错误、持久化与隐私测试。发现问题时生成 defect-log.md， 切换到
  @前端 或 @后端 按责任修复，再回 @测试 复测与回归。 测试通过后交给 @运维，确认 deployment-plan.md 后完成本地发布、健康检查和回退演练， 最后由 @产品经理 根据最初 PRD 完成最终验收。
