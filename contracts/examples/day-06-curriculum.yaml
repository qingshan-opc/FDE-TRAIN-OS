  - id: c3
    title: Prompt / Context / RAG / Fine-tune vs Prompt
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-06/section-03-prompt-context-rag/lesson.md
    content: '同学们，第三节四个词：Prompt、Context Engineering、RAG、Fine-tuning vs Prompting。第一天 你们解剖过 PM 提示词——今天升级到系统视角：不是写一段话，而是设计一次调用的视野。

      Prompt 工程是给模型的任务说明书：角色、背景、任务、约束、输出格式。PM Agent 提示词就是标准件——可迭代、可验收。坏 Prompt 的特征：没说清输出格式，没说清不许做什么。好 Prompt：工程师看完不用回来问第二遍，对吧。

      Context Engineering 是决定这次调用放什么进窗口。给少了——模型瞎编；给多了——它迷失在中间。驾驶舱摘要：该放 PRD 片段还是整份 DB Schema？放最新用户消息还是全历史？这是手艺，不是玄学，对吧。

      RAG 检索增强生成：先从资料库捞相关片段——向量库、关键词、企业 Wiki——再让模型基于片段回答。治幻觉的主流药方之一。流程：切块、嵌入、检索、拼进 Prompt、生成。你们驾驶舱基于本周数据生成摘要就是简化版 RAG 思想，对吧。

      Fine-tuning 改模型权重，贵、慢、持久；Prompting 改给模型的话，快、便宜。90% 场景先用后者。只有当你需要固定风格、固定格式、且 Prompt 怎么写都不稳，才考虑 Fine-tune。别一上来就我们要训一个模型——FDE
      先验收 Prompt 方案，对吧。

      收束：Prompt 是说明书，Context 是装填术，RAG 是外挂记忆，Fine-tune 是最后手段。下一节 Eval 和 Guardrails——怎么给 AI 出考卷、怎么拦越界，对吧。'
    practice: 完成标志：[ ] 能改一条「坏 Prompt」成「好 Prompt」（加格式+约束）；[ ] 说清 RAG 和「直接把整库塞进 Prompt」的区别；[ ] Fine-tune 何时才考虑（一句）。
    resource_ids:
    - dg-context-assembly
    - glossary
    quiz:
    - - Prompt 工程「四要素」不包括？
      - - 角色定位
        - GPU 型号
        - 输出格式
      - 1
      - 四要素：角色、背景、任务、格式——再加约束。
    - - Context Engineering 主要解决什么问题？
      - - 让模型更快
        - 决定这次调用放什么进窗口，避免给少瞎编/给多迷失
        - 替代 Fine-tuning
      - 1
      - 窗口有限——装填是手艺，不是玄学。
    - - RAG 的正确顺序是？
      - - 生成→检索→嵌入
        - 切块→嵌入→检索→拼 Prompt→生成
        - 检索→Fine-tune→生成
      - 1
      - 先捞相关片段再让模型基于片段回答。
    - - 90% 场景应该优先？
      - - Fine-tuning
        - Prompting（+RAG+Eval）
        - 换更大的模型
      - 1
      - Fine-tune 贵慢——Prompt 方案没过闸不升级。
