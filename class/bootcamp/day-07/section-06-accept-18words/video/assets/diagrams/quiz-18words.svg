<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="18 词抽测规则">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">18 词抽测：随机 12 题，对 12 过线</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">QUIZ · 18 WORDS</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="90" width="400" height="140" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="84" y="122" font-size="13" font-weight="800" fill="#231f20">18 词池 · 六大主题</text>
<rect x="84" y="140" width="168" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="168.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">生态四层</text>
<rect x="264" y="140" width="168" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="348.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Token · 幻觉</text>
<rect x="84" y="174" width="168" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="168.0" y="191.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Prompt · RAG</text>
<rect x="264" y="174" width="168" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="348.0" y="191.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Eval · 护栏</text>
<rect x="84" y="208" width="168" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="168.0" y="225.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Agent · MCP</text>
</g>
<path d="M468 160 L540 160" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="548" y="90" width="200" height="140" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="648" y="140" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">随机 12 题</text>
<text x="648" y="170" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">考理解，不考背诵</text>
<text x="648" y="200" font-size="12" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">12 / 18</text>
</g>
<path d="M756 160 L826 160" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="826" y="82" width="172" height="156" rx="26" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="834" y="90" width="156" height="140" rx="18" fill="url(#tlg)" filter="url(#glow)"/>
<text x="912" y="152" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">对 12 题</text>
<text x="912" y="182" font-size="12" fill="rgba(255,255,255,.88)" text-anchor="middle">过线</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="262" width="600" height="40" rx="20.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="286.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">只能背定义，说明要回看讲解图 —— 考的是理解</text></g>
</svg>
