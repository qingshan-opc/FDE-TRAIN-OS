  capsules:
  - id: c1
    title: 架构师干什么：在约束里做取舍
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-02/section-01-architect-role/lesson.md
    content: '【抛问题】

      同学们，先回答我一个问题：最好的架构长什么样？——这个问题本身就是错的。今天十五分钟后，你要能说出它错在哪。


      【讲取舍】

      架构师这个词听起来很高深。人话讲——「就是在限制条件下拍板的人」。你手里永远有四张牌：人、钱、时间、运维能力。方案不是选出来的，是被这四张牌「逼」出来的。


      【类比】

      想想装修。装修不是选最贵的材料，是按预算和居住人数定方案。一个人住，开间加电磁炉就够了；三代同堂，两个卫生间是刚需。「没人问哪种装修最好，只问哪种适合我家。」


      【点题】

      所以记住——「没有最好的架构，只有最合适的架构」。百万用户的架构搬到 200 人的周报助手上，不是豪华，是灾难。


      【引 ADR】

      最后留个钩子：AI 十秒就能给你一版架构图，那架构师还剩什么价值？剩「为什么」。把「为什么选它、放弃了什么」写下来，这叫 ADR，架构决策记录。下午你亲手写三条。


      【带走的话】

      带走一句话——「架构师的第一课：先数约束，再谈方案。」'
    practice: 完成标志：能不看笔记说出四类约束；PRD.md 底部新增「我看到的约束」段，≥3 条；能向同伴解释 ADR 记的是「为什么」而不是「是什么」。
    resource_ids:
    - tk-readme
    tools:
    - name: 约束清单便签
      note: 团队 / 预算 / 时间 / 运维——取舍先列约束
    - name: ADR 一句话口诀
      note: 每个重要决定：背景 / 决策 / 理由 / 后果
    quiz:
    - - 同事说「我们要用业界最好的架构」，这句话错在哪？
      - - 架构没有绝对最好，只有是否匹配约束
        - 他应该说出具体技术栈名称
        - 最好的架构要等用户量大了再选
      - 0
      - 架构是约束下的取舍，脱离人/钱/时间/运维谈「最好」没有意义。
    - - ADR（架构决策记录）最核心记录的是什么？
      - - 为什么选择它、放弃了什么
        - 系统一共有几个模块
        - 每个接口的请求参数
      - 0
      - ADR 的灵魂是「为什么」——决策可被后人复审，而不是只留结论。
  - id: c2
    title: 四层架构与前后端分离
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-02/section-02-four-layer/lesson.md
    content: '【抛问题】

      同学们，一个 AI 应用拆开看，里面到底有几个「器官」？今天给你一张图，明天后天你都靠它定位。


      【四层】

      四层。第一层，「前端」——你眼睛看到的部分，表单、按钮、页面。第二层，「接口」，也叫 API——前后端怎么对话。第三层，「数据库」——数据住哪。第四层，「模型」——谁动脑子。你的周报摘要，就是它写的。


      【类比】

      前后端什么关系？想想餐厅。「厨房和前厅是分开的，只凭菜单交流。」服务员不用会炒菜，厨师不用会招呼客人。菜单在，谁也不依赖谁。这份菜单，就是接口。


      【红利】

      为什么要分？为了——「换内脏不换脸」。数据库换了，页面不动；模型换了，页面不动；页面重做皮肤，后端不动。分层不是装专业，是给未来的自己留退路。


      【AI 时代】

      注意，模型层是 AI 时代的新器官。它像随叫随到的实习生，能干，但会犯错——所以架构上要把它隔开，出错能降级。


      【带走的话】

      带走一句话——「四层各司其职，接口就是菜单。」'
    practice: 完成标志：四层映射表每格非空；能说出「接口稳定」是换内脏不换脸的前提；追问回答正确：换模型只动模型层（及其封装），前端、数据库不动。
    tools:
    - name: 四层架构口诀卡
      note: 前端看 · 接口传 · 数据库存 · 模型想
    - name: 「换内脏不换脸」案例卡
      note: 分层红利的最小例子
    quiz:
    - - 前后端分离里「菜单」指的是什么？
      - - 前后端之间的接口（API）约定
        - 前端页面的导航栏
        - 数据库的表结构
      - 0
      - 前后端只凭接口约定交流，接口稳定才能互不影响地各自演进。
    - - 把模型从 A 换成 B 时，哪几层原则上不用动？
      - - 前端和数据库
        - 接口和前端
        - 数据库和模型
      - 0
      - 分层红利是换内脏不换脸：模型被封装隔离，接口不变则前端、数据库都无感知。
  - id: c3
    title: 架构选型：单体、微服务、Serverless 怎么选
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-02/section-03-arch-selection/lesson.md
    content: '【抛问题】

      同学们，单体、微服务、Serverless——三个词听着吓人。其实它们是三种「住法」。听完这节课，你要能给自己的项目「选房」。


      【类比】

      「单体，一套房子」——所有功能住一个程序里，一起部署。微服务，一个小区——拆成一堆独立小服务，各管一摊，但要请物业。Serverless，「租房不住房」——不写服务器只写函数，平台按调用次数收钱。


      【四问】

      怎么选？问四个问题：团队几个人？预期多少人用？迭代多快？出事谁修？「少于五个人，微服务基本出局」——不是它不好，是你养不起那个物业。


      【默认原则】

      记住这条纪律——「小团队从最简单的单体开始」。微服务解决的是人多到互相踩脚的问题；你一个人加 AI，踩不到任何人。


      【落到周报助手】

      套到你的周报助手：一个人、三十个用户、天天改、没人运维。答案几乎是送分题——单体，否决微服务，理由写进 ADR。什么信号出现再拆？用户涨十倍、团队过八人。「为假想中的规模过度设计，是小团队最常见的死法。」


      【带走的话】

      带走一句话——「先住得起，再谈住得好。」'
    practice: 完成标志：四问表格全部填写，数字具体（不写「可能很多人」）；初选与否决各一句，理由引用四问中的具体约束；能说出至少一个「未来重新评估」的演进信号。
    resource_ids:
    - cs-arch
    tools:
    - name: 「最简单的可行架构」原则卡
      note: 小团队默认单体；出现明确信号再演进，不为想象的未来付复杂度
    quiz:
    - - 3 人团队、内部 200 用户、无专职运维，默认应选？
      - - 单体
        - 微服务
        - Serverless 全家桶
      - 0
      - 小团队从最简单的可行架构开始；微服务的维护成本会吃掉全部人力。
    - - 什么时候应该重新评估「单体拆微服务」？
      - - 用户量或团队规模出现数量级增长等明确信号
        - 上线第一天就预留拆分
        - 听说大厂都在拆的时候
      - 0
      - 演进靠信号驱动，不为假想中的规模提前过度设计。
  - id: c4
    title: 实战：用架构师提示词写下你的前三条 ADR
    minutes: 35
    form: 实战
    content_ref: class/bootcamp/day-02/section-04-hands-on-adr/lesson.md
    content: '【抛问题】

      同学们，给你一份 80 行的提示词，你怎么知道它好不好、会不会用？——像读合同一样读它。今天带你们解剖一遍。


      【解剖】

      打开架构师提示词。开头第一句，「角色定位」——12 年经验的架构师，这决定了回答的水位。往下，「核心任务」，它的职责边界。再往下，「关键输入」——从 PRD.md 读需求。看到没有，「这就是为什么你昨天的 PRD 必须写好」：上游的交付物，就是下游的燃料。最后是「关键输出」和协作说明——它在流水线的第几棒。


      【节奏】

      注意它工作流程的第一条——「先提问澄清约束，再动笔」。好提示词自己会反问你。它问团队、问流量、问运维，你就拿第三节填的四问回答它。「别要它一步到位，对话才是工作方式。」


      【验收】

      产出三样东西：架构风格加否决理由、四层分层图、三条 ADR。每条 ADR 四要素——背景、决策、理由、后果。「AI 生成不等于合格」，理由没引用你的真实约束，就让它重写。记住口诀：不手改产物，改约束重新生成。


      【带走的话】

      带走一句话——「提示词是合同，ADR 是签字。」'
    practice: 完成标志：`architecture.md` 存在于工作区，包含架构风格、分层图、3 条 ADR；文中出现「ADR」与「理由」，且否决方案写明否决原因；自检表 4 行全部打勾，无编造约束。
    resource_ids:
    - tk-arch
    tools:
    - name: ADR 四格模板
      note: 背景 / 决策 / 理由 / 后果，每条一页
    quiz:
    - - 架构师提示词工作流程的第 1 条是什么？
      - - 先提问澄清关键约束，再做设计
        - 先画分层图，再补文字
        - 直接生成 architecture.md 初稿
      - 0
      - 好提示词自己先反问约束——方案是被约束逼出来的，不是凭空生成的。
    - - AI 生成的 architecture.md 理由写的是「假设团队 5 人」，但你只有 1 人，该怎么办？
      - - 指出错误约束，补充真实情况让它重写
        - 手动把 5 改成 1 就交
        - 忽略，反正是细节
      - 0
      - 不手改产物、改约束重新生成——编造的约束是幻觉在文档里的形态。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '你现在是我的架构设计搭档。请先把 /course-assets/resources/prompt-toolkit/Architect_Agent_Prompt.md 整份作为你的角色设定（如无法读取文件，让我粘贴给你）。

        背景：FDE 训练营 Day 2，我已在 Day 1 完成「部门周报助手」的 PRD.md（在工作区中）。昨天我定义了做什么，今天我要决定怎么搭。

        任务：先读 PRD.md，然后严格按你的工作流程执行——

        1. 先向我澄清 3 个约束问题：团队规模与能力、预期用户量与并发、运维条件（我没回答前不要动笔）；

        2. 基于我的回答生成 architecture.md，必须包含：架构风格选择 + 至少一个被否决方案及否决理由、四层分层图（前端/接口/数据库/模型，文字或 Mermaid）、3 条 ADR（每条含背景/决策/理由/后果）；

        3. 默认推荐最简单的可行架构，理由必须引用我给出的真实约束，禁止编造。

        完成后请自检：每条理由是否都能追溯到我回答的约束？

        '
      checklist:
      - 已把架构师提示词整份粘进本机 AI 工具
      - 已回答 AI 的 3 个澄清问题（团队/流量/运维），数字具体
      - architecture.md 已生成：风格 + 否决理由 + 分层图 + 3 条 ADR
      - 逐条核对 ADR 理由，无编造约束
      - 与 Agent Lab 版本对比过一次，记录差异
      suggested_questions:
      - 为什么你推荐单体而不是微服务？请引用我的约束回答。
      - ADR-002 数据库选型里，什么信号出现时要推翻这个决策？
      - 如果把预期用户量从 30 人改成 3 万人，架构会怎么变？
      template_resource_id: tk-arch
  - id: c5
    title: 验收：快测 + 架构决策过闸
    minutes: 15
    form: 验收
    content_ref: class/bootcamp/day-02/section-05-accept/lesson.md
    content: '【定调】

      同学们，到了今天的最后一道闸。先说清楚——「这个闸不卡文档厚度，卡『为什么』」。


      【快测】

      六道题，覆盖今天五节。没有一道靠背，全是理解：约束怎么逼出方案、四层各管什么、四问怎么问、提示词为什么先反问。「会就是会，蒙不对。」


      【过闸】

      文档三条硬标准：架构风格有理由，理由必须引用真实约束；三条 ADR 三要素齐全；否决方案写清楚为什么不要。然后我会随机问你一句——「你的周报助手为什么不是微服务？」三十秒，用约束回答。答不出，回去补 ADR。


      【衔接】

      别把今天的文档当作业交完就完。明天你做前端，前端提示词读的就是今天的分层图和模块划分。「今天的骨架，是明天的地基。」


      【带走的话】

      带走最后一句话——「架构师的价值不在图里，在理由里。」'
    practice: 完成标志：快测 ≥4/6，错题已回查；architecture.md 三标准全过：风格有理由、ADR 三要素齐、否决方案写明；口头抽问通过（同伴打勾）；Day 3 备忘已写。
    tools:
    - name: 架构过闸清单
      note: 风格有理由 · ADR 三要素齐 · 否决方案写明
    - name: 快测范围卡
      note: 考点全部来自今天前五节
    quiz:
    - - 过闸时「架构风格有理由」的合格标准是？
      - - 理由引用了团队/流量/运维等真实约束
        - 理由里出现了「简单」二字
        - 理由超过 200 字
      - 0
      - 「简单」是性质不是理由；合格理由必须让约束出场。
    - - 今天的 architecture.md 在训练营里的下一站是？
      - - 作为 Day 3 前端设计的输入
        - 存档后不再使用
        - 交给运维部署
      - 0
      - 交付物逐日继承：今天的骨架是明天前端的地基。
quiz:
  pass_rate: 0.67
  questions:
  - q: 架构师做决策时首先要做的是什么？
    options:
    - 数清约束：人、钱、时间、运维能力
    - 调研最新的技术趋势
    - 画出完整的系统架构图
    answer: 0
    explain: 方案是被约束逼出来的——先数约束，再谈方案。
  - q: ADR 与一般技术文档最大的区别是什么？
    options:
    - 它记录「为什么选、放弃了什么」，可复审
    - 它必须用英文写
    - 它只记录最终结论，方便阅读
    answer: 0
    explain: ADR 的灵魂是决策的理由与后果，不是结论本身。
  - q: 「换内脏不换脸」成立的前提是什么？
    options:
    - 层与层之间的接口保持稳定
    - 使用同一种编程语言
    - 每层的代码量差不多
    answer: 0
    explain: 接口（菜单）稳定，各层才能独立替换、互不干扰。
  - q: 1 人团队、30 个内部用户、需求每周变、没人专职运维——架构选型的默认答案是？
    options:
    - 单体，否决微服务并写明理由
    - 微服务，为未来规模预留
    - Serverless，因为完全不用运维
    answer: 0
    explain: 四问全部指向最简单的可行架构；微服务解决的是人多踩脚的问题。
  - q: 使用架构师提示词时，正确的节奏是？
    options:
    - 让它先澄清约束，回答后再让它生成
    - 一次性要完整文档，减少来回
    - 先让它写代码，再补文档
    answer: 0
    explain: 先澄清再动笔——约束给得越具体，产出越准。
  - q: 你的周报助手上线后用户从 30 人涨到 3000 人，架构师应该？
    options:
    - 按预案的演进信号重新评估对应 ADR
    - 立刻全量重写为微服务
    - 什么都不用做，架构一次到位
    answer: 0
    explain: 演进靠信号驱动：信号出现，复审当初写下的决策，而不是冲动重写。
