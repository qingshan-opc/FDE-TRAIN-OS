  - id: c1
    title: 把需求变成一张可执行检查清单
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-04/section-01-backend-role/lesson.md
    content: '同学们好。医生体检前会先开检查单，做项目也一样。不能打开页面随便点几下，就说“看起来没问题”。


      一条合格的检查项要有三样内容：怎么操作，应该看到什么，实际看到了什么。例如：金额填负数后点击提交；应该不能提交，并提示金额必须大于零；实际结果等操作时填写。


      检查项不是凭空编出来的，主要来自两个地方。第一，第一天需求文档里的通过标准。第二，第三天发现过的数据问题。以前写得越具体，今天越容易检查。


      检查要覆盖三类情况：正常完成主流程，走驳回或修改等不同分支，输入空白、负数、超长内容等异常情况。


      判断清单是否合格有一个简单办法：交给一个完全没做过这个项目的人，他照着文字也能完成相同操作，得到相同判断。


      记住这句话：**检查清单就是项目的体检单；步骤能执行，结果能判断，每一条都要有来源。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@测试工程师 Agent'
      note: 本节交付：至少 10 条测试用例
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 哪一条是合格的检查项？
      - - 检查提交功能是否正常
        - 金额填负数后提交，应该被阻止并说明金额必须大于零
        - 随便点几下，感觉页面没问题
      - 1
      - 合格检查项必须让任何人都能照着操作，并明确判断结果。
    media:
    - kind: video
      title: 口播课件 · 第 1 节
      object_key: documents/shared/course-media/day04-c1-backend-role.mp4
      poster_key: documents/shared/course-media/day04-c1-backend-role-poster.jpg
      duration_sec: 69
    knowledge_cards:
    - id: d4l1-k1
      term: 每项检查都能执行
      plain: 写清怎样操作、应该看到什么和实际看到什么，不能只写“检查一下”。
    - id: d4l1-k2
      term: 检查内容有来源
      plain: 主要来自需求文档的通过标准，以及前一天真实发现过的数据问题。
    - id: d4l1-k3
      term: 正常和异常都要覆盖
      plain: 既要走完整主流程，也要检查不同分支、空白、负数和超长内容。
    memory_sentence: 检查清单就是项目的体检单；步骤能执行，结果能判断，每一条都要有来源。
    local_prep:
      codex_prompt: '@测试工程师 Agent 请根据已批准的需求，把“怎样算做对了”整理成一份可亲手执行的检查清单。每项只写我该做什么和应该看到什么，并覆盖正常、填错和没有数据的情况。先让我审核清单，不要替我执行或填写通过。'
      checklist:
      - 至少十条并覆盖三类场景
      - 每条有明确步骤和可判断预期
      - 可追溯到 PRD
      - 包含看板与列表核对
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 亲手操作系统，记录真实问题
    minutes: 30
    form: 实操
    content_ref: class/bootcamp/day-04/section-02-api-design/lesson.md
    content: '清单写好了，接下来学员自己就是检查员。AI 可以帮你整理，但不能替你点击页面、输入内容和观察结果。


      执行时记住三个字：照、记、判。严格照步骤操作；每做完一条马上记录；结果只能是通过、不通过或被其他问题挡住，不能写“基本通过”“应该没问题”。


      先走最重要的完整流程。如果提交、保存、列表、详情和看板都走不通，先不要忙着查边角功能。主流程通过后，再查不同分支和异常输入。


      页面弹出“提交成功”也不能立刻判通过。要去列表里确认记录出现，刷新后还在，详情内容一致。检查的是事实，不是页面说了什么。


      发现问题先记录，不要边查边修。把检查时段和修复时段分开，才不会弄乱哪些已经查过。


      记住这句话：**照着做、马上记、明确判；检查的是事实，不是页面自己说的话。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: 学员亲测 → @测试工程师 Agent 整理
      note: 本节交付：执行矩阵 + 真实缺陷报告
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 页面弹出“提交成功”，是否可以立刻判断这一项通过？
      - - 可以，成功提示就是最终事实
        - 不可以，还要确认记录已保存、列表出现并且刷新后仍在
        - 可以，只要 AI 也说成功
      - 1
      - 页面提示只是一句话，真实数据变化才是检查对象。
    media:
    - kind: video
      title: 口播课件 · 第 2 节
      object_key: documents/shared/course-media/day04-c2-api-design.mp4
      poster_key: documents/shared/course-media/day04-c2-api-design-poster.jpg
      duration_sec: 64
    knowledge_cards:
    - id: d4l2-k1
      term: 严格照步骤操作
      plain: 不跳步骤、不凭感觉，保证检查结果可以被另一个人重复得到。
    - id: d4l2-k2
      term: 做完马上记录
      plain: 每一项立即标通过、不通过或被挡住，不能全部做完后靠记忆补写。
    - id: d4l2-k3
      term: 检查事实而非提示
      plain: 页面说提交成功还不够，必须确认记录真的保存、出现并且刷新后还在。
    memory_sentence: 照着做、马上记、明确判；检查的是事实，不是页面自己说的话。
    local_prep:
      codex_prompt: '@测试工程师 Agent 请带我亲手执行检查清单。一次只给我一个操作，等我告诉你实际看到什么，再记录通过或问题。没有执行的必须写“未检查”。发现问题时帮我用大白话写清怎样重现、正确结果和实际结果，但不要直接改程序。'
      checklist:
      - 用例都有真实执行状态
      - 缺陷与实际项目一致
      - 重现步骤足够他人复现
      - 学员至少复核一次严重度判断
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 把问题交给最合适的 AI 员工修复
    minutes: 30
    form: 实操+交接
    content_ref: class/bootcamp/day-04/section-03-database-design/lesson.md
    content: '“详情页有点怪”不是一份能修的问题报告。合格报告要写清：怎样一步步看到问题，本来应该怎样，实际发生了什么。


      描述时只写亲眼看到的事实。可以写“页面显示错误”，不要把“可能是数据仓库坏了”当成事实。猜测可以单独标注，避免 AI 顺着错误方向修改。


      然后缩小范围。换一条数据还会出错吗？刷新后还会吗？每次都出错还是偶尔发生？这些信息越清楚，AI 越容易一次找准原因。


      页面显示、按钮和跳转问题，通常交给页面工程师；保存、查询和业务规则问题，通常交给数据工程师。拿不准时，可以让项目经理先帮助判断归属，但不能让它自己把所有问题都修了。


      修复要求必须包含现象、操作步骤、目标结果和重新检查的方法，并要求 AI 说明改了哪里、为什么会错。


      记住这句话：**步骤、应该怎样、实际怎样，三样不齐不动手；报告越具体，AI 修改越准确。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@责任工程师'
      note: 本节交付：修复单、修复提交与根因说明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - “详情页有点怪，请修一下”是不是合格的问题报告？
      - - 是，AI 应该自己猜出问题
        - 不是，它缺少操作步骤、应该结果和实际结果
        - 是，只要语气足够严厉
      - 1
      - 模糊描述会让 AI 来回猜测，具体事实才能帮助它定位原因。
    media:
    - kind: video
      title: 口播课件 · 第 3 节
      object_key: documents/shared/course-media/day04-c3-database-design.mp4
      poster_key: documents/shared/course-media/day04-c3-database-design-poster.jpg
      duration_sec: 70
    knowledge_cards:
    - id: d4l3-k1
      term: 问题报告写清三件事
      plain: 说明怎样看到问题、本来应该怎样、实际发生了什么。
    - id: d4l3-k2
      term: 事实和猜测分开
      plain: 写亲眼看到的结果，原因猜测可以标注，但不能把猜测当成事实。
    - id: d4l3-k3
      term: 交给合适岗位处理
      plain: 页面显示问题交页面工程师，保存和规则问题交数据工程师，再按原步骤检查。
    memory_sentence: 步骤、应该怎样、实际怎样，三样不齐不动手；报告越具体，AI 修改越准确。
    local_prep:
      codex_prompt: '@测试工程师 Agent 请根据我选中的问题，先用大白话告诉我应该交给前端还是后端，再生成一句能直接复制的修复任务。等我把修复结果带回来后，请带我重新检查；不要替开发岗位修改程序，也不要提前写“复查通过”。'
      checklist:
      - 每张修复单四要素齐全
      - 派给正确责任岗位
      - 学员复测失败用例和至少一条相关用例
      - 根因和修改范围写入记录
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 修完重新检查，确认不再添加功能
    minutes: 25
    form: 实操+验收
    content_ref: class/bootcamp/day-04/section-04-hands-on-api-db/lesson.md
    content: '修掉一个问题不难，难的是保证没有把别的地方弄坏。每次修改后，要检查三圈。


      第一圈，重新走一遍原来出现问题的步骤，确认它真的好了。第二圈，检查同一部分的相关功能。第三圈，如果改动影响公共内容，就把提交到看板的主流程完整走一遍。


      不要只看 AI 说“修复完成”，还要追问根本原因和修改范围。把报错文字藏起来不叫修复，手动改一条数据也不能解决下一次同样的问题。


      所有严重问题解决并重新检查后，项目进入交付前的稳定阶段：从现在开始不再增加新功能，只处理已经记录的问题。新的好想法先放进以后再做清单，不能临时插队。


      记住这句话：**修原因，不遮现象；修完必须重新检查，准备交付时先停止添加功能。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@测试工程师 Agent + 学员批准'
      note: 本节交付：验收清单 + 功能冻结声明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - AI 只修改了一行内容，是否可以不重新检查？
      - - 可以，一行内容不可能影响其他地方
        - 不可以，影响大小取决于修改位置，仍要检查相关功能
        - 可以，只要页面还能打开
      - 1
      - 很小的修改也可能碰到公共内容，修完必须用实际操作重新确认。
    media:
    - kind: video
      title: 口播课件 · 第 4 节
      object_key: documents/shared/course-media/day04-c4-hands-on-api-db.mp4
      poster_key: documents/shared/course-media/day04-c4-hands-on-api-db-poster.jpg
      duration_sec: 58
    knowledge_cards:
    - id: d4l4-k1
      term: 修原因不遮现象
      plain: 要求 AI 解释为什么会错、改了哪里，不能只把错误提示藏起来。
    - id: d4l4-k2
      term: 修完检查三圈
      plain: 重走原问题、检查同一部分、必要时再走完整主流程。
    - id: d4l4-k3
      term: 交付前停止加功能
      plain: 严重问题解决后不再临时插入新想法，只处理已记录问题。
    memory_sentence: 修原因，不遮现象；修完必须重新检查，准备交付时先停止添加功能。
    local_prep:
      codex_prompt: '@测试工程师 Agent 请带我重新检查已修复的问题，并顺手检查相关功能有没有被带坏。一次只检查一项，按我的真实观察记录结果。最后汇总哪些通过、哪些没通过；驾驶舱数字必须和真实记录对得上。等我批准后才能宣布停止加新功能。'
      checklist:
      - 四类验收项都有证据
      - 看板数据可追溯
      - 未通过项未被隐藏
      - 冻结由学员明确宣布
      - 冻结后没有新增功能
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 整理能够证明项目质量的材料
    minutes: 20
    form: 实操+验收
    content_ref: class/bootcamp/day-04/section-05-accept/lesson.md
    content: '体检结束后要有报告，项目检查结束后也要留下别人看得懂的质量材料。


      材料分四块。第一，检查范围：查了什么，哪些没有查。第二，执行数字：总共多少条，通过多少条，未通过多少条。第三，问题清单：发现了多少，修好了多少，还剩哪些。第四，当前结论：主流程是否通过，剩余问题是否影响交付。


      没有检查手机端，就明确写没有检查；没有做大量用户同时使用的验证，也要写清楚。没有覆盖的内容写在纸面上叫专业，被别人现场发现却从未说明，才叫事故。


      结论要和实际检查范围匹配。只做了有限检查，就不能写“已经完成全部测试、可以正式上线”。


      最后让一个不懂技术的人读一遍。如果他能看懂系统现在能不能交、还有什么风险，这份材料才真正有用。


      记住这句话：**质量材料里最值钱的是诚实的坏消息；问题写清楚是专业，藏起来才是风险。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：报审材料清单与 v0.9
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 没有检查手机上的显示效果，质量材料中应该怎样写？
      - - 不提这件事，让材料看起来更完整
        - 明确写“本次没有检查手机端”
        - 直接写手机端已经通过
      - 1
      - 未覆盖内容写在材料里是诚实边界，被现场发现才会损害可信度。
    media:
    - kind: video
      title: 口播课件 · 第 5 节
      object_key: documents/shared/course-media/day04-c5-accept.mp4
      poster_key: documents/shared/course-media/day04-c5-accept-poster.jpg
      duration_sec: 70
    knowledge_cards:
    - id: d4l5-k1
      term: 先写检查范围
      plain: 明确哪些内容已经检查、哪些没有检查，先划清这份结论的边界。
    - id: d4l5-k2
      term: 用真实数字说结果
      plain: 写清检查总数、通过数、未通过数，以及问题发现和修复数量。
    - id: d4l5-k3
      term: 剩余问题必须公开
      plain: 每个未解决问题说明影响，不能为了好看从材料里删掉。
    memory_sentence: 质量材料里最值钱的是诚实的坏消息；问题写清楚是专业，藏起来才是风险。
    local_prep:
      codex_prompt: '@项目经理 Agent 请只整理项目里真实存在的成果，带我逐项核对需求、页面样稿、四个页面、真实数据、检查记录和问题修复。一次核对一类，找不到就写“缺失”，不能编造。全部核对后整理成交付材料清单，等我批准功能冻结。'
      checklist:
      - 七类证据均可打开
      - 状态与真实执行一致
      - 版本标记对应冻结版
      - 能口述功能、缺陷和 Week2 AI 边界
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 测试用例的主要来源是什么？
    options:
    - 测试工程师感觉
    - PRD 验收标准和接口契约
    - 页面颜色
    answer: 1
    explain: 测试从已经批准的标准倒推。
  - q: 预期结果写“正常显示”为什么不合格？
    options:
    - 不够长
    - 无法客观判断通过或失败
    - 没有截图
    answer: 1
    explain: 预期必须具体可判定。
  - q: Agent 说测试通过能否作为通过证据？
    options:
    - 能
    - 不能，必须有真实执行记录
    - 只有前端可以
    answer: 1
    explain: 测试结论来自执行证据。
  - q: 好缺陷报告最重要的是什么？
    options:
    - 情绪强烈
    - 别人能按步骤稳定重现
    - 标题很长
    answer: 1
    explain: 可重现才能被定位、修复和复测。
  - q: 修复后为什么还要测试相关用例？
    options:
    - 为了增加文件
    - 防止修好 A 又破坏 B
    - 为了改变 PRD
    answer: 1
    explain: 相关功能可能被同一处修改影响。
  - q: “请把 Bug 修好”缺少什么？
    options:
    - 现象、步骤、目标和验收口径
    - 技术框架介绍
    - 市场分析
    answer: 0
    explain: 可执行修复单需要具体上下文。
