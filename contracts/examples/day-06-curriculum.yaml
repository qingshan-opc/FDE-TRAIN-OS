learn:
  lingzhi_tags:
  - camp:v0.7
  - day:6
  - project:role-week
  estimated_minutes: 150
  require_capsules: true
  capsules:
  - id: c1
    title: 互联网地图：技术浪潮和你有什么关系
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-06/section-01-worldview-plain/lesson.md
    content: '同学们，大家好，同学们，我是你们的404老师，今天这个课呢，咱们先不动手写东西，先讲一下就是咱们这个互联网的发展史。嗯，毕竟以后大家可能要进入到这I行业嘛，那必须要了解，就是这个时代它是一步一步怎么走过来的，你才知道你现在站在哪，对吧。

      第一个呢，是上世纪九十年代。就是计算机刚出来的那个年代，那时候一台电脑都还很大，大家应该小时候有见过那种大头的计算机，就是那个头特别大的那种，大家可以看下屏幕。我不知道咱们这边零零后有没有见过啊，反正后面的话随着显示器的发展都逐渐变成液晶屏了，关于这两个显示屏的原理，有兴趣的可以去问下ai，本节课就不过度阐述了。那电脑刚进办公室的时候是干嘛呢？以前大家记账用算盘记账啊，现在不用算盘了，把账全都记到电脑里面去。这就叫信息化，说白了就是电脑替代手工，第一波。

      然后第二波的话，就是两千年，网页时代。就是HTML，超文本标记语言嘛，大家都开始做网页了。通过网页干什么呢？展示自己的店面。别人可以通过邮件、电话啊、各种其他的方式啊去联系到你，然后把你的东西买一下。那时候还都是大部分都是快递的线下交易，还没有支付宝，就是网页负责展示，生意还是在线下做。

      第三个时代的话就是云，二零一零年左右，云服务时代。云这个概念其实很早就有了，亚马逊是最早把这块服务做起来的。那时候大家是什么情况呢？所有企业都是自己建机房，自己买服务器，自己拉网线。后来机房也不自建了，全都搬到云上去了，本地的服务器全都移掉了。那时候还有很多专门做服务器的厂商，后面也都是把服务器全都卖给这些云厂商了。云厂商干嘛呢？就是一套技术底座，把服务器虚拟化一下，给你提供一个服务，它底层那些网络啊、存储啊，都给你包装起来，你可以按需去使用。所以从这个时代开始，基础设施就变成水电煤了，你用多少交多少钱。

      跟云差不多一块出来的，就是移动互联网时代。以前那些翻盖手机，就没有了嘛，他其实是一个操作系统的进步衍生出来的一个概念。大家都逐渐去买智能手机，通过手机玩游戏啊、聊天啊。然后随着这个基础设施的发展，四 G 到五 G 嘛，网络一起来，大家都逐渐把办公也弄到手机上了。比较出名的就是大家沟通都用微信嘛，国内也有企业可能办公会用钉钉，飞书，主要就是老板能看到员工有没有读过你的消息。

      然后呢，就到 AI 这个时代了。OpenAI 大概是二零一五年就开始开发 GPT 了，当初是马斯克投资的这个企业，后面他们把马斯克给丢出去了，这个八卦咱们就不展开了，有兴趣的同学可以去问ai。openai他们呢，之前一直是做小模型，二零一八年
      GPT 一代的时候小火过一次。所以那时候百度就做了一个决定叫 All in AI，也是赶了个早场，但是没吃上肉。真正具有划时代意义的，是二零二二年底 ChatGPT 出来。那是第一次，人类见识到 AI 模型经过大量数据训练学习之后的泛化能力——就是它会具备很多没有专门训练过的知识，也是ai初步有一个简单的思考能力。这个规律也很简单，模型越大，它的泛化能力越强，越智能。这里重点说一下我们国产厂商的贡献啊，像
      DeepSeek，它把蒸馏加思维链这套东西带进了主流大模型，后面整个大语言模型都受它影响，这个是很了不起的。

      好，AI 来了，那人是怎么用 AI 的？这个才是今天真正要讲的。我把它分成四代，你们自己对号入座一下。我记得我最初的时候去用 GPT 做架构，那时候还都是一句一句地喂，丢东西给它，然后对话，然后再复制粘贴出来用。AI 就是聊天窗口里的一个顾问，你是搬运工。这是第一代，对吧。

      后面的话，大家开始研究怎么把 AI 接入到系统里面。那时候怎么接的呢？就是提示词工程，在提示词里面去写死它，让它返回某一种固定的格式，然后让程序去解析，在页面上显示出来。你这个应用其实就是一个接入了大脑的应用。但是那时候一套应用要好几十套提示词，你给我返回这个格式，你给我返回那个格式，而且很不稳定。这是第二代，蛮荒时代。

      再后面呢，模型增加了一个 Tool Call 的功能，就是你可以把一些本地的工具丢给模型，让模型自己决定怎么调。你只要把这个工具的调用实现了，他会自己去思考，进行一整串的任务。这个时代就是大家说的 Vibe Coding。Vibe
      Coding 我很早就开始用了，大家怎么用呢？打开编码引擎，开黑窗口，然后天天在那跟他斗智斗勇，一边骂一遍含着泪一边用，这是第三代。

      然后后面的话，就是我们现在的这个时代了。我给它起了个名字，叫 Agent 原生系统，它可能是一个软件，也可能是一个sass平台，也可能是个未来的操作系统，目前市面上没有官方去定义它的形态，这可能是我自己提出来的一个概念与理论，是我的理解。Agent
      原生系统是什么意思呢？就是 Agent 把所有的东西开始接入起来，Tool Call 只是其中一种，包括记记忆引擎，还有 Harness 这套运行架构，还有 RAG 知识库，还有企业的一些流程性的资产，全部接进来，让 Agent 去执行非常长串的任务。这个词大家记住啊，Agent
      原生系统，后面咱们所有的课都是在这个地基上盖的。

      好，本节小课就到这里了，收个尾。从算盘到电脑，从自建机房到云，从复制粘贴到 Agent 原生系统——每一波浪过来，都淘汰了一批旧的工种，也成就了一批新的人，对吧。'
    practice: '**「讲给家人听」**：找一个不懂技术的人（家人、朋友、同事），用 2 分钟把六次浪潮讲一遍，只用「什么人变贵了、什么人变便宜了」这一个句式。讲的时候不许说任何技术名词（不许说「云」「原生」「框架」）。

      讲完后自问：他听懂了吗？哪一句他眼睛亮了？哪一句他开始走神？


      完成标志：

      [ ] 能用「谁变贵、谁变便宜」句式讲完至少四次浪潮，且全程无技术名词

      [ ] 能说出「会写变便宜、定方向与做验收变贵」并各举自己前四天的一个例子

      [ ] 对方能复述出你听懂的版本（哪怕只有一句）'
    resource_ids:
    - dg-waves
    - glossary
    tools:
    - name: 「认字的实习生」便签
      note: 你不说清楚他就乱干；他不知对错
    quiz:
    - - 六次浪潮的共同规律是什么？
      - - 每波都让程序员更贵
        - 每波都把「动手做」压便宜一层，把「知道该做什么」抬贵一层
        - 每波都淘汰一半职业
      - 1
      - 浪潮不淘汰人，淘汰的是「只会动手」——判断与验收一波比一波贵。
    - - 「AI 是认字的实习生」这个比方里，实习生取代不了你的两个原因是？
      - - 他不会写代码也不会查资料
        - 你不说清楚他就乱干；他干完不知道对不对
        - 他要工资而且经常请假
      - 1
      - 定方向（说清楚）和做验收（判断对错）都在你——这正是变贵的两件事。
    - - 爷爷用算盘、爸爸用计算器、你用 Excel、下一代用 AI 表格——这条线说明什么？
      - - 会计这个职业每代都在消失
        - 「算」这个动作一代比一代便宜，人不断往判断层上移
        - 工具越贵，人越值钱
      - 1
      - 机器每压低一层动手成本，人就上移一层——浪潮的同一个故事。
    - - Day 3 你的 index.html 大头是 AI 写的，这件事说明什么？
      - - 你的作品没有价值
        - 「写」正在变便宜，你做的「定方向+验收」才是价值所在
        - 以后不用学任何前端知识
      - 1
      - 写变便宜不等于作品没价值——价值在你定的方向和卡的验收。
    - - 判断「下一波浪潮来了」的信号是？
      - - 新闻里都是它
        - 机器又把某件「动手」的事的成本打到接近零
        - 股票价格涨了
      - 1
      - 盯住成本变化而非名词热度——规律比名单重要。
    - - 「会派活、会验收的人一波比一波贵」里的「派活」对应你前四天的哪个动作？
      - - 每天过 Rubric
        - 写 PRD、写提示词——把任务说清楚
        - 在群里提需求
      - 1
      - 派活=把任务写清楚（PRD/提示词）；验收=过 Rubric——你两样都练了。
    media:
    - kind: video
      title: 口播课件 · 互联网地图：这个时代是怎么来的
      object_key: documents/shared/course-media/day05-c1-worldview.mp4
      poster_key: documents/shared/course-media/day05-c1-worldview-poster.jpg
      duration_sec: 391
    knowledge_cards:
    - id: wave-law
      term: 浪潮规律
      plain: 每波把「动手做」压便宜一层，把「知道该做什么、做得对不对」抬贵一层。
      detail: 浪潮不淘汰人，淘汰的是「只会动手」。判断与验收一波比一波贵——这就是你坐在这门课里的原因。
      tag: 核心
    - id: cheap-expensive
      term: 谁变贵 / 谁变便宜
      plain: 会把纸上的活搬进新工具的人变贵；只守着旧手艺的人变便宜。
      detail: 算盘→电脑、店面→网页、自建机房→云、桌面→口袋、复制粘贴→Agent——每波都在重排价目表。
      tag: 框架
    - id: ai-intern
      term: 认字的实习生
      plain: AI 像认字很快的实习生：你不说清楚他就乱干；干完了也不知道对不对。
      detail: 定方向（说清楚）和做验收（判断对错）都在你——这两件才是正在变贵的能力。
      tag: 类比
    - id: gen-four
      term: 四代用 AI
      plain: 对话搬运 → 提示词工程 → Tool Call / Vibe Coding → Agent 原生系统。
      detail: 第一代你是搬运工；第二代把格式写死仍不稳定；第三代模型自己调工具；第四代记忆/Harness/RAG/流程全部接入。
      tag: 演进
    - id: agent-native
      term: Agent 原生系统
      plain: Agent 把工具、记忆、Harness、RAG 和企业流程资产接起来，跑超长任务。
      detail: 这是本课程的地基词——后面所有课都盖在这块上。形态可能是软件、SaaS，甚至未来的操作系统。
      tag: 地基
    - id: dispatch-accept
      term: 派活与验收
      plain: 派活=把任务写清楚（PRD/提示词）；验收=对照标准判断对不对。
      detail: 前四天你练的就是这两样——写 PRD、写提示词、过 Rubric。会派活、会验收的人，一波比一波贵。
      tag: 行动
    glossary_terms:
    - id: gt-wave
      term: 技术浪潮
      plain: 一波新工具把「动手」变便宜、把「判断与验收」变贵的时代切换。
      detail: 电脑、网页、云、移动、AI 帮写、Agent 原生——六波都在重排谁值钱。
    - id: gt-llm
      term: LLM
      plain: 大语言模型：用海量文本练出来的「预测下一个词」的机器。
    - id: gt-hallucination
      term: 幻觉
      plain: 模型给「最像真的」答案，不是「核实过」的答案——机制如此，不是偶发 bug。
    - id: gt-agent
      term: Agent
      plain: 能自己规划、调工具、看结果、继续干的 AI；你定方向、做验收。
    - id: gt-harness
      term: Harness
      plain: 模型外面那套循环：工具表、记忆、重试、日志——骨架不同，能力差很多。
    - id: gt-dispatch
      term: 派活 / 验收
      plain: 派活=把任务说清楚；验收=对照标准判断对不对。这两件正在变贵。
    local_prep:
      codex_prompt: ''
      checklist:
      - 能用「谁变贵、谁变便宜」句式讲完至少四次浪潮，且全程无技术名词
      - 能说出「会写变便宜、定方向与做验收变贵」并各举自己前四天的一个例子
      - 对方能复述出你听懂的版本（哪怕只有一句）
  - id: c2
    title: 企业数字化五阶段详解
    minutes: 25
    form: 概念
    content_ref: class/bootcamp/day-06/section-02-enterprise-digital-stages/lesson.md
    content: '同学们，上节讲了技术浪潮怎么重排谁值钱。这节换企业视角：一家公司从 Excel 报表到 Agent 替你跑流程，通常要爬五级台阶。记住名字：信息化、数字化、网络化、智能化、Agent 化。这是梯子，不是让你今晚全爬完。

      第一级信息化：纸变屏。OA、ERP、Excel 报表。人在当录入员、报表员。第二级数字化：KPI 进库，可查可对比。系统有数据库和驾驶舱——你们 第四天 的表结构就在这一层。人变成指标的定义者，不再只是搬数据，对吧。

      第三级网络化：前后端用 API 契约对话，多端可访问。第三天 的 API_Spec 就在这一层——改接口先改合同。第四级智能化：LLM 读数据、出建议。但输出要用 Rubric 验收，网关挂了要降级——摘要区块接电，就在 L4，对吧。

      第五级 Agent 化：把重复流程封装成 Skill，Harness 让 Agent 循环执行，留证据、要人工确认。人的角色是 FDE——定方向、做验收，指挥 Agent，不是替它打字。这就是你们第二周要去的地方：从能看到能干活，对吧。

      和驾驶舱怎么连？信息化时驾驶舱多是 PPT 梦想；数字化有真 KPI；网络化页面数据变真；智能化长出 AI 摘要；Agent 化是 Skill 替你跑流程。你们项目已经踩在 L2 到 L4 之间——第二周 往 L5 走，对吧。

      带走一句话：先认出你部门在哪一级，再决定下一级缺什么。五阶段是诊断地图，不是选型清单。下一节我们讲软件是怎么开发出来的——流程和需求调研，对吧。'
    practice: '完成标志：

      [ ] 五阶段名称顺序正确

      [ ] 每级至少一个部门实例或「缺口」说明

      [ ] 能 30 秒向同桌解释「Agent 化不是更贵的聊天框，而是能跑流程」'
    resource_ids:
    - dg-stages
    tools:
    - name: 五阶段梯子卡
      note: 每级：企业在干什么 / 系统 / 人的角色
    quiz:
    - - 企业数字化五阶段的正确顺序是？
      - - Agent 化 → 智能化 → 网络化 → 数字化 → 信息化
        - 信息化 → 数字化 → 网络化 → 智能化 → Agent 化
        - 数字化 → 信息化 → 网络化 → Agent 化 → 智能化
      - 1
      - 常见升级路径：先电子化，再数据化，再联网，再模型，再能执行。
    - - 「KPI 进库、驾驶舱有真数据」主要对应哪一阶段？
      - - 信息化
        - 数字化
        - Agent 化
      - 1
      - 数字化：数据有地址——Day 4 的表结构在这一层。
    - - 「API 契约、前后端对话」主要对应哪一阶段？
      - - 网络化
        - 信息化
        - 智能化
      - 0
      - 网络化：系统之间能对话——Day 3 的 API_Spec 在这。
    - - Agent 化阶段，人的核心角色是？
      - - 替 AI 写每一行代码
