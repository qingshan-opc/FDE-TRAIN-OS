title: 第十天 · 第 2 节 · 端到端十条能力证据
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 讲解图：v2-panorama.svg
  - 答辩拿证据，不讲情怀
  text: '同学们好，我是你们的老师404。答辩不是讲情怀，是拿证据。十天学了什么，用十件拿得出手的东西回答——方向卡、契约文档、Skill 三件、编排日志、Git 迭代史，每条都得有文件或运行记录撑腰，对吧。

    '
- id: 02-ten-evidence
  ppt:
  - 眉题：02 TEN EVIDENCE
  - 讲解图：v2-panorama.svg
  - 十条能力证据逐条自证
  text: '现在逐条过十条清单。打开文件、点开运行记录——拿得出来打勾，拿不出来打叉，太弱打三角。每条大概一分钟，别讲故事，先证明这东西在、能打开、能说明我会什么。能力不是说出来的，是拿出来的，对吧。

    '
- id: 03-strong-weak
  ppt:
  - 眉题：03 STRONG WEAK
  - 讲解图：v2-panorama.svg
  - 圈三强两弱
  text: '打完别慌，没人十项全能。圈出你最强的三条，那是答辩主打；最弱的两条，今晚能补就补，补不了就写进诚实声明。六七条打叉不丢人，自证诚实比假装全会强，咱们 FDE 出厂设置就是证据思维，对吧。

    '
- id: 04-one-liner
  ppt:
  - 眉题：04 ONE LINER
  - 讲解图：ten-day-grid.svg
  - 每条证据配一句话说明
  text: '证据在但讲不出来？每条配一句话：这是什么 + 它证明我会什么。比如 orchestration.md 证明你会编排与安全，runs/ 日志证明闸口可回放。现在就写，别拖到上台临场编——评委问的就是这条线，对吧。

    '
- id: 05-close
  ppt:
  - 眉题：05 TAKEAWAY
  - 讲解图：v2-panorama.svg
  - 答辩不评比谁多，比谁讲得清
  text: '同学们，本节先到这里。别人的证据比你多？答辩不评比谁多，比谁讲得清自己有什么。知道哪里弱，本身就是第十一条证据。下一节咱们按 3+3+2 结构写提纲，把三条强项和一条修了三遍的 bug 故事排进八分钟。

    '
