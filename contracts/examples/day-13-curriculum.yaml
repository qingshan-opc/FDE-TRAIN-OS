  - q: 孙经理在会上表示支持，但尚未指定试点人员，也未安排数据整理时间。当前最稳妥的记录是：
    options: *id004
    answer: 1
    explain: 口头表态是一条证据，资源投入和责任承诺仍需验证。当前应记录角色、初步态度和下一项验证动作。
  - q: 林晨准备启动销售问答试点。下列哪一组沟通顺序风险最低？
    options: *id005
    answer: 2
    explain: 该顺序先解决授权和业务责任，再进入真实资料和专业边界，最后组织试用，能够降低越权、返工和责任不清。
  - q: 陈总让林晨“自己协调”。林晨最稳妥的第一步是：
    options: *id006
