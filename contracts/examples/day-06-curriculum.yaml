learn:
  lingzhi_tags:
  - camp:v0.7
  - day:6
  - project:role-week
  estimated_minutes: 115
  require_capsules: true
  capsules:
  - id: c1
    title: 生态四层地图 + API/SSE 接入
    minutes: 30
    form: 概念+实战
    content_ref: class/bootcamp/day-06/section-01-ecosystem-four-layers/lesson.md
    content: '过稿主文件：`PPT_AND_NARRATION.md`；分词稿：`video/scripts/narration/`。

      真相源：`scripts/section_narrations/day06_s01.yaml`。'
    practice: '完成标志：

      [ ] [ ] 四层名称顺序正确，且各举一个具体产品/动作

      [ ] [ ] 能向同桌说清：API 是调用方式，SSE 是流式通道，助手位建议 SSE

      [ ] [ ] SSE 最小接电跑通（或书面记录 blocker + 降级方案，经助教确认）'
    resource_ids:
    - dg-llm-ecosystem
    - dg-four-layer
    - glossary
    quiz:
    - - LLM 的核心机制是什么？
      - - 检索互联网最新信息
        - 预测下一个 Token
        - 存储企业数据库
      - 1
      - 生成、理解、推理都从「接龙」机制长出——不是搜索引擎也不是数据库。
    - - 闭源 API（如 OpenAI）和开源权重（如 Qwen）的主要权衡是？
      - - 闭源一定更聪明
        - 能力、成本、隐私的三角权衡
        - 开源不能 Tool Call
      - 1
      - 闭源快省心；开源可自部署换隐私——没有唯一正确答案，看场景。
    - - 本课驾驶舱为什么刻意只用文本能力？
      - - 多模态违法
        - 聚焦摘要/问答/Tool Call，别用文本模型硬做不擅长的事
        - 多模态太贵不能用
      - 1
      - 知道多模态存在，但训练聚焦文本链路——边界意识是 FDE 基本功。
    - - API 和 SSE 的正确关系是？
      - - SSE 是另一家模型供应商
        - API 是调用入口；SSE 常是流式返回通道（stream）
        - 有了 SSE 就不必调 API
      - 1
      - 别对立：先打到模型 endpoint，再用 SSE 一段段收。
    - - 驾驶舱助手位本课建议怎么接？
      - - 只等整包 JSON，别流式
        - DeepSeek 等云 API + SSE 流式；Key 不进前端
        - 必须自建 GPU 集群
      - 1
      - 体感与可中断靠 SSE；密钥与降级是工程底线。
    media:
    - kind: video
      title: 口播课件 · 生态四层地图
      object_key: documents/shared/course-media/day06-c1-ecosystem.mp4
      poster_key: documents/shared/course-media/day06-c1-ecosystem-poster.jpg
      duration_sec: 496
    knowledge_cards:
    - id: llm-core
      term: LLM · 大语言模型
      plain: 用海量文本训练的「预测下一个词」机器；生成、理解、推理都从这机制长出。
      tag: 核心
    - id: four-layers
      term: 生态四层
      plain: 基建→模型→编排→应用；FDE 主要在编排层和应用层动手。
      tag: 框架
    - id: open-closed
      term: 开源权重 vs 闭源 API
      plain: 闭源调 endpoint 按 Token 付费；开源下载权重自部署——能力、成本、隐私三角权衡。
      tag: 选型
    - id: multimodal-bound
      term: 多模态边界
      plain: 不只文本还能看图听音；本课驾驶舱先盯文本 + SSE。
      tag: 边界
    - id: sse-stream
      term: SSE · Server-Sent Events
      plain: 服务端按事件/Token 一段段推给浏览器；Chat 流式常用。助手位建议 SSE，不是另一种供应商。
      tag: 接入
    - id: api-vs-sse
      term: 一次性响应 vs SSE
      plain: 一次性等整包 JSON；SSE 边收边显示。API 是调用入口，SSE 是流式通道。
      tag: 接入
    glossary_terms:
    - id: gt-llm
      term: LLM
      plain: 大语言模型：预测下一个 Token，不是核实过的事实库。
    - id: gt-open-closed
      term: 开源 vs 闭源
      plain: 云 API 省心按量付；权重自部署换隐私与成本。
    - id: gt-sse
      term: SSE
      plain: Server-Sent Events；流式返回通道，挂在 stream 接口上。
    - id: gt-multimodal
      term: 多模态
      plain: 跨文本/图像/音频；本课聚焦文本摘要与 Tool Call。
    local_prep:
      codex_prompt: '我需要接入 DeepSeek-flash（若文档型号名不同，以教务/官方当前 flash 型号为准），采用 SSE 的方式接入。


        约束：

        1. 调用云端 Chat Completions（或兼容 OpenAI 协议的）接口，开启 stream / SSE（text/event-stream）。

        2. 前端（或驾驶舱助手位）边收边显示 token/文本片段；支持「生成中」状态与错误态；断流可重试。

        3. API Key 只放在后端或本地 .env（已 gitignore），前端不得硬编码密钥。

        4. 最小验收：发送一句「用三句话介绍你自己」，界面能流式打出回复；失败时显示可读错误，不白屏、不假装成功。

        5. 交付：可运行的最小代码 + 我怎么启动的 3 行说明（README 小节即可）。


        先问我：工作区语言栈（纯 HTML / Node / Python）和密钥从哪读；再改代码，不要一次糊一堆无关重构。'
      checklist: []
  - id: c2
    title: Token / 窗口 / 幻觉：能力与边界
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-06/section-02-token-window-hallucination/lesson.md
    content: 过稿主文件：`PPT_AND_NARRATION.md`；分词稿：`video/scripts/narration/`。**未过稿前不跑 TTS/渲染。**
    practice: '完成标志：

      [ ] [ ] 能解释 input/output Token 与账单的关系

      [ ] [ ] 举一个驾驶舱里可能出现幻觉的场景 + 对策

      [ ] [ ] 说清「验收」比「再 prompt 一次」优先'
    resource_ids:
    - dg-llm-capability
    - glossary
    quiz:
    - - Token 和「一个汉字」的关系是？
      - - 完全相等
        - 中文约 0.6–1 字/Token，不是一字一 Token
        - Token 只用于英文
      - 1
      - API 账单按 Token 计——压缩 Prompt 是真省钱。
    - - 上下文窗口满了，常见策略不包括？
      - - 截断最早消息
        - 无限扩大窗口忽略成本
        - RAG 只检索相关片段
      - 1
      - 窗口是硬顶+成本顶——不能假装无限。
    - - 为什么说幻觉是「机制」不是 bug？
      - - 模型坏了要返厂
        - 训练目标是 plausible 接龙，不是 fact-check
        - 只有旧模型才幻觉
      - 1
      - 对策是 RAG+Eval+Guardrails，不是「再 prompt 一次就会好」。
    media:
    - kind: video
      title: 口播课件 · Token / 窗口 / 幻觉
      object_key: documents/shared/course-media/day06-c2-token.mp4
      poster_key: documents/shared/course-media/day06-c2-token-poster.jpg
      duration_sec: 373
    knowledge_cards:
    - id: token-meter
      term: Token 计量
      plain: 模型读写最小单位；中文约 0.6–1 字/Token；API 按 input+output 计费。
      tag: 核心
    - id: context-window
      term: 上下文窗口
      plain: 一次调用能看到的 Token 上限；满了可截断、摘要或 RAG。
      tag: 核心
    - id: hallucination
      term: 幻觉 Hallucination
      plain: 给「最像真的」而非「核实过的」答案——机制如此，不是偶发 bug。
      tag: 核心
    glossary_terms:
    - id: gt-token
      term: Token / 窗口
      plain: Token 是计费单位；窗口是一次能看多少——对话越长越贵越慢。
    - id: gt-hallucination
      term: 幻觉
      plain: 流畅 plausible 优先于 fact-check；关键事实必须可溯源+验收。
    local_prep:
      codex_prompt: '你是 LLM 能力边界教练。用我的驾驶舱摘要场景，解释 Token 计费、上下文窗口满了的三条出路、幻觉为什么是机制不是偶发 bug。

        每点配一个「我项目里的坏例子」。最后出 3 道口答题考我。'
      checklist: []
  - id: c3
    title: Prompt / Context / RAG / Fine-tune vs Prompt
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-06/section-03-prompt-context-rag/lesson.md
    content: 过稿主文件：`PPT_AND_NARRATION.md`；分词稿：`video/scripts/narration/`。**未过稿前不跑 TTS/渲染。**
    practice: '完成标志：

      [ ] [ ] 能改一条「坏 Prompt」成「好 Prompt」（加格式+约束）

      [ ] [ ] 说清 RAG 和「直接把整库塞进 Prompt」的区别

      [ ] [ ] Fine-tune 何时才考虑（一句）'
    resource_ids:
    - dg-context-assembly
    - glossary
    quiz:
    - - Prompt 工程「四要素」不包括？
      - - 角色定位
        - GPU 型号
        - 输出格式
      - 1
      - 四要素：角色、背景、任务、格式——再加约束。
    - - Context Engineering 主要解决什么问题？
      - - 让模型更快
        - 决定这次调用放什么进窗口，避免给少瞎编/给多迷失
        - 替代 Fine-tuning
      - 1
      - 窗口有限——装填是手艺，不是玄学。
    - - RAG 的正确顺序是？
      - - 生成→检索→嵌入
        - 切块→嵌入→检索→拼 Prompt→生成
        - 检索→Fine-tune→生成
      - 1
      - 先捞相关片段再让模型基于片段回答。
    - - 90% 场景应该优先？
      - - Fine-tuning
        - Prompting（+RAG+Eval）
        - 换更大的模型
      - 1
      - Fine-tune 贵慢——Prompt 方案没过闸不升级。
    media:
    - kind: video
      title: 口播课件 · Prompt / Context / RAG
      object_key: documents/shared/course-media/day06-c3-rag.mp4
      poster_key: documents/shared/course-media/day06-c3-rag-poster.jpg
      duration_sec: 327
    knowledge_cards:
    - id: prompt-eng
      term: Prompt 工程
      plain: 任务说明书：角色+背景+任务+约束+输出格式，可迭代可验收。
      tag: 核心
    - id: context-eng
      term: Context Engineering
      plain: 决定这次调用放什么进窗口——给少瞎编，给多迷失。
      tag: 核心
    - id: rag-pipeline
      term: RAG 管线
      plain: 切块→嵌入→检索→拼 Prompt→生成；治幻觉主流方案之一。
      tag: 核心
    - id: finetune-prompt
      term: Fine-tune vs Prompt
      plain: 改权重贵慢；改 Prompt 快便宜——90% 场景先用后者。
      tag: 选型
    glossary_terms:
    - id: gt-prompt
      term: Prompt 工程
      plain: 四要素+约束+格式；工程师看完不用回来问第二遍。
    - id: gt-context
      term: Context Engineering
      plain: 装填窗口的手艺——PRD 片段 vs 整库，取舍决定质量。
    - id: gt-rag
      term: RAG
      plain: 先检索相关片段再生成；驾驶舱摘要是简化版 RAG 思想。
    local_prep:
      codex_prompt: '帮我设计一次调用的 Context 装填清单：系统规则 / 真数据 / 用户原话。

        再写一个最小 RAG 故事：驾驶舱「先查数再摘要」对应哪五步里的哪几步。

        指出 Fine-tune 为什么还轮不到我。'
      checklist: []
  - id: c4
    title: Eval / Guardrails / Vibe Coding
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-06/section-04-eval-guardrails-vibe/lesson.md
    content: 过稿主文件：`PPT_AND_NARRATION.md`；分词稿：`video/scripts/narration/`。**未过稿前不跑 TTS/渲染。**
    practice: '完成标志：

      [ ] [ ] 5 条 case 可被第三方客观判过/不过

      [ ] [ ] 说清一条 Guardrails 降级策略（空结果）

      [ ] [ ] 举自己 vibe 写代码的一次经历 + 怎么验收的'
    resource_ids:
    - dg-llm-ecosystem
    - glossary
    quiz:
    - - Eval 和「我觉得还行」的本质区别？
      - - Eval 更贵
        - Eval 可重复、有固定判分，第三方能客观判过/不过
        - 没有区别
      - 1
      - Rubric 和快测都是 Eval 的朴素版。
    - - 检索为空时 Guardrails 应该？
      - - 让模型编造合理答案
        - 拒答/模板降级/转人工，禁止 hallucinate
        - 自动 Fine-tune
      - 1
      - 空结果瞎编是线上事故高发区。
    - - 「带验收的 Vibe Coding」指？
      - - 不许用 AI 写代码
        - 可以用 AI 写 diff，但合并前必须 Eval 和验收关键路径
        - 只要 vibe 快就行
      - 1
      - 会 vibe 的人变贵，只会 vibe 不验收的人变便宜。
    media:
    - kind: video
      title: 口播课件 · Eval / Guardrails / Vibe Coding
      object_key: documents/shared/course-media/day06-c4-eval.mp4
      poster_key: documents/shared/course-media/day06-c4-eval-poster.jpg
      duration_sec: 272
    knowledge_cards:
    - id: eval-core
      term: Eval · 评测
      plain: 固定题库+明确判分+可重复跑——代替「我觉得还行」。
      tag: 核心
    - id: guardrails
      term: Guardrails · 护栏
      plain: 输入过滤、输出约束、越界降级——空结果别瞎编。
      tag: 核心
    - id: vibe-coded
      term: Vibe Coding
      plain: 自然语言让 AI 写代码；爽点是真的，验收责任也是真的。
      tag: 全程
    glossary_terms:
    - id: gt-eval
      term: Eval
      plain: 给 AI 出考卷；模型/Prompt 改版后重跑，分掉别发版。
    - id: gt-guardrails
      term: Guardrails
      plain: 敏感词、空结果、超时——三条降级路径企业必备。
    - id: gt-vibe
      term: Vibe Coding
      plain: diff 可以 vibe，合并进 main 必须 Eval+人工看关键路径。
    local_prep:
      codex_prompt: '为我的摘要功能写：3 条 Eval 题（输入+期望要点）、1 条 Guardrails（空结果/超时怎么降级）、用白话区分 Vibe Coding 与可验收交付。

        输出可直接贴进 llm-cognition-card 的要点。'
      checklist: []
  - id: c5
    title: Agent / Harness / Tool / MCP / Workflow vs Agent
    minutes: 25
    form: 概念
    content_ref: class/bootcamp/day-06/section-05-agent-harness-mcp/lesson.md
    content: 过稿主文件：`PPT_AND_NARRATION.md`；分词稿：`video/scripts/narration/`。**未过稿前不跑 TTS/渲染。**
    practice: '完成标志：

      [ ] [ ] 能画 Agent 循环简图

      [ ] [ ] 说清 Copilot vs Agent 信任差异

      [ ] [ ] 指驾驶舱哪块未来适合 Skill/MCP 封装'
    resource_ids:
    - dg-agent-loop
    - dg-harness
    - dg-workflow-agent
    - glossary
    quiz:
    - - Agent 循环的正确顺序？
      - - Tool Call→理解→规划
        - 理解→规划→Tool Call→观察→继续
        - 生成→生成→生成
      - 1
      - Harness 负责执行 Tool 并喂回结果。
    - - 同一 GPT-4，Cursor Agent 和简陋脚本能力差异主要来自？
      - - 模型版本不同
        - Harness（工具表、记忆、重试、日志）不同
        - 网络速度
      - 1
      - 骨架不同，能力天差地别——Week 2 练的就是 Harness/Skill。
    - - MCP 最贴切的比喻是？
      - - 新的编程语言
        - AI 接工具/数据源的 USB-C 标准
        - 只能 OpenAI 用的私有协议
      - 1
      - 按标准写 Server，Cursor/Claude Desktop 都能用。
    - - 「能写死就写死，写不死才 Agent」说明？
      - - Agent 永远优于 Workflow
        - Workflow 稳定可审计；Agent 灵活但需 Eval——按任务选
        - 不应该用 Agent
      - 1
      - 报销审批写 Workflow；开放式整理任务才 Agent。
    - - Copilot 和 Agent 的核心区别？
      - - Copilot 更贵
        - Copilot 是你开车它递扳手；Agent 是你定目的地它开
        - 没有区别
      - 1
      - Agent 多步跨文件，错了破坏力大——日志和 Eval 更关键。
    - - Tool Calling 时谁真正执行工具？
      - - 模型自己连数据库
        - Harness 收到结构化请求后执行，再把结果塞回上下文
        - 用户手动执行
      - 1
      - 模型只「说我要调什么」；执行在 Harness。
