<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="SQL 四板斧">
<rect width="1040" height="460" fill="#f2f5f0"/>
<!-- SELECT -->
<rect x="60" y="50" width="440" height="150" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="84" y="84" font-size="16" font-weight="800" fill="#1400ff" style="font-family:'SF Mono',Menlo,monospace">SELECT</text>
<text x="170" y="84" font-size="14" font-weight="700" fill="#231f20">查 · 给我看看</text>
<rect x="84" y="100" width="392" height="52" fill="#231f20"/>
<text x="98" y="131" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">SELECT region, amount FROM kpi</text>
<text x="98" y="147" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">WHERE month = '2026-07';</text>
<text x="84" y="180" font-size="11" fill="rgba(35,31,32,.55)">读法：给我看 7 月各区域的金额</text>
<!-- INSERT -->
<rect x="540" y="50" width="440" height="150" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="564" y="84" font-size="16" font-weight="800" fill="#1400ff" style="font-family:'SF Mono',Menlo,monospace">INSERT</text>
<text x="650" y="84" font-size="14" font-weight="700" fill="#231f20">增 · 加一行</text>
<rect x="564" y="100" width="392" height="52" fill="#231f20"/>
<text x="578" y="131" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">INSERT INTO kpi VALUES</text>
<text x="578" y="147" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">(5, '2026-07-24', '华南', 96000);</text>
<text x="564" y="180" font-size="11" fill="rgba(35,31,32,.55)">读法：往表里加一行新记录</text>
<!-- UPDATE -->
<rect x="60" y="220" width="440" height="150" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="84" y="254" font-size="16" font-weight="800" fill="#1400ff" style="font-family:'SF Mono',Menlo,monospace">UPDATE</text>
<text x="170" y="254" font-size="14" font-weight="700" fill="#231f20">改 · 找准那行改</text>
<rect x="84" y="270" width="392" height="52" fill="#231f20"/>
<text x="98" y="301" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">UPDATE kpi SET amount = 98000</text>
<text x="98" y="317" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">WHERE id = 5;</text>
<text x="84" y="350" font-size="11" fill="rgba(35,31,32,.55)">读法：把 id=5 那行的金额改成 98000</text>
<!-- DELETE -->
<rect x="540" y="220" width="440" height="150" fill="#ffffff" stroke="#f24e54" stroke-width="2"/>
<text x="564" y="254" font-size="16" font-weight="800" fill="#c92f3d" style="font-family:'SF Mono',Menlo,monospace">DELETE</text>
<text x="650" y="254" font-size="14" font-weight="700" fill="#231f20">删 · 找准那行删</text>
<rect x="564" y="270" width="392" height="52" fill="#231f20"/>
<text x="578" y="301" font-size="11.5" fill="#f2f5f0" style="font-family:'SF Mono',Menlo,monospace">DELETE FROM kpi WHERE id = 5;</text>
<text x="564" y="350" font-size="11" fill="rgba(35,31,32,.55)">读法：删掉 id=5 那一行（有 WHERE！）</text>
<!-- 底注 -->
<text x="520" y="412" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">会读比会写重要：Day 4 你审 AI 写的 SQL，看懂这四句就毕业</text>
<text x="520" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#c92f3d">危险动作识别：没有 WHERE 的 UPDATE / DELETE = 全表遭殃</text>
</svg>
