<text x="280" y="246" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="800" fill="#0d9488">=</text>
<g transform="translate(36,272)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="488" height="88" rx="16" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      
      <text x="24" y="49.25" font-size="15" font-weight="700" fill="#231f20">HR 示例：招聘负责人 · 漏斗 · 超期岗位</text>
      
