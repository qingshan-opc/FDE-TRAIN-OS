<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="前端四大平台技术地图">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <circle cx="1120" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="552" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">前端 = 用户直接接触的界面层（四大平台）</text>
<text x="1164" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">WEB · APP · MINI · DESKTOP —— 先定平台，再选框架</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="48" y="72" width="264" height="372" rx="18" fill="#fff" filter="url(#sh)"/>
<rect x="68" y="94" width="5" height="18" rx="2.5" fill="#0d9488"/>
<text x="82" y="109" font-size="16" font-weight="800" fill="#231f20">Web 网页</text>
<text x="82" y="130" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">BROWSER · HTML/CSS/JS</text>
<text x="68" y="158" font-size="11.5" fill="rgba(35,31,32,.55)">官网 · 后台系统 · 周报助手</text>
<text x="68" y="190" font-size="12.5" font-weight="700" fill="#231f20">React<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 人最多 · AI 最会写</tspan></text>
<text x="68" y="216" font-size="12.5" font-weight="700" fill="#231f20">Vue<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 最好学 · 中文文档好</tspan></text>
<text x="68" y="242" font-size="12.5" font-weight="700" fill="#231f20">Angular<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 大企业全家桶</tspan></text>
<text x="68" y="268" font-size="12.5" font-weight="700" fill="#231f20">Svelte<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 新派简洁</tspan></text>
<text x="68" y="294" font-size="12.5" font-weight="700" fill="#231f20">Next.js / Nuxt<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 对外站 SEO</tspan></text>
<text x="68" y="320" font-size="12.5" font-weight="700" fill="#231f20">不用框架<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 小页面够用（Day 3）</tspan></text>
<text x="68" y="350" font-size="11" fill="rgba(35,31,32,.5)">工程化两件套：TypeScript · Vite</text>
<text x="68" y="424" font-size="12" font-weight="700" fill="#0f766e">场景：对外网站、内部系统</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="336" y="72" width="264" height="372" rx="18" fill="#fff" filter="url(#sh)"/>
<rect x="356" y="94" width="5" height="18" rx="2.5" fill="#0d9488"/>
<text x="370" y="109" font-size="16" font-weight="800" fill="#231f20">App 开发</text>
<text x="370" y="130" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">MOBILE · 应用商店</text>
<text x="356" y="158" font-size="11.5" fill="rgba(35,31,32,.55)">微信 · 滴滴 · Keep</text>
<text x="356" y="190" font-size="12.5" font-weight="700" fill="#231f20">Swift（iOS）<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 苹果官方</tspan></text>
<text x="356" y="216" font-size="12.5" font-weight="700" fill="#231f20">Kotlin（Android）<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 谷歌官方</tspan></text>
<text x="356" y="242" font-size="12.5" font-weight="700" fill="#231f20">Flutter<tspan fill="rgba(35,31,32,.5)" font-weight="400"> Dart · 一套代码两端一致</tspan></text>
<text x="356" y="268" font-size="12.5" font-weight="700" fill="#231f20">React Native<tspan fill="rgba(35,31,32,.5)" font-weight="400"> 会 React 就会写</tspan></text>
<text x="356" y="298" font-size="11" fill="rgba(35,31,32,.5)">原生 = 两套代码两拨人（大厂重体验）</text>
<text x="356" y="320" font-size="11" fill="rgba(35,31,32,.5)">跨端 = 一套代码出两端（小团队默认）</text>
<text x="356" y="424" font-size="12" font-weight="700" fill="#0f766e">场景：重度使用、要系统能力</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="624" y="72" width="264" height="372" rx="18" fill="#fff" filter="url(#sh)"/>
<rect x="644" y="94" width="5" height="18" rx="2.5" fill="#0d9488"/>
<text x="658" y="109" font-size="16" font-weight="800" fill="#231f20">小程序</text>
<text x="658" y="130" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">MINI PROGRAM · 扫码即用</text>
<text x="644" y="158" font-size="11.5" fill="rgba(35,31,32,.55)">点单 · 健康码 · 报名</text>
<text x="644" y="190" font-size="12.5" font-weight="700" fill="#231f20">微信原生<tspan fill="rgba(35,31,32,.5)" font-weight="400"> WXML/WXSS/JS</tspan></text>
<text x="644" y="216" font-size="11.5" fill="rgba(35,31,32,.5)">能力最全、最稳</text>
<text x="644" y="242" font-size="12.5" font-weight="700" fill="#231f20">Taro<tspan fill="rgba(35,31,32,.5)" font-weight="400"> React 风格 · 一套代码多端</tspan></text>
<text x="644" y="268" font-size="12.5" font-weight="700" fill="#231f20">uni-app<tspan fill="rgba(35,31,32,.5)" font-weight="400"> Vue 风格 · 一套代码多端</tspan></text>
<text x="644" y="298" font-size="11" fill="rgba(35,31,32,.5)">中国特色平台：做国内生意绕不开</text>
<text x="644" y="424" font-size="12" font-weight="700" fill="#0f766e">场景：轻量、用完即走、借微信流量</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="912" y="72" width="240" height="372" rx="18" fill="#fff" filter="url(#sh)"/>
<rect x="932" y="94" width="5" height="18" rx="2.5" fill="#0d9488"/>
<text x="946" y="109" font-size="16" font-weight="800" fill="#231f20">桌面软件</text>
<text x="946" y="130" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">DESKTOP · 双击图标</text>
<text x="932" y="158" font-size="11.5" fill="rgba(35,31,32,.55)">VS Code · 飞书 · 剪映</text>
<text x="932" y="190" font-size="12.5" font-weight="700" fill="#231f20">Electron<tspan fill="rgba(35,31,32,.5)" font-weight="400"> </tspan></text>
<text x="932" y="216" font-size="11.5" fill="rgba(35,31,32,.5)">网页技术包壳 · 零门槛</text>
<text x="932" y="242" font-size="12.5" font-weight="700" fill="#231f20">Tauri<tspan fill="rgba(35,31,32,.5)" font-weight="400"> </tspan></text>
<text x="932" y="268" font-size="11.5" fill="rgba(35,31,32,.5)">Rust · 体积小十倍 · 生态新</text>
<text x="932" y="424" font-size="12" font-weight="700" fill="#0f766e">场景：内部工具桌面版</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="48" y="466" width="560" height="58" rx="16" fill="url(#tlg)"/><text x="72" y="492" font-size="13.5" font-weight="800" fill="#fff">第一步 · 定平台</text><text x="72" y="512" font-size="11.5" fill="rgba(255,255,255,.85)">用户在哪用你？浏览器 / 应用商店 / 微信里 / 桌面图标</text><rect x="632" y="466" width="520" height="58" rx="16" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="1.5"/><text x="656" y="492" font-size="13.5" font-weight="800" fill="#0f766e">第二步 · 选框架（四问）</text><text x="656" y="512" font-size="11.5" fill="rgba(35,31,32,.6)">团队会什么 → 生态大不大 → AI 写得好不好 → 项目有多大</text><text x="48" y="562" font-size="12" fill="rgba(35,31,32,.5)">每条路线的优势对比与官方链接 → 见资源区「交互讲义 · 技术选型全图」</text></g>
</svg>
