camp_version: v0.7
day: 3
title: 让系统真的保存和读取数据
week: 1
project: 真实数据保存、读取和完整流程
project_brief: 学员先用自己的项目看懂前端、后端和数据库的数据链路，再指挥后端按已批准契约建表和实现真实接口，最后让前端从 Mock 切换到真实 API。AI 只保留 Week2 入口。
review_checklist:
- 业务数据已经从 Mock 切换为真实接口和 SQLite
- 提交、列表、详情、驾驶舱统计形成可重复验证的闭环
- 接口错误结构和业务校验真实生效
- AI 接口诚实返回未接入并留下第二周交接文档
- 学员能根据契约判断问题属于前端还是后端
