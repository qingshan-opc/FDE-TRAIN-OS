title: "第五天 · 第 2 节 · 企业数字化五阶段详解"
segments:
  - id: "01-open"
    ppt:
      - "OVERVIEW · 五阶段"
    text: |
      同学们，上节讲了技术浪潮怎么重排谁值钱。这节换企业视角：一家公司从 Excel 报表到 Agent 替你跑流程，通常要爬五级台阶。记住名字：信息化、数字化、网络化、智能化、Agent 化。这是梯子，不是让你今晚全爬完。
  - id: "02-stage12"
    ppt:
      - "纸变屏 · KPI 进库"
      - "信息化：OA/Excel，人是录入员。数字化：数据库与驾驶舱，Day 4 表结构在这层。"
    text: |
      第一级信息化：纸变屏。OA、ERP、Excel 报表。人在当录入员、报表员。第二级数字化：KPI 进库，可查可对比。系统有数据库和驾驶舱——你们 第四天 的表结构就在这一层。人变成指标的定义者，不再只是搬数据。
  - id: "03-stage34"
    ppt:
      - "契约接电 · 模型读数"
      - "网络化：API_Spec 是合同。智能化：摘要要 Rubric，网关降级不能白屏。"
    text: |
      第三级网络化：前后端用 API 契约对话，多端可访问。第三天 的 API_Spec 就在这一层——改接口先改合同。第四级智能化：LLM 读数据、出建议。但输出要用 Rubric 验收，网关挂了要降级——摘要区块接电，就在 L4。
  - id: "04-agent"
    ppt:
      - "Skill + Harness"
    text: |
      第五级 Agent 化：把重复流程封装成 Skill，Harness 让 Agent 循环执行，留证据、要人工确认。人的角色是 FDE——定方向、做验收，指挥 Agent，不是替它打字。这就是你们第二周要去的地方：从能看到能干活。
  - id: "05-cockpit"
    ppt:
      - "项目踩在 L2–L4"
      - "数字化有真 KPI · 网络化契约接电 · 智能化摘要区块 · Week 2 往 L5 Agent 化。"
    text: |
      和驾驶舱怎么连？信息化时驾驶舱多是 PPT 梦想；数字化有真 KPI；网络化页面数据变真；智能化长出 AI 摘要；Agent 化是 Skill 替你跑流程。你们项目已经踩在 L2 到 L4 之间——第二周 往 L5 走。
  - id: "06-close"
    ppt:
      - "先认出你部门在哪一级，再决定下一级缺什么。"
      - "驾驶舱已踩 L2–L4；Week 2 往 Agent 化。"
    text: |
      带走一句话：先认出你部门在哪一级，再决定下一级缺什么。五阶段是诊断地图，不是选型清单。下一节我们讲软件是怎么开发出来的——流程和需求调研。
