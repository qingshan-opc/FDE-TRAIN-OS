<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="环境与配置分离：密钥不进代码">
<rect width="1040" height="430" fill="#f2f5f0"/>
<!-- 左：代码仓库（可公开） -->
<rect x="50" y="60" width="440" height="270" fill="#ffffff" stroke="#2f9e44" stroke-width="2.5"/>
<text x="270" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#2f9e44">代码仓库 · 可以进 git</text>
<g font-size="11.5" style="font-family:'SF Mono',Menlo,monospace" fill="rgba(35,31,32,.7)">
<text x="80" y="134">app/            应用代码</text>
<text x="80" y="164">requirements.txt 依赖清单</text>
<text x="80" y="194">.env.example    配置模板（占位符）</text>
<text x="80" y="224">.gitignore      里必须有 .env</text>
<text x="80" y="254" fill="#2f9e44">README.md       怎么配，看文档</text>
</g>
<text x="270" y="300" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)">模板写结构，不写真值：</text>
<text x="270" y="320" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)" style="font-family:'SF Mono',Menlo,monospace">MODEL_API_KEY=填你的</text>
<!-- 右：环境（机密） -->
<rect x="550" y="60" width="440" height="270" fill="#ffffff" stroke="#f24e54" stroke-width="2.5"/>
<text x="770" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#c92f3d">环境 · 绝不进 git</text>
<g font-size="11.5" style="font-family:'SF Mono',Menlo,monospace" fill="rgba(35,31,32,.7)">
<text x="580" y="134">.env            真实密钥（本机）</text>
<text x="580" y="164">服务器环境变量    生产密钥</text>
<text x="580" y="194">密钥管理服务      团队级方案</text>
</g>
<text x="770" y="244" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)">同一份代码，换一套环境变量，</text>
<text x="770" y="264" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)">就从「开发」切到「生产」</text>
<!-- 中间隔离线 -->
<line x1="520" y1="80" x2="520" y2="310" stroke="#231f20" stroke-width="2" stroke-dasharray="8 5"/>
<text x="520" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#231f20">分界线</text>
<!-- 底注 -->
<text x="520" y="392" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">铁律：密钥一旦进过 git 历史，就当它已泄露——立刻换新的</text>
</svg>
