# Day 03 — 部署滚动（k8s 仿真）
camp_version: v0.3
day: 3
title: 应用发布与滚动更新
project: api 服务发布

learn:
  lingzhi_tags: ["camp:v0.3", "day:3", "topic:k8s-rollout"]
  estimated_minutes: 20

nodes:
  - type: learn
    title: Deployment 与滚动更新
  - type: quiz
    title: 就绪探针与故障识别
  - type: lab
    title: 在仿真集群中完成滚动发布
  - type: project
    title: 企业任务：修复 CrashLoop 并恢复服务
  - type: review
  - type: unlock

lab:
  sim_kind: k8s
  adapter_version: "1.0"
  seed:
    cluster_fixture: prod-like-mini
    faults: [CrashLoop]
    diversify_by: learner_id
  ui:
    layout: cli_plus_topology
  rubric:
    - check: resource_exists
      args: { kind: Deployment, name: api }
    - check: resource_ready
      args: { kind: Deployment, name: api }
    - check: command_sequence
      args:
        contains:
          - "kubectl apply"
          - "kubectl rollout status"
  coach:
    help_mode: explain
    skill_id: fde-coach
    allow_state_summary: true
    max_help_level: 2
