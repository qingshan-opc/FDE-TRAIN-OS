title: "第十天 · 第 1 节 · 实战：Agent 接入驾驶舱"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · 助手位最后一块拼图"
      - "讲解图：v2-panorama.svg"
      - "右边 AI 助手位空了九天"
      - "V2.0 就差这一角"
    text: |
      同学们好，我是你们的老师404。同学们啊，咱们先停一下——看驾驶舱右边那个 AI 助手位，空了九天了。有同学可能会说：404老师，挂个聊天框不就行了吗？听见了吗——不行。那是 V2.0 最后一块拼图：助手位不是装饰，是驾驶位。状态看得见、刹车踩得到，才叫接入。今天这节，咱们把它活起来。来，看屏幕这张 V2.0 全景图，六个区块你搭了九天，就差这一角。想三秒：老板点进来，他觉得「能控」还是「好看」？这节是实战，手要动；接不通可以先降级，但闸必须真。希望同学们好好听、好好掌握——最后一块拼图，今天必须落地，对吧。

  - id: "02-cockpit-not-chat"
    ppt:
      - "眉题：02 COCKPIT · 驾驶位不是摆设"
      - "讲解图：v2-panorama.svg"
      - "助手位 = 人-Agent 对话口"
      - "只挂聊天框 = 摆设"
    text: |
      先钉原则。驾驶舱是「驾驶」的地方——不是贴个 AI 头像好看。有同学一听就懵：对话口和聊天框有啥区别？我用人话说：对话口得接得上 Agent、看得见流水线跑到哪、踩得到确认闸。三个少一个，老板只会觉得「哦，有个 AI」，不会觉得「我能控」。咱们叫 FDE，交付的是能跑、能拦、能查的系统。助手位空着，就像方向盘没接上——车壳再漂亮也开不动。验收看能不能控，不是好不好看；摆设聊天框，答辩「拦得住」过不了。来，对照全景图：助手位在交付面的位置，就是驾驶的位置。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。，嘛。

  - id: "03-three-requirements"
    ppt:
      - "眉题：03 THREE REQ · 接入三要件"
      - "讲解图：v2-panorama.svg"
      - "① 唤起 ② 状态 ③ 闸在页内"
      - "三件齐了才叫接入"
    text: |
      来，看屏幕——接入三要件，记死。第一唤起：助手位能发消息给 Agent，Agent 能回话。第二状态：流水线跑到哪一步，助手位实时可见。第三闸在页内：确认界面就在驾驶舱里，批准、驳回按钮直接点。有同学可能会说：三件都要？对，理想态三件全亮；时间紧有优先级，但心里得知道——缺一件就不叫完整接入。唤起是嘴，状态是仪表盘，闸是刹车。心里三件齐，手上允许分步做；别拿聊天框冒充全套接入。缺哪件，答辩时评委一问就穿帮。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。，对吧。

  - id: "04-awaken"
    ppt:
      - "眉题：04 AWAKEN · 第一要件：唤起"
      - "讲解图：v2-panorama.svg"
      - "页面内嵌对话区"
      - "接通 Agent 运行环境"
    text: |
      第一件，唤起。最小实现别贪大：页面内嵌对话区，把 Agent 运行环境接通——你发一句，它回一句，链路真通。有同学可能会问：接不通真实环境咋办？待会讲降级；但思想先钉住：唤起不是假数据糊弄，是打通「人 → Agent」第一跳。测试也简单：刷新页面，发真实指令，看回复是不是从你配置的 Agent 来的，别是 mock。听见了吗？嘴接上了，状态和闸才有意义；mock 只能骗自己，骗不了互评。先通一条真消息，再叠第二件。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，呢。

  - id: "05-status"
    ppt:
      - "眉题：05 STATUS · 第二要件：状态"
      - "讲解图：v2-panorama.svg"
      - "读 runs/ 最新日志行"
      - "当前步骤 + 状态可见"
    text: |
      第二件，状态。流水线跑到哪了，助手位得看得见——别让人猜 Agent 在后台干啥。最小实现：读 runs/ 目录最新一行日志，显示「当前步骤 + 状态」。有同学可能会说：WebSocket 实时推送呢？那是拓展，公开课再讲；今天先把「读得到、看得懂」做通。你点一次运行，助手位跟着变——这就是证据。状态看不见，驾驶舱退化成黑盒。自检：不开代码，能说出上一步跑到哪吗？读 runs/ 一行就是最小仪表盘；没有它，用户只能盲开。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。，对吧。

  - id: "06-gate-in-page"
    ppt:
      - "眉题：06 GATE · 第三要件：闸在页内"
      - "讲解图：v2-panorama.svg"
      - "草稿渲染进助手位"
      - "批准 / 驳回写回结果"
    text: |
      第三件，闸在页内——FDE 硬指标。确认界面必须在驾驶舱里：B 的草稿渲染进助手位，批准、驳回两个按钮，点了就写回。有同学可能会说：去 Agent Lab 点不行吗？不行。Lab 是工作台，驾驶舱是交付面——用户、老板、验收都在这。闸在页内，才叫「拦得住」。咱们宁可做一个能点批准的真闸，也不要三个半成品。答辩评委就盯：按钮在不在页内、有没有写回、runs/ 有没有记录。Lab 里点不算，必须在页内点。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，嘛。

  - id: "07-one-at-a-time"
    ppt:
      - "眉题：07 ONE BY ONE · 一件通了再做下一件"
      - "讲解图：v2-panorama.svg"
      - "对话区 + 日志行 + 两按钮"
      - "别三个半成品堆一起"
    text: |
      动手顺序：一件通了再做下一件。对话区接 Agent，状态读 runs/ 最新行，闸就是草稿加两个按钮——别三个同时开、三个都没通。有同学可能会慌：三十分钟够吗？够，如果你守纪律。先做出「能点、能看、能拦」的最小闭环，再叠第二件。样式复用驾驶舱既有卡片，助手位别像外来的。对照屏幕：助手位应该像本来就在那，不是临时贴纸。三十分钟够，先闭环再叠功能；一件真通，胜过三件假亮。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，对吧。

  - id: "08-priority-fallback"
    ppt:
      - "眉题：08 PRIORITY · 闸 > 状态 > 唤起"
      - "讲解图：v2-panorama.svg"
      - "降级：步骤 + 确认按钮 + Lab 回填"
      - "打通人-Agent-驾驶舱回路"
    text: |
      时间不够？优先级记死：闸大于状态大于唤起。对话区真接不通？降级——助手位展示当前步骤加确认按钮，指令复制到 Agent Lab 执行，结果回填。思想不变：打通人、Agent、驾驶舱的信息回路。有同学可能会说：降级算不算完？算，只要你诚实标注、演示路径说得清。答辩就说：「唤起走 Lab 回填，闸和状态在驾驶舱闭环。」降级不是认输，是诚实交付；回路不断，比堆假功能强。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，好吗？呢。

  - id: "09-close"
    ppt:
      - "眉题：09 TAKEAWAY · 全景自查"
      - "讲解图：v2-panorama.svg"
      - "六区块 + Agent + 三 Skill 全亮"
      - "助手位是驾驶位，不是摆设"
    text: |
      同学们，本节先到这里。做完对照 V2.0 全景图逐个打勾：六个区块、Agent、三件 Skill——全亮，你的 V2.0 就成了。我问三句，你们心里过一遍：助手位能唤起吗？状态读得到吗？闸能在页内点批准驳回吗？答得含糊就回去补一件真的，别带三个半成品进答辩。样式复用既有卡片。带走一句：助手位是驾驶位，不是摆设——状态看得见、刹车踩得到，才叫接入。下一节拿十条证据自证，全亮再上台。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，对吧。

