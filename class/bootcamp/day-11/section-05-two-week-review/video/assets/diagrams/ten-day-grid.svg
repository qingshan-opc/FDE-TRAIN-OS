<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-label="十天演进图">
  <defs>
    <linearGradient id="tg-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f24e54"/><stop offset="100%" stop-color="#ff9b9b"/>
    </linearGradient>
    <linearGradient id="tg-viol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f52a0"/><stop offset="100%" stop-color="#8f83d8"/>
    </linearGradient>
    <linearGradient id="tg-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a8f74"/><stop offset="100%" stop-color="#1cd5b0"/>
    </linearGradient>
    <linearGradient id="tg-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0479e"/><stop offset="100%" stop-color="#f277b8"/>
    </linearGradient>
    <linearGradient id="tg-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f9e44"/><stop offset="100%" stop-color="#57cc6a"/>
    </linearGradient>
    <pattern id="tg-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="tg-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#231f20" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1040" height="450" fill="#ffffff"/>
  <rect width="1040" height="450" fill="url(#tg-dots)"/>
  <circle cx="60" cy="400" r="66" fill="rgba(13,148,136,.05)">
    <animate attributeName="r" values="66;78;66" dur="10s" repeatCount="indefinite"/>
  </circle>

  <text x="1004" y="20" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="rgba(35,31,32,.4)">10-DAY MATRIX</text>

  <!-- column headers -->
  <g text-anchor="middle" font-family="'SF Mono',Menlo,monospace">
    <text x="123" y="36" font-size="12.5" font-weight="700" fill="#231f20">D1</text>
    <text x="123" y="56" font-size="9.5" fill="rgba(35,31,32,.45)">认知</text>
    <text x="261" y="36" font-size="12.5" font-weight="700" fill="#231f20">D2</text>
    <text x="261" y="56" font-size="9.5" fill="rgba(35,31,32,.45)">V0.1</text>
    <text x="399" y="36" font-size="12.5" font-weight="700" fill="#231f20">D3</text>
    <text x="399" y="56" font-size="9.5" fill="rgba(35,31,32,.45)">V0.2</text>
    <text x="537" y="36" font-size="12.5" font-weight="700" fill="#231f20">D4</text>
    <text x="537" y="56" font-size="9.5" fill="rgba(35,31,32,.45)">V0.3</text>
    <text x="675" y="36" font-size="12.5" font-weight="700" fill="#231f20">D5</text>
    <text x="675" y="56" font-size="9.5" fill="rgba(35,31,32,.45)">V0.4</text>
    <text x="813" y="36" font-size="12.5" font-weight="700" fill="#231f20">D6</text>
    <text x="813" y="56" font-size="9.5" fill="#0d9488" font-weight="700">V1.0</text>
    <text x="951" y="36" font-size="12.5" font-weight="700" fill="#231f20">W2</text>
    <text x="951" y="56" font-size="9.5" fill="#0d9488" font-weight="700">V2.0</text>
  </g>

  <!-- row labels -->
  <g font-family="'SF Mono',Menlo,monospace" font-size="11.5">
    <text x="8" y="113" fill="#f24e54" font-weight="700">前端</text>
    <text x="8" y="179" fill="#5f52a0" font-weight="700">接口</text>
    <text x="8" y="245" fill="#0a8f74" font-weight="700">数据库</text>
    <text x="8" y="311" fill="#e0479e" font-weight="700">模型</text>
    <text x="8" y="377" fill="#2f9e44" font-weight="700">Agent</text>
  </g>

  <!-- cells by column (staggered fade-in) -->
  <g font-family="'SF Mono',Menlo,monospace" text-anchor="middle">
    <!-- D1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.45s" fill="freeze"/>
      <g><rect x="64" y="80" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="123" y="113" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="64" y="146" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="123" y="179" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="64" y="212" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="123" y="245" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="64" y="278" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="123" y="311" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="64" y="344" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="123" y="377" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
    </g>
    <!-- D2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.45s" fill="freeze"/>
      <g><rect x="202" y="80" width="118" height="56" rx="10" fill="rgba(242,78,84,.14)"/><text x="261" y="113" font-size="10.5" fill="#c92f3d">模拟数据</text></g>
      <g><rect x="202" y="146" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="261" y="179" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="202" y="212" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="261" y="245" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="202" y="278" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="261" y="311" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="202" y="344" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="261" y="377" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
    </g>
    <!-- D3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.45s" fill="freeze"/>
      <g filter="url(#tg-sh)"><rect x="340" y="80" width="118" height="56" rx="10" fill="url(#tg-rose)"/><text x="399" y="113" font-size="10.5" fill="#fff" font-weight="700">真数据</text></g>
      <g><rect x="340" y="146" width="118" height="56" rx="10" fill="rgba(95,82,160,.14)"/><text x="399" y="179" font-size="10.5" fill="#4a3f8a">模拟数据</text></g>
      <g><rect x="340" y="212" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="399" y="245" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="340" y="278" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="399" y="311" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="340" y="344" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="399" y="377" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
    </g>
    <!-- D4 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.45s" fill="freeze"/>
      <g filter="url(#tg-sh)"><rect x="478" y="80" width="118" height="56" rx="10" fill="url(#tg-rose)"/><text x="537" y="113" font-size="10.5" fill="#fff" font-weight="700">真数据</text></g>
      <g filter="url(#tg-sh)"><rect x="478" y="146" width="118" height="56" rx="10" fill="url(#tg-viol)"/><text x="537" y="179" font-size="10.5" fill="#fff" font-weight="700">真数据</text></g>
      <g><rect x="478" y="212" width="118" height="56" rx="10" fill="rgba(28,213,176,.16)"/><text x="537" y="245" font-size="10.5" fill="#0a8f74">已入库</text></g>
      <g><rect x="478" y="278" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="537" y="311" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
      <g><rect x="478" y="344" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="537" y="377" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
    </g>
    <!-- D5 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.45s" fill="freeze"/>
      <g filter="url(#tg-sh)"><rect x="616" y="80" width="118" height="56" rx="10" fill="url(#tg-rose)"/><text x="675" y="113" font-size="10.5" fill="#fff" font-weight="700">真数据</text></g>
      <g filter="url(#tg-sh)"><rect x="616" y="146" width="118" height="56" rx="10" fill="url(#tg-viol)"/><text x="675" y="179" font-size="10.5" fill="#fff" font-weight="700">真数据</text></g>
      <g filter="url(#tg-sh)"><rect x="616" y="212" width="118" height="56" rx="10" fill="url(#tg-mint)"/><text x="675" y="245" font-size="10.5" fill="#fff" font-weight="700">已入库</text></g>
      <g><rect x="616" y="278" width="118" height="56" rx="10" fill="rgba(224,71,158,.14)"/><text x="675" y="311" font-size="10.5" fill="#c22e82">接电中</text></g>
      <g><rect x="616" y="344" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="675" y="377" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
    </g>
    <!-- D6 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.45s" fill="freeze"/>
      <g filter="url(#tg-sh)"><rect x="754" y="80" width="118" height="56" rx="10" fill="url(#tg-rose)"/><text x="813" y="113" font-size="10.5" fill="#fff" font-weight="700">已上线</text></g>
      <g filter="url(#tg-sh)"><rect x="754" y="146" width="118" height="56" rx="10" fill="url(#tg-viol)"/><text x="813" y="179" font-size="10.5" fill="#fff" font-weight="700">已上线</text></g>
      <g filter="url(#tg-sh)"><rect x="754" y="212" width="118" height="56" rx="10" fill="url(#tg-mint)"/><text x="813" y="245" font-size="10.5" fill="#fff" font-weight="700">已上线</text></g>
      <g filter="url(#tg-sh)"><rect x="754" y="278" width="118" height="56" rx="10" fill="url(#tg-pink)"/><text x="813" y="311" font-size="10.5" fill="#fff" font-weight="700">已上线</text></g>
      <g><rect x="754" y="344" width="118" height="56" rx="10" fill="rgba(35,31,32,.045)"/><text x="813" y="377" font-size="11" fill="rgba(35,31,32,.28)">—</text></g>
    </g>
    <!-- W2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.45s" fill="freeze"/>
      <g filter="url(#tg-sh)"><rect x="892" y="80" width="118" height="56" rx="10" fill="url(#tg-rose)"/><text x="951" y="113" font-size="10.5" fill="#fff" font-weight="700">V2.0</text></g>
      <g filter="url(#tg-sh)"><rect x="892" y="146" width="118" height="56" rx="10" fill="url(#tg-viol)"/><text x="951" y="179" font-size="10.5" fill="#fff" font-weight="700">V2.0</text></g>
      <g filter="url(#tg-sh)"><rect x="892" y="212" width="118" height="56" rx="10" fill="url(#tg-mint)"/><text x="951" y="245" font-size="10.5" fill="#fff" font-weight="700">V2.0</text></g>
      <g filter="url(#tg-sh)"><rect x="892" y="278" width="118" height="56" rx="10" fill="url(#tg-pink)"/><text x="951" y="311" font-size="10.5" fill="#fff" font-weight="700">V2.0</text></g>
      <g filter="url(#tg-sh)">
        <rect x="892" y="344" width="118" height="56" rx="10" fill="url(#tg-green)"/>
        <rect x="888" y="340" width="126" height="64" rx="13" fill="none" stroke="#2f9e44" stroke-width="1.6" opacity=".45">
          <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <text x="951" y="377" font-size="10.5" fill="#fff" font-weight="700">已上岗</text>
      </g>
    </g>
  </g>

  <!-- milestones -->
  <g text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5">
    <text x="123" y="428" fill="rgba(35,31,32,.5)">世界观日 · 无代码</text>
    <text x="813" y="428" fill="#0d9488" font-weight="700">★ V1.0 上线</text>
    <text x="951" y="428" fill="#0d9488" font-weight="700">★ V2.0 能干活</text>
  </g>
</svg>
