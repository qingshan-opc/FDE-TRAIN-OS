day: 5
project: 用一项微迭代复现完整软件开发流程
project_brief: 学员在 Day1 到 Day4 已发布项目上选择一项小而真实的改进。 先由产品经理确认用户问题和范围，再依次交给 UI、前端、后端、测试和运维。 每个岗位只读取上游交付物，在人工确认后执行，并留下可验证文件与运行证据。
  最后回到产品经理完成业务终验，同时生成完整流程复盘。
