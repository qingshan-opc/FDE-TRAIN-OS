day: 9
project: Skill 工程化 + Agent Loop
project_brief: 'Skill v1 边界+注入测试；必须落地 agent/loop.py（tool_calls 闭环，max_turns=20）。粘贴 teaching/week2-cockpit-agent/prompts/04-agent-loop.md。GATE 8：loop 日志 + 选错口答。'
resources:
- id: dg-exception
