day: 1
project: AI 时代的产品经理
project_brief: 角色周第一棒。今天看懂 AI 时代 PM 的价值位移（写贬值、定方向+做验收升值），学会 PRD 最小骨架（用户故事+可衡量验收标准+目标平台），解剖 PM Agent 提示词的四要素+两接口，然后亲手用它为「部门周报助手」跑出一份迷你
  PRD 并过闸。这份 PRD 明天原样交给架构师提示词，是后四天所有交付物的源头。
resources:
- id: tk-readme
  title: 提示词工具包 · 使用说明
  kind: download
  summary: 四要素 + 两接口，五份角色提示词怎么用
  url: /course-assets/resources/prompt-toolkit/README.md
- id: tk-pm
  title: 提示词下载 · PM Agent（产品经理）
  kind: download
  summary: 整份粘进 AI 工具即用的产品经理提示词
  url: /course-assets/resources/prompt-toolkit/PM_Agent_Prompt.md
- id: prd-cheatsheet
  title: 速查卡 · PRD 最小骨架
  kind: doc
  summary: 四根骨头一页速查：产品概述 / 目标用户与平台 / 用户故事句式 / 可衡量验收标准
  url: /course-assets/resources/cheatsheet-prd.md
capsule_extra:
  c1:
    resource_ids:
    - tk-readme
    quiz:
    - - AI 时代，产品经理的哪部分工作正在贬值？
      - - 写 PRD、写纪要等产出型工作
        - 定方向
        - 做验收
      - 0
      - 「写」的成本被 AI 压到趋近于零，贬值的是产出型工作；定方向和做验收反而升值。
    - - 餐厅类比中，AI 时代的 PM 更像哪个角色？
      - - 后厨的万能厨子
        - 坐在前厅点菜并验收的人
        - 餐厅的装修工人
      - 1
      - AI 是万能厨子，PM 挪到了「点菜并验收」的位置——厨子越快，点菜的人越关键。
    tools:
    - name: FDE 角色认知卡
      note: 一句话：定方向 + 做验收，就是你十天后的人设
    - name: 浪潮价目便签
      note: 六波浪潮各一句「谁变贵/谁变便宜」，复述用
  c2:
    resource_ids:
    - prd-cheatsheet
    quiz:
    - - 「帮我做个周报工具」不能直接开工，最根本的原因是？
      - - 它是模糊点子，工程师看完必须回来追问才能动手
        - 这个点子不够创新
        - 没有指定用哪个 AI 模型来实现
      - 0
      - 可执行需求的判据是「看完不用回来问第二遍」；模糊点子全是窟窿，必须翻译成 PRD。
    - - 以下哪条是合格的验收标准？
      - - 周报要好用，界面要美观
        - 生成一份周报不超过 2 分钟，且本周已提交数据零遗漏
        - 周报要让领导满意
      - 1
      - 验收标准的铁律是可衡量——有数字或可数判据，第三方能客观判过/不过。
    tools:
    - name: 用户故事句式卡
      note: 作为…我想要…以便…，三格缺一不可
  c3:
    resource_ids:
    - tk-pm
    quiz:
    - - 提示词中「角色定位：10 年以上经验的资深产品经理」这句的主要作用是？
      - - 决定 AI 回答的专业水位
        - 决定输出文件保存到哪个路径
        - 决定使用哪家公司的模型
      - 0
      - 角色定位设定功力与视角，直接影响回答的专业深度——改成「实习生」产出立刻变水。
    - - 提示词的「两接口」指的是？
      - - 它从哪里读需求（Input Sources）和交付给谁（Output Targets）
        - 前端接口和后端接口
        - 两个不同的 AI 工具
      - 0
      - 两接口定协作：输入口接上游的点子，输出口接下游的设计师与工程师——提示词在流水线上不孤立。
    tools:
    - name: 提示词解剖四格表
      note: 角色定位 / 核心任务 / 关键输入 / 关键输出
      url: /course-assets/resources/prompt-toolkit/README.md
  c4:
    resource_ids:
    - tk-pm
    quiz:
    - - 把点子输入 PM 提示词后，符合预期的第一步行为是？
      - - 先反问你几个澄清问题
        - 直接生成一份三千字 PRD
        - 拒绝回答并要求付费
      - 0
      - 工作流程第一条就是「首先通过提问深入理解」——先澄清再动笔是好提示词的标志。
    - - 生成的 PRD 缺少验收标准时，正确的做法是？
      - - 手动在文档里补写几条
        - 在对话中补充约束，让它重新生成
        - 换另一个 AI 工具重新粘贴
      - 1
      - 迭代口诀：产出不对先改约束再重生成——手改产物，下一版迭代全丢。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '背景：我在参加 FDE 训练营 Day 1（AI 时代的产品经理）。我的产品点子是「部门周报助手」——帮部门负责人自动汇总一周数据、生成周报的小工具。我已经下载了 PM Agent 提示词（PM_Agent_Prompt.md），现在要在你的帮助下跑出一份迷你
        PRD。

        任务：请你先完整阅读我粘贴的 PM Agent 提示词并代入该角色。然后不要直接生成 PRD——先向我提出 3 个澄清问题（建议围绕：数据从哪里来、谁使用/多少人用、周报发到哪里/什么平台）。等我逐一回答后，再生成迷你 PRD。

        要求：迷你 PRD 必须包含——1）产品概述一段话；2）目标用户与目标平台（明确写出 Web/小程序/移动端）；3）至少 3 条用户故事，每条都是「作为……我想要……以便……」完整句式；4）每条用户故事配可衡量的验收标准（有数字或可数判据，例如「生成不超过
        2 分钟」「数据零遗漏」）。生成后我会用这三要素检查，缺项我会在对话里补约束让你重新生成，而不是手动改文档。

        '
      checklist:
      - 已把 PM_Agent_Prompt.md 整份粘进本机 AI 工具（新会话、一字未改）
      - AI 先提出了至少 3 个澄清问题，且我已逐条认真回答
      - 生成的迷你 PRD 含 ≥3 条完整句式用户故事
      - 每条用户故事配了可衡量的验收标准，文档写明目标平台
      - 至少完成一轮「检查 → 补约束 → 重生成」迭代
      suggested_questions:
      - AI 没有反问我就直接开写了，怎么办？
      - 我可以用自己的产品点子代替周报助手吗？
      - 验收标准里的「可衡量」到底怎么判断？
      template_resource_id: tk-pm
    tools:
    - name: 「部门周报助手」点子卡
      note: 也可换成你自己的产品点子
  c5:
    resource_ids:
    - prd-cheatsheet
    quiz:
    - - 迷你 PRD 过闸的三要素是？
      - - 用户故事、可衡量验收标准、目标平台
        - 市场规模、竞品分析、商业模式
        - 配色方案、字体规范、图标库
      - 0
      - 过闸只看三要素：≥3 条完整句式用户故事、每条可衡量验收标准、写明目标平台——它们是明天架构师的输入。
    - - 日级快测的过线标准是？
      - - 6 题全对
        - 6 题对 4 题
        - 6 题对 3 题
      - 1
      - 日级快测过线为 4/6，且当晚可重测——快测是查漏，不是一锤定音。
    tools:
    - name: PRD 过闸三要素清单
      note: 用户故事 · 验收标准 · 目标平台，缺一不可
    - name: 快测范围卡
      note: 考点全部来自今天前五节
quiz:
- - AI 三分钟就能写一份 PRD，为什么产品经理反而更重要了？
  - - 因为 PRD 字数要求变多了
    - 因为「写」贬值后，定方向和做验收成了更稀缺的能力
    - 因为 AI 写的 PRD 一律不能用
  - 1
  - AI 压垮的是「写」的价值；选方向、卡质量这两件要人负责的事随之升值。
- - 用餐厅类比理解 AI 时代的分工，下列哪个对应关系正确？
  - - AI 是点菜的人，PM 是厨子
    - AI 是万能厨子，PM 是点菜并验收的人
    - AI 是餐厅老板，PM 是服务员
  - 1
  - AI 负责快速产出（厨子），PM 负责决定做什么、判合格与否（点菜并验收）。
- - PRD 最小骨架的「四根骨头」是？
  - - 产品概述、目标用户与平台、用户故事、验收标准
    - 市场分析、竞品对比、财务预测、融资计划
    - 配色、字体、图标、动效
  - 0
  - 最小骨架回答四个问题：这是什么、给谁在哪用、拿它做什么、做到什么程度算合格。
- - 「作为部门负责人，我想要一键汇总本周数据，以便周一例会前拿到周报」——这句用户故事缺了哪一格？
  - - 缺「谁」
    - 缺「做什么」
    - 三格齐全，什么都不缺
  - 2
  - 用户故事句式为「作为谁/想要做什么/以便得到什么价值」，此句三格完整。
- - 「周报要好用，领导要满意」为什么不能算验收标准？
  - - 语气不够正式
    - 不可衡量——第三方无法客观判出「过/不过」
    - 没有提到具体技术栈
  - 1
  - 验收标准铁律是可衡量：有数字或可数判据，交给陌生人也能客观判定。
- - 用 PM 提示词生成的 PRD 少了目标平台一节，按迭代口诀应该怎么做？
  - - 手动把平台补进文档
    - 在对话中补约束「PRD 必须包含目标平台列表」并重生成
    - 删掉提示词里的输出格式要求
  - 1
  - 提示词是源码、产物是编译结果——改约束重生成，改动才能延续到下一版。
lab:
  primary_files:
  - PRD.md
  prompt: '你是学员的需求整理助手。背景：FDE 训练营 Day 1，学员要用产品经理视角完成迷你 PRD，贯穿案例是「部门周报助手」（帮部门负责人自动汇总一周数据、生成周报），学员也可自带点子。任务：通过提问引导学员在工作区生成 PRD.md——包含产品概述、目标用户与平台、至少
    3 个用户故事（作为……我想要……以便……完整句式）、每个故事的可衡量验收标准（有数字或可数判据）、明确的目标平台。要求：先问 3 个澄清问题（数据来源、使用人群、交付平台/渠道）再动笔；不替学员编造需求，只引导与排版；生成后提醒学员对照三要素自查，缺项时引导其补充约束后重新生成，而不是直接手改文档。

    '
  rubric:
  - check: file_exists
    args:
      path: PRD.md
  - check: text_contains
    args:
      path: PRD.md
      needle: 用户故事
  - check: text_contains
    args:
      path: PRD.md
      needle: 验收标准
nodes_lab: 迷你 PRD（部门周报助手）
