camp_version: v0.7
day: 5
title: 讲清产品怎么做出来，完成第一次交付
week: 1
project: 产品复盘、本地交付、五分钟讲解和第一周验收
project_brief: 前四天先做后懂，第五天把自己的真实项目摊开，系统讲清需求、原型、前端、接口、数据库、测试和交付如何连接；随后由运维和项目经理协助完成本地交付、README、路演和综合验收。
review_checklist:
- 项目按 README 在本地可运行，但未夸大为公网已上线
- 学员能从业务问题讲到页面、接口、数据库、测试和交付
- 完整演示一条记录进入 SQLite 并改变驾驶舱统计
- 七岗位交接和至少一次纠偏、一次缺陷闭环有证据
- AI 区和预留接口明确留给第二周，当前样例均标演示数据
