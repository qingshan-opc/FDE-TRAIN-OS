title: "第九天 · 第 4 节 · 编排 + 确认点 + 执行日志"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · 施工三步"
      - "讲解图：orchestration-confirm.svg"
      - "orchestration.md · 三件工具齐"
      - "串联 · 装闸 · 记日志"
    text: |
      同学们好，我是你们的老师404。图纸在 orchestration.md，三件 Skill 已经齐。先问一句：你现在能口头说出 A→B→闸→C 的顺序吗？想三秒，顺序说不清就别急着跑。有同学可能会说：404老师，直接让 Agent 跑不行吗？不行——咱们今天做的是 workflow，顺序定死，别让它现场改流程或即兴表演。施工就三步：串联、装闸、记日志。来，看屏幕讲解图，三步对应三条指令；缺一步，后面验收一定红。先把 resources.md 里的模板打开，改名字就能用，对吧。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "02-wire-skills"
    ppt:
      - "眉题：02 WIRE · 第一步串联"
      - "讲解图：orchestration-confirm.svg"
      - "workflow 指令 · 顺序写死"
      - "A 产出 → 喂给 B"
    text: |
      第一步串联：给 Agent 一条 workflow 指令，顺序写死——先 A 拉数，再 B 生成草稿，A 的输出原样喂给 B。指令里别写「看着办」，要写调用顺序和数据怎么传。有同学可能会问：B 的产出放哪？做成确认界面要用的草稿文件，字段里带关键数字和风险标红——第二节讲过的最低决策信息。听见了吗？串联解决「怎么连」；还没到你点头发送。resources.md 里有模板，可以直接改名字用；传数据时字段名要和 Skill 说明书一致，别临时改名，嘛。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "03-install-gate"
    ppt:
      - "眉题：03 GATE · 第二步装闸"
      - "讲解图：orchestration-confirm.svg"
      - "不可撤回前 · Agent 必须停"
      - "发 or 驳 · 一个字"
    text: |
      第二步装闸：在不可撤回步骤前，Agent 必须停下，把草稿、关键数字、风险标红摆在你面前，等你说一个字——发，或者驳回。你不说话，流水线就停在确认界面；如果它自作主张发出去了，说明第三节发送类 Skill 的「等待确认」没写进第一行，回去修。有同学可能会说：我信任 B 啊。信任归信任，对外动作必须过闸——这是工程纪律。编排指令里也要写「到闸停止，等人工」，双保险。闸界面信息和第二节三问对齐，缺数字就别怪自己盲批，对吧。实测时故意沉默十秒，看它会不会偷跑——偷跑就回第三节修守卫。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "04-exec-log"
    ppt:
      - "眉题：04 LOG · 第三步记日志"
      - "讲解图：orchestration-confirm.svg"
      - "runs/YYYYMMDD.md"
      - "时间 · 步骤 · 结果"
    text: |
      第三步记日志：每执行一步，往 runs/ 追加一行——时间、步骤、结果。指令里写清楚「每步执行后追加到 runs/YYYYMMDD.md」，Agent 来记，你负责抽查。成功记 ✓ 和文件名，等待记 ⏸，批准记谁批的，驳回记原因。有同学可能会问：日志是我手打吗？不用——写进 workflow 指令，让 Agent 自动追加。能回放，才算有案底；关掉别的窗口，只看日志也能复述今天发生了什么。来，对照第二节示例行的格式；一行一事，别把整段草稿贴进日志，呢。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "05-approve-path"
    ppt:
      - "眉题：05 APPROVE · 批准路径实测"
      - "讲解图：orchestration-confirm.svg"
      - "A → B → 停 → 发 → C"
      - "到闸自动停 · 验收点一"
    text: |
      跑通先走批准路径：A 跑完、B 出草稿、到闸自动停——你不说话它就不动，这是第一个验收点。你说「发」，C 才执行发送，日志记下批准和发送结果。有同学可能会说：停了一下算不算过？算，但还要查日志有没有确认行、C 有没有真等批准。如果 Agent 跳过闸，九成是发送 Skill 守卫或编排指令少写了「停」。听见了吗？批准路径绿了之后，别急着收工——驳回路径必须再测一遍；只测批准，等于闸只装了一半，对吧。批准路径跑通后，在实测表第一行打勾再测驳回。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "06-reject-loop"
    ppt:
      - "眉题：06 REJECT · 驳回要有回路"
      - "讲解图：orchestration-confirm.svg"
      - "打回 B 重做 · 日志记驳回"
      - "闸不是断头路"
    text: |
      第二条必测：驳回路径。比如你说「驳回：第二段数字不对」——流水线得打回 B 重做，不是卡在原地装死。草稿文件名带版本号更好，draft-v2 和 v1 别混；日志记下这次驳回和重做。有同学可能会问：闸拦住一次不算本事吧？对，驳回了能退回重做还留下记录，这条线才算有回路。没有回路的闸是断头路——人不敢驳，因为驳了没法改。来，实测表上批准、驳回各打勾；驳回后 B 出新草稿，再停闸，再走一遍，嘛。驳回话术写进 orchestration 指令，别每次临场编理由。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "07-log-replay"
    ppt:
      - "眉题：07 REPLAY · 只看日志复述"
      - "讲解图：orchestration-confirm.svg"
      - "停不停 · 动不动 · 回不回"
      - "三个验收点全绿"
    text: |
      最后两分钟做日志回放：关掉屏幕别的窗口，只打开 runs/ 日志，复述今天发生了什么——几点拉数、几点出草稿、谁批准、谁发送、有没有驳回。三个验收点：到闸停不停、批了动不动、驳回了回不回得来。全绿，第五节闸口实测才有底气。有同学可能会说：日志太长看不懂。那就失败了——每行只保留时间、步骤、结果，别贴整段草稿。听见了吗？会跑流水线不够，会读日志才算 FDE 的运维眼；日志读不懂，等于白跑，对吧。回放时按时间顺序读，跳行读等于没回放。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

  - id: "08-close"
    ppt:
      - "眉题：08 TAKEAWAY · 心里过三问"
      - "讲解图：orchestration-confirm.svg"
      - "施工三步 · 双路径 · 日志回放"
      - "预告：闸口实测验收"
    text: |
      同学们，本节先到这里。我问三句，你们心里答得上，这节才算听明白。第一：施工哪三步？串联、装闸、记日志。第二：两个必卡住验收点？到闸自动停、驳回有回路。第三：日志回放查啥？停、动、回三条是否全绿。含糊就回看 orchestration 指令和 runs/ 文件。带走一句——workflow 跑通不算完，批准加驳回都实测、日志能复述，才算交付。下一节闸口实测，咱们见真章；今天把 runs/ 文件存好，别关窗口就丢，呢。runs/ 文件提交前再扫一眼：有没有批准行、有没有驳回行。 来，把屏幕上的要点对照自己的流程图，缺哪格现在补哪格，别留到施工再返工，对吧。

