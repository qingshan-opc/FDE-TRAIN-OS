title: "第六天 · 第 1 节 · 生态四层地图：你在哪一层"
segments:
  - id: "01-open"
    ppt:
      - "01 MAP · 生态四层地图"
      - "讲解图：llm-ecosystem.svg（总览）"
      - "LLM 理论日 · 先定位「你在哪一层」"
    text: |
      同学们，今天进入大模型理论日，也就是LLM大模型。前五天咱们用过 ChatGPT、Cursor、cluade等工具写过 PRD，也就是需求文档——今天不给新工具，咱们先把行业日常那 18 个词装进脑子里。第一节呢，咱们先看一张生态四层地图：模型层、工具层、应用层、你这一层。对吧，得先知道自己在哪一格。
  - id: "02-llm"
    ppt:
      - "02 LLM · 大语言模型"
      - "机制：预测下一个 Token · 接龙式生成"
      - "能力：生成 / 理解 / 推理 · 边界：非事实库"
      - "代表：GPT-4 · Claude · Qwen · DeepSeek"
    text: |
      首先呢，最底下是 LLM，大语言模型。本质就一件事：预测下一个词。GPT-4、Claude、Qwen、DeepSeek——名字不同，机制一样。生成、理解、推理，都从词语接龙长出来的。请同学们记住一个关键点：LLM大模型是认字很快的实习生，不是核实过的事实库。具体它做的工作啊，还是需要人为结果负责。
  - id: "03-open-closed"
    ppt:
      - "03 ACCESS · 模型怎么拿到？"
      - "闭源 API：OpenAI / Anthropic · endpoint · 按 Token 付费"
      - "开源权重：Llama / Qwen · 自部署 · 成本·隐私·能力权衡"
    text: |
      同学们，刚刚讲了第一层啊，现在我们往上走，模型怎么拿到？闭源，也就是不开源的大模型，如gpt啊，Anthropic的模型啊，他们的 API 像调水电——OpenAI、Anthropic 给你 endpoint，按 Token 付钱，数据走他们的算力中文。开源权重像买原材料——Llama、Qwen 权重能下载，自己部署，成本、隐私、能力三角权衡。咱们的训练营做的产品，不要求接太高端的模型，如deepseek-可能需要充值，第二个方案呢，就是咱们使用免费的api，需要同学们咱们实战的时候去注册一下。
  - id: "04-multimodal"
    ppt:
      - "04 MULTIMODAL · 多模态"
      - "语言大模型：文本进 · 文本出"
      - "多模态示例：GPT-4o 看图 · Suno 出歌"
      - "本课边界：驾驶舱 = 文本能力（摘要·问答·Tool Call）"
    text: |
      刚刚讲了大模型以及大模型的集成方式，现在呢，我们简单的说一下多模态，同学们啊，在我们日常生活中，我们会拍照，会录制短视频，那么这种照片，视频本质也是一种文档格式，前面我们说了大模型是怎么进行组织语言，产生文字的，一般的，只支持语言的模型，我们称之为语言大模型。而GPT-4o 能看图，Suno 能出歌，就是指模型的多态性。本课驾驶舱只用文本能力：摘要、问答、Tool Call。知道边界就行：别拿文本模型硬做它不擅长的事，比如让他唱歌，肯定搞不来的，对吧。
  - id: "05-four-layer"
    ppt:
      - "05 FOUR LAYERS · 应用 ↔ 模型 四层结构"
      - "讲解图：llm-ecosystem.svg（全屏）"
      - "应用层 · 协议与工具层 · 平台层 · 模型层"
    text: |
      本节课呢，咱们主要是讲大模型以及相关的概念，大家仔细看屏幕上的图，我们将应用与模型的关系，从上到下分为了4层结构，也就是我们带同学们实践的课程，最上面呢，是应用层，你的聊天助手，ai编程工具，行业垂直应用，以及我们做的部门驾驶舱，都是在应用层。再往下，就是协议与工具层，这层呢，主要是如何控制大模型，让他按照我们的思想来，他是一套完全工程化的理念，接下来我们讲述的概念，基本都围绕这一段来。
  - id: "06-close"
    ppt:
      - "06 TAKEAWAY · 带走一问"
      - "我现在在生态的哪一层？"
      - "改 Prompt → 协议与工具层 · 选模型 → 模型层 · 部署 → 平台层 · 驾驶舱 → 应用层"
      - "下一节：Token · 上下文窗口 · 幻觉"
    text: |
      好了，现在我们收个尾：关于大模型与应用之间的关系，相信同学们基本也都了解差不多了。如果不太理解，我们需要反复观摩，请教老师。
