      - 作品段掐表 ≤3′，且练过兜底
      - 提纲进 Git
  - id: c4
    title: 答辩与互评
    minutes: 30
    form: 答辩
    content_ref: class/bootcamp/day-11/section-04-defense/lesson.md
    content: '同学们，上台了。每人八分钟，作品三加架构三加故事二，响铃就停。规则简单：讲得清、拦得住、查得了、迭代真——四个维度，就是你的毕业成绩单。第一个上的别紧张，评委还没建立比较基准呢，对吧。

      听的人别走神，互评表每个分都要配一个细节——写不出细节，说明你也没听懂，分也不算数。讲得清是听懂做了什么、为什么；拦得住是确认闸真实演示；查得了是日志证据随手能打开；迭代真是 bug 故事经得起追问，对吧。

      演示挂了不扣分，慌了才扣分——指着昨日成功日志讲，那就是你的第九条证据。被问倒了？这个我现在不会，我的打算是……三件套回答永远安全。互评按细节说话，分低但写得准是帮人，闭眼打高分是害人，咱们都懂。

      GATE 10：答辩完成、互评收回至少两份、导师抽查十条证据三条、闸口演示真实。过了这关，授予 FDE 称号——课程介绍页上写的那个人，今天是你。带走一句：上台不是表演完美，是展示你会交付，对吧。'
    practice: '完成标志：

      [ ] 完成自己的 8 分钟答辩

      [ ] 交出 ≥2 份带细节的互评表

      [ ] 迭代日志记下被问住的问题'
    resource_ids:
    - dg-v2-panorama
    - dg-orchestration
    tools:
    - name: 互评表
      note: 证据 / 架构 / 表达 / 诚实度
    quiz:
    - - 答辩演示中途系统挂了，正确做法？
      - - 慌神道歉下台
        - 启用兜底：指着 runs/ 日志讲成功运行记录
        - 说网络不好跳过
      - 1
      - 日志能回放——事故变成第九条证据的现场版。
    - - GATE 10 互评要求？
      - - 不需要
        - 收回至少 2 份互评表
        - 只互评老师
      - 1
      - 互评是答辩的组成部分——给别人反馈也是能力。
    - - 评委必问「Agent 什么时候会选错」，最佳答法？
      - - 永远不会
        - 结合 Day 8 日志：工具描述重叠/缺边界/任务歧义
        - 换模型就行
      - 1
      - 选错图谱 + 你自己的注入测试记录——最有说服力的答案。
    media:
    - kind: video
      title: 口播课件 · 过闸验收
      object_key: documents/shared/course-media/day10-c4-defense.mp4
      poster_key: documents/shared/course-media/day10-c4-defense-poster.jpg
      duration_sec: 65
    knowledge_cards:
