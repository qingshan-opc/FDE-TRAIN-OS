      - 前端负责交互，核心规则需要后端统一执行。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '原型已经确认。现在切换到 @前端。每段完成后必须停止。


        【第 1 段｜检查现有前端】

        请读取 iteration-prd.md、iteration-ui-spec.md、ui-handoff.md 和现有前端代码。只说明入口文件、相关组件、当前请求位置和可复用部分。不要修改代码。


        【第 2 段｜提出最小改动】

        请列出准备修改的文件、每个文件的修改目的、保持不变的部分和需要后端配合的合同。输出后停止，等我回复“确认前端改动”。


        【第 3 段｜实现前端】

