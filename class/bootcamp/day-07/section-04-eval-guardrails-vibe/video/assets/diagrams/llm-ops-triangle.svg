<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-label="LLM 接入三件套：密钥、超时、降级">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="440" fill="#ffffff"/>
  <rect width="1040" height="440" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="392" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">LLM 接入三件套：密钥 · 超时 · 降级</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">OPS TRIANGLE</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="392" y="168" width="256" height="112" rx="26" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="400" y="176" width="240" height="96" rx="18" fill="url(#tlg)" filter="url(#glow)"/><text x="520" y="216" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">摘要接口</text><text x="520" y="242" font-size="10.5" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">/api/summary</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="66" width="280" height="120" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="200" y="100" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">密钥</text>
<text x="200" y="118" font-size="9.5" fill="rgba(35,31,32,.4)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">SECRET</text>
<text x="200" y="148" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">只住服务端环境变量</text>
<text x="200" y="170" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">绝不写进前端 / git</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="256" width="280" height="120" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="200" y="290" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">超时</text>
<text x="200" y="308" font-size="9.5" fill="rgba(35,31,32,.4)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">TIMEOUT</text>
<text x="200" y="338" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">AI 慢 ≠ 页面跟着卡死</text>
<text x="200" y="360" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">给 deadline，到点就切</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="700" y="66" width="280" height="120" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="840" y="100" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">降级</text>
<text x="840" y="118" font-size="9.5" fill="rgba(35,31,32,.4)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">FALLBACK</text>
<text x="840" y="148" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">AI 挂了，页面不能挂</text>
<text x="840" y="170" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">缓存摘要 / 骨架文案顶上</text>
</g>
<path d="M340 150 L414 196" stroke="rgba(13,148,136,.45)" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M340 296 L414 252" stroke="rgba(13,148,136,.45)" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M700 150 L626 196" stroke="rgba(13,148,136,.45)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="520" y="340" font-size="13.5" font-weight="800" fill="#231f20" text-anchor="middle">接入架构三件套，少一件都不准上线</text><text x="520" y="368" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">验收时要能演示：拔掉模型 key，页面其余部分照常工作，摘要区给降级文案</text><rect x="320" y="392" width="400" height="36" rx="18.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="414.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">密钥 · 超时 · 降级 = 上线门槛</text></g>
</svg>
