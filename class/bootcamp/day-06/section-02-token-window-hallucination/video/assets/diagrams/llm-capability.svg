<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="LLM 能力边界图">
<rect width="1040" height="500" fill="#f2f5f0"/>
<rect x="320" y="28" width="400" height="46" fill="#231f20"/>
<text x="520" y="57" text-anchor="middle" font-size="15" font-weight="800" fill="#f2f5f0">LLM = 预测下一个词的机器</text>
<!-- 左：会什么 -->
<rect x="50" y="100" width="450" height="290" fill="none" stroke="#2f9e44" stroke-width="2.5"/>
<text x="75" y="134" font-size="16" font-weight="800" fill="#2f9e44">✓ 会 · 可依赖</text>
<text x="75" y="172" font-size="15" font-weight="700" fill="#231f20">生成</text>
<text x="140" y="172" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">GENERATE</text>
<text x="75" y="194" font-size="12" fill="rgba(35,31,32,.6)">成文 · 成码 · 成表，风格可调</text>
<text x="75" y="240" font-size="15" font-weight="700" fill="#231f20">理解</text>
<text x="140" y="240" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">UNDERSTAND</text>
<text x="75" y="262" font-size="12" fill="rgba(35,31,32,.6)">总结 · 抽取 · 改写 · 翻译</text>
<text x="75" y="308" font-size="15" font-weight="700" fill="#231f20">推理</text>
<text x="140" y="308" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">REASON</text>
<text x="75" y="330" font-size="12" fill="rgba(35,31,32,.6)">按步骤推导 · 对比 · 分类</text>
<text x="75" y="368" font-size="11.5" fill="rgba(35,31,32,.5)">Day 5 的摘要接口，就只用这三样。</text>
<!-- 右：不会什么 -->
<rect x="540" y="100" width="450" height="290" fill="none" stroke="#f24e54" stroke-width="2.5"/>
<text x="565" y="134" font-size="16" font-weight="800" fill="#c92f3d">✗ 不会 · 要设防</text>
<text x="565" y="168" font-size="14" font-weight="700" fill="#231f20">不记事</text>
<text x="565" y="188" font-size="11.5" fill="rgba(35,31,32,.6)">每次对话从零开始——记忆是 harness 给的</text>
<text x="565" y="224" font-size="14" font-weight="700" fill="#231f20">不知真假</text>
<text x="565" y="244" font-size="11.5" fill="rgba(35,31,32,.6)">说错和说对一样自信</text>
<text x="565" y="280" font-size="14" font-weight="700" fill="#231f20">不主动</text>
<text x="565" y="300" font-size="11.5" fill="rgba(35,31,32,.6)">你不叫它它不动——循环也是 harness 给的</text>
<text x="565" y="336" font-size="14" font-weight="700" fill="#231f20">不自知</text>
<text x="565" y="356" font-size="11.5" fill="rgba(35,31,32,.6)">没有「我不确定」这个状态</text>
<!-- 底部：幻觉防线 -->
<rect x="50" y="420" width="940" height="60" fill="none" stroke="#1400ff" stroke-width="2"/>
<text x="75" y="456" font-size="13.5" font-weight="700" fill="#1400ff">幻觉是机制不是 bug：它给「最像真的」，不是「经过核实」的</text>
<g font-size="11" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">
<rect x="640" y="434" width="58" height="32" fill="#231f20"/><text x="669" y="454" text-anchor="middle" fill="#f2f5f0">RAG</text>
<rect x="710" y="434" width="80" height="32" fill="#231f20"/><text x="750" y="454" text-anchor="middle" fill="#f2f5f0">引用核对</text>
<rect x="802" y="434" width="58" height="32" fill="#231f20"/><text x="831" y="454" text-anchor="middle" fill="#f2f5f0">Eval</text>
<rect x="872" y="434" width="94" height="32" fill="#231f20"/><text x="919" y="454" text-anchor="middle" fill="#f2f5f0">人工验收</text>
</g>
</svg>
