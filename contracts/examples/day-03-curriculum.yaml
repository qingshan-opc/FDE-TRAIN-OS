    knowledge_cards:
    - id: backend-three
      term: 后端三件事
      plain: 业务规则决定能不能做，数据库负责记真账，API 负责与前端按约定对话。
      tag: 全景
    - id: backend-role-shift
      term: 后端岗位价值上移
      plain: AI 能快速生成增删改查代码，人更要负责接口合同、数据模型、安全边界和故障处理。
      tag: AI 时代
    - id: frontend-no-db
