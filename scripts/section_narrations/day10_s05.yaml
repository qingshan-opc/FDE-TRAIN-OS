title: 第十天 · 第 5 节 · 两周复盘与自学路线
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 讲解图：ten-day-grid.svg
  - 最后 15 分钟，不看代码
  text: '同学们好，我是你们的老师404。最后十五分钟，咱们不看代码。把十天折叠成一张地图：十天前我以为这行是什么，现在我知道它是什么；十天前我以为 AI 会怎样，现在我知道它会什么、不会什么。填进 final-review.md，对吧。

    '
- id: 02-map-self
  ppt:
  - 眉题：02 MAP SELF
  - 讲解图：v2-panorama.svg
  - 行业地图标出长板短板
  text: '然后在行业地图上标你的位置——前端、接口、数据库、模型层各打勾、三角或叉。编排与安全单独一档，闸、日志、Skill，这是大多数人的空白，你已经有。大多数人学完一堆课还是不知道自己在哪，你知道长板短板，这就值，对吧。

    '
- id: 03-cognitive-fold
  ppt:
  - 眉题：03 COGNITIVE FOLD
  - 讲解图：evolution-timeline.svg
  - 定位 → 假设 → 验证 → 记录
  text: '遇到问题现在怎么干？定位、假设、验证、记录——这套方法比任何单点技巧都管用。十天够入门加方法论加一套真作品，不够精通；精通是接下来九十天的事，咱们别急着一口气吃成胖子，对吧。

    '
- id: 04-ninety-day
  ppt:
  - 眉题：04 NINETY DAY
  - 讲解图：ten-day-grid.svg
  - 90 天路线：按下一站选
  text: '最后选下一站：在职提效、求职转行、深入工程、还是独立产品。路线表在这，按下一站选，别按 hottest 选。想提效就先接真实数据；想求职就把十条证据翻译成简历语言；想深入工程就 WebSocket 和多 Agent——咱们各走各的路。

    '
- id: 05-close
  ppt:
  - 眉题：05 TAKEAWAY
  - 讲解图：v2-panorama.svg
  - 课到这里结束，路才刚开始
  text: '同学们，本节先到这里。课到这里就结束了，路才刚开始。你是 FDE 了，去部署的地方见。以后遇到问题，AI 导师配置在每节目录里，方法也在——你已经不需要被领着走了。带走一句：地图在手，下一站自己选。

    '
