<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="数据库是数据的住所">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">给数据一个住所：什么场景 → 什么库</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">DATABASE HOMES</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="86" width="220" height="140" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<rect x="190" y="66" width="80" height="24" rx="12.0" fill="url(#tlg)"/><text x="230.0" y="82.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">主库</text>
<text x="80" y="120" font-size="12" font-weight="700" fill="rgba(35,31,32,.55)">关系型 · 正规住所</text>
<text x="80" y="152" font-size="14.5" font-weight="800" fill="#0f766e">PostgreSQL / MySQL</text>
<text x="80" y="184" font-size="11.5" fill="rgba(35,31,32,.6)">结构化业务数据的家</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="300" y="86" width="220" height="140" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="320" y="120" font-size="12" font-weight="700" fill="rgba(35,31,32,.55)">缓存 · 临时快取</text>
<text x="320" y="152" font-size="14.5" font-weight="800" fill="#231f20">Redis</text>
<text x="320" y="184" font-size="11.5" fill="rgba(35,31,32,.6)">会话 · 排行榜 · 极快访问</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="540" y="86" width="220" height="140" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="560" y="120" font-size="12" font-weight="700" fill="rgba(35,31,32,.55)">搜索 · 捞文档</text>
<text x="560" y="152" font-size="14.5" font-weight="800" fill="#231f20">Elasticsearch</text>
<text x="560" y="184" font-size="11.5" fill="rgba(35,31,32,.6)">按关键词检索</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="780" y="86" width="220" height="140" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="800" y="120" font-size="12" font-weight="700" fill="rgba(35,31,32,.55)">分析 · 秒级聚合</text>
<text x="800" y="152" font-size="14.5" font-weight="800" fill="#231f20">ClickHouse</text>
<text x="800" y="184" font-size="11.5" fill="rgba(35,31,32,.6)">经营报表 · 海量数据</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="170" y="256" width="700" height="42" rx="21.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="281.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Excel 那种结构化数据，不能永远散落在本地文件——什么场景 → 什么库，比背名词重要</text></g>
</svg>
