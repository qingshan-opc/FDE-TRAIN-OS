<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="今天真敲的八句命令">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">命令行 = 用文字和电脑对话 · 今天真敲八句</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">CLI · 8 COMMANDS</text>
</g>
<rect x="90" y="86" width="190" height="48" rx="14" fill="#fff" filter="url(#sh)"/><text x="185" y="116" font-size="14" font-weight="700" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">pwd</text>
<rect x="310" y="86" width="190" height="48" rx="14" fill="#fff" filter="url(#sh)"/><text x="405" y="116" font-size="14" font-weight="700" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">ls</text>
<rect x="530" y="86" width="190" height="48" rx="14" fill="#fff" filter="url(#sh)"/><text x="625" y="116" font-size="14" font-weight="700" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">mkdir</text>
<rect x="750" y="86" width="190" height="48" rx="14" fill="#fff" filter="url(#sh)"/><text x="845" y="116" font-size="14" font-weight="700" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">cd</text>
<rect x="90" y="150" width="190" height="48" rx="14" fill="url(#tlg)" filter="url(#tglow)"/><text x="185" y="180" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">curl</text>
<rect x="310" y="150" width="190" height="48" rx="14" fill="#fff" filter="url(#sh)"/><text x="405" y="180" font-size="14" font-weight="700" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">tail -f</text>
<rect x="530" y="150" width="190" height="48" rx="14" fill="#fff" filter="url(#sh)"/><text x="625" y="180" font-size="14" font-weight="700" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">chmod +x</text>
<rect x="750" y="150" width="190" height="48" rx="14" fill="url(#tlg)" filter="url(#tglow)"/><text x="845" y="180" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">docker ps</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="170" y="236" width="700" height="42" rx="21.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="261.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">别被黑窗口唬住 · 规矩一条：不许复制粘贴——命令行是肌肉记忆</text></g>
</svg>
