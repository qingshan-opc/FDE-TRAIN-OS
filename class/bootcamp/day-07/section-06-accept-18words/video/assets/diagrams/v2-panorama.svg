<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-label="V2 成品全景：驾驶舱 + 挂 Skill 的 Agent + 十条能力证据，人在上面派活确认验收">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect width="1040" height="560" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="512" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">你的 V2 成品全景：一个能派活的驾驶舱</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">V2 PANORAMA</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="50" y="76" width="320" height="310" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="210" y="106" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">驾驶舱前端（六个区块）</text>
<rect x="74" y="126" width="130" height="56" rx="12" fill="rgba(13,148,136,.09)"/>
<text x="139" y="159" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">核心指标</text>
<rect x="216" y="126" width="130" height="56" rx="12" fill="rgba(13,148,136,.09)"/>
<text x="281" y="159" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">趋势图</text>
<rect x="74" y="192" width="130" height="56" rx="12" fill="rgba(13,148,136,.09)"/>
<text x="139" y="225" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">数据表</text>
<rect x="216" y="192" width="130" height="56" rx="12" fill="rgba(13,148,136,.09)"/>
<text x="281" y="225" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">筛选器</text>
<rect x="74" y="258" width="130" height="56" rx="12" fill="rgba(13,148,136,.09)"/>
<text x="139" y="291" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">详情面板</text>
<rect x="216" y="258" width="130" height="56" rx="12" fill="url(#tlg)" filter="url(#tglow)"/>
<text x="281" y="291" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">AI 助手位</text>
<text x="210" y="366" font-size="11" fill="rgba(35,31,32,.55)" text-anchor="middle">React + FastAPI + SQLite · 云上部署</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="420" y="76" width="220" height="310" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="530" y="106" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">Agent（你的数字同事）</text>
<circle cx="530" cy="152" r="40" fill="none" stroke="#0d9488" stroke-width="2" opacity=".35"><animate attributeName="opacity" values=".5;.15;.5" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="530" cy="152" r="32" fill="rgba(13,148,136,.10)" stroke="#0d9488" stroke-width="2"/>
<text x="530" y="148" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">决策环</text>
<text x="530" y="166" font-size="9.5" fill="rgba(35,31,32,.6)" text-anchor="middle">感知→想→做</text>
<rect x="440" y="208" width="180" height="38" rx="19" fill="rgba(13,148,136,.10)"/>
<text x="530" y="232" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">Skill · 拉数据</text>
<rect x="440" y="256" width="180" height="38" rx="19" fill="rgba(13,148,136,.10)"/>
<text x="530" y="280" font-size="12" font-weight="700" fill="#231f20" text-anchor="middle">Skill · 生成周报</text>
<rect x="440" y="304" width="180" height="38" rx="19" fill="url(#tlg)"/>
<text x="530" y="328" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Skill · 发送（带确认）</text>
<text x="530" y="366" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">Harness 供上下文 · 异常有分类</text>
</g>
<path d="M374 230 L414 230" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M646 230 L686 230" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="690" y="76" width="300" height="310" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="840" y="106" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">十条能力证据（验收单）</text>
<text x="712" y="138" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 讲清四层架构与取舍</text>
<text x="712" y="165" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 前端三态 + 迭代日志</text>
<text x="712" y="192" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 接口契约 + 状态码语义</text>
<text x="712" y="219" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 表设计 + SQL 四招</text>
<text x="712" y="246" font-size="12.5" fill="rgba(35,31,32,.75)">✓ Prompt 四要素 + 成本观</text>
<text x="712" y="273" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 环境变量与配置分离</text>
<text x="712" y="300" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 一个带验收的 Skill</text>
<text x="712" y="327" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 编排含确认点与日志</text>
<text x="712" y="354" font-size="12.5" fill="rgba(35,31,32,.75)">✓ 线上可访问的 V2</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><path d="M210 432 L210 392" stroke="rgba(35,31,32,.35)" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M530 432 L530 392" stroke="rgba(35,31,32,.35)" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M840 432 L840 392" stroke="rgba(35,31,32,.35)" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="50" y="440" width="940" height="80" rx="18" fill="url(#tlg)" filter="url(#tglow)"/><text x="520" y="474" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">你（人）：派活 → 确认关键动作 → 按验收单收货</text><text x="520" y="500" font-size="12" fill="rgba(255,255,255,.88)" text-anchor="middle">FDE = 架构你定、脏活 AI 干、质量你验收</text></g>
</svg>
