title: 第七天 · 第 4 节 · 实战：定义 Skill
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 第七天 · 第 4 节 · 实战：定义 Skill
  text: '同学们好，我是你们的老师404。这节开写。三十分钟后，skills/ 目录里要有你的第一份 Skill 说明书——四部件齐全，验收可判，同桌能读懂。写之前咱们先给两个库：动作动词库和判据句式库，对吧。

    '
- id: 02-action-verbs
  ppt:
  - 眉题：02 ACTION VERBS
  - 第七天 · 第 4 节 · 实战：定义 Skill
  text: '步骤段只许出现动作动词：拉取、筛选、对比、汇总、排序、找出、计算、生成、检查、列出。分析一下处理一下优化一下——这些不是动作，是愿望。我巡场见到就划掉，改写成 AI 能执行的具体动作，嘛。

    '
- id: 03-verdict-patterns
  ppt:
  - 眉题：03 VERDICT PATTERNS
  - 第七天 · 第 4 节 · 实战：定义 Skill
  text: '验收段用判据句式：结构判X 段齐全、含字段 A/B/C；数字判每个数字能在来源中找到出处；意图判当某情况时，必须某表现——第五天用例格式直接搬。验收写几条？至少三条，结构、数字、意图各一，对吧。

    '
- id: 04-reverse-order
  ppt:
  - 眉题：04 REVERSE ORDER
  - 第七天 · 第 4 节 · 实战：定义 Skill
  text: '写作顺序听好：倒着写。先写输出——交什么货；再写验收——怎么判；然后输入——吃什么料；最后步骤——从料到货就是连线题。正着写的人，都在步骤里迷路了。输出段贴一个好示例，是最划算的消歧方式，对吧。

    '
- id: 05-swap-test
  ppt:
  - 眉题：05 SWAP TEST
  - 第七天 · 第 4 节 · 实战：定义 Skill
  text: '写完做换人测试：同桌只看你的说明书，说出要做什么、怎么判好坏。他说错了，就是你写岔了——改说明书，不怪他。步骤里能写分支吗？能，但每个分支都要落到动作动词；分支超过三层，说明该拆成两个 Skill，嘛。

    '
- id: 06-close
  ppt:
  - 眉题：06 CLOSE
  - 第七天 · 第 4 节 · 实战：定义 Skill
  text: '同学们，本节先到这里。定稿进 Git，预演下一节运行。带走两个库：动作动词写步骤，判据句式写验收，换人测试消歧义。下一节 AI 拿着你的说明书上岗——派活、收货、按标准验收、留证据。

    '
