      plain: 用最小范围验证价值和流程的首个可用版本。
    quiz:
    - - 下面哪个更适合作为 Day 1 项目？
      - - 做一个解决所有企业问题的平台
        - 为招聘负责人展示招聘漏斗和超期岗位
        - 开发一个全自动银行核心系统
      - 1
      - Day 1 项目应来自熟悉领域、用户明确、问题具体，并能用少量页面区块表现。
    - - 为什么建议先使用脱敏或演示数据？
      - - 因为真实业务不重要
        - 为了在不暴露隐私的前提下先验证需求和交互
        - 因为系统以后不能接真实数据
      - 1
      - 第一阶段先验证方向和界面，避免把个人信息或企业敏感数据直接交给工具。
    local_prep:
      skill_id: fde-local-prep
      prompt_title: 请按以下步骤，用追问生成 PROJECT_BRIEF.md
      hide_copy: true
      codex_prompt: |+
        先在 TRAE 对话框切换到 @产品经理。下面必须逐段发送：每段完成、出现等待点后再继续。现在不要生成 PRD。

        【第 1 段｜锁定领域，一次只问 1 题】

        我的专业领域是{{professional_domain}}。一个适合今天的方向例如：{{domain_example}}。

        现在不要生成任何文档。请用小白能听懂的话，一次只问我 1 个问题；每题给一个结合「{{professional_domain}}」的回答示例。我回答后请先用我的原意复述，再问下一题。

        请先问：在{{professional_domain}}里，谁会每天打开这个页面？（只选一类主要用户）

        【第 2 段｜按清单追问，仍一次一题】

        请继续一次只问一题，直到问清下面全部项。缺哪项就问哪项，不要跳着问，不要一次抛出多题，不要生成文档。
        1. 主要使用者（一类人）
        2. 当前怎样工作（用哪些表、群、口头催）
        3. 最痛的一个问题（反复发生、能判断对错）
        4. 需要展示的数据或状态（只写类型和规则，不要真实敏感数据）
        5. 第一版必须做（一个核心问题，三到五个页面区块）
        6. 第一版暂时不做
        7. 我希望看到的结果

        【第 3 段｜确认后再写项目卡】

        请先用不超过半页复述：专业领域、用户、痛点、第一版范围。输出后停止，等我回复“可以生成项目卡”。

        【第 4 段｜保存到 design/PROJECT_BRIEF.md】

        我回复“可以生成项目卡”后，先创建 design 目录（若还不存在），再保存 design/PROJECT_BRIEF.md。不要写到工作区根目录，也不要提前创建 frontend、backend 或其他工程目录。严格使用下面结构，用我确认过的内容填写，不要添加我没说过的功能：

        # 项目名称

        ## 我的专业领域

        ## 主要使用者

        ## 当前工作流程

        ## 最痛的一个问题

        ## 需要展示的数据或状态

        ## 第一版必须做

        ## 第一版暂时不做

        ## 我希望看到的结果

        项目名称必须能让外行人听出“给谁用、解决什么问题”。只写数据类型和业务规则，不写真实姓名、电话、身份证、密码或公司敏感明细。最后写一句：下一岗位仍是产品经理，下一节将读取 design/PROJECT_BRIEF.md 生成 design/PRD.md。
      checklist:
      - 已切换到 @产品经理
      - 产品经理一次只问一个问题，并在每次回答后复述
      - 已回复“可以生成项目卡”
      - 已创建 design 目录，且 design/PROJECT_BRIEF.md 存在
      - 项目名称能看出给谁用、解决什么问题
      suggested_questions:
      - 我想不到项目怎么办？
      - 产品经理一次问了很多问题怎么办？
      - 项目名称太空泛怎么办？
