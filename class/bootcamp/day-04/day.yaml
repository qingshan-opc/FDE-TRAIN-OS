day: 4
project: 真实检查、问题修复和交付前稳定版本
project_brief: 学员指挥测试工程师从 PRD 验收标准倒推用例，但必须亲手执行测试；随后把缺陷分派给责任岗位、复测回归，并以证据清单完成 V0.9 功能冻结。
resources:
- id: team-prompts-v11
  title: 七岗位 AI 员工提示词包
  kind: download
  summary: 七名 AI 员工的职责、交接方法和五天协作规则
  url: /course-assets/resources/prompt-toolkit/FDE_TRAE_Agent_Prompts_V1.1/00_README.md
- id: week1-day4-source
  title: 第一周第 4 天课程合约
  kind: doc
  summary: 本日五节课、交付物、岗位交接与验收口径
  url: /course-assets/bootcamp/day-04/README.md
- id: domain-packs
  title: 第一周领域包
  kind: doc
  summary: 财务、员工管理、经营问题三个参考方向，也可选择自己的专业方向
  url: /course-assets/teaching/week1-command-team/Week1_Domain_Packs.md
capsule_extra:
  c1:
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@测试工程师 Agent'
      note: 本节交付：至少 10 条测试用例
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id001
      - 测试用例的主要来源是什么？
      - - 测试工程师感觉
        - PRD 验收标准和接口契约
        - 页面颜色
      - 1
      - 测试从已经批准的标准倒推。
    - &id002
      - 预期结果写“正常显示”为什么不合格？
      - - 不够长
        - 无法客观判断通过或失败
        - 没有截图
      - 1
      - 预期必须具体可判定。
  c2:
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: 学员亲测 → @测试工程师 Agent 整理
      note: 本节交付：执行矩阵 + 真实缺陷报告
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id003
      - Agent 说测试通过能否作为通过证据？
      - - 能
        - 不能，必须有真实执行记录
        - 只有前端可以
      - 1
      - 测试结论来自执行证据。
    - &id004
      - 好缺陷报告最重要的是什么？
      - - 情绪强烈
        - 别人能按步骤稳定重现
        - 标题很长
      - 1
      - 可重现才能被定位、修复和复测。
  c3:
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@责任工程师'
      note: 本节交付：修复单、修复提交与根因说明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id005
      - 修复后为什么还要测试相关用例？
      - - 为了增加文件
        - 防止修好 A 又破坏 B
        - 为了改变 PRD
      - 1
      - 相关功能可能被同一处修改影响。
    - &id006
      - “请把 Bug 修好”缺少什么？
      - - 现象、步骤、目标和验收口径
        - 技术框架介绍
        - 市场分析
      - 0
      - 可执行修复单需要具体上下文。
  c4:
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@测试工程师 Agent + 学员批准'
      note: 本节交付：验收清单 + 功能冻结声明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 功能冻结后新想法怎么处理？
      - - 立即开发
        - 进入 Backlog 等后续排期
        - 删除
      - 1
      - 冻结保护当前交付，新想法保留但不插队。
    - - 有未通过项时应该怎么做？
      - - 隐藏
        - 记录原因和补救计划
        - 自动改成通过
      - 1
      - 诚实披露是可维护交付的一部分。
  c5:
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：报审材料清单与 v0.9
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 报审材料的核心价值是什么？
      - - 让文件更多
        - 让每个结论都有可追溯证据
        - 代替项目运行
      - 1
      - 证据链支撑验收和交接。
    - - 缺失文件应该怎样记录？
      - - 编一个路径
        - 标 BLOCKED 并补做
        - 从清单删除
      - 1
      - 诚实状态比虚假完整更重要。
quiz:
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
