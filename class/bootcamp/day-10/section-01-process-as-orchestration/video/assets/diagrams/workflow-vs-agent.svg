<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-label="Workflow 还是 Agent：决策树">
  <defs>
    <linearGradient id="wa-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="wa-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="wa-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="wa-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".45"/>
    </filter>
    <marker id="wa-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
    <marker id="wa-arrM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="rgba(35,31,32,.45)"/>
    </marker>
  </defs>

  <rect width="1040" height="460" fill="#ffffff"/>
  <rect width="1040" height="460" fill="url(#wa-dots)"/>
  <circle cx="972" cy="392" r="92" fill="rgba(13,148,136,.06)">
    <animate attributeName="r" values="92;108;92" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="64" fill="rgba(35,31,32,.03)">
    <animate attributeName="r" values="64;76;64" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- header -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="36" y="16" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="33" font-size="16" font-weight="800" fill="#231f20">Workflow 还是 Agent · 一棵决策树</text>
    <text x="1004" y="33" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">DECISION TREE</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <!-- start chip -->
    <g transform="translate(420,50)">
      <rect width="200" height="50" rx="25" fill="url(#wa-teal)" filter="url(#wa-glow)"/>
      <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">来了一项工作</text>
    </g>
    <path d="M520 104 V142" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#wa-arr)">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <!-- Q1 diamond -->
    <path d="M520 148 L664 192 L520 236 L376 192 Z" fill="#ffffff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#wa-sh)"/>
    <text x="520" y="188" text-anchor="middle" font-size="12.5" font-weight="800" fill="#231f20">步骤能写死吗？</text>
    <text x="520" y="208" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.5)">A 完了必走 B？</text>

    <!-- 能 → workflow -->
    <path d="M372 192 H250" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#wa-arr)">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <text x="311" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">能</text>
    <g transform="translate(60,152)" filter="url(#wa-sh)">
      <rect width="180" height="84" rx="14" fill="#fff" stroke="#0d9488" stroke-width="1.6"/>
      <text x="90" y="34" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0d9488">Workflow</text>
      <text x="90" y="58" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.55)">写死的流程图：便宜、稳定、好验收</text>
    </g>

    <!-- workflow mini flow -->
    <g>
      <rect x="80" y="258" width="40" height="26" rx="8" fill="#fff" stroke="#0d9488" stroke-width="1.2"/>
      <rect x="140" y="258" width="40" height="26" rx="8" fill="#fff" stroke="#0d9488" stroke-width="1.2"/>
      <rect x="200" y="258" width="40" height="26" rx="8" fill="url(#wa-teal)"/>
      <path d="M122 271 H136" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M182 271 H196" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <text x="160" y="308" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">A → B → C 永远这么走</text>
    </g>

    <!-- 不能 → Q2 -->
    <path d="M668 192 H732" stroke="rgba(35,31,32,.4)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#wa-arrM)">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <text x="700" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#e11d48">不能</text>
    <path d="M860 148 L984 192 L860 236 L736 192 Z" fill="#ffffff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#wa-sh)"/>
    <text x="860" y="188" text-anchor="middle" font-size="12" font-weight="800" fill="#231f20">需要现场决策？</text>
    <text x="860" y="208" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.5)">下一步要看情况？</text>

    <!-- 需要 → agent -->
    <path d="M860 240 V292" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#wa-arr)">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <text x="880" y="270" font-size="11" font-weight="700" fill="#0d9488">需要</text>
    <g transform="translate(770,300)">
      <rect x="-7" y="-7" width="194" height="104" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
        <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect width="180" height="90" rx="16" fill="url(#wa-teal)" filter="url(#wa-glow)"/>
      <text x="90" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Agent</text>
      <text x="90" y="60" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.88)">决策环现场判断：贵、要护栏、要验收</text>
    </g>

    <!-- 不需要 → 人工/再拆 -->
    <path d="M772 214 L706 292" stroke="rgba(35,31,32,.4)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#wa-arrM)">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="722" y="256" font-size="11" font-weight="700" fill="rgba(35,31,32,.55)">不需要</text>
    <g transform="translate(540,300)" filter="url(#wa-sh)">
      <rect width="160" height="90" rx="14" fill="#fff" stroke="rgba(35,31,32,.3)" stroke-width="1.4" stroke-dasharray="6 5"/>
      <text x="80" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">人工 / 再拆</text>
      <text x="80" y="60" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.55)">也许这一步就不该自动化</text>
    </g>

    <!-- footer pill -->
    <rect x="356" y="410" width="328" height="36" rx="18" fill="rgba(13,148,136,.10)"/>
    <text x="520" y="433" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f766e">能写死就写死，写不死才上 Agent</text>
  </g>
</svg>
