<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-label="加载、空、错三态">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1040" height="430" fill="#ffffff"/>
  <rect width="1040" height="430" fill="url(#dots)"/>
  <circle cx="970" cy="56" r="100" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="400" r="70" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="14" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="31" font-size="15" font-weight="800" fill="#231f20">三态是页面的基本礼貌</text>
    <text x="1004" y="31" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">THREE STATES</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <!-- loading -->
    <g>
      <rect x="60" y="48" width="280" height="252" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="84" y="82" font-size="14" font-weight="800" fill="#231f20">加载中</text>
      <text x="84" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">LOADING</text>
      <g transform="translate(200,148)">
        <circle r="16" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="50 30">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <rect x="90" y="188" width="220" height="12" rx="6" fill="rgba(35,31,32,.1)">
        <animate attributeName="opacity" values="1;.4;1" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="212" width="180" height="12" rx="6" fill="rgba(35,31,32,.1)">
        <animate attributeName="opacity" values="1;.4;1" dur="1.8s" begin=".3s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="236" width="200" height="12" rx="6" fill="rgba(35,31,32,.1)">
        <animate attributeName="opacity" values="1;.4;1" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
      </rect>
      <text x="200" y="276" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">骨架屏：先给形状，再给数据</text>
    </g>

    <!-- empty -->
    <g>
      <rect x="390" y="48" width="280" height="252" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="414" y="82" font-size="14" font-weight="800" fill="#231f20">空态</text>
      <text x="414" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">EMPTY</text>
      <rect x="440" y="122" width="180" height="68" rx="12" fill="none" stroke="rgba(35,31,32,.25)" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="530" y="160" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">暂无数据</text>
      <rect x="455" y="212" width="150" height="32" rx="16" fill="none" stroke="#0d9488" stroke-width="1.6"/>
      <text x="530" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">去接入数据 →</text>
      <text x="530" y="276" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">空白不是终点：给一条下一步</text>
    </g>

    <!-- error -->
    <g>
      <rect x="720" y="48" width="280" height="252" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="744" y="82" font-size="14" font-weight="800" fill="#231f20">出错</text>
      <text x="744" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">ERROR</text>
      <circle cx="860" cy="138" r="18" fill="none" stroke="rgba(35,31,32,.45)" stroke-width="2.5"/>
      <text x="860" y="145" text-anchor="middle" font-size="18" font-weight="800" fill="rgba(35,31,32,.55)">!</text>
      <text x="860" y="184" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.65)">数据暂时没拉取成功</text>
      <rect x="785" y="204" width="150" height="32" rx="16" fill="url(#teal)" filter="url(#glow)"/>
      <text x="860" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">重试</text>
      <text x="860" y="262" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.45)">错误码记进日志，不给用户看</text>
    </g>

    <!-- footer pill -->
    <rect x="140" y="330" width="760" height="72" rx="36" fill="rgba(13,148,136,.08)"/>
    <text x="520" y="358" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">三态是页面的基本礼貌：V0.1 先占位，第三天 接真接口后变真</text>
    <text x="520" y="384" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">铁律：出错文案说人话——「500 Internal Server Error」永远不该出现在用户眼前</text>
  </g>
</svg>
