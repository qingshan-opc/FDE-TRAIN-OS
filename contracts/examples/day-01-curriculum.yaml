  estimated_minutes: 130
  require_capsules: true
  capsules:
  - id: c1
    title: 你是负责人：先选业务问题，不先选技术
    minutes: 15
    form: 认知+选择
    content_ref: class/bootcamp/day-01/section-01-pm-in-ai-era/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：第一周不是学会某个框架，而是学会把一个真实业务问题交给团队，并判断团队交付是否合格。


      请记住三件事。


      「从自己的专业、岗位或兴趣里找一个反复发生、数据可记录、结果可验收的问题。」


      「首期可选财务费用、HR 员工诉求、经营问题闭环，也允许自定义同等复杂度方向。」


      「驾驶舱是管理者看到的前端，看板背后必须有表单、列表、详情、数据库和统计接口。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：选择一个方向，写清谁遇到什么问题、现在怎么处理、五天后希望看到什么变化。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：选题确认单
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 选题时首先应该确定什么？
      - &id001
        - 使用哪个框架
        - 要解决的业务问题和使用者
        - 页面主色
      - 1
      - 技术是实现手段，先确定业务问题和谁会使用。
    - - 驾驶舱只有漂亮图表为什么不算完整系统？
      - &id002
        - 没有手机端
        - 图表背后还缺业务数据的产生、存储和统计链路
        - 没有动画
      - 1
      - 驾驶舱是前端结果，必须能追到真实业务数据。
    local_prep:
      codex_prompt: '请作为我的选题教练，只通过提问帮助我从专业或工作经历中选一个五天可完成的企业 Web 项目。

        候选方向可以是财务费用、HR 员工诉求、经营问题闭环，也可以是我的专业方向。

        先问我 4 个问题：谁在使用、目前最痛的步骤、要记录的核心对象、什么结果可以被验收。

        不要替我直接决定技术方案。最后把我的回答整理为 docs/D1_选题确认单.md，并明确本周不做手机端、登录、Docker 和真实 AI。'
      checklist:
      - 选题与自己的专业、岗位或兴趣有关
      - 能说清用户、业务对象和痛点
      - 项目规模适合五天完成
      - 知道驾驶舱背后还需要业务系统和数据链路
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 把七个岗位招进 TRAE
    minutes: 25
    form: 操作
    content_ref: class/bootcamp/day-01/section-02-requirement-to-prd/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：智能体不是七个聊天窗口，而是七个职责边界不同、必须交接和等待验收的岗位。


      请记住三件事。


      「创建项目经理、产品经理、UI/UX、前端、后端、测试、运维七个 Agent。」


      「每个岗位只做自己的任务，完成后自检并停在 REVIEW，不能自动冒充下一个岗位。」


      「学员始终保留批准权；只有明确回复 APPROVED，下一岗位才可开工。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：按课程提示词包逐个创建七个 Agent，并填写每个岗位的输入、输出和不能替你做什么。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: TRAE 手动操作 + 通用对话
      note: 本节交付：七岗位团队 + 团队协作卡
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - Agent 完成岗位任务并自检后应该处于什么状态？
      - &id003
        - RELEASED
        - REVIEW
        - APPROVED
      - 1
      - 岗位只能提交 REVIEW，批准必须由学员明确给出。
    - - 为什么不让一个 Agent 自动把全部岗位做完？
      - &id004
        - 因为模型不会写代码
        - 因为学员会失去交接、判断和验收过程
        - 因为文件数量会变少
      - 1
      - 课程目标是看懂研发逻辑，而不是只看到最终产物。
    local_prep:
      codex_prompt: '请作为我的课程教练，检查我在 TRAE 中创建的七个岗位是否完整：项目经理、产品经理、UI/UX 设计师、前端工程师、后端工程师、测试工程师、运维工程师。

        请逐个问我：这个岗位接收什么输入、交付什么文件、不能替我做什么。一次只问一个岗位；我答错时解释，不要替我操作 TRAE。

        最后把确认结果整理为 docs/D1_团队协作卡.md。'
      checklist:
      - 七个 Agent 均能在 TRAE 中被 @ 到
      - 至少完整读过项目经理、产品经理和 UI/UX 三份岗位提示词
      - 团队协作卡写清七个岗位的输入、输出与边界
      - 能解释 REVIEW 和 APPROVED 的区别
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 指挥项目经理：锁定五天边界
    minutes: 20
    form: 实操
    content_ref: class/bootcamp/day-01/section-03-pm-prompt-anatomy/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：项目经理先把目标、里程碑、风险和不做事项锁住，避免其他岗位边做边扩范围。


      请记住三件事。


      「项目任务书回答做什么、为什么、五天怎么推进、哪些内容明确不做。」


      「默认骨架是驾驶舱、提交页、列表页、详情页和 SQLite 数据链路。」


      「项目经理可以给下一岗位提示词，但不能代替产品经理写 PRD。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：把选题确认单交给项目经理，要求他先澄清再生成五天任务书。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent'
      note: 本节交付：项目任务书
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 项目经理最先要控制的是什么？
      - &id005
        - 按钮颜色
        - 范围、里程碑和风险
        - 数据库语法
      - 1
      - 项目经理确保团队在同一范围和节奏内交付。
    - - 项目经理为什么不能顺手写完 PRD？
      - &id006
        - 他不会写
        - 岗位边界和验收责任会被打乱
        - PRD 不重要
      - 1
      - 每个岗位只交付自己的成果，下一岗位由学员亲自发起。
    local_prep:
      codex_prompt: '@项目经理 Agent 请阅读 docs/D1_选题确认单.md。先向我提出不超过 5 个会影响范围或验收的问题；我回答前不要生成方案。

        回答完成后，请创建 docs/D1_项目任务书.md，写清：项目目标、七岗位分工、五天里程碑、默认四页面、真实业务数据链路、风险和本期不做事项。

        边界：桌面 Web、本地数据库；Week1 只预留“AI 分析区｜Week2 接入”，不得接真实 AI 或伪造 AI 结果。

        完成后自检并以 REVIEW 状态交付，不要替产品经理继续工作。'
      checklist:
      - 项目经理先提问后产出
      - 任务书包含五天里程碑和七岗位分工
      - 明确四页面、SQLite 和 Week2 AI 边界
      - 状态为 REVIEW，学员通读后才决定是否 APPROVED
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 指挥产品经理：从老板一句话到 PRD
    minutes: 35
    form: 实操
    content_ref: class/bootcamp/day-01/section-04-hands-on-mini-prd/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：好的产品经理不会把老板一句话直接扩写成长文，而是先找出会影响用户、字段、流程和验收的空白。


      请记住三件事。


      「PRD 至少包含目标用户、核心场景、用户故事、P0 范围、字段清单和可判断的验收标准。」


      「P0 不超过四项，并明确本期不做什么。」


      「不确定内容标待确认；学员至少否决或修改一项建议，留下判断证据。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：批准项目任务书后，将它交给产品经理；回答澄清问题并完成一轮定向返工。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@产品经理 Agent'
      note: 本节交付：docs/PRD.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 产品经理收到老板一句话后正确的第一步是什么？
      - - 直接生成 PRD
        - 先澄清影响范围和验收的问题
        - 开始画页面
      - 1
      - 先澄清才能避免把假设写成需求。
    - - “页面要好用”为什么不是合格验收标准？
      - - 字数太少
        - 第三方无法客观判断通过或失败
        - 没有英文
      - 1
      - 验收标准必须可观察、可执行、可判断。
    local_prep:
      codex_prompt: '@产品经理 Agent 请阅读已批准的 docs/D1_项目任务书.md。先向我提出不超过 8 个关键澄清问题；我回答前不要写 PRD。

        回答后生成 docs/PRD.md，必须包含：项目目标与背景、目标用户与核心场景、至少 3 条“作为…我想要…以便…”用户故事、P0 不超过 4 项及本期不做事项、业务对象字段清单、每项 P0 的可判断验收标准。

        不确定内容标“待确认”，不要编造。完成后列出我的哪些回答改变或否决了你的建议，自检后以 REVIEW 状态交付。'
      checklist:
      - 产品经理先提问，学员回答后才写 PRD
      - PRD 六部分齐全且字段与选题一致
      - P0 不超过四项并列出本期不做事项
      - 学员至少修改或否决一项并明确批准 PRD
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 指挥 UI/UX：先写标识，再画按钮
    minutes: 35
    form: 实操+验收
    content_ref: class/bootcamp/day-01/section-05-accept/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：UI 阶段交付的是可点击、可验证流程的原型，不是正式前端；重要状态必须先通过文字标识说清楚，再考虑按钮和视觉。


      请记住三件事。


      「四页为驾驶舱、提交、列表和详情；字段必须以已批准 PRD 为准。」


      「详情页固定保留“AI 分析区｜第二周 接入”；样例必须醒目标“演示数据”。」


      「先写标识再画按钮：按钮不能替代状态、来源和边界说明。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：将已批准 PRD 交给 UI/UX，逐页点击验收并至少下达一条定向纠偏。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@UI/UX 设计师 Agent'
      note: 本节交付：四页可点击原型 + 第一次岗位交接
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - UI 原型完成后能不能称为正式前端？
      - - 能，只要好看
        - 不能，它用于确认结构和交互，正式工程在第二天实现
        - 能，只要能点击
      - 1
      - 原型和正式前端是两个不同交付状态。
    - - AI 区为什么要先写标识再画按钮？
      - - 文字更便宜
        - 用户必须先知道能力状态和内容来源，按钮不能掩盖边界
        - 按钮不能点击
      - 1
      - 状态与来源比操作入口更重要。
    local_prep:
      codex_prompt: '@UI/UX 设计师 Agent 请阅读已批准的 docs/PRD.md，为项目产出驾驶舱、提交、列表、详情四页高保真可点击 HTML 原型，统一放到 design/prototypes/ 并提供 index.html
        入口。

        字段、状态和流程以 PRD 为准。详情页固定写“AI 分析区｜Week2 接入”；如放样例，必须先醒目标“演示数据”，再设计采纳或忽略按钮——先写标识，再画按钮。

        完成后逐项自检、列出实际文件，以 REVIEW 状态交付；不要继续写正式前端代码。'
      checklist:
      - 四页均可从 index.html 打开并互相跳转
      - 提交后能在原型列表中看到记录，用于验证流程
      - 字段、状态与 PRD 一致
      - AI 区的 Week2 和演示数据标识清楚
      - 至少完成一轮具体纠偏后再批准
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 选题时首先应该确定什么？
    options: *id001
    answer: 1
    explain: 技术是实现手段，先确定业务问题和谁会使用。
  - q: 驾驶舱只有漂亮图表为什么不算完整系统？
    options: *id002
    answer: 1
    explain: 驾驶舱是前端结果，必须能追到真实业务数据。
  - q: Agent 完成岗位任务并自检后应该处于什么状态？
    options: *id003
    answer: 1
    explain: 岗位只能提交 REVIEW，批准必须由学员明确给出。
  - q: 为什么不让一个 Agent 自动把全部岗位做完？
    options: *id004
    answer: 1
    explain: 课程目标是看懂研发逻辑，而不是只看到最终产物。
  - q: 项目经理最先要控制的是什么？
    options: *id005
    answer: 1
    explain: 项目经理确保团队在同一范围和节奏内交付。
  - q: 项目经理为什么不能顺手写完 PRD？
    options: *id006
    answer: 1
    explain: 每个岗位只交付自己的成果，下一岗位由学员亲自发起。
