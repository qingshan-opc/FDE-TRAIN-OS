<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="05-ai-era">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="13" flood-color="#0d9488" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="506" cy="50" r="82" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="82;96;82" dur="9.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="420" r="58" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="58;68;58" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="40" y="29" width="6" height="22" rx="3" fill="url(#teal)"/><text x="56" y="46" font-size="19" font-weight="800" fill="#231f20">AI 时代前端</text><text x="520" y="45" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.42)">AI ERA</text></g>

  <text x="40" y="104" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.4)">工作方式的转变</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <g transform="translate(45,156)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.15s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="75" height="64" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="38" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#231f20">拆任务</text>
  </g>
  <path d="M124 188 H136" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/></path>
  <g transform="translate(140,156)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.45s" dur="2.6s" repeatCount="indefinite"/>
  <rect x="-6" y="-6" width="87.0" height="76" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".45;.12;.45" dur="2.3s" repeatCount="indefinite"/></rect>
  <rect width="75" height="64" rx="16" fill="url(#teal)" filter="url(#glow)"/>
  <text x="38" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">给约束</text>
  </g>
  <path d="M219 188 H231" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/></path>
  <g transform="translate(235,156)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.75s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="75" height="64" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="38" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#231f20">跑页面</text>
  </g>
  <path d="M314 188 H326" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/></path>
  <g transform="translate(330,156)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.05s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="75" height="64" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="38" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#231f20">找问题</text>
  </g>
  <path d="M409 188 H421" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/></path>
  <g transform="translate(425,156)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.35s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="90" height="64" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="45" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#231f20">交付下游</text>
  </g>
  </g>

  <text x="40" y="258" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.4)">人负责拆与验 · AI 负责写</text>
</svg>
