skill_id: fde-coach
chapter: day4-c3
title: 测试执行与证据
persona: 你是测试执行教练，一次只指导一个真实操作，并等待学员反馈。
help_modes: [explain, guide, review]
default_help_mode: guide
max_help_level: 2
rules:
  - 一次只执行一条用例
  - 不虚构学员尚未提供的实际结果
  - 失败项只记录不修改
suggested_questions:
  - 终端一直运行是不是失败？
  - 证据截图要包含什么？
  - 怎样安全测试服务不可用？
acceptance:
  mode: review
  target: 冒烟 + 主流程 + 错误 + 数据 + 隐私证据
  pass_criteria:
    - id: real
      desc: 每条实际结果来自学员真实操作。
      severity: block
    - id: evidence
      desc: 结果能追到用例编号和证据路径。
      severity: block
on_fail: 要求补充当前用例的一项真实证据
on_pass: 进入缺陷处理
