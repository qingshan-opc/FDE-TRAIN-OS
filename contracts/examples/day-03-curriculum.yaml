  require_capsules: true
  capsules:
  - id: c1
    title: 看懂一条记录怎么从页面进入系统
    minutes: 20
    form: 认知+实操
    content_ref: class/bootcamp/day-03/section-01-frontend-in-ai-era/lesson.md
    content: '你可以把数据仓库想成一张管理严格的表格。每一行是一条记录，每一列是一项内容，例如单号、金额、类型、状态、提交人和时间。


      这些列不是数据工程师临时发明的，它们来自第一天的需求文档。页面上要求填写什么，仓库里就要有对应位置；哪些必须填、哪些只能填数字，也要保持一致。


      状态尤其不能随便写。刚提交、处理中、已完成、已驳回，这些状态有哪些、可以怎样变化，都要提前定好。例如已经完成的记录，不能无缘无故回到待处理。工程师把这套规则叫“状态变化规则”，不用背术语，能判断哪些变化合理即可。


      每条记录还需要一个不会重复的编号，以及创建和修改时间，这样以后才能查清它是谁、什么时候发生过变化。


      验收时让数据工程师用业务语言解释每一列。如果它只能说技术名称，却说不出这项内容对业务有什么用，就还没有设计清楚。


      记住这句话：**保存规则来自业务，不来自工程师的想象；每项内容有位置，每种状态有规矩。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：docs/D3-L1_项目地图.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 用户提交一条记录后，正确的旅程是什么？
      - - 页面直接把数字画到看板上
        - 页面送出内容，数据服务检查并保存，其他页面再读取和汇总
        - AI 自动生成一条新的业务记录
      - 1
      - 口播稿用一条记录的旅程解释了页面、数据服务和数据仓库的分工。
    media:
    - kind: video
      title: 口播课件 · 第 1 节
      object_key: documents/shared/course-media/day03-c1-frontend-in-ai-era.mp4
      poster_key: documents/shared/course-media/day03-c1-frontend-in-ai-era-poster.jpg
      duration_sec: 77
    knowledge_cards:
    - id: d3l1-k1
      term: 页面负责收和看
      plain: 用户在页面提交内容，也通过列表、详情和看板查看结果。
    - id: d3l1-k2
      term: 数据服务负责检查和传
      plain: 它接收页面送来的内容，执行规则，再把合格记录交给数据仓库保存。
    - id: d3l1-k3
      term: 数据仓库负责记
      plain: 真实记录保存在统一位置，列表、详情和看板都从这里获得事实。
    memory_sentence: 页面负责收和看，数据服务负责检查和传，数据仓库负责记；一条记录走通，系统才真正活起来。
    local_prep:
      codex_prompt: '@项目经理 Agent 请只查看当前项目，带我画一张“数据旅行地图”：用户提交后，数据怎样被保存，又怎样来到列表、详情和驾驶舱。一次只讲一站，让我先复述再继续。最后整理成项目地图；AI 那一站标“第二周接入”。'
      checklist:
      - 六部分都有真实证据路径
      - 数据链路能从用户操作讲到看板更新
      - Mock 与真实数据状态区分清楚
      - AI 标记为 Week2
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 让系统把每条记录保存下来
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-03/section-02-design-spec/lesson.md
    content: '现在系统已经能保存真实业务记录。下一步当然可以让 AI 做分类、分析和建议，但这件事放在第二周。


      今天只完成三项准备。第一，详情页写清“AI 分析区｜第二周接入”。第二，展示样例必须醒目标明“演示数据”，不能假装是 AI 生成。第三，数据服务先留一条分析通道，现在使用时要诚实回答“AI 尚未接入，第二周开放”。


      为什么不今天顺手接上？因为真实项目本来就分阶段：第一周先把业务记录做真，第二周再把专业知识和分析流程接进来。地基没稳就装大脑，后面只会一起返工。


      这块预留还要写清楚：第二周 AI 要读取哪些内容，会返回什么建议，结果放在页面哪里，最后由谁确认。


      记住这句话：**第一周把数据做真，第二周把智能接上；没有接入，就诚实标记。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：数据库与字段说明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 已经完成的记录能否无条件改回待处理？
      - - 可以，状态只是随便填写的文字
        - 不可以，必须遵守事先确定的状态变化规则
        - 可以，只要换一种颜色
      - 1
      - 状态表示真实业务进展，不能脱离规则任意变化。
    media:
    - kind: video
      title: 口播课件 · 第 2 节
      object_key: documents/shared/course-media/day03-c2-design-spec.mp4
      poster_key: documents/shared/course-media/day03-c2-design-spec-poster.jpg
      duration_sec: 60
    knowledge_cards:
    - id: d3l2-k1
      term: 保存内容来自需求
      plain: 页面要求填写什么，数据仓库就要有对应位置，不能由工程师临时发明。
    - id: d3l2-k2
      term: 每条记录要能追查
      plain: 不重复的编号和创建、修改时间，帮助确认记录是谁、什么时候发生变化。
    - id: d3l2-k3
      term: 状态变化要有规矩
      plain: 待处理、处理中、已完成等状态不能随意跳转，必须符合真实业务过程。
    memory_sentence: 保存规则来自业务，不来自工程师的想象；每项内容有位置，每种状态有规矩。
    local_prep:
      codex_prompt: '@后端工程师 Agent 请按已批准的需求，为业务记录建立本地数据仓库。先用大白话逐项告诉我“要保存什么、为什么要保存”，一次只确认一个有疑问的内容。确认后再建立，并用一条演示记录证明它能保存和读出，等我检查。'
      checklist:
      - 字段与 PRD 和契约一致
      - 状态值受约束
      - 有主键和时间字段
      - 数据库真实创建且能被程序访问
      - 学员能复述核心字段
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 让页面能够保存、查询和计算数据
    minutes: 30
    form: 实操
    content_ref: class/bootcamp/day-03/section-03-web-prompt-anatomy/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：真实后端的判据不是生成了代码，而是请求真的写入数据库、读得出来，并且非法输入被拒绝。


      请记住三件事。


      「严格按契约实现四个业务接口。」


      「后端再次校验必填、类型和范围。」


      「看板统计必须按数据库真实记录聚合。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：用实际请求演示提交一条、查询它、打开详情并看到统计变化。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：提交、列表、详情、看板统计接口
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 页面已经阻止负数金额，数据服务是否还需要再次检查？
      - - 不需要，页面永远不会被绕过
        - 需要，数据服务必须保护真实记录不被坏数据污染
        - 只在演示时需要
      - 1
      - 页面提醒改善体验，数据服务检查保护真实数据，两层职责不同。
    media:
    - kind: video
      title: 口播课件 · 第 3 节
      object_key: documents/shared/course-media/day03-c3-web-prompt-anatomy.mp4
      poster_key: documents/shared/course-media/day03-c3-web-prompt-anatomy-poster.jpg
      duration_sec: 47
    knowledge_cards:
    - id: d3l3-k1
      term: 真实记录要能进能出
      plain: 提交后必须保存，列表能查到，详情能打开，看板数字能随记录变化。
    - id: d3l3-k2
      term: 数据服务再次守规则
      plain: 即使页面已经提醒过，数据服务仍要拒绝空白、负数或其他不合格内容。
    - id: d3l3-k3
      term: 运行结果才算完成
      plain: AI 生成文件不等于功能完成，必须用真实操作证明每一步都有效。
    memory_sentence: 页面提醒是为了好用，数据检查是为了安全；生成了文件不算完成，真实记录能进能出才算。
    local_prep:
      codex_prompt: '@后端工程师 Agent 请按已批准的数据约定，打通提交、列表、详情和驾驶舱统计。请分四步完成，每一步先告诉我数据怎样走，再用真实操作证明。最后演示“提交一条—查到它—驾驶舱数字变化”，把证据留下并等我批准。'
      checklist:
      - 四个接口与契约一致
      - 非法输入被后端拒绝
      - 数据真实写入 SQLite
      - 统计与记录可核对
      - 验证文档含真实请求响应
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 先给 AI 留个位置，下周再接入
    minutes: 20
    form: 实操+交接
    content_ref: class/bootcamp/day-03/section-04-hands-on-prototype/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：分期开发要诚实：接口可以先定义，但没有接模型就必须明确返回未接入，不能用固定文字冒充 AI。


      请记住三件事。


      「预留接口保持契约形状。」


      「第一周 返回 501 AI_NOT_CONNECTED 或等价明确状态。」


      「交接文档写清第二周 Agent 的输入、输出和写回位置。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：实现诚实的占位接口，并检查详情页展示边界。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：AI 预留接口 + Week2 交接文档
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 当前还没有真正调用 AI，页面上的分析样例应该怎样标记？
      - - 标记为 AI 已完成分析
        - 醒目标记为演示数据，并说明第二周接入
        - 不做任何说明
      - 1
      - 口播稿强调分期开发要诚实，未来能力不能冒充当前成果。
    media:
    - kind: video
      title: 口播课件 · 第 4 节
      object_key: documents/shared/course-media/day03-c4-hands-on-prototype.mp4
      poster_key: documents/shared/course-media/day03-c4-hands-on-prototype-poster.jpg
      duration_sec: 48
    knowledge_cards:
    - id: d3l4-k1
      term: 第一周先把数据做真
      plain: 提交、保存、查询和统计先形成稳定流程，AI 分析放到第二周增加。
    - id: d3l4-k2
      term: 没接入就明确说明
      plain: 当前分析通道要回答 AI 尚未接入，不能用固定文字冒充真实分析。
    - id: d3l4-k3
      term: 提前写好下周交接
      plain: 说明 AI 将读取什么、返回什么、结果放哪里以及最后由谁确认。
    memory_sentence: 第一周把数据做真，第二周把智能接上；没有接入，就诚实标记。
    local_prep:
      codex_prompt: '@后端工程师 Agent 请为第二周的 AI 分析留好入口，但本周不要接入真实 AI，也不能用固定文案冒充结果。先用大白话告诉我第二周要读取什么、返回什么、由谁确认；确认后写成交接说明，并证明当前入口会诚实提示“第二周接入”。'
      checklist:
      - 预留接口不调用模型
      - 返回明确未接入状态
      - 页面样例仍标演示数据
      - 交接文档写清输入输出与人工确认
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 把演示数据换成真实数据，跑通全流程
    minutes: 35
    form: 实操+验收
    content_ref: class/bootcamp/day-03/section-05-accept/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：联调不是两个 Agent 互相说完成，而是学员按契约分段验证：接口有数据、前端请求正确、页面显示正确。


      请记住三件事。


      「业务 Mock 必须移除或隔离。」


      「完整走提交、SQLite、列表、详情和看板更新。」


      「遇到问题先查契约，再判断由前端还是后端修复。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：指挥前端切换真实 API，学员亲手走完整业务流程并记录证据。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent + 学员亲测'
      note: 本节交付：真实数据全链路 V0.8 + 冒烟记录
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 页面显示的名称和数据服务返回的名称对不上，第一步是什么？
      - - 让两个岗位各自修改直到碰巧成功
        - 查看双方传话约定，先判断谁没有遵守或约定哪里不清
        - 把演示数据重新放回页面
      - 1
      - 先修正约定，再修改实现，才能让问题不再重复出现。
    media:
    - kind: video
      title: 口播课件 · 第 5 节
      object_key: documents/shared/course-media/day03-c5-accept.mp4
      poster_key: documents/shared/course-media/day03-c5-accept-poster.jpg
      duration_sec: 53
    knowledge_cards:
    - id: d3l5-k1
      term: 先按约定逐项核对
      plain: 名称或格式对不上时先查双方约定，不让两个 AI 各自猜答案。
    - id: d3l5-k2
      term: 每接一段就检查一段
      plain: 依次检查列表、提交、详情和看板，避免所有问题最后缠在一起。
    - id: d3l5-k3
      term: 完成后赶走假数据
      plain: 确保所有业务页面都读取真实记录，不再偷偷使用演示数据入口。
    memory_sentence: 对不上时先查约定，不靠猜；接完以后赶走假数据，用一条真实记录证明全流程。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请把四个页面从演示数据切换成后端的真实业务数据。先用大白话告诉我哪些地方会改变，确认后再切换。完成后带我亲手走“提交—保存—列表—详情—驾驶舱更新”，记录真实结果；不要只看代码就宣布完成。'
      checklist:
      - 业务数据不再来自 Mock
      - 提交到看板更新全链路通过
      - 冒烟记录每步有证据
      - AI 边界仍然诚实
      - 发现的问题按契约定位并复验
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 用户提交一条记录后，数据首先由谁接收并校验？
    options:
    - 驾驶舱图表
    - 后端接口
    - README
    answer: 1
    explain: 前端发请求，后端执行规则并写入数据库。
  - q: 看板数字的可信证据是什么？
    options:
    - 颜色好看
    - 能与列表和数据库记录核对
    - Agent 说正确
    answer: 1
    explain: 统计结果必须可追溯。
  - q: 数据库字段的上游依据是什么？
    options:
    - PRD 字段清单和接口契约
    - 页面配色
    - 测试报告
    answer: 0
    explain: 数据结构要保持跨岗位一致。
  - q: 状态为什么不宜任意输入？
    options:
    - 会让统计和流程判断混乱
    - 会让页面变慢
    - 会让按钮变色
    answer: 0
    explain: 受控枚举能保证业务状态一致。
  - q: 生成了接口代码是否等于接口完成？
    options:
    - 是
    - 否，还要用真实请求验证数据库读写和错误响应
    - 只要不报错就是
    answer: 1
    explain: 运行证据才是完成依据。
  - q: 看板统计能否写死？
    options:
    - 能
    - 不能，必须由真实记录聚合
    - 演示时可以不标
    answer: 1
    explain: 写死数字不能反映业务变化。
