<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="06-fields-example">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="13" flood-color="#0d9488" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="506" cy="50" r="82" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="82;96;82" dur="9.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="420" r="58" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="58;68;58" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="40" y="29" width="6" height="22" rx="3" fill="url(#teal)"/><text x="56" y="46" font-size="19" font-weight="800" fill="#231f20">字段要写含义</text><text x="520" y="45" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.42)">FIELDS</text></g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <g transform="translate(40,100)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.15s" dur="2.6s" repeatCount="indefinite"/>
  <rect x="-6" y="-6" width="244" height="78" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".45;.12;.45" dur="2.3s" repeatCount="indefinite"/></rect>
  <rect width="232" height="66" rx="16" fill="url(#teal)" filter="url(#glow)"/>
  <text x="116" y="38.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#fff">名称</text>
  </g>
  <g transform="translate(288,100)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.45s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="232" height="66" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="116" y="38.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#231f20">金额</text>
  </g>
  <g transform="translate(40,182)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.75s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="232" height="66" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="116" y="38.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#231f20">状态</text>
  </g>
  <g transform="translate(288,182)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.05s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="232" height="66" rx="16" fill="#fff" filter="url(#sh)"/>
  <text x="116" y="38.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#231f20">更新时间</text>
  </g>
  </g>

  <g transform="translate(40,274)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.15s" dur="2.6s" repeatCount="indefinite"/><rect width="480" height="56" rx="14" fill="#fff" filter="url(#sh)"/><rect x="15" y="13.0" width="30" height="30" rx="9" fill="rgba(13,148,136,.10)"/><circle cx="30" cy="28.0" r="4" fill="#0d9488"/><text x="60" y="33.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#231f20">不要只列英文变量</text></g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="200" y="406" width="161" height="38" rx="19" fill="rgba(13,148,136,.09)"/><circle cx="220" cy="425" r="3.5" fill="#0d9488"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="230" y="430" font-size="13" font-weight="700" fill="#0f766e">后端要理解业务用途</text></g>
</svg>
