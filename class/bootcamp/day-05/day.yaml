capsule_extra:
  c1:
    resource_ids:
    - dg-waves
    - glossary
    media:
    - kind: video
      title: 口播课件 · 这个时代是怎么来的
      object_key: documents/shared/course-media/day05-c1-worldview.mp4
      poster_key: documents/shared/course-media/day05-c1-worldview-poster.jpg
      duration_sec: 368
    knowledge_cards:
    - id: wave-law
      term: 浪潮规律
      plain: 每波把「动手做」压便宜一层，把「知道该做什么、做得对不对」抬贵一层。
      detail: 浪潮不淘汰人，淘汰的是「只会动手」。判断与验收一波比一波贵——这就是你坐在这门课里的原因。
      tag: 核心
    - id: cheap-expensive
      term: 谁变贵 / 谁变便宜
      plain: 会把纸上的活搬进新工具的人变贵；只守着旧手艺的人变便宜。
      detail: 算盘→电脑、店面→网页、自建机房→云、桌面→口袋、复制粘贴→Agent——每波都在重排价目表。
      tag: 框架
    - id: ai-intern
      term: 认字的实习生
      plain: AI 像认字很快的实习生：你不说清楚他就乱干；干完了也不知道对不对。
      detail: 定方向（说清楚）和做验收（判断对错）都在你——这两件才是正在变贵的能力。
      tag: 类比
    - id: gen-four
      term: 四代用 AI
      plain: 对话搬运 → 提示词工程 → Tool Call / Vibe Coding → Agent 原生系统。
      detail: 第一代你是搬运工；第二代把格式写死仍不稳定；第三代模型自己调工具；第四代记忆/Harness/RAG/流程全部接入。
      tag: 演进
    - id: agent-native
      term: Agent 原生系统
      plain: Agent 把工具、记忆、Harness、RAG 和企业流程资产接起来，跑超长任务。
      detail: 这是本课程的地基词——后面所有课都盖在这块上。形态可能是软件、SaaS，甚至未来的操作系统。
      tag: 地基
    - id: dispatch-accept
      term: 派活与验收
      plain: 派活=把任务写清楚（PRD/提示词）；验收=对照标准判断对不对。
      detail: 前四天你练的就是这两样——写 PRD、写提示词、过 Rubric。会派活、会验收的人，一波比一波贵。
      tag: 行动
    glossary_terms:
    - id: gt-wave
      term: 技术浪潮
      plain: 一波新工具把「动手」变便宜、把「判断与验收」变贵的时代切换。
      detail: 电脑、网页、云、移动、AI 帮写、Agent 原生——六波都在重排谁值钱。
    - id: gt-llm
      term: LLM
      plain: 大语言模型：用海量文本练出来的「预测下一个词」的机器。
    - id: gt-hallucination
      term: 幻觉
      plain: 模型给「最像真的」答案，不是「核实过」的答案——机制如此，不是偶发 bug。
    - id: gt-agent
      term: Agent
      plain: 能自己规划、调工具、看结果、继续干的 AI；你定方向、做验收。
    - id: gt-harness
      term: Harness
      plain: 模型外面那套循环：工具表、记忆、重试、日志——骨架不同，能力差很多。
    - id: gt-dispatch
      term: 派活 / 验收
      plain: 派活=把任务说清楚；验收=对照标准判断对不对。这两件正在变贵。
    quiz:
    - - 六次浪潮的共同规律是什么？
      - - 每波都让程序员更贵
        - 每波都把「动手做」压便宜一层，把「知道该做什么」抬贵一层
        - 每波都淘汰一半职业
      - 1
      - 浪潮不淘汰人，淘汰的是「只会动手」——判断与验收一波比一波贵。
    - - 「AI 是认字的实习生」这个比方里，实习生取代不了你的两个原因是？
      - - 他不会写代码也不会查资料
        - 你不说清楚他就乱干；他干完不知道对不对
        - 他要工资而且经常请假
      - 1
      - 定方向（说清楚）和做验收（判断对错）都在你——这正是变贵的两件事。
    - - 爷爷用算盘、爸爸用计算器、你用 Excel、下一代用 AI 表格——这条线说明什么？
      - - 会计这个职业每代都在消失
        - 「算」这个动作一代比一代便宜，人不断往判断层上移
        - 工具越贵，人越值钱
      - 1
      - 机器每压低一层动手成本，人就上移一层——浪潮的同一个故事。
    - - Day 3 你的 index.html 大头是 AI 写的，这件事说明什么？
      - - 你的作品没有价值
        - 「写」正在变便宜，你做的「定方向+验收」才是价值所在
        - 以后不用学任何前端知识
      - 1
      - 写变便宜不等于作品没价值——价值在你定的方向和卡的验收。
    - - 判断「下一波浪潮来了」的信号是？
      - - 新闻里都是它
        - 机器又把某件「动手」的事的成本打到接近零
        - 股票价格涨了
      - 1
      - 盯住成本变化而非名词热度——规律比名单重要。
    - - 「会派活、会验收的人一波比一波贵」里的「派活」对应你前四天的哪个动作？
      - - 每天过 Rubric
        - 写 PRD、写提示词——把任务说清楚
        - 在群里提需求
      - 1
      - 派活=把任务写清楚（PRD/提示词）；验收=过 Rubric——你两样都练了。
    tools:
    - name: 「认字的实习生」便签
      note: 你不说清楚他就乱干；他不知对错
  c6:
    resource_ids:
    - dg-be-map
    - h5-tech
    media:
    - kind: video
      title: 口播课件 · 后端技术地图
      object_key: documents/shared/course-media/day05-c5-backend.mp4
      poster_key: documents/shared/course-media/day05-c5-backend-poster.jpg
      duration_sec: 207
    knowledge_cards:
    - id: be-three
      term: 后端三件事
      plain: 接请求、算逻辑、读写数据——页面背后那一套。
      tag: 核心
    - id: db-home
      term: 数据库是住所
      plain: 给数据一个能长期住、能按规则查的地方，不是「另一个 Excel」。
      tag: 基础
    - id: mysql-pg
      term: MySQL / PostgreSQL
      plain: 两款主流关系库；起步也可用 SQLite。选型看生态与约束，不是宗教。
      tag: 选型
    - id: ddl-dql
      term: DDL / DQL
      plain: DDL 建表改结构；DQL 查询数据——你 Day 4 动手过。
      tag: 术语
    - id: be-four
      term: 四大语言路线
      plain: Java / Python / Node / Go——语言选边，框架是招牌。
      tag: 地图
    - id: contract-first
      term: 契约先行
      plain: 先定 API 长什么样，再选语言框架——接口比品牌重要。
      tag: 原则
    glossary_terms:
    - id: gt-backend
      term: 后端
      plain: 用户看不见、但负责业务规则与数据持久化的服务端。
    - id: gt-api
      term: API
      plain: 前后端约定好的「取数/办事」接口。
    - id: gt-sql
      term: SQL
      plain: 跟关系库说话的语言：建表、查、改、删。
    - id: gt-redis
      term: Redis
      plain: 内存型加速层，常作缓存，不是主业务库的替代品。
    - id: gt-orm
      term: ORM
      plain: 用对象代码映射表结构，少手写部分 SQL——要懂底层，别只会魔法。
    quiz:
    - - 后端三件事是？
      - - 页面、样式、动画
        - 业务逻辑、数据、接口
        - 服务器、域名、备案
      - 1
      - 规则（逻辑）、存取（数据）、对话（接口）——后厨的三样活。
    - - 做「周报汇总 + AI 摘要」小工具，两周要跑起来，首选路线是？
      - - Java + Spring Boot
        - Python + FastAPI
        - Go + Gin
      - 1
      - AI 项目首选 Python——模型生态在这，FastAPI 起手最快。
    - - FastAPI 和你的 API_Spec.md「天生一对」是因为？
      - - 它能自动生成 OpenAPI 接口文档
        - 它速度最快
        - 它是 Java 写的
      - 0
      - 给它函数就出 OpenAPI——契约先行的理念在工具里内置了。
    - - 「契约是合同，语言只是施工队」意味着？
      - - 先定语言再写接口
        - 接口契约（路径/参数/响应）可以先定，实现语言后面再挑
        - 合同签完就不能换语言
      - 1
      - API_Spec.md 用 Java 或 Python 实现都行——前端不在乎。
    - - 三种场景各选什么库？①两周的原型 ②千万用户的订单系统 ③要存商品向量做相似推荐
      - - 全用 MySQL
        - ①SQLite ②PostgreSQL/MySQL 集群 ③PostgreSQL（向量插件）
        - 全用 SQLite
      - 1
      - 原型求快、生产求稳、AI 求向量——场景决定数据库，不是名气。
    - - 200 人团队、要维护十年的银行核心系统，最合理的技术路线是？
      - - Python + Flask
        - Java + Spring Boot
        - Node + Express
      - 1
      - 大企业长期系统：规矩全、能扛大场面、十年后来的人也接得住。
    - - 「两周内给部门上线周报工具，几乎没并发」，数据库最合理的选择是？
      - - Oracle 集群
        - SQLite 起步，长大再迁 PostgreSQL
        - MongoDB 分片
      - 1
      - 一个文件就是一个库——先跑起来；契约清晰时迁库不难。
    tools:
    - name: 契约先行便签
      note: 契约是合同，语言只是施工队
  c5:
    resource_ids:
    - dg-fe-map
    - h5-tech
    media:
    - kind: video
      title: 口播课件 · 前端技术地图
      object_key: documents/shared/course-media/day05-c4-frontend.mp4
      poster_key: documents/shared/course-media/day05-c4-frontend-poster.jpg
      duration_sec: 228
    knowledge_cards:
    - id: fe-four
      term: 前端四大平台
      plain: Web 网页、手机 App、小程序、桌面软件——用户「摸」到的都算前端。
      tag: 地图
    - id: fe-framework
      term: 前端框架
      plain: React/Vue/Angular/Svelte 等：帮你组织页面与状态，不是唯一正确答案。
      tag: 选型
    - id: native-vs-cross
      term: 原生 vs 跨端
      plain: 原生两套（iOS/Android）体验最好；跨端用一套代码换效率。
      tag: 选型
    - id: mini-program
      term: 小程序
      plain: 长在微信等超级 App 里的轻应用——安装成本接近零。
      tag: 平台
    - id: fe-four-q
      term: 选型四问
      plain: 用户在哪打开？要不要商店？团队会什么？AI 写这类代码熟不熟？
      tag: 方法
    - id: day3-link
      term: 回扣 Day 3
      plain: 你做过的页面/交互，就是前端地图上的一格——今天把格填进整张图。
      tag: 连接
    glossary_terms:
    - id: gt-frontend
      term: 前端
      plain: 用户直接看见、摸到的那一层界面与交互。
    - id: gt-react
      term: React
      plain: 目前最常见的 Web 前端库之一；生态大，AI 也很熟。
    - id: gt-vue
      term: Vue
      plain: 另一条主流 Web 框架路线，上手曲线通常更平。
    - id: gt-spa
      term: SPA
      plain: 单页应用：页面不整页刷新，靠前端路由切换视图。
    - id: gt-electron
      term: Electron
      plain: 用网页技术包一层壳，做成桌面软件的常见方案。
    quiz:
    - - 「前端」的完整范围是？
      - - 只做网页
        - 用户直接接触的界面层：Web 网页 / App / 小程序 / 桌面软件
        - 只写 HTML 的人
      - 1
      - 三件套只是 Web 那一支的地基——选型第一步是先定平台。
    - - 「AI 最会写、网上答案最多」是选 React 的核心理由，它属于四问中的哪一问？
      - - 团队会什么
        - 生态大不大（含 AI 生成质量）
        - 项目有多大
      - 1
      - 生态=遇坑有答案+招得到人+AI 写得稳——React 目前占优。
    - - 要做 iOS 和 Android 两端、团队小、想一套代码，选哪条 App 路线？
      - - 原生 Swift + Kotlin
        - Flutter 或 React Native（跨端）
        - Electron
      - 1
      - 原生要养两套代码两拨人；跨端一套代码出两端——小团队默认跨端。
    - - 团队只有一个会 Vue 的实习生，却要做三十页的内部系统，最合理的选择是？
      - - React，因为生态最大
        - Vue，因为团队会什么优先
        - Angular，因为页面多
      - 1
      - 四问按顺序：团队会什么是第一问——学习成本是真实成本。
    - - Angular 最典型的使用场景是？
      - - 个人尝鲜小项目
        - 大企业的长期巨型项目
        - 一次性活动页
      - 1
      - 全家桶+严规矩，十年后来的人也能按同一套规矩接手——大货车不跑菜市场。
    - - 「框架是项目长大了才需要的装备」意味着？
      - - 小项目用框架显得专业
        - 项目变大（多页面/多人/接真实数据）再引入框架不迟
        - 框架永远不需要
      - 1
      - 不是出门必背的包——你们 Day 3 不用框架就是当时的正确答案。
    - - 做国内「扫码即用、不用下载」的点单应用，选什么平台和框架？
      - - App：原生 Swift
        - 小程序：微信原生；要多端就 Taro / uni-app
        - 桌面：Electron
      - 1
      - 轻量+借微信流量→小程序；微信原生最稳，多端用 Taro/uni-app。
    tools:
    - name: 三件套比喻卡
      note: 骨架 · 皮肤 · 肌肉
