<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-label="V2 成品全景：驾驶舱 + 挂 Skill 的 Agent + 十条能力证据，人在上面派活确认验收">
  <defs>
    <linearGradient id="vp-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="vp-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="vp-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="vp-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="vp-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
    <marker id="vp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>
  <rect width="1040" height="560" fill="url(#vp-dots)"/>
  <circle cx="80" cy="80" r="70" fill="rgba(13,148,136,.05)">
    <animate attributeName="r" values="70;84;70" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- header -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="36" y="18" width="6" height="24" rx="3" fill="#0d9488"/>
    <text x="52" y="37" font-size="17" font-weight="800" fill="#231f20">你的 V2 成品全景：一个能派活的驾驶舱</text>
    <text x="1004" y="37" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">V2 PANORAMA</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <!-- left: dashboard -->
    <g transform="translate(50,100)" filter="url(#vp-sh)">
      <rect width="320" height="306" rx="18" fill="#fff"/>
      <text x="160" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">驾驶舱前端（六个区块）</text>
      <g font-size="12" font-weight="700">
        <g transform="translate(24,52)">
          <rect width="130" height="58" rx="10" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.4)" stroke-width="1"/>
          <text x="65" y="35" text-anchor="middle" fill="#0f766e">核心指标</text>
        </g>
        <g transform="translate(166,52)">
          <rect width="130" height="58" rx="10" fill="rgba(242,78,84,.08)" stroke="rgba(242,78,84,.35)" stroke-width="1"/>
          <text x="65" y="35" text-anchor="middle" fill="#d63343">趋势图</text>
        </g>
        <g transform="translate(24,122)">
          <rect width="130" height="58" rx="10" fill="rgba(28,213,176,.12)" stroke="rgba(10,143,116,.35)" stroke-width="1"/>
          <text x="65" y="35" text-anchor="middle" fill="#0a8f74">数据表</text>
        </g>
        <g transform="translate(166,122)">
          <rect width="130" height="58" rx="10" fill="rgba(245,169,71,.14)" stroke="rgba(217,119,6,.35)" stroke-width="1"/>
          <text x="65" y="35" text-anchor="middle" fill="#b45309">筛选器</text>
        </g>
        <g transform="translate(24,192)">
          <rect width="130" height="58" rx="10" fill="rgba(95,82,160,.08)" stroke="rgba(95,82,160,.35)" stroke-width="1"/>
          <text x="65" y="35" text-anchor="middle" fill="#5f52a0">详情面板</text>
        </g>
        <g transform="translate(166,192)">
          <rect width="130" height="58" rx="10" fill="url(#vp-teal)" filter="url(#vp-glow)"/>
          <text x="65" y="35" text-anchor="middle" fill="#fff">AI 助手位</text>
          <rect x="-6" y="-6" width="142" height="70" rx="14" fill="none" stroke="#0d9488" stroke-width="1.6" opacity=".4">
            <animate attributeName="opacity" values=".45;.12;.45" dur="2.4s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
      <text x="160" y="286" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)">React + FastAPI + SQLite · 云上部署</text>
    </g>

    <!-- middle: agent -->
    <g transform="translate(420,100)">
      <rect width="220" height="306" rx="18" fill="#fff" stroke="#0d9488" stroke-width="2" filter="url(#vp-glow)"/>
      <text x="110" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#0d9488">Agent（你的数字同事）</text>
      <circle cx="110" cy="92" r="42" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="5 6" opacity=".55">
        <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="92" r="32" fill="rgba(13,148,136,.08)" stroke="#0d9488" stroke-width="1.8"/>
      <text x="110" y="89" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">决策环</text>
      <text x="110" y="106" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.6)">感知→想→做</text>
      <g font-size="12" font-weight="700">
        <g transform="translate(20,146)">
          <rect width="180" height="38" rx="19" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.4)" stroke-width="1"/>
          <text x="90" y="24" text-anchor="middle" fill="#0f766e">Skill · 拉数据</text>
        </g>
        <g transform="translate(20,194)">
          <rect width="180" height="38" rx="19" fill="rgba(224,71,158,.08)" stroke="rgba(224,71,158,.35)" stroke-width="1"/>
          <text x="90" y="24" text-anchor="middle" fill="#c22e82">Skill · 生成周报</text>
        </g>
        <g transform="translate(20,242)">
          <rect width="180" height="38" rx="19" fill="rgba(242,78,84,.08)" stroke="rgba(242,78,84,.35)" stroke-width="1"/>
          <text x="90" y="24" text-anchor="middle" fill="#d63343">Skill · 发送（带确认）</text>
        </g>
      </g>
      <text x="110" y="300" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">Harness 供上下文 · 异常有分类</text>
    </g>

    <!-- arrows between -->
    <path d="M374 254 H412" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#vp-arr)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M646 254 H682" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#vp-arr)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- right: evidence checklist -->
    <g transform="translate(690,100)" filter="url(#vp-sh)">
      <rect width="300" height="306" rx="18" fill="#fff"/>
      <text x="150" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">十条能力证据（验收单）</text>
      <g font-size="12.5" fill="#231f20">
        <g opacity="0"><text x="24" y="64"><tspan fill="#0d9488" font-weight="700">✓</tspan> 讲清四层架构与取舍</text><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="92"><tspan fill="#0d9488" font-weight="700">✓</tspan> 前端三态 + 迭代日志</text><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="120"><tspan fill="#0d9488" font-weight="700">✓</tspan> 接口契约 + 状态码语义</text><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="148"><tspan fill="#0d9488" font-weight="700">✓</tspan> 表设计 + SQL 四招</text><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="176"><tspan fill="#0d9488" font-weight="700">✓</tspan> Prompt 四要素 + 成本观</text><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="204"><tspan fill="#0d9488" font-weight="700">✓</tspan> 环境变量与配置分离</text><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="232"><tspan fill="#0d9488" font-weight="700">✓</tspan> 一个带验收的 Skill</text><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="260"><tspan fill="#0d9488" font-weight="700">✓</tspan> 编排含确认点与日志</text><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/></g>
        <g opacity="0"><text x="24" y="288"><tspan fill="#0d9488" font-weight="700">✓</tspan> 线上可访问的 V2</text><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/></g>
      </g>
    </g>

    <!-- dashed links from human band -->
    <path d="M210 442 V412" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#vp-arr)">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M530 442 V412" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#vp-arr)">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M840 442 V412" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#vp-arr)">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- bottom: human band -->
    <g transform="translate(50,448)">
      <rect width="940" height="74" rx="20" fill="url(#vp-band)" filter="url(#vp-glow)"/>
      <text x="470" y="32" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">你（人）：派活 → 确认关键动作 → 按验收单收货</text>
      <text x="470" y="56" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.85)">FDE = 架构你定、脏活 AI 干、质量你验收</text>
    </g>
  </g>
</svg>
