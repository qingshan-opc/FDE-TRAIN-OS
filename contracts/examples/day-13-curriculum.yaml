  - q: 哪一项最能证明某位老员工拥有非正式影响力？
    options:
    - 年龄较大
    - 工龄较长
    - 同事遇到复杂问题会主动征询他，经理也会参考其意见
    - 他对新工具比较谨慎
    answer: 2
    explain: 影响力应由可观察行为证明。年龄、工龄和态度只能作为背景。
  - q: 销售助理维护客户表，但部门经理决定用途。销售助理属于：
    options:
    - 保管者和维护者
    - 最终授权者
    - 项目发起人
    - 财务责任人
    answer: 0
    explain: 文件入口和日常维护由销售助理掌握，使用授权仍需业务管理责任人确认。
