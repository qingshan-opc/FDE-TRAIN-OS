    - id: gt-tool-table
      term: 工具表
      plain: Agent 能调用的 Skill 清单——描述写得越清，选型越准。
    local_prep:
      codex_prompt: "# 提示词 03a · 定义 SKILL.md（D7 · 第 4 节）\n\n> 整份粘贴。本节 **只定稿说明书**，先不要写扫描器 / 运行器。\n\n---\n\n请在本仓库 **只创建 1 个真实业务\
        \ Skill 的说明书**（用你现有业务数据，禁止空洞 demo）。\n\n## 交付\n\n创建目录与文件：\n\n```text\nskills/<id>/SKILL.md\n```\n\n`SKILL.md` 必须包含：\n\
        \n1. YAML frontmatter：`name`、`description`（description 要写清「何时用 / 何时不用」）\n2. 正文四部件：\n   - **输入**：字段、来源（具体 API 路径或文件）、范围\n\
        \   - **步骤**：可照做的动词序列（禁止「适当分析」等模糊词）\n   - **输出**：产物格式与存放路径\n   - **验收**：≥3 条可判对错的标准\n\n## 硬约束\n\n- 输入必须绑到学员自己的业务数据（本机\
        \ API 或导出 JSON），不要假数据故事。\n- 本节 **不要** 实现扫描器、tool、HTTP API；下一节再做加载与 run。\n- 定稿后列出：Skill 名称、输入从哪来、验收三条原文。\n\n## 验收\n\
        \n- `skills/<id>/SKILL.md` 存在且四部件齐全\n- 换一个人只看说明书，能说出输入从哪拿、怎么判对错\n\n先列计划（文件级），等我回复「确认」后再写文件。"
      checklist:
      - frontmatter + 四部件齐全
      - 输入绑定真实业务数据源
      - 换人三问能答对
  - id: c5
    title: 加载·运行·证据
    minutes: 25
    form: 实战
    content_ref: class/bootcamp/day-08/section-05-run-evidence/lesson.md
    content: '同学们，这节 AI 拿着你的说明书上岗。你的工作变成四步：派活、收货、按标准验收、留证据——不再是自己打字，而是按标准验货。运行就是说明书加输入，一句按这份 Skill 执行，对吧。

      运行方式很简单：Agent Lab 或模型对话里，先粘贴 Skill 说明书全文，再粘贴输入数据——驾驶舱 curl 结果或数据文件，最后一句按这份 Skill 执行。收货后别看感觉，看你写的验收段：逐条判 ✓ 还是 ✗，对吧。

      每次运行留证据三件套：runs/日期-skill名/ 目录下，input.md 是输入快照，output.md 是产出物原文，verdict.md 是验收结果——逐条判 ✓/✗，加总判和改进项。Skill 的信任是攒出来的，连续十次通过，你才敢把每次都看降级成抽看，嘛。

      验收不过怎么办？定位是说明书歧义还是 AI 执行偏差。歧义就改说明书——多数情况是这个；偏差就换表达、加示例、拆步骤，然后重跑。记住：验收不过大概率是说明书的锅，不是 AI 的锅。就像换人测试里读者误解，是作者的锅，对吧。

      AI 没按步骤做、直接跳到生成？在说明书开头加严格按步骤顺序执行，每步完成后简述结果。每次跑结果不一样？正常，模型有概率性；验收标准管的是底线——结构、数字、意图，波动在标准内即可。今天目标：连续两次验收全过，对吧。

      证据归档，迭代日志写清楚改了什么、重跑了几次。下一节是第七天验收——Skill 三问口试，导师看证据链。带走一句：Skill 的信任是攒出来的，证据三件套就是你的本金，嘛。'
    practice: '完成标志：

      [ ] Skill 可被列出（Available skills）

      [ ] 至少成功 run 1 次且 verdict 通过或诚实记录失败原因

      [ ] 证据进 Git'
    resource_ids:
    - dg-skill-anatomy
    tools:
    - name: 运行记录模板
      note: 时间 | 输入摘要 | 产出路径 | 验收结果
    quiz:
    - - Skill 跑完必须留下什么？
      - - 好印象
        - 可检查的证据：产物文件 + 运行记录
        - 完整聊天记录导出
      - 1
      - 没有证据的运行等于没跑——和 Eval 思维一致。
    - - 验收结果应如何记录？
      - - 口头告诉导师
        - 对照验收标准逐条判过/不过，写入 runs/
        - 只记「成功了」
      - 1
      - 第三方应能独立复查：打开产物 + 日志即可验证。
    - - prompts/summary.md 和今日 Skill 的关系是？
      - - 完全无关
        - Week 1 的 summary 提示词是「半个 Skill」——今天升级成完全体
        - 必须删除旧文件
      - 1
      - 有契约、有红线，缺运行步骤与验收执行——今天补全。
    media:
    - kind: video
      title: 口播课件 · 运行一次
      object_key: documents/shared/course-media/day07-c5-run-evidence.mp4
      poster_key: documents/shared/course-media/day07-c5-run-evidence-poster.jpg
      duration_sec: 113
    knowledge_cards:
    - id: run-once
      term: 运行一次
      plain: 按说明书真实执行，不是「我觉得能跑」——证据必须第三方可查。
      tag: 实战
    - id: run-log
      term: 运行记录
      plain: 时间、输入摘要、产出路径、验收结果——写入 runs/ 目录。
      tag: 证据
    glossary_terms:
    - id: gt-runs-dir
      term: runs/
      plain: 存放 Skill 运行记录与产物的目录——可复查、可回放。
    local_prep:
      codex_prompt: "# 提示词 03b · Skill 加载 · 运行 · 证据（D7 · 第 5 节）\n\n> 整份粘贴。前置：上一节已定稿 `skills/<id>/SKILL.md`。  \n> 本节 **不要重写说明书**；专注扫描器、调用与\
        \ runs/ 证据。\n\n---\n\n请在本仓库实现 **Skill 加载与运行最小内核**（Python / Node 与现有后端一致即可）。\n\n## 前置检查\n\n先确认已有 ≥1 个合格 `skills/<id>/SKILL.md`。若缺失，先停下来告诉我，不要擅自重写一整份说明书。\n\
        \n## 要求\n\n1. **扫描器**：启动时或首次调用时加载全部 `skills/*/SKILL.md`，产出「Available skills」列表（可注入 system，或提供列表 API）。\n2. **调用入口**（二选一或都做）：\n\
        \   - 工具 / 函数 `skill(name, input)`\n   - HTTP：`POST /api/agent/skill/run`（body：`name` + `input`）\n3. **执行**：读取对应 `SKILL.md`，按说明书对真实业务输入跑通一次（可让\
        \ LLM 按说明书产出，或跑可选脚本）。\n4. **证据目录**（必须真实写入）：\n\n```text\nruns/<YYYYMMDD>-<skill>/\n  input.md\n  output.md\n  verdict.md\n\
        ```\n\n`verdict.md` 对照验收标准逐条 ✓/✗；失败也要诚实记录原因。\n\n5. `docs/` 或 README 加一小节：如何新增第二个 Skill（复制目录 → 改 frontmatter → 重启扫描）。\n\
        \n## 验收\n\n- 能列出 Available skills（含上一节那个）\n- 至少成功 run 1 次，`runs/` 三件套齐全\n- 对话或 CLI 能触发「请运行某某 Skill」（可先做显式命令，不必完整 Agent\
        \ Loop）\n\n先列计划，等「确认」再改代码。若上一节提示词会话还在，也可回复「继续完成加载与 run」，但改动范围仍以本节为准。"
      checklist:
      - Skill 可被列出（Available skills）
      - 至少成功 run 1 次且 verdict 通过或诚实记录失败原因
      - 证据进 Git
quiz:
  pass_rate: 0.67
  questions:
  - q: Week 2 的主线换档是？
    options:
    - 从写代码到写文档
    - 从「做系统」到「造能力（Skill）」
    - 从本地到云端
    answer: 1
    explain: 驾驶舱是系统；Skill 是能力——AI 拿着说明书就能干活。
  - q: Skill 四部件是？
    options:
    - 前端/后端/数据库/模型
    - 输入 / 步骤 / 输出 / 验收
    - 需求/设计/开发/测试
    answer: 1
    explain: 四部件一个不能少；验收必须可判对错。
  - q: Prompt 和 Skill 的本质区别？
    options:
    - Prompt 更高级
    - Prompt 一次性对话；Skill 可复用、有验收、可交接
    - 没有区别
    answer: 1
    explain: Week 1 散落在对话里的 Prompt，今天固化为 Skill。
  - q: 选第一个 Skill 的三筛法是？
    options:
    - 难/贵/新
    - 高频 / 稳定 / 低险
    - 快/省/好
    answer: 1
    explain: 第一个 Skill 练信任——低险是硬筛。
  - q: 「工具描述」为什么要写「何时不用」？
    options:
    - 法律免责
    - 帮 Agent 判断该不该选这件工具（Day 8 选错图谱）
    - 凑文档厚度
    answer: 1
    explain: 描述决定 Agent 第 1 步理解任务时选不选得对。
  - q: 步骤「分析一下数据」的主要问题是？
    options:
    - 太短
    - 不可执行——没有具体操作序列
    - 应该用 bullet
    answer: 1
    explain: 步骤要细到可照做，不能留「分析」这种黑洞词。
  - q: Skill 运行后必须留下？
    options:
    - 口头汇报
    - 可检查的证据（产物 + runs/ 记录）
    - 截图发群
    answer: 1
    explain: 没有证据 = 没跑；和 Eval 思维一脉相承。
  - q: 输出 + 验收对应 Week 1 的？
    options:
    - 三态与降级
    - 结构化输出 + Rubric
    - 契约与 DDL
    answer: 1
    explain: Week 1 概念在 Skill 说明书里各有一格。
  - q: 第一个 Skill 不建议封装？
    options:
    - 每周周报
    - 给客户发报价邮件（不可撤回、高险）
    - 从 API 拉 KPI
    answer: 1
    explain: 对外发送/改数据/花钱——Day 9 确认闸后再碰。
  - q: Skill 三问不包括？
    options:
    - 它做什么（输入→输出）
    - 步骤谁定
    - 用哪个 AI 模型
    answer: 2
    explain: 三问：做什么、步骤谁定、好坏谁判——模型是 Harness 的事。
  - q: GATE 7 过闸必须包含？
    options:
    - 视频看完
    - 现场运行 + 产出过验收 + 说明书进 Git
    - 背下四部件定义
    answer: 1
    explain: 能跑、有证据、可交接——三问是口答检验理解。
  - q: 「系统被使用，能力被执行」意思是？
    options:
    - 系统和能力一样
    - 驾驶舱等人看；Skill 被 AI 拿去干活
    - 能力比系统高级
    answer: 1
    explain: 你从操作者变成派活的人——Week 2 的核心位移。
