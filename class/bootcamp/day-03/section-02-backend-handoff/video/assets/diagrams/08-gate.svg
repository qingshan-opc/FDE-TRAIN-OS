<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="人工确认闸">
<defs>
<linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient>
<linearGradient id="tealH" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#231f20" flood-opacity=".08"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".38"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/></marker>
</defs>
<rect width="560" height="460" fill="#ffffff"/>
<rect width="560" height="460" fill="url(#dots)"/>
<circle cx="480" cy="56" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;112;96" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="64" cy="404" r="68" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="68;80;68" dur="11s" repeatCount="indefinite"/></circle>
<rect x="28" y="24" width="6" height="24" rx="3" fill="#0d9488"/>
<text x="46" y="42" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="800" fill="#231f20">人工确认闸</text>
<text x="532" y="42" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.4)">DIAGRAM · GATE</text>
<rect x="40" y="96" width="300" height="190" rx="18" fill="#fff" filter="url(#sh)"></rect>
<text x="62" y="126" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.45)">CHECKLIST · 开工前</text>
<rect x="62" y="148" width="22" height="22" rx="6" fill="#fff" stroke="rgba(35,31,32,.25)" stroke-width="1.5"/>
<text x="98" y="164" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#231f20">学员检查方案</text>
<rect x="62" y="192" width="22" height="22" rx="6" fill="url(#teal)"/>
<path d="M67.5 203.5 L71.5 208 L78.5 198" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="208" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#231f20">本人回复</text>
<text x="62" y="252" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="rgba(35,31,32,.5)">逐项核对 · 回复确认后才进入开发</text>
<path d="M344 230 L412 230" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.0s" repeatCount="indefinite"/></path>
<circle r="4" fill="#0d9488"><animate attributeName="cx" values="344;412" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="230;230" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="1.6s" repeatCount="indefinite"/></circle>
<rect x="412" y="118" width="108" height="224" rx="20" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.14;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="420" y="126" width="92" height="208" rx="16" fill="url(#teal)" filter="url(#glow)"/>
<text x="466" y="216" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#fff">GATE</text>
<text x="466" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,.9)">确认后端</text>
<text x="466" y="262" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,.9)">方案</text>
<rect x="40" y="380" width="480" height="44" rx="22.0" fill="rgba(13,148,136,.09)"/>
<text x="280.0" y="406.86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">等人确认 · 确认后端方案</text>
</svg>
