      - 手动切换让小白亲自控制开发流程，知道当前是谁在工作、接收了什么、下一步交给谁。
    - - 创建岗位智能体时，提示词最重要的作用是什么？
      - - 改变编辑器颜色
        - 固定岗位职责、流程、边界和交付物
        - 自动购买模型额度
      - 1
      - 角色提示词相当于岗位说明书，保证同一智能体多次工作时仍遵守相同规则。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '本节不是让 AI 替你自动创建团队，而是由你在 TRAE 中亲手完成六次创建。


        【第 1 步｜打开创建入口】

        点击对话框当前的 @Agent，在智能体列表底部点击“创建智能体”。


        【第 2 步｜创建产品经理】

        名称填“产品经理”，把课程资源中的产品经理提示词正文完整粘入“提示词”，关闭“可被其他智能体调用”，点击“创建”。


        【第 3 步｜创建 UI】

        重复创建流程，名称填“UI”，粘贴 UI 提示词，关闭“可被其他智能体调用”，点击“创建”。


        【第 4 步｜创建剩余岗位】

        按同样方法依次创建“前端、后端、测试、运维”。一次只创建一个，创建后回到列表检查名称。


        【第 5 步｜验证切换】

        回到对话框，依次切换 @产品经理、@UI、@前端、@后端、@测试、@运维。不要发送任务，只确认六个岗位都能被手动选中。

        '
      checklist:
      - 已创建产品经理、UI、前端、后端、测试、运维六个智能体
      - 六个智能体均已关闭“可被其他智能体调用”
      - 已通过 @岗位名称逐个完成切换验证
      - 岗位名称与课程一致，没有随意使用相近名称
      suggested_questions:
      - 找不到“创建智能体”入口怎么办？
      - 为什么要关闭“可被其他智能体调用”？
      - 提示词应该复制文件的哪一部分？
      template_resource_id: day1-agent-pack
      template_label: 下载提示词包
      prompt_title: 请按照以下步骤，完成智能体团队的创建。
      hide_copy: true
