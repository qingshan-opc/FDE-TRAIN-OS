# Day 03 — 后端 API 与技术选型（Agent）
camp_version: v0.3
day: 3
title: 后端逻辑、API 与技术选型
project: 企业库存管理系统 · API

learn:
  lingzhi_tags: ["camp:v0.3", "day:3", "topic:api"]
  estimated_minutes: 40
  steps:
    - API 是前后端的「翻译官」：约定路径、方法与 JSON。
    - RESTful：GET 查、POST 增；状态码表达结果。
    - 选型：Python 适合 AI 落地联调；先能跑通再谈性能。
    - 今日目标：用 Agent 生成「入库」接口说明页与示例请求。

quiz:
  pass_rate: 0.67
  questions:
    - q: 创建资源通常用？
      options: ["GET", "POST", "OPTIONS"]
      answer: 1
    - q: JSON 最常用于？
      options: ["前后端数据交换", "替换数据库", "替代 HTTPS"]
      answer: 0
    - q: FDE 选型优先看？
      options: ["只追新语言", "场景与交付", "背完语法"]
      answer: 1

nodes:
  - type: learn
    title: API 与 JSON 基础
  - type: quiz
    title: HTTP 方法速测
  - type: lab
    title: Agent 生成入库 API 说明页
  - type: project
    title: 企业任务：库存入库接口契约
  - type: review
    title: 契约自检
  - type: unlock
    title: 解锁 Day4 前端联调

lab:
  runner: agent
  agent:
    prompt_template: >
      在工作区创建 api.html：说明库存「入库」API。
      需包含标题「入库 API」、路径 /api/inventory/inbound、方法 POST、
      以及示例 JSON 字段 sku、qty、warehouse。不要 Docker。
  rubric:
    - check: file_exists
      args: { path: api.html }
    - check: text_contains
      args: { path: api.html, needle: "inbound" }
    - check: text_contains
      args: { path: api.html, needle: "POST" }
