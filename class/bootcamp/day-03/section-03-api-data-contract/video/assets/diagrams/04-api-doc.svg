<text x="123" y="241" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="rgba(35,31,32,.55)">page → fetch</text>
</g>
<rect x="770" y="92" width="230" height="192" rx="18" fill="#fff" filter="url(#sh)" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.60s" dur="0.5s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.60s" dur="0.5s" fill="freeze"/><text x="794" y="128" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">BACKEND</text>
<text x="794" y="162" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="800" fill="#231f20">后端</text>
<text x="794" y="196" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="rgba(35,31,32,.6)">我按契约回数据</text>
<rect x="794" y="224" width="118" height="26" rx="13" fill="rgba(35,31,32,.06)"/>
<text x="853" y="241" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="rgba(35,31,32,.55)">route → json</text>
</g>
<path d="M276 188 L336 188" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.0s" repeatCount="indefinite"/></path>
<circle r="4" cx="276" cy="188" fill="#0d9488"><animate attributeName="cx" values="276;336" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="1.5s" repeatCount="indefinite"/></circle>
<path d="M704 188 L764 188" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.0s" repeatCount="indefinite"/></path>
<circle r="4" cx="764" cy="188" fill="#0d9488"><animate attributeName="cx" values="764;704" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="1.5s" repeatCount="indefinite"/></circle>
<rect x="329" y="77" width="382" height="222" rx="26" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.14;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="336" y="84" width="368" height="208" rx="20" fill="#fff" stroke="rgba(13,148,136,.45)" stroke-width="1.2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.30s" dur="0.5s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.30s" dur="0.5s" fill="freeze"/><rect x="440" y="102" width="160" height="28" rx="14" fill="url(#tealH)"/>
