<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-label="Harness 解剖：模型之外的骨架">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1040" height="480" fill="#ffffff"/>
  <rect width="1040" height="480" fill="url(#dots)"/>
  <circle cx="970" cy="60" r="100" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="440" r="70" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="14" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="31" font-size="15" font-weight="800" fill="#231f20">Harness 解剖：模型之外的骨架</text>
    <text x="1004" y="31" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">HARNESS ANATOMY</text>
  </g>

  <!-- connectors -->
  <g stroke="rgba(13,148,136,.4)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-dasharray="5 6">
    <line x1="340" y1="116" x2="430" y2="188"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="520" y1="142" x2="520" y2="184"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.3s" repeatCount="indefinite"/></line>
    <line x1="700" y1="116" x2="610" y2="188"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="340" y1="372" x2="430" y2="298"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="520" y1="336" x2="520" y2="302"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="700" y1="372" x2="610" y2="298"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- center model -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="408" y="178" width="224" height="130" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
      <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="188" width="200" height="110" rx="18" fill="url(#teal)" filter="url(#glow)"/>
    <text x="520" y="234" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">LLM</text>
    <text x="520" y="258" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.85)" font-family="'SF Mono',Menlo,monospace">只会「预测下一个词」</text>
  </g>

  <!-- six bones -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <g>
      <rect x="80" y="62" width="260" height="78" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="210" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">工具表 · TOOLS</text>
      <text x="210" y="118" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">能调什么 Skill，各怎么描述</text>
    </g>
    <g>
      <rect x="390" y="62" width="260" height="78" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="520" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">记忆 · MEMORY</text>
      <text x="520" y="118" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">前几轮发生了什么</text>
    </g>
    <g>
      <rect x="700" y="62" width="260" height="78" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="830" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">规划 · PLANNER</text>
      <text x="830" y="118" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">下一步做什么的决策</text>
    </g>
    <g>
      <rect x="80" y="336" width="260" height="78" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="210" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">循环 · LOOP</text>
      <text x="210" y="392" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">理解→规划→调工具→观察→继续</text>
    </g>
    <g>
      <rect x="390" y="336" width="260" height="78" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="520" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">重试 · RETRY</text>
      <text x="520" y="392" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">失败了怎么办：重来 / 降级 / 求助</text>
    </g>
    <g>
      <rect x="700" y="336" width="260" height="78" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="830" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">日志 · LOG</text>
      <text x="830" y="392" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">每步留痕：追责与复盘的地基</text>
    </g>

    <!-- footer -->
    <text x="520" y="446" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f766e">同一个模型，换一副骨架，能力天差地别 —— Harness 才是智能体的身体</text>
    <text x="520" y="470" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.55)">本课的 Agent 平台就是一副 harness；你在 第二周 给它添工具（Skill）</text>
  </g>
</svg>
