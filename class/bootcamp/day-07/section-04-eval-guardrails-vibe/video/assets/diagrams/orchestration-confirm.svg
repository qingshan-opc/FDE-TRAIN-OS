<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-label="多 Skill 编排：发送动作前必须过人工确认闸，每一步写入执行日志">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="480" fill="#ffffff"/>
  <rect width="1040" height="480" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="432" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">多 Skill 编排：确认点 + 日志 = 信任的工程设计</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">ORCHESTRATION</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="110" width="180" height="110" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="150" y="142" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">Skill A</text>
<text x="150" y="172" font-size="18" font-weight="700" fill="#231f20" text-anchor="middle">拉取数据</text>
<text x="150" y="200" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">只读 · 幂等 · 可自动跑</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="300" y="110" width="180" height="110" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="390" y="142" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">Skill B</text>
<text x="390" y="172" font-size="18" font-weight="700" fill="#231f20" text-anchor="middle">生成周报</text>
<text x="390" y="200" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">产出文档 · 可自动跑</text>
</g>
<path d="M246 165 L294 165" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M486 165 L566 165" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><polygon points="580,165 660,110 740,165 660,220" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></polygon><polygon points="592,165 660,120 728,165 660,210" fill="url(#tlg)" filter="url(#glow)"/><text x="660" y="158" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">人工确认</text><text x="660" y="182" font-size="11" fill="rgba(255,255,255,.9)" text-anchor="middle">看一眼再放行</text></g>
<path d="M744 165 L794 165" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="800" y="110" width="180" height="110" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="890" y="142" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">Skill C</text>
<text x="890" y="172" font-size="18" font-weight="700" fill="#231f20" text-anchor="middle">发送出去</text>
<text x="890" y="200" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">对外动作 · 不可逆</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="290" width="560" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="84" y="322" font-size="14" font-weight="800" fill="#231f20">执行日志（每步一条，可追溯）</text>
<text x="84" y="354" font-size="13" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">✓ A: 拉取 42 条记录 · 用时 3.2s</text>
<text x="84" y="382" font-size="13" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">✓ B: 生成 weekly-report-0524.md</text>
<text x="84" y="410" font-size="13" fill="rgba(35,31,32,.6)" font-family="'SF Mono',Menlo,monospace">⏸ C: 等待人工确认（草稿已备好）</text>
<rect x="84" y="422" width="240" height="6" rx="3" fill="url(#bar)"><animate attributeName="width" values="60;240" dur="3.5s" repeatCount="indefinite"/></rect>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="660" y="290" width="320" height="150" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="1.5" filter="url(#tglow)"/>
<text x="684" y="322" font-size="14" font-weight="800" fill="#0f766e">编排铁律</text>
<text x="684" y="352" font-size="13" fill="rgba(35,31,32,.7)">只读步骤自动连跑；</text>
<text x="684" y="378" font-size="13" fill="rgba(35,31,32,.7)">任何「对外 / 写入 / 花钱」步骤前，</text>
<text x="684" y="404" font-size="13" font-weight="700" fill="#231f20">必须插人工确认点并留日志。</text>
</g>
</svg>
