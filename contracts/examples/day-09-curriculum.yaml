  - id: c3
    title: 概念：Agent 与 Harness 解剖
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-09/section-03-agent-harness/lesson.md
    content: '同学们，快答开场：Harness 四要素是什么？模型、工具表、记忆、循环。惊喜来了——这四样你们全摸过：第五天调了模型、做了上下文装配；第七天写的 Skill 就是工具表上的一件工具；你们的迭代闭环就是人工版循环。你们已经在徒手拼
      Harness 了，对吧。

      模型管思考的大脑，就是第五天网关后的 LLM。工具表管能动手做什么，第七天的 Skill 马上挂上去。记忆管上下文里带什么，第五天上下文装配就是这个。循环管反复想-做-看，你们的验收不过改说明书重跑，就是人工版循环，嘛。

      Agent 是什么？骨架加上角色：你的说明书、人格、目标。你们写的 ai-tutor.yaml，其实就是一份 Agent 角色定义——你们早就在造 Agent 了，只是没人告诉名字。Skill 是给 Agent 预备的工具；Agent
      拿着工具表上的 Skill 去干活，对吧。

      Agent 的工作方式叫决策环：理解任务、规划步骤、选择并调用工具、观察结果、继续或收尾——一圈一圈转，直到交活。用昨天 Skill 运行当实例：理解生成本周周报、规划四步、调 Skill、看产出、验收通过就收尾。决策环会不会死循环？会，所以工程上要设最大轮数和超时，对吧。

      最后一个分水岭：workflow 还是 agent？步骤你定死，是 workflow——第九天咱们学编排就是这个；路径它现想，是 agent。能 workflow 的别 agent——企业场景里，可预测是第一美德。报销审批适合 workflow；帮我把这堆乱文件整理成
      PRD适合 agent，嘛。

      收个尾：Agent 决策，Harness 骨架，Skill 是工具。下一节把你的 Skill 挂上 Agent 的工具表——从今天起，你派活用自然语言，挑工具的活 Agent 自己干，对吧。'
    practice: 按本节 practice.md 完成任务并达到完成标志。
