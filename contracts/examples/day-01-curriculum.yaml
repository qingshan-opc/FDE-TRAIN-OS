    quiz:
    - - 下面哪个更适合作为 Day 1 项目？
      - - 做一个解决所有企业问题的平台
        - 为招聘负责人展示招聘漏斗和超期岗位
        - 开发一个全自动银行核心系统
      - 1
      - Day 1 项目应来自熟悉领域、用户明确、问题具体，并能用少量页面区块表现。
    - - 为什么建议先使用脱敏或演示数据？
