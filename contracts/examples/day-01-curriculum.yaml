camp_version: v0.7
day: 1
title: AI 时代的产品经理
week: 1
project: AI 时代的产品经理
project_brief: 角色周第一棒。今天看懂 AI 时代 PM 的价值位移（写贬值、定方向+做验收升值），学会 PRD 最小骨架（用户故事+可衡量验收标准+目标平台），解剖 PM Agent 提示词的四要素+两接口，然后亲手用它为「部门周报助手」跑出一份迷你
  PRD 并过闸。这份 PRD 明天原样交给架构师提示词，是后四天所有交付物的源头。
review_checklist:
- 日级快测 6 题 ≥ 4 题合格（考点覆盖五节关键概念，理解题无背诵题）
- 迷你 PRD 过闸三要素齐全：≥3 条完整句式的用户故事、每条故事配可衡量的验收标准、写明目标平台
- 工作区存在 `PRD.md` 且含「用户故事」「验收标准」两节（lab rubric 机器校验）
- PRD 不合格不进入 Day 2——明天的架构师提示词直接消费这份文档
