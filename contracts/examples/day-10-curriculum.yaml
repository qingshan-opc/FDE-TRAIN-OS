  - id: c2
    title: 人工确认与日志
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-10/section-02-human-confirm/lesson.md
    content: '同学们，确认闸最大的敌人不是 AI，是点确定大赛——弹得多了，人看都不看就批。所以闸不能装样子，得按工程设计来做。今天咱们把确认点怎么设计、日志怎么记，一次讲透，对吧。

      确认闸设计时必答三问。看什么？给决策所需的最低信息——草稿加关键数字加风险标红，不是一坨原始日志。谁来看？有责的那个人，训练营里就是你自己。多久看一次？这个咱们下一节讲信任分级。

      信任分级呢，新上线每次都看；连续十次通过，改成抽看三分之一；稳定期抽看加定期审计。这就是第七天攒的信任额度兑现的地方——不是偷懒，是风险管理。弹窗太多人会麻木，分级就是治这个，对吧。

      再说执行日志，每步一条：时间、动作、结果。出事故时它能回答三个问题——什么时候、谁干的、干成了什么。没有日志的团队，出事只能靠回忆和甩锅，咱们可不走那条路，对吧。

      反模式也记一下：信息不足逼人盲批、一天弹二十次麻木、批了没记录互相甩锅。避开这三条，你的闸才拦得住。同学们带走一句——确认点加日志，等于信任的工程设计，这个得记牢，对吧。'
    practice: '完成标志：

      [ ] 设计卡五格填完，「看什么」含具体信息项

      [ ] 找茬三题各说出「死法 + 修法」（对应三个反模式）'
    resource_ids:
    - dg-orchestration
    tools:
    - name: 确认闸设计卡
      note: 三问 + 信任分级 + 反模式三条
    quiz:
    - - 确认闸三问是？
      - - 谁开发/多少钱/快不快
        - 看什么 / 谁来看 / 多久看一次
        - 早上/中午/晚上
      - 1
      - 看什么 = 决策所需的最低信息，不是日志原文。
    - - 确认界面必须提供？
      - - 一句「发送吗？」
        - 草稿 + 关键数字 + 风险标红
        - 全部原始日志
      - 1
      - 信息不足逼人盲批——闸的第一种死法。
    - - 执行日志三要素？
      - - 时间 / 动作 / 结果
        - 谁 / 什么 / 为什么
        - 开始 / 结束 / 耗时
      - 0
      - 案底三问：什么时候、谁干的、干成了什么。
    - - 信任分级的含义？
      - - 永远每次都看
        - 连续通过攒额度：从每次看降到抽看 + 定期审计
        - 完全放手
      - 1
      - 一天弹 20 次确认，第 21 次一定盲批——分级治麻木。
