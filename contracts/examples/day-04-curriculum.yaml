camp_version: v0.7
day: 4
title: AI 时代的后端（数据库 + 后端）
week: 1
project: AI 时代的后端
project_brief: 前三天你交出了 PRD.md、architecture.md、index.html——今天给「部门周报助手」装心脏。看懂后端三件事（规则/存取/对话），用后端角色提示词产出 API_Spec.md 与 DB_Schema.md：3–5
  个 REST 接口 + 2–3 张带主键和索引的表，接口与表必须一一对得上。
review_checklist:
- 日级快测 6 题 ≥ 4 题正确
- '`API_Spec.md` 含 3–5 个接口，每个接口四要素齐全：路径 + 方法 + 成功响应 + 至少一个错误响应（400/404/500 任选并写明含义）'
- '`DB_Schema.md` 含 2–3 张表，每张表有主键，全库至少一个索引建议并说明理由'
- 接口与表能对上：每个接口读写的数据，都能在某张表里找到出处——对不上即打回
