title: "第十天 · 第 5 节 · 两周复盘：行业地图自评 + 自学路线"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · 最后十五分钟"
      - "讲解图：ten-day-grid.svg"
      - "不看代码 · 折叠成地图"
      - "十天 → 一张认知清单"
    text: |
      同学们好，我是你们的老师404。同学们啊，最后十五分钟，咱们不看代码。把十天折叠成一张地图——不是复习知识点，是回答：十天前我以为什么，现在我知道什么。有同学可能会说：代码还没修完呢，复盘啥？听见了吗——修 bug 天天有；复盘是帮你看清自己站在哪。填进 final-review.md，后面九十天才不会瞎学。来，看屏幕，咱们从「我以为 → 我知道」讲起。想三秒：这十天你改变最大的一条认知是什么？对吧。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。

  - id: "02-cognitive-fold"
    ppt:
      - "眉题：02 FOLD · 认知折叠三对"
      - "讲解图：evolution-timeline.svg"
      - "这行是什么 · AI 会/不会什么"
      - "遇到问题：定位→假设→验证→记录"
    text: |
      认知折叠，写三对清单。第一对：十天前我以为这行是什么，现在我知道它是什么。第二对：十天前我以为 AI 会怎样，现在我知道它会什么、不会什么。第三对：十天前遇到问题我怎么办，现在我是定位、假设、验证、记录。有同学可能会写空话——别。要具体：比如「我以为接个 API 就行，现在我知道还要闸、日志、降级」。现在就动笔，每对至少一句真话。这三对写完，你就有一份「认知 diff」。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，嘛。

  - id: "03-industry-map"
    ppt:
      - "眉题：03 MAP · 行业地图自评"
      - "讲解图：v2-panorama.svg"
      - "前端 · 接口 · 数据库 · 模型层"
      - "各打 ✓ △ ✗"
    text: |
      然后在行业地图上标位置。前端、接口、数据库、模型层——各打勾、三角或叉，对应十条证据的自评。有同学可能会说：我前端弱后端强，怎么标？诚实标：强的打勾，占位的打叉，做了一半打三角。大多数人学完一堆课还是不知道自己在哪；你知道长板短板，这就值。看屏幕四层图，拿彩笔或 markdown 标一下。地图不是判决，是导航；知道叉在哪，才知道补哪。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。好，咱们继续往下走。希望同学们好好听、好好掌握。，呢。

  - id: "04-orchestration-star"
    ppt:
      - "眉题：04 ORCH · 编排与安全单独一档"
      - "讲解图：v2-panorama.svg"
      - "闸 · 日志 · Skill"
      - "多数人的空白 · 你已有"
    text: |
      编排与安全单独一档——闸、日志、Skill，别并到「会用 AI」里糊弄。这是大多数人的空白，而你们已经有：orchestration.md、runs/ 可回放、skills/ 三件。有同学可能会低估：这不就是配几个文件吗？不是——这是 FDE 和「只会聊天」的分水岭。标完四层再看这一档：若这里能打勾，你的交付可信度会高一大截。长板若在编排，答辩和求职都往这打；别谦虚到说「随便写写」。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，对吧。

  - id: "05-ten-days-enough"
    ppt:
      - "眉题：05 ENOUGH · 十天够什么"
      - "讲解图：ten-day-grid.svg"
      - "入门 + 方法论 + 一套真作品"
      - "精通 = 接下来九十天"
    text: |
      十天够吗？够「入门加方法论加一套真作品」；不够「精通」——精通是接下来九十天的事。有同学可能会焦虑：我是不是还太菜？正常。别急着一口气吃成胖子，也别因为没全会就否定十天——你已经有驾驶舱、有证据链、有真闸。接下来要把地图上的叉，按优先级一个个变三角、变勾。先用一周把驾驶舱接到真数据上，再决定第二阶段学什么。十天搭骨架，九十天长肌肉。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。好，咱们继续往下走。，好吗？嘛。

  - id: "06-roadmap"
    ppt:
      - "眉题：06 ROADMAP · 定位四步法"
      - "讲解图：evolution-timeline.svg"
      - "定位 → 假设 → 验证 → 记录"
      - "比单点技巧管用"
    text: |
      遇到问题现在怎么干？定位、假设、验证、记录——这套方法比任何单点技巧都管用。有同学可能会问：以后没有 404 老师呢？AI 导师配置在每节目录里，方法也在；你已经不需要被领着走了。卡壳时先写：现象是什么、我假设原因是什么、怎么最小验证、结论记在哪。这是 FDE 出厂的第二套设置——第一套是证据，第二套是方法。技巧会过时，方法不会。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。好，咱们继续往下走。希望同学们好好听、好好掌握。，对吧。

  - id: "07-ninety-day"
    ppt:
      - "眉题：07 NINETY DAY · 90 天路线"
      - "讲解图：ten-day-grid.svg"
      - "在职提效 · 求职转行"
      - "深入工程 · 独立产品"
    text: |
      最后选下一站——按下一站选，别按 hottest 选。四条路在屏幕上：在职提效，先接真实数据、闸的信任分级；求职转行，把十条证据翻译成简历语言；深入工程，WebSocket、eval、多 Agent；独立产品，用户、部署、计费最小闭环。有同学可能会追热点：别。用过真数据，你才知道该学哪条。路线表在公开课 O5，各走各的路；下一站跟人生目标对齐，不是跟热搜对齐。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。好，咱们继续往下走。，呢。

  - id: "08-choose-station"
    ppt:
      - "眉题：08 STATION · 写进 final-review"
      - "讲解图：v2-panorama.svg"
      - "长板在哪层 · 短板在哪层"
      - "90 天第一站一句话"
    text: |
      现在把选择写进 final-review.md：长板在哪层、短板在哪层、九十天第一站一句话。有同学可能会写「都想学」——那就是没选。选一条主路，其他当选修。比如「下一站在职提效，第一周接部门真实 CSV，第二周补数据迁移」。具体、可执行、可复盘。对照屏幕路线表，圈一条，写一句——下课前完成，别拖成「以后再说」。路线图是下周能执行的 ticket，不是愿望清单。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。，好吗？对吧。

  - id: "09-close"
    ppt:
      - "眉题：09 TAKEAWAY · 课止路始"
      - "讲解图：v2-panorama.svg"
      - "你是 FDE · 去部署的地方见"
      - "地图在手 · 下一站自己选"
    text: |
      同学们，本节先到这里。课到这里就结束了，路才刚开始。你是 FDE 了——不是称号空领，是十条证据、真闸、八分钟答辩换来的。去部署的地方见：真实数据、真实用户、真实事故。带走一句：地图在手，下一站自己选；定位、假设、验证、记录，遇到问题先套方法再调模型。训练营到这儿，你的工程人生才刚开门。以后找方法、找证据、找 final-review。听见了吗？这一步听懂了，后面答辩才站得住。来，对照屏幕，把这一点和全景图上的位置对上。咱们 FDE 不怕慢，怕假；真通一件，胜过假亮三件。好，咱们继续往下走。希望同学们好好听、好好掌握。，嘛。

