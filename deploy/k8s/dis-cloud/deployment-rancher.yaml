apiVersion: v1
kind: Service
metadata:
  name: dis-cloud
  namespace: dis-cloud
spec:
  type: ClusterIP
  selector:
    workload.user.cattle.io/workloadselector: deployment-dis-cloud-dis-cloud
  ports:
    - name: port
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dis-cloud
  namespace: dis-cloud
  labels:
    workload.user.cattle.io/workloadselector: deployment-dis-cloud-dis-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-dis-cloud-dis-cloud
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: deployment-dis-cloud-dis-cloud
    spec:
      containers:
        - name: dis-cloud
          image: registry.cn-zhangjiakou.aliyuncs.com/818cloud/fde:dis-cloud-latest
          imagePullPolicy: Always
          ports:
            - name: port
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dis-cloud-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: DATABASE_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: S3_SECRET_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: WECHAT_PAY_MCH_ID
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_PAY_MCH_ID
                  optional: true
            - name: WECHAT_PAY_APP_ID
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_PAY_APP_ID
                  optional: true
            - name: WECHAT_PAY_SERIAL_NO
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_PAY_SERIAL_NO
                  optional: true
            - name: WECHAT_PAY_API_V3_KEY
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_PAY_API_V3_KEY
                  optional: true
            - name: WECHAT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_APP_SECRET
                  optional: true
            - name: WECHAT_MP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_MP_TOKEN
                  optional: true
            - name: WECHAT_MP_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: dis-cloud-secrets
                  key: WECHAT_MP_AES_KEY
                  optional: true
            - name: WECHAT_PAY_PRIVATE_KEY_PATH
              value: /secrets/wechat/apiclient_key.pem
            - name: WECHAT_PAY_PLATFORM_CERT_PATH
              value: /secrets/wechat/wechatpay_platform.pem
          volumeMounts:
            - name: data
              mountPath: /data
            - name: wechat-certs
              mountPath: /secrets/wechat
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: wechat-certs
          secret:
            secretName: dis-cloud-secrets
            items:
              - key: WECHAT_PAY_PRIVATE_KEY
                path: apiclient_key.pem
              - key: WECHAT_PAY_PLATFORM_CERT
                path: wechatpay_platform.pem
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fde
  namespace: dis-cloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: fde.818cloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dis-cloud
                port:
                  number: 8080
