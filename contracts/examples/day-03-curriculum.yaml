  - id: c6
    title: 后端过闸并交给测试
    minutes: 20
    form: 交接实操
    content_ref: class/bootcamp/day-03/section-06-accept-test-handoff/lesson.md
    content: （见本节 lesson.md）
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - integration-card
    - agent-backend
    tools:
    - name: 后端过闸清单
      note: 合同、运行、业务、数据、错误、安全、联调
    - name: TRAE · @测试
      note: 只接收和复述，Day4 正式测试
    quiz:
    - - 只有健康检查通过，能否交给测试？
      - - 能
        - 不能，还要验证业务、持久化、错误、安全和联调
        - 能，只要文件齐全
      - 1
      - health 只是服务可达证据，不是完整业务通过。
    - - 为什么测试岗位必须先读 RUNBOOK？
      - - 为了学习写后端
        - 为了能独立复现启动和检查环境
        - 为了修改接口
      - 1
      - 可复现的运行方法是测试接收的基础。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '本节先完成后端过闸，再切换测试接收。


        【第 1 段｜后端最终自检】

        切换 @后端，只检查不修改：API 与数据合同对账、health、查询、提交、两个错误、重启持久化、无密钥、前后端联调。逐项给出通过/不通过和证据文件。


        【第 2 段｜修复并回归】

        不通过项由责任岗位修复。修复后重新执行查询、提交、空数据和错误路径，更新 backend-acceptance.md。


        【第 3 段｜整理测试交接】

        请生成 backend-handoff.md，列出 PRD.md、API_Spec.md、DB_Schema.md、RUNBOOK.md、backend-acceptance.md、frontend 目录和后端目录；写明启动命令、地址、已知限制和测试环境数据。


        【第 4 段｜切换 @测试 接收】

        切换到 @测试，发送：请读取 PRD.md、API_Spec.md、DB_Schema.md、RUNBOOK.md、backend-acceptance.md 和 backend-handoff.md，只复述测试目标、启动方法、核心接口、风险和缺失项。今天不要开始执行测试。


        【第 5 段｜记录交接链】

        创建 day3-handoff-log.md，记录后端 → 前端 → 后端/前端修复 → 测试接收的输入、输出、验收和轮次。

        '
      checklist:
      - 后端过闸项目均有证据
      - backend-handoff.md 包含完整文件、命令、地址和限制
      - '@测试 已完成接收复述但未提前测试'
      - day3-handoff-log.md 能还原完整联调和交接
      suggested_questions:
      - 哪些证据才算后端通过？
      - 测试接收时发现文件缺失怎么办？
      - 为什么今天不让测试立刻执行？
      template_resource_id: integration-card
