# Single-host production stack (x86 Docker). Build on the target host:
#   docker compose -f deploy/docker/docker-compose.prod.yml build
#   docker compose -f deploy/docker/docker-compose.prod.yml up -d
#
# Entry: http://<host>/app/  (nginx gateway on host :80 → api + web)
# Demo login: learner@fde.local / learner1234

name: fde-platform

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fde}
      POSTGRES_DB: fde
    volumes:
      - fde_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fde"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fdeadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fdeadmin123}
    volumes:
      - fde_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: fde-api:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &fde_env
      FDE_ENV: prod
      FDE_ALLOW_RUNTIME_MIGRATE: "1"
      FDE_SEED_DEMO_USERS: "1"
      JWT_SECRET: ${JWT_SECRET:-fde-prod-jwt-change-me}
      DATABASE_URL: postgresql://fde:${POSTGRES_PASSWORD:-fde}@postgres:5432/fde
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fdeadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fdeadmin123}
      S3_BUCKET_DOCUMENTS: fde-documents
      S3_BUCKET_WORKSPACES: fde-workspaces
      S3_BUCKET_ARTIFACTS: fde-artifacts
      S3_BUCKET_BACKUPS: fde-backups
      S3_FORCE_PATH_STYLE: "1"
      FDE_DEFAULT_CAMP_ID: camp-v03
      FDE_CURRICULUM_VERSION_TAG: v0.7
      FDE_SEED_VERSION_TAGS: v0.7,fde-v07
      AGENT_MODE: stub
      FDE_INTERNAL_BASE: http://api:8760
      FDE_CORS_ORIGINS: ${FDE_CORS_ORIGINS:-http://192.168.0.138,http://127.0.0.1}
      FDE_COOKIE_SECURE: ${FDE_COOKIE_SECURE:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      LINGZHI_BASE_URL: http://127.0.0.1:8230
    command: ["python", "-m", "services.migrations_runner"]
    volumes:
      - fde_data:/data

  bootstrap:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: fde-api:local
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      <<: *fde_env
    command:
      [
        "python",
        "-c",
        "from services.shared import init_schema; init_schema(); print('bootstrap ok')",
      ]
    volumes:
      - fde_data:/data

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: fde-api:local
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *fde_env
      FDE_ALLOW_RUNTIME_MIGRATE: "0"
    volumes:
      - fde_data:/data
    expose:
      - "8760"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8760/livez"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: fde-api:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *fde_env
      FDE_ALLOW_RUNTIME_MIGRATE: "0"
    command: ["python", "-m", "services.worker"]
    volumes:
      - fde_data:/data

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    image: fde-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"

  gateway:
    image: docker.m.daocloud.io/nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${FDE_GATEWAY_PORT:-80}:8080"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  fde_pg:
  fde_minio:
  fde_data:
