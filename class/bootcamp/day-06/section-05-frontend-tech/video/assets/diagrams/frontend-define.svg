<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="前端是用户直接接触的界面层">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">前端 = 用户直接接触的界面层 · 不只是网页</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">WHAT IS FRONTEND</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="106" width="170" height="88" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="145" y="142" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">用户</text>
<text x="145" y="168" font-size="11" fill="rgba(35,31,32,.55)" text-anchor="middle">用眼与手</text>
</g>
<path d="M238 150 L296 150" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="306" y="76" width="460" height="148" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="536" y="106" font-size="15" font-weight="800" fill="#0f766e" text-anchor="middle">摸得到的那一层 = 前端</text>
<rect x="330" y="136" width="78" height="34" rx="17.0" fill="rgba(35,31,32,.05)"/><text x="369.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle">OS 界面</text>
<rect x="416" y="136" width="78" height="34" rx="17.0" fill="rgba(35,31,32,.05)"/><text x="455.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle">Web 网页</text>
<rect x="502" y="136" width="78" height="34" rx="17.0" fill="rgba(35,31,32,.05)"/><text x="541.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle">App</text>
<rect x="588" y="136" width="78" height="34" rx="17.0" fill="rgba(35,31,32,.05)"/><text x="627.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle">小程序</text>
<rect x="674" y="136" width="78" height="34" rx="17.0" fill="rgba(35,31,32,.05)"/><text x="713.0" y="157.32" font-size="12" fill="#231f20" text-anchor="middle">桌面软件</text>
<text x="536" y="204" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">凡是摸得到的，都算</text>
</g>
<path d="M774 150 L830 150" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="840" y="106" width="150" height="88" rx="16" fill="rgba(35,31,32,.04)"/>
<text x="915" y="142" font-size="16" font-weight="800" fill="rgba(35,31,32,.5)" text-anchor="middle">后端</text>
<text x="915" y="168" font-size="11" fill="rgba(35,31,32,.45)" text-anchor="middle">业务与数据</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="252" width="600" height="34" rx="17.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="273.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">窗口、按钮、扫码、双击图标 —— 摸得到的那一层，都是前端</text></g>
</svg>
