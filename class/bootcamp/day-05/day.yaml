    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '需求已经确认。现在切换到 @UI。每段完成后必须停止。


        【第 1 段｜读取并复述】

        请读取 day5-replay/iteration-prd.md 和 pm-handoff.md。只复述目标用户、核心动作、范围、业务规则和验收标准。发现矛盾时停止并要求回到 @产品经理。


        【第 2 段｜列出页面与状态】

        请只列本次需要修改的页面区域。逐项写输入、显示字段、用户动作、反馈、加载、空数据、成功和错误状态。不要生成代码。


        【第 3 段｜生成交互说明】

        请生成 day5-replay/iteration-ui-spec.md。用文字线框说明布局、操作顺序、状态变化和异常提示。每条设计必须对应产品验收标准。


        【第 4 段｜生成 UI 交接】

        请生成 day5-replay/ui-handoff.md。写清前端必须实现的元素、交互、状态、文案和证据要求。保存后停止，等我回复“确认原型”。

        '
      checklist:
      - UI 已读取产品交付物
      - 页面改动没有超出范围
      - 四种页面状态齐全
      - 交互与验收标准逐条对应
      - ui-handoff.md 可直接交给前端
      - 学员回复“确认原型”
