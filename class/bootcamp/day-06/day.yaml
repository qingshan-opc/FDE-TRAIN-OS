capsule_extra:
  c1:
    resource_ids:
    - dg-llm-ecosystem
    - dg-four-layer
    - glossary
    media:
    - kind: video
      title: 口播课件 · 生态四层地图
      object_key: documents/shared/course-media/day06-c1-ecosystem.mp4
      poster_key: documents/shared/course-media/day06-c1-ecosystem-poster.jpg
      duration_sec: 195
    knowledge_cards:
    - id: llm-core
      term: LLM · 大语言模型
      plain: 用海量文本训练的「预测下一个词」机器；生成、理解、推理都从这机制长出。
      tag: 核心
    - id: four-layers
      term: 生态四层
      plain: 基建→模型→编排→应用；FDE 主要在编排层和应用层动手。
      tag: 框架
    - id: open-closed
      term: 开源权重 vs 闭源 API
      plain: 闭源调 endpoint 按 Token 付费；开源下载权重自部署——能力、成本、隐私三角权衡。
      tag: 选型
    - id: multimodal-bound
      term: 多模态边界
      plain: 不只文本还能看图听音；本课驾驶舱只用文本能力。
      tag: 边界
    glossary_terms:
    - id: gt-llm
      term: LLM
      plain: 大语言模型：预测下一个 Token，不是核实过的事实库。
    - id: gt-open-closed
      term: 开源 vs 闭源
      plain: API 省心按量付；开源权重自部署换隐私与成本。
    - id: gt-multimodal
      term: 多模态
      plain: 跨文本/图像/音频；本课聚焦文本摘要与 Tool Call。
    quiz:
    - - LLM 的核心机制是什么？
      - - 检索互联网最新信息
        - 预测下一个 Token
        - 存储企业数据库
      - 1
      - 生成、理解、推理都从「接龙」机制长出——不是搜索引擎也不是数据库。
    - - 闭源 API（如 OpenAI）和开源权重（如 Qwen）的主要权衡是？
      - - 闭源一定更聪明
        - 能力、成本、隐私的三角权衡
        - 开源不能 Tool Call
      - 1
      - 闭源快省心；开源可自部署换隐私——没有唯一正确答案，看场景。
    - - 本课驾驶舱为什么刻意只用文本能力？
      - - 多模态违法
        - 聚焦摘要/问答/Tool Call，别用文本模型硬做不擅长的事
        - 多模态太贵不能用
      - 1
      - 知道多模态存在，但训练聚焦文本链路——边界意识是 FDE 基本功。
  c2:
    resource_ids:
    - dg-llm-capability
    - glossary
    media:
    - kind: video
      title: 口播课件 · Token / 窗口 / 幻觉
      object_key: documents/shared/course-media/day06-c2-token.mp4
      poster_key: documents/shared/course-media/day06-c2-token-poster.jpg
      duration_sec: 171
    knowledge_cards:
    - id: token-meter
      term: Token 计量
      plain: 模型读写最小单位；中文约 0.6–1 字/Token；API 按 input+output 计费。
      tag: 核心
    - id: context-window
      term: 上下文窗口
      plain: 一次调用能看到的 Token 上限；满了可截断、摘要或 RAG。
      tag: 核心
    - id: hallucination
      term: 幻觉 Hallucination
      plain: 给「最像真的」而非「核实过的」答案——机制如此，不是偶发 bug。
      tag: 核心
    glossary_terms:
    - id: gt-token
      term: Token / 窗口
      plain: Token 是计费单位；窗口是一次能看多少——对话越长越贵越慢。
    - id: gt-hallucination
      term: 幻觉
      plain: 流畅 plausible 优先于 fact-check；关键事实必须可溯源+验收。
    quiz:
    - - Token 和「一个汉字」的关系是？
      - - 完全相等
        - 中文约 0.6–1 字/Token，不是一字一 Token
        - Token 只用于英文
      - 1
      - API 账单按 Token 计——压缩 Prompt 是真省钱。
    - - 上下文窗口满了，常见策略不包括？
      - - 截断最早消息
        - 无限扩大窗口忽略成本
        - RAG 只检索相关片段
      - 1
      - 窗口是硬顶+成本顶——不能假装无限。
    - - 为什么说幻觉是「机制」不是 bug？
      - - 模型坏了要返厂
        - 训练目标是 plausible 接龙，不是 fact-check
        - 只有旧模型才幻觉
      - 1
      - 对策是 RAG+Eval+Guardrails，不是「再 prompt 一次就会好」。
  c3:
    resource_ids:
    - dg-context-assembly
    - glossary
    media:
    - kind: video
      title: 口播课件 · Prompt / Context / RAG
      object_key: documents/shared/course-media/day06-c3-rag.mp4
      poster_key: documents/shared/course-media/day06-c3-rag-poster.jpg
      duration_sec: 181
    knowledge_cards:
    - id: prompt-eng
      term: Prompt 工程
      plain: 任务说明书：角色+背景+任务+约束+输出格式，可迭代可验收。
      tag: 核心
    - id: context-eng
      term: Context Engineering
      plain: 决定这次调用放什么进窗口——给少瞎编，给多迷失。
      tag: 核心
    - id: rag-pipeline
      term: RAG 管线
      plain: 切块→嵌入→检索→拼 Prompt→生成；治幻觉主流方案之一。
      tag: 核心
    - id: finetune-prompt
      term: Fine-tune vs Prompt
      plain: 改权重贵慢；改 Prompt 快便宜——90% 场景先用后者。
      tag: 选型
    glossary_terms:
    - id: gt-prompt
      term: Prompt 工程
      plain: 四要素+约束+格式；工程师看完不用回来问第二遍。
    - id: gt-context
      term: Context Engineering
      plain: 装填窗口的手艺——PRD 片段 vs 整库，取舍决定质量。
    - id: gt-rag
      term: RAG
      plain: 先检索相关片段再生成；驾驶舱摘要是简化版 RAG 思想。
    quiz:
    - - Prompt 工程「四要素」不包括？
      - - 角色定位
        - GPU 型号
        - 输出格式
      - 1
      - 四要素：角色、背景、任务、格式——再加约束。
    - - Context Engineering 主要解决什么问题？
      - - 让模型更快
        - 决定这次调用放什么进窗口，避免给少瞎编/给多迷失
        - 替代 Fine-tuning
      - 1
      - 窗口有限——装填是手艺，不是玄学。
    - - RAG 的正确顺序是？
      - - 生成→检索→嵌入
        - 切块→嵌入→检索→拼 Prompt→生成
        - 检索→Fine-tune→生成
      - 1
      - 先捞相关片段再让模型基于片段回答。
    - - 90% 场景应该优先？
      - - Fine-tuning
        - Prompting（+RAG+Eval）
        - 换更大的模型
      - 1
      - Fine-tune 贵慢——Prompt 方案没过闸不升级。
  c4:
    resource_ids:
    - dg-llm-ecosystem
    - glossary
    media:
    - kind: video
      title: 口播课件 · Eval / Guardrails / Vibe Coding
      object_key: documents/shared/course-media/day06-c4-eval.mp4
      poster_key: documents/shared/course-media/day06-c4-eval-poster.jpg
      duration_sec: 167
    knowledge_cards:
    - id: eval-core
      term: Eval · 评测
      plain: 固定题库+明确判分+可重复跑——代替「我觉得还行」。
      tag: 核心
    - id: guardrails
      term: Guardrails · 护栏
      plain: 输入过滤、输出约束、越界降级——空结果别瞎编。
      tag: 核心
    - id: vibe-coded
      term: Vibe Coding
      plain: 自然语言让 AI 写代码；爽点是真的，验收责任也是真的。
      tag: 全程
    glossary_terms:
    - id: gt-eval
      term: Eval
      plain: 给 AI 出考卷；模型/Prompt 改版后重跑，分掉别发版。
    - id: gt-guardrails
      term: Guardrails
      plain: 敏感词、空结果、超时——三条降级路径企业必备。
    - id: gt-vibe
      term: Vibe Coding
      plain: diff 可以 vibe，合并进 main 必须 Eval+人工看关键路径。
    quiz:
    - - Eval 和「我觉得还行」的本质区别？
      - - Eval 更贵
        - Eval 可重复、有固定判分，第三方能客观判过/不过
        - 没有区别
      - 1
      - Rubric 和快测都是 Eval 的朴素版。
    - - 检索为空时 Guardrails 应该？
      - - 让模型编造合理答案
        - 拒答/模板降级/转人工，禁止 hallucinate
        - 自动 Fine-tune
      - 1
      - 空结果瞎编是线上事故高发区。
    - - 「带验收的 Vibe Coding」指？
      - - 不许用 AI 写代码
        - 可以用 AI 写 diff，但合并前必须 Eval 和验收关键路径
        - 只要 vibe 快就行
      - 1
      - 会 vibe 的人变贵，只会 vibe 不验收的人变便宜。
  c5:
    resource_ids:
    - dg-agent-loop
    - dg-harness
    - dg-workflow-agent
    - glossary
    media:
    - kind: video
      title: 口播课件 · Agent / Harness / MCP
      object_key: documents/shared/course-media/day06-c5-agent.mp4
      poster_key: documents/shared/course-media/day06-c5-agent-poster.jpg
      duration_sec: 207
    knowledge_cards:
    - id: agent-loop
      term: Agent · 智能体
      plain: 理解→规划→Tool Call→观察→继续；你定目的地和验收。
      tag: 核心
    - id: harness
      term: Harness · 骨架
      plain: 模型外循环：工具表、记忆、重试、日志——同模型不同骨架能力天差地别。
      tag: 核心
    - id: tool-call
      term: Tool Calling
      plain: 模型输出结构化工具请求，Harness 执行后结果喂回上下文。
      tag: 核心
    - id: mcp
      term: MCP
      plain: AI 接工具/数据源的 USB-C 标准；Skill 是它的朴素版。
      tag: 地基
    - id: workflow-agent
      term: Workflow vs Agent
      plain: 写死流程 vs 现场决策——能写死就写死，写不死才 Agent。
      tag: 原则
    - id: copilot-agent
      term: Copilot vs Agent
      plain: 副驾递扳手 vs 自主开车——信任与验收要求完全不同。
      tag: 对比
    glossary_terms:
    - id: gt-agent
      term: Agent
      plain: 多步自主决策+调工具；Week 2 封装 Skill 的前置概念。
    - id: gt-harness
      term: Harness
      plain: Cursor vs 简陋脚本——同一 GPT-4 不同骨架。
    - id: gt-mcp
      term: MCP
      plain: Model Context Protocol；写一个 Server 多客户端能插。
    - id: gt-workflow
      term: Workflow vs Agent
      plain: 报销审批适合 Workflow；整理乱文件成 PRD 适合 Agent。
    - id: gt-copilot
      term: Copilot vs Agent
      plain: Copilot 错一行改一行；Agent 错可能改坏十文件。
    quiz:
    - - Agent 循环的正确顺序？
      - - Tool Call→理解→规划
        - 理解→规划→Tool Call→观察→继续
        - 生成→生成→生成
      - 1
      - Harness 负责执行 Tool 并喂回结果。
    - - 同一 GPT-4，Cursor Agent 和简陋脚本能力差异主要来自？
      - - 模型版本不同
        - Harness（工具表、记忆、重试、日志）不同
        - 网络速度
      - 1
      - 骨架不同，能力天差地别——Week 2 练的就是 Harness/Skill。
    - - MCP 最贴切的比喻是？
      - - 新的编程语言
        - AI 接工具/数据源的 USB-C 标准
        - 只能 OpenAI 用的私有协议
      - 1
      - 按标准写 Server，Cursor/Claude Desktop 都能用。
    - - 「能写死就写死，写不死才 Agent」说明？
      - - Agent 永远优于 Workflow
        - Workflow 稳定可审计；Agent 灵活但需 Eval——按任务选
        - 不应该用 Agent
      - 1
      - 报销审批写 Workflow；开放式整理任务才 Agent。
    - - Copilot 和 Agent 的核心区别？
      - - Copilot 更贵
        - Copilot 是你开车它递扳手；Agent 是你定目的地它开
        - 没有区别
      - 1
      - Agent 多步跨文件，错了破坏力大——日志和 Eval 更关键。
    - - Tool Calling 时谁真正执行工具？
      - - 模型自己连数据库
        - Harness 收到结构化请求后执行，再把结果塞回上下文
        - 用户手动执行
      - 1
      - 模型只「说我要调什么」；执行在 Harness。
  c6:
    resource_ids:
    - glossary
    - glossary-md
    - dg-four-layer
    media:
    - kind: video
      title: 口播课件 · 18 词验收
      object_key: documents/shared/course-media/day06-c6-accept.mp4
      poster_key: documents/shared/course-media/day06-c6-accept-poster.jpg
      duration_sec: 116
    knowledge_cards:
    - id: gate-llm
      term: GATE · LLM 认知过线
      plain: 18 词抽测 ≥12/18 + LLM 认知卡六大主题有实例。
      tag: 验收
    - id: cognition-card
      term: LLM 认知卡
      plain: 六大主题×要点×前五天真实例——不许抄课件。
      tag: 交付
    glossary_terms:
    - id: gt-glossary-18
      term: 18 词词典
      plain: 行业日常词汇随身工具——听到发懵回来查这一页。
    quiz:
    - - 今日 GATE 过线标准是？
      - - 部署上云
        - 18 词抽测 ≥12/18 + LLM 认知卡提交
        - 写完 3000 行代码
      - 1
      - 纯理论日——验收认知，不是代码量。
    - - LLM 认知卡每条要点必须配？
      - - 一段抄课件的定义
        - 前五天真实交付物或自己的类比
        - 任意网络文章链接
      - 1
      - 要「你的」实例，不是「高级的」实例。
    - - 18 词里「Hallucination」的核心对策组合是？
      - - 更大模型
        - RAG + Eval + Guardrails（可溯源+验收+降级）
        - 不用 AI
      - 1
      - 幻觉是机制——用工程手段管理，不是 magic prompt。
tools:
- name: 18 词速查卡
  note: class/schedule/index.html 词典节 + glossary.html
- name: LLM 认知卡模板
  note: 六大主题×2–3 要点×实例，提交 llm-cognition-card.md
quiz:
- - LLM 生态四层从底到顶的正确顺序是？
  - - 应用→编排→模型→基建
    - 基建→模型→编排→应用
    - 模型→应用→编排→基建
  - 1
  - 驾驶舱在应用层；换模型是换编排/模型层的牌子。
- - Token 与上下文窗口的关系？
  - - Token 是计费单位，与窗口无关
    - Token 是读写基本单位；窗口是一次能塞进去的上限
    - 窗口越大幻觉越少
  - 1
  - 给少了瞎编，给多了迷失——Context Engineering 管装填。
- - 幻觉（Hallucination）的本质是？
  - - 模型 bug，升级就消失
    - 机制：永远给「最像真的」而非「经过核实的」
    - 只有小模型才会幻觉
  - 1
  - 用 RAG、Eval、Guardrails 管理，不是 magic prompt。
- - RAG 主要解决什么问题？
  - - 让模型更快
    - 先从资料库检索片段，再基于片段回答——治幻觉药方之一
    - 替代 Fine-tune
  - 1
  - 可溯源比「听起来对」重要。
- - Fine-tune 与 Prompt 的分工？
  - - 完全相同
    - Prompt 改这次输入；Fine-tune 改模型权重——贵、慢，多数业务 Prompt+RAG 够用
    - Fine-tune 只能用于聊天
  - 1
  - 先 Prompt/Context，真搞不定再考虑 Fine-tune。
- - Eval 替代的是什么？
  - - 单元测试
    - 「我觉得还行」——用固定题库+判分标准验收 AI 产物
    - 代码审查
  - 1
  - Rubric 思维在 LLM 日落地。
- - Agent 和 Workflow 怎么选？
  - - 永远用 Agent
    - 能写死流程就 Workflow；写不死才 Agent
    - 永远用 Workflow
  - 1
  - Agent 信任成本高——需要 Harness 和日志。
- - MCP 是什么？
  - - 一种新的编程语言
    - 给 AI 接工具/数据源的 USB-C 标准——Skill 是它的朴素版
    - 只有 OpenAI 支持
  - 1
  - 标准接口让工具可复用。
- - Copilot vs Agent？
  - - Copilot 能自动跑完业务流程
    - Copilot 递扳手；Agent 你定目的地它开——验收方式完全不同
    - 没有区别
  - 1
  - Week 2 主要在 Agent 侧加深。
- - Harness 包含什么？
  - - 只有大模型
    - 工具表、记忆、规划、重试、日志——模型之外的循环骨架
    - 前端框架
  - 1
  - 同一模型换 Harness，能力天差地别。
nodes_lab: 无 Lab（纯理论日；部署/V1.0 材料见旧 section 目录自学）
nodes_project: 企业任务：提交 LLM 认知卡 llm-cognition-card.md + 18 词抽测过线
