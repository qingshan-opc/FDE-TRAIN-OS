      term: GATE 10
      plain: 毕业答辩：V2.0 演示 + 十条证据 + 8 分钟结构 + 互评 ≥2 份。
      tag: 验收
    - id: demo-fallback
      term: 演示兜底
      plain: 系统挂了指着 runs/ 日志讲——处理事故的方式也计分。
      tag: 技巧
    - id: fde-title
      term: FDE
      plain: 不是第一天发的帽子——答辩通过后自然获得的称号。
      tag: 里程碑
    glossary_terms:
    - id: gt-gate10
      term: GATE 10
      plain: 毕业验收闸：V2.0 全景 + 答辩 + 互评——通过后即 FDE。
    local_prep:
      codex_prompt: '你是模拟评委。按答辩提纲对我进行 8 分钟压力提问（每次 1 问）；我答后打分并指出证据是否在仓库。

        覆盖：闸是否真拦、SSE/Agent 是否真通、三条迭代故事。'
      checklist:
      - 完成自己的 8 分钟答辩
