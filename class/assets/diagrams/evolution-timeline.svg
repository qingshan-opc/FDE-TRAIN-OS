<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="技术演进时间线：六次浪潮"><rect width="1040" height="310" fill="#f2f5f0"/>
        <line x1="40" y1="150" x2="1008" y2="150" stroke="#231f20" stroke-width="2"/>
        <path d="M1022 150 L1004 143.5 L1004 156.5 Z" fill="#231f20"/>
        <!-- N1 -->
        <g>
          <text x="86" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">单机时代</text>
          <text x="86" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">DESKTOP</text>
          <circle cx="86" cy="150" r="7" fill="#f2f5f0" stroke="#231f20" stroke-width="2.5"/>
