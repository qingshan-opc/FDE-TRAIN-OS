<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="measurable">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.14)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="504" cy="56" r="86" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="416" r="62" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="62;74;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="24" width="6" height="26" rx="3" fill="#0d9488"/>
    <text x="46" y="43" font-size="19" font-weight="800" fill="#231f20">把模糊要求改成可判断标准</text>
    <text x="532" y="41" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.8" fill="rgba(35,31,32,.42)">DAY-01 · PM REQUIREMENTS</text>
  </g>
<text x="36" y="108" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.45)">模糊 · VAGUE</text>
<text x="524" y="108" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#0d9488">可判断 · MEASURABLE</text>
<g transform="translate(36,126)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="88" height="64" rx="12" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1" filter="url(#sh)"/>
      <text x="44.0" y="37.04" text-anchor="middle" font-size="14" font-weight="700" fill="#231f20">方便</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.0s" dur="7.0s" repeatCount="indefinite"/>
    </g>
  <path d="M134 158 H190" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
  </path>
<g transform="translate(198,126)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="326" height="64" rx="16" fill="url(#teal)" filter="url(#glow)"/>
      <rect x="-6" y="-6" width="338" height="76" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
      <animate attributeName="opacity" values=".5;.14;.5" dur="2.2s" repeatCount="indefinite"/>
    </rect>
      
      <text x="24" y="36.9" font-size="14" font-weight="700" fill="#ffffff">10 秒看到全部超期岗位</text>
      
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.0s" dur="7.0s" repeatCount="indefinite"/>
    </g>
<g transform="translate(36,226)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="88" height="64" rx="12" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1" filter="url(#sh)"/>
      <text x="44.0" y="37.04" text-anchor="middle" font-size="14" font-weight="700" fill="#231f20">准确</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.4s" dur="7.0s" repeatCount="indefinite"/>
    </g>
  <path d="M134 258 H190" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>
<g transform="translate(198,226)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="326" height="64" rx="16" fill="url(#teal)" filter="url(#glow)"/>
      <rect x="-6" y="-6" width="338" height="76" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
      <animate attributeName="opacity" values=".5;.14;.5" dur="2.2s" repeatCount="indefinite"/>
    </rect>
      
      <text x="24" y="36.55" font-size="13" font-weight="700" fill="#ffffff">页面数量与演示数据逐条一致</text>
      
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.4s" dur="7.0s" repeatCount="indefinite"/>
    </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="176.0" y="379" width="208.0" height="34" rx="17" fill="rgba(13,148,136,.09)"/>
    <text x="280" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">能数、能计时，才算可验收</text>
  </g>
</svg>
