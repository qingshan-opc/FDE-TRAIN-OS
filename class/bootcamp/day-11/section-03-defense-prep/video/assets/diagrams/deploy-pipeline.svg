<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="部署管线图">
<defs>
<marker id="dp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#231f20"/>
</marker>
</defs>
<rect width="1040" height="440" fill="#f2f5f0"/>
<!-- 五阶段 -->
<g>
<rect x="50" y="80" width="150" height="96" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<text x="125" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">代码</text>
<text x="125" y="142" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">CODE</text>
<text x="125" y="162" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">git commit 留证</text>
</g>
<g>
<rect x="246" y="80" width="150" height="96" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<text x="321" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">构建</text>
<text x="321" y="142" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">BUILD</text>
<text x="321" y="162" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">装依赖 · 配环境</text>
</g>
<g>
<rect x="442" y="80" width="150" height="96" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<text x="517" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">镜像</text>
<text x="517" y="142" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">IMAGE</text>
<text x="517" y="162" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">应用+环境 连锅端</text>
</g>
<g>
<rect x="638" y="80" width="150" height="96" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<text x="713" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">运行</text>
<text x="713" y="142" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">RUN</text>
<text x="713" y="162" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">服务器 7×24</text>
</g>
<g>
<rect x="834" y="80" width="150" height="96" fill="#ffffff" stroke="#1400ff" stroke-width="2.5"/>
<text x="909" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#1400ff">访问</text>
<text x="909" y="142" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">VISIT</text>
<text x="909" y="162" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">换设备能开 ✓</text>
</g>
<g stroke="#231f20" stroke-width="1.8" fill="none">
<line x1="202" y1="128" x2="240" y2="128" marker-end="url(#dp-arrow)"/>
<line x1="398" y1="128" x2="436" y2="128" marker-end="url(#dp-arrow)"/>
<line x1="594" y1="128" x2="632" y2="128" marker-end="url(#dp-arrow)"/>
<line x1="790" y1="128" x2="828" y2="128" marker-end="url(#dp-arrow)"/>
</g>
<!-- 验收闸 -->
<rect x="402" y="210" width="230" height="44" fill="#231f20"/>
<text x="517" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#f2f5f0">验收闸：十条链路全绿才准发</text>
<path d="M517 210 L517 182" stroke="#231f20" stroke-width="1.8" marker-end="url(#dp-arrow)"/>
<!-- 底注 -->
<text x="520" y="310" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">「在我机器上是好的」不算上线 —— 换台设备能开才算</text>
<text x="520" y="338" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">开发 / 生产配置分离 · 密钥不进代码（详见 env-config-split 图）</text>
<text x="520" y="368" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)" style="font-family:'SF Mono',Menlo,monospace">镜像 = 集装箱：你的应用和它的整个环境一起装箱，到哪台机器都长一样</text>
</svg>
