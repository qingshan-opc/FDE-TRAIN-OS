<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="虚拟机：一台切成好几台">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">虚拟机：一台切成好几台</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">VIRTUAL MACHINE</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="76" width="470" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="84" y="108" font-size="14" font-weight="800" fill="#231f20">一台物理机</text>
<text x="84" y="130" font-size="11.5" fill="rgba(35,31,32,.55)">VMware 里再跑一个系统，不必重启切换</text>
<rect x="84" y="150" width="130" height="52" rx="12" fill="rgba(13,148,136,.10)" stroke="rgba(13,148,136,.35)" stroke-width="1"/>
<text x="149" y="181" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Windows</text>
<rect x="230" y="150" width="130" height="52" rx="12" fill="rgba(13,148,136,.10)" stroke="rgba(13,148,136,.35)" stroke-width="1"/>
<text x="295" y="181" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Linux</text>
<rect x="376" y="150" width="130" height="52" rx="12" fill="rgba(13,148,136,.10)" stroke="rgba(13,148,136,.35)" stroke-width="1"/>
<text x="441" y="181" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Kali 实验机</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="570" y="76" width="410" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="594" y="116" font-size="13" font-weight="700" fill="#0f766e">✓ 力气榨干不浪费</text>
<text x="594" y="148" font-size="13" font-weight="700" fill="rgba(35,31,32,.65)">✗ 每台都背一整套系统</text>
<text x="594" y="180" font-size="12" fill="rgba(35,31,32,.55)">又慢又胖 —— 还能再进化</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="250" width="600" height="36" rx="18.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="272.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">像双系统，但不用重启：一台机器里同时跑好几种系统</text></g>
</svg>
