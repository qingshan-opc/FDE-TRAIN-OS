quiz:
  pass_rate: 0.67
  questions:
  - q: 你已经了解大致目标，但最终使用对象和截止时间不清。第一动作应当是什么？
    options: *id001
    answer: 1
    explain: “你看着办”通常意味着负责人希望你先贡献判断，同时仍需确认会改变方向的关键条件。
  - q: 老板让你明天交一份竞争对手分析，却没有说明用于内部决策还是对外路演。哪个缺口优先级最高？
    options: *id002
    answer: 2
    explain: 对象与用途会影响分析深度、证据标准、措辞和呈现形式。
  - q: 任务目标、成果和截止时间已清楚，但最终确认人不明确。最主要的风险是什么？
    options: *id003
    answer: 1
    explain: 最终确认权不清会导致多头修改和验收争议。
  - q: 你已经连续问了七个问题，老板说“先做再说”。最佳补救动作是什么？
    options: *id004
    answer: 2
    explain: 先贡献判断，再索取少量关键确认，可以降低决策负担。
  - q: 哪条验收标准最可用？
    options: *id005
    answer: 2
    explain: 标准需要包含可观察条件、使用场景和确认责任。
  - q: 任务确认单只写了要做的功能，没有写暂不包含项。最可能出现什么问题？
    options: *id006
    answer: 1
    explain: 非交付项为当前版本建立边界，也为后续变更提供基线。
  - q: 交付前3天，办公室提出中英双语。第一步应当是什么？
    options:
    - 判断对方故意增加工作
    - 立即答应
    - 记录具体要求并评估对时间、质量和资源的影响
    - 直接拒绝
    answer: 2
    explain: 先把变化和影响说清，再进入选项和确认。
  - q: 部门经理要求增加客户分级，但项目发起人尚未确认。你应如何处理？
    options:
    - 直接加入
    - 告诉部门经理无权发言
    - 评估价值和影响，形成选项，请有权负责人确认
    - 私下先做
    answer: 2
    explain: 尊重需求价值，同时守住变更授权。
