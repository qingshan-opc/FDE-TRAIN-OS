    quiz:
    - &id001
      - 知识库上线后客服仍在群里问老员工，最专业的第一步是什么？
      - - 要求每天使用十次
        - 立刻换模型
        - 记录使用事实，访谈客服和老员工，分诊入口、质量、信任和责任
        - 把不使用情况发给老板
      - 2
      - 先确认症状和可能原因。
    - &id002
      - 员工说“我自己做更快”，当前最合理的回应是什么？
      - - 告诉他AI是趋势
        - 用一条真实任务共同测试，并记录时间与核对成本
        - 强制培训
        - 取消试点
      - 1
      - 用真实任务验证“不值得用”或“确实不好用”。
    - &id003
      - 部门经理口头支持，却未安排人员和时间。应怎样记录？
      - - 明确抵触
        - 原则支持，资源支持待确认
        - 完全支持
        - 消极员工
      - 1
      - 态度判断要依据行动证据。
    - &id004
      - 客户数据含手机号、合同条件和过期报价。最合适的试点数据是？
      - - 全量导入
        - 让AI自动脱敏后全量使用
        - 公开资料与经过授权的脱敏样本
        - 先上线再补规则
      - 2
      - 数据需可授权、可用和可追溯。
    - &id005
      - 工具回答技术选型问题存在不确定性，正确机制是？
      - - 标注仅供参考即可
        - 让销售自行负责
        - 转专业人员，保留来源、日志和人工复核
        - 隐藏不确定性
      - 2
      - 高风险问题需要专业责任与兜底。
    - &id006
      - 老板要求三天全员上线，当前没有业务负责人。最佳回应是？
      - - 先答应
        - 直接拒绝
        - 区分启动与稳定采用，给阶段方案并确认业务负责人
        - 请员工加班
      - 2
      - 管理速度预期并补责任机制。
    tools:
    - name: 情境判断
      note: 先分清目标、角色、风险与下一步
