title: 第七天 · 第 3 节 · 方法：选哪项工作先封装
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 第七天 · 第 3 节 · 方法：选哪项工作先封装
  text: '同学们好，我是你们的老师404。第一个 Skill 选品决定你今天的成就感。选错了，后面写得再漂亮也跑不通，今天就会卡在验收上。咱们先看三个真实失败案例，再学三筛法——高频、稳定、低险，对吧。

    '
- id: 02-failure-stories
  ppt:
  - 眉题：02 FAILURE STORIES
  - 第七天 · 第 3 节 · 方法：选哪项工作先封装
  text: '小张封装了一年一次的年报——写完再没用过，封装成本回不来。小李封装了处理客户投诉——每次情况都不同，AI 开盲盒。小王第一个就封装给客户发报价邮件——AI 写错一个数字，发出去了。三个坑：低频、不稳定、高风险，对吧。

    '
- id: 03-three-filters
  ppt:
  - 眉题：03 THREE FILTERS
  - 第七天 · 第 3 节 · 方法：选哪项工作先封装
  text: '三筛法按顺序过。第一筛高频：每周至少做一次吗？低频的封装成本回不来。第二筛稳定：步骤能写成无歧义说明书吗？看情况太多的，AI 执行就是开盲盒。第三筛低险：做错了代价小吗？第一个 Skill 是拿来练信任的，对吧。

    '
- id: 04-low-risk-hard
  ppt:
  - 眉题：04 LOW RISK HARD
  - 第七天 · 第 3 节 · 方法：选哪项工作先封装
  text: '重点说低险——这是硬筛。对外发送、改数据库、花钱的事，先别碰。第一个 Skill 练的是你和 AI 之间的信任，不是练胆子。第九天咱们学人工确认点，学完再碰高风险的事，嘛。

    '
- id: 05-scoring-table
  ppt:
  - 眉题：05 SCORING TABLE
  - 第七天 · 第 3 节 · 方法：选哪项工作先封装
  text: '动手打分：每项一到五分，加一列数据可得——输入能直接从驾驶舱或现有文件拿到的，今天就能跑通。拿不定就选周报：高频、稳定、低险，数据就在你驾驶舱里。日报也行，结构一样，对吧。

    '
- id: 06-close
  ppt:
  - 眉题：06 CLOSE
  - 第七天 · 第 3 节 · 方法：选哪项工作先封装
  text: '同学们，本节先到这里。今天只做一个 Skill，做透。可以选两个候选打分，但定品只定一个。下一节开写——四部件齐全，验收可判。咱们把第一个 Skill 写进 skills/ 目录。

    '
