lab:
  primary_files:
  - docs/D1_选题确认单.md
  - docs/D1_团队协作卡.md
  - docs/D1_项目任务书.md
  - docs/PRD.md
  - docs/D1_command_log.md
  - design/prototypes/index.html
  prompt: 检查第一天交付链：选题确认单 → 团队协作卡 → 项目任务书 → PRD → 四页原型，以及指挥日志 docs/D1_command_log.md（含至少一次 REJECTED 与 APPROVED）。只报告真实存在的文件和验证结果，缺失项标
    BLOCKED，不得代替学员批准。
  rubric:
  - check: file_exists
    args:
      path: docs/D1_团队协作卡.md
  - check: file_exists
    args:
      path: docs/D1_项目任务书.md
  - check: text_contains
    args:
      path: docs/PRD.md
      needle: 验收标准
  - check: file_exists
    args:
      path: design/prototypes/index.html
  - check: file_exists
    args:
      path: docs/D1_command_log.md
  - check: text_contains
    args:
      path: docs/D1_command_log.md
      needle: REJECTED
  - check: text_contains
    args:
      path: docs/D1_command_log.md
      needle: APPROVED
  - check: text_contains
    args:
      path: docs/D1_command_log.md
      needle: 我确认以上批准均为本人作出
nodes_lab: 第 1 天岗位交接与真实证据验收
nodes_project: 从专业方向到 PRD 与可点击原型
knowledge_content:
  c1:
    knowledge_cards:
    - id: d1l1-k1
      term: 工序没有消失
      plain: 从想法到系统仍要经过需求、设计、页面、数据和检查，AI 改变的是执行者，不是做事顺序。
    - id: d1l1-k2
      term: 先说清业务问题
      plain: AI 时代的第一道门槛不是会不会写代码，而是能不能说清楚要解决谁的什么问题。
    - id: d1l1-k3
      term: 先把工具准备好
      plain: 第一节只完成 TRAE 安装和七岗位提示词包下载，下一节再创建 AI 员工。
    memory_sentence: 先选你懂的问题，再把工具准备好；本节不写代码，能打开 TRAE、能看到七份提示词就完成。
    quiz:
    - - 第一节完成软件安装后，接下来应该做什么？
      - - 立刻让一个 AI 做完整项目
        - 确认七份提示词已解压，下一节再逐个创建 AI 员工
        - 先学习编程语言
      - 1
      - 第一节只完成工具准备，不创建智能体，也不写代码。
  c2:
    knowledge_cards:
    - id: d1l2-k1
      term: 岗位职责决定能力
      plain: 创建 AI 员工的关键不是名字，而是写清它负责什么、按什么标准交付、什么情况必须拒绝。
    - id: d1l2-k2
      term: 岗位隔离标准
      plain: 产品负责把需求说清，测试负责挑毛病；标准冲突的岗位不能塞进一个“全能助手”。
    - id: d1l2-k3
      term: 产出者不能自批
      plain: AI 员工完成自检只能提交待检查，学员看到证据后才能明确批准。
    memory_sentence: 智能体不是越多越好，是各守一段标准；每个岗位都是一道质量关。
    quiz:
    - - 为什么不应该只创建一个“全能 AI 员工”包办所有岗位？
      - - 因为一个 AI 员工不能生成文件
        - 因为不同岗位的标准会互相妥协，产出者还会变成自己的裁判
        - 因为 AI 员工的名字必须不同
      - 1
      - 口播稿用“出纳不能兼任审计”说明了岗位隔离的必要性。
  c3:
    knowledge_cards:
    - id: d1l3-k1
      term: 先出方案再动手
      plain: 项目负责人先确认目标、范围和顺序，再允许岗位 AI 员工开始产出。
    - id: d1l3-k2
      term: 五天只做第一版
      plain: 把本周必须完成的主流程锁住，超出范围的想法进入待建设清单。
    - id: d1l3-k3
      term: 阶段感属于负责人
      plain: AI 恨不得一次做完，什么时候停、何时交接、能否继续必须由学员决定。
    memory_sentence: 先出方案再动手，阶段感属于项目负责人；边界锁得住，团队才不会越做越乱。
    quiz:
    - - 项目经理为什么应该先交项目任务书，而不是直接开始写代码？
      - - 因为代码必须最后一天写
        - 因为要先让学员确认目标、第一版边界、每天交付和风险
        - 因为项目经理不会使用开发工具
      - 1
      - 口播稿反复强调“先出方案，你确认了，再让 AI 动手”。
  c4:
    knowledge_cards:
    - id: d1l4-k1
      term: 需求文档是问出来的
      plain: 产品经理收到老板一句话后先澄清用户、流程、规则和痛点，而不是马上生成文档。
    - id: d1l4-k2
      term: 四项内容不能少
      plain: 需求文档至少要有字段清单、第一版范围、验收标准和待确认事项。
    - id: d1l4-k3
      term: 标准必须可判定
      plain: “合理”“好用”不是验收标准，每一条都要让第三方能用是或否判断。
    memory_sentence: 需求是问出来的，不是猜出来的；含糊的话，最后都会变成明确的问题。
    quiz:
    - - 产品经理收到“我要做一个费用报销系统”后，合格的第一步是什么？
      - - 直接写完整需求文档
        - 先提出关键问题，把业务范围和规则问清楚
        - 先选择页面配色
      - 1
      - 好的需求文档来自澄清对话，不来自 AI 对一句话需求的猜测。
  c5:
    knowledge_cards:
    - id: d1l5-k1
      term: 指令只说意图
      plain: 学员告诉页面设计师要读取需求文档并产出页面草图，具体标准由岗位职责和已批准需求提供。
    - id: d1l5-k2
      term: 原型必须可操作
      plain: 验收时要亲手提交空表单、增加数据、检查空态，不能只看页面是否漂亮。
    - id: d1l5-k3
      term: 先标识能力状态
      plain: AI 区先写“Week2 接入”和“演示数据”，再设计按钮，不能把未来能力伪装成已经完成。
    memory_sentence: 指令说意图，岗位管标准，验收靠动手；原型不是用来看的，是用来点的。
    quiz:
    - - 页面草图看起来很漂亮，是否就可以批准交付？
      - - 可以，视觉效果就是原型的全部标准
        - 不可以，还要亲手验证字段、校验、主流程和空态
        - 可以，只要 AI 说已经自检
      - 1
      - 口播稿明确指出，可交互原型的验收方式是用鼠标走一遍真实流程。
