<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-label="Workflow 还是 Agent：决策树">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="460" fill="#ffffff"/>
  <rect width="1040" height="460" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="412" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">Workflow 还是 Agent：能写死就写死</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">WORKFLOW VS AGENT</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="420" y="56" width="200" height="52" rx="14" fill="url(#tlg)" filter="url(#glow)"/><text x="520" y="88" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">来了一项工作</text></g>
<path d="M520 108 L520 144" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="5 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><path d="M520 150 L660 190 L520 230 L380 190 Z" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#sh)"/><text x="520" y="186" font-size="12.5" font-weight="800" fill="#231f20" text-anchor="middle">步骤能写死吗？</text><text x="520" y="206" font-size="10" fill="rgba(35,31,32,.5)" text-anchor="middle">A 完了必走 B？</text></g>
<path d="M376 190 L246 190" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="310" y="178" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">能</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="148" width="180" height="84" rx="16" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="150" y="182" font-size="13.5" font-weight="800" fill="#0f766e" text-anchor="middle">Workflow</text>
<text x="150" y="206" font-size="9.5" fill="rgba(35,31,32,.55)" text-anchor="middle">写死的流程图：便宜、稳定、好验收</text>
</g>
<g stroke="#0d9488" stroke-width="1.5" fill="none"><rect x="80" y="258" width="40" height="26" rx="6"/><rect x="140" y="258" width="40" height="26" rx="6"/><rect x="200" y="258" width="40" height="26" rx="6"/><line x1="120" y1="271" x2="138" y2="271"/><line x1="180" y1="271" x2="198" y2="271"/></g><text x="160" y="306" font-size="10" fill="rgba(35,31,32,.5)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">A → B → C 永远这么走</text>
<path d="M664 190 L734 190" stroke="rgba(35,31,32,.4)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="700" y="178" font-size="11" font-weight="700" fill="rgba(35,31,32,.55)" text-anchor="middle">不能</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><path d="M860 150 L980 190 L860 230 L740 190 Z" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#sh)"/><text x="860" y="186" font-size="12" font-weight="800" fill="#231f20" text-anchor="middle">需要现场决策？</text><text x="860" y="206" font-size="10" fill="rgba(35,31,32,.5)" text-anchor="middle">下一步要看情况？</text></g>
<path d="M860 230 L860 292" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="880" y="268" font-size="11" font-weight="700" fill="#0f766e">需要</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="770" y="300" width="180" height="90" rx="16" fill="url(#tlg)" filter="url(#glow)"/><text x="860" y="336" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">Agent</text><text x="860" y="360" font-size="9.5" fill="rgba(255,255,255,.9)" text-anchor="middle">决策环现场判断：贵、要护栏、要验收</text></g>
<path d="M790 210 L706 296" stroke="rgba(35,31,32,.4)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="726" y="262" font-size="11" font-weight="700" fill="rgba(35,31,32,.55)">不需要</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="540" y="300" width="160" height="90" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="620" y="336" font-size="13" font-weight="800" fill="#231f20" text-anchor="middle">人工 / 再拆</text>
<text x="620" y="360" font-size="9.5" fill="rgba(35,31,32,.55)" text-anchor="middle">也许这一步就不该自动化</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="370" y="416" width="300" height="34" rx="17.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="437.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">能写死就写死，写不死才上 Agent</text></g>
</svg>
