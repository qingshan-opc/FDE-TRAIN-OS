<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="real states">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.14)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="504" cy="56" r="86" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="416" r="62" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="62;74;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="24" width="6" height="26" rx="3" fill="#0d9488"/>
    <text x="46" y="43" font-size="19" font-weight="800" fill="#231f20">三个真实状态不能漏</text>
    <text x="532" y="41" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.8" fill="rgba(35,31,32,.42)">DAY-01 · UI PROTOTYPE</text>
  </g>
<g transform="translate(36,120)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="152" height="200" rx="18" fill="url(#teal)" filter="url(#glow)"/>
      <g transform="translate(76,64)">
        <circle r="16" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
        <circle r="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="34 68">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="76" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">加载中</text>
      <text x="76" y="152" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.85)">告诉用户正在处理</text>
    </g>
<g transform="translate(204,120)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="152" height="200" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <circle cx="76" cy="64" r="16" fill="none" stroke="rgba(35,31,32,.25)" stroke-width="2.5" stroke-dasharray="4 5"/>
      <text x="76" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">空数据</text>
      <text x="76" y="152" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">解释原因与下一步</text>
    </g>
<g transform="translate(372,120)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="152" height="200" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <circle cx="76" cy="64" r="16" fill="none" stroke="rgba(35,31,32,.25)" stroke-width="2.5" stroke-dasharray="4 5"/>
      <text x="76" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">错误</text>
      <text x="76" y="152" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">诚实提示，不留白屏</text>
    </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="182.5" y="379" width="195.0" height="34" rx="17" fill="rgba(13,148,136,.09)"/>
    <text x="280" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">原型也要画出这三种状态</text>
  </g>
</svg>
