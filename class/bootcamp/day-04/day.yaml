  - docs/D4-L2_执行矩阵.md
  - docs/D4-L2_缺陷报告.md
  - docs/D4-L4_验收清单.md
  - docs/D4_报审材料清单.md
  prompt: 审核第四天证据：区分用例数量和实际执行数量；核对真实缺陷、修复提交与复测记录。未执行不得写通过，功能冻结后不得加入新功能。
  rubric:
  - check: file_exists
    args:
      path: docs/D4-L1_测试用例表.md
  - check: file_exists
    args:
      path: docs/D4-L2_执行矩阵.md
  - check: file_exists
    args:
      path: docs/D4-L2_缺陷报告.md
  - check: text_contains
    args:
      path: docs/D4-L4_验收清单.md
      needle: 证据
nodes_lab: 第 4 天岗位交接与真实证据验收
nodes_project: 真实测试、缺陷闭环与 V0.9 冻结
knowledge_content:
  c1:
    knowledge_cards:
    - id: d4l1-k1
      term: 每项检查都能执行
      plain: 写清怎样操作、应该看到什么和实际看到什么，不能只写“检查一下”。
    - id: d4l1-k2
      term: 检查内容有来源
      plain: 主要来自需求文档的通过标准，以及前一天真实发现过的数据问题。
    - id: d4l1-k3
      term: 正常和异常都要覆盖
      plain: 既要走完整主流程，也要检查不同分支、空白、负数和超长内容。
    memory_sentence: 检查清单就是项目的体检单；步骤能执行，结果能判断，每一条都要有来源。
    quiz:
    - - 哪一条是合格的检查项？
      - - 检查提交功能是否正常
        - 金额填负数后提交，应该被阻止并说明金额必须大于零
        - 随便点几下，感觉页面没问题
      - 1
      - 合格检查项必须让任何人都能照着操作，并明确判断结果。
  c2:
    knowledge_cards:
    - id: d4l2-k1
      term: 严格照步骤操作
      plain: 不跳步骤、不凭感觉，保证检查结果可以被另一个人重复得到。
    - id: d4l2-k2
      term: 做完马上记录
      plain: 每一项立即标通过、不通过或被挡住，不能全部做完后靠记忆补写。
    - id: d4l2-k3
      term: 检查事实而非提示
      plain: 页面说提交成功还不够，必须确认记录真的保存、出现并且刷新后还在。
    memory_sentence: 照着做、马上记、明确判；检查的是事实，不是页面自己说的话。
    quiz:
    - - 页面弹出“提交成功”，是否可以立刻判断这一项通过？
      - - 可以，成功提示就是最终事实
        - 不可以，还要确认记录已保存、列表出现并且刷新后仍在
        - 可以，只要 AI 也说成功
      - 1
      - 页面提示只是一句话，真实数据变化才是检查对象。
  c3:
    knowledge_cards:
    - id: d4l3-k1
      term: 问题报告写清三件事
      plain: 说明怎样看到问题、本来应该怎样、实际发生了什么。
    - id: d4l3-k2
      term: 事实和猜测分开
      plain: 写亲眼看到的结果，原因猜测可以标注，但不能把猜测当成事实。
    - id: d4l3-k3
      term: 交给合适岗位处理
      plain: 页面显示问题交页面工程师，保存和规则问题交数据工程师，再按原步骤检查。
    memory_sentence: 步骤、应该怎样、实际怎样，三样不齐不动手；报告越具体，AI 修改越准确。
    quiz:
    - - “详情页有点怪，请修一下”是不是合格的问题报告？
      - - 是，AI 应该自己猜出问题
        - 不是，它缺少操作步骤、应该结果和实际结果
        - 是，只要语气足够严厉
      - 1
      - 模糊描述会让 AI 来回猜测，具体事实才能帮助它定位原因。
  c4:
    knowledge_cards:
    - id: d4l4-k1
      term: 修原因不遮现象
      plain: 要求 AI 解释为什么会错、改了哪里，不能只把错误提示藏起来。
    - id: d4l4-k2
      term: 修完检查三圈
      plain: 重走原问题、检查同一部分、必要时再走完整主流程。
    - id: d4l4-k3
      term: 交付前停止加功能
      plain: 严重问题解决后不再临时插入新想法，只处理已记录问题。
    memory_sentence: 修原因，不遮现象；修完必须重新检查，准备交付时先停止添加功能。
    quiz:
    - - AI 只修改了一行内容，是否可以不重新检查？
      - - 可以，一行内容不可能影响其他地方
        - 不可以，影响大小取决于修改位置，仍要检查相关功能
        - 可以，只要页面还能打开
      - 1
      - 很小的修改也可能碰到公共内容，修完必须用实际操作重新确认。
  c5:
    knowledge_cards:
    - id: d4l5-k1
      term: 先写检查范围
      plain: 明确哪些内容已经检查、哪些没有检查，先划清这份结论的边界。
    - id: d4l5-k2
      term: 用真实数字说结果
      plain: 写清检查总数、通过数、未通过数，以及问题发现和修复数量。
    - id: d4l5-k3
      term: 剩余问题必须公开
      plain: 每个未解决问题说明影响，不能为了好看从材料里删掉。
    memory_sentence: 质量材料里最值钱的是诚实的坏消息；问题写清楚是专业，藏起来才是风险。
    quiz:
    - - 没有检查手机上的显示效果，质量材料中应该怎样写？
      - - 不提这件事，让材料看起来更完整
        - 明确写“本次没有检查手机端”
        - 直接写手机端已经通过
      - 1
      - 未覆盖内容写在材料里是诚实边界，被现场发现才会损害可信度。
