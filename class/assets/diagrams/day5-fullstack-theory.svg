<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="全栈理论地图：五大主题">
  <rect width="1200" height="620" fill="#f2f5f0"/>
  <text x="48" y="52" font-size="26" font-weight="900" fill="#231f20" style="font-family:'Songti SC','Noto Serif SC',serif">Day 5 全栈理论地图</text>
  <text x="48" y="78" font-size="11" letter-spacing="3" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">FIVE THEMES · ONE CENTER</text>
  <!-- center -->
  <rect x="440" y="240" width="320" height="140" rx="14" fill="#231f20"/>
  <text x="600" y="290" text-anchor="middle" font-size="22" font-weight="900" fill="#f2f5f0" style="font-family:'Songti SC',serif">FDE</text>
  <text x="600" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1cd5b0">定方向 + 做验收</text>
  <text x="600" y="350" text-anchor="middle" font-size="11.5" fill="rgba(242,245,240,.55)">技术全栈 · 业务前置</text>
  <!-- theme cards: 1 top-left, 2 top-right, 3 right, 4 bottom-right, 5 bottom-left, ... use 5 around -->
  <g>
    <rect x="48" y="120" width="330" height="130" rx="10" fill="#fff" stroke="#1400ff" stroke-width="2"/>
    <text x="68" y="148" font-size="11" letter-spacing="2" fill="#1400ff" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">第 1 节 · 世界观</text>
    <text x="68" y="176" font-size="15.5" font-weight="900" fill="#231f20">浪潮重排谁值钱</text>
    <text x="68" y="202" font-size="12" fill="rgba(35,31,32,.6)">机器压低「动手做」一层</text>
    <text x="68" y="224" font-size="12" fill="rgba(35,31,32,.6)">人上移「判断与验收」一层</text>
  </g>
  <g>
    <rect x="822" y="120" width="330" height="130" rx="10" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
    <text x="842" y="148" font-size="11" letter-spacing="2" fill="#2f9e44" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">第 2 节 · 开发流程</text>
    <text x="842" y="176" font-size="15.5" font-weight="900" fill="#231f20">调研→原型→开发→验收→上线→迭代</text>
    <text x="842" y="202" font-size="12" fill="rgba(35,31,32,.6)">瀑布：一次全楼装修</text>
    <text x="842" y="224" font-size="12" fill="rgba(35,31,32,.6)">敏捷：一周一间房（你前四天）</text>
  </g>
  <g>
    <rect x="822" y="430" width="330" height="130" rx="10" fill="#fff" stroke="#f5a947" stroke-width="2"/>
    <text x="842" y="458" font-size="11" letter-spacing="2" fill="#f5a947" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">第 3 节 · 服务器与云原生</text>
    <text x="842" y="486" font-size="15.5" font-weight="900" fill="#231f20">物理机→虚拟机→容器→K8s→Serverless</text>
    <text x="842" y="512" font-size="12" fill="rgba(35,31,32,.6)">方向：你操心的机器越来越少</text>
    <text x="842" y="534" font-size="12" fill="rgba(35,31,32,.6)">云原生 = 生下来就住在云上</text>
  </g>
  <g>
    <rect x="48" y="430" width="330" height="130" rx="10" fill="#fff" stroke="#f24e54" stroke-width="2"/>
    <text x="68" y="458" font-size="11" letter-spacing="2" fill="#f24e54" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">第 4 节 · 前端选型</text>
    <text x="68" y="486" font-size="15.5" font-weight="900" fill="#231f20">三件套 + 五把武器</text>
    <text x="68" y="512" font-size="12" fill="rgba(35,31,32,.6)">四问：团队/生态/AI/项目大小</text>
    <text x="68" y="534" font-size="12" fill="rgba(35,31,32,.6)">框架是长大了才需要的装备</text>
  </g>
  <g>
    <rect x="435" y="490" width="330" height="110" rx="10" fill="#fff" stroke="#5f52a0" stroke-width="2"/>
    <text x="455" y="518" font-size="11" letter-spacing="2" fill="#5f52a0" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">第 5 节 · 后端选型</text>
    <text x="455" y="546" font-size="15.5" font-weight="900" fill="#231f20">四大路线 + 契约先行</text>
    <text x="455" y="572" font-size="12" fill="rgba(35,31,32,.6)">契约是合同，语言只是施工队</text>
  </g>
  <!-- connectors -->
  <line x1="378" y1="185" x2="470" y2="260" stroke="rgba(35,31,32,.3)" stroke-width="1.5"/>
  <line x1="822" y1="185" x2="730" y2="260" stroke="rgba(35,31,32,.3)" stroke-width="1.5"/>
  <line x1="905" y1="430" x2="720" y2="350" stroke="rgba(35,31,32,.3)" stroke-width="1.5"/>
  <line x1="295" y1="430" x2="480" y2="350" stroke="rgba(35,31,32,.3)" stroke-width="1.5"/>
  <line x1="600" y1="490" x2="600" y2="380" stroke="rgba(35,31,32,.3)" stroke-width="1.5"/>
  <!-- bottom note -->
  <text x="600" y="608" text-anchor="middle" font-size="13" fill="rgba(35,31,32,.55)">手里有作品（PRD → 架构 → 原型 → 契约） · 脑里有地图 —— 第一周，带走了。</text>
</svg>
