lab:
  primary_files:
  - docs/D3-L1_项目地图.md
  - docs/D3-L2_数据表说明.md
  - docs/D3-L3_接口验证.md
  - docs/D3-L4_Week2_AI交接.md
  - docs/D3_冒烟记录.md
  - docs/D3_command_log.md
  prompt: 执行第三天全链路验收：必须亲自提交新记录并核对 SQLite、列表、详情和驾驶舱统计，并检查指挥日志 docs/D3_command_log.md。若业务仍使用 Mock，状态必须是 BLOCKED；AI 预留接口不得返回伪造分析。
  rubric:
  - check: file_exists
    args:
      path: docs/D3-L1_项目地图.md
  - check: file_exists
    args:
      path: docs/D3-L3_接口验证.md
  - check: text_contains
    args:
      path: docs/D3-L4_Week2_AI交接.md
      needle: 人工确认
  - check: file_exists
    args:
      path: docs/D3_冒烟记录.md
  - check: file_exists
    args:
      path: docs/D3_command_log.md
  - check: text_contains
    args:
      path: docs/D3_command_log.md
      needle: REJECTED
  - check: text_contains
    args:
      path: docs/D3_command_log.md
      needle: APPROVED
  - check: text_contains
    args:
      path: docs/D3_command_log.md
      needle: 我确认以上批准均为本人作出
nodes_lab: 第 3 天岗位交接与真实证据验收
nodes_project: SQLite + 真实接口 + 前后端联调 V0.8
knowledge_content:
  c1:
    knowledge_cards:
    - id: d3l1-k1
      term: 页面负责收和看
      plain: 用户在页面提交内容，也通过列表、详情和看板查看结果。
    - id: d3l1-k2
      term: 数据服务负责检查和传
      plain: 它接收页面送来的内容，执行规则，再把合格记录交给数据仓库保存。
    - id: d3l1-k3
      term: 数据仓库负责记
      plain: 真实记录保存在统一位置，列表、详情和看板都从这里获得事实。
    memory_sentence: 页面负责收和看，数据服务负责检查和传，数据仓库负责记；一条记录走通，系统才真正活起来。
    quiz:
    - - 用户提交一条记录后，正确的旅程是什么？
      - - 页面直接把数字画到看板上
        - 页面送出内容，数据服务检查并保存，其他页面再读取和汇总
        - AI 自动生成一条新的业务记录
      - 1
      - 口播稿用一条记录的旅程解释了页面、数据服务和数据仓库的分工。
  c2:
    knowledge_cards:
    - id: d3l2-k1
      term: 保存内容来自需求
      plain: 页面要求填写什么，数据仓库就要有对应位置，不能由工程师临时发明。
    - id: d3l2-k2
      term: 每条记录要能追查
      plain: 不重复的编号和创建、修改时间，帮助确认记录是谁、什么时候发生变化。
    - id: d3l2-k3
      term: 状态变化要有规矩
      plain: 待处理、处理中、已完成等状态不能随意跳转，必须符合真实业务过程。
    memory_sentence: 保存规则来自业务，不来自工程师的想象；每项内容有位置，每种状态有规矩。
    quiz:
    - - 已经完成的记录能否无条件改回待处理？
      - - 可以，状态只是随便填写的文字
        - 不可以，必须遵守事先确定的状态变化规则
        - 可以，只要换一种颜色
      - 1
      - 状态表示真实业务进展，不能脱离规则任意变化。
  c3:
    knowledge_cards:
    - id: d3l3-k1
      term: 真实记录要能进能出
      plain: 提交后必须保存，列表能查到，详情能打开，看板数字能随记录变化。
    - id: d3l3-k2
      term: 数据服务再次守规则
      plain: 即使页面已经提醒过，数据服务仍要拒绝空白、负数或其他不合格内容。
    - id: d3l3-k3
      term: 运行结果才算完成
      plain: AI 生成文件不等于功能完成，必须用真实操作证明每一步都有效。
    memory_sentence: 页面提醒是为了好用，数据检查是为了安全；生成了文件不算完成，真实记录能进能出才算。
    quiz:
    - - 页面已经阻止负数金额，数据服务是否还需要再次检查？
      - - 不需要，页面永远不会被绕过
        - 需要，数据服务必须保护真实记录不被坏数据污染
        - 只在演示时需要
      - 1
      - 页面提醒改善体验，数据服务检查保护真实数据，两层职责不同。
  c4:
    knowledge_cards:
    - id: d3l4-k1
      term: 第一周先把数据做真
      plain: 提交、保存、查询和统计先形成稳定流程，AI 分析放到第二周增加。
    - id: d3l4-k2
      term: 没接入就明确说明
      plain: 当前分析通道要回答 AI 尚未接入，不能用固定文字冒充真实分析。
    - id: d3l4-k3
      term: 提前写好下周交接
      plain: 说明 AI 将读取什么、返回什么、结果放哪里以及最后由谁确认。
    memory_sentence: 第一周把数据做真，第二周把智能接上；没有接入，就诚实标记。
    quiz:
    - - 当前还没有真正调用 AI，页面上的分析样例应该怎样标记？
      - - 标记为 AI 已完成分析
        - 醒目标记为演示数据，并说明第二周接入
        - 不做任何说明
      - 1
      - 口播稿强调分期开发要诚实，未来能力不能冒充当前成果。
  c5:
    knowledge_cards:
    - id: d3l5-k1
      term: 先按约定逐项核对
      plain: 名称或格式对不上时先查双方约定，不让两个 AI 各自猜答案。
    - id: d3l5-k2
      term: 每接一段就检查一段
      plain: 依次检查列表、提交、详情和看板，避免所有问题最后缠在一起。
    - id: d3l5-k3
      term: 完成后赶走假数据
      plain: 确保所有业务页面都读取真实记录，不再偷偷使用演示数据入口。
    memory_sentence: 对不上时先查约定，不靠猜；接完以后赶走假数据，用一条真实记录证明全流程。
    quiz:
    - - 页面显示的名称和数据服务返回的名称对不上，第一步是什么？
      - - 让两个岗位各自修改直到碰巧成功
        - 查看双方传话约定，先判断谁没有遵守或约定哪里不清
        - 把演示数据重新放回页面
      - 1
      - 先修正约定，再修改实现，才能让问题不再重复出现。
