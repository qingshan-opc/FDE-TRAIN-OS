learn:
  lingzhi_tags:
  - camp:v0.7
  - day:2
  - project:role-week
  estimated_minutes: 130
  require_capsules: true
  capsules:
  - id: c1
    title: 先搭骨架：看懂前端工程地图
    minutes: 20
    form: 实操
    content_ref: class/bootcamp/day-02/section-01-architect-role/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：先搭骨架再填页面，是为了让学员看见目录、路由、组件和页面之间的关系，而不是让 AI 一次性变出完整产品。


      请记住三件事。


      「前端负责用户看到和操作的部分。」


      「路由决定四个页面如何到达，组件负责重复使用的界面块。」


      「先验收空壳结构，再允许逐页实现。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：要求前端工程师只搭工程结构和四个空页面，启动后由学员逐个访问。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：可运行工程骨架与四个空路由
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 为什么先做空壳路由？
      - &id001
        - 为了少写代码
        - 为了先确认工程结构和页面边界
        - 为了跳过原型
      - 1
      - 先确认骨架可以降低一次性生成造成的黑箱感。
    - - 前端主要负责什么？
      - &id002
        - 用户看到和操作的界面
        - 保存所有数据库文件
        - 替学员批准 PRD
      - 0
      - 前端实现交互界面并调用后端接口。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请阅读 docs/PRD.md 和 design/prototypes/，为项目搭建前端工程骨架并运行起来。先只创建驾驶舱、提交、列表、详情四个空壳路由和公共导航，我确认结构后再逐页实现。

        请向我解释主要目录各放什么；完成后自检并以 REVIEW 状态交付，不要提前把所有页面写完。'
      checklist:
      - 项目能启动
      - 四个空路由可访问
      - 能说出页面、组件和公共布局放在哪里
      - README 记录启动方式
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 提交页：字段、校验与业务语言
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-02/section-02-four-layer/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：页面字段不是前端自由发挥，它是 PRD 字段清单的第五次落地；错误提示要让业务用户看得懂。


      请记住三件事。


      「必填、类型、范围和字数限制都来自 PRD。」


      「前端校验改善体验，但第三天后端还要再次守规则。」


      「错误提示写业务语言，不暴露技术堆栈。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：按原型实现提交页，并亲手尝试留空、越界和正常提交。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：可填写、可校验的提交页
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 提交页字段冲突时以什么为准？
      - &id003
        - AI 临时判断
        - 已批准的 PRD
        - 页面看起来是否整齐
      - 1
      - 已批准 PRD 是当前需求基线。
    - - 为什么前端有校验，后端还要再校验？
      - &id004
        - 为了重复工作
        - 前端可被绕过，后端要守住业务规则
        - 因为按钮颜色不同
      - 1
      - 后端必须保护真实数据不被非法请求污染。
    local_prep:
      codex_prompt: '@前端工程师 Agent 按 design/prototypes/ 的提交页原型实现真实提交页面。字段、必填规则、类型和字数限制以 docs/PRD.md 为准；校验失败时用普通员工能看懂的中文业务提示。

        完成后请列出正常、边界和异常三组自检结果，以 REVIEW 状态交付。'
      checklist:
      - 字段与 PRD 逐项一致
      - 必填和边界校验真实生效
      - 提示语为中文业务语言
      - 正常输入能够提交到当前 Mock 数据层
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 列表页：用 Mock 提前验证页面
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-02/section-03-arch-selection/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：Mock 是按未来接口格式制作的临时数据，用来让前端在后端完成前先推进；Mock 不是数据库，也不能冒充联调完成。


      请记住三件事。


      「Mock 字段和状态枚举必须服从 PRD。」


      「列表同时验证有数据和无数据两种状态。」


      「提交的新记录要进入列表，形成前端内部联动。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：实现列表和空态，并标记当前数据来源为 Mock。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：列表页、空态与至少 5 条 Mock
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - Mock 数据的正确定位是什么？
      - &id005
        - 真实数据库备份
        - 按契约制作的临时前端数据
        - AI 分析结果
      - 1
      - Mock 让前端先行，但不能冒充真实接口。
    - - 前端使用 Mock 时可以说系统已联调吗？
      - &id006
        - 可以
        - 不可以
        - 只要页面漂亮就可以
      - 1
      - 联调要求前端真实调用后端并读写数据库。
    local_prep:
      codex_prompt: '@前端工程师 Agent 实现列表页：先使用至少 5 条符合 docs/PRD.md 字段和状态枚举的 Mock 数据，补上无数据空态；让提交页新增的记录能立即出现在列表里。

        请在开发说明中明确“当前为 Mock，尚未连接数据库”，完成后自检并以 REVIEW 状态交付。'
      checklist:
      - 至少五条 Mock 且字段合法
      - 空态可验证
      - 提交与列表联动
      - 页面或说明明确当前不是数据库数据
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 详情页与五接口契约：前后端先签合同
    minutes: 30
    form: 实操+交接
    content_ref: class/bootcamp/day-02/section-04-hands-on-adr/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：接口契约规定前端怎么问、后端怎么答，是两个岗位可以并行工作的合同。


      请记住三件事。


      「第一周 四个真实接口：提交、列表、详情、看板统计。」


      「第二周 一个预留 AI 接口，当前只能返回 AI_NOT_CONNECTED。」


      「每个接口写方法、路径、请求、响应、错误和版本。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：先让前端完成详情页，再让后端工程师根据 PRD 和前端代码起草契约，由学员批准。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent → @后端工程师 Agent'
      note: 本节交付：详情页 + docs/D2-L4_接口契约.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 接口契约主要解决什么问题？
      - - 统一按钮颜色
        - 约定前端请求与后端响应
        - 代替数据库
      - 1
      - 契约让前后端对同一字段和错误结构达成一致。
    - - Week1 的 AI 接口应该返回什么？
      - - 固定分析文案
        - AI_NOT_CONNECTED 等诚实状态
        - 随机建议
      - 1
      - 未接模型就不能伪造 AI 结果。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请实现详情页，展示完整业务记录。AI 区标题固定为“AI 分析区｜Week2 接入”；如有样例必须标“演示数据”。完成并自检后停下。


        @后端工程师 Agent 请阅读 docs/PRD.md 和当前前端代码，起草 docs/D2-L4_接口契约.md：提交、列表、详情、看板统计四个 Week1 真实接口，以及一个 Week2 预留 AI 分析接口。每个接口写方法、路径、请求字段、响应结构、错误响应和版本
        v0.1；AI 接口当前返回 AI_NOT_CONNECTED。以 REVIEW 状态交给我批准，不要开始写后端。'
      checklist:
      - 详情字段与 PRD 一致
      - AI 区状态和演示数据标识清楚
      - 五个接口齐全
      - 请求响应字段与页面和 PRD 能对上
      - 学员批准契约后才允许第三天后端开工
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 驾驶舱看板与前端 V0.5 走查
    minutes: 30
    form: 实操+验收
    content_ref: class/bootcamp/day-02/section-05-accept/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：驾驶舱是管理者的一屏总览，但每个指标都必须能追到列表中的业务记录和未来统计接口。


      请记住三件事。


      「看板使用与统计接口相同结构的 Mock。」


      「走查覆盖四页跳转、三态、字段、错误提示和浏览器报错。」


      「纠偏必须写哪里不对、改成什么样。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：完成驾驶舱，亲手走查四页并至少写两条修复单。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：四页 Mock 前端 V0.5 + 走查记录
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 驾驶舱指标应该从哪里来？
      - - 设计师想象
        - 业务记录按统计规则聚合
        - 随机数
      - 1
      - 看板必须可追溯到业务数据。
    - - 合格纠偏指令必须包含什么？
      - - 重做
        - 哪里不对以及改成什么样
        - 写快一点
      - 1
      - 明确现象和目标才能验收修复。
    local_prep:
      codex_prompt: '@前端工程师 Agent 实现驾驶舱看板：按 docs/PRD.md 展示顶部统计卡和类别分布，看板 Mock 数据结构必须与 docs/D2-L4_接口契约.md 的统计接口响应一致。

        完成后先不要宣布通过。请生成 docs/D2_前端走查.md 空表，我会亲自检查四页跳转、空/加载/失败三态、字段一致性、业务提示、AI 标识和浏览器报错；我填写问题后你再逐项修复并等待复验。'
      checklist:
      - 四页可互相到达
      - 看板指标与选题一致
      - 统计 Mock 服从契约
      - 走查至少记录两项真实问题或明确的验证证据
      - 修复后由学员复验并批准 V0.5
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
