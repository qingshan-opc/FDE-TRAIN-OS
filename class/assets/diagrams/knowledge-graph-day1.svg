<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="Day 1 知识图谱：世界观快通 + 第一次动手">
  <rect width="1040" height="760" fill="#231f20"/>

  <!-- 标题 -->
  <text x="40" y="58" font-size="24" font-weight="900" fill="#f2f5f0">Day 1 知识图谱</text>
  <text x="40" y="82" font-size="12" fill="rgba(242,245,240,.55)">世界观快通 + 第一次动手 · 六节概念一张图</text>
  <text x="1000" y="58" text-anchor="end" font-size="11" letter-spacing="2" fill="rgba(242,245,240,.4)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">FDE · KNOWLEDGE MAP</text>

  <!-- ===== 第一行：为什么是现在 ===== -->
  <!-- 1.1a 六次浪潮 -->
  <rect x="40" y="110" width="300" height="120" fill="none" stroke="#f24e54" stroke-width="2"/>
  <text x="64" y="146" font-size="17" font-weight="800" fill="#f2f5f0">六次技术浪潮</text>
  <text x="64" y="166" font-size="10" letter-spacing="1.5" fill="#f24e54" style="font-family:'SF Mono',Menlo,monospace">1.1 · 世界观快通</text>
  <text x="64" y="194" font-size="12" fill="rgba(242,245,240,.65)">单机 → Web → 云 → 移动 → AI 原生</text>
  <text x="64" y="214" font-size="12" fill="rgba(242,245,240,.65)">规律：每次重排「谁值钱」</text>

  <!-- 1.1b 生态四层 -->
  <rect x="400" y="110" width="300" height="120" fill="none" stroke="#5f52a0" stroke-width="2"/>
  <text x="424" y="146" font-size="17" font-weight="800" fill="#f2f5f0">LLM 生态四层</text>
  <text x="424" y="166" font-size="10" letter-spacing="1.5" fill="#5f52a0" style="font-family:'SF Mono',Menlo,monospace">1.1 · 世界观快通</text>
  <text x="424" y="194" font-size="12" fill="rgba(242,245,240,.65)">模型 → 平台 → 协议工具 → 应用</text>
  <text x="424" y="214" font-size="12" fill="rgba(242,245,240,.65)">你的驾驶舱住在「应用层」</text>

  <!-- FDE 结论 -->
  <rect x="760" y="110" width="240" height="120" fill="#231f20" stroke="#f24e54" stroke-width="2"/>
  <text x="784" y="146" font-size="17" font-weight="800" fill="#f2f5f0">所以学 FDE</text>
  <text x="784" y="166" font-size="10" letter-spacing="1.5" fill="#f24e54" style="font-family:'SF Mono',Menlo,monospace">结论 · WHY</text>
  <text x="784" y="194" font-size="12" fill="rgba(242,245,240,.65)">「写」贬值，判断与验收升值</text>
  <text x="784" y="214" font-size="12" fill="rgba(242,245,240,.65)">值钱的位置向人移一层</text>

  <path d="M340 170 L392 170" stroke="rgba(242,245,240,.4)" stroke-width="1.5" fill="none"/>
  <path d="M700 170 L752 170" stroke="rgba(242,245,240,.4)" stroke-width="1.5" fill="none"/>

  <!-- ===== 第二行：AI 是什么 + 怎么建 ===== -->
  <!-- 1.2 LLM 最小认知 -->
  <rect x="40" y="290" width="300" height="120" fill="none" stroke="#e0479e" stroke-width="2"/>
  <text x="64" y="326" font-size="17" font-weight="800" fill="#f2f5f0">LLM 最小认知</text>
  <text x="64" y="346" font-size="10" letter-spacing="1.5" fill="#e0479e" style="font-family:'SF Mono',Menlo,monospace">1.2 · 概念</text>
  <text x="64" y="374" font-size="12" fill="rgba(242,245,240,.65)">会：生成 / 理解 / 推理</text>
  <text x="64" y="394" font-size="12" fill="rgba(242,245,240,.65)">不会：记忆 / 真相 / 主动 → 要兜底</text>

  <!-- 1.3a 应用四层 -->
  <rect x="400" y="290" width="300" height="120" fill="none" stroke="#1cd5b0" stroke-width="2"/>
  <text x="424" y="326" font-size="17" font-weight="800" fill="#f2f5f0">应用四层架构</text>
  <text x="424" y="346" font-size="10" letter-spacing="1.5" fill="#1cd5b0" style="font-family:'SF Mono',Menlo,monospace">1.3 · 概念</text>
  <text x="424" y="374" font-size="12" fill="rgba(242,245,240,.65)">前端 / 接口 / 数据库 / 模型</text>
  <text x="424" y="394" font-size="12" fill="rgba(242,245,240,.65)">换内脏不换脸：契约对话</text>

  <!-- 1.3b 十天路线 -->
  <rect x="760" y="290" width="240" height="120" fill="none" stroke="#1cd5b0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="784" y="326" font-size="17" font-weight="800" fill="#f2f5f0">十天路线</text>
  <text x="784" y="346" font-size="10" letter-spacing="1.5" fill="#1cd5b0" style="font-family:'SF Mono',Menlo,monospace">1.3 · 概念</text>
  <text x="784" y="374" font-size="12" fill="rgba(242,245,240,.65)">同一艘驾驶舱逐层接电</text>
  <text x="784" y="394" font-size="12" fill="rgba(242,245,240,.65)">V0.1 → V1.0 → V2.0</text>

  <path d="M340 350 L392 350" stroke="rgba(242,245,240,.4)" stroke-width="1.5" fill="none"/>
  <path d="M700 350 L752 350" stroke="rgba(242,245,240,.4)" stroke-width="1.5" fill="none"/>

  <!-- ===== 第三行：第一次动手 ===== -->
  <!-- 1.4 五步闭环 -->
  <rect x="40" y="470" width="300" height="120" fill="none" stroke="#f5a623" stroke-width="2"/>
  <text x="64" y="506" font-size="17" font-weight="800" fill="#f2f5f0">五步闭环</text>
  <text x="64" y="526" font-size="10" letter-spacing="1.5" fill="#f5a623" style="font-family:'SF Mono',Menlo,monospace">1.4 · 实战 · 环境导览</text>
  <text x="64" y="554" font-size="12" fill="rgba(242,245,240,.65)">需求 → 生成 → 验收 → 迭代 → 完成</text>
  <text x="64" y="574" font-size="12" fill="rgba(242,245,240,.65)">Prompt 就是源码</text>

  <!-- 1.5 方向卡 + 线框 -->
  <rect x="400" y="470" width="300" height="120" fill="none" stroke="#f5a623" stroke-width="2"/>
  <text x="424" y="506" font-size="17" font-weight="800" fill="#f2f5f0">方向卡 + 线框</text>
  <text x="424" y="526" font-size="10" letter-spacing="1.5" fill="#f5a623" style="font-family:'SF Mono',Menlo,monospace">1.5 · 实战 · 瞄准镜</text>
  <text x="424" y="554" font-size="12" fill="rgba(242,245,240,.65)">3 问：可数据化 + 来源 + 用途</text>
  <text x="424" y="574" font-size="12" fill="rgba(242,245,240,.65)">五区块：编号 + 字段 + 三态</text>

  <!-- 1.6 GATE 1 -->
  <rect x="760" y="470" width="240" height="120" fill="none" stroke="#f24e54" stroke-width="2"/>
  <text x="784" y="506" font-size="17" font-weight="800" fill="#f2f5f0">GATE 1 验收</text>
  <text x="784" y="526" font-size="10" letter-spacing="1.5" fill="#f24e54" style="font-family:'SF Mono',Menlo,monospace">1.6 · 验收</text>
  <text x="784" y="554" font-size="12" fill="rgba(242,245,240,.65)">快测 ≥4/6 · 方向卡过闸</text>
  <text x="784" y="574" font-size="12" fill="rgba(242,245,240,.65)">公开课 O1–O4 = 免修考试</text>

  <path d="M340 530 L392 530" stroke="rgba(242,245,240,.4)" stroke-width="1.5" fill="none"/>
  <path d="M700 530 L752 530" stroke="rgba(242,245,240,.4)" stroke-width="1.5" fill="none"/>

  <!-- 纵向社会关系：三行的逻辑 -->
  <path d="M550 230 L550 282" stroke="rgba(242,245,240,.35)" stroke-width="1.5" fill="none"/>
  <text x="562" y="262" font-size="11" fill="rgba(242,245,240,.5)">看懂时代 → 看懂 AI</text>
  <path d="M550 410 L550 462" stroke="rgba(242,245,240,.35)" stroke-width="1.5" fill="none"/>
  <text x="562" y="442" font-size="11" fill="rgba(242,245,240,.5)">看懂地图 → 第一次动手</text>

  <!-- 底部结论 -->
  <rect x="40" y="640" width="960" height="80" fill="none" stroke="rgba(242,245,240,.25)" stroke-width="1"/>
  <text x="64" y="674" font-size="14" font-weight="700" fill="#f2f5f0">今日主线：两张地图（浪潮 + 生态）→ 一个本体（LLM）→ 一张施工图（四层）→ 一次动手（闭环 + 方向卡）→ 一道闸（GATE 1）</text>
  <text x="64" y="700" font-size="11.5" fill="rgba(242,245,240,.5)">完整版理论在公开课 O1–O4 · 快测 6 题就是免修考试 · 明天 Day 2：线框变 V0.1</text>
</svg>
