    - id: output-spec
      term: 输出要求
      plain: 格式 + 长度 + 红线；对应 Day 5 结构化输出。
      tag: 连接
    - id: accept-spec
      term: 验收要求
      plain: 可判对错；「写得好」不是验收标准。
