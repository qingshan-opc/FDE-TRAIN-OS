  - id: c4
    title: 实战：让 Agent 调用你的 Skill
    minutes: 30
    form: 实战
    content_ref: class/bootcamp/day-09/section-04-agent-calls-skill/lesson.md
    content: '同学们，这节把你的 Skill 挂上 Agent 的工具表。Agent 选工具的时候读什么？不是说明书全文——是货架标签，叫工具描述。名称、何时用、输入要求，三要素写清楚，对吧。

      工具描述三要素：何时用——需要生成本周运营周报时，输入为 KPI 与异常工单数据；不用于——写通用文章、创意写作、对外发送任何内容；输入要求——JSON 格式，缺数据时本工具会拒绝。最反直觉的是不用于——它是护栏，防止周报工具被选去写情诗，嘛。

      挂上去，测三个任务。任务 A 该调：用本周数据生成周报——期望选中 weekly-report。任务 B 不该调：帮我写一句朋友圈文案——期望不调工具，直接答。任务 C 易选错：总结一下这周情况——模糊指令，观察它选什么，对吧。

      选错了别怪 Agent 笨，怪标签写得宽。改描述，再测。今天结束前交一张选错图谱：我的 Agent 在什么措辞下会误选或漏选，因为什么，我用什么修了描述。这比十次正确都值钱——它告诉你工具描述的边界在哪，对吧。

      描述写多长？两到四句；长了稀释关键信息，短了护栏不够。平台没有工具表功能？降级玩法：Prompt 里手动提供工具清单加描述，让模型先输出选择再执行。Agent 调用时输入谁准备？今天你在任务里给数据，第九天编排会把拉数据串起来，嘛。

      收个尾：从今天起你派活用自然语言，挑工具的活 Agent 自己干。选错图谱和 agent-tool-map.md 一起进 Git。下一节第八天验收——Agent v0.1 闭环演示，对吧。'
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - dg-agent-loop
    - dg-harness
    tools:
    - name: 选错图谱
      note: 描述重叠 / 缺边界 / 任务歧义
    quiz:
    - - Agent 选错 Skill 最常见原因是？
      - - 模型版本太旧
        - 工具描述重叠、模糊、缺「何时不用」
        - 网络延迟
      - 1
      - 第 1 步「理解任务」跑偏——描述写得越清，选型越准。
    - - Agent 闭环演示的验收标准是？
      - - Agent 有回复就行
        - 自然语言任务 → 正确调用 Skill → 产出过验收标准
        - 必须全自动无人工
      - 1
      - 闭环 = 理解、选型、执行、验收四步全绿。
    - - 故意给「不匹配任务」的目的是？
      - - 为难 Agent
        - 观察它会不会选错，分析原因写进日志
        - 测试模型速度
      - 1
      - 「什么时候会选错」是 GATE 8 口答必考点——Day 10 答辩也会问。
    - - 工具描述里写清「何时不用」主要防止什么？
      - - 模型算力不够
        - Agent 在模糊任务上误选你的 Skill
        - 日志文件过大
      - 1
      - 负例边界写进描述 = 选型护栏，比加长正面介绍更管用。
    - - Copilot 与 Agent 在「谁拿方向盘」上的区别？
      - - 没区别，都是聊天
        - Copilot 递扳手你开；Agent 你定目的地它开——验收方式不同
        - Agent 更便宜所以优先
      - 1
      - 信任对象变了：从「建议」变成「代执行」，必须可回放。
    media:
    - kind: video
      title: 口播课件 · Agent 调用 Skill
      object_key: documents/shared/course-media/day08-c4-agent-loop.mp4
      poster_key: documents/shared/course-media/day08-c4-agent-loop-poster.jpg
      duration_sec: 118
    knowledge_cards:
    - id: agent-calls-skill
      term: Agent 调用 Skill
      plain: 自然语言下任务 → Agent 选对工具 → 执行 → 产出过验收。
      tag: 实战
    - id: wrong-pick
      term: 什么时候会选错
      plain: 工具描述重叠、模糊、缺「何时不用」时——选错图谱的第一因。
      tag: 关键
    glossary_terms:
    - id: gt-copilot-agent
      term: Copilot vs Agent
      plain: Copilot 递扳手；Agent 定目的地它开——信任与验收方式完全不同。
    local_prep:
      codex_prompt: '你是 Agent 工具接入教练。请根据我的 skills/〈名称〉.md 写出工具描述三要素：何时用 / 不用于 / 输入要求。

        然后设计三任务实测脚本：

        A 应调用该 Skill；B 不应调用；C 模糊指令易选错。

        要求我把结果记入 docs/agent-tool-map.md（选错原因与描述修改句）。

        若在 Cursor/Agent Lab：指导我如何挂工具表并逐条跑，不要跳过复测。'
      checklist: []
quiz:
  pass_rate: 0.67
  questions:
  - q: 「能跑」和「可依赖」之间隔着什么？
    options:
    - 更强的模型
    - 边界声明 + 异常注入测试
    - 更多 Prompt
    answer: 1
    explain: 乖数据上能跑 ≠ 真实世界可依赖。
  - q: 异常四分类是？
    options:
    - 前端/后端/数据库/模型
    - 输入错 / 环境错 / 能力限 / 目标歧
    - 早/中/晚/夜
    answer: 1
    explain: 四类处置各不相同——不能一刀切。
  - q: 输入数据为空，Skill 应？
    options:
    - 编 plausible 数据
    - 拒绝执行，明说缺什么
    - 跳过继续
    answer: 1
    explain: 停下来、说清楚、等人来——不编数据补洞。
  - q: Harness 是？
    options:
    - 更大的模型
    - 模型之外的循环：工具表/记忆/规划/重试/日志
    - 编程框架
    answer: 1
    explain: 同一模型在聊天窗 vs Agent 工具里差别在 Harness。
  - q: 决策环顺序？
    options:
    - 调工具 → 理解 → 规划
    - 理解 → 规划 → 调工具 → 观察 → 继续
    - 生成 → 验收
    answer: 1
    explain: 观察结果决定下一步——循环直到完成或求助。
  - q: workflow vs agent 选择原则？
    options:
    - 永远 agent
    - 能写死用 workflow，写不死才 agent
    - 看心情
    answer: 1
    explain: 自由度换不确定性——能 workflow 别 agent。
  - q: Agent 选错 Skill 最常见原因？
    options:
    - 模型太旧
    - 工具描述重叠、模糊、缺「何时不用」
    - 网络问题
    answer: 1
    explain: 描述决定第 1 步理解任务是否跑偏。
  - q: 异常注入测试的做法？
    options:
    - 等线上出事
    - 故意喂坏输入，验证按声明失败
    - 只测正常路径
    answer: 1
    explain: 失败方式是被设计出来的——体面失败学。
  - q: Skill 边界声明对应词典里的？
    options:
    - RAG
    - Guardrails（护栏）
    - Token
    answer: 1
    explain: 什么不接、坏了怎么坏——护栏的朴素版。
  - q: 你的 Skill 在 Harness 里是什么？
    options:
    - 模型
    - 工具表上的一件工具
    - 记忆模块
    answer: 1
    explain: Day 7 造工具，Day 8 挂到 Agent 工具表上。
  - q: Agent 闭环演示验收？
    options:
    - 有回复即可
    - 自然语言 → 正确调用 Skill → 产出过验收
    - 必须无人值守
    answer: 1
    explain: 理解、选型、执行、验收四步全绿。
  - q: 「硬撑乱做」的正确处理？
    options:
    - 算过
    - 回炉改边界，直到按声明失败
    - 换模型
    answer: 1
    explain: 胡编产出比拒绝执行危险十倍。
  - q: Copilot 和 Agent 的区别？
    options:
    - 没区别
    - Copilot 递扳手；Agent 定目的地它开
    - Copilot 更贵
    answer: 1
    explain: 信任要求与验收方式完全不同。
  - q: ai-tutor.yaml 对应 Agent 的什么？
    options:
    - 工具表
    - 角色/人格/规则（Agent 定义）
    - 记忆模块
    answer: 1
    explain: 你早就在造 Agent——今天只是掀引擎盖。
  - q: GATE 8 对 Skill v1 的硬门槛是？
    options:
    - 只要 Prompt 更长
    - 有边界声明，且 ≥3 种坏输入均按声明失败
    - 必须上多 Agent 框架
    answer: 1
    explain: 工程化验收看声明与注入，不看「感觉稳」。
  - q: Harness「记忆」要素主要解决什么？
    options:
    - 换更大显卡
    - 跨步保留上下文，避免每轮从零猜任务状态
    - 替代工具表
    answer: 1
    explain: 四要素缺一不可——没记忆的循环只会原地打转。
