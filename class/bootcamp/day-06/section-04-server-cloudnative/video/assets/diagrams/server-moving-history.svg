<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="服务器二十五年五次搬家">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">二十五年，搬了五次家</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">25 YEARS · 5 MOVES</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="104" width="160" height="80" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="140" y="136" font-size="14" font-weight="800" fill="#231f20" text-anchor="middle">物理机</text>
<text x="140" y="160" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2000s</text>
</g>
<path d="M226 144 L250 144" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="256" y="104" width="160" height="80" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="336" y="136" font-size="14" font-weight="800" fill="#231f20" text-anchor="middle">虚拟机</text>
<text x="336" y="160" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2000s末</text>
</g>
<path d="M422 144 L446 144" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="452" y="104" width="160" height="80" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="532" y="136" font-size="14" font-weight="800" fill="#231f20" text-anchor="middle">容器</text>
<text x="532" y="160" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2013+</text>
</g>
<path d="M618 144 L642 144" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="648" y="104" width="160" height="80" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="728" y="136" font-size="14" font-weight="800" fill="#231f20" text-anchor="middle">Kubernetes</text>
<text x="728" y="160" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2014+</text>
</g>
<path d="M814 144 L838 144" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="836" y="96" width="176" height="96" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="844" y="104" width="160" height="80" rx="16" fill="url(#tlg)" filter="url(#glow)"/>
<text x="924" y="136" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Serverless</text>
<text x="924" y="160" font-size="10" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2015+</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="170" y="226" width="700" height="44" rx="22.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="252.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">你写的程序要让大家用，就得搬到一台一直开着的电脑上——这趟搬家史先走一遍</text></g>
</svg>
