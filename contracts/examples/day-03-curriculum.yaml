- id: domain-packs
  title: 第一周领域包
  kind: doc
  summary: 财务、HR、经营问题闭环三个基线，也可迁移到自己的专业方向
  url: /course-assets/teaching/week1-command-team/Week1_Domain_Packs.md
learn:
  lingzhi_tags:
  - camp:v0.7
  - day:3
  - project:role-week
  estimated_minutes: 130
  require_capsules: true
  capsules:
  - id: c1
    title: 先看地图：一条数据如何穿过整个系统
    minutes: 20
    form: 认知+实操
    content_ref: class/bootcamp/day-03/section-01-frontend-in-ai-era/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：后端不是看不见的魔法，它接收前端请求、执行规则、读写数据库，再把结果返回页面。


      请记住三件事。


      「完整链路：提交页 → 请求 → 后端校验 → SQLite → 列表/详情 → 统计接口 → 驾驶舱。」


      「每一段都要有真实文件或运行证据。」


      「AI 是第二周新增的一段能力，不是第一周数据链路的替代品。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：让通用 AI 只读当前项目并画出证据地图，不修改代码。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：docs/D3-L1_项目地图.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 用户提交一条记录后，数据首先由谁接收并校验？
      - &id001
        - 驾驶舱图表
        - 后端接口
        - README
      - 1
      - 前端发请求，后端执行规则并写入数据库。
    - - 看板数字的可信证据是什么？
      - &id002
        - 颜色好看
        - 能与列表和数据库记录核对
        - Agent 说正确
      - 1
      - 统计结果必须可追溯。
    local_prep:
      codex_prompt: 请只读当前工作区，创建 docs/D3-L1_项目地图.md：列出业务需求、前端、后端、数据库、测试部署、AI 预留六部分的证据路径和当前状态，并画出“提交 → 接口 → SQLite → 列表/详情 →
        统计 → 驾驶舱”的数据链路。AI 部分明确写“Week2 待接入”。不要修改代码。
      checklist:
      - 六部分都有真实证据路径
      - 数据链路能从用户操作讲到看板更新
      - Mock 与真实数据状态区分清楚
      - AI 标记为 Week2
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 把 PRD 字段翻译成 SQLite 表
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-03/section-02-design-spec/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：建表不是后端自由发挥，而是把同一份业务字段翻译成可存储、可约束的数据结构。


      请记住三件事。


      「字段、类型、必填和状态枚举以 PRD 为准。」


      「主键负责唯一识别，创建/更新时间负责追溯。」


      「发现不一致先回到已批准需求，不偷偷加字段。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：指挥后端建表，并要求他用业务语言解释每个字段。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：数据库与字段说明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 数据库字段的上游依据是什么？
      - &id003
        - PRD 字段清单和接口契约
        - 页面配色
        - 测试报告
      - 0
      - 数据结构要保持跨岗位一致。
    - - 状态为什么不宜任意输入？
      - &id004
        - 会让统计和流程判断混乱
        - 会让页面变慢
        - 会让按钮变色
      - 0
      - 受控枚举能保证业务状态一致。
    local_prep:
      codex_prompt: '@后端工程师 Agent 请按 docs/PRD.md 的字段清单和已批准的 docs/D2-L4_接口契约.md 建立 SQLite 数据表/模型。字段、类型、必填和状态枚举必须一致，并加入主键、创建时间和更新时间。

        完成后创建 docs/D3-L2_数据表说明.md，用业务语言逐字段解释；列出你实际执行的建表验证，以 REVIEW 状态交付。'
      checklist:
      - 字段与 PRD 和契约一致
      - 状态值受约束
      - 有主键和时间字段
      - 数据库真实创建且能被程序访问
      - 学员能复述核心字段
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 实现真实业务接口与统计
    minutes: 30
    form: 实操
    content_ref: class/bootcamp/day-03/section-03-web-prompt-anatomy/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：真实后端的判据不是生成了代码，而是请求真的写入数据库、读得出来，并且非法输入被拒绝。


      请记住三件事。


      「严格按契约实现四个业务接口。」


      「后端再次校验必填、类型和范围。」


      「看板统计必须按数据库真实记录聚合。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：用实际请求演示提交一条、查询它、打开详情并看到统计变化。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：提交、列表、详情、看板统计接口
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 生成了接口代码是否等于接口完成？
      - &id005
        - 是
        - 否，还要用真实请求验证数据库读写和错误响应
        - 只要不报错就是
      - 1
      - 运行证据才是完成依据。
    - - 看板统计能否写死？
      - &id006
        - 能
        - 不能，必须由真实记录聚合
        - 演示时可以不标
      - 1
      - 写死数字不能反映业务变化。
    local_prep:
      codex_prompt: '@后端工程师 Agent 请按 docs/D2-L4_接口契约.md 实现提交、列表、详情和看板统计四个 Week1 业务接口，真实读写 SQLite。后端必须再次执行 PRD 的业务校验，错误按契约返回；统计接口只能按数据库真实记录聚合。

        请用实际请求演示：提交一条 → 列表查到 → 详情查到 → 看板统计变化，并把请求与响应证据写入 docs/D3-L3_接口验证.md。完成后以 REVIEW 状态交付。'
      checklist:
      - 四个接口与契约一致
      - 非法输入被后端拒绝
      - 数据真实写入 SQLite
      - 统计与记录可核对
      - 验证文档含真实请求响应
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 为第二周保留真实 AI 接入口
    minutes: 20
    form: 实操+交接
    content_ref: class/bootcamp/day-03/section-04-hands-on-prototype/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：分期开发要诚实：接口可以先定义，但没有接模型就必须明确返回未接入，不能用固定文字冒充 AI。


      请记住三件事。


      「预留接口保持契约形状。」


      「第一周 返回 501 AI_NOT_CONNECTED 或等价明确状态。」


      「交接文档写清第二周 Agent 的输入、输出和写回位置。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：实现诚实的占位接口，并检查详情页展示边界。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：AI 预留接口 + Week2 交接文档
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 固定分析文案为什么不能冒充 AI？
      - - 字数不够
        - 来源不真实，会误导用户和验收
        - 颜色不对
      - 1
      - 系统必须诚实说明能力状态和数据来源。
    - - 预留接口的价值是什么？
      - - 提前伪装功能完成
        - 为第二周接入定义稳定边界
        - 代替数据库
      - 1
      - 先稳定契约，后续能力可以在边界内接入。
    local_prep:
      codex_prompt: '@后端工程师 Agent 请实现 docs/D2-L4_接口契约.md 中的 AI 分析预留接口。Week1 不调用任何模型：返回 501 AI_NOT_CONNECTED 和“AI 能力将在 Week2
        接入”的说明，不得返回固定分析文案。

        同时创建 docs/D3-L4_Week2_AI交接.md，写清第二周 Agent 读取哪些业务字段、返回什么结构、结果写回哪里以及必须人工确认的边界。完成后自检并等待我验收。'
      checklist:
      - 预留接口不调用模型
      - 返回明确未接入状态
      - 页面样例仍标演示数据
      - 交接文档写清输入输出与人工确认
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 前端切真接口：主持第一次完整联调
    minutes: 35
    form: 实操+验收
    content_ref: class/bootcamp/day-03/section-05-accept/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：联调不是两个 Agent 互相说完成，而是学员按契约分段验证：接口有数据、前端请求正确、页面显示正确。


      请记住三件事。


      「业务 Mock 必须移除或隔离。」


      「完整走提交、SQLite、列表、详情和看板更新。」


      「遇到问题先查契约，再判断由前端还是后端修复。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：指挥前端切换真实 API，学员亲手走完整业务流程并记录证据。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent + 学员亲测'
      note: 本节交付：真实数据全链路 V0.8 + 冒烟记录
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 前端切换真实接口后首先怎样定位空白页？
      - - 重写项目
        - 先直接请求接口，再检查前端参数和渲染
        - 换颜色
      - 1
      - 分段验证可以判断问题在哪一层。
    - - 谁有权宣布全链路通过？
      - - 任一 Agent
        - 亲自执行验收的学员
        - 代码生成工具
      - 1
      - 验收权始终在学员。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请把驾驶舱、提交、列表、详情四页的业务数据源从 Mock 切换到 docs/D2-L4_接口契约.md 的真实接口。AI 样例可以保留，但必须标“演示数据”，标题保持“AI 分析区｜Week2
        接入”。

        切换后请创建 docs/D3_冒烟记录.md 空表。我会亲自验证：启动 → 提交一条 → SQLite 保存 → 列表出现 → 详情正确 → 看板统计更新。请按我发现的问题修复，不要仅凭代码检查宣布联调完成。'
      checklist:
      - 业务数据不再来自 Mock
      - 提交到看板更新全链路通过
      - 冒烟记录每步有证据
      - AI 边界仍然诚实
      - 发现的问题按契约定位并复验
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
