day: 3
project: 真实数据保存、读取和完整流程
project_brief: 学员先用自己的项目看懂前端、后端和数据库的数据链路，再指挥后端按已批准契约建表和实现真实接口，最后让前端从 Mock 切换到真实 API。AI 只保留 Week2 入口。
resources:
- id: team-prompts-v11
  title: 七岗位 AI 员工提示词包
  kind: download
  summary: 七名 AI 员工的职责、交接方法和五天协作规则
  url: /course-assets/resources/prompt-toolkit/FDE_TRAE_Agent_Prompts_V1.1/00_README.md
- id: week1-day3-source
  title: 第一周第 3 天课程合约
  kind: doc
  summary: 本日五节课、交付物、岗位交接与验收口径
  url: /course-assets/bootcamp/day-03/README.md
- id: domain-packs
  title: 第一周领域包
  kind: doc
  summary: 财务、员工管理、经营问题三个参考方向，也可选择自己的专业方向
  url: /course-assets/teaching/week1-command-team/Week1_Domain_Packs.md
capsule_extra:
  c1:
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：docs/D3-L1_项目地图.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id001
      - 用户提交一条记录后，数据首先由谁接收并校验？
      - - 驾驶舱图表
        - 后端接口
        - README
      - 1
      - 前端发请求，后端执行规则并写入数据库。
    - &id002
      - 看板数字的可信证据是什么？
      - - 颜色好看
        - 能与列表和数据库记录核对
        - Agent 说正确
      - 1
      - 统计结果必须可追溯。
  c2:
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：数据库与字段说明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id003
      - 数据库字段的上游依据是什么？
      - - PRD 字段清单和接口契约
        - 页面配色
        - 测试报告
      - 0
      - 数据结构要保持跨岗位一致。
    - &id004
      - 状态为什么不宜任意输入？
      - - 会让统计和流程判断混乱
        - 会让页面变慢
        - 会让按钮变色
      - 0
      - 受控枚举能保证业务状态一致。
  c3:
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：提交、列表、详情、看板统计接口
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id005
      - 生成了接口代码是否等于接口完成？
      - - 是
        - 否，还要用真实请求验证数据库读写和错误响应
        - 只要不报错就是
      - 1
      - 运行证据才是完成依据。
    - &id006
      - 看板统计能否写死？
      - - 能
        - 不能，必须由真实记录聚合
        - 演示时可以不标
      - 1
      - 写死数字不能反映业务变化。
  c4:
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@后端工程师 Agent'
      note: 本节交付：AI 预留接口 + Week2 交接文档
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 固定分析文案为什么不能冒充 AI？
      - - 字数不够
        - 来源不真实，会误导用户和验收
        - 颜色不对
      - 1
      - 系统必须诚实说明能力状态和数据来源。
    - - 预留接口的价值是什么？
      - - 提前伪装功能完成
        - 为第二周接入定义稳定边界
        - 代替数据库
      - 1
      - 先稳定契约，后续能力可以在边界内接入。
  c5:
    resource_ids:
    - team-prompts-v11
    - week1-day3-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent + 学员亲测'
      note: 本节交付：真实数据全链路 V0.8 + 冒烟记录
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 前端切换真实接口后首先怎样定位空白页？
      - - 重写项目
        - 先直接请求接口，再检查前端参数和渲染
        - 换颜色
      - 1
      - 分段验证可以判断问题在哪一层。
    - - 谁有权宣布全链路通过？
      - - 任一 Agent
        - 亲自执行验收的学员
        - 代码生成工具
      - 1
      - 验收权始终在学员。
