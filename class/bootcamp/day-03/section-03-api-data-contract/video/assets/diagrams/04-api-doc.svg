<text x="392" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">返回 ←</text>
<text x="440" y="224" font-family="'SF Mono',Menlo,monospace" font-size="12.5" fill="#231f20">{ "value", "delta", "unit" }</text>
<rect x="360" y="241" width="64" height="22" rx="11" fill="rgba(13,148,136,.09)"/>
<text x="392" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">出错 ✗</text>
<text x="440" y="256" font-family="'SF Mono',Menlo,monospace" font-size="12.5" fill="#231f20">{ "code", "message" }</text>
</g>
<rect x="40" y="326" width="960" height="38" rx="19.0" fill="rgba(13,148,136,.09)"/>
<text x="520.0" y="349.86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">契约先于实现：先定 JSON，前后端再各干各的</text>
<text x="520" y="396" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="rgba(35,31,32,.55)">改契约的代价 = 前后端一起改 + 一起重新验收 —— 所以 Day 3 第一件事是定契约</text>
</svg>
