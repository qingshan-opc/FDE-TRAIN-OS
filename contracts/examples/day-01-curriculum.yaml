    - id: clarify-one-by-one
      term: 逐题澄清
      plain: 产品经理一次只问一个问题，学员回答后先复述确认，再进入下一题。
      tag: 对话
    - id: requirement-gate
      term: 需求确认闸
      plain: 学员回复“确认需求”前，产品经理不能生成正式 PRD。
      tag: 责任
    - id: prd-handoff
      term: PRD 交接
      plain: PRD 把领域问题、目标用户、功能范围和验收标准交给 UI 继续工作。
      tag: 交接
    glossary_terms:
    - id: gt-prd
      term: PRD
      plain: 产品需求文档，是产品经理与下游岗位共同使用的开工依据。
    - id: gt-acceptance-criteria
      term: 验收标准
      plain: 能让不同的人得出同一“通过/不通过”结论的检查条件。
  - id: c6
    title: 交接 UI 生成原型，再回产品经理验收
    minutes: 40
    form: 交接实操
    content_ref: class/bootcamp/day-01/section-06-ui-prototype-accept/lesson.md
    content: '同学们，来到 Day 1 最关键的一节。现在工作区已经有确认后的 `PRD.md`，产品经理这一棒完成了。接下来请你亲自点击当前岗位，切换到 `@UI`。这个动作不是换一个聊天风格，而是在做真实交接：上一个岗位把文件放在工作区，下一个岗位读取文件继续工作。


      先回顾 UI 的变化。传统 UI 会花大量时间画线框、做视觉稿、调整颜色和组件；AI 时代，原型可以快速生成，UI 更重要的职责是信息层级、操作路径和设计约束。用户第一眼看什么，最常用操作在哪里，加载、空数据和错误时怎么办，这些判断不能只靠一句“做得高级一点”。


      切到 UI 后，第一句话不是“帮我生成页面”，而是“请读取 `PRD.md`，先用五句话复述需求”。要求它说清目标用户、核心问题、主要操作、页面范围和验收标准，然后停下来等你确认。如果它读不到文件，就不要让它猜，先检查文件是否在工作区根目录。


      为什么要复述？因为文件交接成功不等于理解成功。比如 PRD 写的是给财务负责人看预算异常，UI 可能误解成给普通员工报销；PRD 写的是电脑端看板，UI 可能默认做成手机应用。五句话复述能用最低成本发现偏差。理解不一致时，先改理解，不要急着生成。


      你确认需求理解一致后，再让 UI 一次只问一个设计问题。先问主要使用设备，再问首页最重要的信息，然后是页面风格、主色、最常用操作，以及加载、空数据和错误状态。每题让它给一个推荐答案和理由，但最终选择由你做。你不是在考色彩理论，而是在确认设计是否适合真实工作场景。


      这里要特别关注三种容易被忽略的状态。第一，加载中：数据还没回来，页面告诉用户正在处理；第二，空数据：没有结果时解释为什么为空、下一步能做什么；第三，错误状态：接口失败时诚实提示，而不是留一块白屏。AI 很容易生成一张只有理想数据的漂亮页面，成熟
      UI 要考虑真实世界不顺利的时候。


      问题完成后，先让 UI 展示页面结构和用户操作路径。比如首页有四个区块，点击异常费用进入详情，再按部门筛选。此时仍不要生成最终原型。你要拿 `PRD.md` 对照：每个核心功能有没有页面承载，有没有多出未确认功能，用户能不能走完最重要的一条流程。确认后回复“确认页面方案”。


      页面方案通过后，要求 UI 生成三个文件：`design-spec.md`、`ui-flow.md` 和 `ui-prototype.html`。原型使用演示或脱敏数据，不连接真实后端。生成结束后，在工作区找到 HTML 文件并直接打开。不要只看
      AI 的文字说明，要亲手点击按钮、切换筛选项、观察是否有反馈。


      传统的软件团队里，UI 可能把设计稿发给产品经理评审；AI 时代速度更快，但评审不能省。现在请你从 `@UI` 切换回 `@产品经理`。注意，我们不是让 UI 自己说“我做得很好”，也不是让通用 Agent 随便点评，而是让最初确认需求的岗位拿着同一份
      PRD 做业务验收。


      给产品经理的任务要非常明确：读取 `PRD.md`、设计规范、交互流程和原型，逐项输出“通过或不通过、对应哪条原始需求、责任岗位是谁”。要求它只检查，不直接修改 UI 文件。产品经理发现页面少了一个功能，应把问题交回 UI；如果发现
      PRD 本身遗漏了业务规则，才回到产品经理需求阶段补充并重新确认。


      假设产品经理指出“招聘超期岗位没有红色提醒”，PRD 里明确要求超过七天标红。你就切回 `@UI`，只把这一条问题和 PRD 依据交给它修改。修改完成，再回 `@产品经理` 复验。这个往返可能看起来麻烦，但它建立了真实的软件责任链：谁发现、谁修改、谁复验，都能说清。


      全部通过后，创建 `day1-handoff-log.md`。写下三次切换：产品经理交付了什么给 UI，UI 交付了什么，产品经理最终验收结果是什么；如果发生过修改，再写一行问题和复验结果。这份日志不是形式主义，它证明你已经亲自走过一次岗位协作，而不是只看
      AI 在一个窗口里自说自话。


      今天到这里，你已经完成了一个非常重要的跨越。早上你可能还觉得软件开发是一堵代码墙，现在你已经知道项目从专业问题开始，产品经理把问题变成需求，UI 把需求变成体验，结果还要回到需求负责人验收。后续前端、后端、测试和运维会把这个原型逐步变成真实系统，但工程结构今天已经在你脑子里建立起来了。


      最后带走一句话：工具可以换，模型可以换，软件工程的岗位、交接物和验收闭环不会消失。以后面对任何 AI 开发工具，先问当前是谁、上游文件是什么、这一步交付什么、下一步给谁、谁来验收。能回答这五个问题，你就不再是被 AI 牵着走的小白，而是在指挥
      AI 团队的领域项目负责人。'
    practice: '完成标志：

      [ ] UI 先复述需求、后确认设计、再生成原型

      [ ] 三个 UI 交付文件都存在，HTML 可直接打开并能交互

      [ ] 已回到产品经理按 PRD 验收

      [ ] 至少完整演练一次“发现问题 → UI 修改 → 产品经理复验”，没有问题时由导师指定一条模拟缺口

      [ ] `day1-handoff-log.md` 清楚记录完整闭环'
    resource_ids:
    - agent-ui
    - agent-pm
    quiz:
    - - UI 完成原型后，为什么要回到 @产品经理验收？
      - - 因为产品经理最会写代码
        - 因为需求负责人应按原始目标检查交付，避免 UI 自己验收自己
        - 因为测试岗位不需要存在
      - 1
      - 产品经理代表需求与业务目标，必须检查原型是否真正回应已经确认的 PRD。
    - - 产品经理发现原型不符合 PRD，正确流程是什么？
      - - 产品经理直接修改 UI 文件
        - 切回 @UI 按问题清单修改，再回 @产品经理复验
        - 删除 PRD 重新选题
      - 1
      - 责任岗位负责修改，需求岗位负责验收；循环直到原需求和原型一致。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '本节包含三次岗位切换。不要一次把所有任务发给同一个智能体。


        【第 1 段｜切换 @UI 并复述需求】

        切换到 @UI，发送：请读取 PRD.md。先用 5 句话复述目标用户、核心问题、主要操作、页面范围和验收标准。现在不要生成原型，等我确认理解一致。


        【第 2 段｜UI 逐题确认设计】

        我确认需求理解一致。请一次只问 1 个设计问题，依次确认主要使用设备、首页最重要信息、页面风格、主色、最常用操作，以及加载/空数据/错误状态。每题给推荐示例，等我回答后再继续。


        【第 3 段｜UI 生成交付物】

        请先展示页面结构和操作路径，等我回复“确认页面方案”后，再生成 design-spec.md、ui-flow.md 和可直接打开的 ui-prototype.html。只用演示数据，不连接真实后端。


        【第 4 段｜回到 @产品经理验收】

        切换回 @产品经理，发送：请读取 PRD.md、design-spec.md、ui-flow.md 和 ui-prototype.html，按原始需求逐条输出“通过/不通过、对应需求、责任岗位”。不要直接修改 UI 文件。


        【第 5 段｜不通过时迭代】

        如有不通过项，切回 @UI，只处理产品经理列出的问题；完成后再次回到 @产品经理复验。全部通过后，把三次切换和验收结果写入 day1-handoff-log.md。

        '
      checklist:
      - UI 已先复述 PRD，学员确认后才开始设计
      - 工作区存在 design-spec.md、ui-flow.md、ui-prototype.html
      - ui-prototype.html 可直接打开并产生可见交互
      - 已切换回 @产品经理按 PRD 验收
      - 不通过项已回到 @UI 修改并完成复验
      - day1-handoff-log.md 记录了岗位、输入、输出和验收结果
      suggested_questions:
      - UI 没读 PRD 就直接生成页面怎么办？
      - 原型可以使用真实公司数据吗？
      - 产品经理和 UI 对需求理解不一致怎么办？
      template_resource_id: agent-ui
    media:
    - kind: video
      title: 口播课件 · UI 原型交接与产品验收
      object_key: documents/shared/course-media/day01-c6-ui-prototype-accept.mp4
      poster_key: documents/shared/course-media/day01-c6-ui-prototype-accept-poster.jpg
      duration_sec: 346
    knowledge_cards:
    - id: ui-handoff
      term: UI 交接
      plain: UI 先读取并复述 PRD，学员确认理解一致后才设计页面。
      tag: 交接
    - id: interactive-prototype
      term: 交互原型
      plain: 能点击并看到页面反馈、但尚未连接真实后端的产品体验样品。
      tag: 产出
    - id: return-to-pm
      term: 回到产品经理验收
      plain: UI 完成后重新切换 @产品经理，按最初需求逐条检查，而不是让 UI 自己验收自己。
      tag: 闭环
    glossary_terms:
    - id: gt-design-spec
      term: Design Spec · 设计规范
      plain: 记录颜色、字体、间距、组件和各种页面状态的设计说明。
    - id: gt-iteration
      term: 迭代
      plain: 根据验收发现的问题回到责任岗位修改，再重新验收。
quiz:
  pass_rate: 0.67
  questions:
  - q: AI 项目中，领域专业学员最不可替代的价值是什么？
    options:
    - 手写所有代码
    - 提供真实业务判断并确认验收标准
    - 记住所有框架名称
    answer: 1
    explain: AI 能生成技术产物，但真实业务问题、数据含义、取舍和合格标准需要领域人员负责。
  - q: 六岗位软件开发流程的正确顺序是？
    options:
    - 产品经理→UI→前端→后端→测试→运维
    - UI→运维→产品经理→测试→后端→前端
    - 后端→产品经理→运维→UI→测试→前端
    answer: 0
    explain: 本课程使用产品经理、UI、前端、后端、测试、运维的顺序，最终再回产品经理做业务验收。
  - q: AI 时代产品经理相较传统产品经理，哪项能力变得更重要？
    options:
    - 整理更多格式文档
    - 定方向、确认范围并按标准验收
    - 代替前端写页面
    answer: 1
    explain: AI 降低文档制作成本后，产品经理的价值更集中在方向、取舍和验收责任。
  - q: 为什么岗位之间要使用工作区文件交接？
    options:
    - 为了增加文件数量
    - 为了让需求和决策可读取、可复查、可验收
    - 因为 TRAE 不能对话
    answer: 1
    explain: 文件让每个岗位看到同一版本的事实，减少口头转述和上下文丢失。
  - q: 下面哪个项目更符合 Day 1 选题原则？
    options:
    - 做一个无所不能的企业平台
    - 为财务负责人展示预算执行和异常费用
    - 一天内重建全国物流网络
    answer: 1
    explain: 合格选题来自熟悉领域，用户和问题明确，并能先用可视化原型验证。
  - q: UI 原型完成后的正确下一步是什么？
    options:
    - 直接宣布项目上线
    - 回到 @产品经理按 PRD 验收，不通过再交回 @UI
    - 让 UI 自己判断是否合格
    answer: 1
    explain: 需求负责人必须回看最初目标并验收，形成“交付—检查—修改—复验”的工程闭环。
