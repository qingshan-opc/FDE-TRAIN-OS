</g>
<path d="M191 222 L203 222" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="0.9s" repeatCount="indefinite"/></path>
<rect x="206" y="118" width="148" height="208" rx="18" fill="#fff" filter="url(#sh)" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.30s" dur="0.5s" fill="freeze"/></rect>
