<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="软件六站固定动作">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">不是灵感一闪，是六站固定动作</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">SDLC · SIX STATIONS</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="48" y="100" width="140" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="118" y="132" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">01</text>
<text x="118" y="156" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">调研</text>
</g>
<path d="M194 138 L207 138" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="213" y="100" width="140" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="283" y="132" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">02</text>
<text x="283" y="156" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">原型</text>
</g>
<path d="M359 138 L372 138" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="378" y="100" width="140" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="448" y="132" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">03</text>
<text x="448" y="156" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">开发</text>
</g>
<path d="M524 138 L537 138" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="543" y="100" width="140" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="613" y="132" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">04</text>
<text x="613" y="156" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">验收</text>
</g>
<path d="M689 138 L702 138" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="708" y="100" width="140" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="778" y="132" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">05</text>
<text x="778" y="156" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">上线</text>
</g>
<path d="M854 138 L867 138" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="865" y="92" width="156" height="92" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="873" y="100" width="140" height="76" rx="16" fill="url(#tlg)" filter="url(#glow)"/>
<text x="943" y="132" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">运维迭代</text>
<text x="943" y="156" font-size="10" fill="rgba(255,255,255,.85)" text-anchor="middle">回到第一站</text>
</g>
<path d="M943 184 C943 240 118 240 118 180" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="1.1s" repeatCount="indefinite"/></path><path d="M118 176 L111 188 L125 188 Z" fill="#0d9488"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="236" width="600" height="42" rx="21.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="261.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">你手机里每个 App，从一句「我想要」到每天打开用，都走过这几站</text></g>
</svg>
