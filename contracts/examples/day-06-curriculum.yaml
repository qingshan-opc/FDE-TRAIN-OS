  - id: c3
    title: 软件是怎么开发出来的：流程与需求调研
    minutes: 25
    form: 概念
    content_ref: class/bootcamp/day-06/section-03-how-software-built/lesson.md
    content: '同学们，上节咱们把 AI 时代的背景概念过了一遍。大家有没有发现一件事——不管是早期的 AI，还是你们现在天天用的 AI，它都离不开一样东西：软件，你现在用的一系列ai工具，claude，gpt本质都是软件、大模型也是运行的GPU集群的一种软件。所以软件呢，不是灵感一闪就写完的，它是一套工程化的固定动作。这节课，咱们就讲：软件到底是怎么开发出来的——从用户有问题，到大家能用、还能继续改，中间要过哪几站。

      第一站，叫需求调研。说白了，就是把用户的期望梳理出来，再拿回去问、再沟通——不对就改，改完再问——反复，直到这件事说清楚。它不是开一次会就结束，是反复沟通。本质就一句话嘛：解决用户的问题。用户抛问题，咱们给方案，方案不对就继续改。


      举个食堂的例子。你想知道什么菜难吃——别只问炒菜阿姨，她未必直说。你看食堂每天倒掉什么，剩得多的，就是难吃的。这叫观察，行为比嘴诚实，对吧。


      再举办公室的例子。有的公司一个月十张 Excel，一年就是一百二十张——本地管起来很痛苦。把表里的信息抽出来，做成系统、落进数据库，能跨库查、能多人协作。本质是啥呢？给用户省时间。调研常用的还有访谈、问卷、竞品体验——问上一次怎么处理的，别只问好不好。

      第二站，原型确认。需求说清楚了，还不能直接开写。系统长什么样？用户每天打开后台，把以前的数据传上去——这套工作流是不是这样？更要盯住：解决了什么问题。不用各建本地文件、能多人协作、有权限的人能共享同一份数据——不用再跑去同事电脑里翻。这一步也是跟客户持续确认，拿样板间——线框图、能点的假页面——改到满意才进开发。记住啊：改一张图十分钟，改写好的程序可能十天，改图便宜，改程序贵，同理在ai时代也是如此，如果没有明确的确认需求，后续通过vibe
      coding去修复，本质上就是浪费算力，也就是token成本变高，对吧。

      接下来第三、第四站，开发和测试验收，日常里往往缠在一起。怎么干呢？你描述需求，让 AI 写，你再验收。不过就反馈、再验——直到系统完善。开发和验收，都算把程序做对这一大段。你们每天的 Rubric 过闸，就是最小化的测试验收：照单子验货，不是我觉得行，对吧。

      再往后是上线：把服务部署出去——可能是 App、小程序，或者 Web 网站——客户才能真的用上。大企业呢，中间往往还隔一站，叫 UAT，用户验收测试。搭一套模拟生产的环境，接入他们的部分真实数据，让业务方用一段时间，根据反馈再调，然后才正式上线。中小项目可以简化，但要知道大企业为什么这么做——他们怕一上去就翻车嘛。

      上线之后是持续迭代。客户常会再签一笔运维合同——咱们收集使用中的问题，修缺陷、做约定范围内的优化。但这里有条边界必须划清：运维不等于新功能开发。运维可以修 bug、优化体验；严格不按再做一个大功能来理解。客户又想出来一个新想法，那是新需求、新项目，另开调研和报价——别跟运维混为一谈。边界清楚，合作才不打架。

      六站怎么走，还有两种节奏。瀑布呢，像装修前先画好整栋楼的图纸，再一口气装完——适合需求铁定不变的事，比如航天软件；坏处是半年后才住进去，厨房不顺手也木已成舟。敏捷呢，像一周装修一间房，住进卧室再决定厨房怎么装——把大事切成小块，每块都快速走完六站、交付一个能用的东西。你们前四天就是敏捷：每天一个小交付，每天一次验收。敏捷不是不写文档随便来，恰恰是验收做得更频繁。

      好，本节小课就到这里了，收个尾。带走三句话：软件开发，先搞清问题、对齐样子，再让 AI 写、你来验；上线之后，修问题和做新功能是两笔账；六站可以瀑布一次走完，也可以敏捷小步快跑——你们已经在用敏捷了。流程不是背出来的名词，你们已经用身体走过一遍了。下一节，咱们继续往下挖。'
    practice: '**「一次迷你需求调研」**：找一位同事或家人，访谈 5 分钟，主题是「你每天工作中最烦的一件重复性小事」。要求：

      - 只问「上一次……是什么时候、你怎么处理的」，不问「你想不想要某个功能」；

      - 记下三行：他的角色、最近一次的具体场景、他现在的凑合办法；

      - 最后用一句话写出你发现的问题（格式：「谁在什么场景下被什么问题折磨，现在靠什么凑合」）。


      完成标志：

      [ ] 六站顺序能不看笔记背出

      [ ] 访谈记录有三行（角色 / 具体场景 / 凑合办法），且包含一个「上一次」式回答

      [ ] 问题一句话里不出现解决方案，只有「谁 + 场景 + 痛 + 现状」'
    resource_ids:
    - dg-process
    - h5-journey
    tools:
    - name: 访谈提问句式卡
      note: 问「上一次…」，不问「好不好」
    quiz:
    - - 软件旅程六站的正确顺序是？
      - - 开发→需求调研→上线→验收
        - 需求调研→原型确认→开发→测试验收→上线→迭代
        - 原型→开发→调研→上线
      - 1
      - 先搞清楚做什么，出样品，做出来，验货，放出去，再回来改。
    - - 访谈用户时，最该问的是？
      - - 你觉得这个功能好不好
        - 上一次你遇到这个问题是什么时候、怎么处理的
        - 你愿意为这个产品付多少钱
      - 1
      - 人对「好不好」会客气，对「上一次」不会撒谎——具体场景才是真话。
    - - 「想知道食堂什么菜难吃，别问卷，看他倒掉什么」对应哪种调研方法？
      - - 访谈
        - 观察
        - 竞品体验
      - 1
      - 观察：看行为不看表态——行为比嘴诚实。
    - - 为什么「先出原型再开发」能省钱？
      - - 原型更好看
        - 改一张图十分钟，改写好的程序十天
        - 原型可以卖钱
      - 1
      - 纠错的成本随阶段指数上涨——越早确认越便宜，这就是样板间逻辑。
    - - 瀑布和敏捷的区别，正确的是？
      - - 瀑布不写文档，敏捷写
        - 瀑布一次规划死再走完，敏捷切成小块每块都快速走完全流程
        - 敏捷不需要验收
      - 1
      - 全楼一次装修 vs 一周装一间房——你前四天每天一个交付就是敏捷。
    - - 你 Day 1 写 PRD.md，在六站里属于哪一站的产出？
      - - 测试验收
        - 需求调研
        - 上线
      - 1
      - PRD（用户故事+验收标准）就是需求调研的产出物。
    media:
    - kind: video
      title: 口播课件 · 软件是怎么开发出来的
