spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "fde-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
---
{{- if .Values.web.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
