day: 5
project: 产品复盘、本地交付、五分钟讲解和第一周验收
project_brief: 前四天先做后懂，第五天把自己的真实项目摊开，系统讲清需求、原型、前端、接口、数据库、测试和交付如何连接；随后由运维和项目经理协助完成本地交付、README、路演和综合验收。
resources:
- id: team-prompts-v11
  title: 七岗位 AI 员工提示词包
  kind: download
  summary: 七名 AI 员工的职责、交接方法和五天协作规则
  url: /course-assets/resources/prompt-toolkit/FDE_TRAE_Agent_Prompts_V1.1/00_README.md
- id: week1-day5-source
  title: 第一周第 5 天课程合约
  kind: doc
  summary: 本日五节课、交付物、岗位交接与验收口径
  url: /course-assets/bootcamp/day-05/README.md
- id: domain-packs
  title: 第一周领域包
  kind: doc
  summary: 财务、员工管理、经营问题三个参考方向，也可选择自己的专业方向
  url: /course-assets/teaching/week1-command-team/Week1_Domain_Packs.md
capsule_extra:
  c1:
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent'
      note: 本节交付：研发全流程图
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id001
      - 软件为什么不是一次提示词生成出来的？
      - - 模型速度不够
        - 需求、设计、实现和验证需要逐步交接与确认
        - 文件太多
      - 1
      - 逐步批准能控制范围和质量。
    - &id002
      - 学员在 AI 团队中的核心职责是什么？
      - - 手写全部代码
        - 方向、判断、验收和最终责任
        - 只负责观看
      - 1
      - AI 负责加速，学员负责决定与验证。
  c2:
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：一条可讲清的数据链路
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id003
      - 驾驶舱看板属于系统的哪一部分？
      - - 前端展示
        - 数据库
        - 测试报告
      - 0
      - 看板是用户看到的前端，但数据来自后端统计。
    - &id004
      - 支撑看板数字的最终事实在哪里？
      - - 按钮里
        - 数据库业务记录中
        - 口播稿里
      - 1
      - 数据库保存真实业务记录，统计接口据此计算。
  c3:
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@运维工程师 Agent'
      note: 本节交付：本地交付检查与运行证据
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id005
      - 本地能打开能否称为已上线？
      - - 能
        - 不能，最多说明可本地演示
        - 有截图就能
      - 1
      - 发布状态必须与实际部署事实一致。
    - &id006
      - 第一周为什么不教 Docker？
      - - Docker 没价值
        - 它会增加与课程目标无关的环境复杂度
        - AI 不会用
      - 1
      - 第一周聚焦研发逻辑和本地可交付。
  c4:
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：正式 README + 项目复盘 + 路演提纲
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id007
      - README 最重要的读者是谁？
      - - 刚写完代码的自己
        - 第一次接手项目的人
        - 只有 AI
      - 1
      - README 要让陌生接手者能够理解和运行。
    - &id008
      - 路演为什么从驾驶舱开始？
      - - 图表好看
        - 先展示管理价值，再用一条记录证明数据链路
        - 可以跳过后端
      - 1
      - 价值和证据要连在一起。
  c5:
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent + 学员演示'
      note: 本节交付：Week1 验收包与 Week2 交接
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id009
      - 第一周最重要的学习成果是什么？
      - - 记住某个框架
        - 能指挥 AI 团队并讲清产品如何逐步形成
        - 生成最多文件
      - 1
      - 工具会变，开发与验收逻辑可以迁移。
    - &id010
      - 第二周应该从哪里继续？
      - - 推翻第一周重做
        - 在预留接口接入 Skill、Agent 和真实 AI
        - 把演示数据改名为 AI
      - 1
      - 第一周业务系统是第二周智能化的地基。
