<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-label="Agent Lab 五步闭环">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <marker id="fs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="400" fill="#ffffff"/>
  <rect width="1040" height="400" fill="url(#dots)"/>
  <circle cx="970" cy="56" r="100" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="360" r="70" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="18" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="35" font-size="15" font-weight="800" fill="#231f20">Agent Lab 五步闭环</text>
    <text x="1004" y="35" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">FIVE-STEP LOOP</text>
  </g>

  <!-- five steps -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <g>
      <rect x="50" y="78" width="160" height="122" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <circle cx="76" cy="104" r="13" fill="rgba(35,31,32,.22)"/><text x="76" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'SF Mono',Menlo,monospace">1</text>
      <text x="130" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">线框</text>
      <text x="130" y="160" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">WIREFRAME</text>
      <text x="130" y="184" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">先画瞄准镜</text>
    </g>
    <g>
      <rect x="246" y="78" width="160" height="122" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <circle cx="272" cy="104" r="13" fill="rgba(35,31,32,.22)"/><text x="272" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'SF Mono',Menlo,monospace">2</text>
      <text x="326" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">Prompt</text>
      <text x="326" y="160" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">PROMPT</text>
      <text x="326" y="184" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">四要素任务书</text>
    </g>
    <g>
      <rect x="442" y="78" width="160" height="122" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <circle cx="468" cy="104" r="13" fill="rgba(35,31,32,.22)"/><text x="468" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'SF Mono',Menlo,monospace">3</text>
      <text x="522" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">生成</text>
      <text x="522" y="160" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">GENERATE</text>
      <text x="522" y="184" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">AI 产出工件</text>
    </g>
    <!-- hot step 4 -->
    <g>
      <rect x="630" y="70" width="176" height="138" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
        <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="638" y="78" width="160" height="122" rx="16" fill="url(#teal)" filter="url(#glow)"/>
      <circle cx="664" cy="104" r="13" fill="rgba(255,255,255,.28)"/><text x="664" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'SF Mono',Menlo,monospace">4</text>
      <text x="718" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">验收</text>
      <text x="718" y="160" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(255,255,255,.8)" font-family="'SF Mono',Menlo,monospace">ACCEPT</text>
      <text x="718" y="184" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.9)">Rubric 逐项过</text>
    </g>
    <g>
      <rect x="834" y="78" width="160" height="122" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <circle cx="860" cy="104" r="13" fill="rgba(35,31,32,.22)"/><text x="860" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'SF Mono',Menlo,monospace">5</text>
      <text x="914" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">迭代</text>
      <text x="914" y="160" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">ITERATE</text>
      <text x="914" y="184" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">Prompt 即源码</text>
    </g>

    <!-- forward arrows -->
    <g stroke="#0d9488" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="6 5">
      <line x1="214" y1="139" x2="240" y2="139" marker-end="url(#fs-arrow)">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="410" y1="139" x2="436" y2="139" marker-end="url(#fs-arrow)">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="606" y1="139" x2="632" y2="139" marker-end="url(#fs-arrow)">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="802" y1="139" x2="828" y2="139" marker-end="url(#fs-arrow)">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- iteration loop -->
    <path d="M914 202 L914 254 L326 254 L326 206" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fs-arrow)" opacity=".85">
      <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#0d9488">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M914 202 L914 254 L326 254 L326 206"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="620" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">验收不过 → 改 Prompt → 再来一轮</text>

    <!-- footer -->
    <text x="520" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">「验收不过」不是失败，是流程的正常一站</text>
    <text x="520" y="356" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">真正的失败是「我觉得还行」就点了交付</text>
  </g>
</svg>
