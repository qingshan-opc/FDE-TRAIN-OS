<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="上下文装配：这次调用放什么进模型视野">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <rect width="1040" height="470" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="422" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">上下文装配：这次调用放什么进模型视野</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">CONTEXT ASSEMBLY</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="50" y="76" width="270" height="300" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="185" y="106" font-size="13" font-weight="800" fill="#231f20" text-anchor="middle">原料仓（你的数据库）</text>
<rect x="70" y="124" width="230" height="38" rx="10" fill="rgba(35,31,32,.05)"/>
<text x="84" y="148" font-size="11.5" fill="rgba(35,31,32,.65)">本期 KPI 明细</text>
<rect x="70" y="172" width="230" height="38" rx="10" fill="rgba(35,31,32,.05)"/>
<text x="84" y="196" font-size="11.5" fill="rgba(35,31,32,.65)">上月同期对比</text>
<rect x="70" y="220" width="230" height="38" rx="10" fill="rgba(35,31,32,.05)"/>
<text x="84" y="244" font-size="11.5" fill="rgba(35,31,32,.65)">部门目标值</text>
<rect x="70" y="268" width="230" height="38" rx="10" fill="rgba(35,31,32,.05)"/>
<text x="84" y="292" font-size="11.5" fill="rgba(35,31,32,.65)">异常清单</text>
<rect x="70" y="316" width="230" height="38" rx="10" fill="rgba(35,31,32,.03)" stroke="rgba(35,31,32,.15)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="84" y="340" font-size="11.5" fill="rgba(35,31,32,.4)">全年原始日志（别放）</text>
</g>
<path d="M330 226 L380 226" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="390" y="140" width="260" height="180" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="520" y="172" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">装配台 · 上下文工程</text>
<text x="520" y="196" font-size="11" fill="rgba(35,31,32,.6)" text-anchor="middle">选什么 + 放多少</text>
<rect x="420" y="216" width="200" height="18" rx="9" fill="rgba(35,31,32,.08)"/>
<rect x="420" y="216" width="130" height="18" rx="9" fill="url(#bar)"><animate attributeName="opacity" values="1;.7;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="520" y="258" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">token 预算：窗口是上限，不是目标</text>
<text x="520" y="292" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">给少了瞎编 · 给多了迷失</text>
</g>
<path d="M660 226 L710 226" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="712" y="132" width="286" height="196" rx="28" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="720" y="140" width="270" height="180" rx="20" fill="url(#tlg)" filter="url(#glow)"/>
<text x="855" y="196" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">LLM</text>
<text x="855" y="226" font-size="10" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">只看得见你装配的</text>
<text x="855" y="272" font-size="12" fill="#fff" text-anchor="middle">输出：三段式摘要</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="150" y="396" width="740" height="60" rx="30.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="422.0" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">模型看不到你的数据库——它只看到装配台递过去的那一包</text>
<text x="520.0" y="442.0" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">摘要质量差，先查装配台：是不是该给的没给 / 不该给的塞太多</text></g>
</svg>
