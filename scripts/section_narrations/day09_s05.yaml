title: 第九天 · 第 5 节 · 闸口实测 + GATE 9
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 讲解图：agent-loop.svg
  - GATE 9：流水线拦不拦得住
  text: '同学们好，我是你们的老师404。GATE 9 今天考的就一件事：你的流水线拦不拦得住。我站闸口边看三样——到闸停不停、批了动不动、驳回了回不回得来。工具表三件、编排文档、执行日志，证据齐了咱们再口试，对吧。

    '
- id: 02-gate-demo
  ppt:
  - 眉题：02 GATE DEMO
  - 讲解图：skill-anatomy.svg
  - 现场跑流水线，导师闸口抽查
  text: '现场跑一遍流水线，确认界面信息够不够你做决策——不是发送吗？四个字，是草稿加关键数字加风险标红。挂了好，用排障速查现场修一次，修的过程本身就是加分；假装没挂，那才是真挂，咱们都懂。

    '
- id: 03-oral-three
  ppt:
  - 眉题：03 ORAL THREE
  - 讲解图：v2-panorama.svg
  - 口试三题：三问、三反模式、信任分级
  text: '口试三题都在课上讲过。你的闸——看什么、谁来看、多久看一次？确认闸形同虚设的三种死法是什么，你怎么避开？从每次都看到抽看，中间条件是什么——连续通过攒额度，抽看配定期审计。答不出信任分级路径，等于第二节白听，对吧。

    '
- id: 04-close
  ppt:
  - 眉题：04 TAKEAWAY
  - 讲解图：agent-loop.svg
  - 过了这关，手里是一条带刹车的 AI 流水线
  text: '同学们，本节先到这里。全绿才过：三件 Skill 齐、编排清楚、闸口实测、日志可回放，commit 信息也写规范。过了这关，你手里就是一条完整的、带刹车的 AI 流水线。明天收官，把它接上驾驶舱，然后你来讲给我听。

    '
