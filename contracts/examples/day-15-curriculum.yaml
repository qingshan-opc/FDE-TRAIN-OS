    answer: 1
    explain: 用真实任务验证“不值得用”或“确实不好用”。
  - q: 部门经理口头支持，却未安排人员和时间。应怎样记录？
    options: *id003
    answer: 1
    explain: 态度判断要依据行动证据。
  - q: 客户数据含手机号、合同条件和过期报价。最合适的试点数据是？
    options: *id004
    answer: 2
    explain: 数据需可授权、可用和可追溯。
  - q: 工具回答技术选型问题存在不确定性，正确机制是？
    options: *id005
    answer: 2
    explain: 高风险问题需要专业责任与兜底。
  - q: 老板要求三天全员上线，当前没有业务负责人。最佳回应是？
    options: *id006
    answer: 2
    explain: 管理速度预期并补责任机制。
  - q: 项目价值较高，但关键数据授权需要两周完成。建议？
    options:
    - 停止全部方向
    - 暂停敏感数据使用，以公开或脱敏样本做流程验证
    - 绕过授权
    - 伪造数据
    answer: 1
    explain: 可降级验证，同时守住权限。
  - q: 员工拒绝测试，原因是测试记录要重复录入两次。主要障碍是？
    options:
    - 纯沟通
    - 流程与利益成本
    - 模型能力
    - 员工态度
    answer: 1
    explain: 重复工作直接降低采用。
