      plain: 新改动不能让原有接口、数据或页面失去正常能力。
    - id: gt-migration
      term: Data Migration · 数据迁移
      plain: 数据结构变化时让旧数据安全适配新结构的过程。
    quiz:
    - - 后端什么时候应该修改数据表？
      - - 每次迭代都修改
        - 只有现有结构无法满足且方案已确认时
        - 前端颜色变化时
      - 1
      - 数据结构改动影响较大，应先证明必要性并准备兼容方案。
    - - 联调通过只看接口返回成功够不够？
      - - 够
        - 不够，还要看前端真实调用、错误和数据结果
        - 只看日志
