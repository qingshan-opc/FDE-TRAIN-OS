name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: pytest (unit + integration + api contract)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: fde
          POSTGRES_DB: fde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde -d fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: fdeadmin
          MINIO_ROOT_PASSWORD: fdeadmin123
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FDE_ENV: dev
      JWT_SECRET: ci-test-jwt-secret-not-for-prod
      DATABASE_URL: postgresql://fde:fde@127.0.0.1:5432/fde
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: fdeadmin
      S3_SECRET_KEY: fdeadmin123
      S3_FORCE_PATH_STYLE: "1"
      S3_BUCKET_DOCUMENTS: fde-documents
      S3_BUCKET_WORKSPACES: fde-workspaces
      S3_BUCKET_ARTIFACTS: fde-artifacts
      S3_BUCKET_BACKUPS: fde-backups
      AGENT_MODE: stub
      FDE_SEED_DEMO_USERS: "1"
      FDE_ALLOW_DEV_HEADERS: "0"
      FDE_INTERNAL_BASE: http://127.0.0.1:8760
      FDE_API_PORT: "8760"
      CLAMAV_ENABLED: "0"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-skeleton.txt

      - name: Install Python dependencies
        run: pip install -r requirements-skeleton.txt

      - name: Run DB migrations
        run: python -m services.migrations_runner

      - name: Start API server
        run: |
          nohup python -m uvicorn services.api.app:app --host 127.0.0.1 --port 8760 > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8760/livez && exit 0
            sleep 1
          done
          echo "API server did not become ready in time" >&2
          cat api.log
          exit 1

      - name: Run pytest
        run: python -m pytest -q tests/

      - name: Dump API logs
        if: failure()
        run: cat api.log || true

      - name: Stop API server
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  web-build:
    name: web build (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

  # Playwright e2e is heavier (browser download + full stack) — keep it manual/optional
  # so the required checks above stay fast; trigger via "Run workflow" when needed.
  e2e-playwright:
    name: playwright e2e (optional)
    if: github.event_name == 'workflow_dispatch'
    needs: [python-tests, web-build]
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: fde
          POSTGRES_DB: fde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde -d fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: fdeadmin
          MINIO_ROOT_PASSWORD: fdeadmin123
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FDE_ENV: dev
      JWT_SECRET: ci-test-jwt-secret-not-for-prod
      DATABASE_URL: postgresql://fde:fde@127.0.0.1:5432/fde
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: fdeadmin
      S3_SECRET_KEY: fdeadmin123
      S3_FORCE_PATH_STYLE: "1"
      AGENT_MODE: stub
      FDE_SEED_DEMO_USERS: "1"
      FDE_INTERNAL_BASE: http://127.0.0.1:8760
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-skeleton.txt

      - name: Install Python dependencies
        run: pip install -r requirements-skeleton.txt

      - name: Run DB migrations
        run: python -m services.migrations_runner

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Start API server (serves built web too)
        run: |
          nohup python -m uvicorn services.api.app:app --host 127.0.0.1 --port 8760 > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8760/livez && exit 0
            sleep 1
          done
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://127.0.0.1:8760

      - name: Stop API server
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true
