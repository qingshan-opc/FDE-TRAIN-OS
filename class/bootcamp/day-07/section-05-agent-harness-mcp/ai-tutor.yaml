- Copilot 当 Agent 用不验收 → 强调 multi-file 风险
suggested_questions:
- Cursor 里 Composer 算 Copilot 还是 Agent？
- Harness 没有重试会怎样？
- 训练营 Skill 和 MCP Server 差在哪？
acceptance:
  mode: review
  target: 本节练习 + 快测考点
  pass_criteria:
  - id: concept-check
    desc: Agent 循环图 + Week2 Skill 意向一句；Copilot vs Agent 对比正确。
    severity: block
  on_fail: 指路本节 lesson.md 讲解图 + 对应 narration 段
  on_pass: 预告下一节主题（若有）
