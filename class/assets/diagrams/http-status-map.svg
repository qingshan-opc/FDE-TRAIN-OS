<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="HTTP 状态码地图：是谁的锅">
<rect width="1040" height="430" fill="#f2f5f0"/>
<!-- 2xx -->
<rect x="50" y="46" width="940" height="76" fill="none" stroke="#2f9e44" stroke-width="2"/>
<text x="70" y="76" font-size="14" font-weight="800" fill="#2f9e44" style="font-family:'SF Mono',Menlo,monospace">2xx</text>
<text x="70" y="98" font-size="11" fill="rgba(35,31,32,.55)">成了</text>
<g font-size="11.5" fill="#231f20">
<rect x="180" y="66" width="240" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="196" y="90" style="font-family:'SF Mono',Menlo,monospace">200 OK — 正常返回</text>
<rect x="436" y="66" width="240" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="452" y="90" style="font-family:'SF Mono',Menlo,monospace">201 Created — 新建成功</text>
</g>
<!-- 3xx -->
<rect x="50" y="138" width="940" height="76" fill="none" stroke="rgba(35,31,32,.35)" stroke-width="2"/>
<text x="70" y="168" font-size="14" font-weight="800" fill="rgba(35,31,32,.6)" style="font-family:'SF Mono',Menlo,monospace">3xx</text>
<text x="70" y="190" font-size="11" fill="rgba(35,31,32,.55)">去别处</text>
<g font-size="11.5" fill="#231f20">
<rect x="180" y="158" width="240" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="196" y="182" style="font-family:'SF Mono',Menlo,monospace">301/302 — 搬走了，看新地址</text>
<rect x="436" y="158" width="240" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="452" y="182" style="font-family:'SF Mono',Menlo,monospace">304 — 没变，用缓存吧</text>
</g>
<!-- 4xx -->
<rect x="50" y="230" width="940" height="76" fill="none" stroke="#f5a947" stroke-width="2.5"/>
<text x="70" y="260" font-size="14" font-weight="800" fill="#d18a1f" style="font-family:'SF Mono',Menlo,monospace">4xx</text>
<text x="70" y="282" font-size="11" font-weight="700" fill="#d18a1f">前端的锅</text>
<g font-size="11.5" fill="#231f20">
<rect x="180" y="250" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="194" y="274" style="font-family:'SF Mono',Menlo,monospace">400 请求写错了</text>
<rect x="382" y="250" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="396" y="274" style="font-family:'SF Mono',Menlo,monospace">401 没带钥匙</text>
<rect x="584" y="250" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="598" y="274" style="font-family:'SF Mono',Menlo,monospace">403 有钥匙没权限</text>
<rect x="786" y="250" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="800" y="274" style="font-family:'SF Mono',Menlo,monospace">404 地址不存在</text>
</g>
<!-- 5xx -->
<rect x="50" y="322" width="940" height="76" fill="none" stroke="#f24e54" stroke-width="2.5"/>
<text x="70" y="352" font-size="14" font-weight="800" fill="#c92f3d" style="font-family:'SF Mono',Menlo,monospace">5xx</text>
<text x="70" y="374" font-size="11" font-weight="700" fill="#c92f3d">后端的锅</text>
<g font-size="11.5" fill="#231f20">
<rect x="180" y="342" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="194" y="366" style="font-family:'SF Mono',Menlo,monospace">500 服务器炸了</text>
<rect x="382" y="342" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="396" y="366" style="font-family:'SF Mono',Menlo,monospace">502 网关上游挂了</text>
<rect x="584" y="342" width="190" height="38" fill="#ffffff" stroke="rgba(35,31,32,.2)"/><text x="598" y="366" style="font-family:'SF Mono',Menlo,monospace">503 服务不可用</text>
</g>
<text x="520" y="422" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">排障口诀：4xx 查自己发的请求，5xx 找后端/网关，2xx 还报错就是「返回对了、页面渲染错了」</text>
</svg>
