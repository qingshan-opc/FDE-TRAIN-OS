quiz:
  pass_rate: 0.67
  questions:
  - q: 陈总要求“一周内把AI客服搞起来”。你最适合的第一步是：
    options: *id001
    answer: 1
    explain: 能同时降低误判和时间浪费。选项A适合低风险演示，但需要先明确演示目的；选项C过早否定；选项D放弃了业务判断。
  - q: 老板说：“给销售部做一个AI助手。”下列哪一句最接近业务结果？
    options: *id002
    answer: 2
    explain: 包含对象、时间和可观察变化。选项B仍接近功能描述；A和D停留在技术或采购动作。
  - q: 老板参加完论坛后说：“我们也要上大模型，越快越好。”目前没有责任人、资料和使用部门。最合适的判断是：
    options: *id003
    answer: 1
    explain: 外部刺激可能开启真实需求，但当前条件不足。先小范围验证，可以保持行动势能并控制风险。
  - q: 老板要求你今天把内部产品资料上传到一个公共AI平台，方便全员使用。你发现资料包含未公开价格和客户信息。最合适的处理是：
    options: *id004
    answer: 2
    explain: 这项任务风险高且不可轻易撤回，需要先确认数据范围、平台和权限，同时保留推进目标。
  - q: 老板说：“月底前把销售资料都用AI整理好。”你下一次沟通最优先确认的是：
    options: *id005
    answer: 1
    explain: 资料责任人、使用对象和阶段成果决定任务能否执行和验收。工具与视觉可以在目标确认后再选。
  - q: 老板说：“最近AI数字人很火，你给我们也搞一个。”你第一步最适合做什么？
    options: *id006
    answer: 1
    explain: 工具词明确，目标仍不清楚。先确认场景和结果。
  - q: 老板说：“销售资料太乱，新人来了什么都找不到。”这句话最可能对应的经营结果是：
    options:
    - 建立一个最先进的知识库。
    - 减少新人查找资料和上手的时间。
    - 采购一套文档管理软件。
    - 让销售全部使用同一个大模型。
    answer: 1
    explain: 结果应描述业务变化，其他选项仍是工具或动作。
  - q: 一项需求连续三个月被销售投诉，有部门负责人愿意配合，但老板尚未明确预算。真实性四证大约具备：
    options:
    - 零项
    - 一项
    - 三项
    - 四项
    answer: 2
    explain: 反复痛、后果/问题较清、有人负责，资源仍未完全明确。
