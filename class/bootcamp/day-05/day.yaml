      - 学员确认最小改动清单
      - 没有修改无关文件
      - 四种页面状态均可检查
      - 前端自检有真实结果
      - 前端交接明确后端合同
      suggested_questions:
      - 找不到请求代码应该怎么办？
      - 后端还没完成时前端怎样自检？
      - 哪些改动算无关重构？
