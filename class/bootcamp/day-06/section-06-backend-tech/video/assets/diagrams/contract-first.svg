<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="契约先行">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">契约是合同，语言只是施工队</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">CONTRACT FIRST</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="72" y="82" width="356" height="136" rx="26" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="80" y="90" width="340" height="120" rx="18" fill="url(#tlg)" filter="url(#glow)"/>
<text x="250" y="124" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">API_Spec.md 先定</text>
<text x="250" y="152" font-size="12" fill="rgba(255,255,255,.9)" text-anchor="middle">路径 · 参数 · 返回 · 错误码</text>
<text x="250" y="180" font-size="11" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">先签合同</text>
</g>
<path d="M430 150 L500 150" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="510" y="90" width="470" height="120" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="534" y="122" font-size="13" font-weight="700" fill="rgba(35,31,32,.6)">施工队后挑 · 都行</text>
<rect x="534" y="140" width="92" height="36" rx="18.0" fill="rgba(35,31,32,.05)"/><text x="580.0" y="162.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Java</text>
<rect x="638" y="140" width="92" height="36" rx="18.0" fill="url(#tlg)"/><text x="684.0" y="162.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Python</text>
<rect x="742" y="140" width="92" height="36" rx="18.0" fill="rgba(35,31,32,.05)"/><text x="788.0" y="162.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Node</text>
<rect x="846" y="140" width="92" height="36" rx="18.0" fill="rgba(35,31,32,.05)"/><text x="892.0" y="162.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Go</text>
<text x="534" y="200" font-size="11.5" fill="rgba(35,31,32,.5)">前端不在乎谁施工</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="246" width="600" height="38" rx="19.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="269.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">先写清 API_Spec.md —— 用 Java 或 Python 实现都行</text></g>
</svg>
