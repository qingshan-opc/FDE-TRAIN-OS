<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img">
  <rect width="560" height="460" fill="#f2f5f0"/>
  <text x="24" y="32" font-family="Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#1400ff">DIAGRAM · SHOWROOM ≠ PRODUCT</text>
  <!-- showroom -->
  <rect x="30" y="60" width="220" height="260" fill="#fff" stroke="#231f20" stroke-width="2"/>
  <rect x="30" y="60" width="220" height="44" fill="#1400ff"/>
  <text x="140" y="88" text-anchor="middle" font-family="Menlo,monospace" font-size="12" font-weight="700" fill="#fff">SHOWROOM</text>
  <text x="140" y="140" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#231f20">样板间</text>
  <g font-family="sans-serif" font-size="15" fill="#231f20">
    <text x="55" y="185">□ 门能点</text>
    <text x="55" y="220">□ 流程能走</text>
    <text x="55" y="255">□ 内容看得懂</text>
  </g>
  <text x="140" y="300" text-anchor="middle" font-family="Menlo,monospace" font-size="11" fill="#1400ff" font-weight="700">TODAY</text>
  <text x="280" y="190" text-anchor="middle" font-family="Menlo,monospace" font-size="28" font-weight="700" fill="#1400ff">≠</text>
  <!-- product -->
  <rect x="310" y="60" width="220" height="260" fill="rgba(35,31,32,.05)" stroke="#231f20" stroke-width="2"/>
  <rect x="310" y="60" width="220" height="44" fill="#231f20"/>
  <text x="420" y="88" text-anchor="middle" font-family="Menlo,monospace" font-size="12" font-weight="700" fill="#fff">PRODUCT</text>
  <text x="420" y="140" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#231f20">正式上线</text>
  <g font-family="sans-serif" font-size="15" fill="#231f20">
    <text x="335" y="185">□ 接入数据库</text>
    <text x="335" y="220">□ 权限与部署</text>
    <text x="335" y="255">□ 完整业务闭环</text>
  </g>
  <text x="420" y="300" text-anchor="middle" font-family="Menlo,monospace" font-size="11" fill="rgba(35,31,32,.55)" font-weight="700">LATER</text>
  <rect x="30" y="350" width="500" height="70" fill="#1400ff"/>
  <text x="280" y="380" text-anchor="middle" font-family="serif" font-size="20" font-weight="700" fill="#fff">先确认方向，再增加开发成本</text>
  <text x="280" y="405" text-anchor="middle" font-family="Menlo,monospace" font-size="12" fill="rgba(255,255,255,.75)">MATURE PRACTICE · NOT LAZY</text>
</svg>
