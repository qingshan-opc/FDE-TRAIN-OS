<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="Agent 决策环"><rect width="1040" height="500" fill="#f2f5f0"/>
        <defs>
          <marker id="dgarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#231f20"/>
          </marker>
        </defs>
        <!-- 循环箭头 -->
        <g stroke="#231f20" stroke-width="1.8" fill="none">
          <line x1="544" y1="98" x2="653" y2="176" marker-end="url(#dgarrow)"/>
          <line x1="673" y1="226" x2="631" y2="354" marker-end="url(#dgarrow)"/>
          <line x1="590" y1="388" x2="456" y2="388" marker-end="url(#dgarrow)"/>
          <line x1="411" y1="359" x2="367" y2="231" marker-end="url(#dgarrow)"/>
          <line x1="382" y1="179" x2="491" y2="101" marker-end="url(#dgarrow)"/>
        </g>
        <!-- 中心：模型 + Harness -->
        <rect x="370" y="208" width="300" height="84" fill="#231f20"/>
        <text x="520" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#f2f5f0">模型 + Harness（骨架）</text>
        <text x="520" y="268" text-anchor="middle" font-size="10.5" fill="rgba(242,245,240,.6)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">工具表 · 记忆 · 规划 · 重试 · 日志</text>
        <!-- 五节点 -->
        <g>
          <circle cx="520" cy="80" r="30" fill="#f2f5f0" stroke="#231f20" stroke-width="2"/>
          <text x="520" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1400ff" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">1</text>
          <text x="520" y="26" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">理解任务</text>
          <text x="520" y="44" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">读懂目标</text>
        </g>
        <g>
          <circle cx="682" cy="197" r="30" fill="#f2f5f0" stroke="#231f20" stroke-width="2"/>
          <text x="682" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#1400ff" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">2</text>
          <text x="726" y="193" font-size="13.5" font-weight="800" fill="#231f20">规划</text>
          <text x="726" y="211" font-size="10.5" fill="rgba(35,31,32,.5)">拆步骤</text>
        </g>
        <g>
          <circle cx="620" cy="388" r="30" fill="#f2f5f0" stroke="#231f20" stroke-width="2"/>
          <text x="620" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#1400ff" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">3</text>
          <text x="620" y="448" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">调用工具</text>
          <text x="620" y="466" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">调 Skill · Tool Calling</text>
        </g>
        <g>
          <circle cx="420" cy="388" r="30" fill="#f2f5f0" stroke="#231f20" stroke-width="2"/>
          <text x="420" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#1400ff" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">4</text>
          <text x="420" y="448" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">观察结果</text>
          <text x="420" y="466" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">看结果对不对</text>
        </g>
        <g>
          <circle cx="358" cy="197" r="30" fill="#f2f5f0" stroke="#231f20" stroke-width="2"/>
          <text x="358" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#1400ff" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">5</text>
          <text x="314" y="193" text-anchor="end" font-size="13.5" font-weight="800" fill="#231f20">继续 · 求助</text>
          <text x="314" y="211" text-anchor="end" font-size="10.5" fill="rgba(35,31,32,.5)">循环或交还人类</text>
        </g>
      </svg>