title: 第七天 · 第 1 节 · 概念：从系统到能力
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN · 第二周换档
  - 第七天 · 第 1 节 · 概念：从系统到能力
  text: |
    同学们好，我是你们的老师404。第七天，咱们正式换档。先问一句——昨晚作业里，你要封装的那件事，一句话能说清吗？想三秒。好，有同学还在想，没关系。第一周你们做的是系统：驾驶舱，页面、接口、数据库、模型，像开了一家店，等人来逛。第二周不一样——造能力，写说明书，让 AI 照着干，你坐着验货。有同学可能会说：这不就是 Prompt 吗？好问题，下一页咱们专门掰。今天这一节，就帮你完成一个转身：从亲手做到派活验货。
- id: 02-system-vs-skill
  ppt:
  - 眉题：02 CORE · 系统被使用，能力被执行
  - 第七天 · 第 1 节 · 概念：从系统到能力
  text: |
    来，看屏幕。咱们一起念：系统被使用，能力被执行。什么意思？驾驶舱是系统——前端、接口、数据库、大模型，全凑齐，等人打开浏览器。那「生成周报」「整理线索」「初审工单」呢？这是能力，一件件具体的事。能力靠什么落地？一份 Skill 说明书，加上干活的 AI。你不再自己逐字敲，你定义标准、派活、验货。有同学补充：那我从操作者变成什么了？——派活的人，验货的人。第二周每一节，思维对象都从「页面」换成「说明书」。这一点想通，后面就不拧巴。
- id: 03-prompt-vs-skill
  ppt:
  - 眉题：03 DETAIL · Prompt 管这次，Skill 管长期
  - 第七天 · 第 1 节 · 概念：从系统到能力
  text: |
    Prompt 和 Skill，第一天就有同学混。打个比方——Prompt 像在后厨门口喊一嗓子：这次要什么菜、什么口味，喊完就散。Skill 像贴在墙上的标准菜谱：输入是什么、几步做完、成品长什么样、不合格怎么打回，下次换人照做还是这个味。有同学问：第一天写的 prompts/summary.md 算什么？它已经有输入、有输出，差的是步骤和验收——半个 Skill。今天咱们把它升级成完全体。对照屏幕：Prompt 管这次对话，Skill 管长期复用；管一次和管一百次，不是一回事。
- id: 04-triple-value
  ppt:
  - 眉题：04 METHOD · Skill 的三重价值
  - 第七天 · 第 1 节 · 概念：从系统到能力
  text: |
    Skill 为什么值得写？三条，你们看看哪条最容易被忽略。第一，可复用——写一次，跑一百次。第二，可验收——好坏有判据，不靠感觉。第三——有同学说是可交接？对，这个最被低估。好的说明书，新同事来了，不用你口头教三遍，照着跑一遍就会。AI 能执行，人也能读。这就是 FDE 的工作方式：把你会的、但说不清的经验，写成别人和 AI 都能照做的流程。团队里谁最累？往往是「只有他会」的那个人——Skill 写清楚，就是在给自己减负。
- id: 05-anti-patterns
  ppt:
  - 眉题：05 EXTRA · 三类别封装
  - 第七天 · 第 1 节 · 概念：从系统到能力
  text: |
    不是所有事都值得封装。三个反例，你们对号入座。一年才做一次的年报——写完吃灰，封装成本回不来。每次都不一样的客户投诉——步骤写不稳，AI 每次开盲盒。第一个 Skill 就封装「给客户发报价邮件」——数字错一位，发出去了，收不回来。三个坑：低频、不稳定、高风险。有同学可能会说：我做的事有点风险——好，可以封装准备材料，不能封装替人拍板。第一个 Skill 要高频、要稳定、要低风险。下一节有三筛法，今天先把这三条记牢。
- id: 06-close
  ppt:
  - 眉题：06 TAKEAWAY · 带走一句
  - 第七天 · 第 1 节 · 概念：从系统到能力
  text: |
    同学们，本节先到这里。第二周，从做系统到造能力；Skill 是可复用、可验收、可交接的说明书；你从操作者变成派活验货的人。下一节咱们解剖一只 Skill——输入、步骤、输出、验收，四个部件，缺一个都转不动。今晚想一件事：你要封装的那活儿，步骤能不能写下来，让同桌照着做、不会做出第二种理解？想不清楚，说明还没选稳——不丢人，说明你在认真想。
