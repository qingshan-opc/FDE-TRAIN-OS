    form: 视频+答题
    content_ref: class/bootcamp/day-12/section-01-boss-said-vs-wanted/lesson.md
    content: 本模块视频尚未上传。请先阅读重点卡与情境题干，视频上线后可回看补齐。
    tools:
    - name: 情境判断
      note: 先分清目标、角色、风险与下一步
    quiz:
    - - 陈总要求“一周内把AI客服搞起来”。你最适合的第一步是：
      - &id001
        - 立刻选一个成熟产品开通，先展示执行速度。
        - 先确认陈总最看重的结果，并同步核查资料、渠道和责任人。
        - 直接说明一周无法完成，要求延期。
        - 让技术人员先决定用什么方案。
      - 1
      - 能同时降低误判和时间浪费。选项A适合低风险演示，但需要先明确演示目的；选项C过早否定；选项D放弃了业务判断。
    - - 老板说：“给销售部做一个AI助手。”下列哪一句最接近业务结果？
      - &id002
        - 搭建一个调用大模型API的销售智能体。
        - 让销售能够自动生成客户跟进话术。
        - 让新线索在24小时内完成基础研究和首次跟进准备。
        - 给销售部采购一套AI软件。
      - 2
      - 包含对象、时间和可观察变化。选项B仍接近功能描述；A和D停留在技术或采购动作。
    - - 老板参加完论坛后说：“我们也要上大模型，越快越好。”目前没有责任人、资料和使用部门。最合适的判断是：
      - &id003
        - 这是明确的战略任务，直接启动全公司部署。
        - 这是临时刺激或方向探索，先做目标访谈和小范围体验。
        - 这是无效需求，直接拒绝。
        - 先购买一套软件，推动事实落地。
      - 1
      - 外部刺激可能开启真实需求，但当前条件不足。先小范围验证，可以保持行动势能并控制风险。
    - - 老板要求你今天把内部产品资料上传到一个公共AI平台，方便全员使用。你发现资料包含未公开价格和客户信息。最合适的处理是：
      - &id004
        - 先上传，后续再删敏感部分。
        - 直接拒绝，说明AI风险太高。
        - 接住目标，建议先完成资料分级和脱敏，再用批准的平台小范围测试。
        - 把资料发给技术同事处理。
      - 2
      - 这项任务风险高且不可轻易撤回，需要先确认数据范围、平台和权限，同时保留推进目标。
    - - 老板说：“月底前把销售资料都用AI整理好。”你下一次沟通最优先确认的是：
      - &id005
        - 老板喜欢哪一个大模型。
        - 资料由哪个部门提供、谁使用、月底要看到什么成果。
        - 是否需要购买新的电脑。
        - AI整理的页面用什么颜色。
      - 1
      - 资料责任人、使用对象和阶段成果决定任务能否执行和验收。工具与视觉可以在目标确认后再选。
    - - 老板说：“最近AI数字人很火，你给我们也搞一个。”你第一步最适合做什么？
      - &id006
        - 立即购买数字人服务。
        - 确认使用场景、受众和希望改善的结果。
        - 告诉老板数字人效果普遍不好。
        - 先拍一条演示视频再说。
      - 1
      - 工具词明确，目标仍不清楚。先确认场景和结果。
