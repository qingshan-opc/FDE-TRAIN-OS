    - id: gt-evidence
      term: 证据
      plain: 运行后留下的可检查产物：文件、日志、验收结果——不是口头「跑过了」。
    local_prep:
      codex_prompt: '对照 Skill 四部件（输入/步骤/输出/验收）审我下面的草稿（我会粘贴）。

        标出模糊词（如「适当」「差不多」），改成可执行句子；缺哪部件补哪部件。'
      checklist:
      - 找出 ≥4 处
      - 改写后的每条都过得了「换个人照做不会做出第二种理解」
  - id: c3
    title: 三筛法选题
    minutes: 15
    form: 方法
    content_ref: class/bootcamp/day-08/section-03-pick-first/lesson.md
    content: '同学们，第一个 Skill 选品决定你今天的成就感。选错了，后面写得再漂亮也跑不通，今天就会卡在验收上。咱们先看三个真实失败案例，再学三筛法——高频、稳定、低险，对吧。

      小张封装了一年一次的年报——写完再没用过，封装成本回不来。小李封装了处理客户投诉——每次情况都不同，AI 开盲盒。小王第一个就封装给客户发报价邮件——AI 写错一个数字，发出去了。三个坑：低频、不稳定、高风险，对吧。

      三筛法按顺序过。第一筛高频：每周至少做一次吗？低频的封装成本回不来。第二筛稳定：步骤能写成无歧义说明书吗？看情况太多的，AI 执行就是开盲盒。第三筛低险：做错了代价小吗？第一个 Skill 是拿来练信任的，对吧。

      重点说低险——这是硬筛。对外发送、改数据库、花钱的事，先别碰。第一个 Skill 练的是你和 AI 之间的信任，不是练胆子。第九天咱们学人工确认点，学完再碰高风险的事，嘛。

      动手打分：每项一到五分，加一列数据可得——输入能直接从驾驶舱或现有文件拿到的，今天就能跑通。拿不定就选周报：高频、稳定、低险，数据就在你驾驶舱里。日报也行，结构一样，对吧。

      收个尾：今天只做一个 Skill，做透。可以选两个候选打分，但定品只定一个。下一节开写——四部件齐全，验收可判。咱们把第一个 Skill 写进 skills/ 目录，对吧。'
    practice: '完成标志：

      [ ] 打分表无空格

      [ ] 胜出理由与落选原因都引用三筛

      [ ] 「低险」一栏经得住同桌追问（「做错了会怎样？」）'
    resource_ids:
    - dg-skill-anatomy
    tools:
    - name: 选品打分表
      note: 高频 / 稳定 / 低险 / 数据可得 各 1–5 分
    quiz:
    - - 选第一个 Skill 的三筛顺序是？
      - - 低险 → 高频 → 稳定
        - 高频 → 稳定 → 低险
        - 稳定 → 低险 → 高频
      - 1
      - 先筛频率，再筛能否写说明书，最后筛出错代价。
    - - 为什么第一个 Skill 必须「低险」？
      - - 低险的工作简单
        - 第一个 Skill 是练信任——错了代价要小
        - 导师要求
      - 1
      - 对外发送/改数据/花钱的等高险操作，Day 9 学完确认闸再说。
    - - 推荐首发「周报生成」同时满足三筛，还因为？
      - - 最难所以最有价值
        - 高频、结构稳定、产出不对外发送、数据可从驾驶舱拉
        - 老板最喜欢
      - 1
      - 四列打分表里「数据可得」是加分项——今天就能跑通。
    - - 小张封装「年度总结」失败的根本原因是？
      - - 写得太长
        - 低频——封装成本回不来
        - 没有用 Markdown
      - 1
      - 一年一次的工作，写完再没用过——第一筛就没过。
    media:
    - kind: video
      title: 口播课件 · 选品三筛
      object_key: documents/shared/course-media/day07-c3-pick-first.mp4
      poster_key: documents/shared/course-media/day07-c3-pick-first-poster.jpg
      duration_sec: 110
    knowledge_cards:
    - id: three-filters
      term: 选品三筛
      plain: 高频（每周≥1）→ 稳定（步骤可写死）→ 低险（出错代价小）。
      tag: 方法
    - id: low-risk-first
      term: 低险优先
      plain: 第一个 Skill 是练信任——对外发送/改数据/花钱的先别碰（Day 9 再学确认闸）。
      tag: 原则
    - id: data-available
      term: 数据可得
      plain: 输入能直接从驾驶舱或现有文件拿到，今天就能跑通——加分项。
      tag: 技巧
    glossary_terms:
    - id: gt-high-freq
      term: 高频
      plain: 每周至少做一次——封装成本才回得来。
    - id: gt-stable
      term: 稳定步骤
      plain: 「看情况」太多的工作，AI 执行就是开盲盒。
    local_prep:
      codex_prompt: 候选 3 个可 Skill 化任务（来自我的周报助手）。用「重复频率 / 说明书化难度 / 验收清晰度」打分，选出今天要做的第 1 个，并写一句为什么不选另外两个。
      checklist:
      - 打分表无空格
      - 胜出理由与落选原因都引用三筛
      - 「低险」一栏经得住同桌追问（「做错了会怎样？」）
  - id: c4
    title: 写好技能说明书
    minutes: 30
    form: 实战
    content_ref: class/bootcamp/day-08/section-04-define-skill/lesson.md
    content: '同学们，这节开写。三十分钟后，skills/ 目录里要有你的第一份 Skill 说明书——四部件齐全，验收可判，同桌能读懂。写之前咱们先给两个库：动作动词库和判据句式库，对吧。

      步骤段只许出现动作动词：拉取、筛选、对比、汇总、排序、找出、计算、生成、检查、列出。分析一下处理一下优化一下——这些不是动作，是愿望。我巡场见到就划掉，改写成 AI 能执行的具体动作，嘛。

      验收段用判据句式：结构判X 段齐全、含字段 A/B/C；数字判每个数字能在来源中找到出处；意图判当某情况时，必须某表现——第五天用例格式直接搬。验收写几条？至少三条，结构、数字、意图各一，对吧。

      写作顺序听好：倒着写。先写输出——交什么货；再写验收——怎么判；然后输入——吃什么料；最后步骤——从料到货就是连线题。正着写的人，都在步骤里迷路了。输出段贴一个好示例，是最划算的消歧方式，对吧。

      写完做换人测试：同桌只看你的说明书，说出要做什么、怎么判好坏。他说错了，就是你写岔了——改说明书，不怪他。步骤里能写分支吗？能，但每个分支都要落到动作动词；分支超过三层，说明该拆成两个 Skill，嘛。

      定稿进 Git，预演下一节运行。带走两个库：动作动词写步骤，判据句式写验收，换人测试消歧义。下一节 AI 拿着你的说明书上岗——派活、收货、按标准验收、留证据，对吧。'
    practice: '完成标志：

      [ ] frontmatter + 四部件齐全

      [ ] 输入绑定真实业务数据源

      [ ] 换人三问能答对'
    resource_ids:
    - dg-skill-anatomy
    tools:
    - name: Skill 模板四段式
      note: 输入 / 步骤 / 输出 / 验收 + 工具描述
    quiz:
    - - Skill 说明书中「工具描述」为什么要写「何时不用」？
      - - 凑字数
        - 帮 Agent（和人）判断该不该选这件工具
        - 法律要求
      - 1
      - Day 8 的「选错图谱」靠在描述里写清边界。
    - - 步骤写到什么程度算合格？
      - - 越厚越好
        - 换一个人/AI 照着做，不会做出第二种理解
        - 只要列三步就行
      - 1
      - 可执行性比篇幅重要——「分析一下」永远不合格。
    - - 今日定稿文件应放在哪里？
      - - prompts/ 目录
        - skills/<name>.md 并 commit 进 Git
        - 只存在聊天记录里
      - 1
      - 可复用、可交接——必须版本化进仓库。
    media:
    - kind: video
      title: 口播课件 · 写好技能说明书
      object_key: documents/shared/course-media/day07-c4-define-skill.mp4
      poster_key: documents/shared/course-media/day07-c4-define-skill-poster.jpg
      duration_sec: 115
