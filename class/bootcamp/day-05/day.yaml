    - id: gt-physical
      term: 物理机
      plain: 桌底/机架上那台真电脑——最早的「服务器」。
    - id: gt-docker
      term: Docker
      plain: 最常用的容器工具：把程序打成镜像再跑起来。
    - id: gt-ssh
      term: SSH
