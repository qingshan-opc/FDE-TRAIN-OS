<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="daily work">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.14)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#ffffff"/>
  <rect width="560" height="420" fill="url(#dots)"/>
  <circle cx="504" cy="56" r="86" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="376" r="62" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="62;74;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="24" width="6" height="26" rx="3" fill="#0d9488"/>
    <text x="46" y="43" font-size="19" font-weight="800" fill="#231f20">你的日常三件事</text>
    <text x="532" y="41" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.8" fill="rgba(35,31,32,.42)">ORDINARY = BETTER</text>
  </g>
<g transform="translate(36,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="152" height="216" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <rect x="24" y="24" width="26" height="5" rx="2.5" fill="#0d9488"/>
      <text x="24" y="76" font-family="'SF Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#0d9488">01</text>
      <text x="24" y="122" font-size="19" font-weight="800" fill="#231f20">看数据</text>
      <text x="24" y="158" font-size="12.5" fill="rgba(35,31,32,.55)">同一张表</text>
      <text x="24" y="182" font-size="12.5" fill="rgba(35,31,32,.55)">反复核对</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.0s" dur="7.0s" repeatCount="indefinite"/>
    </g>
<g transform="translate(204,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="152" height="216" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <rect x="24" y="24" width="26" height="5" rx="2.5" fill="#0d9488"/>
      <text x="24" y="76" font-family="'SF Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#0d9488">02</text>
      <text x="24" y="122" font-size="19" font-weight="800" fill="#231f20">复制表</text>
      <text x="24" y="158" font-size="12.5" fill="rgba(35,31,32,.55)">数字搬迁</text>
      <text x="24" y="182" font-size="12.5" fill="rgba(35,31,32,.55)">手工拼报</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.35s" dur="7.0s" repeatCount="indefinite"/>
    </g>
<g transform="translate(372,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="152" height="216" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <rect x="24" y="24" width="26" height="5" rx="2.5" fill="#0d9488"/>
      <text x="24" y="76" font-family="'SF Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#0d9488">03</text>
      <text x="24" y="122" font-size="19" font-weight="800" fill="#231f20">追进度</text>
      <text x="24" y="158" font-size="12.5" fill="rgba(35,31,32,.55)">跟人催状态</text>
      <text x="24" y="182" font-size="12.5" fill="rgba(35,31,32,.55)">解释波动</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.7s" dur="7.0s" repeatCount="indefinite"/>
    </g>
<g transform="translate(36,326)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="488" height="68" rx="18" fill="url(#teal)" filter="url(#glow)"/>
      <text x="244.0" y="32.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">越贴近日常，越容易发现 AI 做错</text>
      <text x="244.0" y="56.0" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(255,255,255,.78)">FAMILIAR · CLEAR · JUDGABLE</text>
      </g>
</svg>
