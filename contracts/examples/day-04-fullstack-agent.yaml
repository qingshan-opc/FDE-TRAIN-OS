# Day 04 — 前端联调（Agent）
camp_version: v0.3
day: 4
title: 前端界面与前后端联调
project: 企业库存管理系统 · 列表联调

learn:
  lingzhi_tags: ["camp:v0.3", "day:4", "topic:fullstack"]
  estimated_minutes: 40
  steps:
    - 前端三件套：HTML 骨架、CSS 皮肤、JS 动作。
    - 联调关键：请求地址、跨域、字段对齐。
    - 遇错即问：把报错丢给 AI，再验证修复。
    - 交付标准：能看见数据 + 有功能清单。

quiz:
  pass_rate: 0.5
  questions:
    - q: 前后端联调首先对齐？
      options: ["字体", "接口字段与路径", "K8s 版本"]
      answer: 1
    - q: 404 通常表示？
      options: ["密码错误", "路径不存在", "磁盘满"]
      answer: 1

nodes:
  - type: learn
    title: 组件化与联调心智
  - type: quiz
    title: 联调排错速测
  - type: lab
    title: Agent 生成带 Mock 数据的库存页
  - type: project
    title: 企业任务：列表页联调交付
  - type: review
    title: 截图与功能清单
  - type: unlock
    title: 解锁 Day5 部署认知

lab:
  runner: agent
  agent:
    prompt_template: >
      创建 inventory.html：库存列表页，含表格（SKU/名称/库存），
      用 JS 内置 mock 数组渲染至少 3 行，并有按钮「刷新数据」。不要 Docker。
  rubric:
    - check: file_exists
      args: { path: inventory.html }
    - check: text_contains
      args: { path: inventory.html, needle: "SKU" }
    - check: text_contains
      args: { path: inventory.html, needle: "刷新" }
