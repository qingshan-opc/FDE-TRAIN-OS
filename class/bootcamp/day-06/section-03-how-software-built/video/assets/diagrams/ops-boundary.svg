<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="运维与新功能开发的边界">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">运维 ≠ 新功能开发：边界划清，合作不打架</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">OPS BOUNDARY</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="86" width="420" height="150" rx="18" fill="#fff" stroke="rgba(13,148,136,.45)" stroke-width="1.5" filter="url(#tglow)"/>
<rect x="84" y="106" width="130" height="26" rx="13.0" fill="url(#tlg)"/><text x="149.0" y="123.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">运维合同内</text>
<text x="84" y="166" font-size="17" font-weight="800" fill="#231f20">修 · 优化</text>
<text x="84" y="194" font-size="12" fill="rgba(35,31,32,.6)">收集使用中的问题：修缺陷、性能与体验优化</text>
<text x="84" y="216" font-size="11.5" fill="rgba(35,31,32,.5)">严格按约定范围</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><circle cx="520" cy="161" r="24" fill="#fff" stroke="#0d9488" stroke-width="2" filter="url(#sh)"/><text x="520" y="167" font-size="18" font-weight="800" fill="#0d9488" text-anchor="middle">≠</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="560" y="86" width="420" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<rect x="584" y="106" width="130" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="649.0" y="123.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">合同外</text>
<text x="584" y="166" font-size="17" font-weight="800" fill="#231f20">新想法 · 新项目</text>
<text x="584" y="194" font-size="12" fill="rgba(35,31,32,.6)">客户又想做一个大功能——另开调研和报价</text>
<text x="584" y="216" font-size="11.5" fill="rgba(35,31,32,.5)">别跟运维混为一谈</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="266" width="600" height="40" rx="20.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="290.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">上线不是终点——客户会签运维合同；边界划清，合作才不打架</text></g>
</svg>
