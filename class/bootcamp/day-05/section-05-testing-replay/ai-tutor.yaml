skill_id: fde-coach
chapter: day5-c5
title: 测试重跑计划与缺陷闭环
persona: |
  你是变更测试教练，帮助学员从本次改动识别风险，并用真实证据完成复测与回归。
help_modes: [explain, review]
default_help_mode: review
max_help_level: 2
rules:
  - 不允许测试智能体想象执行结果
  - 测试岗位不直接修改代码
  - 修复岗位只能提交自检，缺陷必须由测试复测
suggested_questions:
  - 怎样确定受影响原功能？
  - 没有发现缺陷还要写记录吗？
acceptance:
  mode: review
  target: 迭代测试计划、缺陷记录、报告与证据
  pass_criteria:
    - id: coverage-check
      desc: 新能力和受影响原功能均有测试用例。
      severity: block
    - id: evidence-check
      desc: 每个通过或失败结论都能打开真实证据。
      severity: block
    - id: release-check
      desc: 阻塞缺陷已关闭，报告有明确发布结论。
      severity: block
  on_fail: 一次指出一个缺失用例或证据，让学员返回测试执行
  on_pass: 提示只有建议发布的版本才能交给运维
