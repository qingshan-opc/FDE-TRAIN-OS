<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-label="模型网关图">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="500" fill="#ffffff"/>
  <rect width="1040" height="500" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="452" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">模型网关 · 换模型不动应用</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">MODEL GATEWAY · 第五天你亲手接这一层</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="195" width="200" height="110" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="160" y="240" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">你的驾驶舱</text>
<text x="160" y="266" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">摘要接口 · /api/summary</text>
</g>
<path d="M268 250 L352 250" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="360" y="140" width="280" height="220" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="500" y="174" font-size="12" font-weight="800" fill="#0f766e" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">模型网关 · GATEWAY</text>
<line x1="384" y1="190" x2="616" y2="190" stroke="rgba(35,31,32,.1)" stroke-width="1.5"/>
<text x="392" y="220" font-size="12" fill="#231f20" font-family="'SF Mono',Menlo,monospace">· 密钥保管（只在服务端）</text>
<text x="392" y="252" font-size="12" fill="#231f20" font-family="'SF Mono',Menlo,monospace">· 限流 · 超时</text>
<text x="392" y="284" font-size="12" fill="#231f20" font-family="'SF Mono',Menlo,monospace">· 路由 · 降级</text>
<text x="392" y="316" font-size="12" fill="#231f20" font-family="'SF Mono',Menlo,monospace">· 计费 · 日志</text>
</g>
<path d="M646 226 L752 150" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M646 250 L752 250" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M646 274 L752 350" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="760" y="110" width="220" height="64" rx="14" fill="#fff" filter="url(#sh)"/>
<text x="870" y="138" font-size="12.5" font-weight="700" fill="#231f20" text-anchor="middle">闭源云 API</text>
<text x="870" y="158" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">GPT · Claude · Kimi（本课默认）</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="760" y="218" width="220" height="64" rx="14" fill="#fff" filter="url(#sh)"/>
<text x="870" y="246" font-size="12.5" font-weight="700" fill="#231f20" text-anchor="middle">开源云托管</text>
<text x="870" y="266" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">Qwen · DeepSeek</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="760" y="326" width="220" height="64" rx="14" fill="#fff" stroke="rgba(35,31,32,.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="870" y="354" font-size="12.5" font-weight="700" fill="#231f20" text-anchor="middle">本地推理</text>
<text x="870" y="374" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">Ollama · 数据不出门</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="170" y="420" width="700" height="60" rx="30.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="446.0" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">换模型 = 换网关后面的牌子：应用代码一行不动</text>
<text x="520.0" y="466.0" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">铁律：密钥只住在服务端网关里 —— 绝不写进前端页面</text></g>
</svg>
