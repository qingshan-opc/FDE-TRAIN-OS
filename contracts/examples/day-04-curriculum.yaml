learn:
  lingzhi_tags:
  - camp:v0.7
  - day:4
  - project:role-week
  estimated_minutes: 130
  require_capsules: true
  capsules:
  - id: c1
    title: 从 PRD 倒推可执行测试用例
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-04/section-01-backend-role/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：测试不是项目做完后随便点几下；第一天写下验收标准时，第四天的测试范围就已经被定义。


      请记住三件事。


      「每条用例要能追到 PRD 验收标准。」


      「覆盖正常、边界和异常。」


      「看板统计必须和列表真实记录逐项核对。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：让测试工程师生成用例，由学员抽查可执行性。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@测试工程师 Agent'
      note: 本节交付：至少 10 条测试用例
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 测试用例的主要来源是什么？
      - &id001
        - 测试工程师感觉
        - PRD 验收标准和接口契约
        - 页面颜色
      - 1
      - 测试从已经批准的标准倒推。
    - - 预期结果写“正常显示”为什么不合格？
      - &id002
        - 不够长
        - 无法客观判断通过或失败
        - 没有截图
      - 1
      - 预期必须具体可判定。
    local_prep:
      codex_prompt: '@测试工程师 Agent 请阅读 docs/PRD.md 的验收标准、docs/D2-L4_接口契约.md 和当前系统，生成 docs/D4-L1_测试用例表.md。至少 10 条，覆盖正常、边界、异常；每条写前置条件、步骤、预期结果和对应
        PRD 条目。至少有一条核对驾驶舱统计与列表真实记录。

        完成后只做用例自检，以 REVIEW 状态交付，不要替我执行并填写通过。'
      checklist:
      - 至少十条并覆盖三类场景
      - 每条有明确步骤和可判断预期
      - 可追溯到 PRD
      - 包含看板与列表核对
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 学员亲手执行测试并记录缺陷
    minutes: 30
    form: 实操
    content_ref: class/bootcamp/day-04/section-02-api-design/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：Agent 可以整理测试，但不能代替学员点击页面、输入边界值和观察结果；未执行的用例不能写通过。


      请记住三件事。


      「每条用例标通过、失败或阻塞。」


      「缺陷包含重现步骤、预期、实际、证据和严重程度。」


      「找不到缺陷时继续测边界和异常，不能编造。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：学员逐条执行，之后把自己的记录交给测试工程师整理。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: 学员亲测 → @测试工程师 Agent 整理
      note: 本节交付：执行矩阵 + 真实缺陷报告
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - Agent 说测试通过能否作为通过证据？
      - &id003
        - 能
        - 不能，必须有真实执行记录
        - 只有前端可以
      - 1
      - 测试结论来自执行证据。
    - - 好缺陷报告最重要的是什么？
      - &id004
        - 情绪强烈
        - 别人能按步骤稳定重现
        - 标题很长
      - 1
      - 可重现才能被定位、修复和复测。
    local_prep:
      codex_prompt: '@测试工程师 Agent 我会亲自按 docs/D4-L1_测试用例表.md 执行。请先创建 docs/D4-L2_执行矩阵.md 和 docs/D4-L2_缺陷报告.md 的空模板，不要替我填写结果。

        等我粘贴真实观察后，再帮我整理每条缺陷的重现步骤、预期结果、实际结果、证据和严重程度，并指出分级理由。任何未执行用例必须标“未执行”，不得写通过。'
      checklist:
      - 用例都有真实执行状态
      - 缺陷与实际项目一致
      - 重现步骤足够他人复现
      - 学员至少复核一次严重度判断
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 把缺陷交给正确岗位修复
    minutes: 30
    form: 实操+交接
    content_ref: class/bootcamp/day-04/section-03-database-design/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：修复指令必须包含现象、步骤、目标和复验口径；先分段定位，再交给前端或后端。


      请记住三件事。


      「页面渲染问题通常由前端负责，接口或数据规则由后端负责。」


      「修复后不仅重测失败用例，还要测相关用例防止回归。」


      「Agent 必须解释根因和修改范围。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：学员按缺陷归属逐条派单，并亲手复测。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@责任工程师'
      note: 本节交付：修复单、修复提交与根因说明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 修复后为什么还要测试相关用例？
      - &id005
        - 为了增加文件
        - 防止修好 A 又破坏 B
        - 为了改变 PRD
      - 1
      - 相关功能可能被同一处修改影响。
    - - “请把 Bug 修好”缺少什么？
      - &id006
        - 现象、步骤、目标和验收口径
        - 技术框架介绍
        - 市场分析
      - 0
      - 可执行修复单需要具体上下文。
    local_prep:
      codex_prompt: '@〈前端工程师 Agent/后端工程师 Agent〉 修复缺陷【〈标题〉】：

        - 现象：〈真实现象〉

        - 重现步骤：〈步骤〉

        - 修复要求：〈改成什么样〉

        - 验收口径：用例〈编号〉应通过，且相关用例〈编号〉不得失效。

        修复后请说明根因、修改文件和自检证据，以 REVIEW 状态交付；不要替我填写复测通过。'
      checklist:
      - 每张修复单四要素齐全
      - 派给正确责任岗位
      - 学员复测失败用例和至少一条相关用例
      - 根因和修改范围写入记录
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 复测、回归与功能冻结
    minutes: 25
    form: 实操+验收
    content_ref: class/bootcamp/day-04/section-04-hands-on-api-db/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：功能冻结不是停止改进，而是在交付前停止加新功能，只处理已知缺陷，保护验收基线。


      请记住三件事。


      「验收覆盖功能、数据、异常和文档。」


      「未通过项如实写原因和补救计划。」


      「冻结后新想法进入 Backlog，不直接插入本周。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：和测试工程师逐项核对，确认没有阻塞缺陷后宣布冻结。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: '@测试工程师 Agent + 学员批准'
      note: 本节交付：验收清单 + 功能冻结声明
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 功能冻结后新想法怎么处理？
      - - 立即开发
        - 进入 Backlog 等后续排期
        - 删除
      - 1
      - 冻结保护当前交付，新想法保留但不插队。
    - - 有未通过项时应该怎么做？
      - - 隐藏
        - 记录原因和补救计划
        - 自动改成通过
      - 1
      - 诚实披露是可维护交付的一部分。
    local_prep:
      codex_prompt: '@测试工程师 Agent 请基于真实执行结果生成 docs/D4-L4_验收清单.md，覆盖功能、数据、异常、文档四类，每项链接到证据；驾驶舱每个数字都必须与列表真实记录核对。未通过项写原因和补救计划。

        我逐项确认后，如无阻塞项，请在 README 顶部记录“状态：V0.9 功能冻结——不加新功能，只修缺陷”。冻结决定必须由我明确批准。'
      checklist:
      - 四类验收项都有证据
      - 看板数据可追溯
      - 未通过项未被隐藏
      - 冻结由学员明确宣布
      - 冻结后没有新增功能
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 整理证据包并打上 V0.9 标记
    minutes: 20
    form: 实操+验收
    content_ref: class/bootcamp/day-04/section-05-accept/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：企业交付不是一句“能跑”，而是需求、设计、代码、数据、测试和修复都能互相对上的证据链。


      请记住三件事。


      「逐项检查文件真实存在且为最新版。」


      「版本标记对应已经冻结并复测的状态。」


      「学员能用一分钟说明能做什么和仍有什么限制。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：整理七类证据并检查 Git 记录。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day4-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：报审材料清单与 v0.9
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 报审材料的核心价值是什么？
      - - 让文件更多
        - 让每个结论都有可追溯证据
        - 代替项目运行
      - 1
      - 证据链支撑验收和交接。
    - - 缺失文件应该怎样记录？
      - - 编一个路径
        - 标 BLOCKED 并补做
        - 从清单删除
      - 1
      - 诚实状态比虚假完整更重要。
    local_prep:
      codex_prompt: '请只整理真实存在的交付物，创建 docs/D4_报审材料清单.md：项目任务书与 PRD、交互原型、四页前端、接口与数据库、测试用例与执行矩阵、缺陷修复、验收清单。逐项写文件路径、当前状态和最后验证证据。

        确认 V0.9 功能冻结后再创建版本标记，并更新 README。缺失项标 BLOCKED，不得编造路径或写成已通过。'
      checklist:
      - 七类证据均可打开
      - 状态与真实执行一致
      - 版本标记对应冻结版
      - 能口述功能、缺陷和 Week2 AI 边界
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
