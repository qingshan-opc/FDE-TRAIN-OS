<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-label="部署管线图">
  <defs>
    <linearGradient id="dp-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="dp-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dp-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="dp-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="dp-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".45"/>
    </filter>
    <marker id="dp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="440" fill="#ffffff"/>
  <rect width="1040" height="440" fill="url(#dp-dots)"/>
  <circle cx="960" cy="360" r="90" fill="rgba(13,148,136,.06)">
    <animate attributeName="r" values="90;106;90" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- header -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="36" y="20" width="6" height="24" rx="3" fill="#0d9488"/>
    <text x="52" y="38" font-size="17" font-weight="800" fill="#231f20">部署管线：从代码到能访问</text>
    <text x="1004" y="38" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">DEPLOY PIPELINE</text>
  </g>

  <!-- five stages -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <g transform="translate(50,86)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.45s" fill="freeze"/>
      <rect width="150" height="96" rx="14" fill="#fff" filter="url(#dp-sh)"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">代码</text>
      <text x="75" y="56" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">CODE</text>
      <text x="75" y="78" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">git commit 留证</text>
    </g>
    <g transform="translate(246,86)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.45s" fill="freeze"/>
      <rect width="150" height="96" rx="14" fill="#fff" filter="url(#dp-sh)"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">构建</text>
      <text x="75" y="56" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">BUILD</text>
      <text x="75" y="78" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">装依赖 · 配环境</text>
    </g>
    <g transform="translate(442,86)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.45s" fill="freeze"/>
      <rect width="150" height="96" rx="14" fill="#fff" filter="url(#dp-sh)"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">镜像</text>
      <text x="75" y="56" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">IMAGE</text>
      <text x="75" y="78" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">应用+环境 连锅端</text>
    </g>
    <g transform="translate(638,86)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.45s" fill="freeze"/>
      <rect width="150" height="96" rx="14" fill="#fff" filter="url(#dp-sh)"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">运行</text>
      <text x="75" y="56" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" font-family="'SF Mono',Menlo,monospace">RUN</text>
      <text x="75" y="78" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.6)">服务器 7×24</text>
    </g>
    <g transform="translate(834,86)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.45s" fill="freeze"/>
      <rect x="-7" y="-7" width="164" height="110" rx="20" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
        <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect width="150" height="96" rx="14" fill="url(#dp-teal)" filter="url(#dp-glow)"/>
      <text x="75" y="36" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">访问</text>
      <text x="75" y="56" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(255,255,255,.8)" font-family="'SF Mono',Menlo,monospace">VISIT</text>
      <text x="75" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">换设备能开 ✓</text>
    </g>

    <!-- arrows -->
    <g stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 7" fill="none">
      <line x1="204" y1="134" x2="238" y2="134" marker-end="url(#dp-arr)">
        <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="400" y1="134" x2="434" y2="134" marker-end="url(#dp-arr)">
        <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="596" y1="134" x2="630" y2="134" marker-end="url(#dp-arr)">
        <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="792" y1="134" x2="826" y2="134" marker-end="url(#dp-arr)">
        <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- acceptance gate -->
    <path d="M517 214 V190" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#dp-arr)">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(402,218)">
      <rect width="230" height="44" rx="22" fill="url(#dp-band)" filter="url(#dp-glow)">
        <animate attributeName="opacity" values="1;.82;1" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="115" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">验收闸：十条链路全绿才准发</text>
    </g>

    <!-- bottom notes -->
    <rect x="286" y="292" width="468" height="34" rx="17" fill="rgba(13,148,136,.10)"/>
    <text x="520" y="314" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">「在我机器上是好的」不算上线 —— 换台设备能开才算</text>
    <text x="520" y="352" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">开发 / 生产配置分离 · 密钥不进代码（详见 env-config-split 图）</text>
    <text x="520" y="380" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">镜像 = 集装箱：你的应用和它的整个环境一起装箱，到哪台机器都长一样</text>
  </g>
</svg>
