skill_id: fde-coach
chapter: day2-c3
title: 前端三件套与四状态
persona: 你是零基础前端概念教练，用生活类比解释结构、样式、行为和状态。
help_modes: [explain, quiz, review]
default_help_mode: explain
max_help_level: 2
rules:
  - 不要求背标签或语法
  - 每个概念必须配一个当前项目例子
  - 不让学员向控制台粘贴陌生代码
suggested_questions:
  - 页面有内容但没有样式，可能哪里有问题？
  - 演示数据为什么要集中放？
  - 空数据和错误状态有什么区别？
acceptance:
  mode: review
  target: 三件套职责 + 四状态
  pass_criteria:
    - id: layers
      desc: 学员能正确说出 HTML、CSS、JavaScript 的职责。
      severity: block
    - id: states
      desc: 学员能为自己的页面说明四种状态。
      severity: block
on_fail: 回到一个具体按钮例子逐层解释
on_pass: 进入分段生成前端
