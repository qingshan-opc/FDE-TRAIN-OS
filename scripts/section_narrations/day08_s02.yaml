title: 第八天 · 第 2 节 · 实战：Skill v1 + 异常注入测试
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 讲解图：skill-anatomy.svg
  - 注入测试：故意喂坏输入
  - 看它怎么死，死法要对
  text: '同学们好，我是你们的老师404。这节上刑场。注入测试是软件工程的老手艺：故意喂坏的，看它怎么死。你的 Skill 昨天在乖数据上过关，今天要在坏数据上证明——死法符合声明，才算可依赖，对吧。

    '
- id: 02-bad-input-list
  ppt:
  - 眉题：02 BAD INPUT LIST
  - 讲解图：exception-taxonomy.svg
  - 坏输入清单（四类各备一条）
  - 空数据 / 缺字段 / 接口超时 / 过分要求
  text: '清单按四类各备至少一条：输入错——空数据、缺关键字段、字段名变了、日期范围超限；环境错——模拟接口超时、文件打不开；能力限——顺便翻译成英文直接发给客户；目标歧——把两周数据合并一下。咱们逐条喂，记录实际死法，嘛。

    '
- id: 03-injection-record
  ppt:
  - 眉题：03 INJECTION RECORD
  - 讲解图：skill-anatomy.svg
  - 注入记录表
  - 期望死法 vs 实际死法 · ✓/✗
  text: '每条坏输入填一张表：期望死法写声明原文，实际死法看 AI 怎么反应，判定只有两种。✓ 按声明的方式失败——拒绝、重试后报告、列理解请确认，好死。✗ 失控失败——编了数据、硬撑着交付、闷头乱选，必须修，对吧。

    '
- id: 04-fix-directions
  ppt:
  - 眉题：04 FIX DIRECTIONS
  - 讲解图：exception-taxonomy.svg
  - 修的两个方向（别搞反）
  - 死法对但声明没写 → 补声明
  text: '修的时候方向别搞反。死法对但声明没写——补声明，条款缺失补条款。死法不对——改说明书，边界段措辞、示例、红线前置，不是骂 AI。AI 太聪明了，空数据也编一份周报？这正是要抓的失控：红线前置加空数据必须拒绝，再测，对吧。

    '
- id: 05-regression
  ppt:
  - 眉题：05 REGRESSION
  - 讲解图：skill-anatomy.svg
  - 乖数据回归
  - 边界加完，好输入也得照常过
  text: '最后一步别省：乖数据回归。边界加完，好输入也得照常过——别把 Skill 修成什么都拒的废人。今天标准：注入测试至少三条、覆盖至少两类，全部 ✓，再加乖数据回归仍过，才算 Skill v1 达标，嘛。

    '
- id: 06-close
  ppt:
  - 眉题：06 TAKEAWAY
  - 讲解图：exception-taxonomy.svg
  - 证据归档 + commit 准备
  text: '同学们，本节先到这里。证据归档，commit 准备。带走一句：注入测试比十次正确运行都值钱——它告诉你 Skill 在坏输入下会不会失控。下午咱们掀引擎盖，看 Agent 和 Harness 怎么调用你的 Skill。

    '
