<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="上线与 UAT">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">上线与 UAT：让客户真的用上</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">LAUNCH · UAT</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="80" y="96" width="270" height="92" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="215.0" y="140.0" font-size="15" font-weight="700" fill="#231f20" text-anchor="middle">部署</text>
<text x="215.0" y="162.0" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">服务放出去 · 可访问</text>
</g>
<path d="M356 142.0 L399 142.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="405" y="96" width="270" height="92" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="540.0" y="140.0" font-size="15" font-weight="700" fill="#231f20" text-anchor="middle">UAT 用户验收测试</text>
<text x="540.0" y="162.0" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">模拟生产 · 部分真实数据 · 业务方先用</text>
</g>
<path d="M681 142.0 L724 142.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="722" y="88" width="286" height="108" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="730" y="96" width="270" height="92" rx="16" fill="url(#tlg)" filter="url(#glow)"/>
<text x="865.0" y="140.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">正式发布</text>
<text x="865.0" y="162.0" font-size="10.5" fill="rgba(255,255,255,.85)" text-anchor="middle">客户真的用上</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="80" y="246" font-size="12.5" font-weight="700" fill="rgba(35,31,32,.55)">发布形态：</text>
<rect x="170" y="226" width="104" height="30" rx="15.0" fill="rgba(35,31,32,.05)"/><text x="222.0" y="245.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">App</text>
<rect x="290" y="226" width="104" height="30" rx="15.0" fill="rgba(35,31,32,.05)"/><text x="342.0" y="245.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">小程序</text>
<rect x="410" y="226" width="104" height="30" rx="15.0" fill="rgba(35,31,32,.05)"/><text x="462.0" y="245.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">Web</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="180" y="272" width="680" height="36" rx="18.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="294.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Day 6 部署上云就是这一站 · 怕一上去就翻车，所以先 UAT 再全开</text></g>
</svg>
