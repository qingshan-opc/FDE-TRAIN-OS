    form: 视频+答题
    content_ref: class/bootcamp/day-14/section-01-task-contract/lesson.md
    content: 本模块视频尚未上传。请先阅读重点卡与情境题干，视频上线后可回看补齐。
    tools:
    - name: 情境判断
      note: 先分清目标、角色、风险与下一步
    quiz:
    - - 你已经了解大致目标，但最终使用对象和截止时间不清。第一动作应当是什么？
      - &id001
        - 完全按自己的判断做完
        - 先给出一个建议版本，再确认使用对象和截止时间
        - 要求老板填写完整需求表
        - 暂停任务，等老板主动补充
      - 1
      - “你看着办”通常意味着负责人希望你先贡献判断，同时仍需确认会改变方向的关键条件。
    - - 老板让你明天交一份竞争对手分析，却没有说明用于内部决策还是对外路演。哪个缺口优先级最高？
      - &id002
        - 使用什么字体
        - 报告页数
        - 汇报对象与决策用途
        - 是否添加动画
      - 2
      - 对象与用途会影响分析深度、证据标准、措辞和呈现形式。
    - - 任务目标、成果和截止时间已清楚，但最终确认人不明确。最主要的风险是什么？
      - &id003
        - 文件无法保存
        - 不同人可能在交付时使用不同标准
        - 学员无法使用AI
        - 项目一定延期
      - 1
      - 最终确认权不清会导致多头修改和验收争议。
    - - 你已经连续问了七个问题，老板说“先做再说”。最佳补救动作是什么？
      - &id004
        - 继续把剩下问题问完
        - 完全停止确认
        - 用一句话说出最小版本，只确认两个高影响缺口
        - 把问题发给其他员工决定
      - 2
      - 先贡献判断，再索取少量关键确认，可以降低决策负担。
    - - 哪条验收标准最可用？
      - &id005
        - 看起来有档次
        - 老板觉得满意
        - 使用统一字体与间距，首页只保留三项核心信息，会议室投屏可清晰阅读，并由吴主任完成彩排确认
        - 多使用金色
      - 2
      - 标准需要包含可观察条件、使用场景和确认责任。
    - - 任务确认单只写了要做的功能，没有写暂不包含项。最可能出现什么问题？
      - &id006
        - 文件变大
        - 相关人员会把所有相邻需求默认纳入本次交付
        - 项目无法命名
        - 老板无法看到页面
      - 1
      - 非交付项为当前版本建立边界，也为后续变更提供基线。
