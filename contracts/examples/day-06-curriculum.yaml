  - id: c2
    title: Token / 窗口 / 幻觉：能力与边界
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-06/section-02-token-window-hallucination/lesson.md
    content: '同学们，第二节，聊三个绑在一起的词：Token、上下文窗口、幻觉。你们调 API 时会看到 max_tokens、usage——今天搞懂它，以后就不会奇怪为什么对话越长越贵、越慢。

      Token 是模型读写的最小单位，不是一个字。英文 roughly 一个单词，中文 roughly 半个到一个字。GPT-4o 按输入输出 Token 计费——所以压缩 Prompt、清掉废话，是真省钱。Cursor 里贴整份 repo，就是在烧
      Token，对吧。

      上下文窗口是一次性能看到的 Token 上限。Claude 3.5 常见 200K，GPT-4o 128K——听起来很大，但一份 PRD 加架构加接口契约加聊天记录，很快就满。满了怎么办？截断旧的、摘要压缩、或者 RAG 只检索相关段——第三节细讲，对吧。

      幻觉 Hallucination：模型永远给最像真的答案，不是核实过的答案。你问一个不存在的论文，它也会编 DOI——这是机制，不是偶发 bug。所以 FDE 的铁律：关键事实必须可溯源，RAG 或人工验收，不能盲信，对吧。

      能力边界三句话：擅长模式匹配和语言生成；不擅长实时数据、精确计算、未训练过的私有事实；输出必须验收。驾驶舱摘要接口——模型写得好不好，你得对照 Rubric，对吧。

      记住：Token 是钱也是注意力；窗口是硬顶；幻觉是常态所以要验收。下一节 Prompt 和 RAG——怎么把有限窗口用在刀刃上，对吧。'
    practice: 完成标志：[ ] 能解释 input/output Token 与账单的关系；[ ] 举一个驾驶舱里可能出现幻觉的场景 + 对策；[ ] 说清「验收」比「再 prompt 一次」优先。
    resource_ids:
    - dg-llm-capability
    - glossary
    quiz:
    - - Token 和「一个汉字」的关系是？
      - - 完全相等
        - 中文约 0.6–1 字/Token，不是一字一 Token
        - Token 只用于英文
      - 1
      - API 账单按 Token 计——压缩 Prompt 是真省钱。
    - - 上下文窗口满了，常见策略不包括？
      - - 截断最早消息
        - 无限扩大窗口忽略成本
        - RAG 只检索相关片段
      - 1
      - 窗口是硬顶+成本顶——不能假装无限。
    - - 为什么说幻觉是「机制」不是 bug？
      - - 模型坏了要返厂
        - 训练目标是 plausible 接龙，不是 fact-check
        - 只有旧模型才幻觉
      - 1
      - 对策是 RAG+Eval+Guardrails，不是「再 prompt 一次就会好」。
