    local_prep:
      codex_prompt: "# 提示词 05 · 长任务 Loop + 人工确认闸（D9）\n\n> 整份粘贴。前置：`loop.py` 已能 tool_calls。\n\n---\n\n在本仓库实现 `agent/task_runner.py`：把「一个\
        \ goal」拆成多 turn，并在写操作前停下来等人确认。\n\n## 长任务\n\n```\nrun_goal(goal: str):\n  messages = [system_task, user(goal)]\n  while\
        \ turns < max_turns:\n    result = run_one_turn(messages)  # 复用 loop\n    if result.done: break\n    if result.needs_human_confirm:\n\
        \      pause → 等待 approve/reject API 或 CLI\n      if reject: 记录并停止或改计划\n  写 runs/<date>-goal/ 全量日志\n```\n\n## HITL（人工确认闸）硬性要求\n\
        \n- 任何 **写操作**（写文件、改数据库、调用变更类 API）前必须 `needs_human_confirm=true`  \n- 提供：\n  - `POST /api/agent/tasks` 启动  \n  - `POST\
        \ /api/agent/tasks/{id}/approve`  \n  - `POST /api/agent/tasks/{id}/reject`  \n- 证据：`runs/` 中同时保留 **approve 成功路径**\
        \ 与 **reject 中止路径** 各一次\n\n## Skill 编排\n\n仓库内 ≥2 个 Skill；长任务 goal 应能依次用到至少两个（例如：拉数 → 生成报告 →（确认后）写入 `runs/` 或草稿文件）。\n\
        \n## 验收\n\n- 单个 goal ≥3 个 turn  \n- 确认闸可演示通过与拒绝  \n- 日志可回放  \n\n先计划后编码。"
      checklist: []
quiz:
  pass_rate: 0.67
  questions:
  - q: 编排的核心思想？
    options:
    - Agent 自由决策
    - 业务流程拆成 Skill 串联，步骤定死（workflow）
    - 写一个超级 Prompt
    answer: 1
    explain: 你当流程设计师，AI 当流水线工人。
  - q: 确认闸三问？
    options:
    - 谁/什么/为什么
    - 看什么 / 谁来看 / 多久看一次
    - 快/好/省
    answer: 1
    explain: 闸不是点确定大赛——信息足够才能决策。
  - q: 确认界面最低信息？
    options:
    - 「发送吗？」
    - 草稿 + 关键数字 + 风险标红
    - 全部日志
    answer: 1
    explain: 信息不足 = 逼人盲批。
  - q: 执行日志三要素？
    options:
    - 时间 / 动作 / 结果
    - 输入 / 步骤 / 输出
    - 谁 / 在哪 / 用什么
    answer: 0
    explain: 案底三问：什么时候、谁干的、干成了什么。
  - q: 确认闸应放在？
    options:
    - 每一步前面
    - 不可撤回步骤（发送/改数据/花钱）之前
    - 最后一步后面
    answer: 1
    explain: 能撤回的自动连跑；不能撤回的必须有人工闸。
  - q: 信任分级是？
    options:
    - 永远全看
    - 连续通过降抽看 + 定期审计
    - 完全自动化
    answer: 1
    explain: 治「点确定大赛」的麻木——信任是工程设计。
  - q: 工具表从几件扩到几件？
    options:
    - 1 → 2
    - 1 → 3
    - 3 → 5
    answer: 1
    explain: 一件是助手，三件是团队——今天扩工具表。
  - q: 编排文档 orchestration.md 必须包含？
    options:
    - 只有步骤名
    - 串联图 + 数据流 + 确认闸位置 + 日志格式
    - 团队照片
    answer: 1
    explain: 施工图纸——按图施工，闸口才能拦得住。
  - q: 驳回路径必须？
    options:
    - 静默忽略
    - 退回重做、版本+1、留痕
    - 自动批准
    answer: 1
    explain: 回得来才算完整流水线——不是只有「通过」。
  - q: 拆分步骤「错了能撤回吗」影响？
    options:
    - 用什么框架
    - 决定确认闸是否必须
    - 代码风格
    answer: 1
    explain: 不可撤回 → 前面必须有人工闸。
  - q: 编排属于 workflow 还是 agent？
    options:
    - agent——让模型现想
    - workflow——步骤你定死
    - 两者一样
    answer: 1
    explain: Day 8 铁律：能 workflow 别 agent——编排就是 workflow。
  - q: GATE 9 闸口实测要求？
    options:
    - 口头描述即可
    - 跑到闸自动停，批准/驳回两条路径都跑通
    - 只测 happy path
    answer: 1
    explain: 拦得住、回得来、查得了。
  - q: 数据流对齐体现？
    options:
    - 随机拼接
    - 契约先行——A 的输出满足 B 的输入
    - 越厚越好
    answer: 1
    explain: 契约思想在编排里继续生效。
  - q: 一天弹 20 次确认的问题？
    options:
    - 效率太高
    - 第 21 次一定盲批——需要信任分级
    - 没有 problem
    answer: 1
    explain: 确认闸设计要治麻木，不是治 lazy。
  - q: 可撤回步骤前面要不要一律加确认闸？
    options:
    - 要，每步都闸最安全
    - 不必——闸留给不可撤回步骤，过多确认会诱发盲批
    - 永远不要闸
    answer: 1
    explain: 闸的密度是设计题：太稀失控，太密麻木。
  - q: GATE 9「查得了」最低靠什么证明？
    options:
    - 口头复述流程
    - 每步执行日志（时间/动作/结果）可独立回放
    - 只要 orchestration.md 写了就行
    answer: 1
    explain: 文档是施工图，日志是案底——两者都要。
