services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: fde
      POSTGRES_DB: fde
    ports:
      - "5433:5432"
    volumes:
      - fde_pg:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fde"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fdeadmin
      MINIO_ROOT_PASSWORD: fdeadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fde_minio:/data

volumes:
  fde_pg:
  fde_minio:
