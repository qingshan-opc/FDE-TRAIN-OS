project: 给前端接上真实规则与数据
project_brief: 学员承接 Day2 已通过 UI 复验的 frontend 目录和 frontend-api-needs.md， 指挥 @后端 先确认业务、数据与权限，再生成 API_Spec.md、DB_Schema.md 和本地后端服务；
  由 @前端 按接口合同完成联调，最后让 @测试 接收完整交付物。 Day3 重点是先合同后代码、单独验证再联调、责任岗位修复，不是背后端框架。
