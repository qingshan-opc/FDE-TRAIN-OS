day: 4
project: AI 时代的后端
project_brief: 前三天你交出了 PRD.md、architecture.md、index.html——今天给「部门周报助手」装心脏。看懂后端三件事（规则/存取/对话），用后端角色提示词产出 API_Spec.md 与 DB_Schema.md：3–5
  个 REST 接口 + 2–3 张带主键和索引的表，接口与表必须一一对得上。
resources:
- id: tk-backend
  title: 提示词下载 · Backend Engineer Agent（后端）
  kind: download
  summary: 整份粘进 AI 工具即用的后端提示词，产出 OpenAPI 与数据库设计
  url: /course-assets/resources/prompt-toolkit/Backend_Engineer_Agent_Prompt.md
- id: tk-readme
  title: 提示词工具包 · 使用说明
  kind: download
  summary: 四要素 + 两接口
  url: /course-assets/resources/prompt-toolkit/README.md
capsule_extra:
  c1:
    resource_ids:
    - tk-readme
    quiz:
    - - 「连续两周未交周报的同事标红」这条规则，最应该住在哪里？
      - - 前端页面 index.html 里
        - 后端的业务逻辑里
        - 数据库的索引里
      - 1
      - 规则要住在用户够不着的后厨——页面在用户手里，能被改、被绕过。
    - - AI 时代，后端这个角色最升值的能力是什么？
      - - 手写增删改查（CRUD）的速度
        - 定义接口契约与数据模型
        - 背熟某个框架的全部 API
      - 1
      - CRUD 是体力活，AI 写得比人快；人的价值上移到把菜单和货架图画清楚。
    tools:
    - name: 后端三件事口诀卡
      note: 业务逻辑 · 数据 · 接口
    - name: 餐厅后厨类比卡
      note: 顾客不进后厨，只凭菜单交流
  c2:
    resource_ids:
    - tk-readme
    quiz:
    - - GET /reports?week=2026-W30 这条接口设计，体现了 REST 的哪条原则？
      - - URL 里包含具体动作
        - URL 表示东西、HTTP 方法表示动作
        - 查询参数决定用哪个方法
      - 1
      - REST 一句话：URL 表示东西（/reports），动词表示动作（GET 拿来、POST 新交）。
    - - 同事提交了一份空白周报，后端最合理的响应是？
      - - 200 OK，存下来再说
        - 400 Bad Request，请求内容不合法
        - 500 Internal Server Error，后厨着火
      - 1
      - 空白内容是调用方单子填错了——400 的锅在点菜的人；500 是后厨自己的问题。
    tools:
    - name: REST 点菜模型卡
      note: URL 表东西，动词表动作
    - name: 错误码速查
      note: 400 你的锅 · 404 没有 · 500 我的锅
  c3:
    resource_ids: []
    quiz:
    - - reports 表里的 user_id 列（指向 users 表主键），它的身份是？
      - - 主键
        - 外键
        - 索引
      - 1
      - 外键是行李牌——写着这条记录属于另一张表的哪一行，谁交的周报表一查便知。
    - - 给数据库每一列都加上索引，会发生什么？
      - - 查询全面变快，没有代价
        - 查询变快，但写入越来越慢
        - 数据自动备份
      - 1
      - 索引是书的目录——每进一本新书目录都要更新，查得快、写得慢，不是越多越好。
    tools:
    - name: 表 / 主键 / 索引三概念卡
      note: Excel · 身份证 · 书的目录
    - name: 「查得快写得慢」便签
      note: 索引不是越多越好
  c4:
    resource_ids:
    - tk-backend
    quiz:
    - - Backend_Engineer_Agent_Prompt 对 API 定义文档的强制要求是什么格式？
      - - 自由排版的 Markdown 表格
        - OpenAPI 3.0（YAML 或 JSON）
        - Word 文档截图
      - 1
      - OpenAPI 是机器也能读的菜单——前端、后端、测试签的是同一份合同。
    - - 让 AI 生成后端设计，最稳的第一步是？
      - - 直接说「给我完整后端设计」
        - 喂入 PRD 与架构文档，并让它先问澄清问题
        - 先要代码，文档以后补
      - 1
      - 直接要成品只能得到模板货；先喂上下文、先让它问，产出才对得上你的项目。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '你是资深后端工程师。这是我的项目背景：产品「部门周报助手」，下面附上我的 PRD.md 与 architecture.md（页面原型 index.html 已完成，数据目前写死）。


        请严格按以下流程工作，不要一步到位：

        1. 动笔前，先问我 3 个澄清问题：核心数据实体有哪些、谁会调用这些接口、数据量级多大；

        2. 我回答后，先只输出 3–5 个 REST 接口的一行清单（路径 + 方法 + 一句话用途），等我确认；

        3. 确认后逐个展开为 API_Spec.md：每个接口必须包含路径、HTTP 方法、请求参数（类型/是否必填）、成功响应（状态码 + 响应体结构）、至少一个错误响应（400/404/500 任选并写明触发场景）；

        4. 然后输出 DB_Schema.md：2–3 张表，每张表列出列名、类型、约束（主键/外键/非空），每张表必须有主键，全库至少给出一条索引建议并写明理由；

        5. 最后逐个接口标注它读写哪张表的哪几列——对不上的，修正设计直到一一对应。


        两份文件都保存到当前工作区根目录。

        '
      checklist:
      - 先拿到 AI 的 3 个澄清问题并逐条回答，再进入生成
      - 接口清单确认无误后才让 AI 逐个展开
      - 每个接口四要素齐全：路径、方法、成功响应、错误响应
      - 每张表有主键，全库至少一条索引建议且能复述理由
      - API_Spec.md 与 DB_Schema.md 均已落盘且互相能对上
      suggested_questions:
      - 每个接口的错误响应分别设计在什么场景？能不能都只用 500？
      - reports 表查询最多的场景是按人查还是按周查？索引该怎么加？
      - 接口清单里有没有我页面根本用不到的？删掉它们的设计依据是什么？
      template_resource_id: tk-backend
    tools:
    - name: 接口-表对照检查单
      note: 每个接口的数据都能在某张表里找到
  c5:
    resource_ids:
    - tk-backend
    quiz:
    - - 过闸标准里「接口与表能对上」指的是什么？
      - - 接口数量必须等于表的数量
        - 每个接口读写的数据，都能在某张表里找到出处
        - 表名必须与接口路径同名
      - 1
      - 菜单上的每道菜，仓库里必须找得到食材——对不上就是设计漏了洞。
    - - 一份 API 设计只写了成功响应 200，没有任何错误响应，正确的处理是？
      - - 可以通过，出错的情况以后再说
        - 打回——错误响应是契约的一部分
        - 把 200 改成 201 就算完整
      - 1
      - 只设计成功的菜单是半成品；400/404/500 是给排查问题的人留的路标。
    tools:
    - name: 接口设计过闸清单
      note: 路径+方法+错误响应 · 表有主键 · 接口与表对得上
    - name: 快测范围卡
      note: 考点全部来自今天前五节
quiz:
- - 后端的三件事，正确的一组是？
  - - 业务逻辑、数据存取、接口对话
    - 页面、样式、动画
    - 模型、算力、语料
  - 0
  - 规则、存取、对话——后厨的三件事；页面是前端，模型是另一层。
- - AI 时代后端工作中，最值得人来做的部分是？
  - - 快速手写增删改查代码
    - 定义接口契约与数据模型
    - 背诵框架源码
  - 1
  - 体力活在贬值，把菜单和货架图画清楚的判断力在升值。
- - 前端请求「查看第 99 周的报表」，而数据里根本没有这一周，最合适的响应码是？
  - - '400'
    - '404'
    - '500'
  - 1
  - 要的东西后厨没有——404 表示资源不存在；400 是单子填错，500 是后厨自己着火。
- - 主键（Primary Key）的作用是？
  - - 让每一行记录有唯一身份
    - 让表能存更多数据
    - 自动备份该行数据
  - 0
  - 主键是每行的身份证——唯一、不为空、发了不回收；两个张伟可以同名，工号不能同号。
- - 关于索引（Index），正确的说法是？
  - - 加得越多整体性能越好
    - 查询变快但写入变慢，只加在常被查询的列上
    - 只能加在主键列上
  - 1
  - 索引是书的目录：查得快、写得慢，每加一本新书目录都要跟着更新。
- - 后端提示词强制要求 API 文档用 OpenAPI 格式，根本原因是？
  - - YAML 比 Markdown 好看
    - 前端、后端、测试能以同一份机器可读的合同协作
    - OpenAPI 文档运行速度更快
  - 1
  - 三方签同一份合同，谁违约一目了然——格式只是手段，协作才是目的。
lab:
  primary_files:
  - API_Spec.md
  - DB_Schema.md
  prompt: '你是学员的后端设计助手。背景：FDE 训练营 Day 4，学员已有 PRD.md、architecture.md、index.html（产品：部门周报助手），现在要设计后端。


    任务：先读 PRD.md 与 architecture.md，引导学员生成两份交付物：

    1. API_Spec.md——3–5 个 REST 接口，每个接口含：路径、HTTP 方法、请求参数、成功响应、错误响应（400/404/500 中至少一个并写明触发场景）；

    2. DB_Schema.md——2–3 张表，每张表含：列名、类型、主键，全库至少一条索引建议并写明理由。


    工作要求：

    - 动笔前先问 3 个澄清问题：核心数据实体有哪些、谁调用这些接口、数据量级多大；学员回答后再开始设计；

    - 先给接口一行清单（路径+方法+用途），学员确认后再逐个展开；

    - 接口与数据表必须一一对应得上：逐个接口标注它读写哪张表的哪几列，对不上就修正设计；

    - 术语第一次出现配一句人话解释；不要替学员直接甩出完整答案，用提问引导他自己做取舍（如「查询最多的场景是按人还是按周？这决定索引加在哪」）。

    '
  rubric:
  - check: file_exists
    args:
      path: API_Spec.md
  - check: file_exists
    args:
      path: DB_Schema.md
  - check: text_contains
    args:
      path: API_Spec.md
      needle: GET
  - check: text_contains
    args:
      path: DB_Schema.md
      needle: 主键
nodes_lab: API 与数据库设计（部门周报助手）
