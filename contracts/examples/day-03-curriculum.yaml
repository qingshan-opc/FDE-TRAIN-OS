  - id: c1
    title: 后端不是黑窗口：传统职能 vs AI 时代后端
    minutes: 15
    form: 认知+对比
    content_ref: class/bootcamp/day-03/section-01-backend-role/lesson.md
    content: （见本节 lesson.md）
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - backend-role-card
    - agent-backend
    tools:
    - name: 餐厅类比图
      note: 前端点菜、API 菜单、后端厨房、数据库仓库
    - name: 后端责任边界
      note: 不改需求、不改 UI、不编业务规则、不写真实密钥
    quiz:
    - - 后端的三件核心工作是什么？
      - - 颜色、字号、间距
        - 业务规则、数据存取、接口对话
        - 需求、原型、部署
      - 1
      - 后端负责规则、数据和前后端对话。
    - - AI 时代后端人员更重要的责任是什么？
      - - 只追求生成代码数量
        - 定义合同、模型、安全和错误处理并验收
        - 自行修改前端设计
      - 1
      - 代码生成变快后，错误合同会被更快放大。
    media:
