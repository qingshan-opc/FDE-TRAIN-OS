    glossary_terms:
    - id: gt-product-manager
      term: 产品经理
      plain: 负责确认做什么、为什么做以及怎样算合格。
    - id: gt-ui
      term: UI/UX
      plain: 负责页面信息结构、操作流程和视觉体验。
    - id: gt-frontend
      term: 前端
      plain: 把设计实现为用户能看到和操作的正式页面。
    - id: gt-backend
      term: 后端
