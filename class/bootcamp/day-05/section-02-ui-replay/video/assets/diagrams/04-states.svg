<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-label="加载、空、错三态"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/></pattern><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/></marker></defs><rect width="1040" height="430" fill="#ffffff"/><rect width="1040" height="430" fill="url(#dots)"/><circle cx="976" cy="56" r="86" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/></circle><circle cx="52" cy="380" r="60" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="60;72;60" dur="11s" repeatCount="indefinite"/></circle><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="32" y="26" width="6" height="24" rx="3" fill="#0d9488"/><text x="48" y="45" font-size="20" font-weight="800" fill="#231f20">加载 · 空 · 错 三态</text><text x="1008" y="43" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.42)">THREE STATES</text></g><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="60" y="50" width="280" height="250" rx="18" fill="#ffffff" filter="url(#sh)"/><text x="80" y="84" font-size="15" font-weight="800" fill="#231f20">加载中</text><text x="80" y="102" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">LOADING</text><g><circle cx="200" cy="148" r="16" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="50 30"><animateTransform attributeName="transform" type="rotate" from="0 200 148" to="360 200 148" dur="1.6s" repeatCount="indefinite"/></circle></g><rect x="90" y="190" width="220" height="12" rx="6" fill="rgba(35,31,32,.10)"><animate attributeName="opacity" values="1;.45;1" dur="2.2s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="90" y="214" width="180" height="12" rx="6" fill="rgba(35,31,32,.10)"><animate attributeName="opacity" values="1;.45;1" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></rect><rect x="90" y="238" width="200" height="12" rx="6" fill="rgba(35,31,32,.10)"><animate attributeName="opacity" values="1;.45;1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></rect><text x="200" y="280" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">骨架屏：先给形状，再给数据</text><rect x="390" y="50" width="280" height="250" rx="18" fill="#ffffff" filter="url(#sh)"/><text x="410" y="84" font-size="15" font-weight="800" fill="#231f20">空态</text><text x="410" y="102" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">EMPTY</text><rect x="440" y="122" width="180" height="72" rx="12" fill="none" stroke="rgba(35,31,32,.25)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="530" y="163" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">暂无数据</text><rect x="455" y="214" width="150" height="32" rx="16" fill="url(#tg)"/><text x="530" y="235" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">去接入数据 →</text><text x="530" y="280" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">空白不是终点：给一条下一步</text><rect x="720" y="50" width="280" height="250" rx="18" fill="#ffffff" stroke="rgba(242,78,84,.45)" stroke-width="1.5" filter="url(#sh)"/><text x="740" y="84" font-size="15" font-weight="800" fill="#c92f3d">出错</text><text x="740" y="102" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">ERROR</text><circle cx="860" cy="138" r="18" fill="none" stroke="#f24e54" stroke-width="2.5"><animate attributeName="opacity" values="1;.5;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="860" y="145" text-anchor="middle" font-size="18" font-weight="800" fill="#f24e54">!</text><text x="860" y="184" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.65)">数据暂时没拉取成功</text><rect x="785" y="204" width="150" height="32" rx="16" fill="#231f20"/><text x="860" y="225" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f2f5f0">重试</text><text x="860" y="264" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.45)">错误码记进日志，不给用户看</text><text x="520" y="348" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">三态是页面的基本礼貌：V0.1 先占位，第三天 接真接口后变真</text><rect x="262" y="360" width="516" height="30" rx="15" fill="rgba(13,148,136,.08)"/><text x="520" y="380" text-anchor="middle" font-size="12" fill="#0f766e">铁律：出错文案说人话——「500 Internal Server Error」永远不该出现在用户眼前</text></g></svg>
