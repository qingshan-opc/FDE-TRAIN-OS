camp_version: v0.7
day: 4
title: 找问题、修问题、确认能交付
week: 1
project: 真实检查、问题修复和交付前稳定版本
project_brief: 学员指挥测试工程师从 PRD 验收标准倒推用例，但必须亲手执行测试；随后把缺陷分派给责任岗位、复测回归，并以证据清单完成 V0.9 功能冻结。
review_checklist:
- 测试用例来自 PRD 且覆盖正常、边界、异常
- 测试结果由学员亲手执行，不是 Agent 自报
- 真实缺陷完成责任分派、修复、复测和回归
- 验收清单的每一项都有证据
- V0.9 功能冻结后未增加新功能
