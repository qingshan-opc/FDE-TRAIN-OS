# All-in-one platform: nginx on :8080 → API (127.0.0.1:8760) + static SPA.
server {
  listen 8080;
  server_name _;
  client_max_body_size 64m;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location /api/ {
    proxy_pass http://127.0.0.1:8760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:8760/healthz;
  }

  location = /livez {
    proxy_pass http://127.0.0.1:8760/livez;
  }

  location = /readyz {
    proxy_pass http://127.0.0.1:8760/readyz;
  }

  location /course-assets/ {
    proxy_pass http://127.0.0.1:8760;
    proxy_set_header Host $host;
  }

  location /docs {
    proxy_pass http://127.0.0.1:8760;
    proxy_set_header Host $host;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /app/ {
    try_files $uri $uri/ /index.html;
  }

  location /author/ {
    try_files $uri $uri/ /index.html;
  }

  location = /login {
    try_files $uri /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
