<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-label="Agent 决策环">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="500" fill="#ffffff"/>
  <rect width="1040" height="500" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="452" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">Agent 决策环：理解 → 规划 → 调用 → 观察 → 继续</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">AGENT LOOP</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="362" y="200" width="316" height="100" rx="26" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="370" y="208" width="300" height="84" rx="18" fill="url(#tlg)" filter="url(#glow)"/><text x="520" y="244" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">模型 + Harness（骨架）</text><text x="520" y="268" font-size="10.5" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">工具表 · 记忆 · 规划 · 重试 · 日志</text></g>
<ellipse cx="520" cy="246" rx="185" ry="160" fill="none" stroke="rgba(13,148,136,.35)" stroke-width="2.5" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></ellipse>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="520" cy="80" r="30" fill="#fff" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
<text x="520" y="86" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">1</text>
<text x="520" y="24" font-size="13.5" font-weight="800" fill="#231f20" text-anchor="middle">理解任务</text>
<text x="520" y="42" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">读懂目标</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="682" cy="197" r="30" fill="#fff" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
<text x="682" y="203" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2</text>
<text x="726" y="193" font-size="13.5" font-weight="800" fill="#231f20">规划</text>
<text x="726" y="211" font-size="10.5" fill="rgba(35,31,32,.5)">拆步骤</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="620" cy="388" r="30" fill="#fff" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
<text x="620" y="394" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">3</text>
<text x="620" y="448" font-size="13.5" font-weight="800" fill="#231f20" text-anchor="middle">调用工具</text>
<text x="620" y="466" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">调 Skill · Tool Calling</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="420" cy="388" r="30" fill="#fff" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
<text x="420" y="394" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">4</text>
<text x="420" y="448" font-size="13.5" font-weight="800" fill="#231f20" text-anchor="middle">观察结果</text>
<text x="420" y="466" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">看结果对不对</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="358" cy="197" r="30" fill="#fff" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
<text x="358" y="203" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">5</text>
<text x="314" y="193" font-size="13.5" font-weight="800" fill="#231f20" text-anchor="end">继续 · 求助</text>
<text x="314" y="211" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="end">循环或交还人类</text>
</g>
</svg>
