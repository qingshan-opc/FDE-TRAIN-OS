<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="prototype vs prod">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.14)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="504" cy="56" r="86" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="416" r="62" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="62;74;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="24" width="6" height="26" rx="3" fill="#0d9488"/>
    <text x="46" y="43" font-size="19" font-weight="800" fill="#231f20">先样板间，再正式上线</text>
    <text x="532" y="41" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.8" fill="rgba(35,31,32,.42)">SHOWROOM ≠ PRODUCT</text>
  </g>
<g transform="translate(36,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="224" height="254" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <rect width="224" height="42" rx="18" fill="url(#tealSoft)"/>
      <rect y="34" width="224" height="8" fill="#fff"/>
      <text x="20" y="27" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#0f766e">SHOWROOM</text>
      <text x="20" y="82" font-size="20" font-weight="800" fill="#231f20">样板间</text>
      <rect x="22" y="109" width="15" height="15" rx="4" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <text x="48" y="122" font-size="14" fill="#231f20">门能点</text>
      <rect x="22" y="147" width="15" height="15" rx="4" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <text x="48" y="160" font-size="14" fill="#231f20">流程能走</text>
      <rect x="22" y="185" width="15" height="15" rx="4" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <text x="48" y="198" font-size="14" fill="#231f20">内容看得懂</text>
      <text x="20" y="232" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#0d9488">TODAY</text>
    </g>
<text x="280" y="222" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="30" font-weight="700" fill="#0d9488">≠</text>
<g transform="translate(300,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="224" height="254" rx="18" fill="rgba(35,31,32,.04)" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
      <rect width="224" height="42" rx="18" fill="rgba(35,31,32,.08)"/>
      <rect y="34" width="224" height="8" fill="rgba(35,31,32,.04)"/>
      <text x="20" y="27" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.45)">PRODUCT</text>
      <text x="20" y="82" font-size="20" font-weight="800" fill="#231f20">正式上线</text>
      <rect x="22" y="109" width="15" height="15" rx="4" fill="none" stroke="rgba(35,31,32,.35)" stroke-width="1.5"/>
      <text x="48" y="122" font-size="14" fill="rgba(35,31,32,.75)">接入数据库</text>
      <rect x="22" y="147" width="15" height="15" rx="4" fill="none" stroke="rgba(35,31,32,.35)" stroke-width="1.5"/>
      <text x="48" y="160" font-size="14" fill="rgba(35,31,32,.75)">权限与部署</text>
      <rect x="22" y="185" width="15" height="15" rx="4" fill="none" stroke="rgba(35,31,32,.35)" stroke-width="1.5"/>
      <text x="48" y="198" font-size="14" fill="rgba(35,31,32,.75)">完整业务闭环</text>
      <text x="20" y="232" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.45)">LATER</text>
    </g>
<g transform="translate(36,362)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="488" height="72" rx="18" fill="url(#teal)" filter="url(#glow)"/>
      <text x="244.0" y="34.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">先确认方向，再增加开发成本</text>
      <text x="244.0" y="58.0" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(255,255,255,.78)">MATURE PRACTICE · NOT LAZY</text>
      </g>
</svg>
