learn:
  lingzhi_tags:
  - camp:v0.7
  - day:5
  - project:role-week
  estimated_minutes: 150
  require_capsules: true
  capsules:
  - id: c1
    title: 回放全流程：软件不是一次生成出来的
    minutes: 30
    form: 系统讲解+复盘
    content_ref: class/bootcamp/day-05/section-01-worldview-plain/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：前四天的文件不是零散作业，而是一条逐步减少不确定性的研发链：问题、范围、需求、原型、前端、契约、后端、测试、交付。


      请记住三件事。


      「每个岗位的输入来自上一岗位的已批准交付。」


      「学员的核心动作是下达任务、检查证据、纠偏和批准。」


      「AI 加速产出，但不能替学员承担方向和验收责任。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：用自己项目的文件路径重画一遍完整研发流程。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent'
      note: 本节交付：研发全流程图
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 软件为什么不是一次提示词生成出来的？
      - &id001
        - 模型速度不够
        - 需求、设计、实现和验证需要逐步交接与确认
        - 文件太多
      - 1
      - 逐步批准能控制范围和质量。
    - - 学员在 AI 团队中的核心职责是什么？
      - &id002
        - 手写全部代码
        - 方向、判断、验收和最终责任
        - 只负责观看
      - 1
      - AI 负责加速，学员负责决定与验证。
    local_prep:
      codex_prompt: '@项目经理 Agent 请只读当前项目，创建 docs/D5-L1_研发全流程图.md。按真实发生顺序串联：选题 → 项目任务书 → PRD → UI 原型 → 前端 Mock → 接口契约 → SQLite
        与真实接口 → 前后端联调 → 测试修复 → 功能冻结 → 本地交付。

        每一步写负责人、输入文件、输出文件、学员验收动作和当时的状态。不要把没有发生的步骤补写成完成。'
      checklist:
      - 流程包含完整岗位交接
      - 每步能指向真实文件
      - 区分原型、Mock、真实接口和已发布状态
      - 能解释至少一次学员纠偏如何影响后续
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 拆开系统：页面、接口和数据库如何合作
    minutes: 30
    form: 系统讲解+演示
    content_ref: class/bootcamp/day-05/section-02-enterprise-digital-stages/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：驾驶舱是前端看到的结果；真正支撑它的是业务表单、后端规则、数据库记录和统计接口。


      请记住三件事。


      「前端负责展示和交互。」


      「后端负责业务规则与接口。」


      「数据库保存可追溯事实，看板统计把事实聚合为管理信息。」


      「第二周的 Agent 将读取这些业务事实产生建议，但仍需人工确认。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：从驾驶舱点击到列表，再提交一条记录并观察数据如何返回看板。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：一条可讲清的数据链路
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 驾驶舱看板属于系统的哪一部分？
      - &id003
        - 前端展示
        - 数据库
        - 测试报告
      - 0
      - 看板是用户看到的前端，但数据来自后端统计。
    - - 支撑看板数字的最终事实在哪里？
      - &id004
        - 按钮里
        - 数据库业务记录中
        - 口播稿里
      - 1
      - 数据库保存真实业务记录，统计接口据此计算。
    local_prep:
      codex_prompt: '请作为讲解教练，读取 docs/D3-L1_项目地图.md 和 docs/D3_冒烟记录.md，一次只问我一个问题，直到我能不用技术黑话讲清：用户提交后数据经过哪些层、为什么看板数字会变化、AI 在第二周插在哪个位置。

        最后把我答错或含糊的地方整理到 docs/D5-L2_理解补缺.md，不修改代码。'
      checklist:
      - 能区分前端、后端和数据库
      - 能从一次提交讲到看板更新
      - 能说明接口契约的作用
      - 能说明 Week2 AI 读取什么、为什么要人工确认
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 指挥运维：让另一个人按说明跑起来
    minutes: 30
    form: 实操+交付
    content_ref: class/bootcamp/day-05/section-03-how-software-built/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：本地运行不等于公网部署，更不能写成已上线；第一周验收的是换一个人也能按说明运行。


      请记住三件事。


      「运维检查环境前提、启动顺序、端口、数据库位置和停止方式。」


      「不引入 Docker，也不做公网发布。」


      「真实运行必须有访问地址、健康检查或页面证据。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：让运维工程师按现状整理本地交付，并由学员模拟新接手者验证。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@运维工程师 Agent'
      note: 本节交付：本地交付检查与运行证据
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 本地能打开能否称为已上线？
      - &id005
        - 能
        - 不能，最多说明可本地演示
        - 有截图就能
      - 1
      - 发布状态必须与实际部署事实一致。
    - - 第一周为什么不教 Docker？
      - &id006
        - Docker 没价值
        - 它会增加与课程目标无关的环境复杂度
        - AI 不会用
      - 1
      - 第一周聚焦研发逻辑和本地可交付。
    local_prep:
      codex_prompt: '@运维工程师 Agent 请阅读当前代码和 README，为桌面 Web 项目完成本地交付检查：环境前提、安装步骤、前后端启动顺序、端口、SQLite 文件位置、停止方式和常见错误。把结果写入 docs/D5-L3_本地交付检查.md。

        边界：不使用 Docker，不做公网部署；本地可运行只能标“READY_FOR_LOCAL_DEMO”，不能写 RELEASED 或“已上线”。请列出实际执行的验证并以 REVIEW 状态交付。'
      checklist:
      - 运行步骤从空环境假设写起
      - 前后端启动和端口明确
      - SQLite 位置和数据保留方式明确
      - 学员按说明重新跑通
      - 状态没有夸大为上线
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 写 README、复盘和五分钟路演
    minutes: 35
    form: 实操
    content_ref: class/bootcamp/day-05/section-04-server-cloudnative/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：README 让下一个人接手，复盘让下一次少走弯路，路演让非技术人员理解价值、证据和限制。


      请记住三件事。


      「README 说清这是什么、怎么运行、结构与团队、已知限制。」


      「复盘写目标达成、偏差、卡点和可复制经验。」


      「路演从驾驶舱真实统计开始，再演示一条记录全链路。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：完善三份交付文档，内容由学员提供，Agent 只负责结构和校对。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：正式 README + 项目复盘 + 路演提纲
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - README 最重要的读者是谁？
      - &id007
        - 刚写完代码的自己
        - 第一次接手项目的人
        - 只有 AI
      - 1
      - README 要让陌生接手者能够理解和运行。
    - - 路演为什么从驾驶舱开始？
      - &id008
        - 图表好看
        - 先展示管理价值，再用一条记录证明数据链路
        - 可以跳过后端
      - 1
      - 价值和证据要连在一起。
    local_prep:
      codex_prompt: '请先读 docs/PRD.md、docs/D4-L4_验收清单.md 和现有 README，再协助我完成三件事：

        1. 完善 README：这是什么、如何从零运行、目录与七岗位团队、已知限制和下一步；

        2. 创建 docs/D5_项目复盘.md 框架：目标达成、偏差原因、最大卡点、三条可复制经验，正文由我填写；

        3. 创建 docs/D5_五分钟路演.md 提纲：价值 → 驾驶舱真实统计 → 提交一条记录并展示入库/列表/详情/看板更新 → 当前限制 → 第二周计划。

        必须明确“AI 分析区｜Week2 接入”，当前样例为演示数据，不要夸大功能。'
      checklist:
      - README 四部分齐全且按步骤可运行
      - 限制与未完成项真实
      - 复盘包含具体数字或事件
      - 路演能在五分钟内讲清价值、证据和边界
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 综合验收：你能不能讲清它是怎么来的
    minutes: 25
    form: 验收+收束
    content_ref: class/bootcamp/day-05/section-07-accept-map/lesson.md
    content: '同学们好，我是你们的老师404。


      这一节我们只解决一个问题：第一周的合格标准不是代码行数，而是项目能运行、证据链完整，并且学员能讲清每个岗位如何把需求变成产品。


      请记住三件事。


      「演示完整业务链路并抽查统计。」


      「提交需求、设计、实现、数据、测试、交付证据。」


      「第二周只在已预留接口接 Skill、Agent 和真实 AI，不重做第一周业务系统。」


      接下来你们要做的不是听懂就算，而是完成这项真实任务：进行最终演示、口述答辩和第二周交接检查。


      AI 可以生成文件、代码和建议，但批准权不能交出去。你要看实际文件、亲手验证，再决定通过还是返工。


      同学们，本节先到这里。'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent + 学员演示'
      note: 本节交付：Week1 验收包与 Week2 交接
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 第一周最重要的学习成果是什么？
      - &id009
        - 记住某个框架
        - 能指挥 AI 团队并讲清产品如何逐步形成
        - 生成最多文件
      - 1
      - 工具会变，开发与验收逻辑可以迁移。
    - - 第二周应该从哪里继续？
      - &id010
        - 推翻第一周重做
        - 在预留接口接入 Skill、Agent 和真实 AI
        - 把演示数据改名为 AI
      - 1
      - 第一周业务系统是第二周智能化的地基。
    local_prep:
      codex_prompt: '@项目经理 Agent 请按 docs/D4_报审材料清单.md、docs/D5-L1_研发全流程图.md 和 README 组织 Week1 综合验收，但不要替我判定通过。

        请依次让我完成：运行项目；演示驾驶舱 → 提交 → SQLite → 列表 → 详情 → 看板更新；解释七岗位交接；展示一次纠偏和一次缺陷闭环；说明 AI 当前为何未接入以及第二周从哪个接口继续。

        将结果记录到 docs/D5_综合验收.md：证据、通过/不通过、遗留项和补救计划。最终批准由我或课程导师给出。'
      checklist:
      - 项目能按 README 本地运行
      - 业务链路可重复演示
      - 五天主要证据文件齐全
      - 学员能讲清各层和各岗位
      - AI 边界与第二周接入点明确
      - 未通过项有补救计划
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 软件为什么不是一次提示词生成出来的？
    options: *id001
    answer: 1
    explain: 逐步批准能控制范围和质量。
  - q: 学员在 AI 团队中的核心职责是什么？
    options: *id002
    answer: 1
    explain: AI 负责加速，学员负责决定与验证。
  - q: 驾驶舱看板属于系统的哪一部分？
    options: *id003
    answer: 0
    explain: 看板是用户看到的前端，但数据来自后端统计。
  - q: 支撑看板数字的最终事实在哪里？
    options: *id004
    answer: 1
    explain: 数据库保存真实业务记录，统计接口据此计算。
  - q: 本地能打开能否称为已上线？
    options: *id005
    answer: 1
