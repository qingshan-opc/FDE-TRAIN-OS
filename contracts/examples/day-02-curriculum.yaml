  capsules:
  - id: c1
    title: 先搭一个能运行的页面框架
    minutes: 20
    form: 实操
    content_ref: class/bootcamp/day-02/section-01-architect-role/lesson.md
    content: '同学们好。盖房子不会一上来就买家具，而是先把地基、房间和通道搭好。做页面也一样。


      这一节先让页面工程师只搭框架，不填具体功能。你要能看到项目里有哪些区域，四个页面分别从哪里进入，所有页面共用的顶部和侧边栏放在哪里。


      工程师把“进入不同页面的地址”叫页面路由，把“可以重复使用的页面小块”叫组件。你不用背定义，只要能看懂：点击菜单能到正确页面，同样的导航不用每页重做，一块内容出了问题可以单独修改。


      给 AI 的要求是：先列出准备怎么拆，再搭四个空页面，启动给我看，等我确认后再继续。这样你能看见项目是一层层长出来的，而不是等 AI 一次性变出一个黑箱。


      验收只看三件事：项目能启动，四个页面都能打开，所有页面有统一外框。页面还是空的很正常，这一阶段只验框架。


      记住这句话：**先把房间和通道搭好，再往里面放东西；能启动、能打开、有统一外框，框架才算立住。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：可运行工程骨架与四个空路由
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 页面框架阶段最合格的结果是什么？
      - - 四个页面都已经塞满功能
        - 项目能启动，四个空页面能打开，并且外框统一
        - 页面配色已经做到最漂亮
      - 1
      - 口播稿把这一阶段比作盖房子先立框架，不要求提前搬进家具。
    knowledge_cards:
    - id: d2l1-k1
      term: 先列方案再动手
      plain: 先让页面工程师说清准备怎样拆、有哪些页面，学员确认后再开始制作。
    - id: d2l1-k2
      term: 框架阶段保持空白
      plain: 这一阶段只搭页面入口和统一外框，不提前把具体功能全部塞进去。
    - id: d2l1-k3
      term: 用三件事验收
      plain: 项目能启动、四个页面能打开、所有页面有统一外框，三项都通过才继续。
    memory_sentence: 先把房间和通道搭好，再往里面放东西；能启动、能打开、有统一外框，框架才算立住。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请读已批准的需求和页面样稿，先把项目运行起来，只搭四个空白页面和公共导航。用大白话告诉我主要文件夹各放什么，带我逐页打开检查。等我批准后再做页面内容，不要一次全部做完。'
      checklist:
      - 项目能启动
      - 四个空路由可访问
      - 能说出页面、组件和公共布局放在哪里
      - README 记录启动方式
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 做一个会提醒填错内容的提交页
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-02/section-02-four-layer/lesson.md
    content: '提交页是用户把信息交给系统的入口。这个页面做得不好，用户要么填不明白，要么填错后不知道怎么改。


      页面有哪些内容，不由页面工程师自由发挥，而是来自昨天已经批准的需求文档。哪些必须填、金额能不能为负数、说明最少写多少字，都要按文档执行。


      检查分三层。第一，必须填写的内容不能留空。第二，数字、字数和范围要符合规则。第三，提示必须说人话，要告诉用户哪一项错了、应该怎么改，不能只冒出一串英文或错误编号。


      还有一条体验底线：填错一项时，已经填好的其他内容不能被清空。


      验收时请故意当一个会犯错的用户：空着提交，填负数，说明只写几个字，再填一份完全正确的内容。只有真正试过错误数据，才能证明提醒不是摆设。


      记住这句话：**规则来自需求文档，验收提交页的办法，是亲手输入错误内容。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：可填写、可校验的提交页
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 怎样才能证明提交页的错误提醒真的有效？
      - - 看见页面上有红色提示文字
        - 亲手输入空白、负数等错误内容并尝试提交
        - 让 AI 口头保证已经检查
      - 1
      - 只有真实输入错误内容，才能确认页面真的阻止了错误提交。
    knowledge_cards:
    - id: d2l2-k1
      term: 填写规则来自需求
      plain: 哪些必须填、数字范围和字数限制，都以已经批准的需求文档为准。
    - id: d2l2-k2
      term: 提醒分成三层
      plain: 检查是否漏填、格式和范围是否正确，再用中文告诉用户怎么修改。
    - id: d2l2-k3
      term: 填错不能全部清空
      plain: 用户只应修改出错的那一项，已经填写正确的内容必须保留。
    memory_sentence: 规则来自需求文档，验收提交页的办法，是亲手输入错误内容。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请按已批准的页面样稿做好提交页。填写错误时要用普通员工能看懂的中文提醒。请边做边告诉我每个输入项从哪条需求来；完成后带我分别试一次正常填写和错误填写，等我批准。'
      checklist:
      - 字段与 PRD 逐项一致
      - 必填和边界校验真实生效
      - 提示语为中文业务语言
      - 正常输入能够提交到当前 Mock 数据层
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 用演示数据做出列表页
    minutes: 25
    form: 实操
    content_ref: class/bootcamp/day-02/section-03-arch-selection/lesson.md
    content: '数据工程师明天才开始保存真实记录，今天列表页先用演示数据。行业里有人把这种临时数据叫模拟数据，你知道它是假数据即可，不需要记英文名称。


      演示数据不能写成“测试一、测试二、测试三”。至少准备五到八条，覆盖待处理、处理中、已完成等不同状态，还要有一条能讲故事的数据，例如金额特别高的费用，或长时间没有处理的员工诉求。


      列表页要帮助用户回答三个问题：现在有哪些记录，每条到了什么状态，我想找的那条在哪里。因此需要清楚的字段、状态标记和筛选方式。


      所有页面只能使用同一份演示数据。列表里显示金额八百，点进详情也必须是八百。数据不能在每个页面各写一份，否则迟早对不上。


      还要把数据删到零条，看看页面有没有告诉用户“现在还没有记录”，而不是留下一块空白。


      记住这句话：**演示数据越像真的，越能提前发现问题；数据只有一份，页面只是不同的看法。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：列表页、空态与至少 5 条 Mock
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 为什么演示数据需要覆盖待处理、处理中和已完成等不同状态？
      - - 为了让文件变得更大
        - 为了提前检查不同状态下的页面和筛选是否正确
        - 为了假装已经接入真实数据
      - 1
      - 数据越接近真实情况，越容易在交付前发现页面问题。
    knowledge_cards:
    - id: d2l3-k1
      term: 演示数据要像真的
      plain: 至少准备五到八条，覆盖不同状态，还要有一条能讲清业务问题的数据。
    - id: d2l3-k2
      term: 数据只能有一份
      plain: 列表和详情读取同一份记录，不能在不同页面各写一套数值。
    - id: d2l3-k3
      term: 没有数据也要说明
      plain: 删除全部记录后，页面要明确告诉用户当前没有内容，而不是只留空白。
    memory_sentence: 演示数据越像真的，越能提前发现问题；数据只有一份，页面只是不同的看法。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请做好列表页，先放至少五条演示记录，并补上“没有记录”时的页面。刚在提交页新增的内容要立刻出现在列表里，页面要写明“当前为演示数据”。完成后带我亲手提交、查看和筛选。'
      checklist:
      - 至少五条 Mock 且字段合法
      - 空态可验证
      - 提交与列表联动
      - 页面或说明明确当前不是数据库数据
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 做出详情页，约定页面和数据怎么传
    minutes: 30
    form: 实操+交接
    content_ref: class/bootcamp/day-02/section-04-hands-on-adr/lesson.md
    content: '列表页让人找到一条记录，详情页让人看清这条记录。字段要完整，当前状态要醒目，该有的操作要放在正确位置。


      详情页还要保留“AI 分析区｜第二周接入”。现在没有真正调用 AI，样例只能标“演示数据”。业务页面照常能用，AI 是以后加上的能力，不能让它绑住主流程。


      接下来，页面工程师和数据工程师要提前约定怎么传数据。你可以把这份约定理解成双方签的一张送货单：页面问什么，数据部分回答什么，每个名称怎么写，出错时怎么说明。工程师把这条传话通道叫“接口”，你认识这个叫法就够了。


      如果不先约定，页面叫“金额”，数据部分叫“费用”，两边各自都觉得做对了，接起来却会出错。所以先把提交、列表、详情、看板统计和第二周 AI 位置五条约定写清，再让双方继续。


      记住这句话：**页面和数据先把传话方式说清，双方才能各自开工；约定不清，接起来一定靠猜。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent → @后端工程师 Agent'
      note: 本节交付：详情页 + docs/D2-L4_接口契约.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 页面和数据部分使用的字段名称不一致时，首先应该做什么？
      - - 两边继续按自己的理解开发
        - 回到双方约定，先把名称和格式统一
        - 在页面上隐藏这个字段
      - 1
      - 先统一传话约定，才能避免两个岗位长期各说各话。
    knowledge_cards:
    - id: d2l4-k1
      term: 详情要看清一条记录
      plain: 字段完整、状态醒目，并且列表和详情展示的是同一条数据。
    - id: d2l4-k2
      term: 先约定怎样传数据
      plain: 页面问什么、数据部分答什么、名称怎么写和出错怎么说明，都要提前写清楚。
    - id: d2l4-k3
      term: AI 能力诚实留位
      plain: 当前只写第二周接入，样例标演示数据，不能伪装成 AI 已经完成分析。
    memory_sentence: 页面和数据先把传话方式说清，双方才能各自开工；约定不清，接起来一定靠猜。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请做好详情页，让它显示我在列表中选中的那条记录。AI 区先写“AI 分析区｜第二周接入”和“演示数据”，再放按钮。完成后带我检查；我批准后，请只给我一句交给后端工程师的数据约定任务，不要替他执行。'
      checklist:
      - 详情字段与 PRD 一致
      - AI 区状态和演示数据标识清楚
      - 五个接口齐全
      - 请求响应字段与页面和 PRD 能对上
      - 学员批准契约后才允许第三天后端开工
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 做出管理看板，把四个页面走一遍
    minutes: 30
    form: 实操+验收
    content_ref: class/bootcamp/day-02/section-05-accept/lesson.md
    content: '管理看板是负责人一眼看到整体情况的页面：总共有多少条，多少待处理，哪些类型最多，最近有什么变化。


      今天看板暂时读取演示数据，但计算方式必须和明天真实数据保持一致。看板上的数字不是装饰，应该能在列表里找到对应记录。


      四个页面完成后，不要只听 AI 汇报“已经完成”。像收房一样逐项检查：四个页面能不能互相到达，提交一条后列表有没有变化，详情是否对应，空白状态和错误提示是否清楚，看板数字能不能和列表对上。


      发现问题要写清“哪里不对、应该改成什么样”，再交给页面工程师修改。只说“重做”“不好看”，AI 只能继续猜。


      最后留下一张走查记录，证明你真的验过，而不是只看了截图。


      记住这句话：**交付物要带着“我验过了”的证据；问题发现得越早，修改成本越低。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day2-source
    - domain-packs
    tools:
    - name: '@前端工程师 Agent'
      note: 本节交付：四页 Mock 前端 V0.5 + 走查记录
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - AI 员工汇报“四个页面都完成了”，学员应该怎样处理？
      - - 直接批准进入下一天
        - 亲手走一遍完整流程并留下检查记录
        - 只查看管理看板的截图
      - 1
      - 课程要求用实际操作和记录证明完成，不能只听 AI 汇报。
    knowledge_cards:
    - id: d2l5-k1
      term: 看板数字要找得到来源
      plain: 每个数字都应能在列表记录中核对，不能只是为了好看随便填写。
    - id: d2l5-k2
      term: 四个页面走完整流程
      plain: 从提交到列表、详情和看板逐步检查，不能只抽看一张截图。
    - id: d2l5-k3
      term: 纠偏要写清目标
      plain: 明确指出哪里不对、应该改成什么样，AI 才能定向修改并重新验收。
    memory_sentence: 交付物要带着“我验过了”的证据；问题发现得越早，修改成本越低。
    local_prep:
      codex_prompt: '@前端工程师 Agent 请完成驾驶舱，让数字和分类情况都从现有演示记录算出来。然后带我按“提交—列表—详情—驾驶舱”走一遍，把发现的问题记进前端检查表并逐项修复。全部完成后自检，停下来等我批准。'
      checklist:
      - 四页可互相到达
      - 看板指标与选题一致
      - 统计 Mock 服从契约
      - 走查至少记录两项真实问题或明确的验证证据
      - 修复后由学员复验并批准 V0.5
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 为什么先做空壳路由？
    options:
    - 为了少写代码
    - 为了先确认工程结构和页面边界
    - 为了跳过原型
    answer: 1
    explain: 先确认骨架可以降低一次性生成造成的黑箱感。
  - q: 前端主要负责什么？
    options:
    - 用户看到和操作的界面
    - 保存所有数据库文件
    - 替学员批准 PRD
    answer: 0
    explain: 前端实现交互界面并调用后端接口。
  - q: 提交页字段冲突时以什么为准？
    options:
    - AI 临时判断
    - 已批准的 PRD
    - 页面看起来是否整齐
    answer: 1
    explain: 已批准 PRD 是当前需求基线。
  - q: 为什么前端有校验，后端还要再校验？
    options:
    - 为了重复工作
    - 前端可被绕过，后端要守住业务规则
    - 因为按钮颜色不同
    answer: 1
    explain: 后端必须保护真实数据不被非法请求污染。
  - q: Mock 数据的正确定位是什么？
    options:
    - 真实数据库备份
    - 按契约制作的临时前端数据
    - AI 分析结果
    answer: 1
    explain: Mock 让前端先行，但不能冒充真实接口。
  - q: 前端使用 Mock 时可以说系统已联调吗？
    options:
    - 可以
    - 不可以
    - 只要页面漂亮就可以
    answer: 1
    explain: 联调要求前端真实调用后端并读写数据库。
