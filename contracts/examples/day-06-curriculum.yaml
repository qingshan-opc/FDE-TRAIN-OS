camp_version: v0.7
day: 6
title: 周六 · FDE 全栈理论 / 互联网地图
week: 1
project: 周六 · FDE 全栈理论 / 互联网地图
project_brief: '今天不写长文地图。请基于「你自己的项目」（默认：部门周报助手；也可换成你的点子）手绘一张技术架构图，拍照上传。


  怎么做：

  1）打开资源「手绘架构图 · 搭档提示词」，整份粘进 AI，先回答它的 4 个约束问题，拿到「该画什么」的四层清单；

  2）自己动手画（纸笔 / 白板 / 手写板均可）——禁止截网上现成架构图充数；

  3）图上至少能看出：前端入口、后端/服务、数据存储、一次外部依赖（有则标，无则写「暂无」）；

  4）上传清晰照片，并在复盘里用 8–12 句话讲清「为什么这样分层」。


  过闸标准：是你自己的项目、四层齐、能对着图讲清楚。'
review_checklist:
- 第 4 节课节实验：命令行八句全部敲出 + 服务启动并 `curl` 验证 200（Rubric 机器判定）
- 快测 21 题 ≥ 14 题（概念验收节点，解析必须看懂）
- 企业任务：基于自己的项目（默认周报助手，可换成自有点子）**手绘**一张技术架构图并拍照上传；须能讲清用户触点 / 应用服务 / 数据与契约 / 运行部署四层（可用提示词先梳理，图必须自己画）
