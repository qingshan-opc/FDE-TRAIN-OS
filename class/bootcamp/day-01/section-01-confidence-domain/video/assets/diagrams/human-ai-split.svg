<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="human ai split">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.14)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="560" height="480" fill="#ffffff"/>
  <rect width="560" height="480" fill="url(#dots)"/>
  <circle cx="504" cy="56" r="86" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="436" r="62" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="62;74;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="24" width="6" height="26" rx="3" fill="#0d9488"/>
    <text x="46" y="43" font-size="19" font-weight="800" fill="#231f20">分工：你定义，它执行</text>
    <text x="532" y="41" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.8" fill="rgba(35,31,32,.42)">HUMAN / AI SPLIT</text>
  </g>
<g transform="translate(36,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="232" height="296" rx="18" fill="rgba(13,148,136,.06)" stroke="rgba(13,148,136,.4)" stroke-width="1.5" filter="url(#sh)"/>
      <circle cx="116" cy="52" r="22" fill="url(#teal)" filter="url(#glow)"/>
      <text x="116" y="58" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#fff">YOU</text>
      <text x="116" y="108" text-anchor="middle" font-size="19" font-weight="800" fill="#231f20">你负责</text>
      <text x="26" y="148" font-size="14" fill="#231f20">① 说清真实问题</text>
      <text x="26" y="178" font-size="14" fill="#231f20">② 选择第一版范围</text>
      <text x="26" y="208" font-size="14" fill="#231f20">③ 确认业务规则</text>
      <text x="26" y="238" font-size="14" fill="#231f20">④ 判断是否合格</text>
      <text x="26" y="276" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#0d9488">DEFINE · ACCEPT</text>
    </g>
<g transform="translate(292,84)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="232" height="296" rx="18" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      <rect x="96" y="30" width="40" height="40" rx="10" fill="#231f20"/>
      <text x="116" y="56" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#fff">AI</text>
      <text x="116" y="108" text-anchor="middle" font-size="19" font-weight="800" fill="#231f20">岗位智能体</text>
      <text x="26" y="148" font-size="14" fill="rgba(35,31,32,.75)">① 整理需求文档</text>
      <text x="26" y="178" font-size="14" fill="rgba(35,31,32,.75)">② 设计页面交互</text>
      <text x="26" y="208" font-size="14" fill="rgba(35,31,32,.75)">③ 生成技术产物</text>
      <text x="26" y="238" font-size="14" fill="rgba(35,31,32,.75)">④ 根据反馈重做</text>
      <text x="26" y="276" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#0d9488">EXECUTE · REDO</text>
    </g>
  <path d="M268 200 H290" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.0s" repeatCount="indefinite"/>
  </path>
  <path d="M292 224 H270" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
<g transform="translate(36,404)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="488" height="56" rx="28.0" fill="url(#teal)" filter="url(#glow)"/>
      <text x="244.0" y="33.4" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">像带一支团队：找谁 · 给什么 · 怎么验</text>
      </g>
</svg>
