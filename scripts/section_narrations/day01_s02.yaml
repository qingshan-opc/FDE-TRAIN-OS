title: "第一天 · 第 2 节 · 把七名 AI 员工招进开发工具"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · 开始组队"
      - "上一节选好问题 · 这一节建团队"
    text: |
      同学们好，我是你们的老师404。上一节你选好了问题，这一节开始组队。

  - id: "02-seven-roles"
    ppt:
      - "眉题：02 TEAM · 七岗位分工"
      - "流程：项目经理 → 产品经理 → 页面设计师 → 页面工程师 → 数据工程师 → 检查工程师 → 运行维护"
      - "01 · 排计划"
      - "02 · 问清需求"
      - "03 · 画页面草图"
      - "04 · 做出能点的页面"
    text: |
      你的团队有七个岗位：项目经理负责排计划，产品经理负责把需求问清楚，页面设计师负责画出页面草图，页面工程师负责做出真正能操作的页面，数据工程师负责保存记录和执行规则，检查工程师负责找问题，运行维护工程师负责让别人也能把项目跑起来。

  - id: "03-job-spec"
    ppt:
      - "眉题：03 SPEC · 岗位说明书"
      - "你是谁 · 负责什么"
      - "按什么标准交付 · 什么不能替学员决定"
    text: |
      创建这些 AI 员工，本质上是在给每个人一份岗位说明书：你是谁，负责什么，按什么标准交付，什么事情不能替学员决定。

  - id: "04-not-one-bot"
    ppt:
      - "眉题：04 WHY · 不要一个全能助手"
      - "双列：一个 AI 包办 vs 七岗位各守标准"
      - "左 · 自己产出又自己判分 → 容易自我放过"
      - "右 · 产品经理写需求 · 检查工程师专门挑毛病"
    text: |
      为什么不只建一个“全能助手”？因为不同岗位的判断标准不同。产品经理要把需求说清楚，检查工程师要专门挑毛病。如果同一个 AI 既做产出又给自己判满分，它很容易自我放过。

  - id: "05-review-gate"
    ppt:
      - "眉题：05 GATE · REVIEW → APPROVED"
      - "做完只能说「请检查」"
      - "学员查看真实文件 · 亲手操作 · 明确批准"
    text: |
      每个岗位做完后只能说“请检查”，不能自己宣布通过。你必须查看真实文件、亲手操作，再明确批准下一个岗位开工。记住这句话：AI 员工不是越多越好，而是各守一段标准；七个岗位，就是七道质量关。

  - id: "06-close"
    ppt:
      - "本节交付 · 七岗位创建完成"
      - "验收靠真实结果 · 不靠口头汇报"
    text: |
      同学们，本节先到这里。回到平台进入本地实操，按平台提示逐个创建 AI 员工。完成后必须亲手查看结果，不能只接受 AI 的口头汇报。
