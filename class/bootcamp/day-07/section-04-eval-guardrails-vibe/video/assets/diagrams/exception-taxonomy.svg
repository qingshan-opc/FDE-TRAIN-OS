<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-label="Skill 异常分类与处置">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="450" fill="#ffffff"/>
  <rect width="1040" height="450" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="402" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">Skill 出错了：四类异常，按表处置</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">FAIL BY DESIGN</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="420" y="56" width="200" height="52" rx="16" fill="url(#tlg)" filter="url(#glow)"/><text x="520" y="88" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle">Skill 出错了</text></g>
<path d="M520 108 L170 146" stroke="rgba(13,148,136,.4)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="146" width="220" height="214" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="170" y="178" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">输入类</text>
<text x="170" y="196" font-size="9" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1">BAD INPUT</text>
<text x="80" y="226" font-size="11" fill="rgba(35,31,32,.6)">月份写成「七月」</text>
<text x="80" y="248" font-size="11" fill="rgba(35,31,32,.6)">缺必填参数</text>
<text x="80" y="284" font-size="11.5" font-weight="700" fill="#231f20">处置：拒收 + 说人话</text>
<text x="80" y="312" font-size="10.5" fill="rgba(35,31,32,.55)">「month 需要 2026-07</text>
<text x="80" y="332" font-size="10.5" fill="rgba(35,31,32,.55)">这样的格式」</text>
</g>
<path d="M520 108 L420 146" stroke="rgba(13,148,136,.4)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="310" y="146" width="220" height="214" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="420" y="178" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">依赖类</text>
<text x="420" y="196" font-size="9" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1">DEPENDENCY DOWN</text>
<text x="330" y="226" font-size="11" fill="rgba(35,31,32,.6)">数据库连不上</text>
<text x="330" y="248" font-size="11" fill="rgba(35,31,32,.6)">上游接口 500</text>
<text x="330" y="284" font-size="11.5" font-weight="700" fill="#231f20">处置：重试 → 降级 → 报错</text>
<text x="330" y="312" font-size="10.5" fill="rgba(35,31,32,.55)">最多重试 N 次，仍挂</text>
<text x="330" y="332" font-size="10.5" fill="rgba(35,31,32,.55)">用缓存/上次的产物顶上</text>
</g>
<path d="M520 108 L670 146" stroke="rgba(13,148,136,.4)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="560" y="146" width="220" height="214" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="670" y="178" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">模型类</text>
<text x="670" y="196" font-size="9" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1">MODEL MISFIRE</text>
<text x="580" y="226" font-size="11" fill="rgba(35,31,32,.6)">超时没返回</text>
<text x="580" y="248" font-size="11" fill="rgba(35,31,32,.6)">输出胡说 / 格式崩</text>
<text x="580" y="284" font-size="11.5" font-weight="700" fill="#231f20">处置：切断 + 校验 + 人工</text>
<text x="580" y="312" font-size="10.5" fill="rgba(35,31,32,.55)">超时切断；输出过格式</text>
<text x="580" y="332" font-size="10.5" fill="rgba(35,31,32,.55)">校验，不过转人工</text>
</g>
<path d="M520 108 L920 146" stroke="rgba(13,148,136,.4)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="810" y="146" width="220" height="214" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="920" y="178" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">业务类</text>
<text x="920" y="196" font-size="9" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1">POLICY</text>
<text x="830" y="226" font-size="11" fill="rgba(35,31,32,.6)">要求超出授权范围</text>
<text x="830" y="248" font-size="11" fill="rgba(35,31,32,.6)">触碰敏感数据</text>
<text x="830" y="284" font-size="11.5" font-weight="700" fill="#231f20">处置：拒绝 + 转人工</text>
<text x="830" y="312" font-size="10.5" fill="rgba(35,31,32,.55)">边界声明里写死，</text>
<text x="830" y="332" font-size="10.5" fill="rgba(35,31,32,.55)">没有「酌情处理」</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="520" y="402" font-size="13" font-weight="800" fill="#231f20" text-anchor="middle">「按声明的方式失败」也是合格 —— 乱失败才是不合格</text><text x="520" y="428" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">第八天异常注入测试：故意喂坏输入，看它是不是按表处置</text></g>
</svg>
