camp_version: v0.7
day: 6
title: LLM 理论日：18 词过线
week: 2
project: LLM 理论日
project_brief: '今天两件交付：① 第 1 节 DeepSeek + SSE 最小接电（流式能跑或书面降级）；② LLM 认知卡 llm-cognition-card.md。


  认知卡怎么做：

  1）打开资源「LLM 认知卡 · 搭档提示词」，整份粘进 AI，先回答它的 3 个问题，拿到六大主题骨架；

  2）每个主题写 2–3 条白话要点，每条必须配前五天真实交付物或自己的类比——不许只剩词典定义；

  3）主题固定：生态四层 / Token与幻觉 / Prompt与RAG / Eval与护栏 / Agent与Harness / Copilot vs Agent（可加一句你的 SSE 接电体会）；

  4）上传 md 附件，复盘里写清「哪三条你现在能 30 秒讲给别人听」。


  过闸标准：SSE 接电过闸（或助教确认的降级说明）；六大主题齐全、每条有你的实例。日级快测在「概念验收」节点单独过。'
review_checklist:
- 第 1 节：能口述「一次性响应 vs SSE」；**DeepSeek + SSE** 最小接电跑通（或书面 blocker + 降级，经助教确认）
- 日级快测过线（解析必须看懂）；目标对齐「18 词认知」——题库与词典对照复习
- 企业任务：提交 LLM 认知卡 `llm-cognition-card.md`（**六大主题**：生态四层 / Token与幻觉 / Prompt与RAG / Eval与护栏 / Agent与Harness / Copilot vs Agent；每主题
  2–3 条要点，每条配前五天真实实例或自己的类比；可用「认知卡 · 搭档提示词」先梳骨架）
