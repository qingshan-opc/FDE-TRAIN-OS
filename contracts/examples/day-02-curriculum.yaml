camp_version: v0.7
day: 2
title: 指挥前端团队把原型变成真实页面
week: 1
project: 前端四页面 V0.5 与五接口契约
project_brief: 学员指挥前端工程师按已批准 PRD 和原型，先搭工程骨架，再逐页完成提交、列表、详情和驾驶舱；业务数据暂用 Mock，同时与后端工程师签下五个接口契约。
review_checklist:
- 四个前端页面都能运行和互相跳转
- 提交、列表和看板当前明确标识为 Mock 状态
- 详情页 AI 区诚实标记 Week2 与演示数据
- 五接口契约 v0.1 已经学员批准
- 学员完成走查、纠偏和复验，而不是只听 Agent 汇报
