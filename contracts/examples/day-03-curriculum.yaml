      term: Backend · 后端
      plain: 用户通常看不见、负责规则、数据和接口的服务层。
    - id: gt-api
      term: API · 接口
      plain: 前端向后端提出请求并接收结果的约定窗口。
    - id: gt-db
      term: Database · 数据库
      plain: 按固定结构保存和查询真实记录的系统。
  - id: c2
    title: 后端读取前端数据需求并确认方案
    minutes: 20
    form: 交接实操
    content_ref: class/bootcamp/day-03/section-02-backend-handoff/lesson.md
    content: （见本节 lesson.md）
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - agent-backend
    - backend-role-card
    tools:
    - name: TRAE · @后端
      note: 先读取、复述、澄清、列方案
    - name: 终端环境检查
      note: 只运行 python --version 或 py --version
    quiz:
    - - 后端缺少 frontend-api-needs.md 时应该怎样做？
      - - 自己从页面猜接口
        - 停止并要求前端补齐
        - 直接创建数据库
      - 1
      - 下游不能用猜测替代上游交接文件。
    - - “确认后端方案”之前允许做什么？
      - - 生成全部代码
        - 读取、复述、逐题澄清和展示实施清单
        - 修改 PRD
      - 1
      - 方案确认前只消除理解偏差，不扩大开发成本。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '本节只确认后端方案，不生成正式代码。请逐段发送。


        【第 1 段｜切换 @后端 并检查输入】

        请读取 PRD.md、frontend-api-needs.md、frontend/index.html、frontend/app.js 和 frontend-acceptance.md。现在不要设计接口或写代码。缺少文件时只说明缺什么、应回到哪个岗位。


        【第 2 段｜复述收到的需求】

        文件齐全后，请分别复述：核心业务规则、页面展示数据、用户提交内容、四种页面状态、仍待确认的问题。输出后停止。


        【第 3 段｜逐题澄清】

        请一次只问 1 个问题，依次确认数据来源、核心数据对象、谁可以访问、隐私限制和本机是否有 Python 3。每题给当前项目的回答示例，等我回答后再继续。


        【第 4 段｜后端实施清单】

        请展示最小后端方案：Python 标准库 + SQLite；列出 3—5 个接口、2—3 个数据表、本地运行方式、健康检查、错误处理和明确不做项。现在不要创建文件，等我回复“确认后端方案”。

        '
      checklist:
      - 已切换到 @后端 并读取全部输入
      - 后端复述与 PRD、前端数据需求一致
      - 五类问题一次只问一个
      - 已确认本机 Python 3 环境
      - 学员检查实施清单后回复“确认后端方案”
      suggested_questions:
      - 没有 Python 该怎么办？
      - 数据对象和页面字段有什么区别？
      - 为什么本节还不能写接口？
      template_resource_id: agent-backend
    media:
    - kind: video
      title: 口播课件 · 后端接收并确认方案
      object_key: documents/shared/course-media/day03-c2-backend-handoff-v2.mp4
      poster_key: documents/shared/course-media/day03-c2-backend-handoff-poster-v2.jpg
      duration_sec: 185
    knowledge_cards:
    - id: backend-inputs
      term: 后端开工输入
      plain: PRD 提供业务规则，frontend-api-needs 提供页面数据需求，frontend 文件提供真实调用位置。
      tag: 交接
    - id: clarify-one
      term: 后端逐题澄清
      plain: 数据来源、对象、权限、隐私和运行环境一次只确认一个，不能用猜测开工。
      tag: 防错
    - id: backend-gate
      term: 确认后端方案
      plain: 学员确认系统结构、接口清单、数据表和运行方式后，后端才生成正式合同与代码。
      tag: 人工闸门
    glossary_terms:
    - id: gt-data-object
      term: 数据对象
      plain: 项目中需要长期保存的一类事物，例如用户、订单、记录或任务。
    - id: gt-permission
      term: Permission · 权限
      plain: 决定谁可以查看、创建、修改或删除哪些数据。
  - id: c3
    title: 先定 API 与数据合同
    minutes: 20
    form: 合同实操
    content_ref: class/bootcamp/day-03/section-03-api-data-contract/lesson.md
    content: （见本节 lesson.md）
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - api-contract-card
    - agent-backend
    tools:
    - name: 接口菜单
      note: 先确认 3—5 行，再展开详细合同
    - name: 页面—接口—表对账表
      note: 字段必须能追溯
    quiz:
    - - 一个完整接口至少应同时说明什么？
      - - 只有路径
        - 方法、路径、请求、成功和错误响应
        - 只有数据库表名
      - 1
      - 前端必须知道怎样请求、成功和失败分别会收到什么。
    - - 接口—表对账的目的是什么？
      - - 让接口数等于表数
        - 确保每个业务字段都有明确来源
        - 让表名与路径相同
      - 1
      - 对账能发现虚构字段、遗漏数据和没人使用的表。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '继续使用 @后端，必须按顺序完成。


        【第 1 段｜只列接口菜单】

        方案已确认。请只列 3—5 个接口，每行写“方法、路径、一句话用途、对应页面操作”。不要展开参数和响应，等我回复“确认接口清单”。


        【第 2 段｜生成 API 合同】

        接口清单已确认。请生成 API_Spec.md。每个接口写全方法、路径、用途、请求参数或请求体、成功状态码与 JSON 示例、至少一个错误状态码与触发场景。保存后停止。


        【第 3 段｜生成数据合同】

        请根据已确认接口生成 DB_Schema.md，只设计当前第一版需要的 2—3 张表。每张表写字段、类型、主键、非空和必要关系，并说明 SQLite 文件位置。保存后停止。


        【第 4 段｜只对账不修改】

        请逐个接口列出读取或写入的“表名.字段名”。接口字段无来源、表字段无人使用或命名不一致时标为不通过。只列问题，等我确认修正。


        【第 5 段｜完整修正】

        我确认修正方案。请完整重生成 API_Spec.md 和 DB_Schema.md，不要只给补丁。最后列出页面操作 → 接口 → 数据表的完整链路。

        '
      checklist:
      - 接口清单与前端页面操作一一对应
      - 每个接口六要素齐全
      - 数据表均有主键且范围不过度设计
      - 每个接口字段都能追到表字段或业务计算
      - 两份合同已完整重生成并落盘
      suggested_questions:
      - 所有错误都返回 500 可以吗？
      - 页面字段不需要保存怎么办？
      - 接口比页面操作多要不要删？
      template_resource_id: api-contract-card
    media:
    - kind: video
      title: 口播课件 · 先定 API 与数据合同
      object_key: documents/shared/course-media/day03-c3-api-data-contract-v2.mp4
      poster_key: documents/shared/course-media/day03-c3-api-data-contract-poster-v2.jpg
      duration_sec: 189
    knowledge_cards:
    - id: contract-first
      term: 先合同后代码
      plain: 先确认接口清单、请求、响应和数据表，避免前端与后端各写一套字段。
      tag: 方法
    - id: api-six
      term: 接口六要素
      plain: 方法、路径、用途、请求、成功响应、错误响应。
      tag: API
    - id: api-table-map
      term: 接口—表对账
      plain: 每个请求与响应字段都能追到明确的数据表列或可计算规则。
      tag: 数据
    glossary_terms:
    - id: gt-http-method
      term: HTTP Method · 请求方法
      plain: GET 通常查询，POST 通常创建，PATCH 修改，DELETE 删除。
    - id: gt-status-code
      term: 状态码
      plain: 后端用数字快速说明成功、参数错误、未找到或服务故障。
    - id: gt-primary-key
      term: Primary Key · 主键
      plain: 唯一识别一条记录的字段，例如 id。
  - id: c4
    title: 生成并启动本地后端
    minutes: 30
    form: 分段实操
    content_ref: class/bootcamp/day-03/section-04-build-local-service/lesson.md
    content: （见本节 lesson.md）
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - local-service-card
    - api-contract-card
    tools:
    - name: TRAE 终端
      note: 启动和停止本地后端
    - name: 浏览器地址栏
      note: 先检查 health，再检查业务接口
    quiz:
    - - 健康检查成功能证明什么？
      - - 所有业务都正确
        - 后端进程已启动并能响应
        - 数据库绝不会出错
      - 1
      - 健康检查只证明服务可达，业务接口仍需单独验收。
    - - 怎样证明数据已持久化？
      - - 页面显示过一次
        - 重启服务后仍能查询到已保存记录
        - AI 说已经保存
      - 1
      - 重启后仍存在才说明数据没有只留在内存中。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '继续使用 @后端。每段完成后必须在终端验证。


        【第 1 段｜只生成后端文件】

        请根据已确认的 API_Spec.md 和 DB_Schema.md 创建 backend/server.py、backend/data/app.db、.env.example、RUNBOOK.md。使用 Python 3 标准库和
        SQLite，不安装第三方框架；服务同时提供 /api/health 和合同中的业务接口。不要修改 frontend 文件。


        【第 2 段｜环境与启动说明】

        请检查并说明应使用 python backend/server.py 还是 py backend/server.py，默认只监听 127.0.0.1:8000。把启动、健康检查、停止和常见错误写进 RUNBOOK.md。不要自动长期占用终端。


        【第 3 段｜启动并检查健康】

        在终端按 RUNBOOK 启动服务，浏览器打开 http://127.0.0.1:8000/api/health。必须看到明确 JSON 成功结果，否则停止，不进入业务接口测试。


        【第 4 段｜单独测试业务接口】

        按 API_Spec.md 测试至少一个查询、一个提交和两个错误场景。逐项记录请求、实际状态码、响应和是否符合合同，保存 backend-acceptance.md。


        【第 5 段｜重启验证持久化】

        停止服务后重新启动，再查询刚才提交的数据。能查到才标记持久化通过；查不到则交回 @后端 修复。

        '
      checklist:
      - 后端文件和运行手册均已落盘
      - 服务只监听本机地址且可正常停止
      - /api/health 返回成功 JSON
      - 查询、提交和至少两个错误场景符合合同
      - 重启服务后数据仍可查询
      - 代码和文档没有真实密钥或隐私数据
      suggested_questions:
      - 端口 8000 被占用怎么办？
      - health 成功但业务接口失败怎么办？
      - SQLite 文件在哪里？
      template_resource_id: local-service-card
    media:
    - kind: video
      title: 口播课件 · 生成并启动本地后端
      object_key: documents/shared/course-media/day03-c4-build-local-service-v2.mp4
      poster_key: documents/shared/course-media/day03-c4-build-local-service-poster-v2.jpg
      duration_sec: 174
    knowledge_cards:
    - id: minimal-backend
      term: 最小可运行后端
      plain: 使用 Python 标准库提供 HTTP 接口，使用 SQLite 持久保存数据，不额外安装框架。
      tag: 小白友好
    - id: health-check
      term: 健康检查
      plain: 用固定接口确认服务进程正在运行，例如 GET /api/health。
      tag: 运行
    - id: persistence
      term: 数据持久化
      plain: 服务重启后数据仍存在，区别于只保存在内存里的临时数组。
      tag: 数据
    glossary_terms:
    - id: gt-localhost
      term: localhost · 本机地址
      plain: 只在自己电脑上运行和访问的服务地址，通常是 127.0.0.1。
    - id: gt-port
      term: Port · 端口
      plain: 同一台电脑上区分不同服务的数字门牌，例如 8000。
    - id: gt-sqlite
      term: SQLite
      plain: 保存到单个本地文件的小型关系数据库，适合第一版练习。
  - id: c5
    title: 前端按合同接入后端
    minutes: 25
    form: 联调实操
    content_ref: class/bootcamp/day-03/section-05-frontend-integration/lesson.md
    content: （见本节 lesson.md）
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - integration-card
    - api-contract-card
    tools:
    - name: 浏览器 Network
      note: 查看请求、状态码和 JSON 响应
    - name: 服务终端日志
      note: 查看后端是否收到请求和报错
    quiz:
    - - 联调出现 404，第一步检查什么？
      - - 页面颜色
        - 请求方法和路径是否与 API_Spec 一致
        - 数据库主键
      - 1
      - 404 常表示路径或资源不存在，先按合同核对地址和方法。
    - - 后端返回字段正确，但前端取错字段，谁负责修改？
      - - 后端
        - 前端
        - UI
      - 1
      - 合同正确时，错误发生在哪个岗位就由哪个岗位修复。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '本节包含 @前端 与 @后端 切换，不能交给一个岗位全改。


        【第 1 段｜切换 @前端 读取合同】

        请读取 API_Spec.md 和 RUNBOOK.md，先列出 frontend/app.js 中每个演示数据操作将调用哪个接口。只做映射，不改代码，等我确认。


        【第 2 段｜前端接入 API】

        映射已确认。请只修改 frontend/app.js，让查询和提交通过 http://127.0.0.1:8000 的已确认接口完成；保留 loading、empty、success、error 展示。不要修改接口合同或后端代码。


        【第 3 段｜运行完整用户路径】

        保持后端服务运行，通过 RUNBOOK 指定的页面地址打开前端。完成一次查询和一次提交，再刷新页面确认数据来自后端。记录浏览器 Network 的路径、方法、状态码和响应。


        【第 4 段｜按责任定位】

        不通过时先对照 API_Spec：请求地址、方法或请求字段错误，切换 @前端 修复；后端状态码、响应字段或存储错误，切换 @后端 修复。每次只改责任岗位的文件。


        【第 5 段｜回归复测】

        修复后重新执行查询、提交、空数据和错误四条路径，把结果追加到 backend-acceptance.md。

        '
      checklist:
      - 前端接口映射先确认后修改
      - 页面通过 HTTP API 查询和提交
      - 四种状态在真实请求下仍能显示
      - Network 中方法、路径、状态码符合合同
      - 问题由责任岗位修复并完成回归复测
      suggested_questions:
      - 页面提示 Failed to fetch 怎么排查？
      - 404 和 500 分别先找谁？
      - 怎样确认数据不是本地演示数组？
      template_resource_id: integration-card
