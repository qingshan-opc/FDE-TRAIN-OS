  - id: c3
    title: 答辩提纲
    minutes: 15
    form: 实战
    content_ref: class/bootcamp/day-11/section-03-defense-prep/lesson.md
    content: '同学们，答辩八分钟，结构 3+3+2。作品三分钟、架构三分钟、迭代故事两分钟。好答辩不是讲得多，是砍得狠——没讲到的放互评问答里说。现在就开始写提纲，别等到上台才想结构，对吧。

      第一段作品演示，别讲，演。驾驶舱全貌、唤起 Agent、流水线跑一步、闸上驳回一次、再批准放行——让观众记住一个它真的活着的瞬间，胜过十句功能罗列。掐表走三遍，超时就砍，砍到三分钟以内，对吧。

      第二段架构，指着全景图讲四层、三 Skill 编排、闸在哪、为什么在那。弹药是第二节写好的十条一句话。第三段迭代故事，讲一个修了三次才修对的 bug——现象、定位、修错、修对、学到什么。讲好一个失败，比十个成功更像工程师，对吧。

      现在写提纲一页纸，三段各列要点和主打证据。提纲只写关键词，别写逐字稿；三段开头第一句话背下来，其余靠证据现场说。紧张忘词？第一句接第二句，证据在手就不慌，咱们靠材料不靠背稿，对吧。

      演示时系统挂了怎么办？预案准备好：一张昨日成功运行的日志截图兜底。挂了就指着日志讲，处理事故的方式也计分——慌了才扣分，不慌就是第九条证据。带走一句，咱们下一节真上台，对吧。'
    practice: '完成标志：

      [ ] 提纲一页纸填满，关键词式

      [ ] 作品段掐表 ≤3′，且练过兜底

      [ ] 提纲进 Git'
    resource_ids:
    - dg-v2-panorama
    tools:
    - name: 答辩提纲模板
      note: 演示路径 / 架构三点 / 迭代故事 / 诚实声明
    quiz:
    - - 答辩 3+3+2 结构指？
      - - 3 分钟寒暄 + 3 分钟演示 + 2 分钟问答
        - 作品 3′ + 架构 3′ + 迭代故事 2′
        - 3 页 PPT + 3 张图 + 2 个视频
      - 1
      - 讲好一个失败，比讲好十个成功更像工程师。
    - - 诚实声明三件套？
      - - 不好意思/下次一定/谢谢
        - 程度 + 差距 + 下一步
        - 不知道/没学过/没做过
      - 1
      - 弱项写清楚，比假装全能更加分。
    - - 架构 3′ 建议讲哪三点？
      - - 颜色/font/圆角
        - 四层架构 + Agent/Skill 编排 + 确认闸设计（各一点）
        - 团队介绍
      - 1
      - 从 V2.0 全景图右侧清单挑三条最强的讲。
