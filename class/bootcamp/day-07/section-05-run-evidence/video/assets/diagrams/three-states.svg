<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="加载、空、错三态">
<rect width="1040" height="430" fill="#f2f5f0"/>
<!-- 加载中 -->
<rect x="60" y="50" width="280" height="250" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="80" y="82" font-size="14" font-weight="800" fill="#231f20">加载中</text>
<text x="80" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">LOADING</text>
<circle cx="200" cy="150" r="16" fill="none" stroke="rgba(35,31,32,.3)" stroke-width="3" stroke-dasharray="50 30"/>
<rect x="90" y="190" width="220" height="12" fill="rgba(35,31,32,.12)"/>
<rect x="90" y="214" width="180" height="12" fill="rgba(35,31,32,.12)"/>
<rect x="90" y="238" width="200" height="12" fill="rgba(35,31,32,.12)"/>
<text x="200" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">骨架屏：先给形状，再给数据</text>
<!-- 空态 -->
<rect x="390" y="50" width="280" height="250" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="410" y="82" font-size="14" font-weight="800" fill="#231f20">空态</text>
<text x="410" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">EMPTY</text>
<rect x="440" y="125" width="180" height="70" fill="none" stroke="rgba(35,31,32,.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="530" y="163" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">暂无数据</text>
<rect x="455" y="215" width="150" height="30" fill="none" stroke="#1400ff" stroke-width="1.5"/>
<text x="530" y="234" text-anchor="middle" font-size="11" fill="#1400ff">去接入数据 →</text>
<text x="530" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">空白不是终点：给一条下一步</text>
<!-- 出错 -->
<rect x="720" y="50" width="280" height="250" fill="#ffffff" stroke="#f24e54" stroke-width="2"/>
<text x="740" y="82" font-size="14" font-weight="800" fill="#c92f3d">出错</text>
<text x="740" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">ERROR</text>
<circle cx="860" cy="140" r="18" fill="none" stroke="#f24e54" stroke-width="2.5"/>
<text x="860" y="147" text-anchor="middle" font-size="18" font-weight="800" fill="#f24e54">!</text>
<text x="860" y="185" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.65)">数据暂时没拉取成功</text>
<rect x="785" y="205" width="150" height="30" fill="#1400ff"/>
<text x="860" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">重试</text>
<text x="860" y="262" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.45)">错误码记进日志，不给用户看</text>
<!-- 底注 -->
<text x="520" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20">三态是页面的基本礼貌：V0.1 先占位，Day 3 接真接口后变真</text>
<text x="520" y="376" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">铁律：出错文案说人话——「500 Internal Server Error」永远不该出现在用户眼前</text>
</svg>
