day: 11
project: 收官：把智能体接到驾驶舱
project_brief: 'UI 接线 chat/loop/task（粘贴 prompts/06-wire-cockpit-ui.md）；十条证据；8′答辩讲清业务系统/驾驶舱/Skill/Loop；final-review + defense-demo。GATE 10 对照 teaching/week2-cockpit-agent/acceptance/checklist.md。'
