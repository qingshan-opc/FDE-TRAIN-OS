<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="云原生演进五站">
  <rect width="1200" height="470" fill="#f2f5f0"/>
  <text x="48" y="52" font-size="26" font-weight="900" fill="#231f20" style="font-family:'Songti SC','Noto Serif SC',serif">服务器的二十五年搬家史（五站）</text>
  <text x="48" y="78" font-size="11" letter-spacing="3" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">FROM A PC UNDER THE DESK TO PAY-PER-USE</text>
  <!-- server intro -->
  <rect x="48" y="96" width="1104" height="52" rx="8" fill="#231f20"/>
  <text x="72" y="128" font-size="15" fill="#f2f5f0">服务器 = 一台<tspan font-weight="900" fill="#f5a947">一直开着</tspan>、专门给别人提供服务的电脑 —— 不关机 · 没屏幕 · 住机房，你只通过网络跟它打交道。</text>
  <!-- 5 stops -->
  <g>
    <rect x="48" y="176" width="206" height="216" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="151" y="204" text-anchor="middle" font-size="11" letter-spacing="2" fill="#f5a947" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">STOP 1 · 2000s</text>
    <text x="151" y="232" text-anchor="middle" font-size="18" font-weight="900" fill="#231f20" style="font-family:'Songti SC',serif">物理机</text>
    <text x="151" y="258" text-anchor="middle" font-size="12.5" fill="rgba(35,31,32,.6)">桌底一台电脑</text>
    <text x="151" y="288" text-anchor="middle" font-size="12" fill="#2f9e44">✓ 全公司能访问了</text>
    <text x="151" y="316" text-anchor="middle" font-size="12" fill="#f24e54">✗ 买多浪费 · 买少挨骂</text>
    <text x="151" y="336" text-anchor="middle" font-size="12" fill="#f24e54">（95% 时间在睡觉）</text>
  </g>
  <path d="M254 284 L276 284 M276 284 L268 278 M276 284 L268 290" stroke="#231f20" stroke-width="2" fill="none"/>
  <g>
    <rect x="278" y="176" width="206" height="216" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="381" y="204" text-anchor="middle" font-size="11" letter-spacing="2" fill="#f5a947" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">STOP 2 · 2000s末</text>
    <text x="381" y="232" text-anchor="middle" font-size="18" font-weight="900" fill="#231f20" style="font-family:'Songti SC',serif">虚拟机</text>
    <text x="381" y="258" text-anchor="middle" font-size="12.5" fill="rgba(35,31,32,.6)">一台切成好几台</text>
    <text x="381" y="288" text-anchor="middle" font-size="12" fill="#2f9e44">✓ 力气榨干不浪费</text>
    <text x="381" y="316" text-anchor="middle" font-size="12" fill="#f24e54">✗ 每台都背一整套系统</text>
    <text x="381" y="336" text-anchor="middle" font-size="12" fill="#f24e54">（又慢又胖）</text>
  </g>
  <path d="M484 284 L506 284 M506 284 L498 278 M506 284 L498 290" stroke="#231f20" stroke-width="2" fill="none"/>
  <g>
    <rect x="508" y="176" width="206" height="216" rx="10" fill="#fff" stroke="#f5a947" stroke-width="2"/>
    <text x="611" y="204" text-anchor="middle" font-size="11" letter-spacing="2" fill="#f5a947" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">STOP 3 · 2013+</text>
    <text x="611" y="232" text-anchor="middle" font-size="18" font-weight="900" fill="#231f20" style="font-family:'Songti SC',serif">容器 Docker</text>
    <text x="611" y="258" text-anchor="middle" font-size="12.5" fill="rgba(35,31,32,.6)">应用打成「集装箱」</text>
    <text x="611" y="288" text-anchor="middle" font-size="12" fill="#2f9e44">✓ 箱子在哪哪就能跑</text>
    <text x="611" y="316" text-anchor="middle" font-size="12" fill="#f24e54">✗ 箱子从 3 个变 3000 个</text>
    <text x="611" y="336" text-anchor="middle" font-size="12" fill="#f24e54">（谁来管？）</text>
  </g>
  <path d="M714 284 L736 284 M736 284 L728 278 M736 284 L728 290" stroke="#231f20" stroke-width="2" fill="none"/>
  <g>
    <rect x="738" y="176" width="206" height="216" rx="10" fill="#fff" stroke="#231f20" stroke-width="1.5"/>
    <text x="841" y="204" text-anchor="middle" font-size="11" letter-spacing="2" fill="#f5a947" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">STOP 4 · 2014+</text>
    <text x="841" y="232" text-anchor="middle" font-size="18" font-weight="900" fill="#231f20" style="font-family:'Songti SC',serif">Kubernetes</text>
    <text x="841" y="258" text-anchor="middle" font-size="12.5" fill="rgba(35,31,32,.6)">集装箱码头调度系统</text>
    <text x="841" y="288" text-anchor="middle" font-size="12" fill="#2f9e44">✓ 挂了自动补 · 自动扩缩</text>
    <text x="841" y="316" text-anchor="middle" font-size="12" fill="#f24e54">✗ 系统本身就很贵</text>
    <text x="841" y="336" text-anchor="middle" font-size="12" fill="#f24e54">（小团队玩不起）</text>
  </g>
  <path d="M944 284 L966 284 M966 284 L958 278 M966 284 L958 290" stroke="#231f20" stroke-width="2" fill="none"/>
  <g>
    <rect x="968" y="176" width="184" height="216" rx="10" fill="#231f20"/>
    <text x="1060" y="204" text-anchor="middle" font-size="11" letter-spacing="2" fill="#f5a947" font-weight="700" style="font-family:'SF Mono',Menlo,monospace">STOP 5 · 2015+</text>
    <text x="1060" y="232" text-anchor="middle" font-size="18" font-weight="900" fill="#f2f5f0" style="font-family:'Songti SC',serif">Serverless</text>
    <text x="1060" y="258" text-anchor="middle" font-size="12.5" fill="rgba(242,245,240,.65)">从买车到打车</text>
    <text x="1060" y="288" text-anchor="middle" font-size="12" fill="#1cd5b0">✓ 没人用就不花钱</text>
    <text x="1060" y="316" text-anchor="middle" font-size="12" fill="#f5a947">✗ 冷启动 · 被一家绑定</text>
  </g>
  <!-- bottom line -->
  <rect x="48" y="416" width="1104" height="40" rx="8" fill="none" stroke="#1400ff" stroke-width="1.5"/>
  <text x="66" y="441" font-size="13.5" font-weight="700" fill="#1400ff">云 = 租别人的服务器用（像用电网）；云原生 = 生下来就住在云上的应用。方向只有一个：你操心的机器越来越少。</text>
</svg>
