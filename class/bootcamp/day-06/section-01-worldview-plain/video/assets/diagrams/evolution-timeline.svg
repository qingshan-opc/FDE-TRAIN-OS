<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-label="技术演进时间线：六次浪潮">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="310" fill="#ffffff"/>
  <rect width="1040" height="310" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="262" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
<path d="M40 150 H1008" stroke="rgba(13,148,136,.3)" stroke-width="3" stroke-linecap="round"/>
<path d="M1022 150 L1006 143.5 L1006 156.5 Z" fill="#0d9488"/>
<circle cy="150" r="5" fill="#0d9488"><animate attributeName="cx" values="40;1008" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.92;1" dur="7.5s" repeatCount="indefinite"/></circle>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="86" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="86" y="62" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">单机时代</text>
<text x="86" y="84" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">DESKTOP</text>
<text x="86" y="184" font-size="12" font-weight="700" fill="rgba(35,31,32,.75)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">1990s</text>
<text x="86" y="212" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">桌面程序 · 单机数据库</text>
<text x="86" y="232" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">软件装在一台机器上</text>
<text x="86" y="268" font-size="12" font-weight="700" fill="rgba(15,118,110,.75)" text-anchor="middle">值钱 · 会写 C/S 软件</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="260" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="260" y="62" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">Web 时代</text>
<text x="260" y="84" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">WEB</text>
<text x="260" y="184" font-size="12" font-weight="700" fill="rgba(35,31,32,.75)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2000s</text>
<text x="260" y="212" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">浏览器 + 服务器</text>
<text x="260" y="232" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">网站与电商爆发</text>
<text x="260" y="268" font-size="12" font-weight="700" fill="rgba(15,118,110,.75)" text-anchor="middle">值钱 · 会做网站</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="433" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="433" y="62" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">云与移动</text>
<text x="433" y="84" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">CLOUD·MOBILE</text>
<text x="433" y="184" font-size="12" font-weight="700" fill="rgba(35,31,32,.75)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2010s</text>
<text x="433" y="212" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">上云 · App · SaaS</text>
<text x="433" y="232" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">软件变成在线服务</text>
<text x="433" y="268" font-size="12" font-weight="700" fill="rgba(15,118,110,.75)" text-anchor="middle">值钱 · 会运维与分布式</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="607" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="607" y="62" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">云原生</text>
<text x="607" y="84" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">CLOUD NATIVE</text>
<text x="607" y="184" font-size="12" font-weight="700" fill="rgba(35,31,32,.75)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2015+</text>
<text x="607" y="212" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">容器 · K8s · DevOps</text>
<text x="607" y="232" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">微服务拆碎再编排</text>
<text x="607" y="268" font-size="12" font-weight="700" fill="rgba(15,118,110,.75)" text-anchor="middle">值钱 · 会架构</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<circle cx="780" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="780" y="62" font-size="16" font-weight="800" fill="#231f20" text-anchor="middle">AI 辅助</text>
<text x="780" y="84" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">AI ASSISTED</text>
<text x="780" y="184" font-size="12" font-weight="700" fill="rgba(35,31,32,.75)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2021+</text>
<text x="780" y="212" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">Copilot 补全代码</text>
<text x="780" y="232" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">「写」的成本趋近于零</text>
<text x="780" y="268" font-size="12" font-weight="700" fill="rgba(15,118,110,.75)" text-anchor="middle">值钱 · 会用 AI 提效</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="954" y="26" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">▼ 你在这里</text>
<circle cx="954" cy="150" r="18" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="954" cy="150" r="10" fill="url(#tlg)" filter="url(#glow)"/>
<text x="954" y="62" font-size="16" font-weight="800" fill="#0f766e" text-anchor="middle">AI 原生</text>
<text x="954" y="84" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">AI NATIVE</text>
<text x="954" y="184" font-size="12" font-weight="700" fill="rgba(35,31,32,.75)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">2024+</text>
<text x="954" y="212" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">Agent · Harness · MCP</text>
<text x="954" y="232" font-size="11.5" fill="rgba(35,31,32,.55)" text-anchor="middle">人定目标，AI 执行</text>
<text x="954" y="268" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">值钱 · 会指挥 AI</text>
</g>
</svg>
