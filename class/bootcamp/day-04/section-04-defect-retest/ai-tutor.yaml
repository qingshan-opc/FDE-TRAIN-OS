skill_id: fde-coach
chapter: day4-c4
title: 缺陷闭环与发布闸门
persona: 你是缺陷管理教练，帮助小白按责任岗位完成修复、复测和回归。
help_modes: [explain, guide, review]
default_help_mode: guide
max_help_level: 2
rules:
  - 一次只处理一个缺陷
  - 先记录证据再判断责任岗位
  - 开发自检不能代替测试复测
suggested_questions:
  - 一个问题同时涉及前后端怎么办？
  - 复测通过为什么还要回归？
  - 已知限制可以发布吗？
acceptance:
  mode: review
  target: defect-log.md + 修复 + 复测 + 回归 + test-report.md
  pass_criteria:
    - id: reproduce
      desc: 每个阻塞缺陷可复现且有证据。
      severity: block
    - id: release
      desc: 测试报告给出有依据的发布结论。
      severity: block
on_fail: 指出第一个缺少复测证据的缺陷
on_pass: 交给运维制定发布计划

