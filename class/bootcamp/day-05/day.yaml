      duration_sec: 185
    knowledge_cards:
    - id: micro-iteration
      term: 微迭代
      plain: 在现有项目上完成一项小而可验收的改进，不借机重做整个系统。
      tag: 范围
    - id: replay-folder
      term: 独立复现目录
      plain: Day5 新证据统一放入 day5-replay，原项目文件作为输入保留。
      tag: 保护成果
    - id: pm-gate
      term: 确认需求
      plain: 学员确认用户、问题、范围和验收标准以后，才允许交给 UI。
      tag: 人工闸门
    glossary_terms:
    - id: gt-iteration
      term: Iteration · 迭代
      plain: 在已有版本上完成一组明确且可验证的改进。
    - id: gt-scope-freeze
      term: Scope Freeze · 范围冻结
      plain: 确认本轮做什么和不做什么，后续岗位不得自行扩展。
    quiz:
    - - Day5 为什么选择微迭代而不是重做整个系统？
      - - 为了减少岗位数量
        - 为了在可控范围内完整复现流程
        - 为了跳过测试
      - 1
      - 范围越小，越容易看清岗位交接和完整闭环。
    - - 产品经理交给 UI 前必须确认什么？
      - - 代码语言
        - 用户问题、范围和验收标准
        - 服务器价格
      - 1
      - UI 的设计输入来自确认后的产品目标与范围。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '现在开始 Day5 全流程复现。请使用 @产品经理。每段完成后必须停止。


        【第 1 段｜检查现有项目】

        请只读取 Day1 到 Day4 的 PRD、交接文件、测试报告、部署说明和最终验收。先复述当前版本已经解决什么问题。不要修改任何文件。


        【第 2 段｜选择一项微迭代】

        请结合我的专业领域，一次只问一个问题。帮助我从现有项目中选择一项当天可完成的改进。给三个例子，但不要替我决定。确认后把新文件统一放入 day5-replay。


        【第 3 段｜完成需求访谈】

        围绕目标用户、使用场景、当前困难、期望动作、成功结果和不做范围逐题访谈。每次只问一题，等我回答后继续。


        【第 4 段｜生成产品交付】

        请生成 day5-replay/iteration-prd.md 和 day5-replay/pm-handoff.md。写清用户故事、第一版范围、不做范围、业务规则、页面状态和可判断验收标准。保存后停止，等我回复“确认需求”。

        '
      checklist:
      - 已读取第一版真实交付物
      - 微迭代当天可完成
      - 新证据统一放入 day5-replay
      - 用户故事和不做范围明确
      - 每条验收标准能够判断通过或失败
      - 学员回复“确认需求”
      suggested_questions:
      - 什么样的改进算微迭代？
      - 如果需求同时涉及很多页面怎么办？
      - 为什么要保护原有交付文件？
      template_resource_id: agent-pm
    tools:
    - name: TRAE · @产品经理
      note: 先复述现状，再访谈和冻结范围
    - name: day5-replay 目录
      note: 隔离本次复现产生的文件与证据
