      tag: 交接
    glossary_terms:
    - id: gt-prd
      term: PRD
      plain: 产品需求文档，是产品经理与下游岗位共同使用的开工依据。
    - id: gt-acceptance-criteria
      term: 验收标准
      plain: 能让不同的人得出同一“通过/不通过”结论的检查条件。
    quiz:
    - - 产品经理为什么不能听完第一句话就直接生成 PRD？
      - - 因为必须先买模板
        - 因为用户、数据、范围和验收标准还没有确认
        - 因为 PRD 只能由程序员写
      - 1
      - 未澄清就生成会让 AI 用猜测补空白，后面的 UI 和开发岗位会沿着错误方向继续工作。
    - - 学员回复“确认需求”意味着什么？
      - - 把所有责任交给 AI
        - 对需求摘要和第一版范围承担确认责任
        - 要求 UI 直接开始写后端
      - 1
      - AI 可以整理需求，但最终确认做什么、不做什么以及怎样算合格，仍由学员负责。
    local_prep:
      skill_id: fde-local-prep
      prompt_title: 请按照流程文档操作
      hide_copy: true
      codex_prompt: '先在 TRAE 对话框切换到 @产品经理。下面内容必须逐段发送，每段完成并出现等待点后再继续。


        【第 1 段｜介绍领域，不生成文档】

        我熟悉的专业领域是〈财务 / HR / 运营 / 销售 / 教育 / 其他〉。请先读取 design/PROJECT_BRIEF.md。现在不要生成 PRD。用小白能听懂的话，一次只问我 1 个问题；每题给一个回答示例，我回答后请先复述，再问下一题。


        【第 2 段｜检查是否问全】

        请确认你已经逐项问清目标用户、当前流程、最痛的问题、数据来源、主要操作、使用平台、第一版范围和验收标准。缺哪项就继续一次问一题，不要生成文档。


        【第 3 段｜需求确认摘要】

        请输出一份不超过一页的《需求确认摘要》，包含目标用户、核心问题、主要流程、页面清单、数据来源、第一版必须做、暂时不做和验收标准。输出后停止，等我回复“确认需求”。


        【第 4 段｜生成正式 PRD】

        我回复“确认需求”后，请生成并保存完整 design/PRD.md。不要写到工作区根目录。不要添加摘要中没有确认的功能。最后写明：下一岗位是 UI，需要读取 design/PRD.md。

        '
      checklist:
      - 已切换到 @产品经理
      - 产品经理一次只问一个问题，并在每次回答后复述确认
      - 需求摘要覆盖用户、问题、数据、流程、范围和验收标准
      - 已由学员本人回复“确认需求”
      - 已创建 design 目录，且 design/PRD.md 存在
      suggested_questions:
      - 产品经理一次问了很多问题怎么办？
      - 我不知道验收标准怎么写怎么办？
      - 产品经理加入了我没说过的功能怎么办？
