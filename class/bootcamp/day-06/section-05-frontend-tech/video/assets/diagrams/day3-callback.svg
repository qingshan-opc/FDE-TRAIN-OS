<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="回扣 Day 3：周报助手在地图里的位置">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">回扣 Day 3：周报助手那一格，填进整张图</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">CALLBACK · DAY 3</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="370" y="70" width="300" height="70" rx="16" fill="url(#tlg)" filter="url(#glow)"/><text x="520" y="100" font-size="14.5" font-weight="800" fill="#fff" text-anchor="middle">周报助手 = Web 单页</text><text x="520" y="124" font-size="11" fill="rgba(255,255,255,.88)" text-anchor="middle">不用框架 · 当时就是正确答案</text></g>
<path d="M520 140 L210 186" stroke="rgba(13,148,136,.45)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="80" y="190" width="280" height="74" rx="14" fill="#fff" filter="url(#sh)"/>
<text x="220" y="218" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">变 App</text>
<text x="220" y="244" font-size="10.5" fill="rgba(35,31,32,.6)" text-anchor="middle">会 React → React Native · 双端一致 → Flutter</text>
</g>
<path d="M520 140 L520 186" stroke="rgba(13,148,136,.45)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="390" y="190" width="280" height="74" rx="14" fill="#fff" filter="url(#sh)"/>
<text x="530" y="218" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">加小程序</text>
<text x="530" y="244" font-size="10.5" fill="rgba(35,31,32,.6)" text-anchor="middle">多端编排 → uni-app / Taro</text>
</g>
<path d="M520 140 L830 186" stroke="rgba(13,148,136,.45)" stroke-width="2" stroke-dasharray="4 5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="700" y="190" width="280" height="74" rx="14" fill="#fff" filter="url(#sh)"/>
<text x="840" y="218" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">仍是 Web</text>
<text x="840" y="244" font-size="10.5" fill="rgba(35,31,32,.6)" text-anchor="middle">长大再上 React / Vue · 小页面继续纯 HTML</text>
</g>
</svg>
