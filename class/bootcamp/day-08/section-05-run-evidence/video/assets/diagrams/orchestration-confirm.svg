<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-label="多 Skill 编排：发送动作前必须过人工确认闸，每一步写入执行日志">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <marker id="oc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="480" fill="#ffffff"/>
  <rect width="1040" height="480" fill="url(#dots)"/>
  <circle cx="970" cy="60" r="100" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="440" r="70" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="20" width="6" height="24" rx="3" fill="#0d9488"/>
    <text x="52" y="38" font-size="16" font-weight="800" fill="#231f20">多 Skill 编排：确认点 + 日志 = 信任的工程设计</text>
    <text x="1004" y="38" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">ORCHESTRATION</text>
  </g>

  <!-- pipeline -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <!-- Skill A -->
    <g>
      <rect x="60" y="140" width="180" height="112" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="150" y="172" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.5)">Skill A</text>
      <text x="150" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#231f20">拉取数据</text>
      <text x="150" y="230" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.5)">只读 · 幂等 · 可自动跑</text>
    </g>
    <!-- Skill B -->
    <g>
      <rect x="300" y="140" width="180" height="112" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="390" y="172" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.5)">Skill B</text>
      <text x="390" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#231f20">生成周报</text>
      <text x="390" y="230" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.5)">产出文档 · 可自动跑</text>
    </g>
    <!-- confirm gate -->
    <g>
      <polygon points="572,196 660,132 748,196 660,260" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
        <animate attributeName="opacity" values=".5;.12;.5" dur="2.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="582,196 660,140 738,196 660,252" fill="url(#teal)" filter="url(#glow)"/>
      <text x="660" y="190" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">人工确认</text>
      <text x="660" y="212" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.85)">看一眼再放行</text>
    </g>
    <!-- Skill C -->
    <g>
      <rect x="800" y="140" width="180" height="112" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <rect x="800" y="140" width="180" height="112" rx="16" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 5">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="890" y="172" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.5)">Skill C</text>
      <text x="890" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#231f20">发送出去</text>
      <text x="890" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">对外动作 · 不可逆</text>
    </g>

    <!-- arrows -->
    <g fill="none" stroke-linecap="round">
      <line x1="244" y1="196" x2="292" y2="196" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#oc-arrow)">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="484" y1="196" x2="570" y2="196" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#oc-arrow)">
        <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="750" y1="196" x2="792" y2="196" stroke="#0d9488" stroke-width="2.6" marker-end="url(#oc-arrow)"/>
      <circle r="5" fill="#0d9488">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M244 196 H560"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- execution log -->
    <g>
      <rect x="60" y="302" width="560" height="140" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="84" y="334" font-size="14" font-weight="800" fill="#231f20">执行日志（每步一条，可追溯）</text>
      <text x="84" y="366" font-size="13" fill="#231f20" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace"><tspan fill="#0d9488" font-weight="700">✓</tspan> A: 拉取 42 条记录 · 用时 3.2s</text>
      <text x="84" y="394" font-size="13" fill="#231f20" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace"><tspan fill="#0d9488" font-weight="700">✓</tspan> B: 生成 weekly-report-0524.md</text>
      <text x="84" y="422" font-size="13" fill="rgba(35,31,32,.6)" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">⏸ C: 等待人工确认（草稿已备好）<animate attributeName="opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/></text>
    </g>

    <!-- rule card -->
    <g>
      <rect x="660" y="302" width="320" height="140" rx="16" fill="rgba(13,148,136,.07)" stroke="rgba(13,148,136,.4)" stroke-width="1.4"/>
      <text x="684" y="334" font-size="14" font-weight="800" fill="#0f766e">编排铁律</text>
      <text x="684" y="364" font-size="13" fill="#231f20">只读步骤自动连跑；</text>
      <text x="684" y="390" font-size="13" fill="#231f20">任何「对外 / 写入 / 花钱」步骤前，</text>
      <text x="684" y="416" font-size="13" font-weight="700" fill="#0f766e">必须插人工确认点并留日志。</text>
    </g>
  </g>
</svg>
