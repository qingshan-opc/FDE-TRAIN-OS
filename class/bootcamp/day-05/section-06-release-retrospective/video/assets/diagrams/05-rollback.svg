Name="stroke-dashoffset" from="13" to="0" dur="1.0s" repeatCount="indefinite"/></line><text x="520" y="310" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">「在我机器上是好的」不算上线 —— 换台设备能开才算</text><text x="520" y="338" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">开发 / 生产配置分离 · 密钥不进代码（详见 env-config-split 图）</text><rect x="182" y="352" width="676" height="30" rx="15" fill="rgba(13,148,136,.08)"/><text x="520" y="372" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#0f766e">镜像 = 集装箱：你的应用和它的整个环境一起装箱，到哪台机器都长一样</text></g></svg>
