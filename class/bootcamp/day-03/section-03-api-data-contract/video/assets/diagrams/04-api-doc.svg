<circle cx="960" cy="56" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;112;96" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="64" cy="384" r="68" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="68;80;68" dur="11s" repeatCount="indefinite"/></circle>
<rect x="28" y="24" width="6" height="24" rx="3" fill="#0d9488"/>
<text x="46" y="42" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="800" fill="#231f20">契约先于实现 · 先定 JSON</text>
<text x="1012" y="42" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.4)">API CONTRACT</text>
<rect x="40" y="92" width="230" height="192" rx="18" fill="#fff" filter="url(#sh)" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.00s" dur="0.5s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.00s" dur="0.5s" fill="freeze"/><text x="64" y="128" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">FRONTEND</text>
<text x="64" y="162" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="800" fill="#231f20">前端</text>
