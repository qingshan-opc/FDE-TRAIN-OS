    quiz:
    - - UI 完成原型后，为什么要回到 @产品经理验收？
      - - 因为产品经理最会写代码
        - 因为需求负责人应按原始目标检查交付，避免 UI 自己验收自己
        - 因为测试岗位不需要存在
      - 1
      - 产品经理代表需求与业务目标，必须检查原型是否真正回应已经确认的 PRD。
    - - 产品经理发现原型不符合 PRD，正确流程是什么？
      - - 产品经理直接修改 UI 文件
        - 切回 @UI 按问题清单修改，再回 @产品经理复验
        - 删除 PRD 重新选题
      - 1
      - 责任岗位负责修改，需求岗位负责验收；循环直到原需求和原型一致。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '本节包含三次岗位切换。不要一次把所有任务发给同一个智能体。


        【第 1 段｜切换 @UI 并复述需求】

        切换到 @UI，发送：请读取 design/PRD.md。先用 5 句话复述目标用户、核心问题、主要操作、页面范围和验收标准。现在不要生成原型，等我确认理解一致。不要到工作区根目录寻找 PRD。


        【第 2 段｜UI 逐题确认设计】

        我确认需求理解一致。请一次只问 1 个设计问题，依次确认主要使用设备、首页最重要信息、页面风格、主色、最常用操作，以及加载/空数据/错误状态。每题给推荐示例，等我回答后再继续。


        【第 3 段｜UI 生成交付物】

        请先展示页面结构和操作路径，等我回复“确认页面方案”后，再生成 design/design-spec.md、design/ui-flow.md 和可直接打开的 design/ui-prototype.html。全部放在 design 目录，不要写到工作区根目录。只用演示数据，不连接真实后端。


        【第 4 段｜回到 @产品经理验收】

        切换回 @产品经理，发送：请读取 design/PRD.md、design/design-spec.md、design/ui-flow.md 和 design/ui-prototype.html，按原始需求逐条输出“通过/不通过、对应需求、责任岗位”。不要直接修改 UI 文件。


        【第 5 段｜不通过时迭代】

        如有不通过项，切回 @UI，只处理产品经理列出的问题；完成后再次回到 @产品经理复验。全部通过后，把三次切换和验收结果写入 design/day1-handoff-log.md。

        '
      checklist:
      - UI 已先复述 PRD，学员确认后才开始设计
      - design 目录存在 design-spec.md、ui-flow.md、ui-prototype.html
      - design/ui-prototype.html 可直接打开并产生可见交互
      - 已切换回 @产品经理按 PRD 验收
      - 不通过项已回到 @UI 修改并完成复验
      - design/day1-handoff-log.md 记录了岗位、输入、输出和验收结果
      suggested_questions:
      - UI 没读 PRD 就直接生成页面怎么办？
      - 原型可以使用真实公司数据吗？
      - 产品经理和 UI 对需求理解不一致怎么办？
      template_resource_id: agent-ui
