      plain: 在 TRAE 对话中选择当前要指挥的岗位智能体。
    quiz:
    - - 本课程为什么要求学员手动切换 @岗位？
      - - 为了增加操作步骤
        - 为了看清每次岗位交接和责任变化
        - 因为智能体不能读取文件
