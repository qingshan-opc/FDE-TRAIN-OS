<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FDE 教研台</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f8;color:#1a1a1a}
    header{padding:1rem 1.25rem;background:#1f2a27;color:#fff}
    main{max-width:960px;margin:1rem auto;padding:0 1rem;display:grid;gap:1rem}
    .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:1rem}
    input,button{padding:.5rem .7rem;font:inherit}
    button{background:#0f6a56;color:#fff;border:0;border-radius:8px;cursor:pointer}
    pre{background:#111;color:#cfe;padding:.75rem;border-radius:8px;overflow:auto;max-height:280px;font-size:12px}
  </style>
</head>
<body>
  <header><h1>FDE 教研最小集</h1><p>YAML 上传 · 证据/Job 列表 · 营期 Key（打码）</p></header>
  <main>
    <section class="card">
      <h2>登录（author@fde.local / author1234）</h2>
      <label for="email">邮箱</label>
      <input id="email" value="author@fde.local" />
      <label for="password">密码</label>
      <input id="password" type="password" value="author1234" />
      <button id="login">登录</button>
      <pre id="me" tabindex="0" aria-label="登录结果"></pre>
    </section>
    <section class="card">
      <h2>上传 Day YAML</h2>
      <input type="file" id="file" accept=".yaml,.yml" />
      <button id="upload">上传</button>
      <pre id="up"></pre>
    </section>
    <section class="card">
      <h2>营期 LingZhi Key</h2>
      <input id="key" placeholder="lz_..." style="width:70%" />
      <button id="save-key">保存（打码回显）</button>
      <pre id="key-out"></pre>
    </section>
    <section class="card">
      <h2>证据 / Jobs</h2>
      <button id="refresh">刷新</button>
      <pre id="ev"></pre>
      <pre id="jobs"></pre>
    </section>
  </main>
<script>
const API=location.origin; let token=localStorage.getItem('fde_author_token')||'';
let csrf=localStorage.getItem('fde_author_csrf')||'';
const h=()=>({
  'Authorization':'Bearer '+token,
  ...(csrf ? {'X-CSRF-Token': csrf} : {}),
});
async function api(p,o={}){
  const r=await fetch(API+p,{
    ...o,
    headers:{
      ...(o.body instanceof FormData?{}:{'Content-Type':'application/json'}),
      ...h(),
      ...(o.headers||{})
    },
    credentials:'include'
  });
  const t=await r.text();
  let d;try{d=JSON.parse(t)}catch{d={raw:t}};
  if(!r.ok) throw new Error(JSON.stringify(d));
  return d;
}
document.getElementById('login').onclick=async()=>{
  const d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,camp_id:'camp-v03'})});
  token=d.token; csrf=d.csrf||'';
  localStorage.setItem('fde_author_token',token);
  if(csrf) localStorage.setItem('fde_author_csrf',csrf);
  me.textContent=JSON.stringify(d,null,2);
};
document.getElementById('upload').onclick=async()=>{
  const f=file.files[0]; if(!f) return alert('选文件');
  const fd=new FormData(); fd.append('file', f, f.name);
  const r=await fetch(API+'/api/v1/author/contracts/upload',{method:'POST',headers:h(),body:fd,credentials:'include'});
  up.textContent=await r.text();
};
document.getElementById('save-key').onclick=async()=>{
  const d=await api('/api/v1/author/camps/camp-v03/key',{method:'PUT',body:JSON.stringify({lingzhi_api_key:key.value})});
  keyOut.textContent=JSON.stringify(d,null,2);
};
document.getElementById('refresh').onclick=async()=>{
  try {
    ev.textContent=JSON.stringify(await api('/api/v1/author/evidence'),null,2);
    jobs.textContent=JSON.stringify(await api('/api/v1/author/jobs'),null,2);
  } catch (e) {
    ev.textContent=String(e.message||e);
  }
};
const email=document.getElementById('email'), password=document.getElementById('password');
const me=document.getElementById('me'), file=document.getElementById('file'), up=document.getElementById('up');
const key=document.getElementById('key'), keyOut=document.getElementById('key-out');
const ev=document.getElementById('ev'), jobs=document.getElementById('jobs');
</script>
</body>
</html>
