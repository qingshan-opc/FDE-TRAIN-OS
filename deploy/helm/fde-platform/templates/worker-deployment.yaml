apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fde-platform.fullname" . }}-worker
  labels:
    {{- include "fde-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fde-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "fde-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "fde-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ["python", "-m", "services.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "fde-platform.fullname" . }}-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: DATABASE_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: S3_SECRET_KEY
            - name: LINGZHI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: LINGZHI_API_KEY
                  optional: true
            - name: ANYCODE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: ANYCODE_API_TOKEN
                  optional: true
            - name: ANYCODE_DASHBOARD_URL
              value: "http://127.0.0.1:{{ .Values.worker.anycode.port }}"
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: shared-workspace
              mountPath: /data/tmp_workspaces
          # Worker has no HTTP server; use process-alive exec probe
          livenessProbe:
            exec:
              command: ["python", "-c", "import services.worker"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import psycopg,os; psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=3).close()"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
        {{- if .Values.worker.anycode.enabled }}
        - name: anycode
          image: "{{ .Values.image.anycode.repository }}:{{ .Values.image.anycode.tag }}"
          imagePullPolicy: {{ .Values.image.anycode.pullPolicy }}
          {{- with .Values.image.anycode.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.image.anycode.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ANYCODE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fde-platform.secretName" . }}
                  key: ANYCODE_API_TOKEN
                  optional: true
            - name: HOME
              value: /home/anycode
          ports:
            - name: anycode
              containerPort: {{ .Values.worker.anycode.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: shared-workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: anycode-home
              mountPath: /home/anycode
            {{- if .Values.worker.anycode.skillsMount }}
            - name: fde-coach-skill
              mountPath: /home/anycode/.anycode/skills/fde-coach
              readOnly: true
            - name: fde-local-prep-skill
              mountPath: /home/anycode/.anycode/skills/fde-local-prep
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: anycode
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.anycode.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        # Shared between worker + anyCode sidecar for agent workspaces
        - name: shared-workspace
          emptyDir: {}
        {{- if .Values.worker.anycode.enabled }}
        - name: anycode-home
          emptyDir: {}
        {{- if .Values.worker.anycode.skillsMount }}
        - name: fde-coach-skill
          configMap:
            name: {{ include "fde-platform.fullname" . }}-fde-coach-skill
        - name: fde-local-prep-skill
          configMap:
            name: {{ include "fde-platform.fullname" . }}-fde-local-prep-skill
        {{- end }}
        {{- end }}
