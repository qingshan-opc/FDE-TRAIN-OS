  - id: c5
    title: 复盘与路线
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-11/section-05-two-week-review/lesson.md
    content: '同学们，最后十五分钟，咱们不看代码。把十天折叠成一张地图：十天前我以为这行是什么，现在我知道它是什么；十天前我以为 AI 会怎样，现在我知道它会什么、不会什么。填进 final-review.md，对吧。

      然后在行业地图上标你的位置——前端、接口、数据库、模型层各打勾、三角或叉。编排与安全单独一档，闸、日志、Skill，这是大多数人的空白，你已经有。大多数人学完一堆课还是不知道自己在哪，你知道长板短板，这就值，对吧。

      遇到问题现在怎么干？定位、假设、验证、记录——这套方法比任何单点技巧都管用。十天够入门加方法论加一套真作品，不够精通；精通是接下来九十天的事，咱们别急着一口气吃成胖子，对吧。

      最后选下一站：在职提效、求职转行、深入工程、还是独立产品。路线表在这，按下一站选，别按 hottest 选。想提效就先接真实数据；想求职就把十条证据翻译成简历语言；想深入工程就 WebSocket 和多 Agent——咱们各走各的路。

      课到这里就结束了，路才刚开始。你是 FDE 了，去部署的地方见。以后遇到问题，AI 导师配置在每节目录里，方法也在——你已经不需要被领着走了。带走一句：地图在手，下一站自己选，对吧。'
    practice: '完成标志：

      [ ] final-review.md 四部分填满，每条具体（不写「继续努力」这种话）

      [ ] 90 天路线有「本周内的第一个动作」

      [ ] commit 进 Git——这是课程的最后一个 commit'
    resource_ids:
    - dg-ten-day
    - dg-v2-panorama
    - glossary
    tools:
    - name: 90 天路线模板
      note: 目标 / 30d / 60d / 90d / 本周动作
    quiz:
    - - final-review.md 必须包含？
      - - 只有感谢信
        - 两周复盘 + 行业地图自评 + 90 天自学路线
        - 代码全文
      - 1
      - 复盘是上路的第一步——不是写完就扔。
    - - 行业地图自评每档必须？
      - - 凭感觉
        - 挂证据链接（文件路径或演示）
        - 抄同学
      - 1
      - ✓/△/✗ 都要说得出为什么——和证据思维一致。
    - - 90 天路线最低要求？
      - - 「继续学习 AI」
        - 可衡量目标 + 30/60/90 里程碑 + 本周第一个动作
        - 买课清单
      - 1
      - 拒绝空话——第一个动作本周就要做。
    media:
    - kind: video
      title: 口播课件 · 两周复盘
      object_key: documents/shared/course-media/day10-c5-gate10.mp4
      poster_key: documents/shared/course-media/day10-c5-gate10-poster.jpg
      duration_sec: 87
    knowledge_cards:
    - id: final-review
      term: final-review.md
      plain: 两周复盘 + 行业地图自评（✓/△/✗ 带证据）+ 90 天自学路线。
      tag: 交付
    - id: thought-knew
      term: 我以为 → 我知道
      plain: 三对认知翻转——训练营真正的个人收获。
      tag: 复盘
    - id: ninety-day
      term: 90 天路线
      plain: 可衡量目标 + 30/60/90 里程碑 + 本周第一个动作——拒绝空话。
      tag: 上路
    glossary_terms:
    - id: gt-fde
      term: FDE（Forward Deployed Engineer）
      plain: 定方向 + 做验收 + 能派活给 AI——答辩通过后你就是这个角色。
    local_prep:
      codex_prompt: '协助写 docs/final-review.md：两周复盘（做成/做错/下次）、行业地图自评、90 天自学路线（含更自主 Agent 要补的：幂等/注入/少闸信任分级）。

        要求具体到主题，不要鸡汤。'
      checklist:
      - final-review.md 四部分填满，每条具体（不写「继续努力」这种话）
      - 90 天路线有「本周内的第一个动作」
      - commit 进 Git——这是课程的最后一个 commit
quiz:
  pass_rate: 0.67
  questions:
  - q: 驾驶舱助手位三要件？
    options:
    - 头像/昵称/表情
    - 唤起 / 状态可见 / 闸在页内
    - 语音/视频/文字
    answer: 1
    explain: 驾驶位不是聊天框——刹车踩得到才叫接入。
  - q: 接入施工优先级？
    options:
    - 唤起优先
    - 闸 > 状态 > 唤起
    - 一样重要
    answer: 1
    explain: 一个真闸胜过三个半成品。
  - q: V2.0 全景包含？
    options:
    - 只有前端
    - 六区块 + Agent + 三 Skill + 助手位活着
    - 只有 Skill
    answer: 1
    explain: 九天逐层接电的最后一块拼图。
  - q: 十条能力证据的核心？
    options:
    - 凑数量
    - 每条有文件或演示支撑——能力不是说出来的是拿出来的
    - 背定义
    answer: 1
    explain: 答辩 = 拿证据，不是讲情怀。
  - q: 答辩 3+3+2 是？
    options:
    - 3 页纸 + 3 分钟 + 2 人
    - 作品 3′ + 架构 3′ + 迭代故事 2′
    - 三个问题 + 三个演示 + 两个评委
    answer: 1
    explain: 结构固定——一页纸提纲即可。
  - q: 演示中途系统挂了的兜底？
    options:
    - 跳过演示
    - 指着 runs/ 日志讲昨日成功记录
    - 怪网络
    answer: 1
    explain: 处理事故的方式也计分——日志是案底。
  - q: 诚实声明三件套？
    options:
    - 抱歉/谢谢/再见
    - 程度 + 差距 + 下一步
    - 不知道/没做过/不会
    answer: 1
    explain: 「我知道哪里弱」是第十一条证据。
  - q: GATE 10 互评要求？
    options:
    - 不需要
    - 至少收回 2 份互评表
    - 只评老师
    answer: 1
    explain: 互评是答辩组成部分。
  - q: final-review.md 包含？
    options:
    - 代码 dump
    - 两周复盘 + 行业地图自评 + 90 天路线
    - 只有感谢
    answer: 1
    explain: 复盘 + 自评 + 上路计划——毕业交付物。
  - q: FDE 称号何时获得？
    options:
    - Day 1 注册就有
    - 答辩通过后自然获得
    - 交学费就有
    answer: 1
    explain: 不是第一天发的帽子——今天走到那里。
  - q: 评委常问「Agent 什么时候会选错」，最佳素材？
    options:
    - 猜测
    - Day 8 agent-run-log 里的选错分析
    - 网上文章
    answer: 1
    explain: 用自己的注入测试和选型实验回答——最有说服力。
  - q: 90 天路线拒绝什么？
    options:
    - 具体里程碑
    - 「继续学习 AI」这类空话
    - 本周第一个动作
    answer: 1
    explain: 可衡量 + 分阶段 + 本周就能做的第一步。
  - q: 证据
    options:
    - 部署 URL
    - Git 迭代史——能讲演进故事
    - 方向卡
    answer: 1
    explain: commit 历史是十天能力的时间线证据。
  - q: 行业地图自评 ✓/△/✗ 必须？
    options:
    - 凭感觉
    - 每条挂证据链接
    - 全打 ✓
    answer: 1
    explain: 和证据思维一致——说得出为什么。
  - q: 迭代故事 2′ 建议讲什么？
    options:
    - 十个成功
    - 一个失败 + 怎么发现 + 怎么改 + 学到什么
    - 团队八卦
    answer: 1
    explain: 讲好一个失败比十个成功更像工程师。
