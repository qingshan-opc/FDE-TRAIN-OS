<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="Prompt 四要素">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".45"/>
    </filter>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="470" fill="#ffffff"/>
  <rect width="1040" height="470" fill="url(#dots)"/>
  <circle cx="970" cy="60" r="100" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="430" r="70" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="16" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="33" font-size="15" font-weight="800" fill="#231f20">Prompt 四要素 · 条条可验收</text>
    <text x="1004" y="33" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">PROMPT ×4</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <!-- 01 role -->
    <g>
      <rect x="60" y="52" width="440" height="132" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="84" y="86" font-size="15" font-weight="800" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">01 角色</text>
      <text x="84" y="110" font-size="12" fill="rgba(35,31,32,.6)">它是谁：「资深前端 + 数据可视化工程师」</text>
      <text x="84" y="138" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 输出风格漂移，每次长得都不一样</text>
      <text x="84" y="164" font-size="11" font-weight="700" fill="rgba(35,31,32,.45)" letter-spacing="1.5">ROLE</text>
    </g>
    <!-- 02 task -->
    <g>
      <rect x="540" y="52" width="440" height="132" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="564" y="86" font-size="15" font-weight="800" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">02 任务</text>
      <text x="564" y="110" font-size="12" fill="rgba(35,31,32,.6)">做什么：「生成单文件部门驾驶舱页面」</text>
      <text x="564" y="138" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 它自由发挥，给你一篇说明文</text>
      <text x="564" y="164" font-size="11" font-weight="700" fill="rgba(35,31,32,.45)" letter-spacing="1.5">TASK</text>
    </g>
    <!-- 03 constraints (hot) -->
    <g>
      <rect x="52" y="192" width="456" height="148" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4">
        <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="200" width="440" height="132" rx="16" fill="url(#teal)" filter="url(#glow)"/>
      <text x="84" y="234" font-size="15" font-weight="800" fill="#fff" font-family="'SF Mono',Menlo,monospace">03 约束</text>
      <text x="84" y="258" font-size="12" fill="rgba(255,255,255,.92)">必须/不许：「单 HTML · 无外部依赖 · 指标 ≤5」</text>
      <text x="84" y="286" font-size="11" fill="rgba(255,255,255,.8)">缺了 → 无法验收——约束就是 Rubric 的上游</text>
      <text x="84" y="312" font-size="11" font-weight="700" fill="rgba(255,255,255,.9)" letter-spacing="1">CONSTRAINTS · 至少 3 条、条条可验收</text>
    </g>
    <!-- 04 format -->
    <g>
      <rect x="540" y="200" width="440" height="132" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="564" y="234" font-size="15" font-weight="800" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">04 格式</text>
      <text x="564" y="258" font-size="12" fill="rgba(35,31,32,.6)">长什么样：「五区块 · 三态占位 · 语义化结构」</text>
      <text x="564" y="286" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 对不上线框，拼装时全是缝</text>
      <text x="564" y="312" font-size="11" font-weight="700" fill="rgba(35,31,32,.45)" letter-spacing="1.5">FORMAT</text>
    </g>

    <!-- bad → good -->
    <rect x="60" y="360" width="330" height="40" rx="20" fill="rgba(35,31,32,.05)"/>
    <text x="225" y="385" text-anchor="middle" font-size="13" fill="rgba(35,31,32,.45)" text-decoration="line-through">「请设计得高端、大气、智能」</text>
    <line x1="404" y1="380" x2="452" y2="380" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#pf-arrow)">
      <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <rect x="466" y="360" width="514" height="40" rx="20" fill="rgba(13,148,136,.10)"/>
    <text x="723" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">可验收：「单文件 · 无依赖 · 五区块 · 三态占位」</text>

    <text x="520" y="440" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">空泛形容词不产生任何像素 —— 每条约束都要能回答「怎么算做到」</text>
  </g>
</svg>
