      <rect x="16" y="112" width="56" height="30" rx="9" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1"/><text x="44" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#231f20">筛选</text><path d="M74 127 H80" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" from="6" to="0" dur="0.9s" repeatCount="indefinite"/></path><rect x="82" y="112" width="56" height="30" rx="9" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1"/><text x="110" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#231f20">面试</text><path d="M140 127 H146" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" from="6" to="0" dur="0.9s" repeatCount="indefinite"/></path><rect x="148" y="112" width="56" height="30" rx="9" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1"/><text x="176" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#231f20">offer</text>
      <rect x="20" y="166" width="192" height="46" rx="12" fill="rgba(13,148,136,.07)" stroke="#0d9488" stroke-width="1.5"/>
