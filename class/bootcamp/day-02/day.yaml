day: 2
project: 把 UI 原型变成能运行的前端
project_brief: >-
  学员承接 Day 1 已确认的 PRD.md、design-spec.md、ui-flow.md 和 ui-prototype.html，
  在 TRAE 中手动切换 @前端，把交互原型实现为可直接运行的三文件前端；
  亲手检查页面、交互与四种数据状态，再切回 @UI 验收还原度，最后把 frontend-api-needs.md 交给 @后端。
  Day 2 的重点不是背代码，而是学会文件交接、分段指挥、运行验证、责任岗位修复和下游交付。

resources:
  - id: agent-frontend
    title: 智能体提示词 · 前端
    kind: download
    summary: 把 UI 原型实现为可运行页面，并整理后端数据需求
    url: /course-assets/bootcamp/day-01/agent-prompts/03-frontend.md
  - id: frontend-handoff-card
    title: 速查卡 · UI 到前端交接
    kind: doc
    summary: 四份输入文件、五句复述和确认开发闸门
    url: /course-assets/bootcamp/day-02/section-02-frontend-handoff/resources.md
  - id: frontend-basics-card
    title: 速查卡 · 前端三层职责
    kind: doc
    summary: HTML 管结构、CSS 管样式、JavaScript 管行为
    url: /course-assets/bootcamp/day-02/section-03-frontend-basics/resources.md
  - id: frontend-accept-card
    title: 清单 · 前端运行与四状态验收
    kind: doc
    summary: 可打开、可操作、无报错、加载/空/成功/错误齐全
    url: /course-assets/bootcamp/day-02/section-05-accept-and-repair/resources.md
  - id: api-needs-card
    title: 模板 · frontend-api-needs.md
    kind: doc
    summary: 页面数据、提交字段、期待返回和错误展示的后端交接模板
    url: /course-assets/bootcamp/day-02/section-06-ui-review-backend-handoff/resources.md

capsule_extra:
  c1:
    resource_ids: [agent-frontend]
    media:
      - kind: video
        title: 口播课件 · 原型为什么还不是前端
        object_key: documents/shared/course-media/day02-c1-prototype-vs-frontend-v2.mp4
        poster_key: documents/shared/course-media/day02-c1-prototype-vs-frontend-v2-poster.jpg
        duration_sec: 193
    knowledge_cards:
      - id: prototype-vs-frontend
        term: 原型与正式前端
        plain: 原型确认页面和操作是否合理；正式前端还要可运行、可维护、处理状态并为真实数据留入口。
        tag: 边界
      - id: frontend-role-shift
        term: 前端岗位价值上移
        plain: 传统前端大量时间用于手写页面；AI 时代更重视拆任务、约束实现、运行检查和交付质量。
        tag: AI 时代
      - id: no-self-change-requirement
        term: 不擅改需求
        plain: 前端负责实现已确认的页面，发现需求缺口应返回产品经理或 UI，而不是自己增加功能。
        tag: 责任
    glossary_terms:
      - id: gt-prototype
        term: Prototype · 原型
        plain: 用较低成本提前确认页面结构与操作路径的样品。
      - id: gt-frontend
        term: Frontend · 前端
        plain: 用户在浏览器里看到并操作的正式界面实现。
    quiz:
      - - Day1 的 ui-prototype.html 为什么不能直接当作正式前端完成交付？
        - [因为文件名不对, 因为它主要验证设计，未必具备工程结构、完整状态和后端接入边界, 因为 HTML 不能在浏览器打开]
        - 1
        - 原型解决“方向对不对”，正式前端还要解决“能否稳定运行、怎样维护以及如何连接真实数据”。
      - - AI 时代前端岗位最重要的变化是什么？
        - [不再需要验收, 从只关注手写代码转向定义约束、指挥生成和运行验收, 可以自行修改产品需求]
        - 1
        - AI 提高生产速度后，人更需要对页面结构、交互状态和最终质量负责。
    tools:
      - name: 原型与前端对比卡
        note: 样品确认方向；正式前端承担运行、状态和后续数据接入
      - name: 前端责任边界卡
        note: 不改需求、不编接口、不把密钥写进页面

  c2:
    resource_ids: [agent-frontend, frontend-handoff-card]
    media:
      - kind: video
        title: 口播课件 · 把四份文件交给前端
        object_key: documents/shared/course-media/day02-c2-frontend-handoff-v2.mp4
        poster_key: documents/shared/course-media/day02-c2-frontend-handoff-v2-poster.jpg
        duration_sec: 222
    knowledge_cards:
      - id: four-inputs
        term: 前端四份输入
        plain: PRD 说明做什么，设计规范说明长什么样，UI 流程说明怎样操作，原型提供可观察参考。
        tag: 交接
      - id: repeat-before-build
        term: 开工前复述
        plain: 前端先复述用户、页面、核心操作、状态和验收标准，学员确认后才开发。
        tag: 防错
      - id: implementation-list
        term: 前端实施清单
        plain: 写清文件结构、页面区块、交互、演示数据和暂不连接的真实接口。
        tag: 计划
    glossary_terms:
      - id: gt-handoff-input
        term: 交接输入
        plain: 下游岗位开工前必须读取并确认的上游文件。
      - id: gt-confirm-build
        term: 确认开发
        plain: 学员确认实施清单后，允许前端开始生成正式文件的人工闸门。
    quiz:
      - - 前端开始生成文件前，第一步应该做什么？
        - [先选框架, 读取四份上游文件并复述理解, 先编一个后端接口]
        - 1
        - 先确认输入和理解，才能避免把错误需求快速做成完整页面。
      - - 缺少 design-spec.md 时，前端正确做法是什么？
        - [自己猜一个风格, 停止并提示回到 UI 补齐, 删除 PRD]
        - 1
        - 上游交付不完整时应回到责任岗位补齐，不能由前端擅自补写设计事实。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: |
        本节只完成交接确认，不生成前端文件。请逐段操作，每段完成后再继续。

        【第 1 段｜切换 @前端并检查文件】
        切换到 @前端，发送：请检查工作区根目录是否存在 PRD.md、design-spec.md、ui-flow.md 和 ui-prototype.html。现在不要生成代码。缺少文件时只告诉我缺什么、应切回哪个岗位补齐。

        【第 2 段｜五句复述】
        四份文件齐全。请用 5 句话复述：目标用户、页面范围、最重要操作、必须出现的数据状态、前端验收标准。输出后停止，等我确认。

        【第 3 段｜纠正理解】
        请把我指出的理解偏差写成“原理解 / 文件依据 / 修正后理解”。不要改动上游文件。修正后再次输出五句复述。

        【第 4 段｜前端实施清单】
        我确认理解一致。请给出《前端实施清单》：使用 frontend/index.html、frontend/styles.css、frontend/app.js 三个文件；列出页面区块、必须可操作的按钮、演示数据位置、加载/空数据/成功/错误四种状态，以及本节明确不连接的真实接口。输出后停止，等我回复“确认开发”。
      checklist:
        - 已切换到 @前端
        - 四份上游文件均存在并被读取
        - 前端已完成五句复述，理解偏差已纠正
        - 实施清单明确采用三文件无构建方案
        - 学员本人回复了“确认开发”
      suggested_questions:
        - 缺少某个 Day1 文件怎么办？
        - 前端复述和 PRD 不一致怎么办？
        - 为什么先不用 React 或 Vue？
      template_resource_id: agent-frontend
    tools:
      - name: TRAE · @前端
        note: 先读取、复述、列计划，未确认前不生成代码
      - name: 四文件交接检查
        note: PRD / design-spec / ui-flow / ui-prototype

  c3:
    resource_ids: [frontend-basics-card]
    media:
      - kind: video
        title: 口播课件 · 用人话看懂前端三件套
        object_key: documents/shared/course-media/day02-c3-frontend-basics-v2.mp4
        poster_key: documents/shared/course-media/day02-c3-frontend-basics-v2-poster.jpg
        duration_sec: 181
    knowledge_cards:
      - id: html-structure
        term: HTML 管结构
        plain: 决定页面有哪些标题、表格、表单、按钮和内容区块。
        tag: 三件套
      - id: css-style
        term: CSS 管样式
        plain: 决定颜色、字号、间距、布局以及按钮的不同外观状态。
        tag: 三件套
      - id: js-behavior
        term: JavaScript 管行为
        plain: 负责点击、筛选、校验、状态切换和演示数据更新。
        tag: 三件套
      - id: four-data-states
        term: 四种数据状态
        plain: 页面不能只展示顺利结果，还要明确加载、空数据、成功和错误时用户看到什么。
        tag: 真实页面
    glossary_terms:
      - id: gt-browser
        term: Browser · 浏览器
        plain: 打开和运行前端页面的应用，例如 Chrome 或 Edge。
      - id: gt-console
        term: Console · 控制台
        plain: 浏览器中查看 JavaScript 报错和调试信息的位置。
      - id: gt-demo-data
        term: 演示数据
        plain: 为验证页面交互而准备的虚构或脱敏数据，不代表真实业务数据已经接通。
    quiz:
      - - 点击筛选按钮后列表发生变化，主要是哪一层负责？
        - [HTML, CSS, JavaScript]
        - 2
        - 页面行为和数据状态切换由 JavaScript 负责。
      - - 为什么要在没有后端时演示错误状态？
        - [为了让页面更复杂, 为了提前确认出错时用户看到什么、怎样继续操作, 因为错误状态等于真实接口]
        - 1
        - 状态设计应在接后端前确认，否则联调时才发现缺页面会增加返工。
    tools:
      - name: 前端三件套职责图
        note: HTML 是骨架，CSS 是衣服，JavaScript 是动作
      - name: 浏览器控制台
        note: 学员只需学会打开并判断是否出现红色错误

  c4:
    resource_ids: [agent-frontend, frontend-handoff-card]
    media:
      - kind: video
        title: 口播课件 · 分段生成可运行页面
        object_key: documents/shared/course-media/day02-c4-build-running-page-v2.mp4
        poster_key: documents/shared/course-media/day02-c4-build-running-page-v2-poster.jpg
        duration_sec: 220
    knowledge_cards:
      - id: no-build-first
        term: 无构建三文件方案
        plain: 首个前端使用 HTML、CSS、JavaScript 三个文件，双击即可运行，先降低环境和依赖风险。
        tag: 小白友好
      - id: one-step-one-check
        term: 一段一验
        plain: 先建结构、再加样式、再加交互，每完成一段就运行检查，不把全部风险堆到最后。
        tag: 方法
      - id: demo-data-center
        term: 演示数据集中管理
        plain: 把演示数据集中放在 app.js，后端接入时更容易找到替换位置。
        tag: 交接
    glossary_terms:
      - id: gt-build-tool
        term: 构建工具
        plain: 把源码处理成浏览器可运行文件的工程工具；Day2 第一版暂不引入。
      - id: gt-relative-path
        term: 相对路径
        plain: 文件之间按当前目录建立引用，例如 index.html 引入 styles.css。
    quiz:
      - - Day2 为什么优先采用三文件无构建方案？
        - [因为框架永远不好, 为了减少环境问题，让小白先看懂运行和验收闭环, 因为 JavaScript 只能写一个文件]
        - 1
        - 第一版先控制变量；后续掌握流程后再选择框架，不影响核心工程思维。
      - - AI 一次生成完所有文件后页面打不开，最合理的改进是什么？
        - [重复发送同一句话, 拆成结构、样式、交互三个阶段，每阶段运行检查, 直接跳到后端]
        - 1
        - 分段生成能更快定位问题，也让学员知道每一步新增了什么能力。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: |
        继续使用 @前端。下面四段必须逐段发送，每段完成后亲手运行再继续。

        【第 1 段｜建立三文件骨架】
        我已确认《前端实施清单》。请创建 frontend/index.html、frontend/styles.css、frontend/app.js。第一步只建立完整页面结构和文件引用，不加入复杂交互。完成后告诉我怎样直接打开页面，以及三个文件各自负责什么。

        【第 2 段｜按 UI 规范实现样式】
        页面结构已能打开。请读取 design-spec.md 和 ui-prototype.html，把颜色、字号、间距、布局和按钮状态实现到 frontend/styles.css。不要改变 PRD 的页面范围。完成后列出 5 个可以肉眼核对的设计点。

        【第 3 段｜加入真实可见交互】
        样式已确认。请读取 ui-flow.md，在 frontend/app.js 中实现原型要求的筛选、表单或主要按钮行为；演示数据集中写在文件顶部。每次操作都必须产生可见反馈，不连接真实后端。

        【第 4 段｜补齐四种状态】
        请为页面补齐加载、空数据、成功和错误四种状态，并提供一个小白能找到的演示入口或切换方法。完成后停止，不要替我宣布验收通过。
      checklist:
        - frontend 目录中存在 index.html、styles.css、app.js
        - 双击 index.html 可以打开页面
        - HTML 正确引用 styles.css 和 app.js
        - 至少一个主要操作产生可见反馈
        - 演示数据集中放在 app.js
        - 加载、空数据、成功和错误四种状态均可检查
      suggested_questions:
        - 双击 index.html 是空白页怎么办？
        - 按钮点击没有反应怎么描述给前端？
        - 演示数据和真实数据有什么区别？
      template_resource_id: agent-frontend
    tools:
      - name: TRAE 文件区
        note: 检查 frontend 目录与三个文件是否真实落盘
      - name: 浏览器预览
        note: 每完成一段就重新打开或刷新页面

  c5:
    resource_ids: [frontend-accept-card, agent-frontend]
    media:
      - kind: video
        title: 口播课件 · 亲手验收并完成一次修复
        object_key: documents/shared/course-media/day02-c5-accept-and-repair-v2.mp4
        poster_key: documents/shared/course-media/day02-c5-accept-and-repair-v2-poster.jpg
        duration_sec: 200
    knowledge_cards:
      - id: run-evidence
        term: 运行证据
        plain: 文件存在不等于可用，必须亲手打开页面、操作按钮并观察结果。
        tag: 验收
      - id: observable-feedback
        term: 可见反馈
        plain: 点击、提交或筛选后，页面必须出现用户能看到的变化，而不是只在代码里写了函数。
        tag: 交互
      - id: repair-owner
        term: 责任岗位修复
        plain: 学员描述现象和预期，前端负责修改；验收者不越过岗位直接替它改代码。
        tag: 闭环
    glossary_terms:
      - id: gt-console-error
        term: 控制台错误
        plain: 浏览器控制台中的红色报错，通常说明脚本、文件路径或运行逻辑有问题。
      - id: gt-retest
        term: Retest · 复测
        plain: 修复完成后重新执行原来的操作，确认问题确实消失且没有引入新问题。
    quiz:
      - - 文件都存在，但按钮点击没有变化，能否通过？
        - [可以，文件存在就行, 不可以，主要操作必须产生可见反馈, 可以，等后端接入再说]
        - 1
        - Day2 验收的是可运行前端，不是静态截图或只有文件名的空壳。
      - - 发现问题后，最清楚的反馈格式是什么？
        - [不好用，重做, 在什么页面做什么操作、实际看到什么、预期应该什么, 代码肯定错了]
        - 1
        - 用“位置、操作、实际、预期”描述问题，AI 才能准确修复并让学员复测。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: |
        本节先由你亲手检查，再让 @前端修复。不要跳过复测。

        【第 1 段｜人工运行检查】
        打开 frontend/index.html，依次检查：页面能打开；主要文字和区块齐全；至少一个按钮、筛选或表单能操作；加载、空数据、成功、错误四种状态能看到；浏览器控制台没有红色错误。把结果写成“通过/不通过”。

        【第 2 段｜把问题说清楚】
        对每个不通过项写四句话：所在页面或区块、我做了什么、实际出现什么、预期应该什么。不要只说“不好看”或“没反应”。

        【第 3 段｜交给 @前端 修复】
        切换到 @前端，发送：请只修复下面的问题，不改变已通过部分和 PRD 范围。逐项说明原因、修改文件和复测步骤。问题清单：〈粘贴你的四句描述〉。

        【第 4 段｜亲手复测并记录】
        修复完成后，重新执行完全相同的操作。把第一次结果、修改内容和复测结果写入 frontend-acceptance.md。至少完成一条真实或导师指定的模拟问题闭环。
      checklist:
        - 页面可直接打开且没有空白屏
        - 主要交互产生可见反馈
        - 四种数据状态均可检查
        - 控制台没有红色错误
        - 问题按“位置/操作/实际/预期”描述
        - frontend-acceptance.md 记录了修复与复测
      suggested_questions:
        - 浏览器控制台在哪里打开？
        - 怎样区分空数据和加载失败？
        - 修复后怎样确认没有破坏其他功能？
      template_resource_id: frontend-accept-card
    tools:
      - name: 浏览器 + 开发者工具
        note: 页面看结果，控制台看红色错误
      - name: 四句问题模板
        note: 位置 / 操作 / 实际 / 预期

  c6:
    resource_ids: [agent-frontend, api-needs-card, frontend-accept-card]
    media:
      - kind: video
        title: 口播课件 · UI 复验与后端交接
        object_key: documents/shared/course-media/day02-c6-ui-review-backend-handoff-v2.mp4
        poster_key: documents/shared/course-media/day02-c6-ui-review-backend-handoff-v2-poster.jpg
        duration_sec: 234
    knowledge_cards:
      - id: ui-review
        term: UI 还原度复验
        plain: 前端完成后由 UI 对照设计规范和交互流程检查，不让前端自己验收自己。
        tag: 岗位协作
      - id: api-needs
        term: 前端数据需求
        plain: 前端说明每个页面需要什么字段、提交什么内容、期待怎样返回以及错误如何展示。
        tag: 后端输入
      - id: no-fake-api
        term: 不编造接口
        plain: Day2 只描述数据需求，不自行承诺不存在的接口地址和返回结构。
        tag: 边界
    glossary_terms:
      - id: gt-field
        term: Field · 字段
        plain: 一条数据中有明确含义的项目，例如姓名、金额、状态、日期。
      - id: gt-api-need
        term: API Need · 接口需求
        plain: 前端为了展示和提交数据，对后端提出的可核对信息要求。
    quiz:
      - - UI 复验发现间距不符合 design-spec.md，谁负责修改？
        - [UI 直接改前端代码, 前端按 UI 的可量化问题清单修改，UI 再复验, 后端修改]
        - 1
        - 验收者指出依据和差距，责任岗位修改，然后回到验收者复验。
      - - frontend-api-needs.md 应该写什么？
        - [虚构完整接口地址, 页面需要的数据字段、提交内容、期待返回和错误展示, 部署服务器密码]
        - 1
        - 它是给后端的需求输入，不是由前端单方面宣布完成的接口合同。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: |
        本节包含三次岗位切换，必须逐段完成。

        【第 1 段｜切换 @UI 复验】
        切换到 @UI，发送：请读取 design-spec.md、ui-flow.md 和 frontend 目录中的三个文件。只验收，不直接修改。逐项输出“通过/不通过、文件依据、可量化差距、责任岗位”。

        【第 2 段｜切回 @前端 修复】
        如有不通过项，切换到 @前端，发送：请只处理 UI 的问题清单，说明修改文件和复测方法。完成后我会再次切回 UI。然后回到 @UI 复验，直到全部通过。

        【第 3 段｜让前端生成后端交接文件】
        切换到 @前端，发送：请根据已通过的页面生成 frontend-api-needs.md。按页面或功能列出：展示所需字段、字段含义、用户提交内容、期待后端返回内容、加载/空数据/错误的展示方式。不要编造接口地址，不要写密钥。

        【第 4 段｜切换 @后端 接收】
        切换到 @后端，发送：请先读取 PRD.md 和 frontend-api-needs.md，只复述你收到的业务规则、页面数据需求和需要确认的问题。现在不要开发接口，等我确认 Day3 开工。

        【第 5 段｜记录 Day2 交接】
        创建 day2-handoff-log.md，记录 UI → 前端 → UI → 前端 → 后端每次切换的输入文件、输出文件、验收结果和修改轮次。
      checklist:
        - UI 已按设计规范和交互流程复验前端
        - UI 不通过项已由前端修复并完成复验
        - frontend-api-needs.md 已列出字段、提交、返回和错误展示
        - 文件中没有虚构接口地址或密钥
        - 已切换 @后端 完成接收复述但未提前开发
        - day2-handoff-log.md 记录完整岗位链
      suggested_questions:
        - UI 的反馈太主观怎么办？
        - 前端不知道后端接口地址该怎么写？
        - 为什么后端这节只能复述不能开发？
      template_resource_id: api-needs-card
    tools:
      - name: TRAE · @UI
        note: 复验设计还原度，不直接改前端代码
      - name: TRAE · @后端
        note: 只接收并复述 Day3 输入，不提前开发

quiz:
  - - Day2 开始时，前端必须先读取哪组文件？
    - [PRD、设计规范、UI 流程、UI 原型, 测试报告、部署说明, 数据库密码、服务器地址]
    - 0
    - 四份 Day1 文件分别提供需求、设计、交互和可观察参考。
  - - HTML、CSS、JavaScript 的职责对应关系是？
    - [结构、样式、行为, 样式、数据库、部署, 行为、结构、测试]
    - 0
    - HTML 管结构，CSS 管样式，JavaScript 管行为。
  - - 为什么 Day2 第一版不用复杂框架和构建工具？
    - [因为以后永远不能用, 为了减少环境变量，先完成运行与验收闭环, 因为浏览器不支持框架]
    - 1
    - 小白先把工程流程走通，再增加工具复杂度更稳妥。
  - - 页面只有成功状态，其他状态没有设计，能否通过？
    - [能，成功最重要, 不能，还要检查加载、空数据和错误状态, 能，后端会自动补]
    - 1
    - 真正页面必须能解释等待、无数据和失败时用户看到什么。
  - - UI 发现前端与设计规范不一致，正确流程是什么？
    - [UI 直接改代码, UI 列出依据和差距，前端修改，UI 复验, 产品经理删除需求]
    - 1
    - 岗位职责要清楚：验收者提出问题，责任岗位修复，再回原岗位复验。
  - - Day2 最后交给后端的核心文件是什么？
    - [frontend-api-needs.md, ui-prototype.html 的截图, 服务器密码]
    - 0
    - 后端需要从前端数据需求中理解页面要展示、提交和处理哪些数据。

