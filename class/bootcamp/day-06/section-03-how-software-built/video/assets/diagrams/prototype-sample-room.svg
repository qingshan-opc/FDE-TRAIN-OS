<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="原型确认：先出样板间再动工">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">原型确认：先出样板间，再动工</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">PROTOTYPE</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="110" y="86" width="250" height="84" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="235.0" y="126.0" font-size="15" font-weight="700" fill="#231f20" text-anchor="middle">线框图</text>
<text x="235.0" y="148.0" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">骨架长什么样</text>
</g>
<path d="M366 128.0 L409 128.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="415" y="86" width="250" height="84" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="540.0" y="126.0" font-size="15" font-weight="700" fill="#231f20" text-anchor="middle">高保真原型</text>
<text x="540.0" y="148.0" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">每天打开做哪几步</text>
</g>
<path d="M671 128.0 L714 128.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="712" y="78" width="266" height="100" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="720" y="86" width="250" height="84" rx="16" fill="url(#tlg)" filter="url(#glow)"/>
<text x="845.0" y="126.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">客户确认 ✓</text>
<text x="845.0" y="148.0" font-size="10.5" fill="rgba(255,255,255,.85)" text-anchor="middle">满意了才开发</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="110" y="226" font-size="12" font-weight="700" fill="rgba(35,31,32,.6)">改一张图</text>
<rect x="200" y="212" width="60" height="16" rx="8" fill="url(#bar)"/>
<text x="272" y="226" font-size="12" font-weight="700" fill="#0f766e">十分钟</text>
<text x="110" y="258" font-size="12" font-weight="700" fill="rgba(35,31,32,.6)">改写好的程序</text>
<rect x="200" y="244" width="420" height="16" rx="8" fill="rgba(35,31,32,.15)"/>
<text x="632" y="258" font-size="12" font-weight="700" fill="rgba(35,31,32,.55)">可能十天</text>
<text x="110" y="292" font-size="12.5" font-weight="800" fill="#231f20">改图便宜，改程序贵 —— 所以确认要趁早</text>
</g>
</svg>
