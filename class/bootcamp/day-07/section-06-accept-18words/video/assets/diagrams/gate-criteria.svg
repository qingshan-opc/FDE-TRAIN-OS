<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="过闸标准四条">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">过闸标准：四条全勾，才算过</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">GATE · 4 CRITERIA</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="80" width="450" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<circle cx="94" cy="118" r="14" fill="url(#tlg)"/>
<text x="94" y="123" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
<text x="120" y="112" font-size="13.5" font-weight="800" fill="#231f20">抽测 ≥ 12 分</text>
<text x="120" y="136" font-size="11" fill="rgba(35,31,32,.55)">18 词随机 12 题</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="530" y="80" width="450" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<circle cx="564" cy="118" r="14" fill="url(#tlg)"/>
<text x="564" y="123" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
<text x="590" y="112" font-size="13.5" font-weight="800" fill="#231f20">认知卡六大主题齐全</text>
<text x="590" y="136" font-size="11" fill="rgba(35,31,32,.55)">每主题一张，写自己的话</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="170" width="450" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<circle cx="94" cy="208" r="14" fill="url(#tlg)"/>
<text x="94" y="213" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
<text x="120" y="202" font-size="13.5" font-weight="800" fill="#231f20">口头解释任意三个词</text>
<text x="120" y="226" font-size="11" fill="rgba(35,31,32,.55)">三十秒讲清楚</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="530" y="170" width="450" height="76" rx="16" fill="#fff" filter="url(#sh)"/>
<circle cx="564" cy="208" r="14" fill="url(#tlg)"/>
<text x="564" y="213" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
<text x="590" y="202" font-size="13.5" font-weight="800" fill="#231f20">同桌能复述核心一句</text>
<text x="590" y="226" font-size="11" fill="rgba(35,31,32,.55)">讲明白才算真懂</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="270" width="600" height="36" rx="18.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="292.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">过了这闸，Week 2 的 Agent / Skill 才有共同语言</text></g>
</svg>
