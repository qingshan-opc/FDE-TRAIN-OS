    title: 公司组织图上看不到的信息
    minutes: 45
    form: 视频+答题
    content_ref: class/bootcamp/day-13/section-01-org-chart-invisible/lesson.md
    content: 本模块视频尚未上传。请先阅读重点卡与情境题干，视频上线后可回看补齐。
    tools:
    - name: 情境判断
      note: 先分清目标、角色、风险与下一步
    quiz:
    - - 启元新材中，哪一项最能证明周国强具有较强的非正式影响力？
      - &id001
        - 他的工龄最长。
        - 他的职位在销售经理之下。
        - 同事遇到难客户常先问他，陈总也会带他参加关键谈判。
        - 他对AI项目表达了担忧。
      - 2
      - 工龄和态度都不能单独证明影响力。被同事征询、参与关键决策或能改变他人行动，属于更可靠的行为证据。
    - - 李敏维护销售询价表，但无权决定客户数据能否上传外部模型。她最准确的角色组合是：
      - &id002
        - 业务所有者＋最终决策者
        - 保管者＋维护者
        - 专业审核者＋项目发起人
        - 非正式影响者＋财务责任人
      - 1
      - 李敏掌握文件并负责日常更新，符合保管者和维护者。数据授权需要由具备管理责任的人确认。
    - - 赵工要求所有技术参数问答经过人工审核。最合适的判断是：
      - &id003
        - 他担心AI削弱技术部权力。
        - 他属于专业责任把关人，提出了需要进入项目范围的审核条件。
        - 他不理解AI，应由陈总要求其配合。
        - 他在故意拖延，先绕开技术部完成版本。
      - 1
      - 赵工承担技术准确性的专业责任。审核要求有明确业务和风险依据，应进入项目边界。其个人态度仍需通过后续行为判断。
    - - 孙经理在会上表示支持，但尚未指定试点人员，也未安排数据整理时间。当前最稳妥的记录是：
      - &id004
        - 主动支持，项目已经获得销售部全部资源。
        - 有条件支持或待验证，需要观察其是否提供资源并承担业务责任。
        - 明确抵触，应直接向陈总汇报。
        - 无关人员，可以绕过。
      - 1
      - 口头表态是一条证据，资源投入和责任承诺仍需验证。当前应记录角色、初步态度和下一项验证动作。
    - - 林晨准备启动销售问答试点。下列哪一组沟通顺序风险最低？
      - &id005
        - 先找李敏导出全量数据→做出原型→再向孙经理汇报→最后请赵工审核。
        - 先让陈总在群里要求配合→向所有人收资料→直接安排试用。
        - 确认陈总授权与范围→确认孙经理业务责任和资源→了解李敏、周国强的数据与语境→请赵工设定审核边界→组织小范围试用。
        - 只使用市场部资料完成演示，销售和技术以后再说。
      - 2
      - 该顺序先解决授权和业务责任，再进入真实资料和专业边界，最后组织试用，能够降低越权、返工和责任不清。
    - - 陈总让林晨“自己协调”。林晨最稳妥的第一步是：
      - &id006
        - 直接在跨部门群里发布老板要求
        - 先确认协调权限、第一版范围和敏感数据边界
        - 先找职位最低的人收集资料
        - 先做出原型再说明
      - 1
      - 老板授权需要转化为可执行边界。确认范围以后，再与业务负责人和关键角色沟通。
