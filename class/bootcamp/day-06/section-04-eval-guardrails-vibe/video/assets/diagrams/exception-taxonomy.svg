<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="Skill 异常分类与处置">
<rect width="1040" height="450" fill="#f2f5f0"/>
<!-- 根 -->
<rect x="420" y="36" width="200" height="54" fill="#231f20"/>
<text x="520" y="69" text-anchor="middle" font-size="13.5" font-weight="800" fill="#f2f5f0">Skill 出错了</text>
<g stroke="rgba(35,31,32,.4)" stroke-width="1.5">
<line x1="470" y1="90" x2="180" y2="130"/><line x1="495" y1="90" x2="455" y2="130"/><line x1="545" y1="90" x2="645" y2="130"/><line x1="570" y1="90" x2="870" y2="130"/>
</g>
<!-- 四类 -->
<g>
<rect x="60" y="130" width="220" height="230" fill="#ffffff" stroke="#f5a947" stroke-width="2"/>
<text x="170" y="162" text-anchor="middle" font-size="13" font-weight="800" fill="#d18a1f">输入类</text>
<text x="170" y="182" text-anchor="middle" font-size="9.5" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">BAD INPUT</text>
<text x="80" y="212" font-size="11" fill="rgba(35,31,32,.6)">月份写成「七月」</text>
<text x="80" y="234" font-size="11" fill="rgba(35,31,32,.6)">缺必填参数</text>
<text x="80" y="268" font-size="11" font-weight="700" fill="#231f20">处置：拒收 + 说人话</text>
<text x="80" y="292" font-size="10.5" fill="rgba(35,31,32,.55)">「month 需要 2026-07</text>
<text x="80" y="310" font-size="10.5" fill="rgba(35,31,32,.55)">这样的格式」</text>
</g>
<g>
<rect x="310" y="130" width="220" height="230" fill="#ffffff" stroke="#5f52a0" stroke-width="2"/>
<text x="420" y="162" text-anchor="middle" font-size="13" font-weight="800" fill="#5f52a0">依赖类</text>
<text x="420" y="182" text-anchor="middle" font-size="9.5" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">DEPENDENCY DOWN</text>
<text x="330" y="212" font-size="11" fill="rgba(35,31,32,.6)">数据库连不上</text>
<text x="330" y="234" font-size="11" fill="rgba(35,31,32,.6)">上游接口 500</text>
<text x="330" y="268" font-size="11" font-weight="700" fill="#231f20">处置：重试 → 降级 → 报错</text>
<text x="330" y="292" font-size="10.5" fill="rgba(35,31,32,.55)">最多重试 N 次，仍挂</text>
<text x="330" y="310" font-size="10.5" fill="rgba(35,31,32,.55)">用缓存/上次的产物顶上</text>
</g>
<g>
<rect x="560" y="130" width="220" height="230" fill="#ffffff" stroke="#e0479e" stroke-width="2"/>
<text x="670" y="162" text-anchor="middle" font-size="13" font-weight="800" fill="#e0479e">模型类</text>
<text x="670" y="182" text-anchor="middle" font-size="9.5" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">MODEL MISFIRE</text>
<text x="580" y="212" font-size="11" fill="rgba(35,31,32,.6)">超时没返回</text>
<text x="580" y="234" font-size="11" fill="rgba(35,31,32,.6)">输出胡说 / 格式崩</text>
<text x="580" y="268" font-size="11" font-weight="700" fill="#231f20">处置：切断 + 校验 + 人工</text>
<text x="580" y="292" font-size="10.5" fill="rgba(35,31,32,.55)">超时切断；输出过格式</text>
<text x="580" y="310" font-size="10.5" fill="rgba(35,31,32,.55)">校验，不过转人工</text>
</g>
<g>
<rect x="810" y="130" width="220" height="230" fill="#ffffff" stroke="#f24e54" stroke-width="2"/>
<text x="920" y="162" text-anchor="middle" font-size="13" font-weight="800" fill="#c92f3d">业务类</text>
<text x="920" y="182" text-anchor="middle" font-size="9.5" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">POLICY</text>
<text x="830" y="212" font-size="11" fill="rgba(35,31,32,.6)">要求超出授权范围</text>
<text x="830" y="234" font-size="11" fill="rgba(35,31,32,.6)">触碰敏感数据</text>
<text x="830" y="268" font-size="11" font-weight="700" fill="#231f20">处置：拒绝 + 转人工</text>
<text x="830" y="292" font-size="10.5" fill="rgba(35,31,32,.55)">边界声明里写死，</text>
<text x="830" y="310" font-size="10.5" fill="rgba(35,31,32,.55)">没有「酌情处理」</text>
</g>
<!-- 底注 -->
<text x="520" y="402" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">「按声明的方式失败」也是合格 —— 乱失败才是不合格</text>
<text x="520" y="428" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.55)">第八天异常注入测试：故意喂坏输入，看它是不是按表处置</text>
</svg>
