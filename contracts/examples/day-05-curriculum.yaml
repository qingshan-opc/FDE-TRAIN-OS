  capsules:
  - id: c1
    title: 回放五天：产品不是一句话生成的
    minutes: 30
    form: 系统讲解+复盘
    content_ref: class/bootcamp/day-05/section-01-worldview-plain/lesson.md
    content: '同学们好。前四天你留下了很多文件，它们不是零散作业，而是一条前后相接的制作过程。


      第一步从真实业务问题开始；项目经理把五天边界锁住；产品经理把问题问成需求文档；页面设计师把文字变成能点击的草图；页面工程师做出四个页面；数据工程师让记录真正保存；检查工程师找到问题；对应岗位修好；运行维护工程师准备交付。


      每一步都使用上一岗位已经批准的成果。如果需求文档没说清楚，页面就会猜；页面和数据没约定好，连接时就会对不上；没有亲手检查，问题会被带到交付现场。


      AI 加快了每一步的产出，但方向、范围、通过标准和最终批准一直在学员手里。


      请用自己项目里的真实文件，重新画一遍五天流程，并指出至少一次你让 AI 返工的地方。


      记住这句话：**产品不是一句话生成的，而是一棒接一棒交出来的；AI 负责加速，你负责方向和质量。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent'
      note: 本节交付：研发全流程图
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 为什么产品不能只靠一句话让 AI 一次生成？
      - - 因为 AI 不能创建文件
        - 因为需求、页面、数据和检查需要逐步确认，才能控制方向和质量
        - 因为页面必须最后一天制作
      - 1
      - 五天流程的价值就是让每一步都有输入、交付和学员批准。
    media:
    - kind: video
      title: 口播课件 · 第 1 节
      object_key: documents/shared/course-media/day05-c1-worldview-plain.mp4
      poster_key: documents/shared/course-media/day05-c1-worldview-plain-poster.jpg
      duration_sec: 70
    knowledge_cards:
    - id: d5l1-k1
      term: 产品是一棒接一棒交出来的
      plain: 问题、计划、需求、页面、数据、检查和交付前后相接，不能跳过中间步骤。
    - id: d5l1-k2
      term: 下一岗位使用已批准成果
      plain: 每一步都从上一岗位确认过的文件开始，避免团队各自按自己的理解猜。
    - id: d5l1-k3
      term: 学员负责方向和质量
      plain: AI 加快产出，学员负责下达任务、查看证据、纠偏和批准。
    memory_sentence: 产品不是一句话生成的，而是一棒接一棒交出来的；AI 负责加速，你负责方向和质量。
    local_prep:
      codex_prompt: '@项目经理 Agent 请带我回放这五天产品是怎样一步步做出来的。一次只回顾一个阶段，先问我“谁接了谁的工作、我怎样检查”，再补充我漏掉的地方。最后按真实发生顺序整理成全过程图，没发生的不能写成完成。'
      checklist:
      - 流程包含完整岗位交接
      - 每步能指向真实文件
      - 区分原型、Mock、真实接口和已发布状态
      - 能解释至少一次学员纠偏如何影响后续
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c2
    title: 拆开产品：页面和数据怎样配合
    minutes: 30
    form: 系统讲解+演示
    content_ref: class/bootcamp/day-05/section-02-enterprise-digital-stages/lesson.md
    content: '管理看板是负责人看到的结果，但它不是整个系统。看板下面还有提交页、列表页、详情页、数据检查规则、真实记录和汇总计算。


      用户填写一条记录，页面先做基本提醒；数据服务再次检查并保存；列表和详情读取同一条记录；看板把多条记录汇总成管理数字。只要其中一段断了，看板再漂亮也不可信。


      页面是用户看见的外表，数据仓库保存可以追查的事实，看板只是把这些事实换一种方式展示。一个数字能不能相信，要看它能否一路追到具体记录。


      第二周接入 AI 后，它会读取这些真实记录，给出分类、原因或建议。但建议仍需人工确认，AI 不能改写原始事实。


      这一节请亲手提交一条记录，再到列表、详情和看板逐步核对变化，并用自己的话讲清每一步是谁完成的。


      记住这句话：**数据只有一份事实，页面只是不同的看法；看板数字能追到记录，才值得相信。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：一条可讲清的数据链路
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 管理看板显示“本月 20 条记录”，最可靠的证明是什么？
      - - 看板上的数字字体很醒目
        - 能从列表和数据仓库找到对应的 20 条真实记录
        - AI 说这个数字正确
      - 1
      - 看板是汇总结果，最终事实必须能追到真实业务记录。
    media:
    - kind: video
      title: 口播课件 · 第 2 节
      object_key: documents/shared/course-media/day05-c2-enterprise-digital-stages.mp4
      poster_key: documents/shared/course-media/day05-c2-enterprise-digital-stages-poster.jpg
      duration_sec: 69
    knowledge_cards:
    - id: d5l2-k1
      term: 页面负责接收和展示
      plain: 用户在页面填写、查看和操作，但页面不是保存事实的最终位置。
    - id: d5l2-k2
      term: 数据仓库保存事实
      plain: 列表、详情和看板都应该来自同一批可追查的真实记录。
    - id: d5l2-k3
      term: 看板数字必须能追查
      plain: 每个管理数字都要能一路找到具体记录，否则再漂亮也不可信。
    memory_sentence: 数据只有一份事实，页面只是不同的看法；看板数字能追到记录，才值得相信。
    local_prep:
      codex_prompt: '@项目经理 Agent 请做我的讲解教练，一次只问我一个问题，直到我能用大白话讲清：用户提交后数据去哪了、为什么驾驶舱数字会变、第二周的 AI 从哪里接入。我说不清时先举例再让我重说，最后整理我的理解缺口。'
      checklist:
      - 能区分前端、后端和数据库
      - 能从一次提交讲到看板更新
      - 能说明接口契约的作用
      - 能说明 Week2 AI 读取什么、为什么要人工确认
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 让另一个人按说明把项目跑起来
    minutes: 30
    form: 实操+交付
    content_ref: class/bootcamp/day-05/section-03-how-software-built/lesson.md
    content: '“在我电脑上能运行”不等于已经交付。真正的交付，是换一个人、换一个文件夹，也能按说明把项目打开。


      请让运行维护工程师整理启动条件、操作顺序、数据保存位置、访问地址和关闭方法。课程这一周只要求本地运行，不购买服务器，不发布到公网，也不能把本地地址写成已经上线。


      然后扮演一个第一次接手项目的人：把项目放进新文件夹，只看说明操作。卡在哪一步，说明就缺哪一步；补上以后从头再试，直到一遍成功。


      为了让演示有内容，还要准备十到十五条覆盖不同状态的演示记录。演示数据不是随便凑数字，而是帮助观众看懂业务故事的布景。


      记住这句话：**“在我电脑上是好的”不值钱；别人按说明也能运行，才算真正交付。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@运维工程师 Agent'
      note: 本节交付：本地交付检查与运行证据
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 项目只能在自己的电脑上打开，是否已经算完成交付？
      - - 算，因为开发者本人能看到
        - 不算，还要让另一个人按说明成功运行
        - 算，只要有页面截图
      - 1
      - 可重复运行是交付标准，不能把个人电脑上的偶然成功当成完成。
    media:
    - kind: video
      title: 口播课件 · 第 3 节
      object_key: documents/shared/course-media/day05-c3-how-software-built.mp4
      poster_key: documents/shared/course-media/day05-c3-how-software-built-poster.jpg
      duration_sec: 57
    knowledge_cards:
    - id: d5l3-k1
      term: 别人能运行才算交付
      plain: 换一个人、换一个文件夹，只看说明也能把项目打开。
    - id: d5l3-k2
      term: 说明要覆盖完整步骤
      plain: 写清需要什么、怎样启动、从哪里访问、数据放哪以及怎样关闭。
    - id: d5l3-k3
      term: 本地运行不是正式上线
      plain: 第一周只验收电脑本地运行，不能把本地地址说成已经发布到公网。
    memory_sentence: “在我电脑上是好的”不值钱；别人按说明也能运行，才算真正交付。
    local_prep:
      codex_prompt: '@运维工程师 Agent 请带我像一个第一次接触项目的人那样，从零在本地运行它。一次只给我一个动作，先解释这一步做什么、成功后会看到什么。把真实结果和常见错误整理成本地交付检查；不要做公网发布，也不要写“已上线”。'
      checklist:
      - 运行步骤从空环境假设写起
      - 前后端启动和端口明确
      - SQLite 位置和数据保留方式明确
      - 学员按说明重新跑通
      - 状态没有夸大为上线
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 写使用说明、做复盘、准备五分钟讲解
    minutes: 35
    form: 实操
    content_ref: class/bootcamp/day-05/section-04-server-cloudnative/lesson.md
    content: '交付前准备三份内容。第一份是项目使用说明：这是做什么的，怎样启动，主要文件放在哪里，目前还有哪些限制。写给三个月后的自己看，只读这份说明也应该能把项目跑起来。


      第二份是项目复盘：原来想完成什么，实际完成了什么，哪里返工过，哪些做法下次可以复用。复盘不是表扬自己，而是让下一次少走弯路。


      第三份是五分钟讲解。听众不是工程师，而是老板或业务负责人。他最关心三个问题：解决了什么具体麻烦，带来了什么变化，凭什么相信它。


      讲解顺序可以这样安排：先讲一个具体痛点，再演示提交、保存、列表、详情和看板变化，最后展示需求文档、检查记录和已知问题作为证据。第二周才会增加的 AI 能力，要明确说是下一步，不能说成现在已经完成。


      记住这句话：**痛点要具体，价值要看得见，质量要拿证据说话；别人讲口号时，你展示事实。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: 通用对话
      note: 本节交付：正式 README + 项目复盘 + 路演提纲
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 向企业负责人讲解项目时，他最关心的是什么？
      - - 使用了多少个专业技术名称
        - 解决了什么麻烦、带来什么变化、有什么证据
        - 代码文件有多少行
      - 1
      - 业务负责人关心问题、价值和可信度，而不是技术名词清单。
    media:
    - kind: video
      title: 口播课件 · 第 4 节
      object_key: documents/shared/course-media/day05-c4-server-cloudnative.mp4
      poster_key: documents/shared/course-media/day05-c4-server-cloudnative-poster.jpg
      duration_sec: 70
    knowledge_cards:
    - id: d5l4-k1
      term: 使用说明帮助别人接手
      plain: 说清项目用途、运行步骤、主要内容和已知限制。
    - id: d5l4-k2
      term: 复盘帮助下次少走弯路
      plain: 记录目标、实际结果、返工原因和可以复用的经验。
    - id: d5l4-k3
      term: 讲价值不报功能菜单
      plain: 从具体痛点、实际变化和可信证据出发，不向老板堆技术名称。
    memory_sentence: 痛点要具体，价值要看得见，质量要拿证据说话；别人讲口号时，你展示事实。
    local_prep:
      codex_prompt: '@项目经理 Agent 请先读项目和检查结果，再带我完成使用说明、项目复盘和五分钟讲解提纲。三件事一次做一件，每件先问我一个问题再整理。讲解要从业务价值开始，用一条真实记录证明系统能用，并诚实说明 AI
        要到第二周才接入。'
      checklist:
      - README 四部分齐全且按步骤可运行
      - 限制与未完成项真实
      - 复盘包含具体数字或事件
      - 路演能在五分钟内讲清价值、证据和边界
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 完成第一周验收，准备下周接入 AI
    minutes: 25
    form: 验收+收束
    content_ref: class/bootcamp/day-05/section-07-accept-map/lesson.md
    content: '最后一节不比代码多少，而是看三件事：项目能不能真实运行，证据是不是完整，你能不能讲清它是怎样一步步做出来的。


      请完整演示一条记录：从提交页进入系统，保存后出现在列表和详情里，并让管理看板数字发生变化。再展示五天里各岗位的交接证据、至少一次你拒绝 AI 建议的记录，以及一个问题从发现到修好的全过程。


      能力不是靠“我会”证明的，而是靠文件、操作记录和实际结果证明的。AI 时代，生成内容越来越容易，分清好坏、说清要求、验明结果才更稀缺。


      第二周会在今天预留的位置接入专业知识和 AI 分析流程。第一周做好的业务系统不推倒重来，只给它增加新的智能能力。


      第一周完成不是学习结束。把项目给真实的人使用，才会遇到真实问题；解决真实问题，能力才会继续增长。


      记住这句话：**五天前你指挥 AI，五天后你交付信任；第一周结束，真正的项目才刚开始。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day5-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent + 学员演示'
      note: 本节交付：Week1 验收包与 Week2 交接
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 第一周最终验收最看重什么？
      - - 代码行数最多
        - 项目真实运行、证据完整，并且学员能讲清制作过程
        - 页面使用最多动画
      - 1
      - 课程目标是掌握指挥、判断和交付逻辑，而不是追求技术数量。
    media:
    - kind: video
      title: 口播课件 · 第 5 节
      object_key: documents/shared/course-media/day05-c5-accept-map.mp4
      poster_key: documents/shared/course-media/day05-c5-accept-map-poster.jpg
      duration_sec: 70
    knowledge_cards:
    - id: d5l5-k1
      term: 运行、证据和讲清楚
      plain: 最终验收看项目能否运行、材料是否完整、学员能否说明制作过程。
    - id: d5l5-k2
      term: 能力由证据指出来
      plain: 文件、操作记录和真实结果，比“我已经掌握”更有说服力。
    - id: d5l5-k3
      term: 第二周只增加 AI 能力
      plain: 第一周业务系统不推倒重来，只在预留位置接入专业知识和分析流程。
    memory_sentence: 五天前你指挥 AI，五天后你交付信任；第一周结束，真正的项目才刚开始。
    local_prep:
      codex_prompt: '@项目经理 Agent 请主持第一周最终验收。一次只让我完成一项：运行项目、演示完整业务流程、讲清七岗位交接、展示一次纠偏和一次问题修复、说明第二周 AI 从哪里接入。按我的真实表现记录结果和遗留问题，不要替我判定通过。'
      checklist:
      - 项目能按 README 本地运行
      - 业务链路可重复演示
      - 五天主要证据文件齐全
      - 学员能讲清各层和各岗位
      - AI 边界与第二周接入点明确
      - 未通过项有补救计划
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 软件为什么不是一次提示词生成出来的？
    options:
    - 模型速度不够
    - 需求、设计、实现和验证需要逐步交接与确认
    - 文件太多
    answer: 1
    explain: 逐步批准能控制范围和质量。
  - q: 学员在 AI 团队中的核心职责是什么？
    options:
    - 手写全部代码
    - 方向、判断、验收和最终责任
    - 只负责观看
    answer: 1
    explain: AI 负责加速，学员负责决定与验证。
  - q: 驾驶舱看板属于系统的哪一部分？
    options:
    - 前端展示
    - 数据库
    - 测试报告
    answer: 0
    explain: 看板是用户看到的前端，但数据来自后端统计。
  - q: 支撑看板数字的最终事实在哪里？
    options:
    - 按钮里
    - 数据库业务记录中
    - 口播稿里
    answer: 1
    explain: 数据库保存真实业务记录，统计接口据此计算。
  - q: 本地能打开能否称为已上线？
    options:
    - 能
    - 不能，最多说明可本地演示
    - 有截图就能
    answer: 1
    explain: 发布状态必须与实际部署事实一致。
  - q: 第一周为什么不教 Docker？
    options:
    - Docker 没价值
    - 它会增加与课程目标无关的环境复杂度
    - AI 不会用
    answer: 1
    explain: 第一周聚焦研发逻辑和本地可交付。
  - q: README 最重要的读者是谁？
    options:
    - 刚写完代码的自己
    - 第一次接手项目的人
    - 只有 AI
    answer: 1
    explain: README 要让陌生接手者能够理解和运行。
  - q: 路演为什么从驾驶舱开始？
    options:
    - 图表好看
    - 先展示管理价值，再用一条记录证明数据链路
    - 可以跳过后端
    answer: 1
    explain: 价值和证据要连在一起。
  - q: 第一周最重要的学习成果是什么？
    options:
    - 记住某个框架
    - 能指挥 AI 团队并讲清产品如何逐步形成
    - 生成最多文件
    answer: 1
    explain: 工具会变，开发与验收逻辑可以迁移。
  - q: 第二周应该从哪里继续？
    options:
    - 推翻第一周重做
    - 在预留接口接入 Skill、Agent 和真实 AI
    - 把演示数据改名为 AI
    answer: 1
    explain: 第一周业务系统是第二周智能化的地基。
