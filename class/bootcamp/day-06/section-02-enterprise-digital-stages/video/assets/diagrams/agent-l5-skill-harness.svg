<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="L5 Agent 化：Skill 加 Harness">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">L5 · Agent 化 = Skill + Harness</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">AGENT LAYER</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="110" y="110" width="240" height="96" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="230.0" y="156.0" font-size="15" font-weight="700" fill="#231f20" text-anchor="middle">Skill</text>
<text x="230.0" y="178.0" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">封装重复流程</text>
</g>
<path d="M356 158.0 L404 158.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="410" y="110" width="240" height="96" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="530.0" y="156.0" font-size="15" font-weight="700" fill="#231f20" text-anchor="middle">Harness</text>
<text x="530.0" y="178.0" font-size="10.5" fill="rgba(35,31,32,.55)" text-anchor="middle">循环执行 · 决策环</text>
</g>
<path d="M656 158.0 L704 158.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="702" y="102" width="256" height="112" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="710" y="110" width="240" height="96" rx="16" fill="url(#tlg)" filter="url(#glow)"/>
<text x="830.0" y="156.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">FDE</text>
<text x="830.0" y="178.0" font-size="10.5" fill="rgba(255,255,255,.85)" text-anchor="middle">定方向 + 做验收</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="256" width="600" height="44" rx="22.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="282.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">人往上走一层：从「自己闷头干」到「派活 + 验收」</text></g>
</svg>
