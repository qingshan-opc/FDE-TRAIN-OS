capsule_extra:
  c1:
    resource_ids:
    - dg-exception
    knowledge_cards:
    - id: boundary-decl
      term: 边界声明
      plain: Skill 明确「什么输入不接、接不了时怎么表现」——Guardrails 的朴素版。
      tag: 核心
    - id: exc-four
      term: 异常四分类
      plain: 输入错 / 环境错 / 能力限 / 目标歧——各自处置方式不同。
      tag: 框架
    - id: fail-by-design
      term: 按声明的方式失败
      plain: 失败不可怕，失控地失败才可怕——每种失败方式都应提前设计好。
      tag: 原则
    - id: stop-speak-wait
      term: 停下来、说清楚、等人来
      plain: 异常处理的共同原则——对照 Day 5「数据不足就说不足」。
      tag: 行动
    glossary_terms:
    - id: gt-guardrails
      term: Guardrails（护栏）
      plain: 拦在输入输出上的规则——Skill 边界声明就是护栏的一种。
    - id: gt-input-error
      term: 输入错
      plain: 数据为空、字段缺失、格式不对——拒绝执行并明说缺什么，不编数据补洞。
    quiz:
    - - 异常四分类不包括？
      - - 输入错
        - 环境错
        - 模型错（厂商 bug）
      - 2
      - 四类是输入错/环境错/能力限/目标歧——处置各不相同。
    - - 输入数据为空时，Skill 应该？
      - - 编一些 plausible 的数据继续
        - 拒绝执行，列出所缺字段，请求补充
        - 静默跳过
      - 1
      - 停下来、说清楚、等人来——瞎编比没有更危险。
    - - 「按声明的方式失败」的意思是？
      - - 任何失败都算过
        - 每种失败方式都是你提前设计好的，不是失控乱来
        - 失败了就重启
      - 1
      - 会拒绝的 Skill 才可依赖——体面失败学。
    - - 边界声明和 Day 5 降级的共同思想是？
      - - 越快越好
        - 体面失败：AI 挂了/数据不够，系统不能假装成功
        - 永远不用 AI
      - 1
      - 前端三态（D2-3）、LLM/SSE 降级（D6）、Skill 边界（D8）——同一思想的第三次生长。
    tools:
    - name: 异常四分类处置卡
      note: 输入错 / 环境错 / 能力限 / 目标歧
    media:
    - kind: video
      title: 口播课件 · 边界声明
      object_key: documents/shared/course-media/day08-c1-boundaries.mp4
      poster_key: documents/shared/course-media/day08-c1-boundaries-poster.jpg
      duration_sec: 124
  c2:
    resource_ids:
    - dg-exception
    knowledge_cards:
    - id: skill-v1
      term: Skill v1
      plain: 在 v0 基础上补「边界与异常」段 + 通过异常注入测试。
      tag: 交付
    - id: inject-test
      term: 异常注入测试
      plain: 故意喂 ≥3 种坏输入（空数据/错格式/越界请求），验证按声明失败。
      tag: 实战
    - id: no-hard-run
      term: 不许硬撑
      plain: 任何「硬扛乱做」都要回炉改边界——胡编周报比没有危害大十倍。
      tag: 红线
    glossary_terms:
    - id: gt-injection
      term: 异常注入
      plain: 测试手段：故意给坏输入，看系统是否按设计的方式失败。
    quiz:
    - - 异常注入测试至少几种坏输入？
      - - 1 种
        - ≥3 种（如空数据/错格式/越界请求）
        - 10 种
      - 1
      - 每类异常至少一条用例——按声明失败才算过。
    - - 注入测试发现 Skill「硬撑成功」，正确动作是？
      - - 算过，能出结果就行
        - 回炉改边界声明，直到按声明的方式失败
        - 换更强的模型
      - 1
      - 硬撑 = 失控失败——比拒绝执行危险得多。
    - - agent-run-log.md 应记录什么？
      - - 只有成功记录
        - 每种注入用例的输入、预期行为、实际行为
        - 聊天记录全文
      - 1
      - 注入 + Agent 选型实验都要留痕——Day 10 证据素材。
    - - Skill v1 相对「能跑」版，工程化多交什么？
      - - 更漂亮的 Prompt
        - 边界声明（不接什么 + 失败怎么表现）+ 注入用例过闸
        - 换更大的模型
      - 1
      - GATE 8：可依赖 = 声明在先、坏输入按声明失败。
    - - 注入用例「空数据 / 错格式 / 越界请求」分别主要测哪类异常？
      - - 全是模型错
        - 输入错 / 输入错 / 权限或范围错（按你边界声明归类）
        - 全是环境错
      - 1
      - 四分类要对上用例——测的是设计，不是碰运气。
    tools:
    - name: 注入用例模板
      note: 坏输入 | 预期行为 | 实际行为 | 过/不过
    media:
    - kind: video
      title: 口播课件 · Skill v1
      object_key: documents/shared/course-media/day08-c2-exception-test.mp4
      poster_key: documents/shared/course-media/day08-c2-exception-test-poster.jpg
      duration_sec: 112
  c3:
    resource_ids:
    - dg-harness
    - dg-agent-loop
    - dg-workflow-agent
    knowledge_cards:
    - id: harness-four
      term: Harness 四要素
      plain: 模型 + 工具表 + 记忆 + 循环——骨架不同，能力差很多。
      tag: 核心
    - id: agent-role
      term: Agent
      plain: 跑在 Harness 上的角色（说明书/人格/目标）；你的 ai-tutor.yaml 就是一份 Agent 定义。
      tag: 概念
    - id: decision-loop
      term: 决策环
      plain: 理解 → 规划 → 调工具 → 观察 → 继续，直到完成或求助。
      tag: 机制
    - id: workflow-vs-agent
      term: workflow vs agent
      plain: 步骤定死用 workflow；写不死才上 agent——自由度换不确定性。
      tag: 选型
    glossary_terms:
    - id: gt-harness
      term: Harness
      plain: 模型之外的循环：工具表、记忆、规划、重试、日志。
    - id: gt-tool-call
      term: Tool Calling
      plain: 模型输出「调用 X 工具、参数 Y」的结构化请求，由 Harness 执行。
    quiz:
    - - Harness 四要素是？
      - - 前端/后端/数据库/模型
        - 模型 + 工具表 + 记忆 + 循环
        - CPU/内存/磁盘/网络
      - 1
      - 同一模型换副骨架，能力天差地别——聊天窗 vs Cursor 的差别。
    - - 决策环的正确顺序？
      - - 调工具 → 理解 → 规划 → 观察
        - 理解 → 规划 → 调工具 → 观察 → 继续
        - 生成 → 验收 → 迭代
      - 1
      - 观察结果决定是否继续——ReAct 循环的朴素版。
    - - workflow 和 agent 的选择原则是？
      - - 永远用 agent 显得高级
        - 能写死步骤用 workflow，写不死才上 agent
        - 随机选择
      - 1
      - Agent 的自由度是用不确定性和成本换来的。
    - - 你的 Skill 在 Harness 里对应哪个要素？
      - - 模型
        - 工具表上的一件工具
        - 记忆
      - 1
      - Day 7 的 Skill 从今天起成为 Agent 工具表上的工具。
    tools:
    - name: Harness 四要素对照表
      note: 各要素 ↔ 你 Week 1 已做过的东西
    media:
    - kind: video
      title: 口播课件 · Harness 四要素
      object_key: documents/shared/course-media/day08-c3-harness.mp4
      poster_key: documents/shared/course-media/day08-c3-harness-poster.jpg
      duration_sec: 126
  c4:
    resource_ids:
    - dg-agent-loop
    - dg-harness
    knowledge_cards:
    - id: agent-calls-skill
      term: Agent 调用 Skill
      plain: 自然语言下任务 → Agent 选对工具 → 执行 → 产出过验收。
      tag: 实战
    - id: wrong-pick
      term: 什么时候会选错
      plain: 工具描述重叠、模糊、缺「何时不用」时——选错图谱的第一因。
      tag: 关键
    glossary_terms:
    - id: gt-copilot-agent
      term: Copilot vs Agent
      plain: Copilot 递扳手；Agent 定目的地它开——信任与验收方式完全不同。
    quiz:
    - - Agent 选错 Skill 最常见原因是？
      - - 模型版本太旧
        - 工具描述重叠、模糊、缺「何时不用」
        - 网络延迟
      - 1
      - 第 1 步「理解任务」跑偏——描述写得越清，选型越准。
    - - Agent 闭环演示的验收标准是？
      - - Agent 有回复就行
        - 自然语言任务 → 正确调用 Skill → 产出过验收标准
        - 必须全自动无人工
      - 1
      - 闭环 = 理解、选型、执行、验收四步全绿。
    - - 故意给「不匹配任务」的目的是？
      - - 为难 Agent
        - 观察它会不会选错，分析原因写进日志
        - 测试模型速度
      - 1
      - 「什么时候会选错」是 GATE 8 口答必考点——Day 10 答辩也会问。
    - - 工具描述里写清「何时不用」主要防止什么？
      - - 模型算力不够
        - Agent 在模糊任务上误选你的 Skill
        - 日志文件过大
      - 1
      - 负例边界写进描述 = 选型护栏，比加长正面介绍更管用。
    - - Copilot 与 Agent 在「谁拿方向盘」上的区别？
      - - 没区别，都是聊天
        - Copilot 递扳手你开；Agent 你定目的地它开——验收方式不同
        - Agent 更便宜所以优先
      - 1
      - 信任对象变了：从「建议」变成「代执行」，必须可回放。
    tools:
    - name: 选错图谱
      note: 描述重叠 / 缺边界 / 任务歧义
    media:
    - kind: video
      title: 口播课件 · Agent 调用 Skill
      object_key: documents/shared/course-media/day08-c4-agent-loop.mp4
      poster_key: documents/shared/course-media/day08-c4-agent-loop-poster.jpg
      duration_sec: 118
