<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="Agent Lab 五步闭环">
<defs>
<marker id="fs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#231f20"/>
</marker>
</defs>
<rect width="1040" height="400" fill="#f2f5f0"/>
<!-- 五步 -->
<g>
<rect x="50" y="90" width="160" height="120" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<circle cx="74" cy="114" r="13" fill="#1400ff"/><text x="74" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="font-family:'SF Mono',Menlo,monospace">1</text>
<text x="130" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">线框</text>
<text x="130" y="170" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">WIREFRAME</text>
<text x="130" y="194" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">先画瞄准镜</text>
</g>
<g>
<rect x="246" y="90" width="160" height="120" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<circle cx="270" cy="114" r="13" fill="#1400ff"/><text x="270" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="font-family:'SF Mono',Menlo,monospace">2</text>
<text x="326" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">Prompt</text>
<text x="326" y="170" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">PROMPT</text>
<text x="326" y="194" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">四要素任务书</text>
</g>
<g>
<rect x="442" y="90" width="160" height="120" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<circle cx="466" cy="114" r="13" fill="#1400ff"/><text x="466" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="font-family:'SF Mono',Menlo,monospace">3</text>
<text x="522" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">生成</text>
<text x="522" y="170" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">GENERATE</text>
<text x="522" y="194" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">AI 产出工件</text>
</g>
<g>
<rect x="638" y="90" width="160" height="120" fill="#ffffff" stroke="#1400ff" stroke-width="2.5"/>
<circle cx="662" cy="114" r="13" fill="#1400ff"/><text x="662" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="font-family:'SF Mono',Menlo,monospace">4</text>
<text x="718" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1400ff">验收</text>
<text x="718" y="170" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">ACCEPT</text>
<text x="718" y="194" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">Rubric 逐项过</text>
</g>
<g>
<rect x="834" y="90" width="160" height="120" fill="#ffffff" stroke="#231f20" stroke-width="2"/>
<circle cx="858" cy="114" r="13" fill="#1400ff"/><text x="858" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="font-family:'SF Mono',Menlo,monospace">5</text>
<text x="914" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">迭代</text>
<text x="914" y="170" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">ITERATE</text>
<text x="914" y="194" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">Prompt 即源码</text>
</g>
<!-- 顺序箭头 -->
<g stroke="#231f20" stroke-width="1.8" fill="none">
<line x1="212" y1="150" x2="240" y2="150" marker-end="url(#fs-arrow)"/>
<line x1="408" y1="150" x2="436" y2="150" marker-end="url(#fs-arrow)"/>
<line x1="604" y1="150" x2="632" y2="150" marker-end="url(#fs-arrow)"/>
<line x1="800" y1="150" x2="828" y2="150" marker-end="url(#fs-arrow)"/>
</g>
<!-- 迭代回路 -->
<path d="M914 212 L914 268 L326 268 L326 216" fill="none" stroke="#1400ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fs-arrow)"/>
<text x="620" y="292" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1400ff" style="font-family:'SF Mono',Menlo,monospace">验收不过 → 改 Prompt → 再来一轮</text>
<!-- 底注 -->
<text x="520" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20">「验收不过」不是失败，是流程的正常一站</text>
<text x="520" y="366" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">真正的失败是「我觉得还行」就点了交付</text>
</svg>
