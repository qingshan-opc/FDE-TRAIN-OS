title: 第十天 · 第 4 节 · 答辩与互评
segments:
- id: 01-open
  ppt:
  - 眉题：01 OPEN
  - 讲解图：v2-panorama.svg
  - 上台八分钟，响铃就停
  text: '同学们好，我是你们的老师404。上台了。每人八分钟，作品三加架构三加故事二，响铃就停。规则简单：讲得清、拦得住、查得了、迭代真——四个维度，就是你的毕业成绩单。第一个上的别紧张，评委还没建立比较基准呢，对吧。

    '
- id: 02-four-dimensions
  ppt:
  - 眉题：02 FOUR DIMENSIONS
  - 讲解图：ten-day-grid.svg
  - 互评四维度 + 一个细节
  text: '听的人别走神，互评表每个分都要配一个细节——写不出细节，说明你也没听懂，分也不算数。讲得清是听懂做了什么、为什么；拦得住是确认闸真实演示；查得了是日志证据随手能打开；迭代真是 bug 故事经得起追问，对吧。

    '
- id: 03-accident-calm
  ppt:
  - 眉题：03 ACCIDENT CALM
  - 讲解图：v2-panorama.svg
  - 演示挂了不扣分，慌了才扣分
  text: '演示挂了不扣分，慌了才扣分——指着昨日成功日志讲，那就是你的第九条证据。被问倒了？这个我现在不会，我的打算是……三件套回答永远安全。互评按细节说话，分低但写得准是帮人，闭眼打高分是害人，咱们都懂。

    '
- id: 04-fde-graduate
  ppt:
  - 眉题：04 FDE GRADUATE
  - 讲解图：ten-day-grid.svg
  - 过完这关，你就是 FDE
  text: '同学们，本节先到这里。GATE 10：答辩完成、互评收回至少两份、导师抽查十条证据三条、闸口演示真实。过了这关，授予 FDE 称号——课程介绍页上写的那个人，今天是你。带走一句：上台不是表演完美，是展示你会交付。

    '
