        【第 4 段｜自检与交接】

        请运行现有前端检查。生成 day5-replay/frontend-acceptance.md 和 frontend-handoff.md。写明修改文件、页面入口、请求合同、四状态结果、证据路径和需要后端完成的事项。

        '
      checklist:
