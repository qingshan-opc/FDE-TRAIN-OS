    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '前后端已完成交接。现在切换到 @测试。每段完成后必须停止。


        【第 1 段｜读取变更与风险】

        请读取 iteration-prd.md、ui-handoff.md、frontend-handoff.md、iteration-api-spec.md 和 backend-handoff.md。只列新增能力、受影响原功能和前三项风险。


        【第 2 段｜生成测试计划】

        请生成 day5-replay/iteration-test-plan.md。覆盖启动、健康、页面四状态、成功与错误请求、业务规则、数据持久化和受影响回归。每条写步骤、预期和证据位置。保存后停止，等我回复“确认测试”。


        【第 3 段｜逐条执行】

        已确认。一次只给我一条测试操作。等我反馈实际结果和证据后再继续。不得想象执行结果，不得在测试岗位修改代码。


        【第 4 段｜缺陷闭环】

