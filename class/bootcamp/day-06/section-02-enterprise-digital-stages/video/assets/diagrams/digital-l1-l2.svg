<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="信息化与数字化：纸变屏，KPI 进库">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">L1 信息化 → L2 数字化：纸变屏 · KPI 进库</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">PAPER TO PIXELS</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="96" width="400" height="130" rx="18" fill="#fff" filter="url(#sh)"/>
<rect x="80" y="76" width="110" height="26" rx="13.0" fill="rgba(35,31,32,.05)"/><text x="135.0" y="93.32" font-size="12" fill="#231f20" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">L1 · 信息化</text>
<text x="80" y="130" font-size="12" fill="rgba(35,31,32,.55)">纸质表 / 手工账</text>
<rect x="80" y="142" width="150" height="56" rx="12" fill="rgba(35,31,32,.05)"/>
<text x="155" y="175" font-size="13" font-weight="700" fill="rgba(35,31,32,.6)" text-anchor="middle">纸 · 算盘</text>
<path d="M238 170 L282 170" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<rect x="290" y="142" width="150" height="56" rx="12" fill="#fff" filter="url(#sh)"/>
<text x="365" y="165" font-size="13" font-weight="700" fill="#231f20" text-anchor="middle">Excel / OA</text>
<text x="365" y="185" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">人是录入员</text>
</g>
<path d="M470 160 L550 160" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="560" y="96" width="420" height="130" rx="18" fill="#fff" stroke="rgba(13,148,136,.45)" stroke-width="1.5" filter="url(#tglow)"/>
<rect x="580" y="76" width="110" height="26" rx="13.0" fill="url(#tlg)"/><text x="635.0" y="93.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">L2 · 数字化</text>
<rect x="580" y="142" width="170" height="56" rx="12" fill="rgba(13,148,136,.10)"/>
<text x="665" y="165" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">数据库 · KPI 进库</text>
<text x="665" y="185" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">Day 4 表结构在这层</text>
<path d="M758 170 L802 170" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<rect x="810" y="142" width="150" height="56" rx="12" fill="#fff" filter="url(#sh)"/>
<text x="885" y="165" font-size="13" font-weight="700" fill="#231f20" text-anchor="middle">驾驶舱看数</text>
<text x="885" y="185" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">不再翻纸堆</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="256" width="600" height="44" rx="22.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="282.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">信息化：纸变屏，人当录入员 · 数字化：数据有家，KPI 看得见</text></g>
</svg>
