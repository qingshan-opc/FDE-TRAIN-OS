- - 交付前3天，办公室提出中英双语。第一步应当是什么？
  - - 判断对方故意增加工作
    - 立即答应
    - 记录具体要求并评估对时间、质量和资源的影响
    - 直接拒绝
  - 2
  - 先把变化和影响说清，再进入选项和确认。
- - 部门经理要求增加客户分级，但项目发起人尚未确认。你应如何处理？
  - - 直接加入
    - 告诉部门经理无权发言
    - 评估价值和影响，形成选项，请有权负责人确认
    - 私下先做
  - 2
  - 尊重需求价值，同时守住变更授权。
