title: "第五天 · 第 6 节 · 后端技术图：数据库分类、权限与语言框架地图"
segments:
  - id: "01-duty"
    ppt:
      - "BACKEND · 后端在干什么"
    text: |
      同学们，这节课呢，咱们讲后端——就是用户看不见的那个后厨。前端是摸得到的界面嘛；后端呢，数据要有住所，业务要用语言写出来。第四天 讲过，后端就三件事：业务逻辑、数据、接口。浏览器里看不见它，但每道菜都从那儿出来，对吧。
  - id: "02-home"
    ppt:
      - "给数据一个住所"
      - "数据库首先是存储媒介。Excel 那种结构化数据，不能永远散落在本地文件——得有固定住所。"
    text: |
      那数据库是啥呢？首先它是一种存储媒介。做系统的时候，Excel 那种结构化数据，不能永远散落在本地文件里嘛——得有个固定住所，这个住所就是数据库。不同类型的数据，住不同的房：关系型像 PostgreSQL、MySQL；要极快的临时快取用 Redis；按关键词搜文档用 Elasticsearch；海量报表用 ClickHouse。一句话记住：企业遇到什么形态的数据，就给它配什么住所。
  - id: "03-maindb"
    ppt:
      - "主库怎么点单"
      - "常规业务主库最常听到两个；原型再加一个文件库。"
    text: |
      常规业务主库，最常听到两个。MySQL——用得最广的老牌，接老系统、团队全是 MySQL 老手的时候稳。PostgreSQL——功能全、扩展强，语法跟 MySQL 大体能兼容；二零二六新项目呢，我更常默认它，还有向量插件，做 AI 相似推荐很顺手。还有个 SQLite——一个文件就是一个库，原型、小工具起步神器，人一多再迁 PostgreSQL。
  - id: "04-sql"
    ppt:
      - "DDL / DQL / DML"
      - "名字别被吓到——三类动作：改结构、查数据、改数据。"
    text: |
      程序怎么跟库说话呢？靠 SQL 家族。名字别被吓到啊。DDL 是建表、改表结构——房子怎么隔间；DQL 是查询——把符合条件的数据捞出来；还有 DML，增删改——往房子里放、拿、改东西。别的库不一定叫 SQL，但往往会有自己的 API——本质一样：约定好怎么存、怎么取。
  - id: "05-langs"
    ppt:
      - "语言选边，框架是招牌"
    text: |
      再讲编程语言，四条路。Java——以前框架名词一堆，现在记住 Spring Boot 就行；大企业核心系统仍是它的主场，规矩全、能扛大场面。Python——AI 的母语，大模型工具链都在这；做 AI 用 FastAPI，开发快，还能自动出 OpenAPI。Node.js——前后端一门语言，小团队、全栈很香。Go——偏基础设施，快、省内存；更底层还有 Rust。听地图就行，选型看场景。
  - id: "06-pick"
    ppt:
      - "怎么选：三句话"
    text: |
      作业里写你自己的选型：语言 + 框架 + 主库，各用一句话说明为什么。必须引用 PRD 或 API 契约里的约束——不许抄课件里的「建议选 X」。课上只认地图：Python 有 Django、Flask、FastAPI；Java 有 Spring Boot；Go 有 Gin、Echo；Rust 有 Actix、Axum。数据库按分类认：关系型、文档、缓存、搜索、分析——具体哪一家，你自己交理由。
  - id: "07-contract"
    ppt:
      - "契约是合同"
      - "先写清 API_Spec.md：路径、参数、返回、错误码。用 Java 或 Python 实现都行——前端不在乎。先签合同，施工队可以后挑。"
    text: |
      最后接上 第四天：先把接口契约 API_Spec.md 写清楚——路径、参数、返回、错误码。这份契约用 Java 实现也行，用 Python 实现也行，前端不在乎。契约是合同，语言只是施工队——先签合同，施工队可以后挑，对吧。
  - id: "08-close"
    ppt:
      - "数据按场景选住所；代码按场景选语言——先签合同。"
      - "带走两句：住所看形态，语言看场景；契约先行，施工队后挑。"
    text: |
      好，带走两句话：数据按场景选住所；代码按场景选语言——先把合同签清楚，施工队可以后挑。本节小课就到这儿。
