    knowledge_cards:
    - id: integration
      term: 前后端联调
      plain: 前端按接口合同发送请求，后端按同一合同返回，双方一起验证完整用户操作。
      tag: 闭环
    - id: contract-debug
      term: 按合同定位
      plain: 地址、方法、字段、状态码或响应结构哪一项不一致，就由对应岗位修复。
      tag: 调试
    - id: owner-fix
      term: 各修各的
      plain: 前端请求错误由前端修改，后端响应错误由后端修改，验收者不跨岗位乱改。
      tag: 责任
    glossary_terms:
