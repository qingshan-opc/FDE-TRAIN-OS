<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="hm-title hm-desc" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;background:#fbfcfc">
  <title id="hm-title">速查卡 · 六岗位交接地图</title>
  <desc id="hm-desc">专业领域问题经产品经理、UI、前端、后端、测试、运维六岗位接力，文件即接力棒，最后回到产品经理做业务验收。</desc>
  <defs>
    <linearGradient id="hm-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="hm-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b7c72"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="hm-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfc"/>
      <stop offset="100%" stop-color="#f3f6f5"/>
    </linearGradient>
    <pattern id="hm-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="rgba(15,46,42,.05)"/>
    </pattern>
    <filter id="hm-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2e2a" flood-opacity=".08"/>
    </filter>
    <filter id="hm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d9488" flood-opacity=".28"/>
    </filter>
    <marker id="hm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1440" height="980" fill="url(#hm-paper)"/>
  <rect width="1440" height="980" fill="url(#hm-dots)"/>
  <circle cx="1328" cy="72" r="110" fill="rgba(13,148,136,.07)"/>
  <circle cx="88" cy="920" r="80" fill="rgba(15,46,42,.035)"/>
  <rect x="0" y="0" width="8" height="980" fill="url(#hm-teal)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="40" y="42" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="12" letter-spacing="2.4" fill="#0d9488">DAY-01  ·  SOFTWARE FLOW  ·  速查卡</text>
    <text x="40" y="82" font-size="34" font-weight="800" fill="#0f2e2a">六岗位交接地图</text>
    <text x="40" y="112" font-size="15" fill="#6b7280">文件就是接力棒。每切换一次 @岗位，先看上游交了什么、这一棒只做什么、下一棒要收什么。</text>
    <rect x="1188" y="28" width="212" height="36" rx="18" fill="#0f2e2a"/>
    <text x="1294" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#f3f6f5">闭环 · 最后回到产品经理</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="136" width="1360" height="118" rx="22" fill="#ffffff" stroke="rgba(15,46,42,.08)" filter="url(#hm-sh)"/>
    <path d="M86 195 H1354" stroke="url(#hm-track)" stroke-width="6" stroke-linecap="round"/>
    <path d="M86 195 H1354" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 10" stroke-linecap="round" opacity=".55">
      <animate attributeName="stroke-dashoffset" from="17" to="0" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <rect x="56" y="152" width="92" height="28" rx="8" fill="#0f2e2a"/>
    <text x="102" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">领域问题</text>

    <g transform="translate(210,176)">
      <circle r="22" fill="url(#hm-teal)" filter="url(#hm-glow)"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">01</text>
      <text y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#0f2e2a">产品经理</text>
    </g>
    <g transform="translate(430,176)">
      <circle r="22" fill="#fff" stroke="#0d9488" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">02</text>
      <text y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#0f2e2a">UI</text>
    </g>
    <g transform="translate(650,176)">
      <circle r="22" fill="#fff" stroke="#0d9488" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">03</text>
      <text y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#0f2e2a">前端</text>
    </g>
    <g transform="translate(870,176)">
      <circle r="22" fill="#fff" stroke="#0d9488" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">04</text>
      <text y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#0f2e2a">后端</text>
    </g>
    <g transform="translate(1090,176)">
      <circle r="22" fill="#fff" stroke="#0d9488" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">05</text>
      <text y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#0f2e2a">测试</text>
    </g>
    <g transform="translate(1310,176)">
      <circle r="22" fill="#fff" stroke="#0d9488" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">06</text>
      <text y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#0f2e2a">运维</text>
    </g>

    <g font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="10" fill="#0f766e">
      <rect x="268" y="214" width="84" height="22" rx="6" fill="rgba(13,148,136,.10)"/>
      <text x="310" y="229" text-anchor="middle">PRD.md</text>
      <rect x="478" y="214" width="124" height="22" rx="6" fill="rgba(13,148,136,.10)"/>
      <text x="540" y="229" text-anchor="middle">设计 + 原型</text>
      <rect x="708" y="214" width="124" height="22" rx="6" fill="rgba(13,148,136,.10)"/>
      <text x="770" y="229" text-anchor="middle">页面 + 字段</text>
      <rect x="928" y="214" width="124" height="22" rx="6" fill="rgba(13,148,136,.10)"/>
      <text x="990" y="229" text-anchor="middle">服务 + 说明</text>
      <rect x="1148" y="214" width="84" height="22" rx="6" fill="rgba(13,148,136,.10)"/>
      <text x="1190" y="229" text-anchor="middle">测试报告</text>
    </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
    <g transform="translate(40,278)" filter="url(#hm-sh)">
      <rect width="440" height="214" rx="20" fill="#fff" stroke="rgba(13,148,136,.35)" stroke-width="1.5"/>
      <rect width="8" height="214" rx="4" fill="url(#hm-teal)"/>
      <text x="28" y="36" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#0d9488">STATION 01</text>
      <text x="28" y="64" font-size="22" font-weight="800" fill="#0f2e2a">产品经理</text>
      <text x="412" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#0d9488">@产品经理</text>
      <text x="28" y="98" font-size="13" fill="#6b7280">接收</text>
      <text x="78" y="98" font-size="14" font-weight="600" fill="#1c2321">学员真正熟悉的领域问题</text>
      <text x="28" y="128" font-size="13" fill="#6b7280">交付</text>
      <rect x="78" y="112" width="86" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
      <text x="121" y="129" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" fill="#0f766e">PRD.md</text>
      <text x="28" y="162" font-size="13" fill="#6b7280">下一棒</text>
      <text x="78" y="162" font-size="14" font-weight="600" fill="#1c2321">@UI 读取确认后的需求</text>
      <text x="28" y="192" font-size="12.5" fill="#6b7280">价值上移：定问题、控范围、定验收。确认需求必须由人负责。</text>
    </g>

    <g transform="translate(500,278)" filter="url(#hm-sh)">
      <rect width="440" height="214" rx="20" fill="#fff" stroke="rgba(15,46,42,.08)"/>
      <rect width="8" height="214" rx="4" fill="#99f6e4"/>
      <text x="28" y="36" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#0d9488">STATION 02</text>
      <text x="28" y="64" font-size="22" font-weight="800" fill="#0f2e2a">UI / UX</text>
      <text x="412" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#0d9488">@UI</text>
      <text x="28" y="98" font-size="13" fill="#6b7280">接收</text>
      <text x="78" y="98" font-size="14" font-weight="600" fill="#1c2321">确认后的 PRD.md</text>
      <text x="28" y="128" font-size="13" fill="#6b7280">交付</text>
      <g font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#0f766e">
        <rect x="78" y="112" width="118" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="137" y="128" text-anchor="middle">design-spec.md</text>
        <rect x="204" y="112" width="96" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="252" y="128" text-anchor="middle">ui-flow.md</text>
        <rect x="308" y="112" width="116" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="366" y="128" text-anchor="middle">prototype.html</text>
      </g>
      <text x="28" y="162" font-size="13" fill="#6b7280">下一棒</text>
      <text x="78" y="162" font-size="14" font-weight="600" fill="#1c2321">@前端 按规范实现页面</text>
      <text x="28" y="192" font-size="12.5" fill="#6b7280">核心不是画得更多，而是信息层级、交互原则和可用原型。</text>
    </g>

    <g transform="translate(960,278)" filter="url(#hm-sh)">
      <rect width="440" height="214" rx="20" fill="#fff" stroke="rgba(15,46,42,.08)"/>
      <rect width="8" height="214" rx="4" fill="#5eead4"/>
      <text x="28" y="36" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#0d9488">STATION 03</text>
      <text x="28" y="64" font-size="22" font-weight="800" fill="#0f2e2a">前端</text>
      <text x="412" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#0d9488">@前端</text>
      <text x="28" y="98" font-size="13" fill="#6b7280">接收</text>
      <text x="78" y="98" font-size="14" font-weight="600" fill="#1c2321">PRD、设计规范、交互流程、原型</text>
      <text x="28" y="128" font-size="13" fill="#6b7280">交付</text>
      <g font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#0f766e">
        <rect x="78" y="112" width="72" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="114" y="128" text-anchor="middle">正式页面</text>
        <rect x="158" y="112" width="168" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="242" y="128" text-anchor="middle">frontend-api-needs.md</text>
      </g>
      <text x="28" y="162" font-size="13" fill="#6b7280">下一棒</text>
      <text x="78" y="162" font-size="14" font-weight="600" fill="#1c2321">@后端 按字段与接口需求开工</text>
      <text x="28" y="192" font-size="12.5" fill="#6b7280">检查还原度、状态完整、可维护；不要凭空猜后端返回什么。</text>
    </g>

    <g transform="translate(40,512)" filter="url(#hm-sh)">
      <rect width="440" height="214" rx="20" fill="#fff" stroke="rgba(15,46,42,.08)"/>
      <rect width="8" height="214" rx="4" fill="#2dd4bf"/>
      <text x="28" y="36" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#0d9488">STATION 04</text>
      <text x="28" y="64" font-size="22" font-weight="800" fill="#0f2e2a">后端</text>
      <text x="412" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#0d9488">@后端</text>
      <text x="28" y="98" font-size="13" fill="#6b7280">接收</text>
      <text x="78" y="98" font-size="14" font-weight="600" fill="#1c2321">PRD + 前端数据 / 接口需求</text>
      <text x="28" y="128" font-size="13" fill="#6b7280">交付</text>
      <g font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#0f766e">
        <rect x="78" y="112" width="118" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="137" y="128" text-anchor="middle">architecture.md</text>
        <rect x="202" y="112" width="92" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="248" y="128" text-anchor="middle">API_Spec.md</text>
        <rect x="300" y="112" width="100" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="350" y="128" text-anchor="middle">DB_Schema.md</text>
        <rect x="78" y="142" width="92" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="124" y="158" text-anchor="middle">RUNBOOK.md</text>
      </g>
      <text x="28" y="186" font-size="13" fill="#6b7280">下一棒</text>
      <text x="78" y="186" font-size="14" font-weight="600" fill="#1c2321">@测试 拿到可运行系统与说明</text>
    </g>

    <g transform="translate(500,512)" filter="url(#hm-sh)">
      <rect width="440" height="214" rx="20" fill="#fff" stroke="rgba(15,46,42,.08)"/>
      <rect width="8" height="214" rx="4" fill="#14b8a6"/>
      <text x="28" y="36" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#0d9488">STATION 05</text>
      <text x="28" y="64" font-size="22" font-weight="800" fill="#0f2e2a">测试</text>
      <text x="412" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#0d9488">@测试</text>
      <text x="28" y="98" font-size="13" fill="#6b7280">接收</text>
      <text x="78" y="98" font-size="14" font-weight="600" fill="#1c2321">PRD + 可运行系统 + 运行说明</text>
      <text x="28" y="128" font-size="13" fill="#6b7280">交付</text>
      <g font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#0f766e">
        <rect x="78" y="112" width="108" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="132" y="128" text-anchor="middle">test-plan.md</text>
        <rect x="194" y="112" width="118" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="253" y="128" text-anchor="middle">test-report.md</text>
      </g>
      <text x="28" y="162" font-size="13" fill="#6b7280">下一棒</text>
      <text x="78" y="162" font-size="14" font-weight="600" fill="#1c2321">不通过退回责任岗；通过后 @运维</text>
      <text x="28" y="192" font-size="12.5" fill="#6b7280">写清复现、预期、实际、责任岗。测试不偷偷改代码。</text>
    </g>

    <g transform="translate(960,512)" filter="url(#hm-sh)">
      <rect width="440" height="214" rx="20" fill="#fff" stroke="rgba(15,46,42,.08)"/>
      <rect width="8" height="214" rx="4" fill="#0d9488"/>
      <text x="28" y="36" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#0d9488">STATION 06</text>
      <text x="28" y="64" font-size="22" font-weight="800" fill="#0f2e2a">运维</text>
      <text x="412" y="36" text-anchor="end" font-size="13" font-weight="700" fill="#0d9488">@运维</text>
      <text x="28" y="98" font-size="13" fill="#6b7280">接收</text>
      <text x="78" y="98" font-size="14" font-weight="600" fill="#1c2321">通过测试的系统 + 测试报告</text>
      <text x="28" y="128" font-size="13" fill="#6b7280">交付</text>
      <g font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#0f766e">
        <rect x="78" y="112" width="118" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="137" y="128" text-anchor="middle">DEPLOYMENT.md</text>
        <rect x="204" y="112" width="72" height="24" rx="8" fill="rgba(13,148,136,.10)"/>
        <text x="240" y="128" text-anchor="middle">上线地址</text>
      </g>
      <text x="28" y="162" font-size="13" fill="#6b7280">下一棒</text>
      <text x="78" y="162" font-size="14" font-weight="600" fill="#1c2321">回到 @产品经理 做最终业务验收</text>
      <text x="28" y="192" font-size="12.5" fill="#6b7280">能启动、能停止、能回退。上线不等于项目成功。</text>
    </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="746" width="1360" height="54" rx="16" fill="url(#hm-teal)" filter="url(#hm-glow)"/>
    <text x="720" y="780" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">运维交付上线地址之后 → 回到产品经理，按最初需求做最终业务验收</text>

    <rect x="40" y="816" width="900" height="128" rx="18" fill="#ffffff" stroke="rgba(15,46,42,.08)"/>
    <text x="60" y="846" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.8" fill="#0d9488">指挥前五问 · 每次切换 @岗位 先问</text>
    <g font-size="13.5" font-weight="600" fill="#1c2321">
      <text x="60" y="878">1. 当前是谁？</text>
      <text x="220" y="878">2. 上游文件是什么？</text>
      <text x="430" y="878">3. 这一步只负责什么？</text>
      <text x="60" y="910">4. 完成后交付什么文件？</text>
      <text x="310" y="910">5. 下一步交给谁、由谁验收？</text>
    </g>

    <rect x="956" y="816" width="444" height="128" rx="18" fill="#0f2e2a"/>
    <text x="980" y="852" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.8" fill="#5eead4">口诀</text>
    <text x="980" y="884" font-size="16" font-weight="700" fill="#f8fafc">AI 接管重复制作</text>
    <text x="980" y="912" font-size="16" font-weight="700" fill="#5eead4">人负责定义、取舍、证据和责任</text>
  </g>
</svg>
