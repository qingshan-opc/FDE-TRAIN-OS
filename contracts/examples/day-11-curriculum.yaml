      plain: 程度 + 差距 + 下一步——「我知道哪里弱」是第十一条证据。
      tag: 技巧
    glossary_terms:
    - id: gt-defense-outline
      term: defense-outline.md
      plain: 答辩提纲一页纸：演示路径 / 架构三点 / 迭代五要素 / 诚实声明。
    local_prep:
      codex_prompt: '帮我生成 docs/defense-outline.md：作品演示路径 3′ / 架构三点 3′ / 迭代故事五要素 2′ / 诚实声明（哪块降级/未完成）。

        用我仓库里的真实路径，不要空话。'
      checklist:
