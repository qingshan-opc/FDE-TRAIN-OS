day: 1
project: 从真实问题到需求文档和可点击页面草图
project_brief: 学员以项目负责人身份，在 TRAE 中组建七岗位 AI 软件团队，选择与自己专业或工作相关的业务问题，依次指挥项目经理、产品经理和 UI/UX 设计师，完成项目任务书、PRD 与四页可点击原型。
resources:
- id: trae-cn-download
  title: TRAE 国内版官方下载
  kind: link
  summary: Windows 与 macOS 安装入口；本课程使用 TRAE 中国版
  url: https://www.trae.cn/ide/download
- id: team-prompts-v11
  title: 七岗位 AI 员工提示词包
  kind: download
  summary: 下载后解压，可看到项目经理到运维工程师七份岗位提示词
  url: /course-assets/resources/prompt-toolkit/FDE_TRAE_7岗位提示词_小白互动版.zip
- id: week1-day1-source
  title: 第一周第 1 天课程合约
  kind: doc
  summary: 本日五节课、交付物、岗位交接与验收口径
  url: /course-assets/bootcamp/day-01/README.md
- id: domain-packs
  title: 第一周领域包
  kind: doc
  summary: 财务、员工管理、经营问题三个参考方向，也可选择自己的专业方向
  url: /course-assets/teaching/week1-command-team/Week1_Domain_Packs.md
capsule_extra:
  c1:
    resource_ids:
    - trae-cn-download
    - team-prompts-v11
    tools: []
    quiz:
    - &id001
      - 第一节实操做到哪一步算完成？
      - - 写出需求文档
        - TRAE 能正常打开，七份岗位提示词已下载并解压
        - 做出完整项目
      - 1
      - 第一节只负责准备工具，下一节才开始创建 AI 员工。
    - &id002
      - 驾驶舱只有漂亮图表为什么不算完整系统？
      - - 没有手机端
        - 图表背后还缺业务数据的产生、存储和统计链路
        - 没有动画
      - 1
      - 驾驶舱是前端结果，必须能追到真实业务数据。
    media:
    - kind: video
      title: 口播课件 · 第 1 节
      object_key: documents/shared/course-media/day01-c1-pm-in-ai-era.mp4
      poster_key: documents/shared/course-media/day01-c1-pm-in-ai-era-poster.jpg
      duration_sec: 126
  c2:
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: TRAE 手动操作 + 通用对话
      note: 本节交付：七岗位团队 + 团队协作卡
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id003
      - Agent 完成岗位任务并自检后应该处于什么状态？
      - - RELEASED
        - REVIEW
        - APPROVED
      - 1
      - 岗位只能提交 REVIEW，批准必须由学员明确给出。
    - &id004
      - 为什么不让一个 Agent 自动把全部岗位做完？
      - - 因为模型不会写代码
        - 因为学员会失去交接、判断和验收过程
        - 因为文件数量会变少
      - 1
      - 课程目标是看懂研发逻辑，而不是只看到最终产物。
    media:
    - kind: video
      title: 口播课件 · 第 2 节
      object_key: documents/shared/course-media/day01-c2-requirement-to-prd.mp4
      poster_key: documents/shared/course-media/day01-c2-requirement-to-prd-poster.jpg
      duration_sec: 72
  c3:
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent'
      note: 本节交付：项目任务书
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - &id005
      - 项目经理最先要控制的是什么？
      - - 按钮颜色
        - 范围、里程碑和风险
        - 数据库语法
      - 1
      - 项目经理确保团队在同一范围和节奏内交付。
    - &id006
      - 项目经理为什么不能顺手写完 PRD？
      - - 他不会写
        - 岗位边界和验收责任会被打乱
        - PRD 不重要
      - 1
      - 每个岗位只交付自己的成果，下一岗位由学员亲自发起。
    media:
    - kind: video
      title: 口播课件 · 第 3 节
      object_key: documents/shared/course-media/day01-c3-pm-prompt-anatomy.mp4
      poster_key: documents/shared/course-media/day01-c3-pm-prompt-anatomy-poster.jpg
      duration_sec: 66
  c4:
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@产品经理 Agent'
      note: 本节交付：docs/PRD.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 产品经理收到老板一句话后正确的第一步是什么？
      - - 直接生成 PRD
        - 先澄清影响范围和验收的问题
        - 开始画页面
      - 1
      - 先澄清才能避免把假设写成需求。
    - - “页面要好用”为什么不是合格验收标准？
      - - 字数太少
        - 第三方无法客观判断通过或失败
        - 没有英文
      - 1
      - 验收标准必须可观察、可执行、可判断。
    media:
    - kind: video
      title: 口播课件 · 第 4 节
      object_key: documents/shared/course-media/day01-c4-hands-on-mini-prd.mp4
      poster_key: documents/shared/course-media/day01-c4-hands-on-mini-prd-poster.jpg
      duration_sec: 68
  c5:
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@UI/UX 设计师 Agent'
      note: 本节交付：四页可点击原型 + 第一次岗位交接
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - UI 原型完成后能不能称为正式前端？
      - - 能，只要好看
        - 不能，它用于确认结构和交互，正式工程在第二天实现
        - 能，只要能点击
      - 1
      - 原型和正式前端是两个不同交付状态。
    - - AI 区为什么要先写标识再画按钮？
      - - 文字更便宜
        - 用户必须先知道能力状态和内容来源，按钮不能掩盖边界
        - 按钮不能点击
      - 1
      - 状态与来源比操作入口更重要。
    media:
    - kind: video
      title: 口播课件 · 第 5 节
      object_key: documents/shared/course-media/day01-c5-accept.mp4
      poster_key: documents/shared/course-media/day01-c5-accept-poster.jpg
      duration_sec: 70
