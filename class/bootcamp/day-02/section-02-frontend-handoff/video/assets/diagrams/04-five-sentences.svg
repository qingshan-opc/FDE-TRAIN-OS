<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="04-five-sentences">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="13" flood-color="#0d9488" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="506" cy="50" r="82" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="82;96;82" dur="9.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="420" r="58" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="58;68;58" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="40" y="29" width="6" height="22" rx="3" fill="url(#teal)"/><text x="56" y="46" font-size="19" font-weight="800" fill="#231f20">五句复述</text><text x="520" y="45" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.42)">RECAP ×5</text></g>

  <text x="40" y="104" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.4)">用自己的话说一遍</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <g transform="translate(67,154)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.15s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="60" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="30" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">用户</text>
  </g>
  <g transform="translate(139,154)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.45s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="60" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="30" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">页面</text>
  </g>
  <g transform="translate(211,154)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.75s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="86" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="43" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">核心操作</text>
  </g>
  <g transform="translate(309,154)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.05s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="86" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="43" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">数据状态</text>
  </g>
  <g transform="translate(407,154)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.35s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="86" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="43" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">验收标准</text>
  </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="212" y="406" width="135" height="38" rx="19" fill="rgba(13,148,136,.09)"/><circle cx="232" cy="425" r="3.5" fill="#0d9488"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="242" y="430" font-size="13" font-weight="700" fill="#0f766e">输出五句后停止</text></g>
</svg>
