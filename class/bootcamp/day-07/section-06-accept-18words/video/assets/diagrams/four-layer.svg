<text x="892" y="133" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">↓ 点击 · 输入</text><text x="892" y="147" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">↑ 页面 · 渲染</text>
<text x="892" y="239" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">↓ SQL 查询</text><text x="892" y="253" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">↑ 数据行</text>
<text x="892" y="345" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">↓ Prompt 调用</text><text x="892" y="359" font-size="10" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">↑ 摘要 · 建议</text>
<text x="180" y="500" font-size="11" fill="rgba(35,31,32,.5)" font-family="'SF Mono',Menlo,monospace">接电顺序：Day 2 前端 → Day 3 接口 → Day 4 数据库 → Day 5 模型 → Day 6 部署上线</text>
