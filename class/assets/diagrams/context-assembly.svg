<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="上下文装配：这次调用放什么进模型视野">
<defs>
<marker id="cx-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#231f20"/>
</marker>
</defs>
<rect width="1040" height="470" fill="#f2f5f0"/>
<!-- 原料仓 -->
<rect x="50" y="60" width="270" height="330" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="185" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">原料仓（你的数据库）</text>
<g font-size="11.5" fill="rgba(35,31,32,.65)">
<rect x="70" y="112" width="230" height="40" fill="rgba(35,31,32,.05)"/><text x="84" y="137">本期 KPI 明细</text>
<rect x="70" y="164" width="230" height="40" fill="rgba(35,31,32,.05)"/><text x="84" y="189">上月同期对比</text>
<rect x="70" y="216" width="230" height="40" fill="rgba(35,31,32,.05)"/><text x="84" y="241">部门目标值</text>
<rect x="70" y="268" width="230" height="40" fill="rgba(35,31,32,.05)"/><text x="84" y="293">异常清单</text>
<rect x="70" y="320" width="230" height="40" fill="rgba(35,31,32,.05)"/><text x="84" y="345" fill="rgba(35,31,32,.4)">全年原始日志（别放）</text>
</g>
<!-- 装配台 -->
<rect x="390" y="130" width="260" height="190" fill="#ffffff" stroke="#1400ff" stroke-width="2.5"/>
<text x="520" y="164" text-anchor="middle" font-size="13" font-weight="800" fill="#1400ff">装配台 · 上下文工程</text>
<text x="520" y="192" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">选什么 + 放多少</text>
<!-- token 预算条 -->
<rect x="420" y="216" width="200" height="20" fill="rgba(35,31,32,.08)"/>
<rect x="420" y="216" width="130" height="20" fill="#1400ff"/>
<text x="520" y="258" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)" style="font-family:'SF Mono',Menlo,monospace">token 预算：窗口是上限，不是目标</text>
<text x="520" y="292" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">给少了瞎编 · 给多了迷失</text>
<!-- 模型 -->
<rect x="720" y="130" width="270" height="190" fill="#ffffff" stroke="#e0479e" stroke-width="2.5"/>
<text x="855" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#231f20">LLM</text>
<text x="855" y="204" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.4)" style="font-family:'SF Mono',Menlo,monospace">只看得见你装配的</text>
<text x="855" y="250" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.6)">输出：三段式摘要</text>
<!-- 箭头 -->
<line x1="322" y1="225" x2="384" y2="225" stroke="#231f20" stroke-width="1.8" marker-end="url(#cx-arrow)"/>
<line x1="652" y1="225" x2="714" y2="225" stroke="#231f20" stroke-width="1.8" marker-end="url(#cx-arrow)"/>
<!-- 底注 -->
<text x="520" y="424" text-anchor="middle" font-size="13" font-weight="800" fill="#231f20">模型看不到你的数据库——它只看到装配台递过去的那一包</text>
<text x="520" y="450" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.55)">摘要质量差，先查装配台：是不是该给的没给 / 不该给的塞太多</text>
</svg>
