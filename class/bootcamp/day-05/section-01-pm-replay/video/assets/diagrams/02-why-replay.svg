<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="软件开发全流程：需求调研到迭代"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/></pattern><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/></marker></defs><rect width="1200" height="460" fill="#ffffff"/><rect width="1200" height="460" fill="url(#dots)"/><circle cx="1136" cy="56" r="86" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/></circle><circle cx="52" cy="410" r="60" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="60;72;60" dur="11s" repeatCount="indefinite"/></circle><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="32" y="26" width="6" height="24" rx="3" fill="#0d9488"/><text x="48" y="45" font-size="20" font-weight="800" fill="#231f20">一个软件的完整旅程（六站）</text><text x="1168" y="43" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.42)">FROM 「I WANT」 TO 「I&#x27;M USING IT」</text></g><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><g><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.0s" dur="2.4s" repeatCount="indefinite"/><rect x="48" y="104" width="168" height="196" rx="16" fill="#ffffff" filter="url(#sh)"/><text x="132.0" y="134" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">STATION 1</text><text x="132.0" y="164" text-anchor="middle" font-size="18" font-weight="800" fill="#231f20">需求调研</text><text x="132.0" y="192" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.6)">谁的什么问题？</text><text x="132.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">别问想吃什么</text><text x="132.0" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">看他剩什么</text><text x="132.0" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">访谈 · 观察 · 问卷 · 竞品</text></g><line x1="222" y1="202" x2="238" y2="202" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" repeatCount="indefinite"/></line><g><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.3s" dur="2.4s" repeatCount="indefinite"/><rect x="244" y="104" width="168" height="196" rx="16" fill="#ffffff" filter="url(#sh)"/><text x="328.0" y="134" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">STATION 2</text><text x="328.0" y="164" text-anchor="middle" font-size="18" font-weight="800" fill="#231f20">原型确认</text><text x="328.0" y="192" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.6)">是这个意思吗？</text><text x="328.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">先出样板间</text><text x="328.0" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">再动工</text><text x="328.0" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">线框图 · 高保真原型</text></g><line x1="418" y1="202" x2="434" y2="202" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" repeatCount="indefinite"/></line><g><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.6s" dur="2.4s" repeatCount="indefinite"/><rect x="440" y="104" width="168" height="196" rx="16" fill="#ffffff" filter="url(#sh)"/><text x="524.0" y="134" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">STATION 3</text><text x="524.0" y="164" text-anchor="middle" font-size="18" font-weight="800" fill="#231f20">开发</text><text x="524.0" y="192" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.6)">把样品变成真的</text><text x="524.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">你描述 · AI 写</text><text x="524.0" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">你盯着</text><text x="524.0" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">成本被压得最快的一站</text></g><line x1="614" y1="202" x2="630" y2="202" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" repeatCount="indefinite"/></line><g><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.8999999999999999s" dur="2.4s" repeatCount="indefinite"/><rect x="636" y="104" width="168" height="196" rx="16" fill="#ffffff" filter="url(#sh)"/><text x="720.0" y="134" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">STATION 4</text><text x="720.0" y="164" text-anchor="middle" font-size="18" font-weight="800" fill="#231f20">测试验收</text><text x="720.0" y="192" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.6)">说好的都做到了吗</text><text x="720.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">照单子验货</text><text x="720.0" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">不是「我觉得行」</text><text x="720.0" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">Rubric 清单 · 逐条打勾</text></g><line x1="810" y1="202" x2="826" y2="202" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" repeatCount="indefinite"/></line><g><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.2s" dur="2.4s" repeatCount="indefinite"/><rect x="832" y="104" width="168" height="196" rx="16" fill="#ffffff" filter="url(#sh)"/><text x="916.0" y="134" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#0d9488">STATION 5</text><text x="916.0" y="164" text-anchor="middle" font-size="18" font-weight="800" fill="#231f20">上线</text><text x="916.0" y="192" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.6)">我这能跑→大家能用</text><text x="916.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">搬到一直开着的</text><text x="916.0" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">电脑上（下节）</text><text x="916.0" y="278" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">部署 · 上云</text></g><line x1="1006" y1="202" x2="1022" y2="202" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" repeatCount="indefinite"/></line><g><animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="1.5s" dur="2.4s" repeatCount="indefinite"/><rect x="1028" y="104" width="160" height="196" rx="16" fill="url(#tg)" filter="url(#glow)"/><text x="1108.0" y="134" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="rgba(255,255,255,.85)">STATION 6</text><text x="1108.0" y="164" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">迭代</text><text x="1108.0" y="192" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.85)">回到第一站</text><text x="1108.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">上线不是终点</text><text x="1108.0" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">是起点</text><text x="1108.0" y="278" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,.75)">软件是改完的</text></g><path d="M1128 300 C1128 372 132 372 132 306" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="6 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="1s" repeatCount="indefinite"/></path><rect x="48" y="394" width="560" height="48" rx="14" fill="rgba(225,29,72,.05)" stroke="rgba(225,29,72,.3)" stroke-width="1.2"/><text x="66" y="423" font-size="13" font-weight="700" fill="#c92f3d">瀑布：先画好整栋楼的图纸，一口气装完——想得全，但住进去才发现厨房不顺手。</text><rect x="628" y="394" width="560" height="48" rx="14" fill="rgba(13,148,136,.08)" stroke="rgba(13,148,136,.3)" stroke-width="1.2"/><text x="646" y="423" font-size="13" font-weight="700" fill="#0f766e">敏捷：一周装修一间房，住进去再决定下一间——你前四天就是这么干的。</text></g></svg>
