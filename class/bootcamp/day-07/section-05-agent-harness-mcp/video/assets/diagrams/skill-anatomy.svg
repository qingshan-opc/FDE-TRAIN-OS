<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="Skill 解剖：输入、步骤、输出、证据">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <rect width="1040" height="470" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="422" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">Skill 解剖：输入 · 步骤 · 输出 · 证据</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">SKILL ANATOMY</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="50" y="56" width="940" height="62" rx="16" fill="url(#tlg)"/><text x="80" y="84" font-size="12.5" font-weight="800" fill="#fff" font-family="'SF Mono',Menlo,monospace">描述 · DESCRIPTION</text><text x="80" y="106" font-size="11.5" fill="rgba(255,255,255,.9)">「给销售部生成周报初稿：读本周线索与商机表，产出三段式 markdown」—— Agent 靠这段话决定选不选你</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="50" y="140" width="280" height="220" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="190" y="174" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">输入 · INPUT</text>
<text x="76" y="210" font-size="11" fill="rgba(35,31,32,.65)">参数表：</text>
<text x="76" y="236" font-size="11" fill="rgba(35,31,32,.65)" font-family="'SF Mono',Menlo,monospace">month: 2026-07</text>
<text x="76" y="262" font-size="11" fill="rgba(35,31,32,.65)" font-family="'SF Mono',Menlo,monospace">region?: 华东</text>
<text x="76" y="288" font-size="11" fill="rgba(35,31,32,.65)">类型 + 必填/可选 + 示例</text>
<text x="76" y="314" font-size="11" fill="rgba(35,31,32,.65)">坏输入怎么拒（见边界声明）</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="380" y="140" width="280" height="220" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="520" y="174" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">步骤 · STEPS</text>
<text x="406" y="210" font-size="11" fill="rgba(35,31,32,.65)">1. 查库取本周数据</text>
<text x="406" y="236" font-size="11" fill="rgba(35,31,32,.65)">2. 算环比与异常</text>
<text x="406" y="262" font-size="11" fill="rgba(35,31,32,.65)">3. 调模型写初稿</text>
<text x="406" y="288" font-size="11" fill="rgba(35,31,32,.65)">4. 按模板整形</text>
<text x="406" y="322" font-size="10.5" fill="rgba(35,31,32,.45)">每步可观测：日志留痕</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="710" y="140" width="280" height="220" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="850" y="174" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">输出 · OUTPUT</text>
<text x="736" y="210" font-size="11" fill="rgba(35,31,32,.65)">产物：weekly-2026-07.md</text>
<text x="736" y="236" font-size="11.5" font-weight="700" fill="#231f20">+ 证据 · EVIDENCE</text>
<text x="736" y="262" font-size="11" fill="rgba(35,31,32,.65)">数据快照 / 用时 / 模型版本</text>
<text x="736" y="296" font-size="10.5" fill="rgba(35,31,32,.45)">没证据的输出 ≈ 没发生过</text>
</g>
<path d="M336 250 L374 250" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M666 250 L704 250" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="120" y="392" width="800" height="58" rx="29.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="417.0" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Skill = 会写字的岗位说明书：写得越清楚，Agent 越选得对、跑得越稳</text>
<text x="520.0" y="437.0" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">Skill = 说明书+工具 · MCP = 统一插座 —— 互补，不是简化版</text></g>
</svg>
