<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-label="V2 成品全景：驾驶舱 + 挂 Skill 的 Agent + 十条能力证据，人在上面派活确认验收">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#0d9488" flood-opacity=".45"/>
    </filter>
    <marker id="v2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>
  <rect width="1040" height="560" fill="url(#dots)"/>
  <circle cx="970" cy="60" r="100" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="510" r="70" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="20" width="6" height="24" rx="3" fill="#0d9488"/>
    <text x="52" y="38" font-size="16" font-weight="800" fill="#231f20">你的 V2 成品全景：一个能派活的驾驶舱</text>
    <text x="1004" y="38" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">V2 PANORAMA</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <!-- left: dashboard -->
    <g>
      <rect x="50" y="96" width="320" height="306" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="210" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">驾驶舱前端（六个区块）</text>
      <g font-size="12" fill="#231f20">
        <rect x="74" y="148" width="130" height="58" rx="10" fill="rgba(35,31,32,.05)"/>
        <text x="139" y="183" text-anchor="middle" font-weight="700" fill="rgba(35,31,32,.7)">核心指标</text>
        <rect x="216" y="148" width="130" height="58" rx="10" fill="rgba(35,31,32,.05)"/>
        <text x="281" y="183" text-anchor="middle" font-weight="700" fill="rgba(35,31,32,.7)">趋势图</text>
        <rect x="74" y="218" width="130" height="58" rx="10" fill="rgba(35,31,32,.05)"/>
        <text x="139" y="253" text-anchor="middle" font-weight="700" fill="rgba(35,31,32,.7)">数据表</text>
        <rect x="216" y="218" width="130" height="58" rx="10" fill="rgba(35,31,32,.05)"/>
        <text x="281" y="253" text-anchor="middle" font-weight="700" fill="rgba(35,31,32,.7)">筛选器</text>
        <rect x="74" y="288" width="130" height="58" rx="10" fill="rgba(35,31,32,.05)"/>
        <text x="139" y="323" text-anchor="middle" font-weight="700" fill="rgba(35,31,32,.7)">详情面板</text>
        <rect x="216" y="288" width="130" height="58" rx="10" fill="url(#teal)" filter="url(#glow)"/>
        <text x="281" y="323" text-anchor="middle" font-weight="700" fill="#fff">AI 助手位</text>
      </g>
      <text x="210" y="384" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.55)">React + FastAPI + SQLite · 云上部署</text>
    </g>

    <!-- middle: agent -->
    <g>
      <rect x="420" y="96" width="220" height="306" rx="16" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="1.6" filter="url(#sh)"/>
      <text x="530" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#0f766e">Agent（你的数字同事）</text>
      <circle cx="530" cy="184" r="34" fill="rgba(13,148,136,.08)"/>
      <circle cx="530" cy="184" r="34" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 8">
        <animateTransform attributeName="transform" type="rotate" from="0 530 184" to="360 530 184" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text x="530" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">决策环</text>
      <text x="530" y="198" text-anchor="middle" font-size="10" fill="rgba(35,31,32,.6)">感知→想→做</text>
      <g font-size="12" font-weight="700">
        <rect x="440" y="238" width="180" height="38" rx="19" fill="#fff" stroke="rgba(35,31,32,.16)"/>
        <text x="530" y="262" text-anchor="middle" fill="#231f20">Skill · 拉数据</text>
        <rect x="440" y="286" width="180" height="38" rx="19" fill="#fff" stroke="rgba(35,31,32,.16)"/>
        <text x="530" y="310" text-anchor="middle" fill="#231f20">Skill · 生成周报</text>
        <rect x="440" y="334" width="180" height="38" rx="19" fill="url(#teal)"/>
        <text x="530" y="358" text-anchor="middle" fill="#fff">Skill · 发送（带确认）</text>
      </g>
      <text x="530" y="392" text-anchor="middle" font-size="11" fill="rgba(35,31,32,.55)">Harness 供上下文 · 异常有分类</text>
    </g>

    <!-- right: evidence checklist -->
    <g>
      <rect x="690" y="96" width="300" height="306" rx="16" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <text x="840" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">十条能力证据（验收单）</text>
      <g font-size="12.5" fill="#231f20">
        <text x="712" y="158"><tspan fill="#0d9488" font-weight="800">✓</tspan> 讲清四层架构与取舍</text>
        <text x="712" y="185"><tspan fill="#0d9488" font-weight="800">✓</tspan> 前端三态 + 迭代日志</text>
        <text x="712" y="212"><tspan fill="#0d9488" font-weight="800">✓</tspan> 接口契约 + 状态码语义</text>
        <text x="712" y="239"><tspan fill="#0d9488" font-weight="800">✓</tspan> 表设计 + SQL 四招</text>
        <text x="712" y="266"><tspan fill="#0d9488" font-weight="800">✓</tspan> Prompt 四要素 + 成本观</text>
        <text x="712" y="293"><tspan fill="#0d9488" font-weight="800">✓</tspan> 环境变量与配置分离</text>
        <text x="712" y="320"><tspan fill="#0d9488" font-weight="800">✓</tspan> 一个带验收的 Skill</text>
        <text x="712" y="347"><tspan fill="#0d9488" font-weight="800">✓</tspan> 编排含确认点与日志</text>
        <text x="712" y="374"><tspan fill="#0d9488" font-weight="800">✓</tspan> 线上可访问的 V2</text>
      </g>
    </g>

    <!-- arrows between panels -->
    <line x1="374" y1="250" x2="414" y2="250" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#v2-arrow)">
      <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="644" y1="250" x2="684" y2="250" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#v2-arrow)">
      <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>

    <!-- bottom human band -->
    <rect x="50" y="434" width="940" height="82" rx="18" fill="url(#teal)" filter="url(#glow)"/>
    <text x="520" y="470" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">你（人）：派活 → 确认关键动作 → 按验收单收货</text>
    <text x="520" y="496" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.85)">FDE = 架构你定、脏活 AI 干、质量你验收</text>

    <!-- dashed links from band -->
    <g stroke="rgba(13,148,136,.6)" stroke-width="1.6" stroke-dasharray="5 5" fill="none">
      <line x1="210" y1="434" x2="210" y2="408" marker-end="url(#v2-arrow)">
        <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="530" y1="434" x2="530" y2="408" marker-end="url(#v2-arrow)">
        <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="840" y1="434" x2="840" y2="408" marker-end="url(#v2-arrow)">
        <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
