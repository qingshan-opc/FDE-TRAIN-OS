title: "第七天 · 第 5 节 · 实战：运行与证据"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · AI 上岗"
      - "派活 · 收货 · 验收 · 留证据"
      - "不再自己打字 · 按标准验货"
    text: |
      同学们好，我是你们的老师404。这节 AI 拿着你的说明书上岗。你的工作变成四步：派活、收货、按标准验收、留证据——不再是自己逐字打字，而是按标准验货。有同学可能会说：404老师，运行是不是把 Prompt 粘进去就行？不完全是——Skill 是说明书加输入，再加一句「按这份 Skill 执行」，验收按你自己写的判据逐条打勾。今天目标：完整跑通一次，最好连续两次验收全过。跑不通别慌，大概率是说明书还要改，对吧。

  - id: "02-run-formula"
    ppt:
      - "眉题：02 RUN FORMULA · 运行公式"
      - "运行 = 说明书 + 输入"
      - "Agent Lab / 模型对话"
      - "指令 · 按这份 Skill 执行"
    text: |
      运行公式就一句：说明书加输入。Agent Lab 或模型对话里，先粘贴 Skill 说明书全文，再粘贴输入数据——驾驶舱 curl 结果、导出的 JSON 或你准备的 input.md。最后一句指令：「按这份 Skill 执行」。收货后别看感觉，看你写的验收段，逐条判 ✓ 还是 ✗。打个比方：你以前是厨师，现在是质检——锅在 AI 那边，尺子在你这边。有同学问：输入要贴多少？够覆盖输入段写的来源和范围就行，别半拉子数据测全流程。输入和说明书对不上，验收不过不算 AI 的锅，嘛。

  - id: "03-run-steps"
    ppt:
      - "眉题：03 RUN STEPS · 四步操作"
      - "① 贴说明书 ② 贴输入"
      - "③ 执行 ④ 逐条验收"
      - "讲解图：agentlab-five-steps.svg"
    text: |
      具体操作四步，咱们走一遍。第一，贴说明书全文，别删验收段——验收给 AI 自检，也给你打勾。第二，贴输入，标明日期和来源。第三，执行，等产出。第四，打开你的验收段，逐条判 ✓ 或 ✗，再写总判。有同学可能会说：AI 已经说「我检查过了都满足」。不信——它说满足，你仍要按条对来源，数字判据必须人工对一遍。感觉好不等于验收过，这是 FDE 和「会聊天」的分水岭。第一次跑不过太正常，迭代才是常态，别第一轮不过就怀疑模型，先怀疑说明书，对吧。

  - id: "04-evidence-trio"
    ppt:
      - "眉题：04 EVIDENCE · 证据三件套"
      - "runs/日期-skill名/"
      - "input.md · output.md · verdict.md"
      - "讲解图：three-states.svg"
    text: |
      每次运行留证据三件套，目录 runs/日期-skill名/。input.md 是输入快照——这次喂了什么数据。output.md 是产出物原文——一字不改存下来。verdict.md 是验收结果——逐条 ✓/✗，加总判和改进项。为什么要留？Skill 的信任是攒出来的——连续十次通过，你才敢把「每次都看」降级成「抽看」，第九天编排信任分级就这么来的。有同学问：今天跑两次要两个目录吗？对，一次运行一个目录，别覆盖。证据是你的本金，没有证据链，第六节验收说不清你练过，呢。

  - id: "05-iteration-loop"
    ppt:
      - "眉题：05 ITERATION · 迭代闭环"
      - "验收不过 · 先定位"
      - "歧义 → 改说明书（多数）"
      - "偏差 → 加示例/拆步骤 → 重跑"
    text: |
      验收不过怎么办？先定位：说明书歧义，还是 AI 执行偏差。歧义就改说明书——多数情况是这个，比如步骤顺序不清、输出格式含糊。偏差就换表达、加示例、拆步骤，必要时在开头加「严格按步骤顺序执行，每步完成后简述结果」。然后重跑，再验收。记住一句：验收不过大概率是说明书的锅，不是 AI 的锅——就像换人测试里读者误解，是作者的锅。有同学可能会说：我改了三遍还不过。停，回到四部件，找最糊的那一段，通常输出或验收没钉死。最多三轮，别空转，对吧。

  - id: "06-trust-building"
    ppt:
      - "眉题：06 TRUST · 信任怎么攒"
      - "连续 2 次全过 · 今天达标"
      - "连续 10 次 · 可降级抽看"
      - "verdict.md · 迭代日志"
    text: |
      信任怎么攒？靠重复运行加一致验收。今天达标线：连续两次验收全过。不是跑一次就毕业——模型有概率性，两次都过，说明说明书底线够硬。迭代日志写清楚：改了什么、重跑了几次、哪条判据从 ✗ 变 ✓。有同学问：两次结果不一样算失败吗？不一定——验收管的是底线：结构、数字、意图，波动在标准内即可。就像周报：措辞可以换，但四段要在、数字要真、建议得可执行。信任不是「AI 永远一样」，是「标准每次都一样」，听见了吗？

  - id: "07-common-issues"
    ppt:
      - "眉题：07 ISSUES · 两个常见问题"
      - "跳步 · 开头加强制顺序"
      - "结果波动 · 验收管底线"
      - "执行轨迹 · 也是证据"
    text: |
      两个常见问题。第一，AI 没按步骤做，直接跳到生成——在说明书开头加强制顺序，每步完成后简述结果；执行轨迹截图或粘贴，也是证据。第二，每次跑结果不一样——正常，模型有概率性；别用「感觉不像上次」当失败，用验收条说话。还有：数字编了、段落了、建议不可执行——数字和意图判据会抓出来。有同学可能会说：我能不能换更强的模型？可以试，但别逃避改说明书——换模型是偏差侧，改说明书是歧义侧，先分清再动刀。今天把时间花在迭代上，不是花在挑模型上，嘛。

  - id: "08-close"
    ppt:
      - "眉题：08 TAKEAWAY · 证据是本金"
      - "派活 · 收货 · 验收 · 留证"
      - "连续 2 次全过"
      - "预告 · 第七天验收口试"
    text: |
      同学们，本节先到这里。带走一句：Skill 的信任是攒出来的，证据三件套就是你的本金。跑完归档，别散在聊天记录里——input、output、verdict 进 runs/ 目录，迭代日志写清改了什么、哪条从 ✗ 变 ✓。下一节是第七天验收：Skill 三问口试，导师看证据链。今晚若还没连续两次全过，优先改说明书再重跑，别带着 ✗ 去口试。答得含糊的，回看验收段是否可判，逐条打勾练一遍，对吧。
