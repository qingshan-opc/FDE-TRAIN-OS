<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="open">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.14)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#0d9488" flood-opacity=".4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#ffffff"/>
  <rect width="560" height="460" fill="url(#dots)"/>
  <circle cx="504" cy="56" r="86" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="86;100;86" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="416" r="62" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="62;74;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="24" width="6" height="26" rx="3" fill="#0d9488"/>
    <text x="46" y="43" font-size="19" font-weight="800" fill="#231f20">最关键的一次闭环</text>
    <text x="532" y="41" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.8" fill="rgba(35,31,32,.42)">DAY-01 · UI PROTOTYPE</text>
  </g>
<text x="36" y="128" text-anchor="start" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.45)">HANDOFF · PM → UI</text>
<g transform="translate(140.0,150)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="89.8" height="64" rx="12" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1" filter="url(#sh)"/>
      <text x="44.9" y="36.68" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20">@产品经理</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.0s" dur="7.0s" repeatCount="indefinite"/>
    </g>
  <path d="M232.8 182.0 H256.8" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
  </path>
<g transform="translate(259.8,150)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="76.8" height="64" rx="12" fill="url(#teal)" filter="url(#glow)"/>
      <text x="38.4" y="36.68" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PRD.md</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.35s" dur="7.0s" repeatCount="indefinite"/>
    </g>
  <path d="M339.6 182.0 H363.6" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.0s" repeatCount="indefinite"/>
  </path>
<g transform="translate(366.6,150)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="53.4" height="64" rx="12" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1" filter="url(#sh)"/>
      <text x="26.7" y="36.68" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20">@UI</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.7s" dur="7.0s" repeatCount="indefinite"/>
    </g>
<g transform="translate(36,280)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="488" height="84" rx="16" fill="#fff" stroke="rgba(35,31,32,.1)" stroke-width="1" filter="url(#sh)"/>
      
      <text x="24" y="47.6" font-size="16" font-weight="700" fill="#231f20">切换岗位，就是一次真实交接</text>
      
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.4s" dur="7.0s" repeatCount="indefinite"/>
    </g>
</svg>
