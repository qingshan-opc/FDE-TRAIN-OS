quiz:
  pass_rate: 0.67
  questions:
  - q: LLM 生态四层从底到顶的正确顺序是？
    options:
    - 应用→编排→模型→基建
    - 基建→模型→编排→应用
    - 模型→应用→编排→基建
    answer: 1
    explain: 驾驶舱在应用层；换模型是换编排/模型层的牌子。
  - q: 一次性 JSON 响应和 SSE 流式，主要差别是？
    options:
    - 计费单位不同
    - 前者等整包再渲染；后者边收边显示（助手位建议 SSE）
    - SSE 只能用于图像模型
    answer: 1
    explain: Day6 S01：API 负责打到哪，SSE 负责怎么流回来。
  - q: Token 与上下文窗口的关系？
    options:
    - Token 是计费单位，与窗口无关
    - Token 是读写基本单位；窗口是一次能塞进去的上限
    - 窗口越大幻觉越少
    answer: 1
    explain: 给少了瞎编，给多了迷失——Context Engineering 管装填。
  - q: 幻觉（Hallucination）的本质是？
    options:
    - 模型 bug，升级就消失
    - 机制：永远给「最像真的」而非「经过核实的」
    - 只有小模型才会幻觉
    answer: 1
    explain: 用 RAG、Eval、Guardrails 管理，不是 magic prompt。
  - q: RAG 主要解决什么问题？
    options:
    - 让模型更快
    - 先从资料库检索片段，再基于片段回答——治幻觉药方之一
    - 替代 Fine-tune
    answer: 1
    explain: 可溯源比「听起来对」重要。
  - q: Fine-tune 与 Prompt 的分工？
    options:
    - 完全相同
    - Prompt 改这次输入；Fine-tune 改模型权重——贵、慢，多数业务 Prompt+RAG 够用
    - Fine-tune 只能用于聊天
    answer: 1
    explain: 先 Prompt/Context，真搞不定再考虑 Fine-tune。
  - q: Eval 替代的是什么？
    options:
    - 单元测试
    - 「我觉得还行」——用固定题库+判分标准验收 AI 产物
    - 代码审查
    answer: 1
    explain: Rubric 思维在 LLM 日落地。
  - q: Agent 和 Workflow 怎么选？
    options:
    - 永远用 Agent
    - 能写死流程就 Workflow；写不死才 Agent
    - 永远用 Workflow
    answer: 1
    explain: Agent 信任成本高——需要 Harness 和日志。
  - q: MCP 是什么？
    options:
    - 一种新的编程语言
    - 给 AI 接工具/数据源的 USB-C 标准——Skill 是它的朴素版
    - 只有 OpenAI 支持
    answer: 1
    explain: 标准接口让工具可复用。
  - q: Copilot vs Agent？
    options:
    - Copilot 能自动跑完业务流程
    - Copilot 递扳手；Agent 你定目的地它开——验收方式完全不同
    - 没有区别
    answer: 1
    explain: Week 2 主要在 Agent 侧加深。
  - q: Harness 包含什么？
    options:
    - 只有大模型
    - 工具表、记忆、规划、重试、日志——模型之外的循环骨架
    - 前端框架
    answer: 1
    explain: 同一模型换 Harness，能力天差地别。
