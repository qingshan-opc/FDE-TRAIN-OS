<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="Serverless：从买车到打车">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="252" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">Serverless：从买车到打车</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">SERVERLESS</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="76" width="430" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="84" y="110" font-size="14" font-weight="800" fill="rgba(35,31,32,.6)">买车 · 自己养服务器</text>
<text x="84" y="140" font-size="12" fill="rgba(35,31,32,.55)">买机器、装系统、盯运维</text>
<text x="84" y="168" font-size="12" fill="rgba(35,31,32,.55)">没人用也照烧钱</text>
</g>
<path d="M500 151 L556 151" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="566" y="76" width="414" height="150" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="590" y="110" font-size="14" font-weight="800" fill="#0f766e">打车 · Serverless</text>
<text x="590" y="140" font-size="12" fill="rgba(35,31,32,.6)">云厂商全包：你关心一段服务被调用，</text>
<text x="590" y="162" font-size="12" fill="rgba(35,31,32,.6)">不是哪台机器（微信小程序云函数就是这形态）</text>
<text x="590" y="196" font-size="12" font-weight="700" fill="#0f766e">✓ 零运维起步 · 按调用付费，没人用就不花钱</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="250" width="600" height="36" rx="18.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="272.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">不是没有服务器 · 代价：冷启动、厂商绑定——先听懂概念</text></g>
</svg>
