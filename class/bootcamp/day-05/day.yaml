day: 5
project: FDE 全栈理论
project_brief: |-
  今天不写长文地图。请基于「你自己的项目」（默认：部门周报助手；也可换成你的点子）手绘一张技术架构图，拍照上传。

  怎么做：
  1）打开资源「手绘架构图 · 搭档提示词」，整份粘进 AI，先回答它的 4 个约束问题，拿到「该画什么」的四层清单；
  2）自己动手画（纸笔 / 白板 / 手写板均可）——禁止截网上现成架构图充数；
  3）图上至少能看出：前端入口、后端/服务、数据存储、一次外部依赖（有则标，无则写「暂无」）；
  4）上传清晰照片，并在复盘里用 8–12 句话讲清「为什么这样分层」。

  过闸标准：是你自己的项目、四层齐、能对着图讲清楚。
