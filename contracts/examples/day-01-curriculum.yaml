  estimated_minutes: 140
  require_capsules: true
  capsules:
  - id: c1
    title: 先选一个你真正懂的问题
    minutes: 25
    form: 视频+工具准备
    content_ref: class/bootcamp/day-01/section-01-pm-in-ai-era/lesson.md
    content: '同学们好。第一节我们先不碰代码，也不选工具，只做一件事：找一个值得解决的真实问题。


      比如财务每个月要合并很多费用表，员工诉求散落在群消息里，例会提出的问题总是没人跟进。这些问题反复发生，过程能记录，最后也能判断有没有改善，就适合做成第一周项目。


      为什么一定要选自己懂的方向？因为 AI 很会生成，但它不一定懂你的行业。你做过财务，才知道费用类型有没有漏；你做人力，才知道员工诉求应该怎么分；你熟悉经营管理，才看得出问题有没有真正闭环。你的业务经验，就是你判断 AI 做得对不对的依据。


      这一周不是让你变成程序员，而是让你做项目负责人。AI 负责快速产出，你负责说清问题、检查结果、决定通过还是返工。


      这四件事现在先记在脑子里，不需要马上写文档。到第三节，项目经理会一次只问你一个问题，陪你把选题和五天计划整理出来。


      记住这句话：**先选真实问题，再选实现方法；你熟悉的业务，就是项目的护城河。**


      前面说“先不选工具”，是指不要让工具替你决定做什么项目。真正进入实操前，我们仍要把开发工具准备好。


      现在请打开视频下方的“课程资源”。先进入 TRAE 国内版官方下载页，选择与你电脑系统对应的版本，完成下载、安装和登录；再下载“七岗位 AI 员工提示词包”，解压后确认能看到项目经理、产品经理、页面设计师、前端工程师、后端工程师、测试工程师和运维工程师七份提示词。


      本节不用创建 AI 员工，也不用写代码。做到 TRAE 能正常打开、七份提示词已经下载并解压，本节实操就完成了。下一节，我们再把这七名 AI 员工逐个招进你的开发团队。'
    practice: '完成标志：

      [ ] TRAE 能正常打开

      [ ] 七份岗位提示词能正常查看

      [ ] 暂不创建智能体、不写代码，进入下一节再组建团队'
    resource_ids:
    - trae-cn-download
    - team-prompts-v11
    tools:
    - name: TRAE 国内版
      note: 本节交付：TRAE 安装完成 + 七岗位提示词包
    - name: 七岗位提示词包
      note: 本节只下载解压，下一节再创建 AI 员工
    quiz:
    - - 第一节完成软件安装后，接下来应该做什么？
      - - 立刻让一个 AI 做完整项目
        - 确认七份提示词已解压，下一节再逐个创建 AI 员工
        - 先学习编程语言
      - 1
      - 第一节只完成工具准备，不创建智能体，也不写代码。
    knowledge_cards:
    - id: d1l1-k1
      term: 工序没有消失
      plain: 从想法到系统仍要经过需求、设计、页面、数据和检查，AI 改变的是执行者，不是做事顺序。
    - id: d1l1-k2
      term: 先说清业务问题
      plain: AI 时代的第一道门槛不是会不会写代码，而是能不能说清楚要解决谁的什么问题。
    - id: d1l1-k3
      term: 先把工具准备好
      plain: 第一节只完成 TRAE 安装和七岗位提示词包下载，下一节再创建 AI 员工。
    memory_sentence: 先选你懂的问题，再把工具准备好；本节不写代码，能打开 TRAE、能看到七份提示词就完成。
    local_prep:
      codex_prompt: ''
      checklist:
      - 从课程资源进入 TRAE 国内版官方下载页
      - TRAE 已安装完成并能正常打开
      - 已完成登录，能看到 TRAE 的主界面
      - 七岗位提示词包已经下载并解压
      - 解压后的文件夹中能看到 01 至 07 共七份岗位提示词
  - id: c2
    title: 把七名 AI 员工招进开发工具
    minutes: 25
    form: 操作
    content_ref: class/bootcamp/day-01/section-02-requirement-to-prd/lesson.md
    content: '上一节你选好了问题，这一节开始组队。你的团队有七个岗位：项目经理负责排计划，产品经理负责把需求问清楚，页面设计师负责画出页面草图，页面工程师负责做出真正能操作的页面，数据工程师负责保存记录和执行规则，检查工程师负责找问题，运行维护工程师负责让别人也能把项目跑起来。


      创建这些 AI 员工，本质上是在给每个人一份岗位说明书：你是谁，负责什么，按什么标准交付，什么事情不能替学员决定。


      为什么不只建一个“全能助手”？因为不同岗位的判断标准不同。产品经理要把需求说清楚，检查工程师要专门挑毛病。如果同一个 AI 既做产出又给自己判满分，它很容易自我放过。


      每个岗位做完后只能说“请检查”，不能自己宣布通过。你必须查看真实文件、亲手操作，再明确批准下一个岗位开工。


      记住这句话：**AI 员工不是越多越好，而是各守一段标准；七个岗位，就是七道质量关。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: TRAE 手动操作 + 通用对话
      note: 本节交付：七岗位团队 + 团队协作卡
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 为什么不应该只创建一个“全能 AI 员工”包办所有岗位？
      - - 因为一个 AI 员工不能生成文件
        - 因为不同岗位的标准会互相妥协，产出者还会变成自己的裁判
        - 因为 AI 员工的名字必须不同
      - 1
      - 口播稿用“出纳不能兼任审计”说明了岗位隔离的必要性。
    knowledge_cards:
    - id: d1l2-k1
      term: 岗位职责决定能力
      plain: 创建 AI 员工的关键不是名字，而是写清它负责什么、按什么标准交付、什么情况必须拒绝。
    - id: d1l2-k2
      term: 岗位隔离标准
      plain: 产品负责把需求说清，测试负责挑毛病；标准冲突的岗位不能塞进一个“全能助手”。
    - id: d1l2-k3
      term: 产出者不能自批
      plain: AI 员工完成自检只能提交待检查，学员看到证据后才能明确批准。
    memory_sentence: 智能体不是越多越好，是各守一段标准；每个岗位都是一道质量关。
    local_prep:
      codex_prompt: '@项目经理 Agent 请带我认识刚组建的七个岗位。一次只讲一个岗位，用大白话问我“它接谁的工作、交付给谁、不能替我做什么”。我答错时请解释；最后整理成团队协作卡，等我检查。'
      checklist:
      - 七个 Agent 均能在 TRAE 中被 @ 到
      - 至少完整读过项目经理、产品经理和 UI/UX 三份岗位提示词
      - 团队协作卡写清七个岗位的输入、输出与边界
      - 能解释 REVIEW 和 APPROVED 的区别
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c3
    title: 先定五天计划，再让团队开工
    minutes: 20
    form: 实操
    content_ref: class/bootcamp/day-01/section-03-pm-prompt-anatomy/lesson.md
    content: '团队建好了，先别让所有人一起干。项目负责人最重要的能力，不是催得快，而是让大家知道这五天到底做什么、不做什么。


      这一节把选题交给项目经理，让它先问清楚，再写一份五天任务书。任务书要回答：为什么做，给谁用，五天每天交什么，哪些风险可能卡住，哪些想法这周明确不做。


      AI 很容易一兴奋就多做功能。你要把第一版范围锁住：一个管理看板、一个提交页面、一个列表页面、一个详情页面，加上能保存数据的后台。登录、复杂权限、手机端和花哨动画先不做。不是这些功能没价值，而是五天内先把最重要的完整流程做通。


      项目经理可以安排顺序、提醒风险，但不能顺手替其他岗位把活全做了。它提交计划后要停下来，等你检查和批准。


      记住这句话：**先定计划再开工，先做完整的小项目，不做失控的大项目。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@项目经理 Agent'
      note: 本节交付：项目任务书
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 项目经理为什么应该先交项目任务书，而不是直接开始写代码？
      - - 因为代码必须最后一天写
        - 因为要先让学员确认目标、第一版边界、每天交付和风险
        - 因为项目经理不会使用开发工具
      - 1
      - 口播稿反复强调“先出方案，你确认了，再让 AI 动手”。
    knowledge_cards:
    - id: d1l3-k1
      term: 先出方案再动手
      plain: 项目负责人先确认目标、范围和顺序，再允许岗位 AI 员工开始产出。
    - id: d1l3-k2
      term: 五天只做第一版
      plain: 把本周必须完成的主流程锁住，超出范围的想法进入待建设清单。
    - id: d1l3-k3
      term: 阶段感属于负责人
      plain: AI 恨不得一次做完，什么时候停、何时交接、能否继续必须由学员决定。
    memory_sentence: 先出方案再动手，阶段感属于项目负责人；边界锁得住，团队才不会越做越乱。
    local_prep:
      codex_prompt: '@项目经理 Agent 请从我的专业、工作或兴趣出发，带我选一个五天能完成的企业小项目。一次只问一个问题；选定后先整理选题确认单，再把五天目标、团队分工和不做的事问清楚，写成项目任务书。最后用大白话带我检查，等我批准。'
      checklist:
      - 项目经理一次只问一个问题，先完成选题确认单
      - 任务书包含五天里程碑和七岗位分工
      - 明确四页面、SQLite 和 Week2 AI 边界
      - 状态为 REVIEW，学员通读后才决定是否 APPROVED
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c4
    title: 把老板的一句话问成需求文档
    minutes: 35
    form: 实操
    content_ref: class/bootcamp/day-01/section-04-hands-on-mini-prd/lesson.md
    content: '现在你扮演老板，对产品经理说：“我想做一个费用管理系统。”如果它马上写出几十页方案，不一定是能力强，也可能是没问清楚就在猜。


      好的需求文档不是直接写出来的，而是一问一答问出来的。多少人使用？要记录哪些内容？谁负责处理？有哪些状态？最常见的错误是什么？这些答案会变成页面字段、处理规则和检查标准。


      一份合格的需求文档至少要说清：给谁用、解决什么场景、第一版做哪些功能、每个页面有哪些字段、怎样算通过、还有哪些事情尚未确认。


      特别注意“怎样算通过”。“页面要好用”“金额要合理”都无法检查。要改成任何人都能判断的说法，例如“金额必须大于零”“必填内容为空时不能提交”。


      你至少要否决或修改 AI 的一条建议。不是为了故意找茬，而是要留下你真正做过判断的证据。


      记住这句话：**需求是问出来的，不是猜出来的；含糊的话，最后都会变成明确的问题。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@产品经理 Agent'
      note: 本节交付：docs/PRD.md
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 产品经理收到“我要做一个费用报销系统”后，合格的第一步是什么？
      - - 直接写完整需求文档
        - 先提出关键问题，把业务范围和规则问清楚
        - 先选择页面配色
      - 1
      - 好的需求文档来自澄清对话，不来自 AI 对一句话需求的猜测。
    knowledge_cards:
    - id: d1l4-k1
      term: 需求文档是问出来的
      plain: 产品经理收到老板一句话后先澄清用户、流程、规则和痛点，而不是马上生成文档。
    - id: d1l4-k2
      term: 四项内容不能少
      plain: 需求文档至少要有字段清单、第一版范围、验收标准和待确认事项。
    - id: d1l4-k3
      term: 标准必须可判定
      plain: “合理”“好用”不是验收标准，每一条都要让第三方能用是或否判断。
    memory_sentence: 需求是问出来的，不是猜出来的；含糊的话，最后都会变成明确的问题。
    local_prep:
      codex_prompt: '@产品经理 Agent 请读已批准的项目任务书，带我把使用者、使用场景、四个页面和通过标准问清楚。一次只问一个问题；我确认后再写需求文档。写完告诉我“我的哪些回答变成了哪些需求”，带我检查并等我批准。'
      checklist:
      - 产品经理先提问，学员回答后才写 PRD
      - PRD 六部分齐全且字段与选题一致
      - P0 不超过四项并列出本期不做事项
      - 学员至少修改或否决一项并明确批准 PRD
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
  - id: c5
    title: 把需求变成能点击的页面草图
    minutes: 35
    form: 实操+验收
    content_ref: class/bootcamp/day-01/section-05-accept/lesson.md
    content: '需求文档全是文字，这一节要把文字变成看得见、能点击的页面草图。行业里通常把这种用于确认结构和操作流程的页面叫“交互原型”。你只需要认识这个叫法，不需要学习设计软件。


      把已批准的需求文档交给页面设计师，让它做出四个页面：管理看板、提交页、列表页和详情页。字段必须和需求文档一致，不能自己增加功能。


      详情页要提前给第二周的 AI 能力留一块位置，文字写清“AI 分析区｜第二周接入”。如果放一段样例，只能标“演示数据”，不能写成 AI 已经分析。先让学员看懂能力现在处于什么状态，再考虑放什么按钮。


      验收页面草图不能只看漂不漂亮，要亲手点：空着提交会不会提醒，正常提交后列表会不会多一条，点列表能不能进入详情，没有数据时有没有清楚提示。


      记住这句话：**要求说意图，岗位守标准，验收靠动手；页面草图不是用来看的，是用来点的。**'
    practice: '完成标志：

      [ ] 学员亲自检查完上方清单并保留真实证据

      [ ] 至少能指出一个判断依据，而不是只复述 Agent 的总结

      [ ] 交付先停在 REVIEW，只有学员明确回复 APPROVED 才进入下一步'
    resource_ids:
    - team-prompts-v11
    - week1-day1-source
    - domain-packs
    tools:
    - name: '@UI/UX 设计师 Agent'
      note: 本节交付：四页可点击原型 + 第一次岗位交接
    - name: REVIEW → APPROVED 状态卡
      note: 岗位自检不等于学员批准
    quiz:
    - - 页面草图看起来很漂亮，是否就可以批准交付？
      - - 可以，视觉效果就是原型的全部标准
        - 不可以，还要亲手验证字段、校验、主流程和空态
        - 可以，只要 AI 说已经自检
      - 1
      - 口播稿明确指出，可交互原型的验收方式是用鼠标走一遍真实流程。
    knowledge_cards:
    - id: d1l5-k1
      term: 指令只说意图
      plain: 学员告诉页面设计师要读取需求文档并产出页面草图，具体标准由岗位职责和已批准需求提供。
    - id: d1l5-k2
      term: 原型必须可操作
      plain: 验收时要亲手提交空表单、增加数据、检查空态，不能只看页面是否漂亮。
    - id: d1l5-k3
      term: 先标识能力状态
      plain: AI 区先写“Week2 接入”和“演示数据”，再设计按钮，不能把未来能力伪装成已经完成。
    memory_sentence: 指令说意图，岗位管标准，验收靠动手；原型不是用来看的，是用来点的。
    local_prep:
      codex_prompt: '@UI/UX 设计师 Agent 请读已批准的需求，把驾驶舱、提交、列表、详情做成能打开、能点击的页面样稿。请一页一页完成并带我点击检查。AI 区要先写“第二周接入”和“演示数据”，再画按钮。最后自检并等我批准。'
      checklist:
      - 四页均可从 index.html 打开并互相跳转
      - 提交后能在原型列表中看到记录，用于验证流程
      - 字段、状态与 PRD 一致
      - AI 区的 Week2 和演示数据标识清楚
      - 至少完成一轮具体纠偏后再批准
      suggested_questions:
      - '@〈责任岗位〉 我没有批准当前交付。具体问题是：〈哪里不对〉；请改成：〈可判断的目标〉。

        修改后请重新执行〈验证动作〉，列出实际文件与证据，并以 REVIEW 状态交付。不要继续下一岗位。'
quiz:
  pass_rate: 0.67
  questions:
  - q: 第一节实操做到哪一步算完成？
    options:
    - 写出需求文档
    - TRAE 能正常打开，七份岗位提示词已下载并解压
    - 做出完整项目
    answer: 1
    explain: 第一节只负责准备工具，下一节才开始创建 AI 员工。
  - q: 驾驶舱只有漂亮图表为什么不算完整系统？
    options:
    - 没有手机端
    - 图表背后还缺业务数据的产生、存储和统计链路
    - 没有动画
    answer: 1
    explain: 驾驶舱是前端结果，必须能追到真实业务数据。
  - q: Agent 完成岗位任务并自检后应该处于什么状态？
    options:
    - RELEASED
    - REVIEW
    - APPROVED
    answer: 1
    explain: 岗位只能提交 REVIEW，批准必须由学员明确给出。
  - q: 为什么不让一个 Agent 自动把全部岗位做完？
    options:
    - 因为模型不会写代码
    - 因为学员会失去交接、判断和验收过程
    - 因为文件数量会变少
    answer: 1
    explain: 课程目标是看懂研发逻辑，而不是只看到最终产物。
  - q: 项目经理最先要控制的是什么？
    options:
    - 按钮颜色
    - 范围、里程碑和风险
    - 数据库语法
    answer: 1
    explain: 项目经理确保团队在同一范围和节奏内交付。
  - q: 项目经理为什么不能顺手写完 PRD？
    options:
    - 他不会写
    - 岗位边界和验收责任会被打乱
    - PRD 不重要
    answer: 1
    explain: 每个岗位只交付自己的成果，下一岗位由学员亲自发起。
