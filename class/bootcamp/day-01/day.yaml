      plain: 你真正理解其规则、数据和工作流程的行业或职能，例如财务、HR、运营。
    - id: gt-visual-system
      term: 可视化系统
      plain: 把业务数据和流程放到页面上，让使用者能看、能操作、能判断。
    quiz:
    - - 软件开发小白在 AI 项目中最重要的起点是什么？
      - - 先背会编程语法
        - 选择自己真正熟悉的专业问题
        - 先购买最贵的模型
      - 1
      - AI 可以补技术执行，但无法替学员提供真实领域判断；从熟悉的问题出发最容易做出可验收项目。
    - - Day 1 为什么只要求先做可点击原型？
      - - 因为原型不需要需求
        - 为了先验证需求与交互，再逐步接入技术和数据
        - 因为后端永远不重要
      - 1
      - 原型让小白快速看到成果并验证方向，后续再由前端、后端、测试和运维逐步把它变成真实系统。
