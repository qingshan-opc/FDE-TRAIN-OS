  - id: c6
    title: 后端技术图：数据库分类、权限与语言框架地图
    minutes: 25
    form: 概念
    content_ref: class/bootcamp/day-06/section-06-backend-tech/lesson.md
    content: '同学们，这节课呢，咱们讲后端——就是用户看不见的那个后厨。前端是摸得到的界面嘛；后端呢，数据要有住所，业务要用语言写出来。第四天 讲过，后端就三件事：业务逻辑、数据、接口。浏览器里看不见它，但每道菜都从那儿出来，对吧。

      那数据库是啥呢？首先它是一种存储媒介。做系统的时候，Excel 那种结构化数据，不能永远散落在本地文件里嘛——得有个固定住所，这个住所就是数据库。不同类型的数据，住不同的房：关系型像 PostgreSQL、MySQL；要极快的临时快取用
      Redis；按关键词搜文档用 Elasticsearch；海量报表用 ClickHouse。一句话记住：企业遇到什么形态的数据，就给它配什么住所。

      常规业务主库，最常听到两个。MySQL——用得最广的老牌，接老系统、团队全是 MySQL 老手的时候稳。PostgreSQL——功能全、扩展强，语法跟 MySQL 大体能兼容；二零二六新项目呢，我更常默认它，还有向量插件，做 AI
      相似推荐很顺手。还有个 SQLite——一个文件就是一个库，原型、小工具起步神器，人一多再迁 PostgreSQL。

      程序怎么跟库说话呢？靠 SQL 家族。名字别被吓到啊。DDL 是建表、改表结构——房子怎么隔间；DQL 是查询——把符合条件的数据捞出来；还有 DML，增删改——往房子里放、拿、改东西。别的库不一定叫 SQL，但往往会有自己的 API——本质一样：约定好怎么存、怎么取。

      再讲编程语言，四条路。Java——以前框架名词一堆，现在记住 Spring Boot 就行；大企业核心系统仍是它的主场，规矩全、能扛大场面。Python——AI 的母语，大模型工具链都在这；做 AI 用 FastAPI，开发快，还能自动出
      OpenAPI。Node.js——前后端一门语言，小团队、全栈很香。Go——偏基础设施，快、省内存；更底层还有 Rust。听地图就行，选型看场景，对吧。

      作业里写你自己的选型：语言 + 框架 + 主库，各用一句话说明为什么。必须引用 PRD 或 API 契约里的约束——不许抄课件里的建议选 X。课上只认地图：Python 有 Django、Flask、FastAPI；Java 有 Spring
      Boot；Go 有 Gin、Echo；Rust 有 Actix、Axum。数据库按分类认：关系型、文档、缓存、搜索、分析——具体哪一家，你自己交理由，对吧。

      最后接上 第四天：先把接口契约 API_Spec.md 写清楚——路径、参数、返回、错误码。这份契约用 Java 实现也行，用 Python 实现也行，前端不在乎。契约是合同，语言只是施工队——先签合同，施工队可以后挑，对吧。

      好，带走两句话：数据按场景选住所；代码按场景选语言——先把合同签清楚，施工队可以后挑。本节小课就到这儿，对吧。'
    practice: '**「给三个场景选后端」**：为下面三个场景各选一条后端路线（语言 + 框架 + 数据库），并用一两句话说清理由：

      1. 你要给部门做一个「周报自动汇总 + AI 摘要」的内部小工具，两周内要跑起来；

      2. 一家银行要重做核心交易系统，团队 200 人，系统要维护十年；

      3. 三个人创业做内容社区，要先出个能发帖能注册的版本验证市场。


      完成标志：

      [ ] 四大路线各能说一句画像（谁在用、为什么）

      [ ] 三个场景的选择都含语言 + 框架 + 数据库三件套，且理由说得出口

      [ ] 能解释为什么 API_Spec.md 可以在没定语言之前就写好'
    resource_ids:
    - dg-be-map
    - h5-tech
    tools:
    - name: 契约先行便签
      note: 契约是合同，语言只是施工队
    quiz:
    - - 后端三件事是？
      - - 页面、样式、动画
        - 业务逻辑、数据、接口
        - 服务器、域名、备案
      - 1
      - 规则（逻辑）、存取（数据）、对话（接口）——后厨的三样活。
    - - 做「周报汇总 + AI 摘要」小工具，两周要跑起来，首选路线是？
      - - Java + Spring Boot
        - Python + FastAPI
        - Go + Gin
      - 1
      - AI 项目首选 Python——模型生态在这，FastAPI 起手最快。
    - - FastAPI 和你的 API_Spec.md「天生一对」是因为？
      - - 它能自动生成 OpenAPI 接口文档
        - 它速度最快
        - 它是 Java 写的
      - 0
      - 给它函数就出 OpenAPI——契约先行的理念在工具里内置了。
    - - 「契约是合同，语言只是施工队」意味着？
      - - 先定语言再写接口
        - 接口契约（路径/参数/响应）可以先定，实现语言后面再挑
        - 合同签完就不能换语言
      - 1
      - API_Spec.md 用 Java 或 Python 实现都行——前端不在乎。
    - - 三种场景各选什么库？①两周的原型 ②千万用户的订单系统 ③要存商品向量做相似推荐
      - - 全用 MySQL
        - ①SQLite ②PostgreSQL/MySQL 集群 ③PostgreSQL（向量插件）
        - 全用 SQLite
      - 1
      - 原型求快、生产求稳、AI 求向量——场景决定数据库，不是名气。
    - - 200 人团队、要维护十年的银行核心系统，最合理的技术路线是？
      - - Python + Flask
        - Java + Spring Boot
        - Node + Express
      - 1
      - 大企业长期系统：规矩全、能扛大场面、十年后来的人也接得住。
    - - 「两周内给部门上线周报工具，几乎没并发」，数据库最合理的选择是？
      - - Oracle 集群
        - SQLite 起步，长大再迁 PostgreSQL
        - MongoDB 分片
      - 1
      - 一个文件就是一个库——先跑起来；契约清晰时迁库不难。
    media:
    - kind: video
      title: 口播课件 · 后端技术地图
      object_key: documents/shared/course-media/day05-c5-backend.mp4
      poster_key: documents/shared/course-media/day05-c5-backend-poster.jpg
      duration_sec: 223
    knowledge_cards:
    - id: be-three
      term: 后端三件事
      plain: 接请求、算逻辑、读写数据——页面背后那一套。
      tag: 核心
    - id: db-home
      term: 数据库是住所
      plain: 给数据一个能长期住、能按规则查的地方，不是「另一个 Excel」。
      tag: 基础
    - id: mysql-pg
      term: MySQL / PostgreSQL
      plain: 两款主流关系库；起步也可用 SQLite。选型看生态与约束，不是宗教。
      tag: 选型
    - id: ddl-dql
      term: DDL / DQL
      plain: DDL 建表改结构；DQL 查询数据——你 Day 4 动手过。
      tag: 术语
    - id: be-four
      term: 四大语言路线
      plain: Java / Python / Node / Go——语言选边，框架是招牌。
      tag: 地图
    - id: contract-first
      term: 契约先行
      plain: 先定 API 长什么样，再选语言框架——接口比品牌重要。
      tag: 原则
    glossary_terms:
    - id: gt-backend
      term: 后端
      plain: 用户看不见、但负责业务规则与数据持久化的服务端。
    - id: gt-api
      term: API
      plain: 前后端约定好的「取数/办事」接口。
    - id: gt-sql
      term: SQL
      plain: 跟关系库说话的语言：建表、查、改、删。
    - id: gt-redis
      term: Redis
      plain: 内存型加速层，常作缓存，不是主业务库的替代品。
    - id: gt-orm
      term: ORM
      plain: 用对象代码映射表结构，少手写部分 SQL——要懂底层，别只会魔法。
