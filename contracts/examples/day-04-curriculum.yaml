  estimated_minutes: 105
  require_capsules: true
  capsules:
  - id: c1
    title: 后端干什么：业务逻辑、数据与接口
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-04/section-01-backend-role/lesson.md
    content: '【开场抛问】同学们，昨天的页面很好看——但问你一句：点上面的按钮，会发生什么？什么都不发生。因为「脸做好了，心脏还没装」。今天装心脏。


      【类比】去餐厅吃饭，你进过后厨吗？没有。你坐在大堂看菜单、喊服务员——大堂是前端，后厨是后端，菜单和服务员是他们之间唯一的对话通道。


      【三件事】后厨干什么？三件。第一，「规则」——这道菜几分熟、那份汤加不加辣，规矩定在后厨；第二，「存取」——食材在仓库里码放整齐，随用随取；第三，「对话」——照菜单接单、出菜。


      【术语人话】这三件事换成行话：规则叫「业务逻辑」，存取交给「数据库」，对话的通道叫「接口」，英文 API——人话就是「前后端之间的菜单」。


      【重点加高】听好这个转变——AI 时代，后端里「写增删改查」这种体力活已经不值钱。值钱的是——「把菜单写清楚」。


      【带走的话】记住——今天你交付的不是代码，是两张图纸：一张菜单，一张仓库货架图。'
    practice: 完成标志：三个情景归类正确，理由说到点子上；能说清「规则住在后端」的原因（页面在用户手里，可被绕过）；知识确认两题均有书面答案。
    resource_ids:
    - tk-readme
    tools:
    - name: 后端三件事口诀卡
      note: 业务逻辑 · 数据 · 接口
    - name: 餐厅后厨类比卡
      note: 顾客不进后厨，只凭菜单交流
    quiz:
    - - 「连续两周未交周报的同事标红」这条规则，最应该住在哪里？
      - - 前端页面 index.html 里
        - 后端的业务逻辑里
        - 数据库的索引里
      - 1
      - 规则要住在用户够不着的后厨——页面在用户手里，能被改、被绕过。
    - - AI 时代，后端这个角色最升值的能力是什么？
      - - 手写增删改查（CRUD）的速度
        - 定义接口契约与数据模型
        - 背熟某个框架的全部 API
      - 1
      - CRUD 是体力活，AI 写得比人快；人的价值上移到把菜单和货架图画清楚。
  - id: c2
    title: API 设计：餐厅点菜模型与 OpenAPI
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-04/section-02-api-design/lesson.md
    content: '【开场抛问】同学们，前后端隔着一堵墙，唯一的对话通道是 API。那——一份合格的 API 设计，要回答哪几个问题？


      【类比】还回餐厅。一份合格的菜单回答三个问题：菜叫什么名字？能不能提要求——少辣、不要香菜？上错菜了怎么办？


      【三要素】API 一模一样。菜名就是「路径」——比如 `GET /reports`，斜杠后面是你想要的东西。做法要求就是「请求参数」——哪一周、哪个部门。上错菜怎么办，就是「错误码」。


      【错误码】记住三个数：「400」——你单子填错了，锅在你；「404」——你要的东西后厨没有；「500」——后厨自己着火了，锅在餐厅。只设计成功、不设计失败的菜单，是半成品。


      【REST】行业里管这套风格叫 REST——人话一句：「URL 表示东西，动词表示动作」。东西是 `/reports`，动作是拿来、新交、改、删——GET、POST、PUT、DELETE。


      【OpenAPI】最后，把菜单写成机器也读得懂的格式，叫「OpenAPI」——前后端拿它签合同，谁违约一目了然。


      【带走的话】记住——设计接口，先想「上错菜怎么办」，再想「上什么菜」。'
    practice: 完成标志：菜单卡片五格全部填满，路径为 REST 风格；至少设计了两个不同含义的错误响应；能答出自查第 2 问（400，因为请求内容不合法，锅在调用方）。
    resource_ids:
    - tk-readme
    tools:
    - name: REST 点菜模型卡
      note: URL 表东西，动词表动作
    - name: 错误码速查
      note: 400 你的锅 · 404 没有 · 500 我的锅
    quiz:
    - - GET /reports?week=2026-W30 这条接口设计，体现了 REST 的哪条原则？
      - - URL 里包含具体动作
        - URL 表示东西、HTTP 方法表示动作
        - 查询参数决定用哪个方法
      - 1
      - REST 一句话：URL 表示东西（/reports），动词表示动作（GET 拿来、POST 新交）。
    - - 同事提交了一份空白周报，后端最合理的响应是？
      - - 200 OK，存下来再说
        - 400 Bad Request，请求内容不合法
        - 500 Internal Server Error，后厨着火
      - 1
      - 空白内容是调用方单子填错了——400 的锅在点菜的人；500 是后厨自己的问题。
  - id: c3
    title: 数据库设计：表、关系与索引
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-04/section-03-database-design/lesson.md
    content: '【开场抛问】同学们，100 个同事的周报交上来——你打算怎么存？一个巨大的 Excel？今天告诉你，数据库其实你也早就认识。


      【类比】一张表，就是一张 Excel 的 Sheet；一行，是一条记录；一列，是一个字段。数据库就是「给程序用的 Excel」——人看的那套你会，程序看的只是更讲规矩。


      【主键】第一条规矩：每行必须有一张「身份证」——行话叫「主键」。两个同事可以都叫张伟，但工号绝不能撞号。身份证唯一、不发空、发出去不回收。


      【关系】第二条：表和表怎么连？一个部门有很多员工——这叫「一对多」。做法是在多的那侧挂一张「行李牌」，写着它属于哪个货架——行话叫「外键」。周报表里记一列「谁的 id」，谁交的一查便知。


      【索引】第三条：索引是「书的目录」。有目录，查得快；但每进一本新书，目录也得跟着改——所以「查得快，写得慢」，不是越多越好，只加在天天被翻的那几页。


      【落回项目】你的周报助手，三张表就够开张：users 管人、reports 管周报、metrics 管汇总数字。


      【带走的话】记住——设计数据库，就是给数据分货架、发身份证、编目录。'
    practice: 完成标志：reports、metrics 两张货架卡填满，reports 有外键列；全库至少给出一个索引建议并说明理由；三问均有书面答案。
    tools:
    - name: 表 / 主键 / 索引三概念卡
      note: Excel · 身份证 · 书的目录
    - name: 「查得快写得慢」便签
      note: 索引不是越多越好
    quiz:
    - - reports 表里的 user_id 列（指向 users 表主键），它的身份是？
      - - 主键
        - 外键
        - 索引
      - 1
      - 外键是行李牌——写着这条记录属于另一张表的哪一行，谁交的周报表一查便知。
    - - 给数据库每一列都加上索引，会发生什么？
      - - 查询全面变快，没有代价
        - 查询变快，但写入越来越慢
        - 数据自动备份
      - 1
      - 索引是书的目录——每进一本新书目录都要更新，查得快、写得慢，不是越多越好。
  - id: c4
    title: 实战：用后端提示词生成 API 与数据库设计
    minutes: 35
    form: 实战
    content_ref: class/bootcamp/day-04/section-04-hands-on-api-db/lesson.md
    content: '【开场抛问】同学们，工具齐了——PRD、架构图、页面都在你手里。现在直接跟 AI 说「给我设计后端」，会发生什么？——一份漂亮但不对题的模板货。


      【解剖】先看后端提示词两处硬规定。第一处：API 文档「强制」用 OpenAPI 格式——因为它的读者不只是你，前端、测试都拿它签合同。第二处：数据库设计必须带「索引建议」——目录编在哪，AI 提建议，你拍板。


      【流程】正确节奏四步。第一，「喂上下文」——PRD、架构、页面一起给它。第二，「让它先问」——动笔前先问你三个澄清问题：核心数据是什么、谁来调接口、数据量多大。第三，「先清单后展开」——先要接口一行清单，你点头再逐个写全。第四——「表随接口走」。


      【重点加高】第四步最关键。每展开一个接口就问：它读写哪张表？「对不上的」，不是接口多了，就是表少了。


      【带走的话】记住——好设计不是一次生成的，是「问出来」的。你先当产品经理，AI 才是后端。'
    practice: 完成标志：`API_Spec.md` 落盘，含 3–5 个接口且四要素齐全；`DB_Schema.md` 落盘，含 2–3 张表，主键、索引建议齐备；随机指一个接口，你能说出它读写哪张表的哪几列。
    resource_ids:
    - tk-backend
    tools:
    - name: 接口-表对照检查单
      note: 每个接口的数据都能在某张表里找到
    quiz:
    - - Backend_Engineer_Agent_Prompt 对 API 定义文档的强制要求是什么格式？
      - - 自由排版的 Markdown 表格
        - OpenAPI 3.0（YAML 或 JSON）
        - Word 文档截图
      - 1
      - OpenAPI 是机器也能读的菜单——前端、后端、测试签的是同一份合同。
    - - 让 AI 生成后端设计，最稳的第一步是？
      - - 直接说「给我完整后端设计」
        - 喂入 PRD 与架构文档，并让它先问澄清问题
        - 先要代码，文档以后补
      - 1
      - 直接要成品只能得到模板货；先喂上下文、先让它问，产出才对得上你的项目。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '你是资深后端工程师。这是我的项目背景：产品「部门周报助手」，下面附上我的 PRD.md 与 architecture.md（页面原型 index.html 已完成，数据目前写死）。


        请严格按以下流程工作，不要一步到位：

        1. 动笔前，先问我 3 个澄清问题：核心数据实体有哪些、谁会调用这些接口、数据量级多大；

        2. 我回答后，先只输出 3–5 个 REST 接口的一行清单（路径 + 方法 + 一句话用途），等我确认；

        3. 确认后逐个展开为 API_Spec.md：每个接口必须包含路径、HTTP 方法、请求参数（类型/是否必填）、成功响应（状态码 + 响应体结构）、至少一个错误响应（400/404/500 任选并写明触发场景）；

        4. 然后输出 DB_Schema.md：2–3 张表，每张表列出列名、类型、约束（主键/外键/非空），每张表必须有主键，全库至少给出一条索引建议并写明理由；

        5. 最后逐个接口标注它读写哪张表的哪几列——对不上的，修正设计直到一一对应。


        两份文件都保存到当前工作区根目录。

        '
      checklist:
      - 先拿到 AI 的 3 个澄清问题并逐条回答，再进入生成
      - 接口清单确认无误后才让 AI 逐个展开
      - 每个接口四要素齐全：路径、方法、成功响应、错误响应
      - 每张表有主键，全库至少一条索引建议且能复述理由
      - API_Spec.md 与 DB_Schema.md 均已落盘且互相能对上
      suggested_questions:
      - 每个接口的错误响应分别设计在什么场景？能不能都只用 500？
      - reports 表查询最多的场景是按人查还是按周查？索引该怎么加？
      - 接口清单里有没有我页面根本用不到的？删掉它们的设计依据是什么？
      template_resource_id: tk-backend
  - id: c5
    title: 验收：快测 + 接口设计过闸
    minutes: 15
    form: 验收
    content_ref: class/bootcamp/day-04/section-05-accept/lesson.md
    content: '【开场】同学们，验收时间。四天前你只有一个点子；今天收工时，你手里有方向、有骨架、有脸——还有一颗心脏的图纸。


      【快测】先过 6 道题。考的不是背名词——是「400 和 500 谁的锅」「索引为什么不能乱加」这种判断。答错不怕，解析会把你指回对应那一节。


      【过闸】然后三样东西摆上台面。第一，每个接口——「路径、方法、成功响应、错误响应」，四样缺一样打回。第二，每张表有「主键」，全库至少一条「索引建议」。第三，我会随手抽一个接口问你——它读写哪张表？


      【重点加高】第三样最要命。菜单上的每道菜，后厨仓库里必须找得到食材——「对不上，就是设计漏了洞」。


      【打回预案】被打回别慌，高频就两种：接口全写了 200、没有错误响应——回第 2 节；reports 表没有外键、「谁交的」查不出——回第 3 节。


      【带走的话】记住——今天起，你看得懂任何一家餐厅：大堂是前端，后厨是后端，菜单是契约，仓库是数据。明天，我们把这四天的体感，升级成一张完整的理论地图。'
    practice: 完成标志：快测 ≥4/6；自查清单四项全勾；lab 闸机通过（GATE 4 盖章），四份交付物——PRD.md、architecture.md、index.html、API_Spec.md + DB_Schema.md——全部在仓。
    resource_ids:
    - tk-backend
    tools:
    - name: 接口设计过闸清单
      note: 路径+方法+错误响应 · 表有主键 · 接口与表对得上
    - name: 快测范围卡
      note: 考点全部来自今天前五节
    quiz:
    - - 过闸标准里「接口与表能对上」指的是什么？
      - - 接口数量必须等于表的数量
        - 每个接口读写的数据，都能在某张表里找到出处
        - 表名必须与接口路径同名
      - 1
      - 菜单上的每道菜，仓库里必须找得到食材——对不上就是设计漏了洞。
    - - 一份 API 设计只写了成功响应 200，没有任何错误响应，正确的处理是？
      - - 可以通过，出错的情况以后再说
        - 打回——错误响应是契约的一部分
        - 把 200 改成 201 就算完整
      - 1
      - 只设计成功的菜单是半成品；400/404/500 是给排查问题的人留的路标。
quiz:
  pass_rate: 0.67
  questions:
  - q: 后端的三件事，正确的一组是？
    options:
    - 业务逻辑、数据存取、接口对话
    - 页面、样式、动画
    - 模型、算力、语料
    answer: 0
    explain: 规则、存取、对话——后厨的三件事；页面是前端，模型是另一层。
  - q: AI 时代后端工作中，最值得人来做的部分是？
    options:
    - 快速手写增删改查代码
    - 定义接口契约与数据模型
    - 背诵框架源码
    answer: 1
    explain: 体力活在贬值，把菜单和货架图画清楚的判断力在升值。
  - q: 前端请求「查看第 99 周的报表」，而数据里根本没有这一周，最合适的响应码是？
    options:
    - '400'
    - '404'
    - '500'
    answer: 1
    explain: 要的东西后厨没有——404 表示资源不存在；400 是单子填错，500 是后厨自己着火。
  - q: 主键（Primary Key）的作用是？
    options:
    - 让每一行记录有唯一身份
    - 让表能存更多数据
    - 自动备份该行数据
    answer: 0
    explain: 主键是每行的身份证——唯一、不为空、发了不回收；两个张伟可以同名，工号不能同号。
  - q: 关于索引（Index），正确的说法是？
    options:
    - 加得越多整体性能越好
    - 查询变快但写入变慢，只加在常被查询的列上
    - 只能加在主键列上
    answer: 1
    explain: 索引是书的目录：查得快、写得慢，每加一本新书目录都要跟着更新。
  - q: 后端提示词强制要求 API 文档用 OpenAPI 格式，根本原因是？
    options:
    - YAML 比 Markdown 好看
    - 前端、后端、测试能以同一份机器可读的合同协作
    - OpenAPI 文档运行速度更快
    answer: 1
    explain: 三方签同一份合同，谁违约一目了然——格式只是手段，协作才是目的。
