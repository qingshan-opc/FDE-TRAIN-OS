  capsules:
  - id: c1
    title: AI 时代的产品经理：从写文档到定方向
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-01/section-01-pm-in-ai-era/lesson.md
    content: '【开场】同学们，先抛一个问题——AI 三分钟能写一份 PRD，那产品经理是不是该失业了？这节就回答它。


      【「写」在贬值】AI 出现之前，PM 一半的身价在「写」：写文档、写需求、写汇报。现在——「写」的成本趋近于零。零，就是贬值到免费。


      【什么在升值】但 PM 没失业，他只是挪到了另一把椅子上。「定方向」——决定做什么、不做什么；「做验收」——判断交付的东西算不算数。


      这两件事 AI 替代不了。因为要人来「负责」。


      【一个类比】想象一家餐厅。AI 是后厨的万能厨子，什么菜都会做，出菜飞快。


      你不再是厨子——你是坐在前厅「点菜并验收的人」：点什么菜、什么标准算合格。厨子越快，点菜的人越关键。


      【今天的你】所以今天你们不学写文档。学的是指挥 AI 当厨子——把点子变成可执行的需求，再用验收标准卡住质量。


      【带走的话】AI 时代，「会写」不再是本事，「会定方向、会验收」才是。'
    practice: 完成标志：能口头说出「写贬值、定方向+做验收升值」，并给出一个自己工作中的例子；清单含 3 件贬值型 + 1 件升值型任务，且每件都标了 AI 可替代程度。
    resource_ids:
    - tk-readme
    tools:
    - name: FDE 角色认知卡
      note: 一句话：定方向 + 做验收，就是你十天后的人设
    - name: 浪潮价目便签
      note: 六波浪潮各一句「谁变贵/谁变便宜」，复述用
    quiz:
    - - AI 时代，产品经理的哪部分工作正在贬值？
      - - 写 PRD、写纪要等产出型工作
        - 定方向
        - 做验收
      - 0
      - 「写」的成本被 AI 压到趋近于零，贬值的是产出型工作；定方向和做验收反而升值。
    - - 餐厅类比中，AI 时代的 PM 更像哪个角色？
      - - 后厨的万能厨子
        - 坐在前厅点菜并验收的人
        - 餐厅的装修工人
      - 1
      - AI 是万能厨子，PM 挪到了「点菜并验收」的位置——厨子越快，点菜的人越关键。
  - id: c2
    title: 从点子到 PRD：可执行的需求长什么样
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-01/section-02-requirement-to-prd/lesson.md
    content: '【开场】同学们，「帮我做个周报工具」——这句话能不能直接丢给工程师开工？不能。这节就把它变成能开工的东西。


      【点子 vs 需求】「做个周报工具」是点子。听着都对，干着全错——数据从哪来？给谁看？多长？全是窟窿。


      可执行的需求，是工程师看完「不用回来问你第二遍」的那种。


      【PRD 最小骨架】翻译工具就是 PRD——产品需求文档，人话叫「开工说明书」。它不用长，但要有「最小骨架」，四根骨头：


      产品概述——这是什么；目标用户与平台——给谁用、在哪用；用户故事——拿它做什么；验收标准——做到什么程度算合格。


      【用户故事】用户故事有固定句式：「作为……我想要……以便……」。


      作为部门负责人，我想要一键汇总本周数据，以便周一例会前拿到周报。三格——人、动作、价值，全锁死。


      【验收标准】验收标准只有一条铁律：「可衡量」。「周报要好用」是废话；「两分钟出稿、数据零遗漏」才是标准——能测，才算数。


      【带走的话】点子值零分，能验收的需求才开工。'
    practice: 完成标志：用户故事三格齐全（谁/做什么/价值），无空格；至少 2 条验收标准，每条都有数字或可数判据，第三方能客观判过/不过；同桌互检一次通过（或按反馈改过一轮）。
    resource_ids:
    - prd-cheatsheet
    tools:
    - name: 用户故事句式卡
      note: 作为…我想要…以便…，三格缺一不可
    quiz:
    - - 「帮我做个周报工具」不能直接开工，最根本的原因是？
      - - 它是模糊点子，工程师看完必须回来追问才能动手
        - 这个点子不够创新
        - 没有指定用哪个 AI 模型来实现
      - 0
      - 可执行需求的判据是「看完不用回来问第二遍」；模糊点子全是窟窿，必须翻译成 PRD。
    - - 以下哪条是合格的验收标准？
      - - 周报要好用，界面要美观
        - 生成一份周报不超过 2 分钟，且本周已提交数据零遗漏
        - 周报要让领导满意
      - 1
      - 验收标准的铁律是可衡量——有数字或可数判据，第三方能客观判过/不过。
  - id: c3
    title: 解剖 PM Agent 提示词：四要素 + 两接口
    minutes: 20
    form: 概念
    content_ref: class/bootcamp/day-01/section-03-pm-prompt-anatomy/lesson.md
    content: '【开场】同学们，工具包里那份 PM 提示词，你下载了——但你真「读」过吗？这节不动手，就把它像 X 光片一样读一遍。


      【为什么先学读】写提示词之前，先得会读。就像学开车先看懂仪表盘——「会读」比「会写」更基础。读懂别人的，才写得出自己的。


      【四要素】整份提示词摊开，其实是四块。


      「角色定位」——它是谁：十年经验的产品经理。这句决定回答的专业水位。


      「核心任务」——它干什么：把模糊想法变成可执行的文档。这句是职责边界。


      「关键输入」——它从哪读需求：你直接输入的点子。「关键输出」——它交付什么：PRD、路线图，存到哪都写明了。


      【两接口】最后看「协作说明」——这是两个接口：输入口接着你，输出口接着下游的设计师和工程师。提示词不孤立，它在流水线上有上下游。


      【藏起来的细节】还有个关键设计：它「首先通过提问深入理解」——不直接开写，先反问你。这是好提示词的标志，下节你会亲身体会。


      【带走的话】提示词读法就一句：四要素定能力，两接口定协作。'
    practice: 完成标志：原文中四要素 + 两接口全部被标出，无遗漏（共 6 处）；文末的问题有 2–3 句自己的回答，且答到「不澄清直接开写 → 产出靠猜、不可验收」这个点上。
    resource_ids:
    - tk-pm
    tools:
    - name: 提示词解剖四格表
      note: 角色定位 / 核心任务 / 关键输入 / 关键输出
      url: /course-assets/resources/prompt-toolkit/README.md
    quiz:
    - - 提示词中「角色定位：10 年以上经验的资深产品经理」这句的主要作用是？
      - - 决定 AI 回答的专业水位
        - 决定输出文件保存到哪个路径
        - 决定使用哪家公司的模型
      - 0
      - 角色定位设定功力与视角，直接影响回答的专业深度——改成「实习生」产出立刻变水。
    - - 提示词的「两接口」指的是？
      - - 它从哪里读需求（Input Sources）和交付给谁（Output Targets）
        - 前端接口和后端接口
        - 两个不同的 AI 工具
      - 0
      - 两接口定协作：输入口接上游的点子，输出口接下游的设计师与工程师——提示词在流水线上不孤立。
  - id: c4
    title: 实战：用 PM 提示词跑出你的第一份迷你 PRD
    minutes: 30
    form: 实战
    content_ref: class/bootcamp/day-01/section-04-hands-on-mini-prd/lesson.md
    content: '【开场】同学们，前 55 分钟全是铺垫——现在开始，你亲手跑出人生第一份迷你 PRD。


      【三步走】流程只有三步。第一步，打开你的 AI 工具，把 PM 提示词「整份」粘进去——一个字都别改。第二步，输入点子：「我想做一个部门周报助手，帮部门负责人自动汇总一周数据、生成周报」。第三步——什么都别做，等它反问你。


      【先澄清再动笔】它一定会先问：数据从哪来？几个人用？发到哪里？


      「认真回答」这三个问题。你的每个答案都是约束——约束越清楚，产出越能直接用。糊弄它的答案，就是糊弄你自己的 PRD。


      【卡住验收】生成完别收工。拿「三样东西」检查：有没有用户故事？有没有可衡量的验收标准？有没有目标平台？


      缺一样——不要手改文档。回头「改约束重生成」。产出不对改约束，不改产物——这是迭代口诀。


      【带走的话】今天的作业不是一份文档，是一条流程：提问澄清 → 生成 → 验收 → 改约束重来。'
    practice: 完成标志：工作区存在 `PRD.md`，含「用户故事」「验收标准」两节；≥3 条用户故事全部为「作为……我想要……以便……」完整句式；每条故事有可衡量验收标准（含数字或可数判据），且文档写明目标平台；至少经历过一轮「检查
      → 补约束 → 重生成」的迭代（在对话记录中可溯源）。
    resource_ids:
    - tk-pm
    tools:
    - name: 「部门周报助手」点子卡
      note: 也可换成你自己的产品点子
    quiz:
    - - 把点子输入 PM 提示词后，符合预期的第一步行为是？
      - - 先反问你几个澄清问题
        - 直接生成一份三千字 PRD
        - 拒绝回答并要求付费
      - 0
      - 工作流程第一条就是「首先通过提问深入理解」——先澄清再动笔是好提示词的标志。
    - - 生成的 PRD 缺少验收标准时，正确的做法是？
      - - 手动在文档里补写几条
        - 在对话中补充约束，让它重新生成
        - 换另一个 AI 工具重新粘贴
      - 1
      - 迭代口诀：产出不对先改约束再重生成——手改产物，下一版迭代全丢。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '背景：我在参加 FDE 训练营 Day 1（AI 时代的产品经理）。我的产品点子是「部门周报助手」——帮部门负责人自动汇总一周数据、生成周报的小工具。我已经下载了 PM Agent 提示词（PM_Agent_Prompt.md），现在要在你的帮助下跑出一份迷你
        PRD。

        任务：请你先完整阅读我粘贴的 PM Agent 提示词并代入该角色。然后不要直接生成 PRD——先向我提出 3 个澄清问题（建议围绕：数据从哪里来、谁使用/多少人用、周报发到哪里/什么平台）。等我逐一回答后，再生成迷你 PRD。

        要求：迷你 PRD 必须包含——1）产品概述一段话；2）目标用户与目标平台（明确写出 Web/小程序/移动端）；3）至少 3 条用户故事，每条都是「作为……我想要……以便……」完整句式；4）每条用户故事配可衡量的验收标准（有数字或可数判据，例如「生成不超过
        2 分钟」「数据零遗漏」）。生成后我会用这三要素检查，缺项我会在对话里补约束让你重新生成，而不是手动改文档。

        '
      checklist:
      - 已把 PM_Agent_Prompt.md 整份粘进本机 AI 工具（新会话、一字未改）
      - AI 先提出了至少 3 个澄清问题，且我已逐条认真回答
      - 生成的迷你 PRD 含 ≥3 条完整句式用户故事
      - 每条用户故事配了可衡量的验收标准，文档写明目标平台
      - 至少完成一轮「检查 → 补约束 → 重生成」迭代
      suggested_questions:
      - AI 没有反问我就直接开写了，怎么办？
      - 我可以用自己的产品点子代替周报助手吗？
      - 验收标准里的「可衡量」到底怎么判断？
      template_resource_id: tk-pm
  - id: c5
    title: 验收：快测 + PRD 过闸
    minutes: 15
    form: 验收
    content_ref: class/bootcamp/day-01/section-05-accept/lesson.md
    content: '【开场】同学们，最后一节——也是今天的「闸」。过不去，Day 2 的门不开。


      【快测范围】快测六道题，过线四分。考点全在今天五节课里：PM 为什么升值、PRD 最小骨架、用户故事句式、可衡量的验收标准、提示词四要素、迭代口诀。——都是理解题，没有背诵题。当晚可以重测，别怕。


      【过闸三要素】你的迷你 PRD，只看「三要素」。一，至少三条用户故事，每条都是「作为……我想要……以便……」的完整句式；二，每条配可衡量的验收标准——有数字、能测试；三，写明目标平台。


      缺一个——打回。别侥幸，机器校验和导师眼睛都盯着。


      【为什么卡这么严】这不是刁难。明天这份 PRD 会原样交给架构师提示词——今天糊弄过去的窟窿，明天成倍放大。「验收前移」，是这一周最重要的心法。


      【带走的话】过了这闸，你就不只是会跟 AI 聊天的人——你是会给 AI 下需求、并且卡住质量的人。'
    practice: 完成标志：快测 ≥ 4/6 合格；`PRD.md` 三要素自查全部打勾，且通过 lab 机器校验；能口头说明：这份 PRD 明天交给架构师提示词时，对方最关注哪几个字段。
    resource_ids:
    - prd-cheatsheet
    tools:
    - name: PRD 过闸三要素清单
      note: 用户故事 · 验收标准 · 目标平台，缺一不可
    - name: 快测范围卡
      note: 考点全部来自今天前五节
    quiz:
    - - 迷你 PRD 过闸的三要素是？
      - - 用户故事、可衡量验收标准、目标平台
        - 市场规模、竞品分析、商业模式
        - 配色方案、字体规范、图标库
      - 0
      - 过闸只看三要素：≥3 条完整句式用户故事、每条可衡量验收标准、写明目标平台——它们是明天架构师的输入。
    - - 日级快测的过线标准是？
      - - 6 题全对
        - 6 题对 4 题
        - 6 题对 3 题
      - 1
      - 日级快测过线为 4/6，且当晚可重测——快测是查漏，不是一锤定音。
quiz:
  pass_rate: 0.67
  questions:
  - q: AI 三分钟就能写一份 PRD，为什么产品经理反而更重要了？
    options:
    - 因为 PRD 字数要求变多了
    - 因为「写」贬值后，定方向和做验收成了更稀缺的能力
    - 因为 AI 写的 PRD 一律不能用
    answer: 1
    explain: AI 压垮的是「写」的价值；选方向、卡质量这两件要人负责的事随之升值。
  - q: 用餐厅类比理解 AI 时代的分工，下列哪个对应关系正确？
    options:
    - AI 是点菜的人，PM 是厨子
    - AI 是万能厨子，PM 是点菜并验收的人
    - AI 是餐厅老板，PM 是服务员
    answer: 1
    explain: AI 负责快速产出（厨子），PM 负责决定做什么、判合格与否（点菜并验收）。
  - q: PRD 最小骨架的「四根骨头」是？
    options:
    - 产品概述、目标用户与平台、用户故事、验收标准
    - 市场分析、竞品对比、财务预测、融资计划
    - 配色、字体、图标、动效
    answer: 0
    explain: 最小骨架回答四个问题：这是什么、给谁在哪用、拿它做什么、做到什么程度算合格。
  - q: 「作为部门负责人，我想要一键汇总本周数据，以便周一例会前拿到周报」——这句用户故事缺了哪一格？
    options:
    - 缺「谁」
    - 缺「做什么」
    - 三格齐全，什么都不缺
    answer: 2
    explain: 用户故事句式为「作为谁/想要做什么/以便得到什么价值」，此句三格完整。
  - q: 「周报要好用，领导要满意」为什么不能算验收标准？
    options:
    - 语气不够正式
    - 不可衡量——第三方无法客观判出「过/不过」
    - 没有提到具体技术栈
    answer: 1
    explain: 验收标准铁律是可衡量：有数字或可数判据，交给陌生人也能客观判定。
  - q: 用 PM 提示词生成的 PRD 少了目标平台一节，按迭代口诀应该怎么做？
    options:
    - 手动把平台补进文档
    - 在对话中补约束「PRD 必须包含目标平台列表」并重生成
    - 删掉提示词里的输出格式要求
    answer: 1
    explain: 提示词是源码、产物是编译结果——改约束重生成，改动才能延续到下一版。
