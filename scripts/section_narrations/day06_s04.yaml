title: "第六天 · 第 4 节 · Eval / Guardrails / Vibe Coding"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · 三词命名"
      - "Eval · Guardrails · Vibe Coding"
      - "带验收的 vibe coding"
    text: |
      同学们，第四节三个词——Eval、Guardrails、Vibe Coding。听起来新，其实你们这些天一直在做，今天只是给名字。训练营全程练的是「带验收的 vibe coding」：你用自然语言描述意图，让 AI 写代码，爽点是真快，背锅也是真背锅。这一节就是把「我觉得还行」换成可重复的考卷，把「啥都能答」换成有边界的护栏，嘛。
  - id: "02-eval"
    ppt:
      - "眉题：02 EVAL · 出考卷"
      - "固定题库 · 明确判分 · 可重复跑"
      - "20 条边界 case · 改版重跑"
    text: |
      先说 Eval，评测——给 AI 产物出考卷。固定输入、明确判分、能重复跑，代替「我觉得还行」。第一天的 Rubric、快测的选择题，都是 Eval 的朴素版。上线前怎么做？准备二十条边界 case：摘要里有没有该出现的数据字段？有没有编造人名？模型或 Prompt 改版之后，整套重跑一遍，分数掉了就别发版。Eval 不是锦上添花，是发版的门禁，对吧。
  - id: "03-guardrails"
    ppt:
      - "眉题：03 GUARDRAILS · 护栏"
      - "讲解图：exception-taxonomy.svg"
      - "敏感词 · 空结果 · 超时 · 三条降级"
    text: |
      第二个，Guardrails，护栏——拦在输入输出上的规则。输入端：什么不许问，比如「给我全员工资」；输出端：什么不许答，比如没检索到就瞎编公司政策。越界了咋办？拒答、转人工、降级模板，别硬编。企业驾驶舱至少有三条降级路径：敏感词、空结果、超时。打个比方，Guardrails 就像高速公路护栏——不是限制你开车，是防止开下悬崖，呢。
  - id: "04-vibe"
    ppt:
      - "眉题：04 VIBE CODING"
      - "Cursor / Copilot / Claude Code"
      - "会 vibe + 验收 → 变贵；只 vibe → 技术债"
    text: |
      第三个，Vibe Coding，氛围编程。Cursor、Copilot、Claude Code——你描述意图，AI 写 diff。第三天那个大头 HTML，就是 vibe 产物，对吧。爽点是真的快；风险也是真的：逻辑错、安全洞、以后没人看得懂。所以验收不能 vibe：接口返回两百不够，得对契约；摘要对不上数据，得回滚 Prompt。会 vibe 又会验收的人变贵，只会 vibe 不验收的人，技术债会找上门，嘛。
  - id: "05-triangle"
    ppt:
      - "眉题：05 三角关系"
      - "讲解图：llm-ops-triangle.svg"
      - "Eval=好不好 · Guardrails=敢不敢 · Vibe=杠杆"
    text: |
      三个词怎么串？Eval 告诉你好不好；Guardrails 告诉你敢不敢上线；Vibe Coding 是生产力杠杆。缺 Eval 是盲飞——不知道改坏了没有；缺 Guardrails 是裸奔——啥都敢答；缺验收的 Vibe 是技术债工厂——写得快，还得还。生产力靠 vibe，可靠性靠 Eval 加 Guardrails，两个角缺一不可，对吧。
  - id: "06-close"
    ppt:
      - "眉题：06 TAKEAWAY"
      - "「我觉得还行」≠ 验收标准"
      - "预告：Agent · Harness · MCP"
    text: |
      第四节带走一句：「我觉得还行」不是验收标准，Eval 才是。下一节进入 Agent 全家桶——Harness、MCP、Workflow 跟 Agent 怎么分，Copilot 跟 Agent 差在哪。词多，但骨架捋清了，第二周封装 Skill 就不懵，呢。
