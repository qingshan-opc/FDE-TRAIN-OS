<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="LLM 生态四层地图">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3ee"/>
      <stop offset="100%" stop-color="#f7f8f4"/>
    </linearGradient>
    <linearGradient id="l4Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.16)"/>
      <stop offset="100%" stop-color="rgba(13,148,136,.05)"/>
    </linearGradient>
    <linearGradient id="l3Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(13,148,136,.10)"/>
      <stop offset="100%" stop-color="rgba(35,31,32,.02)"/>
    </linearGradient>
    <linearGradient id="hotChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#231f20" flood-opacity=".08"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="rgba(35,31,32,.07)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="url(#bgGrad)"/>
  <rect width="1100" height="620" fill="url(#dots)" opacity=".55"/>
  <circle cx="980" cy="90" r="120" fill="rgba(13,148,136,.08)">
    <animate attributeName="r" values="120;142;120" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="520" r="90" fill="rgba(35,31,32,.04)">
    <animate attributeName="r" values="90;106;90" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- title strip -->
  <rect x="36" y="18" width="6" height="28" rx="3" fill="#0d9488"/>
  <text x="52" y="38" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#231f20">LLM 生态四层 · 你站在最上两层</text>
  <text x="1064" y="38" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.4)">ECOSYSTEM MAP</text>

  <!-- left rail labels -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(36,78)">
      <rect width="148" height="108" rx="14" fill="#fff" stroke="#0d9488" stroke-width="2" filter="url(#soft)"/>
      <text x="14" y="30" font-size="18" font-weight="800" fill="#231f20">应用层</text>
      <text x="14" y="50" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.4" fill="#0d9488">L4 · APPLICATION</text>
      <text x="14" y="76" font-size="12" fill="rgba(35,31,32,.55)">人看得见的产品口</text>
      <text x="14" y="96" font-size="12" fill="rgba(35,31,32,.45)">对话 · 助手 · IDE</text>
    </g>
    <g transform="translate(36,206)">
      <rect width="148" height="108" rx="14" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1" filter="url(#soft)"/>
      <text x="14" y="30" font-size="18" font-weight="800" fill="#231f20">编排层</text>
      <text x="14" y="50" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.4" fill="rgba(35,31,32,.45)">L3 · ORCHESTRATION</text>
      <text x="14" y="76" font-size="12" fill="rgba(35,31,32,.55)">控制模型怎么干活</text>
      <text x="14" y="96" font-size="12" fill="rgba(35,31,32,.45)">Prompt · Tool · Loop</text>
    </g>
    <g transform="translate(36,334)">
      <rect width="148" height="108" rx="14" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1"/>
      <text x="14" y="30" font-size="18" font-weight="800" fill="#231f20">模型层</text>
      <text x="14" y="50" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.4" fill="rgba(35,31,32,.45)">L2 · MODEL</text>
      <text x="14" y="76" font-size="12" fill="rgba(35,31,32,.55)">能力的源头</text>
      <text x="14" y="96" font-size="12" fill="rgba(35,31,32,.45)">权重 · 上下文窗口</text>
    </g>
    <g transform="translate(36,462)">
      <rect width="148" height="108" rx="14" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1"/>
      <text x="14" y="30" font-size="18" font-weight="800" fill="#231f20">基建层</text>
      <text x="14" y="50" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.4" fill="rgba(35,31,32,.45)">L1 · INFRA</text>
      <text x="14" y="76" font-size="12" fill="rgba(35,31,32,.55)">算力 · 网关 · 托管</text>
      <text x="14" y="96" font-size="12" fill="rgba(35,31,32,.45)">GPU · 向量库 · 日志</text>
    </g>
  </g>

  <!-- layer bands -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- L4 -->
    <g transform="translate(204,78)">
      <rect width="700" height="108" rx="16" fill="url(#l4Fill)" stroke="#0d9488" stroke-width="2.5" filter="url(#soft)"/>
      <text x="678" y="22" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#0d9488">L4</text>
      <!-- chips -->
      <g transform="translate(24,38)">
        <rect width="88" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="44" y="26" text-anchor="middle" font-size="13" fill="#231f20">聊天助手</text>
      </g>
      <g transform="translate(124,38)">
        <rect width="126" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="63" y="26" text-anchor="middle" font-size="13" fill="#231f20">AI 编程 · TRAE</text>
      </g>
      <g transform="translate(262,38)">
        <rect width="88" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="44" y="26" text-anchor="middle" font-size="13" fill="#231f20">垂直应用</text>
      </g>
      <g transform="translate(362,32)">
        <rect width="214" height="54" rx="14" fill="url(#hotChip)"/>
        <text x="107" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">业务系统 · 对话口</text>
        <text x="107" y="42" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="rgba(255,255,255,.85)">← 你在这里 · YOU ARE HERE</text>
        <!-- pulse ring -->
        <rect x="-7" y="-7" width="228" height="68" rx="20" fill="none" stroke="#0d9488" stroke-width="2" opacity=".45">
          <animate attributeName="opacity" values=".5;.14;.5" dur="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(590,38)">
        <rect width="86" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="43" y="26" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.5)">看板 / 助手</text>
      </g>
    </g>

    <!-- connector L4→L3 -->
    <path d="M554 186 L554 206" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="9" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <!-- L3 -->
    <g transform="translate(204,206)">
      <rect width="700" height="108" rx="16" fill="url(#l3Fill)" stroke="rgba(35,31,32,.14)" stroke-width="1" filter="url(#soft)"/>
      <text x="678" y="22" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.4)">L3</text>
      <g transform="translate(24,38)">
        <rect width="78" height="42" rx="10" fill="#fff" stroke="#0d9488" stroke-width="1.6"/>
        <text x="39" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">Prompt</text>
      </g>
      <g transform="translate(114,38)">
        <rect width="64" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="32" y="26" text-anchor="middle" font-size="13" fill="#231f20">RAG</text>
      </g>
      <g transform="translate(190,38)">
        <rect width="58" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="29" y="26" text-anchor="middle" font-size="13" fill="#231f20">MCP</text>
      </g>
      <g transform="translate(260,38)">
        <rect width="128" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="64" y="26" text-anchor="middle" font-size="13" fill="#231f20">Function Call</text>
      </g>
      <g transform="translate(400,38)">
        <rect width="96" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="48" y="26" text-anchor="middle" font-size="13" fill="#231f20">Agent 框架</text>
      </g>
      <g transform="translate(508,38)">
        <rect width="84" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="42" y="26" text-anchor="middle" font-size="13" fill="#231f20">Harness</text>
      </g>
      <g transform="translate(604,38)">
        <rect width="72" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="36" y="26" text-anchor="middle" font-size="13" fill="#231f20">Loop</text>
      </g>
    </g>

    <path d="M554 314 L554 334" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow)" opacity=".7">
      <animate attributeName="stroke-dashoffset" from="9" to="0" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <!-- L2 -->
    <g transform="translate(204,334)">
      <rect width="700" height="108" rx="16" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1"/>
      <text x="678" y="22" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.4)">L2</text>
      <g transform="translate(24,36)">
        <rect width="210" height="48" rx="10" fill="#f7f8f4" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#231f20">闭源</text>
        <text x="105" y="38" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">GPT · Claude · Gemini</text>
      </g>
      <g transform="translate(246,36)">
        <rect width="220" height="48" rx="10" fill="#f7f8f4" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="110" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#231f20">开源 · 本课优先</text>
        <text x="110" y="38" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">DeepSeek · Qwen · Llama</text>
      </g>
      <g transform="translate(478,36)">
        <rect width="198" height="48" rx="10" fill="#f7f8f4" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="99" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#231f20">国内云</text>
        <text x="99" y="38" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">Kimi · 智谱 · 豆包</text>
      </g>
    </g>

    <path d="M554 442 L554 462" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow)" opacity=".55">
      <animate attributeName="stroke-dashoffset" from="9" to="0" dur="1.3s" repeatCount="indefinite"/>
    </path>

    <!-- L1 -->
    <g transform="translate(204,462)">
      <rect width="700" height="108" rx="16" fill="#f4f5f1" stroke="rgba(35,31,32,.14)" stroke-width="1"/>
      <text x="678" y="22" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="rgba(35,31,32,.4)">L1</text>
      <g transform="translate(24,38)">
        <rect width="120" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="60" y="26" text-anchor="middle" font-size="13" fill="#231f20">GPU / 云托管</text>
      </g>
      <g transform="translate(156,38)">
        <rect width="110" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="55" y="26" text-anchor="middle" font-size="13" fill="#231f20">API 网关</text>
      </g>
      <g transform="translate(278,38)">
        <rect width="110" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="55" y="26" text-anchor="middle" font-size="13" fill="#231f20">向量库</text>
      </g>
      <g transform="translate(400,38)">
        <rect width="120" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="60" y="26" text-anchor="middle" font-size="13" fill="#231f20">Ollama 本地</text>
      </g>
      <g transform="translate(532,38)">
        <rect width="72" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="36" y="26" text-anchor="middle" font-size="13" fill="#231f20">vLLM</text>
      </g>
      <g transform="translate(616,38)">
        <rect width="60" height="42" rx="10" fill="#fff" stroke="rgba(35,31,32,.12)" stroke-width="1"/>
        <text x="30" y="26" text-anchor="middle" font-size="13" fill="#231f20">日志</text>
      </g>
    </g>
  </g>

  <!-- right axis -->
  <g>
    <line x1="940" y1="110" x2="940" y2="520" stroke="rgba(13,148,136,.45)" stroke-width="2"/>
    <circle cx="940" r="5" fill="#0d9488">
      <animate attributeName="cy" values="520;110" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.12;.85;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M940 96 L932 112 L948 112 Z" fill="#0d9488"/>
    <path d="M940 534 L932 518 L948 518 Z" fill="rgba(35,31,32,.45)"/>
    <text x="958" y="128" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="800" fill="#231f20">越贴近业务</text>
    <text x="958" y="148" font-size="11.5" fill="rgba(35,31,32,.55)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">产品口 · 验收</text>
    <text x="958" y="300" font-size="12" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">本课主战场</text>
    <rect x="958" y="310" width="110" height="4" rx="2" fill="#0d9488" opacity=".35"/>
    <text x="958" y="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="800" fill="#231f20">越是通用底座</text>
    <text x="958" y="520" font-size="11.5" fill="rgba(35,31,32,.55)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">谁都绕不开</text>
  </g>

  <!-- footer note -->
  <rect x="204" y="586" width="700" height="22" rx="11" fill="rgba(13,148,136,.08)"/>
  <text x="554" y="602" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12.5" fill="#0f766e">上层贴业务 · 下层是底座 · 没编排 = 只是「能聊的黑盒」</text>
</svg>
