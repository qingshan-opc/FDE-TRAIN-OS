<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-label="部署管线图">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".45"/></filter>
</defs>
<rect width="1040" height="440" fill="#ffffff"/>
<rect width="1040" height="440" fill="url(#dots)"/>
<circle cx="950" cy="54" r="100" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="100;116;100" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="64" cy="388" r="72" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="72;84;72" dur="11s" repeatCount="indefinite"/></circle>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="36" y="24" width="6" height="24" rx="3" fill="#0d9488"/>
<text x="52" y="42" font-size="20" font-weight="800" fill="#231f20">部署链路 · 五阶段</text>
<text x="1004" y="42" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">DEPLOY · PIPELINE</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.5s" fill="freeze"/>
<rect x="50" y="80" width="150" height="96" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="125" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="800" fill="#231f20">代码</text>
<text x="125" y="142" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">CODE</text>
<text x="125" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10.5" fill="rgba(35,31,32,.6)">git commit 留证</text>
</g>
<path d="M206 128 H240" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/>
<rect x="246" y="80" width="150" height="96" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="321" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="800" fill="#231f20">构建</text>
<text x="321" y="142" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">BUILD</text>
<text x="321" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10.5" fill="rgba(35,31,32,.6)">装依赖 · 配环境</text>
</g>
<path d="M402 128 H436" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.70s" dur="0.5s" fill="freeze"/>
<rect x="442" y="80" width="150" height="96" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="517" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="800" fill="#231f20">镜像</text>
<text x="517" y="142" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">IMAGE</text>
<text x="517" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10.5" fill="rgba(35,31,32,.6)">应用+环境 连锅端</text>
</g>
<path d="M598 128 H632" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.5s" fill="freeze"/>
<rect x="638" y="80" width="150" height="96" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="713" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="800" fill="#231f20">运行</text>
<text x="713" y="142" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(35,31,32,.4)">RUN</text>
<text x="713" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10.5" fill="rgba(35,31,32,.6)">服务器 7×24</text>
</g>
<path d="M794 128 H828" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.20s" dur="0.5s" fill="freeze"/>
<rect x="826" y="72" width="166" height="112" rx="22" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.14;.5" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="834" y="80" width="150" height="96" rx="16" fill="url(#g)" filter="url(#glow)"/>
<text x="909" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="800" fill="#fff">访问</text>
<text x="909" y="142" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="rgba(255,255,255,.85)">VISIT</text>
<text x="909" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10.5" fill="rgba(255,255,255,.92)">换设备能开 ✓</text>
</g>
<circle cy="128" r="5" fill="#0d9488">
<animate attributeName="cx" values="50;984" dur="4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="4s" repeatCount="indefinite"/>
</circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.70s" dur="0.5s" fill="freeze"/>
<path d="M517 204 V184" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1s" repeatCount="indefinite"/></path>
<rect x="394" y="202" width="246" height="60" rx="30" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.14;.5" dur="2.3s" repeatCount="indefinite"/></rect>
<rect x="402" y="210" width="230" height="44" rx="22" fill="url(#g)" filter="url(#glow)"/>
<text x="517" y="237" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#fff">验收闸：十条链路全绿才准发</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.5s" fill="freeze"/>
<text x="520" y="312" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">「在我机器上是好的」不算上线 —— 换台设备能开才算</text>
<text x="520" y="340" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">开发 / 生产配置分离 · 密钥不进代码（详见 env-config-split 图）</text>
<text x="520" y="370" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" fill="rgba(35,31,32,.5)">镜像 = 集装箱：你的应用和它的整个环境一起装箱，到哪台机器都长一样</text>
</g>
</svg>
