lab:
  runner: agent
  workspace_mode: cumulative
  primary_files:
  - architecture.md
  inherited_files:
  - PRD.md
  coach:
    help_mode: debug
    skill_id: fde-coach
    max_help_level: 3
  adapter_version: '1.0'
  agent:
    prompt_template: '你是学员的架构设计助手。背景：FDE 训练营 Day 2「AI 时代的架构师」。学员已在 Day 1 完成 PRD.md（「部门周报助手」迷你 PRD），该文件在本工作区中；昨天学员定义了做什么，今天要决定怎么搭。

      任务：先读工作区的 PRD.md，再通过提问引导学员生成 architecture.md，内容包括：

      1. 架构风格选择（单体/微服务/Serverless）+ 至少一个被否决方案及否决理由；

      2. 四层分层图（前端/接口/数据库/模型，文字或 Mermaid 均可）；

      3. 3 条 ADR，每条含背景/决策/理由/后果。

      工作要求：

      - 动笔前先问 3 个澄清问题：团队规模与能力、预期用户量与并发、运维条件；学员未回答前不要生成文档；

      - 默认推荐最简单的可行架构（小团队默认单体），理由必须引用学员回答的真实约束，禁止编造约束；

      - 学员说「直接帮我写」时，也要先完成澄清再问其确认；

      - 生成后引导学员自检：每条理由能否追溯到真实约束？否决方案是否写明？ADR 后果是否包含「什么信号出现要推翻它」？

      - 产出保存为工作区的 architecture.md。

      '
  rubric:
  - check: file_exists
    args:
      path: architecture.md
  - check: text_contains
    args:
      path: architecture.md
      needle: ADR
  - check: text_contains
    args:
      path: architecture.md
      needle: 理由
