      - 联调要证明合同两端和实际数据都一致。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '前端已经交接。现在切换到 @后端。每段完成后必须停止。


        【第 1 段｜检查现有后端】

        请读取 iteration-prd.md、frontend-handoff.md、原 API_Spec.md、DB_Schema.md、RUNBOOK.md 和现有后端代码。只复述业务规则、请求合同、相关入口和现有数据结构。


