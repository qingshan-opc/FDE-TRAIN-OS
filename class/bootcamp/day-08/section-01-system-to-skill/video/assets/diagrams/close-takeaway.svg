<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="带走一句：系统被使用，Prompt 管这次，Skill 管长期">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#0d9488" flood-opacity=".45"/>
    </filter>
    <marker id="ct-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="300" fill="#ffffff"/>
  <rect width="1040" height="300" fill="url(#dots)"/>
  <circle cx="960" cy="50" r="90" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="90;106;90" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="260" r="64" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="64;76;64" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="16" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="33" font-size="15" font-weight="800" fill="#231f20">带走一句：系统被使用</text>
    <text x="1004" y="33" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">TAKEAWAY</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <!-- three takeaways -->
    <g>
      <rect x="60" y="66" width="560" height="58" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <rect x="60" y="66" width="6" height="58" rx="3" fill="rgba(35,31,32,.2)"/>
      <text x="92" y="101" font-size="15" font-weight="700" fill="#231f20">系统被使用 —— 驾驶舱得有人天天看</text>
      <animate attributeName="opacity" values=".25;1;1" keyTimes="0;.18;1" begin="0s" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="60" y="136" width="560" height="58" rx="14" fill="#fff" stroke="rgba(35,31,32,.11)" filter="url(#sh)"/>
      <rect x="60" y="136" width="6" height="58" rx="3" fill="rgba(35,31,32,.2)"/>
      <text x="92" y="171" font-size="15" font-weight="700" fill="#231f20">Prompt 管这次 —— 一次性任务书</text>
      <animate attributeName="opacity" values=".25;1;1" keyTimes="0;.18;1" begin=".5s" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="60" y="206" width="560" height="58" rx="14" fill="rgba(13,148,136,.10)" stroke="rgba(13,148,136,.45)" stroke-width="1.4"/>
      <rect x="60" y="206" width="6" height="58" rx="3" fill="url(#teal)"/>
      <text x="92" y="241" font-size="15" font-weight="800" fill="#0f766e">Skill 管长期 —— 反复用的能力封装起来</text>
      <animate attributeName="opacity" values=".25;1;1" keyTimes="0;.18;1" begin="1s" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <line x1="632" y1="165" x2="700" y2="165" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ct-arrow)">
      <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>

    <!-- next preview -->
    <g>
      <rect x="708" y="86" width="272" height="158" rx="18" fill="url(#teal)" filter="url(#glow)"/>
      <text x="844" y="128" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.85)" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">NEXT · 预告</text>
      <text x="844" y="162" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">四部件解剖</text>
      <text x="844" y="190" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.88)">描述 · 输入 · 步骤 · 输出</text>
      <rect x="764" y="206" width="160" height="4" rx="2" fill="rgba(255,255,255,.5)">
        <animate attributeName="opacity" values=".5;.9;.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
