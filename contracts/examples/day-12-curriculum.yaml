camp_version: v0.3
day: 12
title: 企业级交付与避坑指南
project: 期末交付包
project_brief: 交付 delivery-pack.html：SOP、架构图清单、避坑三条。
review_checklist:
- 产物文件存在且可预览
- 对照 rubric 自检通过
- 能向导师说清本日价值
learn:
  lingzhi_tags:
  - camp:v0.3
  - day:12
  - topic:delivery
  estimated_minutes: 120
  require_capsules: true
  capsules:
  - id: c1
    title: 私有化与数据红线
    minutes: 20
    content: 数据不出境；合规意识。
    practice: 写一条红线。
  - id: c2
    title: 运维监控
    minutes: 20
    content: Token、成功率、告警。
    practice: 列两个监控指标。
  - id: c3
    title: 避坑
    minutes: 20
    content: 注入、Token 爆炸、太慢。
    practice: 各记一防法。
  - id: c4
    title: 交付文档与架构图
    minutes: 20
    content: 标准模板与合格图。
    practice: 列文档目录三节。
  - id: c5
    title: FDE 技能树复盘
    minutes: 20
    content: 两周知识点串联。
    practice: 写你的三项能力。
  - id: c6
    title: 结语与大作业
    minutes: 20
    content: 设计一个 AI 解决方案并交付。
    practice: 一句话选题。
quiz:
  pass_rate: 0.67
  questions:
  - q: 企业数据红线常指？
    options:
    - 字体版权
    - 敏感数据合规/不出境
    - 按钮圆角
    answer: 1
    explain: 合规。
  - q: 交付物应含？
    options:
    - 仅代码
    - 文档与架构图
    - 仅截图表情包
    answer: 1
    explain: 专业交付。
  - q: Prompt 注入属于？
    options:
    - 好实践
    - 需防范的坑
    - Git 命令
    answer: 1
    explain: 安全坑。
nodes:
- type: learn
  title: 合规与运维
- type: quiz
  title: 避坑速测
- type: lab
  title: Agent 生成交付包页
- type: project
  title: 企业任务：期末方案壳
- type: review
  title: 终审
- type: unlock
  title: 结营解锁
lab:
  runner: agent
  coach:
    help_mode: explain
    skill_id: fde-coach
    max_help_level: 2
  agent:
    prompt_template: 创建 delivery-pack.html：标题「企业交付包」，含上线 SOP 列表、架构图清单、避坑指南（注入/Token/延迟），文案含「私有化」。不要
      Docker。
  rubric:
  - check: file_exists
    args:
      path: delivery-pack.html
  - check: text_contains
    args:
      path: delivery-pack.html
      needle: SOP
  - check: text_contains
    args:
      path: delivery-pack.html
      needle: 私有化
