<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="Prompt 四要素">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <rect width="1040" height="470" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="422" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">Prompt 四要素 · 每条都要能验收</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">ROLE · TASK · CONSTRAINTS · FORMAT</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="60" width="440" height="130" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="84" y="94" font-size="15" font-weight="800" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">01 角色</text>
<text x="84" y="122" font-size="12" fill="rgba(35,31,32,.65)">它是谁：「资深前端 + 数据可视化工程师」</text>
<text x="84" y="150" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 输出风格漂移，每次长得都不一样</text>
<text x="84" y="174" font-size="10" font-weight="700" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">ROLE</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="540" y="60" width="440" height="130" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="564" y="94" font-size="15" font-weight="800" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">02 任务</text>
<text x="564" y="122" font-size="12" fill="rgba(35,31,32,.65)">做什么：「生成单文件部门驾驶舱页面」</text>
<text x="564" y="150" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 它自由发挥，给你一篇说明文</text>
<text x="564" y="174" font-size="10" font-weight="700" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">TASK</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="210" width="440" height="130" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="84" y="244" font-size="15" font-weight="800" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">03 约束</text>
<text x="84" y="272" font-size="12" fill="rgba(35,31,32,.65)">必须/不许：「单 HTML · 无外部依赖 · 指标 ≤5」</text>
<text x="84" y="300" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 无法验收——约束就是 Rubric 的上游</text>
<text x="84" y="324" font-size="10" font-weight="700" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">CONSTRAINTS · 至少 3 条、条条可验收</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="540" y="210" width="440" height="130" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="564" y="244" font-size="15" font-weight="800" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">04 格式</text>
<text x="564" y="272" font-size="12" fill="rgba(35,31,32,.65)">长什么样：「五区块 · 三态占位 · 语义化结构」</text>
<text x="564" y="300" font-size="11" fill="rgba(35,31,32,.45)">缺了 → 对不上线框，拼装时全是缝</text>
<text x="564" y="324" font-size="10" font-weight="700" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">FORMAT</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="60" y="392" font-size="13" fill="rgba(35,31,32,.45)" text-decoration="line-through">「请设计得高端、大气、智能」</text><path d="M340 386 L420 386" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/></path><text x="440" y="392" font-size="13" font-weight="700" fill="#0f766e">可验收：「单文件 · 无依赖 · 五区块 · 三态占位」</text><text x="520" y="440" font-size="11.5" fill="rgba(35,31,32,.5)" text-anchor="middle">空泛形容词不产生任何像素 —— 每条约束都要能回答「怎么算做到」</text></g>
</svg>
