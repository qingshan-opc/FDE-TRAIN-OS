# Day 06 — RAG 与知识卡片（Agent + Kb 标签）
camp_version: v0.3
day: 6
title: 企业知识库与 RAG 问答
project: 库存 FAQ 知识卡

learn:
  lingzhi_tags: ["camp:v0.3", "day:6", "topic:rag"]
  estimated_minutes: 45
  steps:
    - RAG：先检索企业知识，再让模型回答，减少胡编。
    - 知识卡片要有标题、场景、步骤与验收标准。
    - FDE 把「能问到正确知识」当成交付能力，而不只是聊天。
    - 今日：产出可嵌入帮助中心的 FAQ 页。

quiz:
  pass_rate: 0.67
  questions:
    - q: RAG 中 R 通常指？
      options: ["检索", "渲染", "重启"]
      answer: 0
    - q: 知识卡片最重要的是？
      options: ["花哨动画", "可检索的结构化内容", "字数越多越好"]
      answer: 1
    - q: 没有命中知识时应？
      options: ["编造答案", "明确未知并引导人工", "直接 500"]
      answer: 1

nodes:
  - type: learn
    title: RAG 心智与知识卡结构
  - type: quiz
    title: RAG 速测
  - type: lab
    title: Agent 生成库存 FAQ 页
  - type: project
    title: 企业任务：FAQ 可嵌入帮助中心
  - type: review
    title: 知识引用自检
  - type: unlock
    title: 解锁 Agent Runtime 日

lab:
  runner: agent
  agent:
    prompt_template: >
      创建 rag-faq.html：库存 FAQ 页。标题「库存 FAQ」，至少 3 个问答，
      文案需出现 RAG 与「知识卡片」，并含 id="faq"。不要 Docker。
  rubric:
    - check: file_exists
      args: { path: rag-faq.html }
    - check: text_contains
      args: { path: rag-faq.html, needle: "RAG" }
    - check: text_contains
      args: { path: rag-faq.html, needle: "faq" }
