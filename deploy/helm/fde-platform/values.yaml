# Default values for fde-platform.
# Production Postgres: CloudNativePG 3-replica cluster + WAL/PITR to fde-backups.
# Production object store: MinIO Operator Tenant (multi-PVC, anti-affinity).
# E2E (values-e2e.yaml): single-replica Postgres/MinIO for k3d.

nameOverride: ""
fullnameOverride: "fde-platform"

imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}

# External secret keys are expected in an existing Secret (not generated by this chart).
# Required keys: JWT_SECRET, DATABASE_URL, S3_ACCESS_KEY, S3_SECRET_KEY
# Optional: LINGZHI_API_KEY, LINGZHI_CLIENT_TOKEN, ANYCODE_API_TOKEN
existingSecret: fde-platform-secrets

image:
  api:
    repository: fde-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  worker:
    repository: fde-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  web:
    repository: fde-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  anycode:
    repository: anycode-dashboard
    tag: "latest"
    pullPolicy: IfNotPresent
    # Headless Workbench HTTP (AgentRuntime). Override command if image entrypoint differs.
    command:
      - anycode-dashboard-serve
    args:
      - --host
      - 0.0.0.0
      - --port
      - "43180"
  migrate:
    repository: fde-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 8760
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  # anyCode sidecar = headless Workbench HTTP (no Desktop UI)
  anycode:
    enabled: true
    port: 43180
    skillsMount: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

web:
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  pdb:
    enabled: true
    minAvailable: 1

migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400

bootstrap:
  enabled: false

wechatPay:
  enabled: false
  mountCerts: false
  privateKeySecretKey: WECHAT_PAY_PRIVATE_KEY
  platformCertSecretKey: WECHAT_PAY_PLATFORM_CERT

config:
  FDE_ENV: prod
  FDE_API_PORT: "8760"
  FDE_INTERNAL_BASE: http://fde-platform-api:8760
  AGENT_MODE: live
  ANYCODE_DASHBOARD_URL: http://127.0.0.1:43180
  ANYCODE_COACH_SKILL_ID: fde-coach
  ANYCODE_SSE_TIMEOUT_SEC: "180"
  LINGZHI_BASE_URL: http://lingzhi.example.svc:8230
  S3_ENDPOINT: http://minio.minio.svc:9000
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "1"
  S3_BUCKET_DOCUMENTS: fde-documents
  S3_BUCKET_WORKSPACES: fde-workspaces
  S3_BUCKET_ARTIFACTS: fde-artifacts
  S3_BUCKET_BACKUPS: fde-backups
  FDE_SEED_DEMO_USERS: "0"
  FDE_ALLOW_DEV_HEADERS: "0"
  # Runtime migrate-on-boot must stay OFF in prod — apply schema changes only
  # via the dedicated `migration-job.yaml` Job. See docs/ops/production-gate.md.
  FDE_ALLOW_RUNTIME_MIGRATE: "0"
  # CLAMAV_ENABLED=1 requires a ClamAV daemon reachable at the default unix
  # socket (services/learner/app.py `_scan_clamav`, fail-closed). No ClamAV
  # sidecar/Deployment is wired into this chart yet — do not flip this to "1"
  # in an environment that doesn't also deploy one, or every learner upload
  # will fail closed. See docs/ops/production-gate.md.
  CLAMAV_ENABLED: "0"
  # Rate limits (services/shared/rate_limit.py) — per-pod in-memory buckets;
  # tune down for smaller HPA minReplicas so the aggregate cluster-wide rate
  # stays sane. See docs/ops/production-gate.md "rate limiting" section.
  RATE_LIMIT_LOGIN: "20/min"
  RATE_LIMIT_UPLOAD: "30/min"
  RATE_LIMIT_COACH_ASK: "30/min"
  RATE_LIMIT_SQL_EXEC: "60/min"
  # Data dirs (tmp emptyDir; durable state in PG + MinIO)
  FDE_DATA_DIR: /data
  FDE_WORKSPACE_ROOT: /data/workspaces
  FDE_ARTIFACT_ROOT: /data/artifacts
  FDE_TEMP_WORKSPACE_ROOT: /data/tmp_workspaces

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: fde.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /healthz
          pathType: Exact
          service: api
        - path: /livez
          pathType: Exact
          service: api
        - path: /readyz
          pathType: Exact
          service: api
        # SECURITY: /metrics has no auth (Prometheus scrape contract) and MUST
        # NOT be reachable from the public internet. This entry exists for
        # environments without in-cluster scraping wired yet — before go-live,
        # either delete this path (scrape via NetworkPolicy-restricted
        # in-cluster ServiceMonitor/PodMonitor instead) or add an
        # nginx.ingress.kubernetes.io/whitelist-source-range restricted to
        # your monitoring egress CIDR. See docs/ops/production-gate.md.
        - path: /metrics
          pathType: Exact
          service: api
        - path: /docs
          pathType: Prefix
          service: api
        - path: /api
          pathType: Prefix
          service: api
        - path: /app
          pathType: Prefix
          service: web
        - path: /author
          pathType: Prefix
          service: web
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: fde-platform-tls
      hosts:
        - fde.example.com

networkPolicy:
  enabled: true

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Comments for operators:
# - Prod PG: install CloudNativePG Cluster with instances: 3; point DATABASE_URL at the RW service.
# - Prod MinIO: MinIO Operator Tenant (4+ pods); point S3_ENDPOINT at the tenant Service.
# - E2E: use values-e2e.yaml (single replica PG/MinIO); do not enable CNPG/MinIO Operator there.
# - Worker probes (worker-deployment.yaml): liveness is a process-alive exec
#   check, readiness execs a real `psycopg.connect(DATABASE_URL)` — a worker
#   that can't reach Postgres is pulled from rotation but not restarted
#   (avoids a restart storm on a shared PG outage). Confirm both probes are
#   green (`kubectl get pods -l app.kubernetes.io/component=worker`) as part
#   of the go-live checklist in docs/ops/production-gate.md.
# - metrics NetworkPolicy: `networkpolicy.yaml`'s `-api` Ingress rule accepts
#   traffic on `api.port` from *any* namespace (`namespaceSelector: {}`),
#   which also covers `/metrics`. If your cluster has a dedicated monitoring
#   namespace, tighten that selector to it before go-live.
