    - id: gt-test
      term: 测试
      plain: 按需求和验收标准发现问题、留下证据并组织复测。
    - id: gt-ops
      term: 运维
      plain: 负责部署、运行监控、备份、更新和故障回退。
    quiz:
    - - 六岗位流程中，UI 开工前最关键的上游文件是什么？
      - - 测试报告
        - PRD.md
        - 部署说明
      - 1
      - UI 必须先读取产品经理和学员确认后的 PRD，才能把需求转成交互设计。
    - - AI 时代测试岗位的核心价值更接近哪一项？
      - - 机械重复点击
        - 设计测试标准、发现边界问题并提供证据
        - 替产品经理决定需求
      - 1
      - AI 能自动执行大量测试，但测试人员仍需决定测什么、哪些风险最重要以及证据是否足够。
