          <text x="954" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">AI NATIVE</text>
          <circle cx="954" cy="150" r="10" fill="#1400ff"/>
          <circle cx="954" cy="150" r="3" fill="#f2f5f0"/>
          <text x="954" y="184" text-anchor="middle" font-size="13" font-weight="700" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">2024+</text>
          <text x="954" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">Agent · Harness · MCP</text>
          <text x="954" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">人定目标，AI 执行</text>
          <text x="954" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1400ff">值钱 · 会指挥 AI</text>
