<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-label="AI 应用的四层架构">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="520" fill="#ffffff"/>
  <rect width="1040" height="520" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="472" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">AI 应用的四层架构 · 接电顺序</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">FOUR LAYERS · DAY 2 → DAY 5</text>
</g>
<text x="40" y="84" font-size="13" font-weight="700" fill="rgba(35,31,32,.75)" font-family="'SF Mono',Menlo,monospace">你看到的</text><text x="40" y="104" font-size="10" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">L1</text>
<text x="40" y="190" font-size="13" font-weight="700" fill="rgba(35,31,32,.75)" font-family="'SF Mono',Menlo,monospace">怎么对话</text><text x="40" y="210" font-size="10" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">L2</text>
<text x="40" y="296" font-size="13" font-weight="700" fill="rgba(35,31,32,.75)" font-family="'SF Mono',Menlo,monospace">数据住哪</text><text x="40" y="316" font-size="10" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">L3</text>
<text x="40" y="402" font-size="13" font-weight="700" fill="rgba(35,31,32,.75)" font-family="'SF Mono',Menlo,monospace">谁动脑子</text><text x="40" y="422" font-size="10" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">L4</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="180" y="60" width="640" height="88" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="210" y="98" font-size="18" font-weight="800" fill="#231f20">前端界面</text>
<text x="210" y="120" font-size="10.5" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">UI LAYER · DAY 2</text>
<text x="790" y="110" font-size="12.5" fill="rgba(35,31,32,.6)" text-anchor="end">驾驶舱页面：五区块骨架 · 三态 · Prompt 即源码</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="180" y="166" width="640" height="88" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="210" y="204" font-size="18" font-weight="800" fill="#231f20">接口服务</text>
<text x="210" y="226" font-size="10.5" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">API LAYER · DAY 3</text>
<text x="790" y="216" font-size="12.5" fill="rgba(35,31,32,.6)" text-anchor="end">FastAPI · JSON 契约——前后端唯一的对话方式</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="180" y="272" width="640" height="88" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="210" y="310" font-size="18" font-weight="800" fill="#231f20">数据库</text>
<text x="210" y="332" font-size="10.5" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">DATA LAYER · DAY 4</text>
<text x="790" y="322" font-size="12.5" fill="rgba(35,31,32,.6)" text-anchor="end">SQLite 起步，PostgreSQL 毕业——数据终于有家</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="180" y="378" width="640" height="88" rx="16" fill="rgba(13,148,136,.10)" stroke="rgba(13,148,136,.5)" stroke-width="1.5"/>
<text x="210" y="416" font-size="18" font-weight="800" fill="#0f766e">AI 模型</text>
<text x="210" y="438" font-size="10.5" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">MODEL LAYER · DAY 5</text>
<text x="790" y="428" font-size="12.5" fill="rgba(35,31,32,.6)" text-anchor="end">云 API 或本地推理——摘要与建议的大脑</text>
</g>
