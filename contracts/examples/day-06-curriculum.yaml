  - id: c5
    title: 前端技术图：四大平台与框架地图
    minutes: 25
    form: 概念
    content_ref: class/bootcamp/day-06/section-05-frontend-tech/lesson.md
    content: '同学们，上节咱们讲了服务器跟云原生——说白了呢，就是程序住在哪、怎么长时间跑。不管今天的软件，还是工厂里的 ERP、CRM，都得有个生存环境：服务器、物理机、电脑或者容器，对吧。这节换一条线：用户摸到的那一层——前端。

      先把前端这个词撑大一点。有人对前端的理解呢，还停在做个网页——其实不对。操作系统里你点的窗口按钮、Web 页面、手机 App、微信小程序、桌面上双击打开的软件界面——凡是用户直接接触的界面层，都是前端。一句话记住：摸得到的那一层，就是前端。

      主流分成四个平台，大家可以看屏幕。Web 网页——浏览器地址栏那一类；App——应用商店下载安装；小程序——微信里扫码即用；桌面软件——电脑上双击图标。选型第一步永远先定平台：用户在哪儿用你，你就站哪条线，对吧。

      先说 Web。网页从两千年左右的静态店铺页，发展到今天的强交互——你搜一下，后端算一下，再把结果渲染给你看。地基还是三件套：HTML 骨架、CSS 皮肤、JavaScript 肌肉。框架呢，就是预制装修套件。React——人最多、生态最大、AI
      最会写，大型项目常用，也推荐大家优先熟悉。Vue——尤雨溪做出来的，中小型、单体应用很合适，企业小系统、大屏都行。Angular——新项目少一些、上手偏重，但大企业存量还在，别人说我们是 Angular你要听得懂。另外还有 Svelte；以及
      React 再加服务端渲染的 Next.js——官网、内容站、电商很常见。小页面呢，不用框架完全够用，你们 第三天 的 index.html 就是。

      再说 App。苹果原生是 Swift，安卓原生是 Kotlin——性能跟系统能力最全，代价是两套代码、两拨人。小团队要做双端、求体验一致呢，很常看 Flutter。会 React 的团队转 App，可以走 React Native，包一层壳接到原生。若还要顺带出小程序等多端，国内团队常看
      uni-app 这条路。

      小程序这块，做国内生意绕不开。微信原生是 WXML、WXSS、JS，能力最全最稳。要微信、支付宝、抖音再加 H5、App，就看 Taro 或者 uni-app。桌面软件呢，很多用 Electron——VS Code、飞书都是它包的，前端团队零门槛，代价是包大、吃内存。要轻量，看
      Tauri 这类路线。

      记住两步法。第一步定平台：用户在哪用你？浏览器、应用商店、微信里、还是桌面图标。第二步选框架，四个问题按顺序问：团队会什么？生态大不大？AI 写得好不好？项目有多大？兜底呢——没团队跟生态走，有团队跟团队走。AI 时代还有个隐藏加分：React
      这类语料多的技术，生成质量更稳，对吧。

      回扣一下你们 第三天。周报助手是 Web 单页，不用框架当时就是正确答案。哪天要变成手机 App 呢？团队会 React，可以 React Native；要双端长得齐，看 Flutter；还要小程序多端，就看 uni-app 或者
      Taro。今天把那一格，填进整张前端地图里。

      好，本节小课就到这里了，收个尾。带走一句话：前端不只是网页——先想清楚用户在哪儿用你，再谈选什么武器。下一节，咱们讲后端那一侧。'
    practice: '**「给三个场景选武器」**：为下面三个场景各选一个前端方案（可以是「不用框架」），并用四问中的一到两问说明理由：

      1. 市场部下周要一个活动报名页，就用一次；

      2. 公司要做一个三十个页面的内部管理系统，前端只有一位会 Vue 的实习生；

      3. 你要做一个长期打磨、准备对外发布的 AI 写作工具，团队还没招人。


      完成标志：

      [ ] 三件套比喻能完整复述

      [ ] 五个选项（含「不用框架」）各能说一句画像

      [ ] 三个场景的选择都有「四问」依据，不是拍脑袋'
    resource_ids:
    - dg-fe-map
    - h5-tech
    tools:
    - name: 三件套比喻卡
      note: 骨架 · 皮肤 · 肌肉
    quiz:
    - - 「前端」的完整范围是？
      - - 只做网页
        - 用户直接接触的界面层：Web 网页 / App / 小程序 / 桌面软件
        - 只写 HTML 的人
      - 1
      - 三件套只是 Web 那一支的地基——选型第一步是先定平台。
    - - 「AI 最会写、网上答案最多」是选 React 的核心理由，它属于四问中的哪一问？
      - - 团队会什么
        - 生态大不大（含 AI 生成质量）
        - 项目有多大
      - 1
      - 生态=遇坑有答案+招得到人+AI 写得稳——React 目前占优。
    - - 要做 iOS 和 Android 两端、团队小、想一套代码，选哪条 App 路线？
      - - 原生 Swift + Kotlin
        - Flutter 或 React Native（跨端）
        - Electron
      - 1
      - 原生要养两套代码两拨人；跨端一套代码出两端——小团队默认跨端。
    - - 团队只有一个会 Vue 的实习生，却要做三十页的内部系统，最合理的选择是？
      - - React，因为生态最大
        - Vue，因为团队会什么优先
        - Angular，因为页面多
      - 1
      - 四问按顺序：团队会什么是第一问——学习成本是真实成本。
    - - Angular 最典型的使用场景是？
      - - 个人尝鲜小项目
        - 大企业的长期巨型项目
        - 一次性活动页
      - 1
      - 全家桶+严规矩，十年后来的人也能按同一套规矩接手——大货车不跑菜市场。
    - - 「框架是项目长大了才需要的装备」意味着？
      - - 小项目用框架显得专业
        - 项目变大（多页面/多人/接真实数据）再引入框架不迟
        - 框架永远不需要
      - 1
      - 不是出门必背的包——你们 Day 3 不用框架就是当时的正确答案。
    - - 做国内「扫码即用、不用下载」的点单应用，选什么平台和框架？
      - - App：原生 Swift
        - 小程序：微信原生；要多端就 Taro / uni-app
        - 桌面：Electron
      - 1
      - 轻量+借微信流量→小程序；微信原生最稳，多端用 Taro/uni-app。
    media:
    - kind: video
      title: 口播课件 · 前端技术地图
      object_key: documents/shared/course-media/day05-c4-frontend.mp4
      poster_key: documents/shared/course-media/day05-c4-frontend-poster.jpg
      duration_sec: 249
    knowledge_cards:
    - id: fe-four
      term: 前端四大平台
      plain: Web 网页、手机 App、小程序、桌面软件——用户「摸」到的都算前端。
      tag: 地图
    - id: fe-framework
      term: 前端框架
      plain: React/Vue/Angular/Svelte 等：帮你组织页面与状态，不是唯一正确答案。
      tag: 选型
    - id: native-vs-cross
      term: 原生 vs 跨端
      plain: 原生两套（iOS/Android）体验最好；跨端用一套代码换效率。
      tag: 选型
    - id: mini-program
      term: 小程序
      plain: 长在微信等超级 App 里的轻应用——安装成本接近零。
      tag: 平台
    - id: fe-four-q
      term: 选型四问
      plain: 用户在哪打开？要不要商店？团队会什么？AI 写这类代码熟不熟？
      tag: 方法
    - id: day3-link
      term: 回扣 Day 3
      plain: 你做过的页面/交互，就是前端地图上的一格——今天把格填进整张图。
      tag: 连接
    glossary_terms:
    - id: gt-frontend
      term: 前端
      plain: 用户直接看见、摸到的那一层界面与交互。
    - id: gt-react
      term: React
      plain: 目前最常见的 Web 前端库之一；生态大，AI 也很熟。
    - id: gt-vue
      term: Vue
      plain: 另一条主流 Web 框架路线，上手曲线通常更平。
    - id: gt-spa
      term: SPA
      plain: 单页应用：页面不整页刷新，靠前端路由切换视图。
    - id: gt-electron
      term: Electron
      plain: 用网页技术包一层壳，做成桌面软件的常见方案。
