          <text x="954" y="26" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#1400ff" style="font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">▼ 你在这里</text>
