<text x="520" y="160" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#0f766e">POST /api/kpi/summary</text>
<rect x="360" y="177" width="64" height="22" rx="11" fill="rgba(13,148,136,.09)"/>
<text x="392" y="192" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#0f766e">请求 →</text>
<text x="440" y="192" font-family="'SF Mono',Menlo,monospace" font-size="12.5" fill="#0f766e">{ "month": "2026-07" }</text>
