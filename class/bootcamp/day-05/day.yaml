      detail: 先搞清问题、对齐样子，再让 AI 写、你来验；上线后还要分清「修」和「做新功能」。
      tag: 核心
    - id: research-methods
      term: 调研四法
      plain: 访谈、观察、问卷、竞品体验——能看行为先看，嘴上说的用来补「为什么」。
      tag: 方法
    - id: ask-last-time
      term: 问「上一次」
      plain: 访谈忌问「好不好」；问上一次怎么处理，人才不撒谎。
      tag: 技巧
    - id: prototype-cheap
      term: 改图便宜改码贵
      plain: 原型确认是为了把纠错成本压在「改图」阶段。
      tag: 原则
    - id: uat
      term: UAT
      plain: 上线前用接近生产的环境让真实用户先用一阵再正式放量。
      tag: 术语
    - id: waterfall-agile
      term: 瀑布 vs 敏捷
      plain: 瀑布一次规划死再走完；敏捷切小块，每块都快速走完全流程并交付。
      detail: 你前四天每天一个交付、每天验收——就是敏捷。
      tag: 节奏
    glossary_terms:
    - id: gt-sdlc
      term: 软件开发流程
      plain: 从「用户有问题」到「大家能用还能继续改」的固定工程动作链。
    - id: gt-prd
      term: PRD
      plain: 需求调研的产出：用户故事 + 验收标准——你 Day 1 写过。
    - id: gt-ops-boundary
      term: 运维边界
      plain: 修缺陷/约定内优化可走运维；新模块新流程是新需求，另算。
    - id: gt-observe
      term: 观察法
      plain: 看行为不看表态——食堂看倒掉什么，比问「好不好」靠谱。
    - id: gt-iterate
      term: 迭代
      plain: 上线不是终点；收集使用问题，再走一小圈六站。
    quiz:
    - - 软件旅程六站的正确顺序是？
      - - 开发→需求调研→上线→验收
        - 需求调研→原型确认→开发→测试验收→上线→迭代
        - 原型→开发→调研→上线
      - 1
      - 先搞清楚做什么，出样品，做出来，验货，放出去，再回来改。
    - - 访谈用户时，最该问的是？
