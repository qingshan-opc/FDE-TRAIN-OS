      codex_prompt: ''
      checklist:
      - 四大路线各能说一句画像（谁在用、为什么）
      - 三个场景的选择都含语言 + 框架 + 数据库三件套，且理由说得出口
      - 能解释为什么 API_Spec.md 可以在没定语言之前就写好
quiz:
  pass_rate: 0.67
  questions:
  - q: 六次技术浪潮的共同规律是？
    options:
    - 每次都让程序员变贵
    - 每波压低一层「动手做」的成本，抬高「判断与验收」的价值
    - 每次都发明一种新语言
    answer: 1
    explain: 第 1 节：浪潮不淘汰人，淘汰只会动手的人。
  - q: 「AI 是认字的实习生」意味着你最该练的两件事是？
    options:
    - 打字更快、加班更多
    - 把任务说清楚（定方向）、判断交付对不对（做验收）
    - 背更多框架 API
    answer: 1
    explain: 第 1 节：这两件事 AI 替代不了，所以变贵。
  - q: 「会写」变便宜的直接证据是？
    options:
    - 程序员都失业了
    - 你 Day 3 的 index.html 大头由 AI 生成，你负责定方向和验收
    - 键盘销量下降
    answer: 1
    explain: 第 1 节：写趋零成本，判断与验收才是你的位置。
  - q: 企业数字化五阶段的正确顺序是？
    options:
    - Agent 化 → 智能化 → 网络化 → 数字化 → 信息化
    - 信息化 → 数字化 → 网络化 → 智能化 → Agent 化
    - 数字化 → 信息化 → 网络化 → Agent 化 → 智能化
    answer: 1
    explain: 常见升级路径：先电子化，再数据化，再联网，再模型，再能执行。
  - q: 「KPI 进库、驾驶舱有真数据」主要对应哪一阶段？
    options:
    - 信息化
    - 数字化
    - Agent 化
    answer: 1
    explain: 数字化：数据有地址——Day 4 的表结构在这一层。
  - q: 「API 契约、前后端对话」主要对应哪一阶段？
    options:
    - 网络化
    - 信息化
    - 智能化
    answer: 0
    explain: 网络化：系统之间能对话——Day 3 的 API_Spec 在这。
  - q: 访谈用户最需要避免的问题是？
    options:
    - 上一次你遇到这个问题是什么时候
    - 你觉得这个功能好不好
    - 你现在是怎么凑合解决的
    answer: 1
    explain: 第 2 节：「好不好」得到客气话，「上一次」得到真话。
  - q: 「先出原型再开发」省钱的原理是？
    options:
    - 原型开发工资低
    - 纠错成本随阶段指数上涨——改图十分钟，改程序十天
    - 原型可以重复利用
    answer: 1
    explain: 第 2 节：样板间逻辑——越早确认越便宜。
  - q: 你前四天「每天一个交付、每天一次验收」属于哪种开发方式？
    options:
    - 瀑布
    - 敏捷
    - 无流程
    answer: 1
    explain: 第 2 节：切成小块、每块快速走完全流程——你已经用身体记住了敏捷。
  - q: 容器（Docker）解决的核心问题是？
    options:
    - 服务器闲置浪费
    - 程序搬家散架——「在我电脑上能跑，到你那就不行」
    - 容器太多管不过来
    answer: 1
    explain: 第 3 节：标准集装箱，箱子在哪哪就能跑。
  - q: 部署管线五步的正确顺序是？
    options:
    - 访问 → 运行 → 镜像 → 构建 → 代码
    - 代码 → 构建 → 镜像 → 运行 → 访问
    - 镜像 → 代码 → 构建 → 运行 → 访问
    answer: 1
    explain: Git 是唯一事实源；构建打包；镜像冻结环境；运行 7×24；公网 URL。
  - q: Serverless 的「从买车到打车」意味着？
    options:
    - 所有人都不需要服务器了
    - 零运维起步、按用量付费，没人用就不花钱
    - 只能做打车软件
    answer: 1
    explain: 第 3 节：不是没有服务器，是云厂商全包了。
  - q: 三人的部门小工具为什么不直接上 K8s？
    options:
    - K8s 不安全
    - K8s 是给几千个容器准备的——三箱货不该建深水港
    - K8s 不支持 Python
    answer: 1
    explain: 第 3 节：选型的本质是匹配规模，不是追高级。
  - q: 验证服务是否活着，应该敲？
    options:
    - curl localhost:8000/healthz
    - rm -rf /
    - chmod +x app
    answer: 0
    explain: 第 3 节：curl 是「敲服务的门」——200 就是「活着」。
  - q: 服务器出问题时，第一动作是？
    options:
    - 直接重启
    - tail -f 看实时日志，找它在说什么
    - 重装系统
    answer: 1
    explain: 第 3 节：先看日志再动手——日志是服务器在「说话」。
  - q: 「前端」的完整范围是？
    options:
    - 只做网页
    - Web 网页 / App / 小程序 / 桌面软件——用户直接接触的界面层
    - 只写 CSS 的人
    answer: 1
    explain: 第 5 节：选型第一步是先定平台。
  - q: 小团队要做 iOS+Android 两端、一套代码，选？
    options:
    - 原生 Swift + Kotlin
    - Flutter 或 React Native
    - Electron
    answer: 1
    explain: 第 5 节：跨端一套代码出两端；原生是两套代码两拨人。
  - q: 做国内扫码即用的点单应用，平台选什么？
    options:
    - 桌面软件
    - 小程序（微信原生；多端用 Taro/uni-app）
    - 必须先做 App
    answer: 1
    explain: 第 5 节：轻量 + 借微信流量 → 小程序。
  - q: 内部工具要做桌面版（双击图标那种），最省事的路线是？
    options:
    - Electron——网页技术包壳，前端团队零门槛
    - 原生 Swift + Kotlin
    - 微信原生小程序
    answer: 0
    explain: 第 4 节：VS Code、飞书都是 Electron 包的；对体积敏感再看 Tauri。
  - q: 后端地图里，Python 常见框架包括？
    options:
    - Django / Flask / FastAPI
    - Spring Boot / Struts
    - Gin / Echo only
    answer: 0
    explain: 列名单是为了认识地图——选型理由留到作业，课里不给建议。
  - q: ①两周原型 ②千万用户订单系统 ③向量相似推荐——数据库各选？
    options:
    - 全用 SQLite
    - ①SQLite ②PostgreSQL/MySQL ③PostgreSQL（向量插件）
    - 全用 Oracle
    answer: 1
    explain: 第 6 节：场景决定数据库——求快 / 求稳 / 求向量。
  - q: 「契约是合同，语言只是施工队」的意思是？
    options:
    - 先签 API 契约，实现语言后面再挑
    - 合同必须用 Java 写
    - 语言选好就不能改
    answer: 0
    explain: 第 6 节：API_Spec.md 与实现语言解耦——契约先行。
