  - id: c1
    title: 你不是从零开始：专业知识就是开发起点
    minutes: 10
    form: 认知+练习
    content_ref: class/bootcamp/day-01/section-01-confidence-domain/lesson.md
    content: '同学们好，今天先不讲代码，也不考你会不会数据库。我们先解决一个更重要的问题：你心里是不是有一句话——“我不是程序员，我真的能做软件吗？”如果有，非常正常。大多数第一次打开开发工具的人都会紧张，因为屏幕上全是没见过的按钮和文件。但今天我要先告诉你一个结论：你不是从零开始。你带进课堂的财务、HR、运营、销售、教育或其他专业经验，就是这个项目最重要的起点。


      AI 会写代码，会生成页面，也会整理文档，但它并不知道你们公司为什么每到月底就有人加班，不知道招聘漏斗里哪个数字最容易误导，也不知道一次运营活动到底应该看曝光还是转化。它可以很快地产出东西，却不知道什么问题值得解决、什么结果真正有用。恰好，这些是你懂的。所以今天不是让你跟
      AI 比谁写代码快，而是让你学会把自己的专业判断变成 AI 能执行的指令。


      看屏幕上的人机分工。你负责四件事：说清真实问题、选择第一版范围、确认业务规则、判断结果是否合格。AI 岗位智能体负责另外四件事：整理需求、设计页面、生成技术产物、根据反馈重做。听起来像不像你带一支团队？你不需要亲手完成每个岗位的制作工作，但你必须知道现在该找谁、给它什么、拿到结果后怎么验。


      举个财务例子。AI 可以很快画出一张费用趋势图，但“费用异常”到底是超过预算百分之十，还是比上月增长百分之二十？它不知道。这个判断来自财务经验。再看 HR，AI 可以画招聘漏斗，但哪个阶段停留七天就算超期，要由真正了解招聘流程的人确认。你的专业知识不是项目之外的背景材料，它就是系统里的规则。


      有同学可能会说：“可是我的领域很普通，没有高科技。”普通反而更适合做第一个项目。每天重复看数据、复制表格、追踪进度、向别人解释变化，这些工作都可以成为可视化系统。我们今天不追求一个改变世界的大平台，只找一个你熟悉、能说清、能判断的真实问题。项目越贴近你的日常，你越容易发现
      AI 做错了什么。


      还有一个边界要说清。今天做出的交互原型不等于完整上线系统。它更像装修前的样板间：门能点、流程能走、内容看得懂，但背后还没有正式接入数据库。为什么先做这个？因为方向错了，后面代码写得越多，返工越大。先用最低成本确认“做的是不是你要的”，这就是软件工程里的成熟做法，不是偷懒。


      现在请你做一个小盘点。写下你最熟悉的领域、这个领域里最常见的三类用户、你每天最常看的三种数据，以及一个你一眼就能判断对错的规则。比如“招聘岗位超过七天没有候选人进入面试就标红”，这就是可以交给 AI 的专业规则。写不满也没关系，我们下一节会把软件公司的完整流程铺开。


      最后带走一句话：不会写代码，不等于不会做软件。AI 时代，领域专家负责定义问题、做选择和验收，AI 负责把技术执行速度拉高。今天结束时，你会亲自指挥产品经理和 UI，把自己的专业问题变成一个能点击的系统原型。现在先把“我不懂开发”的担心放在一边，换成一句新的自我介绍：“我懂这个领域，我可以带
      AI 把它做出来。”'
    practice: '完成标志：

      [ ] 写明一个自己真正熟悉的专业领域

      [ ] 至少列出一类用户、一类数据和一条业务判断规则

      [ ] 能用一句话说出“我负责领域判断和验收，AI 负责技术执行”'
