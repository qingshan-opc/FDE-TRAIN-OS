<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="Agent 六词口诀">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">六词口诀 + 自检</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">SIX WORDS</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="80" y="84" width="280" height="68" rx="16" fill="url(#tlg)" filter="url(#tglow)"/>
<text x="100" y="114" font-size="15" font-weight="800" fill="#fff" font-family="'SF Mono',Menlo,monospace">Agent</text>
<text x="100" y="136" font-size="11" fill="rgba(255,255,255,.88)">决策环现场判断</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="380" y="84" width="280" height="68" rx="16" fill="url(#tlg)" filter="url(#tglow)"/>
<text x="400" y="114" font-size="15" font-weight="800" fill="#fff" font-family="'SF Mono',Menlo,monospace">Harness</text>
<text x="400" y="136" font-size="11" fill="rgba(255,255,255,.88)">模型之外的骨架</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="680" y="84" width="280" height="68" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="700" y="114" font-size="15" font-weight="800" fill="#231f20" font-family="'SF Mono',Menlo,monospace">Skill</text>
<text x="700" y="136" font-size="11" fill="rgba(35,31,32,.55)">会写字的岗位说明书</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="80" y="168" width="280" height="68" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="100" y="198" font-size="15" font-weight="800" fill="#231f20" font-family="'SF Mono',Menlo,monospace">MCP</text>
<text x="100" y="220" font-size="11" fill="rgba(35,31,32,.55)">工具的标准插座</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="380" y="168" width="280" height="68" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="400" y="198" font-size="15" font-weight="800" fill="#231f20" font-family="'SF Mono',Menlo,monospace">确认点</text>
<text x="400" y="220" font-size="11" fill="rgba(35,31,32,.55)">对外动作人工闸</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="680" y="168" width="280" height="68" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="700" y="198" font-size="15" font-weight="800" fill="#231f20" font-family="'SF Mono',Menlo,monospace">日志</text>
<text x="700" y="220" font-size="11" fill="rgba(35,31,32,.55)">每步留痕可追溯</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="170" y="262" width="700" height="40" rx="20.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="286.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">每条有你自己的实例 · 指一条，三十秒能讲给同桌听 · 下一站：概念抽测 + 认知卡</text></g>
</svg>
