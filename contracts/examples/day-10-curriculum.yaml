  - id: c3
    title: 再封装两个技能包
    minutes: 25
    form: 实战
    content_ref: class/bootcamp/day-10/section-03-two-more-skills/lesson.md
    content: '同学们，扩编开始。工具表从一件变三件，每件大概十三分钟。流程你们熟：倒序写、四部件、边界声明、工具描述——快在你已经会了，不是快在跳过部件，方法沉淀的红利就在这儿，对吧。

      两个新要点。第一，输入段写明上游——比如输入：Skill A 的输出 JSON，含 kpi 和 exceptions 数组。契约咬合就靠这一句，别写一些数据这种模糊话。咱们流水线最怕接口对不齐。

      第二，如果第三件是发送或通知类 Skill，步骤第一步必须是等待人工确认结果。边界里写死：未收到批准时，不执行，保持等待。工具描述的何时用也要写明——仅在人工确认通过后，对吧。

      最后四分钟做数据流对齐三查。A 的输出字段能不能喂饱 B？B 的草稿里有没有确认界面要的关键数字和风险标红？C 的输入从哪来——确认后的草稿加批准记录。查不到咬合点，第四节编排必卡，咱们别留坑，对吧。

      写不完两件也别硬撑：优先保证发送类那件，闸的训练价值最高。想封装的和串联图不一样？现在二选一，改图或改 Skill，图纸和施工必须一致。带走一句——三件齐了，咱们下一节真正串联，对吧。'
    practice: '完成标志：

      [ ] 两件均过自查五勾

      [ ] 对齐三查有书面结论

      [ ] 全部进 Git'
    resource_ids:
    - dg-orchestration
    tools:
    - name: Skill 边界模板
      note: 复用 Day 8 v1 结构
    quiz:
    - - 工具表 3 件每件必须包含？
      - - 只有名字
        - 说明书 + 边界声明 + 工具描述
        - 只有代码
      - 1
      - 和 Day 7-8 标准一致——可依赖的三件套。
    - - 再封装两个 Skill 为什么比第一个快？
      - - AI 变强了
        - 四部件 + 边界模板已练过，走同一套流程
        - 不需要验收了
      - 1
      - 第一个练信任，第二三个练吞吐——模板复用。
    - - 三个 Skill 怎么拆职责最稳？
      - - 三个 Skill 做同一件事，互为备份
        - 各管一段可验收步骤，输入输出契约能接上、描述不重叠
        - 全塞进一个超级 Skill
      - 1
      - 编排靠串联，不靠重复——重叠描述会害 Agent 选型。
    - - 第 2、3 个 Skill 可以省略边界声明吗？
      - - 可以，反正模板熟了
        - 不行——每件工具都要说明书 + 边界 + 描述，标准不降级
        - 只写代码就够
      - 1
      - 工具表扩容不能降工程标准——可依赖是逐件验收的。
