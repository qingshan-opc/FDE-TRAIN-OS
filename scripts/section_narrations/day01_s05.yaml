title: "第一天 · 第 5 节 · 把需求变成能点击的页面草图"
segments:
  - id: "01-open"
    ppt:
      - "眉题：01 OPEN · 文字变原型"
      - "需求全是文字 · 这一节要看得见、点得着"
      - "交互原型 · 确认结构和操作流程"
    text: |
      同学们好，我是你们的老师404。需求文档全是文字，这一节要把文字变成看得见、能点击的页面草图。行业里通常把这种用于确认结构和操作流程的页面叫“交互原型”。你只需要认识这个叫法，不需要学习设计软件。

  - id: "02-four-pages"
    ppt:
      - "眉题：02 PAGES · 四个页面"
      - "讲解图：day5-frontend-map.svg"
      - "01 · 管理看板"
      - "02 · 提交页"
      - "03 · 列表页"
      - "04 · 详情页"
      - "字段必须和 PRD 一致 · 不能自己加功能"
    text: |
      把已批准的需求文档交给页面设计师，让它做出四个页面：管理看板、提交页、列表页和详情页。字段必须和需求文档一致，不能自己增加功能。

  - id: "03-ai-reserved"
    ppt:
      - "眉题：03 AI SLOT · 给第二周留位置"
      - "详情页预留 · AI 分析区｜第二周接入"
      - "样例只能标「演示数据」"
      - "不能写成 AI 已经分析"
    text: |
      详情页要提前给第二周的 AI 能力留一块位置，文字写清“AI 分析区｜第二周接入”。如果放一段样例，只能标“演示数据”，不能写成 AI 已经分析。先让学员看懂能力现在处于什么状态，再考虑放什么按钮。

  - id: "04-click-test"
    ppt:
      - "眉题：04 TEST · 验收靠动手"
      - "□ 空着提交会不会提醒"
      - "□ 正常提交后列表会不会多一条"
      - "□ 点列表能不能进入详情"
      - "□ 没有数据时有没有清楚提示"
    text: |
      验收页面草图不能只看漂不漂亮，要亲手点：空着提交会不会提醒，正常提交后列表会不会多一条，点列表能不能进入详情，没有数据时有没有清楚提示。记住这句话：要求说意图，岗位守标准，验收靠动手；页面草图不是用来看的，是用来点的。

  - id: "05-close"
    ppt:
      - "本节交付 · 四页可点击原型"
      - "第一天验收 · GATE 1"
      - "七岗位 · 任务书 · PRD · 原型 · 形成交接链"
    text: |
      同学们，本节先到这里。第一天五节走完了：你选了真实问题，组建了七岗位团队，定下了五天计划，问出了 PRD，做出了能点的原型。回到平台完成本地实操和 GATE 1 验收。我们第二天见。
