camp_version: v0.7
day: 1
title: 组建你的 AI 项目团队
week: 1
project: 从真实问题到需求文档和可点击页面草图
project_brief: 学员以项目负责人身份，在 TRAE 中组建七岗位 AI 软件团队，选择与自己专业或工作相关的业务问题，依次指挥项目经理、产品经理和 UI/UX 设计师，完成项目任务书、PRD 与四页可点击原型。
review_checklist:
- 七岗位 Agent 均已创建，团队协作卡能说明岗位边界
- 项目任务书、PRD 和四页原型形成连续交接链
- PRD 与原型字段一致，P0 范围克制
- AI 区明确标注“Week2 接入”，所有样例标“演示数据”
- 学员至少完成一次拒绝或纠偏，而不是无条件接受 AI 产出
