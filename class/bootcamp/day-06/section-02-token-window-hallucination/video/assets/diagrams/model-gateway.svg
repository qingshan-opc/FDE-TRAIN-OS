<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="模型网关图">
<defs>
<marker id="gw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#231f20"/>
</marker>
</defs>
<rect width="1040" height="500" fill="#f2f5f0"/>
<text x="990" y="36" text-anchor="end" font-size="10.5" fill="rgba(35,31,32,.45)" style="font-family:'SF Mono',Menlo,monospace">Day 5 你亲手接这一层</text>
<!-- 驾驶舱 -->
<rect x="60" y="195" width="200" height="110" fill="#ffffff" stroke="#f24e54" stroke-width="2.5"/>
<text x="160" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#231f20">你的驾驶舱</text>
<text x="160" y="264" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.55)">摘要接口 · /api/summary</text>
<!-- 网关 -->
<rect x="360" y="140" width="280" height="220" fill="#ffffff" stroke="#1400ff" stroke-width="2.5"/>
<text x="500" y="174" text-anchor="middle" font-size="13" font-weight="800" fill="#1400ff" letter-spacing="2" style="font-family:'SF Mono',Menlo,monospace">模型网关 · GATEWAY</text>
<line x1="380" y1="188" x2="620" y2="188" stroke="rgba(35,31,32,.15)"/>
<g font-size="12" fill="#231f20" style="font-family:'SF Mono',Menlo,monospace">
<text x="392" y="218">· 密钥保管（只在服务端）</text>
<text x="392" y="250">· 限流 · 超时</text>
<text x="392" y="282">· 路由 · 降级</text>
<text x="392" y="314">· 计费 · 日志</text>
</g>
<!-- 三个模型 -->
<rect x="760" y="110" width="220" height="64" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="870" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231f20">闭源云 API</text>
<text x="870" y="158" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">GPT · Claude · Kimi（本课默认）</text>
<rect x="760" y="218" width="220" height="64" fill="#ffffff" stroke="#231f20" stroke-width="1.5"/>
<text x="870" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231f20">开源云托管</text>
<text x="870" y="266" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">Qwen · DeepSeek</text>
<rect x="760" y="326" width="220" height="64" fill="#ffffff" stroke="#231f20" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="870" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#231f20">本地推理</text>
<text x="870" y="374" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">Ollama · 数据不出门</text>
<!-- 箭头 -->
<line x1="262" y1="250" x2="354" y2="250" stroke="#231f20" stroke-width="1.8" marker-end="url(#gw-arrow)"/>
<line x1="642" y1="230" x2="754" y2="146" stroke="#231f20" stroke-width="1.8" marker-end="url(#gw-arrow)"/>
<line x1="642" y1="250" x2="754" y2="250" stroke="#231f20" stroke-width="1.8" marker-end="url(#gw-arrow)"/>
<line x1="642" y1="270" x2="754" y2="354" stroke="#231f20" stroke-width="1.8" marker-end="url(#gw-arrow)"/>
<!-- 底注 -->
<text x="520" y="434" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1400ff">换模型 = 换网关后面的牌子：应用代码一行不动</text>
<text x="520" y="462" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">铁律：密钥只住在服务端网关里 —— 绝不写进前端页面</text>
</svg>
