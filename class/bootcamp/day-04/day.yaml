      tag: 人工闸门
    glossary_terms:
    - id: gt-scope
      term: Test Scope · 测试范围
      plain: 本轮需要检查和明确不检查的功能边界。
    - id: gt-priority
      term: Priority · 优先级
      plain: 根据业务影响和发生可能性决定先检查什么。
    quiz:
    - - 测试计划的标准首先来自哪里？
      - - 测试人员个人喜好
        - PRD 和交付合同
        - 页面颜色
      - 1
      - 测试不能凭感觉判定，必须回到已经确认的约定。
    - - 计划中最应该优先检查什么？
      - - 字体细微差异
        - 启动失败、数据丢失和隐私风险
        - 所有项目随机排序
      - 1
      - 高影响风险应先测试，阻塞问题会直接拦住后续执行。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '继续使用 Day3 已接收文件的 @测试。必须逐段完成。


        【第 1 段｜检查六类输入】

        请读取 PRD.md、API_Spec.md、DB_Schema.md、RUNBOOK.md、backend-acceptance.md 和 backend-handoff.md。现在不要执行测试。缺少文件时只说明缺什么、应回到哪个岗位补齐。


        【第 2 段｜复述范围与风险】

        文件齐全后，请复述目标用户、核心主流程、关键业务规则、接口成功与错误、数据持久化、权限隐私和已知限制。再列出前三项发布风险。输出后停止。


        【第 3 段｜只列测试目录】

        请只列测试目录，依次包含启动与健康检查、页面主流程、接口成功与错误、数据保存与重启、加载空数据成功错误状态、权限隐私和 PRD 验收标准。每类写一句通过条件。现在不要展开用例。


        【第 4 段｜生成测试计划】

        目录已确认。请生成 test-plan.md。每条用例写编号、优先级、前置条件、操作步骤、预期结果、证据位置和主要责任岗位。标出冒烟测试和回归范围。保存后停止，等我回复“确认测试”。

        '
      checklist:
      - 六类 Day3 文件全部读取
      - 测试范围与 PRD 和接口合同一致
      - 发布风险已排序
      - 每条用例有操作、预期和证据位置
      - 学员检查计划后回复“确认测试”
      suggested_questions:
      - 已知限制也需要测试吗？
      - 页面与接口用例要不要分开？
      - 怎样判断什么是阻塞问题？
      template_resource_id: test-plan-card
    tools:
    - name: TRAE · @测试
      note: 先读取、复述、列目录、生成计划
    - name: PRD 验收标准
      note: 每条标准至少对应一条测试用例
  c3:
    resource_ids:
    - test-plan-card
    - testing-role-card
    media:
    - kind: video
      title: 口播课件 · 按计划执行并留下证据
      object_key: documents/shared/course-media/day04-c3-execute-tests-v2.mp4
      poster_key: documents/shared/course-media/day04-c3-execute-tests-poster-v2.jpg
      duration_sec: 174
    knowledge_cards:
    - id: smoke-first
      term: 先冒烟后全面
      plain: 先验证启动、健康检查和主流程，冒烟失败时停止后续测试。
      tag: 顺序
    - id: evidence-folder
      term: 证据目录
      plain: 截图、请求结果和日志按用例编号保存，结论能回到真实文件。
      tag: 可复现
    - id: actual-result
      term: 只记录实际结果
      plain: 不让测试智能体替学员想象执行结果，学员必须亲手运行并反馈。
      tag: 防假
    glossary_terms:
    - id: gt-precondition
      term: Precondition · 前置条件
      plain: 执行某条测试前必须先满足的环境和数据状态。
    - id: gt-evidence
      term: Evidence · 测试证据
      plain: 支持结论的截图、响应内容、日志或数据记录。
    quiz:
    - - 冒烟测试失败后应该怎样做？
      - - 继续执行全部用例
        - 停止并提交阻塞缺陷
        - 直接宣布发布通过
      - 1
      - 基础启动或主流程失败时，继续全面测试只会制造无效结果。
    - - 谁负责提供系统真实执行结果？
      - - 智能体想象
        - 学员亲手运行并记录
        - 产品经理猜测
      - 1
      - 测试结论必须来自真实运行，不能由 AI 虚构。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: 'test-plan.md 已经确认。继续使用 @测试，一次只执行一类。


        【第 1 段｜冒烟测试】

        请只给我冒烟测试步骤。依次检查服务启动、健康接口、前端打开和核心查询。每次只给一个操作和预期结果，等我反馈实际结果与证据后再继续。冒烟失败时停止。


        【第 2 段｜核心主流程】

        冒烟通过。请按 test-plan.md 引导我完成一次查询、一次提交、刷新后复查和一条 PRD 核心业务规则。每次只执行一条用例，并把实际结果追加到测试记录。


        【第 3 段｜接口与错误】

        请依次验证一个成功请求、缺少必填项、目标不存在和服务不可用。每次说明期望状态码与页面提示，等我反馈后再继续。


        【第 4 段｜数据与隐私】

        请引导我检查重启持久化、空数据状态、敏感信息是否出现在前端或日志，以及未授权访问的处理。不要制造危险数据，不要修改代码。


        【第 5 段｜汇总实际结果】

        请把我反馈的每条实际结果写入 test-run.md，包含用例编号、实际结果、证据路径和通过状态。失败项只记录，不修复。

        '
      checklist:
      - 冒烟测试先于全面测试
      - 学员逐条执行并反馈实际结果
      - 查询、提交、刷新和业务规则有证据
      - 成功与错误接口均已验证
      - 持久化、空状态和隐私均有记录
      - 失败项没有被测试岗位直接修改
      suggested_questions:
      - 截图和日志应该怎样命名？
      - 服务不可用怎样安全模拟？
      - 没有失败项是否正常？
      template_resource_id: testing-role-card
    tools:
    - name: test-evidence 目录
      note: 按用例编号保存截图、响应与日志
    - name: 浏览器请求面板
      note: 核对方法、路径、状态码和返回内容
  c4:
    resource_ids:
    - defect-card
    - agent-testing
    media:
    - kind: video
      title: 口播课件 · 缺陷归责、复测与回归
      object_key: documents/shared/course-media/day04-c4-defect-retest-v2.mp4
      poster_key: documents/shared/course-media/day04-c4-defect-retest-poster-v2.jpg
      duration_sec: 168
    knowledge_cards:
    - id: defect-eight
      term: 可复现缺陷
      plain: 编号、级别、责任岗位、步骤、预期、实际、证据和复测结果必须齐全。
      tag: 缺陷
    - id: one-owner
      term: 一个主要责任岗位
      plain: 请求与页面问题优先前端，响应、规则和存储问题优先后端。
      tag: 归责
    - id: fix-retest-regress
      term: 修复、复测、回归
      plain: 开发岗位修复，测试岗位验证原缺陷，再检查相关功能没有被破坏。
      tag: 闭环
    glossary_terms:
    - id: gt-severity
      term: Severity · 严重程度
      plain: 问题对用户和系统造成的影响等级。
    - id: gt-retest
      term: Retest · 复测
      plain: 使用原步骤再次执行，确认缺陷是否真的消失。
    - id: gt-release-candidate
      term: Release Candidate · 候选发布版本
      plain: 测试已通过、准备交给运维发布的确定版本。
    quiz:
    - - 谁负责修改测试发现的前端缺陷？
      - - 测试岗位
        - 前端岗位
        - 运维岗位
      - 1
      - 测试提交证据，责任开发岗位完成修复。
    - - 原缺陷复测通过后为什么还要回归？
      - - 增加报告长度
        - 检查修复是否破坏相关功能
        - 重新设计需求
      - 1
      - 局部修复可能影响其他流程，回归用于发现新的破坏。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '根据 test-run.md 处理失败项。严格保留岗位边界。


        【第 1 段｜只生成缺陷清单】

        @测试，请把失败项整理为 defect-log.md。每项写编号、严重程度、主要责任岗位、复现步骤、预期、实际、证据路径和建议方向。相同根因的重复现象合并。现在不要修改代码。


        【第 2 段｜逐个交给责任岗位】

        我选择缺陷编号 ______。请告诉我应切换到哪个岗位，并给该岗位一段只修这个缺陷的交接提示词。一次只处理一个缺陷。


        【第 3 段｜责任岗位修复】

        @责任岗位，请读取对应缺陷、PRD 和相关合同。先复述根因与改动范围，等我确认后只修这个问题。完成后列出修改文件和自检结果，不得把缺陷直接标为通过。


        【第 4 段｜回测试复测】

        @测试，请按原复现步骤复测该缺陷，记录实际结果与证据。通过后再执行受影响的回归用例。只有测试岗位可以更新复测状态。


        【第 5 段｜生成测试报告】

        所有阻塞缺陷已关闭。请生成 test-report.md，写明环境、执行范围、通过与失败数量、缺陷状态、回归结果、已知限制、发布风险和是否建议发布。建议发布时同时生成 release-candidate.md，记录当前版本和文件清单。

        '
      checklist:
      - defect-log.md 的每个问题可复现
      - 每个缺陷只有一个主要责任岗位
      - 修复前由学员确认改动范围
      - 原缺陷由 @测试 复测
      - 相关功能完成回归
      - test-report.md 有明确发布结论
      suggested_questions:
      - 严重程度和修复优先级一样吗？
      - 一个现象涉及前后端怎么办？
      - 什么缺陷可以作为已知限制发布？
      template_resource_id: defect-card
    tools:
    - name: 缺陷生命周期卡
      note: 发现、归责、修复、复测、回归、关闭
    - name: 发布闸门
      note: 阻塞缺陷关闭且核心流程回归通过
  c5:
    resource_ids:
    - agent-operations
    - deployment-card
    media:
    - kind: video
      title: 口播课件 · 运维接棒并制定发布计划
      object_key: documents/shared/course-media/day04-c5-operations-plan-v2.mp4
      poster_key: documents/shared/course-media/day04-c5-operations-plan-poster-v2.jpg
      duration_sec: 169
    knowledge_cards:
    - id: ops-role
      term: 运维的核心责任
      plain: 让确定版本可启动、可检查、可停止、可更新、可备份和可回退。
      tag: 岗位
    - id: ops-shift
      term: 运维岗位价值上移
      plain: AI 能生成部署命令，人更要管理环境差异、密钥、可观测性、风险和回退决策。
      tag: AI 时代
    - id: deployment-gate
      term: 确认部署
      plain: 学员检查目标、环境变量、备份、健康检查和回退方案后，运维才执行发布。
      tag: 人工闸门
    glossary_terms:
    - id: gt-deployment
      term: Deployment · 部署
      plain: 把已经测试通过的确定版本放到目标环境运行。
    - id: gt-env
      term: Environment Variable · 环境变量
      plain: 在代码外提供端口、路径或密钥等环境差异配置。
    - id: gt-observability
      term: Observability · 可观测性
      plain: 通过健康检查和日志知道系统是否正常以及哪里出错。
    quiz:
    - - AI 时代运维人员更重要的责任是什么？
      - - 复制更多命令
        - 管理环境、安全、日志和回退风险
        - 修改产品需求
      - 1
      - 命令生成变快后，人更要守住生产风险和恢复能力。
    - - 测试报告不建议发布时，运维应该怎样做？
      - - 继续部署
        - 停止并要求修复复测
        - 删除测试报告
      - 1
      - 运维只能接收通过发布闸门的候选版本。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '测试已经建议发布。现在切换到 @运维，只制定计划，不立即执行。


        【第 1 段｜检查发布输入】

        请读取 RUNBOOK.md、test-report.md、release-candidate.md、.env.example 和项目代码。先确认测试是否建议发布。缺少文件或存在未关闭阻塞缺陷时停止。


        【第 2 段｜逐题确认环境】

        请一次只问一个问题，依次确认发布目标、是否需要公开访问、环境变量、数据备份、端口、可接受停机时间和回退方案。每题给本地发布示例，等我回答后继续。


        【第 3 段｜生成发布计划】

        请生成 deployment-plan.md，包含准备条件、确定版本、执行步骤、环境变量、数据备份、健康检查、日志位置、停止方法、更新步骤、回退触发条件和回退步骤。现在不要执行。


        【第 4 段｜人工确认】

        请用五句话复述发布目标、数据保护、成功标准、失败信号和回退办法。输出后停止，等我本人回复“确认部署”。

        '
      checklist:
      - test-report.md 明确建议发布
      - 发布版本与 release-candidate.md 一致
      - 七类环境问题逐个确认
      - 真实密钥没有写入文件或对话证据
      - deployment-plan.md 包含停止和回退
      - 学员检查后回复“确认部署”
      suggested_questions:
      - 本地发布也需要备份吗？
      - 环境变量和 .env.example 有什么区别？
      - 什么情况必须回退？
      template_resource_id: agent-operations
