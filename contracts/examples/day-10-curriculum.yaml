  - id: c4
    title: 长跑任务机 + 人在回路确认闸
    minutes: 40
    form: 实战
    content_ref: class/bootcamp/day-10/section-04-orchestrate/lesson.md
    content: '同学们，施工开始。图纸在 orchestration.md，三件工具已经齐。现在三步：串联、装闸、记日志。顺序定死告诉 Agent，别让它现场改流程——咱们今天做的是 workflow，不是即兴表演，对吧。

      第一步串联：给 Agent 一条 workflow 指令，A 的输出喂给 B，B 的产出做成确认界面。第二步装闸：不可撤回的步骤前，Agent 必须停，把草稿、关键数字、风险标红摆在你面前，等你一个字——发，或者驳回，对吧。

      第三步记日志：每执行一步，往 runs/ 追加一行，时间、步骤、结果。指令里写清楚每步执行后追加到 runs/YYYYMMDD.md，Agent 来记，你负责抽查。能回放，才算有案底，对吧。

      跑通之后别急着走，两条路径都要实测。批准走一遍，驳回也走一遍——比如驳回：第二段数字不对，流水线得打回 B 重做，日志记下这次驳回。闸拦住一次不算本事，驳回了能退回重做还留下记录，咱们这条线才算有回路，对吧。

      最后两分钟，关掉屏幕别的窗口，只看 runs/ 日志，复述今天发生了什么。到闸停不停、批了动不动、驳回了回不回得来——三个验收点全绿，第五节闸口实测才有底气。带走一句，对吧。'
    practice: 按本节 practice.md 完成任务并达到完成标志。
    resource_ids:
    - dg-orchestration
    tools:
    - name: 流水线施工清单
      note: 串联图 / 数据流 / 闸位置 / 日志格式
    quiz:
    - - 确认闸应放在哪类步骤之前？
      - - 每一步
        - 不可撤回的步骤（对外发送/改数据/花钱）
        - 最快的步骤
      - 1
      - 可撤回的自动连跑——比例通常是 5 步 1 闸。
    - - 流水线跑到确认闸应该？
      - - 自动跳过
        - 自动停下等人；批准后继续；驳回有记录
        - 发邮件提醒
      - 1
      - 拦得住、回得来、查得了——GATE 9 三板斧。
    - - 不批准时 C 步骤能否执行？
      - - 可以，反正差不多
        - 绝不——不批准绝不执行不可撤回步骤
        - 看 Agent 心情
      - 1
      - 钥匙在你手里——这是信任的工程设计。
    - - orchestration.md 最少要写清什么？
      - - 只用画一张好看的图
        - 串联步骤 + 数据流 + 确认闸位置 + 日志格式
        - 模型厂商与价格表
      - 1
      - 编排文档是施工图——Day 10 证据与答辩都会翻它。
    - - 驳回路径「必须能退回重做」对应哪条验收？
      - - 只要批准路径通就行
        - 闸口驳回有记录、能退回、版本可追踪——不是只有绿灯
        - 驳回后自动强制执行
      - 1
      - 拦得住还要回得来——单侧幸福路径不算过闸。
