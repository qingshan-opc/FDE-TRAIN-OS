day: 3
project: AI 时代的前端
project_brief: 方向定了（Day 1 PRD）、骨架定了（Day 2 架构），今天做脸——用 UI/UX 与 Web 前端两份角色提示词，为「部门周报助手」生成高保真单页原型 index.html，并学会用设计规范四件套验收还原度：不手改产物，只改约束重生成。
resources:
- id: tk-web
  title: 提示词下载 · Web Client Agent（前端）
  kind: download
  summary: 整份粘进 AI 工具即用的前端提示词
  url: /course-assets/resources/prompt-toolkit/Web_Client_Agent_Prompt.md
- id: tk-uiux
  title: 提示词下载 · UI/UX Designer Agent（设计）
  kind: download
  summary: 高保真原型生成提示词，与前端提示词搭配使用
  url: /course-assets/resources/prompt-toolkit/UIUX_Designer_Agent_Prompt.md
- id: tk-spec
  title: 模板下载 · 设计规范四件套模板
  kind: download
  summary: 填空即用的 Design Spec 模板：颜色/字号/间距/圆角 + 交互三态
  url: /course-assets/resources/prompt-toolkit/Design_Spec_Template.md
capsule_extra:
  c1:
    resource_ids: []
    quiz:
    - - AI 时代前端角色的核心价值从什么转向了什么？
      - - 从写 CSS 转向手写更多页面
        - 从写页面转向定义还原度标准并验收
        - 从做界面转向做后端接口
      - 1
      - AI 接管了生产，人的瓶颈在判断与验收。
    - - 下面哪条是合格的验收意见？
      - - 这个页面差点意思
        - 整体风格再高级一点
        - '主按钮应为规范主色 #2563EB，实际用了 #3B82F6'
      - 2
      - 可验收的意见必须可量化、可对照。
    tools:
    - name: 还原度验收清单
      note: 「差点意思」必须翻译成可量化差距
    - name: 角色转变卡
      note: 从切图到还原度验收官
  c2:
    resource_ids:
    - tk-spec
    quiz:
    - - 设计规范四件套是？
      - - 颜色、字号层级、间距体系、圆角阴影
        - Logo、插画、字体、动效
        - 布局、栅格、图标、配图
      - 0
      - 四件套：颜色 / 字号层级 / 间距体系 / 圆角阴影。
    - - 为什么原型里严禁使用占位符文案？
      - - 占位符涉嫌版权问题
        - 假文案会掩盖真实排版问题，中文长度与英文差异会让布局上线才翻车
        - 占位符会降低页面加载速度
      - 1
      - 真实文案才能在原型阶段暴露真实版式问题。
    tools:
    - name: 三态检查单
      note: 默认 / 悬停 / 禁用，一个不能少
  c3:
    resource_ids:
    - tk-web
    - tk-uiux
    quiz:
    - - Web Client 提示词为什么规定「UI 先行、API 在后」？
      - - 后端接口通常还没开发完
        - 改界面成本低、改逻辑成本高，先冻结易变的视觉再写逻辑返工最少
        - 纯 UI 页面加载更快
      - 1
      - 两阶段划分的根本原因是修改成本不对称。
    - - 给 AI 的修改指令，哪条最有效？
      - - 标题再大一点，醒目些
        - 标题字号从 24px 调到 32px
        - 参考大厂的风格优化一下标题
      - 1
      - 具体、可量化的指令才能一次到位。
    tools:
    - name: 修改指令句式卡
      note: 不说「大一点」，说「标题 24 调到 32」
  c4:
    resource_ids:
    - tk-uiux
    - tk-web
    quiz:
    - - 生成的原型和规范差距明显，正确动作是？
      - - 打开 HTML 手动改代码
        - 换一个更强的 AI 模型重试
        - 把差距改写成量化约束补进提示词，重新生成
      - 2
      - 改约束重生成才永久生效，手改的产物下次生成即被覆盖。
    - - 今天生成 index.html 时要求「单文件、样式内联」的主要原因是？
      - - 单文件加载速度快
        - 单文件双击即可打开演示，不依赖构建工具与后端，符合阶段一（UI 优先）的定位
        - AI 一次只能输出一个文件
      - 1
      - 阶段一只要可演示的视觉蓝本，单文件是成本最低的可交付形态。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: "你是 FDE 训练营 Day 3 的前端原型引导员。学员正在本机用 AI 工具为「部门周报助手」生成高保真单页原型 index.html。\n请按以下顺序引导，一次只做一步，等学员完成再进下一步：\n\
        1. 先让学员定「设计规范四件套」：主色/辅助色/警示色（十六进制）、三级字号（像素值）、间距基准数（8 的倍数）、卡片与按钮圆角值。没有四件套，不许进入生成。\n2. 让学员把 UIUX_Designer_Agent_Prompt\
        \ 整份 + 四件套 + PRD 摘要 + 约束「只输出一个 index.html，样式内联，单文件可直接打开」粘进 AI 工具生成。\n3. 生成后引导两轮验收：\n   - 验收一「真实文案」：全页抽查三处文本，出现 lorem\
        \ ipsum、「示例文字」、灰块图任一即不达标；\n   - 验收二「三态样式」：检查主按钮是否有 hover 悬停样式和 disabled 禁用样式，缺一即不达标。\n4. 任一不达标：让学员把问题翻译成量化指令（如「标题字号从\
        \ 24px 调到 32px」），补进提示词后重新生成——严禁打开 HTML 手改。\n5. 两轮后达标，让学员写一行迭代日志：第一轮差在哪、改了什么约束、效果如何。\n"
      checklist:
      - 设计规范四件套已写成具体数值（无「好看」「大气」类词）
      - index.html 单文件双击可打开，含 hero 区 + 三个功能区块
      - 全页真实中文文案，无任何占位符
      - 主按钮默认 / 悬停 / 禁用三态样式齐全
      - 迭代日志至少一行
      suggested_questions:
      - 主色怎么选才不踩雷？给我一个效率工具的稳妥方案
      - AI 没按我的字号规范生成，约束该怎么写才够「量化」？
      - 禁用态按钮在静态页面上怎么展示才合理？
      template_resource_id: tk-uiux
    tools:
    - name: 真实文案检查单
      note: 无占位符 · 无 lorem ipsum
  c5:
    resource_ids: []
    quiz:
    - - 同学的原型里有一行灰色「示例文字，上线前替换」，按 GATE 3 应如何判定？
      - - 通过，占位文字不影响功能
        - 打回，违反真实文案标准，需改约束重生成
        - 通过，只要按钮三态齐全即可
      - 1
      - 真实文案是硬性过闸标准，出现占位符即打回。
    - - GATE 3 的原型过闸标准不包含哪项？
      - - 单文件可直接打开
        - 主按钮默认/悬停/禁用三态齐全
        - 页面已完成与后端 API 的数据联调
      - 2
      - 今天是阶段一（UI 优先），接数据是 Day 4 的事。
    tools:
    - name: 原型过闸清单
      note: 真实文案 · 三态样式 · 单文件可打开
    - name: 快测范围卡
      note: 考点全部来自今天前五节
quiz:
- - AI 一分钟能生成十个页面，此时前端最值钱的能力是？
  - - 更快地手写 CSS
    - 定义什么叫好并验收出来
    - 记住更多框架 API
  - 1
  - 生产不设上限后，瓶颈转移到判断与验收。
- - 验收师发现 AI 生成的页面「差点意思」，下一步最该做的是？
  - - 凭感觉让 AI 重做一版
    - 把「差点意思」翻译成可量化的差距（色值/字号/间距逐项对照规范）
    - 直接手动微调 HTML
  - 1
  - 不可验收的感觉必须先翻译成可对照的指标。
- - 「间距统一用 8px 的倍数：8/16/24/32」属于设计规范四件套中的哪一件，解决什么问题？
  - - 颜色——解决配色混乱
    - 间距体系——解决元素间距随手拍、全站不一致
    - 圆角阴影——解决卡片风格不统一
  - 1
  - 间距体系用基准数倍数保证全站节奏一致。
- - 「UI 先行、API 在后」的根本原因是？
  - - 前端工程师比后端工程师多
    - 改界面成本低、改逻辑成本高，先冻结视觉再写逻辑返工最少
    - 浏览器只能先渲染 UI 再请求数据
  - 1
  - 修改成本的不对称决定了两阶段的顺序。
- - 第 1 轮生成的原型主色不对，正确的修复路径是？
  - - 打开 index.html 把色值逐个改对
    - '在提示词中补充「主色必须为 #2563EB」后重新生成'
    - 放弃规范，接受 AI 的配色
  - 1
  - 改约束重生成；手改产物下次生成即被覆盖。
- - 关于 GATE 3 过闸标准，哪种说法正确？
  - - 页面必须已实现完整数据交互
    - 全页真实中文文案、无占位符，主按钮三态齐全，单文件可打开
    - 必须通过 W3C 全部校验且无一条警告
  - 1
  - 过闸四条：单文件可打开 / 真实文案 / 三态齐全 / 结构齐全。
lab:
  primary_files:
  - index.html
  prompt: "你是学员的前端原型助手。背景：FDE 训练营 Day 3，学员已有 PRD.md 与 architecture.md（部门周报助手），现在要做高保真单页原型 index.html。\n\n流程（严格按序）：\n1. 先读工作区的\
    \ PRD.md，提炼产品的价值主张与三个核心功能。\n2. 生成前先问学员 3 个澄清问题，拿到答案再动手：\n   - 主色偏好（若学员没主意，推荐一个效率工具的稳妥方案并给十六进制色值）；\n   - 三个功能区块分别放什么内容（对照\
    \ PRD 与学员确认）；\n   - 风格参考（明亮 / 暗黑 / 其他参考产品）。\n3. 引导学员定设计规范四件套：颜色（主/辅/警示，十六进制）、三级字号（像素值）、间距基准数（8 的倍数）、圆角值。无四件套不生成。\n4. 生成\
    \ index.html：单文件、样式内联于 <style> 标签、双击可直接打开；结构为 hero 区（价值主张 + 主按钮）+ 三个功能区块 + 页脚；全页真实中文成品文案；主按钮必须含 hover 悬停与 disabled 禁用两种状态样式。\n\
    5. 验收：发现占位符文案（lorem ipsum / 「示例文字」/ 灰块图）或缺失状态样式时，改提示词约束重新生成，严禁直接手改 index.html。\n"
  rubric:
  - check: file_exists
    args:
      path: index.html
  - check: text_contains
    args:
      path: index.html
      needle: <html
  - check: text_contains
    args:
      path: index.html
      needle: hover
nodes_lab: 高保真原型 index.html（部门周报助手）
