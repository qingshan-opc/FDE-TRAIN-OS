<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="软件开发全流程：需求调研到迭代">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
  <rect width="1200" height="460" fill="url(#dots)"/>
  <circle cx="1120" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="412" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">一个软件的完整旅程（六站）</text>
<text x="1164" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">FROM IDEA TO DAILY USE</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="48" y="92" width="172" height="196" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="134.0" y="122" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">STATION 1</text>
<text x="134.0" y="150" font-size="18" font-weight="800" fill="#231f20" text-anchor="middle">需求调研</text>
<text x="134.0" y="178" font-size="12" fill="rgba(35,31,32,.6)" text-anchor="middle">谁的什么问题？</text>
<text x="134.0" y="208" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">别问想吃什么</text>
<text x="134.0" y="230" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">看他剩什么</text>
<text x="134.0" y="268" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">访谈 · 观察 · 问卷 · 竞品</text>
</g>
<path d="M224 190 L244 190" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="250" y="92" width="172" height="196" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="336.0" y="122" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">STATION 2</text>
<text x="336.0" y="150" font-size="18" font-weight="800" fill="#231f20" text-anchor="middle">原型确认</text>
<text x="336.0" y="178" font-size="12" fill="rgba(35,31,32,.6)" text-anchor="middle">是这个意思吗？</text>
<text x="336.0" y="208" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">先出样板间</text>
<text x="336.0" y="230" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">再动工</text>
<text x="336.0" y="268" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">线框图 · 高保真原型</text>
</g>
<path d="M426 190 L446 190" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="452" y="92" width="172" height="196" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="538.0" y="122" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">STATION 3</text>
<text x="538.0" y="150" font-size="18" font-weight="800" fill="#231f20" text-anchor="middle">开发</text>
<text x="538.0" y="178" font-size="12" fill="rgba(35,31,32,.6)" text-anchor="middle">把样品变成真的</text>
<text x="538.0" y="208" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">你描述 · AI 写</text>
<text x="538.0" y="230" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">你盯着</text>
<text x="538.0" y="268" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">成本被压得最快的一站</text>
</g>
<path d="M628 190 L648 190" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="654" y="92" width="172" height="196" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="740.0" y="122" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">STATION 4</text>
<text x="740.0" y="150" font-size="18" font-weight="800" fill="#231f20" text-anchor="middle">测试验收</text>
<text x="740.0" y="178" font-size="12" fill="rgba(35,31,32,.6)" text-anchor="middle">说好的都做到了吗</text>
<text x="740.0" y="208" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">照单子验货</text>
<text x="740.0" y="230" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">不是「我觉得行」</text>
<text x="740.0" y="268" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">Rubric 清单 · 逐条打勾</text>
</g>
<path d="M830 190 L850 190" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="856" y="92" width="172" height="196" rx="16" fill="#fff" filter="url(#sh)"/>
<text x="942.0" y="122" font-size="10.5" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">STATION 5</text>
<text x="942.0" y="150" font-size="18" font-weight="800" fill="#231f20" text-anchor="middle">上线</text>
<text x="942.0" y="178" font-size="12" fill="rgba(35,31,32,.6)" text-anchor="middle">我这能跑→大家能用</text>
<text x="942.0" y="208" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">搬到一直开着的</text>
<text x="942.0" y="230" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">电脑上（下节）</text>
<text x="942.0" y="268" font-size="10.5" fill="rgba(35,31,32,.5)" text-anchor="middle">部署 · 上云</text>
</g>
<path d="M1032 190 L1052 190" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/></path>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="1050" y="84" width="146" height="212" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="1058" y="92" width="130" height="196" rx="16" fill="url(#tlg)" filter="url(#glow)"/>
<text x="1123.0" y="122" font-size="10.5" font-weight="700" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="2">STATION 6</text>
<text x="1123.0" y="150" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">迭代</text>
<text x="1123.0" y="178" font-size="12" fill="rgba(255,255,255,.8)" text-anchor="middle">回到第一站</text>
<text x="1123.0" y="208" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">上线不是终点</text>
<text x="1123.0" y="230" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">是起点</text>
<text x="1123.0" y="268" font-size="10.5" fill="rgba(255,255,255,.75)" text-anchor="middle">软件是改完的</text>
</g>
<path d="M1123 296 C1123 360 134 360 134 292" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="13" to="0" dur="1.1s" repeatCount="indefinite"/></path>
<path d="M134 288 L127 300 L141 300 Z" fill="#0d9488"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="48" y="392" width="556" height="48" rx="14" fill="rgba(35,31,32,.05)"/><text x="66" y="421" font-size="12.5" font-weight="700" fill="rgba(35,31,32,.65)">瀑布：先画好整栋楼图纸一口气装完——想得全，住进去才发现厨房不顺手</text><rect x="628" y="392" width="524" height="48" rx="24.0" fill="rgba(13,148,136,.10)"/>
<text x="890.0" y="420.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">敏捷：一周装修一间房，住进去再决定下一间——你前四天就是这么干的</text></g>
</svg>
