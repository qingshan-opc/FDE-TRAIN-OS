day: 1
project: 第一次指挥 AI 开发
project_brief: 学员从自己熟悉的财务、HR、运营、销售、教育或其他专业领域选择一个真实问题， 在 TRAE 创建产品经理、UI、前端、后端、测试、运维六个岗位智能体， 亲自完成“产品经理确认需求 → UI 生成交互原型 → 产品经理按原需求验收”的第一次软件工程交接。
  Day 1 的重点不是学习代码，而是建立完整开发流程、岗位边界、交接物和验收意识。
