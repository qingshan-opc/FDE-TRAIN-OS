day: 6
project: LLM 理论日
project_brief: 纯 LLM 理论日：把前五天「用过 AI」的体感升级为 18 词词典框架——生态四层、Token/窗口/幻觉、Prompt/Context/RAG、Eval/Guardrails/Vibe Coding、Agent/Harness/MCP/Workflow。产出个人
  LLM 认知卡 llm-cognition-card.md，18 词抽测 ≥12/18 过闸。无新 Lab。
