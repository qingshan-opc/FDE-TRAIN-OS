  <rect width="86" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="43" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">期待什么</text>
