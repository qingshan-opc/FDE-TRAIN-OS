# Day 02 — 线索落地页（web_dev 仿真）
camp_version: v0.3
day: 2
title: 页面交付与线索收集
project: 销售线索页

learn:
  lingzhi_tags: ["camp:v0.3", "day:2", "topic:web-landing"]
  knowledge_ids: []  # 由教研绑定灵知 ID
  estimated_minutes: 15

nodes:
  - type: learn
    title: 语义化页面与转化漏斗
  - type: quiz
    title: 移动端验收清单
    pass_rate: 0.8
  - type: lab
    title: 做一个线索收集落地页
  - type: project
    title: 企业任务：为销售部上线可访问预览页
  - type: review
    title: 自动测试 + AI 初审
  - type: unlock
    title: 更新能力并解锁次日

lab:
  sim_kind: web_dev
  adapter_version: "1.0"
  seed:
    template: lead-landing-starter
    files:
      - path: index.html
        content: "<!doctype html><html><body><h1>TODO</h1></body></html>"
      - path: styles.css
        content: "body{font-family:sans-serif}"
    diversify_by: learner_id
  ui:
    layout: editor_preview
  rubric:
    - check: dom_contains
      args: { selector: "form#lead", required: true }
    - check: dom_contains
      args: { selector: "button[type=submit]", required: true }
    - check: text_contains
      args: { path: index.html, needle: "cta" }
  coach:
    help_mode: explain
    skill_id: fde-coach
    allow_state_summary: true
    max_help_level: 2
