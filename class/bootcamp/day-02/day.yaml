day: 2
project: AI 时代的架构师
project_brief: 昨天你作为产品经理交出了 PRD.md——「部门周报助手」做什么、给谁用、怎么算成功。今天你换角色当架构师：读懂架构师提示词，在四问约束（团队/流量/迭代/运维）下做取舍，产出 architecture.md——架构风格与否决理由、四层分层图、3
  条 ADR。昨天定义做什么，今天决定怎么搭。
resources:
- id: tk-arch
  title: 提示词下载 · Architect Agent（架构师）
  kind: download
  summary: 整份粘进 AI 工具即用的架构师提示词
  url: /course-assets/resources/prompt-toolkit/Architect_Agent_Prompt.md
- id: tk-readme
  title: 提示词工具包 · 使用说明
  kind: download
  summary: 四要素 + 两接口
  url: /course-assets/resources/prompt-toolkit/README.md
- id: cs-arch
  title: 速查卡 · 架构选型四问与三种风格
  kind: doc
  summary: 团队人数 / 流量预期 / 迭代速度 / 运维能力四问 + 单体 / 微服务 / Serverless 一句话对比
  url: /course-assets/resources/cheatsheet-arch-selection.md
capsule_extra:
  c1:
    resource_ids:
    - tk-readme
    quiz:
    - - 同事说「我们要用业界最好的架构」，这句话错在哪？
      - - 架构没有绝对最好，只有是否匹配约束
        - 他应该说出具体技术栈名称
        - 最好的架构要等用户量大了再选
      - 0
      - 架构是约束下的取舍，脱离人/钱/时间/运维谈「最好」没有意义。
    - - ADR（架构决策记录）最核心记录的是什么？
      - - 为什么选择它、放弃了什么
        - 系统一共有几个模块
        - 每个接口的请求参数
      - 0
      - ADR 的灵魂是「为什么」——决策可被后人复审，而不是只留结论。
    tools:
    - name: 约束清单便签
      note: 团队 / 预算 / 时间 / 运维——取舍先列约束
    - name: ADR 一句话口诀
      note: 每个重要决定：背景 / 决策 / 理由 / 后果
  c2:
    quiz:
    - - 前后端分离里「菜单」指的是什么？
      - - 前后端之间的接口（API）约定
        - 前端页面的导航栏
        - 数据库的表结构
      - 0
      - 前后端只凭接口约定交流，接口稳定才能互不影响地各自演进。
    - - 把模型从 A 换成 B 时，哪几层原则上不用动？
      - - 前端和数据库
        - 接口和前端
        - 数据库和模型
      - 0
      - 分层红利是换内脏不换脸：模型被封装隔离，接口不变则前端、数据库都无感知。
    tools:
    - name: 四层架构口诀卡
      note: 前端看 · 接口传 · 数据库存 · 模型想
    - name: 「换内脏不换脸」案例卡
      note: 分层红利的最小例子
  c3:
    resource_ids:
    - cs-arch
    quiz:
    - - 3 人团队、内部 200 用户、无专职运维，默认应选？
      - - 单体
        - 微服务
        - Serverless 全家桶
      - 0
      - 小团队从最简单的可行架构开始；微服务的维护成本会吃掉全部人力。
    - - 什么时候应该重新评估「单体拆微服务」？
      - - 用户量或团队规模出现数量级增长等明确信号
        - 上线第一天就预留拆分
        - 听说大厂都在拆的时候
      - 0
      - 演进靠信号驱动，不为假想中的规模提前过度设计。
    tools:
    - name: 「最简单的可行架构」原则卡
      note: 小团队默认单体；出现明确信号再演进，不为想象的未来付复杂度
  c4:
    resource_ids:
    - tk-arch
    quiz:
    - - 架构师提示词工作流程的第 1 条是什么？
      - - 先提问澄清关键约束，再做设计
        - 先画分层图，再补文字
        - 直接生成 architecture.md 初稿
      - 0
      - 好提示词自己先反问约束——方案是被约束逼出来的，不是凭空生成的。
    - - AI 生成的 architecture.md 理由写的是「假设团队 5 人」，但你只有 1 人，该怎么办？
      - - 指出错误约束，补充真实情况让它重写
        - 手动把 5 改成 1 就交
        - 忽略，反正是细节
      - 0
      - 不手改产物、改约束重新生成——编造的约束是幻觉在文档里的形态。
    local_prep:
      skill_id: fde-local-prep
      codex_prompt: '你现在是我的架构设计搭档。请先把 /course-assets/resources/prompt-toolkit/Architect_Agent_Prompt.md 整份作为你的角色设定（如无法读取文件，让我粘贴给你）。

        背景：FDE 训练营 Day 2，我已在 Day 1 完成「部门周报助手」的 PRD.md（在工作区中）。昨天我定义了做什么，今天我要决定怎么搭。

        任务：先读 PRD.md，然后严格按你的工作流程执行——

        1. 先向我澄清 3 个约束问题：团队规模与能力、预期用户量与并发、运维条件（我没回答前不要动笔）；

        2. 基于我的回答生成 architecture.md，必须包含：架构风格选择 + 至少一个被否决方案及否决理由、四层分层图（前端/接口/数据库/模型，文字或 Mermaid）、3 条 ADR（每条含背景/决策/理由/后果）；

        3. 默认推荐最简单的可行架构，理由必须引用我给出的真实约束，禁止编造。

        完成后请自检：每条理由是否都能追溯到我回答的约束？

        '
      checklist:
      - 已把架构师提示词整份粘进本机 AI 工具
      - 已回答 AI 的 3 个澄清问题（团队/流量/运维），数字具体
      - architecture.md 已生成：风格 + 否决理由 + 分层图 + 3 条 ADR
      - 逐条核对 ADR 理由，无编造约束
      - 与 Agent Lab 版本对比过一次，记录差异
      suggested_questions:
      - 为什么你推荐单体而不是微服务？请引用我的约束回答。
      - ADR-002 数据库选型里，什么信号出现时要推翻这个决策？
      - 如果把预期用户量从 30 人改成 3 万人，架构会怎么变？
      template_resource_id: tk-arch
    tools:
    - name: ADR 四格模板
      note: 背景 / 决策 / 理由 / 后果，每条一页
  c5:
    quiz:
    - - 过闸时「架构风格有理由」的合格标准是？
      - - 理由引用了团队/流量/运维等真实约束
        - 理由里出现了「简单」二字
        - 理由超过 200 字
      - 0
      - 「简单」是性质不是理由；合格理由必须让约束出场。
    - - 今天的 architecture.md 在训练营里的下一站是？
      - - 作为 Day 3 前端设计的输入
        - 存档后不再使用
        - 交给运维部署
      - 0
      - 交付物逐日继承：今天的骨架是明天前端的地基。
    tools:
    - name: 架构过闸清单
      note: 风格有理由 · ADR 三要素齐 · 否决方案写明
    - name: 快测范围卡
      note: 考点全部来自今天前五节
quiz:
- - 架构师做决策时首先要做的是什么？
  - - 数清约束：人、钱、时间、运维能力
    - 调研最新的技术趋势
    - 画出完整的系统架构图
  - 0
  - 方案是被约束逼出来的——先数约束，再谈方案。
- - ADR 与一般技术文档最大的区别是什么？
  - - 它记录「为什么选、放弃了什么」，可复审
    - 它必须用英文写
    - 它只记录最终结论，方便阅读
  - 0
  - ADR 的灵魂是决策的理由与后果，不是结论本身。
- - 「换内脏不换脸」成立的前提是什么？
  - - 层与层之间的接口保持稳定
    - 使用同一种编程语言
    - 每层的代码量差不多
  - 0
  - 接口（菜单）稳定，各层才能独立替换、互不干扰。
- - 1 人团队、30 个内部用户、需求每周变、没人专职运维——架构选型的默认答案是？
  - - 单体，否决微服务并写明理由
    - 微服务，为未来规模预留
    - Serverless，因为完全不用运维
  - 0
  - 四问全部指向最简单的可行架构；微服务解决的是人多踩脚的问题。
- - 使用架构师提示词时，正确的节奏是？
  - - 让它先澄清约束，回答后再让它生成
    - 一次性要完整文档，减少来回
    - 先让它写代码，再补文档
  - 0
  - 先澄清再动笔——约束给得越具体，产出越准。
- - 你的周报助手上线后用户从 30 人涨到 3000 人，架构师应该？
  - - 按预案的演进信号重新评估对应 ADR
    - 立刻全量重写为微服务
    - 什么都不用做，架构一次到位
  - 0
  - 演进靠信号驱动：信号出现，复审当初写下的决策，而不是冲动重写。
lab:
  primary_files:
  - architecture.md
  prompt: '你是学员的架构设计助手。背景：FDE 训练营 Day 2「AI 时代的架构师」。学员已在 Day 1 完成 PRD.md（「部门周报助手」迷你 PRD），该文件在本工作区中；昨天学员定义了做什么，今天要决定怎么搭。

    任务：先读工作区的 PRD.md，再通过提问引导学员生成 architecture.md，内容包括：

    1. 架构风格选择（单体/微服务/Serverless）+ 至少一个被否决方案及否决理由；

    2. 四层分层图（前端/接口/数据库/模型，文字或 Mermaid 均可）；

    3. 3 条 ADR，每条含背景/决策/理由/后果。

    工作要求：

    - 动笔前先问 3 个澄清问题：团队规模与能力、预期用户量与并发、运维条件；学员未回答前不要生成文档；

    - 默认推荐最简单的可行架构（小团队默认单体），理由必须引用学员回答的真实约束，禁止编造约束；

    - 学员说「直接帮我写」时，也要先完成澄清再问其确认；

    - 生成后引导学员自检：每条理由能否追溯到真实约束？否决方案是否写明？ADR 后果是否包含「什么信号出现要推翻它」？

    - 产出保存为工作区的 architecture.md。

    '
  rubric:
  - check: file_exists
    args:
      path: architecture.md
  - check: text_contains
    args:
      path: architecture.md
      needle: ADR
  - check: text_contains
    args:
      path: architecture.md
      needle: 理由
nodes_lab: 架构设计 + 3 条 ADR（部门周报助手）
