<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="技术浪潮白话版：六次浪潮，每次重排谁值钱">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="#ffffff"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <circle cx="1120" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="352" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">六次浪潮 · 一张「谁变贵 / 谁变便宜」的价目表</text>
<text x="1164" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">SIX WAVES · PRICE LIST OF SKILLS</text>
</g>
<path d="M70 200 H1150" stroke="rgba(13,148,136,.3)" stroke-width="3" stroke-linecap="round"/>
<circle cy="200" r="5" fill="#0d9488"><animate attributeName="cx" values="70;1150" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.92;1" dur="8s" repeatCount="indefinite"/></circle>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="110" y="136" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">电脑进办公室</text>
<text x="110" y="158" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">1990s · 算盘</text>
<circle cx="110" cy="200" r="8" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="110" y="238" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">↑ 会把账搬进电脑的人</text>
<text x="110" y="262" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">↓ 算盘打得快的老手</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="290" y="136" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">店面搬上网</text>
<text x="290" y="158" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">2000s · 网页</text>
<circle cx="290" cy="200" r="8" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="290" y="238" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">↑ 会做网站的人</text>
<text x="290" y="262" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">↓ 只守实体店的人</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="470" y="136" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">云</text>
<text x="470" y="158" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">2010s · 电网</text>
<circle cx="470" cy="200" r="8" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="470" y="238" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">↑ 让服务不挂的人</text>
<text x="470" y="262" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">↓ 只伺候一台电脑的人</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="650" y="136" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">移动</text>
<text x="650" y="158" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">2010s · 口袋电脑</text>
<circle cx="650" cy="200" r="8" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="650" y="238" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">↑ 会做 App 的人</text>
<text x="650" y="262" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">↓ 只做电脑网页的人</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="830" y="136" font-size="15" font-weight="800" fill="#231f20" text-anchor="middle">AI 帮你写</text>
<text x="830" y="158" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">2021+ · 自己填的表格</text>
<circle cx="830" cy="200" r="8" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
<text x="830" y="238" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">↑ 一天压成一小时的人</text>
<text x="830" y="262" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">↓ 纯手工敲代码的人</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="940" y="96" width="226" height="186" rx="18" fill="rgba(13,148,136,.07)" stroke="rgba(13,148,136,.45)" stroke-width="1.5"/><text x="1053" y="128" font-size="17" font-weight="800" fill="#0f766e" text-anchor="middle">AI 原生</text><text x="1053" y="150" font-size="10" fill="rgba(35,31,32,.45)" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" letter-spacing="1">2024+ · 认字的实习生</text><rect x="1037" y="184" width="32" height="32" rx="16" fill="none" stroke="#0d9488" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/></rect><circle cx="1053" cy="200" r="10" fill="url(#tlg)" filter="url(#glow)"/><text x="1053" y="232" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">↑ 会派活、会验收的人</text><text x="1053" y="254" font-size="12" fill="rgba(35,31,32,.5)" text-anchor="middle">↓ 只会自己闷头写的人</text><text x="1053" y="276" font-size="12" font-weight="800" fill="#0d9488" text-anchor="middle">你在这里 →</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="48" y="314" width="1104" height="58" rx="29.0" fill="rgba(13,148,136,.10)"/>
<text x="600.0" y="339.0" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">规律只有一条：机器把「动手做」压低一层，人就往「知道该做什么、做得对不对」上移一层</text>
<text x="600.0" y="359.0" font-size="12" fill="rgba(35,31,32,.55)" text-anchor="middle">浪潮从不淘汰人——它只淘汰「只会动手」的人</text></g>
</svg>
