<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="后端四大语言路线">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">语言选边，框架是招牌</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">FOUR ROUTES</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="86" width="220" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="80" y="122" font-size="13.5" font-weight="800" fill="#231f20">Java · Spring Boot</text>
<text x="80" y="146" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">ENTERPRISE</text>
<text x="80" y="178" font-size="11" fill="rgba(35,31,32,.6)">大厂标配 · 银行电信核心主场</text>
<text x="80" y="202" font-size="11" fill="rgba(35,31,32,.6)">规矩全、能扛大场面</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="300" y="86" width="220" height="150" rx="18" fill="#fff" stroke="rgba(13,148,136,.5)" stroke-width="2" filter="url(#tglow)"/>
<text x="320" y="122" font-size="13.5" font-weight="800" fill="#0f766e">Python · FastAPI</text>
<text x="320" y="146" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">AI NATIVE</text>
<text x="320" y="178" font-size="11" fill="rgba(35,31,32,.6)">AI 的母语 · 自动出 OpenAPI</text>
<text x="320" y="202" font-size="11" fill="rgba(35,31,32,.6)">和 API_Spec 天生一对</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="540" y="86" width="220" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="560" y="122" font-size="13.5" font-weight="800" fill="#231f20">Node · Express/Nest</text>
<text x="560" y="146" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">FULLSTACK</text>
<text x="560" y="178" font-size="11" fill="rgba(35,31,32,.6)">前后端一门语言</text>
<text x="560" y="202" font-size="11" fill="rgba(35,31,32,.6)">小团队全栈一条顺路</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="780" y="86" width="220" height="150" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="800" y="122" font-size="13.5" font-weight="800" fill="#231f20">Go · Gin（+ Rust）</text>
<text x="800" y="146" font-size="9.5" font-weight="700" fill="#0d9488" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5">INFRA</text>
<text x="800" y="178" font-size="11" fill="rgba(35,31,32,.6)">快和省 · 网关与中间件</text>
<text x="800" y="202" font-size="11" fill="rgba(35,31,32,.6)">更底层常听到 Rust</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="262" width="600" height="40" rx="20.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="286.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">语言选边之后，框架只是招牌 —— 生态与团队才是关键</text></g>
</svg>
