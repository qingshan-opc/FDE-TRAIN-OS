<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-label="多 Skill 编排：发送动作前必须过人工确认闸，每一步写入执行日志">
  <defs>
    <linearGradient id="oc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="oc-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="oc-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="oc-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="oc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".45"/>
    </filter>
    <filter id="oc-glowR" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#e11d48" flood-opacity=".4"/>
    </filter>
    <marker id="oc-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#0d9488"/>
    </marker>
    <marker id="oc-arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1040" height="480" fill="#ffffff"/>
  <rect width="1040" height="480" fill="url(#oc-dots)"/>
  <circle cx="966" cy="70" r="96" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="96;112;96" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="430" r="72" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="72;84;72" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- header -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="36" y="20" width="6" height="24" rx="3" fill="#0d9488"/>
    <text x="52" y="38" font-size="17" font-weight="800" fill="#231f20">多 Skill 编排：确认点 + 日志 = 信任的工程设计</text>
    <text x="1004" y="38" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">ORCHESTRATION</text>
  </g>

  <!-- pipeline -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <g transform="translate(60,92)" filter="url(#oc-sh)">
      <rect width="180" height="108" rx="16" fill="#fff"/>
      <text x="90" y="30" text-anchor="middle" font-size="11" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5" fill="rgba(35,31,32,.45)">Skill A</text>
      <text x="90" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#231f20">拉取数据</text>
      <text x="90" y="86" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">只读 · 幂等 · 可自动跑</text>
    </g>
    <path d="M248 146 H292" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#oc-arr)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(300,92)" filter="url(#oc-sh)">
      <rect width="180" height="108" rx="16" fill="#fff"/>
      <text x="90" y="30" text-anchor="middle" font-size="11" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5" fill="rgba(35,31,32,.45)">Skill B</text>
      <text x="90" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#231f20">生成周报</text>
      <text x="90" y="86" text-anchor="middle" font-size="11.5" fill="rgba(35,31,32,.5)">产出文档 · 可自动跑</text>
    </g>
    <path d="M488 146 H532" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#oc-arr)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- confirm gate -->
    <g transform="translate(544,84)">
      <rect x="-8" y="-8" width="176" height="128" rx="26" fill="none" stroke="#e11d48" stroke-width="2" opacity=".4">
        <animate attributeName="opacity" values=".5;.12;.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect width="160" height="112" rx="18" fill="url(#oc-rose)" filter="url(#oc-glowR)"/>
      <text x="80" y="46" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">人工确认</text>
      <text x="80" y="72" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.88)">看一眼再放行</text>
      <text x="80" y="94" text-anchor="middle" font-size="10" font-family="'SF Mono',Menlo,monospace" letter-spacing="1" fill="rgba(255,255,255,.75)">HUMAN GATE</text>
    </g>
    <path d="M720 146 H764" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#oc-arrR)">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(800,92)" filter="url(#oc-sh)">
      <rect width="180" height="108" rx="16" fill="#fff"/>
      <text x="90" y="30" text-anchor="middle" font-size="11" font-family="'SF Mono',Menlo,monospace" letter-spacing="1.5" fill="rgba(35,31,32,.45)">Skill C</text>
      <text x="90" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#231f20">发送出去</text>
      <text x="90" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e11d48">对外动作 · 不可逆</text>
    </g>
  </g>

  <!-- execution log panel -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" transform="translate(60,248)" filter="url(#oc-sh)">
    <rect width="560" height="180" rx="16" fill="#fff"/>
    <text x="28" y="38" font-size="14" font-weight="800" fill="#231f20">执行日志（每步一条，可追溯）</text>
    <g font-family="'SF Mono',Menlo,monospace" font-size="13">
      <g opacity="0">
        <text x="28" y="72" fill="#0d9488" font-weight="700">✓</text>
        <text x="52" y="72" fill="#231f20">A: 拉取 42 条记录 · 用时 3.2s</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
      </g>
      <g opacity="0">
        <text x="28" y="106" fill="#0d9488" font-weight="700">✓</text>
        <text x="52" y="106" fill="#231f20">B: 生成 weekly-report-0524.md</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
      </g>
      <g opacity="0">
        <text x="28" y="140" fill="#e11d48" font-weight="700">⏸</text>
        <text x="52" y="140" fill="#e11d48">C: 等待人工确认（草稿已备好）</text>
        <animate attributeName="opacity" values="0;1;1;.45;1" keyTimes="0;.12;.6;.78;1" begin="1.8s" dur="3s" fill="freeze"/>
      </g>
      <text x="28" y="168" font-size="10" letter-spacing="1.5" fill="rgba(35,31,32,.35)">EXEC LOG · TRACEABLE</text>
    </g>
  </g>

  <!-- rule card -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" transform="translate(660,248)" filter="url(#oc-sh)">
    <rect width="320" height="180" rx="16" fill="#fff"/>
    <rect width="6" height="180" rx="3" fill="#e11d48" opacity=".85"/>
    <text x="28" y="38" font-size="14" font-weight="800" fill="#e11d48">编排铁律</text>
    <text x="28" y="72" font-size="13" fill="#231f20">只读步骤自动连跑；</text>
    <text x="28" y="100" font-size="13" fill="#231f20">任何「对外 / 写入 / 花钱」步骤前，</text>
    <text x="28" y="128" font-size="13" font-weight="700" fill="#231f20">必须插人工确认点并留日志。</text>
    <rect x="28" y="146" width="188" height="22" rx="11" fill="rgba(225,29,72,.08)"/>
    <text x="122" y="161" text-anchor="middle" font-size="10.5" font-family="'SF Mono',Menlo,monospace" letter-spacing="1" fill="#e11d48">GATE BEFORE WRITE</text>
  </g>
</svg>
