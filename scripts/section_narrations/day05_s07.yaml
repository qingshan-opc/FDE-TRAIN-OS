title: "第五天 · 第 7 节 · 验收：快测 21 题 + 理论地图过闸"
segments:
  - id: "01-gates"
    ppt:
      - "ACCEPT · 今日两关"
    text: |
      同学们，第一周的最后一道手续呢，就是验收。今天过两关：第一关快测，第二关理论地图。快测防的是「没学」，地图防的是「没连起来」——两关都过，这一周才算真正带走了，对吧。
  - id: "02-quiz"
    ppt:
      - "十八题，对十二过线"
      - "考理解，不考背诵。靠背答不出——说明那节还没真懂，回去看讲解图。"
    text: |
      第一关，快测二十一题，对十四题就算过线。范围呢，就是今天讲过的那些——世界观、五阶段、开发流程、服务器与云原生与部署、命令行、前端地图、后端地图，都在里头。提醒一句啊：所有题考理解，不考背诵。哪道题你只能靠背——说明那一节还没真懂，回去看讲解图，晚上补学，明天开课前再补测。
  - id: "03-map"
    ppt:
      - "六大主题 × 三条要点"
      - "每条要点配一个你自己前四天的实例——不许抄课件。「知道」和「带走」是两回事。"
    text: |
      第二关，理论地图。规格很清楚：七大主题——世界观、五阶段、开发流程、服务器与云原生与部署、命令行、前端地图、后端地图。每个主题写三条要点，每条要点呢，必须配一个你自己前四天的实例——PRD、架构、原型、接口契约都行，或者一句你自己的类比，不许抄课件。后端主题还要写你自己的选型理由——课上没替你选，地图里要交卷。
  - id: "04-pass"
    ppt:
      - "三样全过才算带走"
    text: |
      过闸标准说白了就三样：快测十二分之上；理论地图六大主题齐全、每条有你自己的实例；还有命令行仿真那八个任务，全部亲手敲过、打勾——不许复制粘贴。写完地图自己当验收官：随便指一条，三十秒能讲给同桌听吗？讲不顺的，改到讲顺为止。
  - id: "05-close"
    ppt:
      - "地图不是背下来的——是你亲手走过一遍之后，回头画下来的。"
      - "手里有作品，脑子里有网。第一周，毕业了。"
    text: |
      五天前，AI 对你们还是个黑话满天飞的陌生领域；今天，你手里有 PRD、有架构、有原型、有接口契约，脑子里有一张地图。带走一句话：地图不是背下来的——是你亲手走过一遍之后，回头画下来的。第一周，毕业了。
