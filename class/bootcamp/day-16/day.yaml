- - 旧流程没有任何时间记录，学员最合适的做法是？
  - - 凭经验估算后写成事实
    - 取消全部量化
    - 选择一批代表性任务补采基线，并注明回看或估算口径
    - 使用行业平均值替代
  - 2
  - 可以补基线，但要说明方法和局限。
- - 哪种周报最容易获得老板关注？
  - - 详细描述全部过程
    - 一页内写结论、三项证据、问题、需要决策和下周动作
    - 只报喜
    - 只发后台截图
  - 1
  - 周报服务于快速判断。
