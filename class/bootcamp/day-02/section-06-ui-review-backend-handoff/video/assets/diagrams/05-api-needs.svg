  <g transform="translate(250,238)">
  <animate attributeName="opacity" values=".12;1;1" keyTimes="0;.12;1" begin="0.45s" dur="2.6s" repeatCount="indefinite"/>
  <rect width="86" height="36" rx="18" fill="rgba(13,148,136,.09)" stroke="rgba(13,148,136,.28)" stroke-width="1"/>
  <text x="43" y="23.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">提交什么</text>
