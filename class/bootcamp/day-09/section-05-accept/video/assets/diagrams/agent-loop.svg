<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-label="Agent 决策环">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1040" height="500" fill="#ffffff"/>
  <rect width="1040" height="500" fill="url(#dots)"/>
  <circle cx="960" cy="70" r="110" fill="rgba(13,148,136,.07)">
    <animate attributeName="r" values="110;128;110" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="440" r="80" fill="rgba(35,31,32,.035)">
    <animate attributeName="r" values="80;94;80" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="36" y="14" width="6" height="22" rx="3" fill="#0d9488"/>
    <text x="52" y="31" font-size="15" font-weight="800" fill="#231f20">Agent 决策环：一圈一圈转</text>
    <text x="1004" y="31" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">DECISION LOOP</text>
  </g>

  <!-- orbit ring -->
  <circle cx="520" cy="252" r="182" fill="none" stroke="rgba(13,148,136,.35)" stroke-width="2" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#0d9488">
    <animateMotion dur="6s" repeatCount="indefinite" path="M520 70 a182 182 0 1 1 -0.1 0"/>
  </circle>
  <circle r="11" fill="none" stroke="#0d9488" stroke-width="1.5" opacity=".4">
    <animateMotion dur="6s" repeatCount="indefinite" path="M520 70 a182 182 0 1 1 -0.1 0"/>
    <animate attributeName="opacity" values=".5;.1;.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- center -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="370" y="210" width="300" height="88" rx="18" fill="url(#teal)" filter="url(#glow)"/>
    <text x="520" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">模型 + Harness（骨架）</text>
    <text x="520" y="272" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,.85)" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">工具表 · 记忆 · 规划 · 重试 · 日志</text>
  </g>

  <!-- five nodes -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <g>
      <circle cx="520" cy="70" r="30" fill="#fff" stroke="#0d9488" stroke-width="2" filter="url(#sh)"/>
      <text x="520" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">1</text>
      <text x="598" y="66" font-size="13.5" font-weight="800" fill="#231f20">理解任务</text>
      <text x="598" y="84" font-size="10.5" fill="rgba(35,31,32,.5)">读懂目标</text>
    </g>
    <g>
      <circle cx="693" cy="196" r="30" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#sh)"/>
      <text x="693" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">2</text>
      <text x="737" y="192" font-size="13.5" font-weight="800" fill="#231f20">规划</text>
      <text x="737" y="210" font-size="10.5" fill="rgba(35,31,32,.5)">拆步骤</text>
    </g>
    <g>
      <circle cx="627" cy="398" r="30" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#sh)"/>
      <text x="627" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">3</text>
      <text x="627" y="454" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">调用工具</text>
      <text x="627" y="472" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">调 Skill · Tool Calling</text>
    </g>
    <g>
      <circle cx="413" cy="398" r="30" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#sh)"/>
      <text x="413" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">4</text>
      <text x="413" y="454" text-anchor="middle" font-size="13.5" font-weight="800" fill="#231f20">观察结果</text>
      <text x="413" y="472" text-anchor="middle" font-size="10.5" fill="rgba(35,31,32,.5)">看结果对不对</text>
    </g>
    <g>
      <circle cx="347" cy="196" r="30" fill="#fff" stroke="rgba(35,31,32,.14)" stroke-width="1.5" filter="url(#sh)"/>
      <text x="347" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace">5</text>
      <text x="303" y="192" text-anchor="end" font-size="13.5" font-weight="800" fill="#231f20">继续 · 求助</text>
      <text x="303" y="210" text-anchor="end" font-size="10.5" fill="rgba(35,31,32,.5)">循环或交还人类</text>
    </g>
  </g>
</svg>
