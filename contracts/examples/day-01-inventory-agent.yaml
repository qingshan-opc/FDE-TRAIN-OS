# Day 01 — FDE 武器分发 + 库存系统启动（Agent 长任务）
camp_version: v0.3
day: 1
title: FDE角色认知与企业库存管理系统启动
project: 企业库存管理系统

learn:
  lingzhi_tags: ["camp:v0.3", "day:1", "topic:fde-role"]
  knowledge_ids: []
  estimated_minutes: 40
  steps:
    - FDE 是企业 AI 落地的「翻译官」：懂业务、能指挥 AI、能交付。
    - 全栈餐厅比喻：前端=服务员，后端=厨师，数据库=仓库。
    - 本周目标：先做出「虽笨但能用」的传统库存系统躯体。
    - 平台已发放服务端 Agent 工作区，无需本机安装 Docker。

quiz:
  pass_rate: 0.67
  questions:
    - q: 前端主要负责？
      options: ["界面与交互", "数据持久化", "容器编排"]
      answer: 0
    - q: 数据库更像餐厅的？
      options: ["服务员", "仓库", "菜单"]
      answer: 1
    - q: FDE 核心价值？
      options: ["背语法", "落地交付", "只调模型"]
      answer: 1

nodes:
  - type: learn
    title: FDE 角色与全栈视野
  - type: quiz
    title: 识别前端/后端/数据库职责
  - type: lab
    title: 用 Agent 生成库存列表页
  - type: project
    title: 企业任务：库存管理系统 Week1 启动
  - type: review
    title: 产物自检 + AI 初审
  - type: unlock
    title: 解锁 Day2

lab:
  runner: agent
  adapter_version: "1.0"
  agent:
    prompt_template: >
      在当前工作区生成企业库存管理系统的库存列表页：创建 index.html，
      包含标题「库存列表」、表格列 SKU/名称/库存/警戒线，以及至少 3 行示例数据。
      使用简洁 HTML+CSS，不要启动 Docker 或安装依赖。
  rubric:
    - check: file_exists
      args: { path: index.html }
    - check: text_contains
      args: { path: index.html, needle: "库存" }
    - check: text_contains
      args: { path: index.html, needle: "SKU" }
  coach:
    help_mode: explain
    skill_id: fde-coach
    allow_job_summary: true
    max_help_level: 2
