- - 项目价值较高，但关键数据授权需要两周完成。建议？
  - - 停止全部方向
    - 暂停敏感数据使用，以公开或脱敏样本做流程验证
    - 绕过授权
    - 伪造数据
  - 1
  - 可降级验证，同时守住权限。
- - 员工拒绝测试，原因是测试记录要重复录入两次。主要障碍是？
  - - 纯沟通
    - 流程与利益成本
    - 模型能力
    - 员工态度
  - 1
  - 重复工作直接降低采用。
