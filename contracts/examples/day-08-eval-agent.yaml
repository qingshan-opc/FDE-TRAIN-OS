# Day 08 — 评测、证据与 Passport（Agent）
camp_version: v0.3
day: 8
title: 自动评测、证据链与能力护照
project: Passport 说明与样例证据

learn:
  lingzhi_tags: ["camp:v0.3", "day:8", "topic:eval"]
  estimated_minutes: 40
  steps:
    - Rubric 把「感觉不错」变成可机器检查的条款。
    - Evidence 记录 job、产物与能力标签。
    - Passport 是可展示的能力证书，区分 sim / agent 轨道。
    - 今日：产出评测说明页，完成 Week2 中段闭环。

quiz:
  pass_rate: 0.67
  questions:
    - q: file_exists 检查的是？
      options: ["网络延迟", "工作区是否有指定文件", "GPU 型号"]
      answer: 1
    - q: Passport 主要用于？
      options: ["支付账单", "展示可验证能力", "替换 Git"]
      answer: 1
    - q: 评测失败时应？
      options: ["忽略继续 unlock", "对照 rubric 修复再交", "删库"]
      answer: 1

nodes:
  - type: learn
    title: Rubric 与证据
  - type: quiz
    title: Eval 速测
  - type: lab
    title: Agent 生成评测说明页
  - type: project
    title: 企业任务：可对外的能力证明页
  - type: review
    title: 证据链自检
  - type: unlock
    title: Week2 中段完成

lab:
  runner: agent
  agent:
    prompt_template: >
      创建 passport-guide.html：评测与护照说明。
      标题「Passport」，文案需含 rubric、evidence、Passport 三词，
      并列出 file_exists 与 text_contains。不要 Docker。
  rubric:
    - check: file_exists
      args: { path: passport-guide.html }
    - check: text_contains
      args: { path: passport-guide.html, needle: "Passport" }
    - check: text_contains
      args: { path: passport-guide.html, needle: "rubric" }
