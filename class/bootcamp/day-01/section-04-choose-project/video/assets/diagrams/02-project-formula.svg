<text x="381.5" y="182" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="800" fill="#0d9488">+</text>
<g transform="translate(394.5,148)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <rect width="95.0" height="56" rx="12" fill="url(#teal)" filter="url(#glow)"/>
      <text x="47.5" y="32.68" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">可视化结果</text>
      <animate attributeName="opacity" values=".55;1;1" keyTimes="0;.06;1" begin="0.8999999999999999s" dur="7.0s" repeatCount="indefinite"/>
