<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-label="技术演进时间线：六次浪潮">
  <defs>
    <linearGradient id="et-axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="et-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="et-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="et-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1040" height="310" fill="#ffffff"/>
  <rect width="1040" height="310" fill="url(#et-dots)"/>
  <circle cx="70" cy="260" r="72" fill="rgba(13,148,136,.05)">
    <animate attributeName="r" values="72;86;72" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- header -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="30" y="12" width="6" height="18" rx="3" fill="#0d9488"/>
    <text x="44" y="27" font-size="14" font-weight="800" fill="#231f20">技术演进 · 六次浪潮</text>
    <text x="1008" y="296" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="rgba(35,31,32,.4)">TECH WAVES</text>
  </g>

  <!-- axis -->
  <line x1="40" y1="150" x2="1006" y2="150" stroke="url(#et-axis)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1022 150 L1004 143.5 L1004 156.5 Z" fill="#2dd4bf"/>
  <circle r="4.5" fill="#0d9488">
    <animate attributeName="cx" values="40;1006" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.06;.92;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <!-- N1 -->
    <g>
      <text x="86" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">单机时代</text>
      <text x="86" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">DESKTOP</text>
      <circle cx="86" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
      <text x="86" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20" font-family="'SF Mono',Menlo,monospace">1990s</text>
      <text x="86" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">桌面程序 · 单机数据库</text>
      <text x="86" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">软件装在一台机器上</text>
      <text x="86" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">值钱 · 会写 C/S 软件</text>
    </g>
    <!-- N2 -->
    <g>
      <text x="260" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">Web 时代</text>
      <text x="260" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">WEB</text>
      <circle cx="260" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
      <text x="260" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20" font-family="'SF Mono',Menlo,monospace">2000s</text>
      <text x="260" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">浏览器 + 服务器</text>
      <text x="260" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">网站与电商爆发</text>
      <text x="260" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">值钱 · 会做网站</text>
    </g>
    <!-- N3 -->
    <g>
      <text x="433" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">云与移动</text>
      <text x="433" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">CLOUD·MOBILE</text>
      <circle cx="433" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
      <text x="433" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20" font-family="'SF Mono',Menlo,monospace">2010s</text>
      <text x="433" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">上云 · App · SaaS</text>
      <text x="433" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">软件变成在线服务</text>
      <text x="433" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">值钱 · 会运维与分布式</text>
    </g>
    <!-- N4 -->
    <g>
      <text x="607" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">云原生</text>
      <text x="607" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">CLOUD NATIVE</text>
      <circle cx="607" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
      <text x="607" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20" font-family="'SF Mono',Menlo,monospace">2015+</text>
      <text x="607" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">容器 · K8s · DevOps</text>
      <text x="607" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">微服务拆碎再编排</text>
      <text x="607" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">值钱 · 会架构</text>
    </g>
    <!-- N5 -->
    <g>
      <text x="780" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#231f20">AI 辅助</text>
      <text x="780" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">AI ASSISTED</text>
      <circle cx="780" cy="150" r="7" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
      <text x="780" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20" font-family="'SF Mono',Menlo,monospace">2021+</text>
      <text x="780" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">Copilot 补全代码</text>
      <text x="780" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">「写」的成本趋近于零</text>
      <text x="780" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">值钱 · 会用 AI 提效</text>
    </g>
    <!-- N6 hot -->
    <g>
      <text x="954" y="26" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#0d9488" font-family="'SF Mono',Menlo,monospace">▼ 你在这里</text>
      <text x="954" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#0d9488">AI 原生</text>
      <text x="954" y="86" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="rgba(35,31,32,.45)" font-family="'SF Mono',Menlo,monospace">AI NATIVE</text>
      <circle cx="954" cy="150" r="16" fill="none" stroke="#0d9488" stroke-width="1.6" opacity=".5">
        <animate attributeName="r" values="12;22;12" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;.08;.5" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="954" cy="150" r="10" fill="url(#et-teal)" filter="url(#et-glow)"/>
      <circle cx="954" cy="150" r="3" fill="#fff"/>
      <text x="954" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#231f20" font-family="'SF Mono',Menlo,monospace">2024+</text>
      <text x="954" y="214" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">Agent · Harness · MCP</text>
      <text x="954" y="234" text-anchor="middle" font-size="12" fill="rgba(35,31,32,.55)">人定目标，AI 执行</text>
      <text x="954" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">值钱 · 会指挥 AI</text>
    </g>
  </g>
</svg>
