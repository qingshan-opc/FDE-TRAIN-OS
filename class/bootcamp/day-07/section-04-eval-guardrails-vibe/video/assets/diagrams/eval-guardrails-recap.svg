<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-label="Eval、护栏与 Vibe 回顾">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>
  <rect width="1040" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="272" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">「我觉得还行」≠ 验收标准</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">RECAP · EVAL · GUARDRAILS</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="60" y="80" width="290" height="160" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="84" y="118" font-size="16" font-weight="800" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">Eval</text>
<rect x="84" y="132" width="60" height="4" rx="2" fill="#0d9488"/>
<text x="84" y="166" font-size="12.5" font-weight="700" fill="#231f20">Rubric 打分 · 逐条过</text>
<text x="84" y="194" font-size="11.5" fill="rgba(35,31,32,.55)">先定「怎么算好」，再让模型交卷</text>
<text x="84" y="216" font-size="11.5" fill="rgba(35,31,32,.55)"></text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="370" y="80" width="290" height="160" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="394" y="118" font-size="16" font-weight="800" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">Guardrails</text>
<rect x="394" y="132" width="60" height="4" rx="2" fill="#0d9488"/>
<text x="394" y="166" font-size="12.5" font-weight="700" fill="#231f20">异常按表处置</text>
<text x="394" y="194" font-size="11.5" fill="rgba(35,31,32,.55)">超时切断 · 降级不白屏 · </text>
<text x="394" y="216" font-size="11.5" fill="rgba(35,31,32,.55)">敏感转人工</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="680" y="80" width="290" height="160" rx="18" fill="#fff" filter="url(#sh)"/>
<text x="704" y="118" font-size="16" font-weight="800" fill="#0f766e" font-family="'SF Mono',Menlo,monospace">Vibe 编码</text>
<rect x="704" y="132" width="60" height="4" rx="2" fill="#0d9488"/>
<text x="704" y="166" font-size="12.5" font-weight="700" fill="#231f20">跑起来再调 · 小步验收</text>
<text x="704" y="194" font-size="11.5" fill="rgba(35,31,32,.55)">感觉可以写代码，验收不能靠感觉</text>
<text x="704" y="216" font-size="11.5" fill="rgba(35,31,32,.55)"></text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="266" width="600" height="38" rx="19.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="289.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">三件套备齐 —— 预告：Agent · Harness · MCP</text></g>
</svg>
