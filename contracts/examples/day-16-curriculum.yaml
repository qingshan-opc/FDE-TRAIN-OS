quiz:
  pass_rate: 0.67
  questions:
  - q: 老板问“你这个月做了什么”，哪种回答最合适？
    options: *id001
    answer: 1
    explain: 管理汇报先说明变化与证据。
  - q: AI生成时间从20分钟降到1分钟，但人工核验与返工需要15分钟。新流程总耗时应怎样记录？
    options: *id002
    answer: 2
    explain: 完整流程口径必须包含人工投入。
  - q: 哪项最适合作为质量证据？
    options: *id003
    answer: 2
    explain: 质量需要样本、口径和错误结构。
  - q: 哪项属于风险价值的可信证据？
    options: *id004
    answer: 1
    explain: 风险价值看控制覆盖与异常。
  - q: 销售额本月上涨10%，AI助手刚上线两周。应怎样表述？
    options: *id005
    answer: 2
    explain: 业务结果需要谨慎归因。
  - q: 一份知识库什么时候更接近组织资产？
    options: *id006
    answer: 2
    explain: 资产要可复用、可维护。
  - q: 旧流程没有任何时间记录，学员最合适的做法是？
    options:
    - 凭经验估算后写成事实
    - 取消全部量化
    - 选择一批代表性任务补采基线，并注明回看或估算口径
    - 使用行业平均值替代
    answer: 2
    explain: 可以补基线，但要说明方法和局限。
  - q: 哪种周报最容易获得老板关注？
    options:
    - 详细描述全部过程
    - 一页内写结论、三项证据、问题、需要决策和下周动作
    - 只报喜
    - 只发后台截图
    answer: 1
    explain: 周报服务于快速判断。
