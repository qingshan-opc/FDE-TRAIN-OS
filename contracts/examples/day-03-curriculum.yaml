      duration_sec: 201
    knowledge_cards:
    - id: backend-gate
      term: 后端过闸
      plain: 合同、健康检查、业务接口、持久化、错误处理、安全和联调证据全部通过。
      tag: 验收
    - id: runbook-handoff
      term: 运行手册交接
      plain: 测试人员按文档就能启动、检查、停止服务，不依赖开发者口头解释。
      tag: 可复现
    - id: test-receive
      term: 测试接收
      plain: 测试先读取需求、合同、运行手册和验收记录，Day4 再制定测试计划。
      tag: 下一棒
    glossary_terms:
    - id: gt-runbook
      term: RUNBOOK · 运行手册
      plain: 记录怎样启动、检查、停止和排查服务的操作文档。
    - id: gt-regression
      term: Regression · 回归
      plain: 修复后重新检查主要流程，确认旧功能没有被破坏。
quiz:
  pass_rate: 0.67
  questions:
  - q: 后端三件事是？
    options:
    - 结构、样式、行为
    - 规则、数据、接口
    - 需求、设计、部署
    answer: 1
    explain: 后端负责业务规则、数据存取和接口对话。
  - q: Day3 为什么先写 API_Spec.md 再写代码？
    options:
    - 为了增加文档
    - 为了让前端和后端使用同一字段与错误约定
    - 因为代码不能修改
    answer: 1
    explain: 先合同能避免双方各猜一套。
  - q: 数据库表中主键的作用是什么？
    options:
    - 控制颜色
    - 唯一识别一条记录
    - 启动服务
    answer: 1
    explain: 主键让每条记录可准确查询和修改。
  - q: 怎样证明 SQLite 数据已持久化？
    options:
    - AI 说已保存
    - 服务重启后仍能查询
    - 页面显示成功提示
    answer: 1
    explain: 重启仍存在是最直接证据。
  - q: 联调时前端请求路径与合同不一致，谁修改？
    options:
    - UI
    - 前端
    - 测试
    answer: 1
    explain: 请求由前端发出，因此前端按合同修复。
  - q: Day3 最终应该停在哪个状态？
    options:
    - 测试已经全部执行
    - 测试读取交付物并完成接收复述
    - 运维已经上线
    answer: 1
    explain: Day4 才开始测试，Day3 只完成测试接收。
