      term: Smoke Test · 冒烟测试
      plain: 先检查服务能否启动、核心页面能否打开和主流程能否走通。
    - id: gt-regression
      term: Regression Test · 回归测试
      plain: 修复后重新检查相关功能，确认没有引入新的问题。
    quiz:
    - - 测试岗位最重要的交付是什么？
      - - 替开发修改全部代码
        - 可复现的通过与失败证据
        - 让页面看起来更漂亮
      - 1
      - 测试负责依据合同提供证据，不越权代替开发。
    - - AI 能生成很多测试用例后，人更重要的工作是什么？
      - - 只看用例数量
        - 判断风险、边界和发布门槛
        - 自动宣布全部通过
      - 1
      - 用例多不等于覆盖关键风险，人要决定什么必须拦住发布。
    tools:
    - name: 证据四要素卡
      note: 条件、操作、预期、实际
    - name: 测试责任边界
