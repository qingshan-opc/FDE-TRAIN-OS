project_brief: '今天不交长文报告。请提交一份 LLM 认知卡 llm-cognition-card.md（Markdown 即可）。


  怎么做：

  1）打开资源「LLM 认知卡 · 搭档提示词」，整份粘进 AI，先回答它的 3 个问题，拿到六大主题骨架；

  2）每个主题写 2–3 条白话要点，每条必须配前五天真实交付物或自己的类比——不许只剩词典定义；

  3）主题固定：生态四层 / Token与幻觉 / Prompt与RAG / Eval与护栏 / Agent与Harness / Copilot vs Agent；

  4）上传 md 附件，复盘里写清「哪三条你现在能 30 秒讲给别人听」。


  过闸标准：六大主题齐全、每条有你的实例。18 词抽测在「概念验收」节点单独过。'
