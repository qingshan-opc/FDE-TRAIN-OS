<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" role="img" aria-label="你操心的机器越来越少">
  <defs>
    <linearGradient id="tlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.2" fill="rgba(35,31,32,.06)"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231f20" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0d9488" flood-opacity=".5"/>
    </filter>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0d9488" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1040" height="280" fill="#ffffff"/>
  <rect width="1040" height="280" fill="url(#dots)"/>
  <circle cx="960" cy="52" r="96" fill="rgba(13,148,136,.07)"><animate attributeName="r" values="96;114;96" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="232" r="66" fill="rgba(35,31,32,.035)"><animate attributeName="r" values="66;80;66" dur="11s" repeatCount="indefinite"/></circle>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="36" y="22" width="6" height="24" rx="3" fill="#0d9488"/><text x="52" y="40" font-size="17" font-weight="800" fill="#231f20">方向只有一个：你操心的机器越来越少</text>
<text x="1004" y="40" text-anchor="end" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="rgba(35,31,32,.4)">LESS TO WORRY</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="90" y="100" font-size="12.5" font-weight="700" fill="#231f20">桌底一台电脑</text>
<rect x="280" y="84" width="320" height="24" rx="12" fill="rgba(13,148,136,0.34)"/>
<text x="614" y="100" font-size="10.5" fill="rgba(35,31,32,.45)">操心</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="90" y="140" font-size="12.5" font-weight="700" fill="#231f20">集装箱 Docker</text>
<rect x="280" y="124" width="240" height="24" rx="12" fill="rgba(13,148,136,0.26)"/>
<text x="534" y="140" font-size="10.5" fill="rgba(35,31,32,.45)">操心</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="90" y="180" font-size="12.5" font-weight="700" fill="#231f20">自动码头 K8s</text>
<rect x="280" y="164" width="160" height="24" rx="12" fill="rgba(13,148,136,0.18)"/>
<text x="454" y="180" font-size="10.5" fill="rgba(35,31,32,.45)">操心</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="90" y="220" font-size="12.5" font-weight="700" fill="#231f20">打车 Serverless</text>
<rect x="280" y="204" width="80" height="24" rx="12" fill="url(#bar)" filter="url(#tglow)"><animate attributeName="opacity" values="1;.75;1" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="374" y="220" font-size="10.5" fill="rgba(35,31,32,.45)">操心</text>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><rect x="220" y="240" width="600" height="30" rx="15.0" fill="rgba(13,148,136,.10)"/>
<text x="520.0" y="259.5" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">下一节：去实验台，把八句命令真敲一遍</text></g>
</svg>
