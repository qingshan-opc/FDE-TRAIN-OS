    content_ref: class/bootcamp/day-16/section-01-show-value/lesson.md
    content: 本模块视频尚未上传。请先阅读重点卡与情境题干，视频上线后可回看补齐。
    tools:
    - name: 情境判断
      note: 先分清目标、角色、风险与下一步
    quiz:
    - - 老板问“你这个月做了什么”，哪种回答最合适？
      - &id001
        - 罗列全部会议和版本
        - 先说三项企业变化、证据和边界
        - 强调自己加班很久
        - 把问题推给其他部门
      - 1
      - 管理汇报先说明变化与证据。
    - - AI生成时间从20分钟降到1分钟，但人工核验与返工需要15分钟。新流程总耗时应怎样记录？
      - &id002
        - 1分钟
        - 15分钟
        - 16分钟，并继续加上资料准备和维护
        - 20分钟
      - 2
      - 完整流程口径必须包含人工投入。
    - - 哪项最适合作为质量证据？
      - &id003
        - 老板觉得不错
        - 生成了100份材料
        - 30份任务中24份首轮可用，6份重大改写，并记录错误类型
        - 模型评分很高
      - 2
      - 质量需要样本、口径和错误结构。
    - - 哪项属于风险价值的可信证据？
      - &id004
        - 本月没有事故
        - 24条任务中23条正确转人工，敏感数据保持在试点外
        - AI很安全
        - 员工说风险不大
      - 1
      - 风险价值看控制覆盖与异常。
    - - 销售额本月上涨10%，AI助手刚上线两周。应怎样表述？
      - &id005
        - AI带来10%增长
        - AI与收入无关
        - AI缩短了基础咨询响应，对销售过程提供支持，收入影响尚待验证
        - 把增长全部算给项目
      - 2
      - 业务结果需要谨慎归因。
    - - 一份知识库什么时候更接近组织资产？
      - &id006
        - 文档很多
        - 页面漂亮
        - 有真实使用、版本、更新责任和复用记录
        - 已经交付给老板
      - 2
      - 资产要可复用、可维护。
