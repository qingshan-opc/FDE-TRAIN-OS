day: 2
title: AI 时代的架构师
week: 1
project: AI 时代的架构师
project_brief: 昨天你作为产品经理交出了 PRD.md——「部门周报助手」做什么、给谁用、怎么算成功。今天你换角色当架构师：读懂架构师提示词，在四问约束（团队/流量/迭代/运维）下做取舍，产出 architecture.md——架构风格与否决理由、四层分层图、3
  条 ADR。昨天定义做什么，今天决定怎么搭。
review_checklist:
- 日级快测 6 题 ≥ 4 题合格
- architecture.md 存在，且写明架构风格选择 + 至少一个被否决方案及否决理由
- 3 条 ADR 每条三要素齐全：背景、决策、理由（含后果）
- 能口头回答：「你的周报助手为什么不是微服务？」——答不出理由视为未过闸
