  - id: c1
    title: 业务流程即编排
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-10/section-01-process-as-orchestration/lesson.md
    content: '同学们，先快答一句：Human-in-the-loop 就是关键步骤要人点头，AI 不能自己拍板。今天咱们把业务流程翻译成流水线，这叫编排。一件工具顶多算助手，一条串起来的流水线才算团队，对吧。

      拆分手法呢，对每一步问三个问题。第一，这步是执行还是判断？执行给 Skill，判断和放行人留着。第二，输入从哪来？A 的产出就是 B 的输入，数据流得画清楚。第三，这步错了能撤回吗？不能撤回的，前面必须装人工确认闸。

      咱们再强调一遍数据流。上一步吐什么格式，下一步就吃什么格式，中间对不齐，流水线一定卡。又是契约思想，第六次了嘛——编排不是堆 Skill，是让产出和输入咬合，对吧。

      看这条周报流水线：Skill A 拉 KPI 和异常，Skill B 生成草稿，这两步可以全自动连跑。发送之前呢，一个确认闸——你看一眼草稿，批准才发。为什么？消息发出去了就收不回，这个例子咱们后面还会用到。

      同学们，注意这是 workflow，步骤你定死，不依赖 Agent 现场瞎想。还记得第八天的铁律吗，能 workflow 别 agent。编排的意思就是：你当流程设计师，AI 当流水线工人。本节带走一句——把流程画成 Skill 串联图，第四节能直接施工，对吧。'
    practice: '完成标志：

      [ ] 串联图 3–5 步，每步三标注齐

      [ ] 确认闸位置经得起同桌追问

      [ ] 数据流无断点'
    resource_ids:
    - dg-workflow-agent
    tools:
    - name: 拆分三问卡
      note: 执行/判断 · 输入来源 · 可撤回性
    quiz:
    - - 编排（orchestration）的核心是？
      - - 让 Agent 自由发挥
        - 把业务流程拆成 Skill 串联，数据在步骤间流动
        - 写更多 Prompt
      - 1
      - 你定步骤顺序，AI 当流水线工人——这是 workflow。
    - - 拆分每一步首先要问？
      - - 用什么模型
        - 这步是「执行」还是「判断/放行」
        - 谁写的代码
      - 1
      - 执行 → Skill；判断/放行 → 人（确认点）。
    - - 「这步错了能撤回吗？」决定什么？
      - - 用什么数据库
        - 不可撤回的步骤前必须有人工确认闸
        - 用不用 Docker
      - 1
      - 发出去了就收不回——确认闸挡在「不可撤回」之前。
    - - A 的输出契约必须满足 B 的输入，体现什么思想？
      - - 契约先行（又一次）
        - 随机对接
        - 越厚越好
      - 0
      - 数据流格式要对齐——接口契约思想在编排里第三次出现。
