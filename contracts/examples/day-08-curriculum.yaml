  - id: c2
    title: 技能包四件套
    minutes: 15
    form: 概念
    content_ref: class/bootcamp/day-08/section-02-skill-anatomy/lesson.md
    content: '同学们，这节咱们解剖一只 Skill。一份能被 AI 执行的说明书长什么样？四个部件：输入、步骤、输出、验收。缺一个都转不动——输入没写清楚，AI 不知道吃什么料；验收没写清楚，你不知道货好不好，对吧。

      输入管做这件事吃什么料，要具体到来源和范围。比如周报 Skill：驾驶舱 /api/kpi 和 /api/exceptions，近七天，读者是总监——不能写相关数据，哪相关呢？步骤管怎么做，AI 能一步步执行：拉数据、找变化、找逾期、生成。不能写分析一下，怎么分析嘛，对吧。

      输出管交出什么货：Markdown 四段、三百字以内、数字只用来源里真实存在的。验收管好坏怎么判：四段齐全、每个数字能溯源、建议主语是人且可执行——每条都能判 ✓ 还是 ✗。不能写写得好，谁判、怎么判呢，对吧。

      看这份周报 Skill 完整示例。输入写着两个接口、近七天、读者总监；步骤四条，拉 KPI、找环比变化最大的两个指标、找逾期最久的三张工单、按格式生成；输出 Markdown 四段三百字；验收三条，结构、数字、意图各一。咱们对照这份模板，等会儿就要写自己的，嘛。

      常见缺陷记四个词：相关数据分析一下写个周报写得好——看到这些词，说明书就还没写完。步骤要多细？细到换一个人或 AI 照着做，不会做出第二种理解。写不到这个程度，先拆步骤，对吧。

      眼熟吗？输出加验收，就是你们第五天学的结构化输出加三条军规。第一周的每个概念，在第二周的说明书里都有自己的格子。下一节咱们用三筛法选第一个 Skill——高频、稳定、低险，对吧。'
    practice: '完成标志：

      [ ] 找出 ≥4 处

      [ ] 改写后的每条都过得了「换个人照做不会做出第二种理解」'
    resource_ids:
    - dg-skill-anatomy
    tools:
    - name: 四部件缺陷速查
      note: 相关数据 / 分析一下 / 写个周报 / 写得好
    quiz:
    - - Skill 四部件的正确组合是？
      - - 名字 / 图标 / 颜色 / 版本
        - 输入 / 步骤 / 输出 / 验收
        - 前端 / 后端 / 数据库 / 模型
      - 1
      - 四部件一个不能少；验收必须可判对错。
    - - 「分析一下本周数据」作为步骤，主要缺陷是？
      - - 太短
        - 不可执行——AI 不知道「怎么分析」
        - 应该用英文
      - 1
      - 步骤要细到换一个人/AI 照着做不会做出第二种理解。
    - - 输出 + 验收对应 Week 1 的哪两个概念？
      - - 三态与降级
        - 结构化输出 + Rubric 验收
        - 契约与 DDL
      - 1
      - Week 1 的每个概念在 Skill 说明书里都有自己的格子。
    - - 验收标准「写得好」为什么不合格？
      - - 太主观，第三方无法客观判过/不过
        - 字数太少
        - 必须用 Markdown
      - 0
      - 验收的铁律是可衡量、可判对错——和 PRD 验收标准同一套逻辑。
