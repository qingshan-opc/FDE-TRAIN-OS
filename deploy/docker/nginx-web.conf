server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = /livez {
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /readyz {
    default_type text/plain;
    return 200 'ok\n';
  }

  # Vite build output: /assets/*.js /assets/*.css — hashed filenames, cache aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routes (react-router, client-side routing) — always fall back to index.html.
  location /app/ {
    try_files $uri $uri/ /index.html;
  }

  location /author/ {
    try_files $uri $uri/ /index.html;
  }

  location = /login {
    try_files $uri /index.html;
  }

  # Any other path (including bare "/") is routed here by the ingress catch-all;
  # serve the SPA shell so client-side routing (App.tsx) can redirect appropriately.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
